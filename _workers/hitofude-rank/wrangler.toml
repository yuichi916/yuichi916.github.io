name = "hitofude-rank"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 「npx wrangler d1 create hitofude-rank」が出す database_id を、下の REPLACE_AFTER_D1_CREATE と入れかえる
[[d1_databases]]
binding = "DB"
database_name = "hitofude-rank"
database_id = "REPLACE_AFTER_D1_CREATE"

[vars]
# ランキングを読める・送れるページ（カンマ区切り）。CrazyGames のドメインと localhost は、コードの側で受ける
ALLOWED_ORIGINS = "https://yuichi916.github.io"
# 管理用の合言葉 ADMIN_TOKEN は、ここに書かない（npx wrangler secret put ADMIN_TOKEN）
