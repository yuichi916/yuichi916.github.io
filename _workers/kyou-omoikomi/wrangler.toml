name = "kyou-omoikomi"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 「npx wrangler d1 create kyou-omoikomi」が出す database_id
[[d1_databases]]
binding = "DB"
database_name = "kyou-omoikomi"
database_id = "dc876d39-d322-4905-a840-f5568d128452"

[vars]
# 答えを送れる・集計を読めるページ（カンマ区切り）。localhost と 127.0.0.1 は、コードの側で受ける
ALLOWED_ORIGINS = "https://yuichi916.github.io"
# IP の要約にかける塩 SALT は、ここに書かない（npx wrangler secret put SALT）
