<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クリック・ボクシング | One-Click KO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- キャラ選択画面 -->
    <div id="char-select" class="screen">
      <h1 class="title">CHARACTER SELECT</h1>
      <div class="char-list">
        <button class="char-card" data-char="boxer">
          <img src="../final/opponent_t/idle_01.png" alt="boxer">
          <div class="char-name">ライバル ボクサー</div>
          <div class="char-mode">COMBAT モード</div>
        </button>
        <button class="char-card" data-char="shy_girl">
          <img src="../final/heroine_t/idle_01.png" alt="shy girl"
               onerror="this.style.opacity=0.3; this.alt='(まだ生成中)';">
          <div class="char-name">控えめ少女</div>
          <div class="char-mode">REACT モード</div>
        </button>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen hidden">
      <div id="hud">
        <div class="hp-row" data-mode="combat">
          <div class="hp-label">OPPONENT</div>
          <div class="hp-bar">
            <div id="opp-hp" class="hp-fill" style="width: 100%;"></div>
          </div>
          <div id="opp-hp-text" class="hp-num">100 / 100</div>
        </div>
        <div class="hp-row" data-mode="combat">
          <div class="hp-label">YOU</div>
          <div class="hp-bar">
            <div id="player-hp" class="hp-fill player" style="width: 100%;"></div>
          </div>
          <div id="player-hp-text" class="hp-num">100 / 100</div>
        </div>
        <div id="round-info">
          <span id="round-text">ROUND 1</span>
          <span id="combo-text"></span>
        </div>
      </div>

      <canvas id="stage" width="1080" height="1920"></canvas>

      <div id="controls">
        <button id="btn-back" class="ctrl-btn small">← セレクト</button>
        <button id="btn-jab" class="punch-btn">LEFT JAB<br><small>(画面左タップ)</small></button>
        <button id="btn-cross" class="punch-btn">RIGHT CROSS<br><small>(画面右タップ)</small></button>
        <button id="btn-restart" class="ctrl-btn" style="display:none;">▶ もう一度</button>
      </div>

      <div id="message" class="hidden"></div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
