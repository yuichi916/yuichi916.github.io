<style>
:root{
  --ink:#e9edf2; --dim:#9fb0c2; --faint:#6b7a8c;
  --kai:#9fd0ff; --rin:#e7e2f0; --haha:#f2c98a; --narr:#c8d4e0; --you:#bfe8d0; --sub:#f0d9a6;
  --panel:rgba(10,14,22,.78); --panel2:rgba(14,20,30,.9);
  --line:rgba(159,192,232,.22); --neon:#37e0d0; --neon2:#ff5c7a; --amber:#f4cf7a;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070c;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;cursor:pointer}
button{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
img{-webkit-user-drag:none}

/* ===== 3D 360 background (three.js) ===== */
#bg3d{position:absolute;inset:0;z-index:0;display:block;touch-action:none}
/* ===== background layers (crossfade fallback) ===== */
.bg{position:absolute;inset:0;z-index:1;pointer-events:none;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;transform:scale(1.06);will-change:opacity}
.bg.show{opacity:1}
.bg.ken{animation:kenburns 24s ease-out both}
@keyframes kenburns{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 55%,rgba(0,0,0,.34) 100%);z-index:5}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:6;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

/* ===== sprites ===== */
#sprites{position:absolute;inset:0;z-index:8;pointer-events:none}
.sprite{position:absolute;bottom:-2%;left:50%;height:92%;width:auto;opacity:0;transform-origin:bottom center;
  transform:translateX(-50%) scale(var(--sc,1)) translateY(7%);filter:brightness(.82) saturate(.92);
  transition:opacity .5s ease,filter .7s ease,transform .55s cubic-bezier(.2,.7,.2,1),left .55s cubic-bezier(.2,.7,.2,1),margin-bottom .45s ease;will-change:opacity,transform,filter}
.sprite.on{opacity:1;animation:spbreathe 5.2s ease-in-out infinite}
@keyframes spbreathe{0%,100%{transform:translateX(-50%) scale(var(--sc,1)) translateY(0)}50%{transform:translateX(-50%) scale(var(--sc,1)) translateY(-0.7%)}}
.sprite.speaking{filter:brightness(1.02) saturate(1);z-index:3;margin-bottom:1.7%}
.sprite.dim{filter:brightness(.5) saturate(.76)}
/* 感情マーク(会話ギミック) */
#emark{position:absolute;z-index:11;left:50%;top:14%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  font-size:clamp(30px,4.4vw,54px);filter:drop-shadow(0 2px 7px rgba(0,0,0,.65))}
#emark.show{animation:emarkpop 1s cubic-bezier(.2,1.3,.4,1)}
@keyframes emarkpop{0%{opacity:0;transform:translate(-50%,-20%) scale(.3) rotate(-12deg)}22%{opacity:1;transform:translate(-50%,-64%) scale(1.18) rotate(7deg)}62%{opacity:1;transform:translate(-50%,-66%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-80%) scale(.85)}}
/* 蛍光灯フリッカー(地下の薄暗さ) */
#flick{position:absolute;inset:0;z-index:7;background:#05070c;opacity:0;pointer-events:none}

/* ===== dialogue ===== */
#textwrap{position:absolute;left:0;right:0;bottom:0;z-index:12;padding:0 clamp(12px,4vw,80px) clamp(14px,3.5vh,42px)}
#namebar{display:inline-flex;align-items:center;gap:10px;margin:0 0 -1px 10px;padding:7px 20px 6px;
  background:linear-gradient(180deg,rgba(20,28,40,.94),rgba(12,18,28,.94));border:1px solid var(--line);border-bottom:none;
  border-radius:10px 10px 0 0;font-family:var(--serif);font-size:clamp(15px,2vw,19px);letter-spacing:.06em;min-height:20px}
#namebar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--who,transparent);box-shadow:0 0 10px var(--who,transparent)}
#namebar.empty{opacity:0}
#tbox{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;
  padding:clamp(16px,2.6vh,26px) clamp(20px,3vw,40px);backdrop-filter:blur(7px);box-shadow:0 -4px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  min-height:clamp(96px,15vh,150px);position:relative}
#ttext{font-family:var(--serif);font-size:clamp(16px,2.15vw,21px);line-height:1.95;letter-spacing:.03em;color:var(--tcolor,var(--narr));
  text-shadow:0 1px 8px rgba(0,0,0,.6);min-height:1.9em}
#ttext.narr{font-style:italic;color:var(--narr);opacity:.94}
#ttext .cursor{display:inline-block;width:.5em;color:var(--neon);animation:blink 1s steps(1) infinite;transform:translateY(1px)}
@keyframes blink{50%{opacity:0}}
#adv{position:absolute;right:16px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--faint);opacity:.7;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#adv.hide{opacity:0}
#hint3d{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24vh + 8px);z-index:9;pointer-events:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:rgba(210,230,245,.8);background:rgba(6,12,20,.5);
  border:1px solid var(--line);border-radius:999px;padding:6px 16px;opacity:0;transition:opacity .6s;backdrop-filter:blur(4px);white-space:nowrap}
#hint3d.show{opacity:1}

/* choices */
#choices{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at 50% 45%,rgba(4,8,14,.6),rgba(4,8,14,.86));backdrop-filter:blur(3px)}
#choices.show{display:flex}
/* minigame / 探索 / 断章 */
#mg{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(4,7,12,.72);backdrop-filter:blur(3px)}
#mg.show{display:flex}
.mgpanel{position:relative;margin:auto;max-height:92vh;overflow:auto;width:min(92vw,560px);border:1px solid rgba(120,200,255,.35);border-radius:12px;padding:18px 18px 22px;background:linear-gradient(180deg,rgba(10,18,30,.96),rgba(6,10,18,.97));box-shadow:0 0 60px rgba(60,160,255,.12), inset 0 0 40px rgba(30,80,140,.08)}
.mgttl{font-family:var(--serif);color:#9fd8ff;font-size:15px;letter-spacing:.14em;margin-bottom:4px}
.mgsub{color:#7b8ba0;font-size:12px;margin-bottom:12px;letter-spacing:.06em}
.mgskip{position:absolute;top:10px;right:10px;font-size:11px;color:#9aa7b8;border:1px solid rgba(160,180,200,.35);border-radius:6px;padding:4px 10px;background:rgba(20,28,40,.6);cursor:pointer}
.mgskip:hover{color:#fff;border-color:#fff}
#mgtimer{height:3px;background:rgba(120,200,255,.15);border-radius:2px;overflow:hidden;margin:10px 0 14px}
#mgtimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#37e0d0,#ffd24a)}
.mggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.mgg{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:26px;color:#cfe6ff;border:1px solid rgba(120,180,240,.25);border-radius:10px;background:rgba(16,26,42,.8);cursor:pointer;transition:all .15s;user-select:none}
.mgg.lit{background:rgba(90,190,255,.5);color:#fff;box-shadow:0 0 34px rgba(120,200,255,.9);border-color:#bfe4ff;transform:scale(1.1)}
.mgintro{margin:6px 0 2px}
.mgirule p{margin:5px 0;color:#c6d2e2;font-size:13px;line-height:1.8;letter-spacing:.04em}
.mgibtns{display:flex;gap:10px;margin-top:16px;justify-content:center}
.mgigo{font-size:14px;letter-spacing:.2em;padding:10px 32px;border-radius:8px;border:1px solid rgba(87,200,255,.55);background:linear-gradient(180deg,rgba(60,130,190,.5),rgba(30,70,110,.5));color:#eaf6ff;cursor:pointer}
.mgigo:hover{background:linear-gradient(180deg,rgba(80,160,220,.65),rgba(40,90,140,.65))}
.mgiskip2{font-size:12px;padding:10px 18px;border-radius:8px;border:1px solid rgba(160,180,200,.35);background:rgba(20,28,40,.6);color:#9aa7b8;cursor:pointer}
.mgphase{text-align:center;font-family:var(--serif);font-size:15px;letter-spacing:.32em;margin:4px 0 10px;color:#ffd88f;min-height:22px}
.mgphase.go{color:#57e0c8}
.mgdots{display:flex;gap:7px;justify-content:center;margin-top:12px;min-height:10px}
.mgdots i{width:9px;height:9px;border-radius:50%;background:rgba(150,180,220,.22);border:1px solid rgba(150,180,220,.4)}
.mgdots i.on{background:#57e0c8;border-color:#57e0c8}
.mgg.ok{background:rgba(55,224,150,.3);border-color:#4fe0a0}
.mgg.ng{background:rgba(255,80,80,.3);border-color:#ff6a6a;animation:mgshake .3s}
@keyframes mgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#mgarea{position:relative;height:min(52vw,300px)}
.mgn{position:absolute;width:36px;height:36px;margin:-18px;border-radius:50%;border:1px solid rgba(255,210,90,.5);background:radial-gradient(circle,rgba(255,220,120,.25),rgba(255,220,120,.05));color:#ffd24a;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.mgn.lit{box-shadow:0 0 22px rgba(255,210,90,.8);background:radial-gradient(circle,rgba(255,220,120,.6),rgba(255,220,120,.1));color:#fff}
.mgn.ok{border-color:#4fe0a0;color:#4fe0a0}
.mgn.ng{border-color:#ff6a6a;animation:mgshake .3s}
#mgsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mmap{position:absolute;top:54px;right:10px;z-index:15;width:150px;background:rgba(10,16,26,.9);border:1px solid rgba(150,180,220,.22);border-radius:10px;padding:7px 8px 5px;cursor:pointer;backdrop-filter:blur(2px);transition:opacity .5s;opacity:0;pointer-events:none}
#mmap.show{opacity:1;pointer-events:auto}
#mmap .mmttl{font-size:9px;letter-spacing:.18em;color:#8fa4bd;margin:0 0 3px 2px;display:flex;justify-content:space-between}
#mmap .mmttl b{color:#d9c98f;font-weight:normal}
#mmap svg{display:block;width:100%;height:auto}
.mmedge{stroke:rgba(170,200,235,.5);stroke-width:1.4;stroke-dasharray:2 2}
.mmnode{fill:rgba(150,180,220,.55)}
.mmnode.cur{fill:#ffd24a}
.mmlbl{font-size:7px;fill:#e2eaf4;letter-spacing:.04em;paint-order:stroke;stroke:rgba(5,9,15,.85);stroke-width:1.6px}
.mmlbl.cur{fill:#ffe9a8}
.mmcur{fill:none;stroke:#ffd24a;stroke-width:1;opacity:.9;animation:mmpulse 1.8s ease-out infinite}
@keyframes mmpulse{0%{r:3;opacity:.9}100%{r:9;opacity:0}}
@media (max-aspect-ratio:3/4){ #mmap{width:118px;top:50px;right:6px} }
.mmroom{fill:rgba(130,165,205,.24);stroke:rgba(175,205,235,.8);stroke-width:.8}
.mmroom.cur{stroke:#ffd24a;fill:rgba(255,210,74,.13)}
.mflayer{margin-bottom:6px;border:1px solid rgba(150,180,220,.14);border-radius:8px;padding:6px 10px 4px}
.mflayer.cur{border-color:rgba(255,210,74,.4)}
.mflayer h4{margin:0 0 4px;font-size:11.5px;font-weight:normal;color:#aebccd;font-family:var(--serif);letter-spacing:.14em;display:flex;justify-content:space-between}
.mflayer h4 span{color:#d9c98f;font-size:10px}
.mflayer svg{display:block;width:100%;height:auto}
.mflayer svg .mmlbl{font-size:4.6px}
#mfnotes{margin-top:8px}
#mapfull{position:absolute;inset:0;z-index:31;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(3,5,9,.78)}
#mapfull.show{display:flex}
.mfbox{width:min(94vw,640px);max-height:88vh;overflow:auto;border:1px solid rgba(150,180,220,.3);border-radius:12px;padding:18px 20px;background:rgba(10,15,24,.97)}
.mfbox h3{font-family:var(--serif);color:#d9c98f;letter-spacing:.2em;font-size:15px;margin:0 0 10px}
.mfbox svg{display:block;width:100%;height:auto;margin-bottom:12px}
.mfbox .mmlbl{font-size:4.2px}
.mfrow{padding:7px 2px;border-bottom:1px dashed rgba(150,180,220,.14);font-size:12.5px;color:#c2cedd;line-height:1.8}
.mfrow b{color:#e8d9a8;font-weight:normal;font-family:var(--serif);letter-spacing:.1em}
.mfrow.lock{color:#55606e}
#exhint{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:26;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;padding:9px 16px;border-radius:18px;background:rgba(8,14,24,.86);border:1px solid rgba(255,210,90,.35);color:#ffe8b0;font-size:13px;letter-spacing:.06em;font-family:var(--serif);white-space:normal;text-align:center;width:max-content;max-width:min(92vw,560px)}
#exhint.show{display:flex}
#exhint button{font-size:11px;color:#9aa7b8;border:1px solid rgba(160,180,200,.35);border-radius:6px;padding:3px 9px;background:rgba(20,28,40,.6);cursor:pointer}
#hs{position:absolute;z-index:25;width:84px;height:84px;margin:-42px;display:none;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
#hs.show{display:flex}
#hs .c{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#ffe9a8,#ffb64a);box-shadow:0 0 22px 6px rgba(255,200,90,.55);animation:hspulse 1.6s ease-in-out infinite}
#hs.arrow .c{display:none}
#hs .a{display:none;font-size:26px;color:#ffd24a;text-shadow:0 0 12px rgba(255,200,90,.8)}
#hs.arrow .a{display:block;animation:hspulse 1.2s ease-in-out infinite}
@keyframes hspulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:1}}
#cdark{position:absolute;inset:0;z-index:29;display:none;align-items:center;justify-content:center;background:#000;cursor:pointer}
#cdark.show{display:flex}
#cdark .n{font-family:var(--serif);font-size:clamp(60px,12vw,130px);color:#dfe8f2;opacity:0;letter-spacing:.1em;text-shadow:0 0 40px rgba(160,200,255,.35)}
#cdark .n.on{animation:cdpop 1s ease-out}
@keyframes cdpop{0%{opacity:0;transform:scale(.86)}18%{opacity:1;transform:scale(1)}80%{opacity:.95}100%{opacity:.35}}
#cdark .hintc{position:absolute;bottom:12%;left:0;right:0;text-align:center;color:#5c6a7c;font-size:13px;letter-spacing:.3em;animation:cdhint 2.2s ease-in-out infinite}
@keyframes cdhint{0%,100%{opacity:.25}50%{opacity:.8}}
#lorecard{position:absolute;inset:0;z-index:32;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(3,5,9,.7)}
#lorecard.show{display:flex}
.lorebox{width:min(90vw,520px);max-height:80vh;overflow:auto;border:1px solid rgba(255,210,120,.35);border-radius:10px;padding:26px 26px 20px;background:linear-gradient(180deg,rgba(24,20,12,.97),rgba(12,10,6,.98));box-shadow:0 0 70px rgba(255,190,80,.1)}
.loret{font-family:var(--serif);color:#ffd88f;letter-spacing:.2em;font-size:15px;margin-bottom:4px}
.loreg{color:#8a7a58;font-size:11px;letter-spacing:.14em;margin-bottom:14px}
.lorex{font-family:var(--serif);color:#e7dcc4;font-size:14px;line-height:2;white-space:pre-wrap}
.loreb{margin-top:18px;text-align:right}
.loreb button{font-size:12px;color:#d8c9a5;border:1px solid rgba(255,210,120,.4);border-radius:6px;padding:6px 16px;background:rgba(40,32,18,.6);cursor:pointer}
#loredex{position:absolute;inset:0;z-index:31;display:none;align-items:center;justify-content:center;background:rgba(3,5,9,.7)}
#loredex.show{display:flex}
.dexbox{width:min(92vw,560px);max-height:76vh;overflow:auto;border:1px solid rgba(255,210,120,.3);border-radius:10px;padding:20px 22px;background:rgba(14,12,8,.97)}
.dexrow{padding:10px 4px;border-bottom:1px dashed rgba(255,210,120,.15)}
.dexrow .t{font-family:var(--serif);color:#ffd88f;font-size:14px;letter-spacing:.12em}
.dexrow .x{color:#c9bfa6;font-size:12.5px;line-height:1.9;margin-top:4px;white-space:pre-wrap}
.dexrow.lock .t{color:#5a5346}
.dexrow.lock .x{color:#4a443a}
.choice{font-family:var(--serif);font-size:clamp(15px,2vw,19px);color:var(--ink);background:linear-gradient(180deg,rgba(22,32,46,.9),rgba(14,20,30,.92));
  border:1px solid var(--line);border-left:2px solid var(--neon);padding:15px 34px;border-radius:8px;cursor:pointer;min-width:min(560px,86vw);text-align:center;
  transition:.18s;letter-spacing:.03em}
.choice:hover{background:linear-gradient(180deg,rgba(40,60,84,.95),rgba(24,36,52,.95));border-left-color:var(--neon2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(55,224,208,.15)}

/* ===== scene / chapter card ===== */
#scard{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse at 50% 45%,rgba(6,9,16,.86),rgba(2,3,7,.97));opacity:0;visibility:hidden;transition:opacity 1s;text-align:center;padding:24px}
#scard.show{opacity:1;visibility:visible}
#scard .rule{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:0;transition:opacity 1.2s .2s}
#scard .no{font-family:var(--mono);font-size:clamp(12px,1.8vw,15px);letter-spacing:.5em;color:var(--neon);text-indent:.5em;opacity:0;transform:translateY(8px);transition:all 1.1s .25s}
#scard .ttl{font-family:var(--serif);font-size:clamp(30px,6vw,60px);letter-spacing:.14em;text-indent:.14em;color:#eaf2ff;opacity:0;transform:translateY(10px);transition:all 1.2s .5s;text-shadow:0 0 40px rgba(55,224,208,.25)}
#scard .sb{font-family:var(--serif);font-size:clamp(13px,2vw,17px);color:var(--dim);opacity:0;max-width:min(600px,90vw);line-height:2;transform:translateY(8px);transition:all 1.2s .9s}
#scard.show .rule,#scard.show .no,#scard.show .ttl,#scard.show .sb{opacity:1;transform:none}

/* ===== HUD controls ===== */
#hud{position:absolute;top:0;right:0;z-index:14;display:flex;gap:4px;padding:12px 14px}
.hbtn{font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--dim);background:rgba(10,16,24,.6);border:1px solid var(--line);
  border-radius:7px;padding:7px 12px;cursor:pointer;transition:.15s;backdrop-filter:blur(4px)}
.hbtn:hover{color:var(--ink);border-color:var(--neon);background:rgba(20,32,46,.7)}
.hbtn.act{color:#04121a;background:var(--neon);border-color:var(--neon);font-weight:700}

/* backlog */

.blrow{margin:0 0 14px;font-family:var(--serif);line-height:1.8;font-size:15px}
.blrow .bn{font-size:12px;color:var(--who,var(--faint));letter-spacing:.08em;display:block;margin-bottom:2px}
.blrow .bt{color:var(--ink)}
.blrow.narr .bt{font-style:italic;color:var(--dim)}
#blclose{position:absolute;top:14px;right:18px;z-index:41}

/* settings */
#settings,#chapsel{position:absolute;inset:0;z-index:42;display:none;align-items:center;justify-content:center;background:rgba(3,6,11,.9);backdrop-filter:blur(6px)}
#settings.show,#chapsel.show{display:flex}
#chaplist{display:flex;flex-direction:column;gap:9px;max-height:58vh;overflow-y:auto;margin:6px 0 2px;padding-right:4px}
.chapbtn{display:flex;align-items:center;gap:13px;text-align:left;font-family:var(--serif);font-size:15px;letter-spacing:.05em;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;transition:.2s}
.chapbtn:hover:not(:disabled){border-color:var(--neon);color:#eaf6ff;box-shadow:0 0 20px rgba(55,224,208,.16);background:rgba(55,224,208,.06)}
.chapbtn:disabled{opacity:.4;cursor:not-allowed}
.chapbtn .cno{font-family:var(--mono);font-size:11px;color:var(--neon);flex:0 0 auto;letter-spacing:.1em}
.chapbtn .clk{margin-left:auto;font-size:13px;opacity:.75}
#chapsel{z-index:70}/* タイトル(z60)より前面に */
#savemenu{position:absolute;inset:0;z-index:72;display:none;align-items:center;justify-content:center;background:rgba(3,6,11,.9);backdrop-filter:blur(6px)}
#savemenu.show{display:flex}
.smtabs{display:flex;gap:8px;margin-bottom:16px}
.smtab{flex:1;font-family:var(--serif);font-size:14px;letter-spacing:.1em;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;transition:.2s}
.smtab.act{color:#eaf6ff;border-color:var(--neon);background:rgba(55,224,208,.08)}
#smslots{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding-right:4px}
.slotbtn{display:flex;align-items:center;gap:12px;text-align:left;font-family:var(--serif);font-size:13px;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;transition:.2s}
.slotbtn:hover:not(:disabled){border-color:var(--neon);background:rgba(55,224,208,.06)}
.slotbtn:disabled{opacity:.35;cursor:not-allowed}
.slotbtn .slno{font-family:var(--mono);font-size:10px;color:var(--neon);flex:0 0 48px;letter-spacing:.08em}
.slotbtn .sllabel{flex:1;line-height:1.5}
.slotbtn .slts{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 auto}
.sharerow{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;z-index:2}
.sharebtn{font-family:var(--serif);font-size:13px;letter-spacing:.08em;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;transition:.2s}
.sharebtn:hover{border-color:var(--neon);color:#eaf6ff;box-shadow:0 0 18px rgba(55,224,208,.18);background:rgba(55,224,208,.06)}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:90;background:rgba(10,16,24,.96);border:1px solid var(--neon);color:#eaf6ff;font-size:13px;letter-spacing:.05em;padding:9px 20px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.setpanel{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:26px 30px;width:min(440px,92vw);font-size:14px}
.setpanel h3{font-family:var(--serif);color:var(--sub);letter-spacing:.1em;margin-bottom:18px;font-size:18px}
.setrow{display:flex;align-items:center;gap:14px;margin:14px 0}
.setrow label{flex:0 0 120px;color:var(--dim)}
.setrow input[type=range]{flex:1;accent-color:var(--neon)}
.setrow .val{flex:0 0 44px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--faint)}
.setrow.seg{gap:8px}
.segbtn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;font-size:13px}
.segbtn.on{background:var(--neon);color:#04121a;border-color:var(--neon);font-weight:700}

/* ===== title screen ===== */
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#0b1420,#05070c 70%);text-align:center;padding:24px;transition:opacity 1s}
#title.gone{opacity:0;visibility:hidden;pointer-events:none}
#title .tembers{position:absolute;inset:0;pointer-events:none;opacity:.5;background:
  radial-gradient(2px 2px at 20% 40%,rgba(55,224,208,.5),transparent),
  radial-gradient(1.5px 1.5px at 75% 25%,rgba(255,92,122,.4),transparent),
  radial-gradient(1.5px 1.5px at 55% 70%,rgba(159,208,255,.4),transparent),

#title .eye{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:var(--neon);text-indent:.4em;margin-bottom:18px;z-index:2}
#title h1{font-family:var(--serif);font-size:clamp(34px,7vw,74px);letter-spacing:.1em;color:#eaf2ff;line-height:1.15;z-index:2;text-shadow:0 0 50px rgba(55,224,208,.3)}
#title .sub{font-family:var(--serif);font-size:clamp(13px,2.2vw,18px);color:var(--dim);margin-top:16px;letter-spacing:.14em;z-index:2;max-width:min(680px,92vw)}
#title .menu{display:flex;flex-direction:column;gap:12px;margin-top:44px;z-index:2}
#title .menu button{font-family:var(--serif);font-size:clamp(15px,2vw,18px);letter-spacing:.14em;color:var(--ink);
  background:transparent;border:1px solid var(--line);border-radius:99px;padding:12px 40px;cursor:pointer;transition:.2s;min-width:240px}
#title .menu button:hover{border-color:var(--neon);color:#eaf6ff;box-shadow:0 0 24px rgba(55,224,208,.2);background:rgba(55,224,208,.06)}
#title .menu button:disabled{opacity:.35;cursor:not-allowed}
#title .cred{position:absolute;bottom:18px;font-size:11px;color:var(--faint);z-index:2;letter-spacing:.06em;line-height:1.7;padding:0 16px}

/* fx overlays */
#flash{position:absolute;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;z-index:48;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
#fade.black{opacity:1}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-1px,0)}20%,80%{transform:translate(3px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-1px)}}
#stage.sepia .bg,#stage.sepia #bg3d{filter:sepia(.55) contrast(1.05) brightness(.85) saturate(.7)}
#pline{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .5s;
  background:linear-gradient(115deg,transparent 44%,rgba(244,207,122,.5) 49%,rgba(255,240,190,.9) 50%,rgba(244,207,122,.5) 51%,transparent 56%);
  mix-blend-mode:screen;filter:blur(.3px)}
#pline.show{opacity:.85;animation:plmove 1.4s ease-out}
@keyframes plmove{from{background-position:-30% 0}to{background-position:30% 0}}
@media (prefers-reduced-motion: reduce){.bg,.sprite,#scard,.bg.ken{transition-duration:.2s;animation:none!important}}
/* ===== モバイル(縦画面) ===== */
@media (max-aspect-ratio: 3/4){
  .sprite{height:60%;bottom:21%}
  #textwrap{padding:0 9px calc(10px + env(safe-area-inset-bottom))}

  #title .menu button{padding:13px 40px;font-size:16px}
  .sharerow{margin-top:16px}
  .setpanel{width:94vw;padding:20px 18px}
  #scNo{font-size:12px}
  #hint3d{font-size:11px;bottom:calc(24vh + 8px)}
}
/* タッチ端末: HUDを押しやすく */
@media (hover:none){ .hbtn{padding:10px 11px} #title .menu button{padding:14px 44px} }
.hide{display:none!important}
</style>
</head>

<script>
"use strict";
/* ============ 正解の外側 ― Sound Novel Engine ============ */
const A='assets/seikai/';
/* 登場人物: 立ち絵ベース名と名前・色 */
const CHARS={
  kai:{name:'カイ', color:'var(--kai)', file:'cg-kai', expr:['surprised','pained','soft','smile','tears','angry']},
  rin:{name:'リーン', color:'var(--rin)', file:'cg-rin', expr:['flat','unease','sharp','soft','smile','tears','blush']},
  haha:{name:'母', color:'var(--haha)', file:'cg-haha', expr:[]},
  imouto:{name:'ノノ', color:'#f4b8a2', file:'cg-imouto', expr:[]},
  potz:{name:'ポッツ', color:'#c9b48a', file:'cg-potz', expr:[]},
  della:{name:'デッラ', color:'#e08a6a', file:'cg-della', expr:[]},
  jin:{name:'ジン', color:'#a8c0b0', file:'cg-jin', expr:[]},
  garudo:{name:'ガルド', color:'#b7a58c', file:'cg-garudo', expr:[]},
  feruzu:{name:'フェルツ', color:'#d98a6a', file:null, expr:[]},
  yuugo:{name:'ユーゴ', color:'#c08ac2', file:'cg-yuugo', expr:[]},
  nogu:{name:'ノーグ', color:'#d9b44a', file:'cg-nogu', expr:[]},
  miira:{name:'ミーラ', color:'#e58ab0', file:'cg-miira', expr:[]},
  kanrisha:{name:'管理者', color:'#46d6cf', file:'cg-kanrisha', expr:[]},
  narr:{name:'', color:'transparent', file:null, expr:[]},
  you:{name:'', color:'var(--you)', file:null, expr:[]},
};
/* 背景: CSS グラデ（実画像 assets/seikai/bg-*.jpg があれば差し替え） */
const BGS={
  void:  {grad:'radial-gradient(ellipse at 50% 42%,#16323e 0%,#0b1826 46%,#060b12 82%)'},
  collapse:{grad:'radial-gradient(circle at 55% 34%,rgba(255,150,70,.5) 0%,transparent 44%),radial-gradient(circle at 20% 70%,rgba(120,60,40,.35),transparent 45%),linear-gradient(180deg,#3a1c10,#170b06 82%)'},
  hideout:{grad:'radial-gradient(circle at 26% 50%,rgba(110,165,195,.42) 0%,transparent 46%),radial-gradient(circle at 82% 84%,rgba(255,175,85,.2),transparent 40%),linear-gradient(180deg,#1d2b38,#0d151e 80%)'},
  hall:   {grad:'radial-gradient(ellipse at 50% 10%,rgba(185,210,240,.38) 0%,transparent 52%),radial-gradient(circle at 50% 92%,rgba(90,70,50,.22),transparent 55%),linear-gradient(180deg,#222e3c,#0f1620 82%)'},
  waste:  {grad:'radial-gradient(circle at 43% 46%,rgba(125,215,145,.38) 0%,transparent 48%),radial-gradient(circle at 72% 76%,rgba(185,225,120,.16),transparent 42%),linear-gradient(180deg,#1b2c1f,#0c1610 82%)'},
  ration: {grad:'radial-gradient(ellipse at 50% 14%,rgba(175,195,225,.3) 0%,transparent 55%),linear-gradient(180deg,#212632,#11141d 84%)'},
  slum:   {grad:'radial-gradient(circle at 74% 32%,rgba(55,224,208,.46) 0%,transparent 40%),radial-gradient(circle at 18% 60%,rgba(255,92,122,.38),transparent 42%),radial-gradient(circle at 48% 90%,rgba(255,190,100,.22),transparent 40%),linear-gradient(180deg,#1d3a58 0%,#0d1c30 55%,#07101c 88%)'},
  dream:  {grad:'radial-gradient(circle at 50% 44%,rgba(155,215,255,.38) 0%,transparent 46%),radial-gradient(ellipse at 50% 46%,#1d3d5e,#09121e 82%)'},
  duct:   {grad:'radial-gradient(circle at 50% 30%,rgba(120,160,190,.28) 0%,transparent 45%),linear-gradient(180deg,#182430,#080e15 85%)'},
  surface:{grad:'radial-gradient(ellipse at 50% 70%,rgba(255,206,140,.55) 0%,transparent 46%),radial-gradient(ellipse at 50% 18%,rgba(120,180,235,.55),transparent 60%),linear-gradient(180deg,#7fb2e0 0%,#cfe3f0 40%,#f6d9a8 72%,#e8b57e 100%)'},
  town:   {grad:'radial-gradient(ellipse at 50% 22%,rgba(200,220,240,.5) 0%,transparent 55%),radial-gradient(circle at 30% 80%,rgba(210,180,140,.28),transparent 45%),linear-gradient(180deg,#9fc0da 0%,#c8d6dd 46%,#b9a98e 100%)'},
  home:   {grad:'radial-gradient(circle at 62% 40%,rgba(255,196,120,.5) 0%,transparent 46%),radial-gradient(circle at 20% 82%,rgba(150,90,60,.3),transparent 44%),linear-gradient(180deg,#3a2c20,#1c1410 84%)'},
  lab:    {grad:'radial-gradient(ellipse at 50% 12%,rgba(150,225,235,.42) 0%,transparent 52%),radial-gradient(circle at 50% 88%,rgba(90,120,150,.25),transparent 55%),linear-gradient(180deg,#26424e,#0c1a20 84%)'},
  ruins:  {grad:'radial-gradient(circle at 60% 26%,rgba(150,180,225,.4) 0%,transparent 46%),radial-gradient(circle at 25% 78%,rgba(60,80,110,.3),transparent 45%),linear-gradient(180deg,#1c2740,#080d16 84%)'},
  field:  {grad:'radial-gradient(ellipse at 50% 20%,rgba(160,205,240,.5) 0%,transparent 55%),radial-gradient(ellipse at 50% 92%,rgba(120,175,110,.4),transparent 55%),linear-gradient(180deg,#8fbfe4 0%,#bcd8de 45%,#7fa267 100%)'},
  aicore: {grad:'radial-gradient(circle at 50% 44%,rgba(70,214,207,.5) 0%,transparent 42%),radial-gradient(circle at 20% 80%,rgba(120,90,200,.3),transparent 45%),linear-gradient(180deg,#0e2230,#050a12 86%)'},
};
/* BGM ファイル */
const BGM={ima:'seikai-ima',anohi:'seikai-anohi',hibi:'seikai-hibi',bikou:'seikai-bikou',rekishi:'seikai-rekishi',
  timelimit:'seikai-timelimit',yami:'seikai-yami',yuki:'seikai-yuki',haikyo:'seikai-haikyo',ed:'seikai-ed'};

/* SCRIPT は seikai-ep1.js で window.SEIKAI_SCRIPT に定義（分割ロード） */
const SCRIPT = window.SEIKAI_SCRIPT || { ep1:{ title:'第一話', scenes:[] } };
const EPS=['ep1','ep2','ep3','ep4','ep5','ep6','ep7','ep8','ep9','ep10','ep11','ep12','ep13','ep14','ep15'];

/* ---------- 状態 ---------- */
const el=id=>document.getElementById(id);
let st={ ep:0, scene:0, beat:0, seen:{}, cleared:false, choices:{}, maxEp:0 };
const LS='seikai_save';
const cfg={ speed:60, auto:50, bgm:70, se:80, amb:55, voice:88, mgskip:0, fixview:0 };
const CLS='seikai_cfg';
function loadCfg(){ try{ const c=JSON.parse(localStorage.getItem(CLS)||'null'); if(c) Object.assign(cfg,c);}catch(e){} }
function saveCfg(){ try{ localStorage.setItem(CLS, JSON.stringify(cfg)); }catch(e){} }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(st)); }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)||'null'); if(s&&s.ep!=null){ st=Object.assign(st,s); return true; } }catch(e){} return false; }

/* ---------- 背景 ---------- */
let bgCur=0;
function setBGcss(key){
  const b=BGS[key]||BGS.void; const next=bgCur?el('bg0'):el('bg1'); const cur=bgCur?el('bg1'):el('bg0');

/* ---------- 立ち絵 ---------- */
const shown={}; // who -> {el,lane,seq,expr}
let _seq=0;
function spriteURL(who,expr){ const c=CHARS[who]; if(!c||!c.file) return null;
  if(expr && c.expr.indexOf(expr)>=0) return A+c.file+'-'+expr+'.png'; return A+c.file+'.png'; }
function laneFor(who,pos){ if(pos==='left') return 0; if(pos==='right') return 100; if(pos==='center') return 50;
  return who==='kai'?0 : who==='rin'?100 : 50; }
/* 表示中の立ち絵を人数に応じて等間隔に自動整列(重なり防止)＋人数が増えるほど縮小 */
function layoutSprites(){
  const ks=Object.keys(shown); const n=ks.length; if(!n) return;
  ks.sort((a,b)=> (shown[a].lane-shown[b].lane) || (shown[a].seq-shown[b].seq));
  const sc = n>=4?0.6 : n===3?0.74 : n===2?0.9 : 1;
  for(let i=0;i<n;i++){ const x = n===1?50 : Math.round(16 + 68*i/(n-1));
    const s=shown[ks[i]]; s.x=x; s.el.style.left=x+'%'; s.el.style.setProperty('--sc',sc); }
}
function showSprite(who,pos,expr){
  const c=CHARS[who]; if(!c||!c.file) return;
  let s=shown[who];
  if(!s){ const img=document.createElement('img'); img.className='sprite'; img.alt=c.name;
    img.onerror=()=>{img.style.display='none';}; el('sprites').appendChild(img);
    s={el:img,lane:laneFor(who,pos),seq:_seq++,expr:null}; shown[who]=s;
    img.style.animationDelay=(-((s.seq*1.7)%5.2)).toFixed(2)+'s'; }
  else if(pos){ s.lane=laneFor(who,pos); }
  const url=spriteURL(who,expr); if(url && s.el.getAttribute('src')!==url) s.el.setAttribute('src',url); s.expr=expr||null;
  layoutSprites();

}
function hideSprite(who){ const s=shown[who]; if(s){ s.el.classList.remove('on'); const e=s.el; setTimeout(()=>{ e&&e.parentNode&&e.parentNode.removeChild(e); },500); delete shown[who]; layoutSprites(); } }
function clearSprites(){ Object.keys(shown).forEach(hideSprite); }
function setExpr(who,expr){ const s=shown[who]; if(!s) return; const url=spriteURL(who,expr); if(url&&s.el.getAttribute('src')!==url) s.el.setAttribute('src',url); s.expr=expr; }
function speaking(who){ if(!who||who==='narr'||who==='you') return; /* 地の文/心の声では立ち絵の明暗を変えない(明滅防止) */
  Object.keys(shown).forEach(k=>{ shown[k].el.classList.toggle('speaking',k===who); shown[k].el.classList.toggle('dim',k!==who); }); }
/* 発話者に立ち絵があれば必ず表示(表示漏れ防止)。整列はlayoutSpritesが担当 */
function ensureShown(who,ex){ const c=CHARS[who]; if(!c||!c.file) return;
  if(shown[who]){ if(ex!==undefined) setExpr(who,ex); return; }
  showSprite(who, null, ex); }
/* ---------- 会話ギミック: 感情マーク ---------- */
function emojiFor(who,text,ex){

  if(ex==='angry' || /怒|むかつ|うるさ|黙れ|ふざ|許さ|くそ/.test(text)) return '💢';
  if(ex==='unease' || /ごめん|えっと|あれ|困|焦|やば|しまっ|どうし|まさか/.test(text)) return '💦';
  if(ex==='smile' || /笑|嬉し|ありがと|やった|よかっ|えへ|好き/.test(text)) return '♪';
  if(ex==='tears' || /涙|泣|さよなら/.test(text)) return '💧';

}

/* ---------- 地下の蛍光灯フリッカー ---------- */
let _under=false, bgKeyCur=null;

/* ---------- 音 ---------- */
let bgmCur='A', bgmKey=null;
function playBGM(key){ if(key===bgmKey) return; bgmKey=key; const file=BGM[key]; if(!file) return;
  const nEl=el('bgm'+(bgmCur==='A'?'B':'A')), cEl=el('bgm'+bgmCur);
  nEl.src=A+'bgm/'+file+'.mp3'; nEl.volume=0; nEl.play().catch(()=>{});
  const tgt=cfg.bgm/100*0.85; let k=0; const iv=setInterval(()=>{ k++; nEl.volume=Math.min(tgt,tgt*k/14); cEl.volume=Math.max(0,(cEl.volume||0)*(1-k/14)); if(k>=14){ clearInterval(iv); cEl.pause(); } },70);
  bgmCur=bgmCur==='A'?'B':'A';
}
function stopBGM(){ ['bgmA','bgmB'].forEach(id=>{const a=el(id);a.pause();}); bgmKey=null; }
/* 環境音 (procedural WebAudio: 低いハム＋ぱたぱた滴) */
let actx,ambNodes=null;
function ensureCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function ambient(on){ const ctx=ensureCtx(); if(!ctx) return;
  if(on && !ambNodes){ const g=ctx.createGain(); g.gain.value=cfg.amb/100*0.16; g.connect(ctx.destination);
    const o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=42; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=120; const g1=ctx.createGain(); g1.gain.value=0.5; o1.connect(f); f.connect(g1); g1.connect(g); o1.start();
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=63; const g2=ctx.createGain(); g2.gain.value=0.25; o2.connect(g2); g2.connect(g); o2.start();
    ambNodes={g,o1,o2}; }
  else if(!on && ambNodes){ try{ambNodes.o1.stop();ambNodes.o2.stop();}catch(e){} ambNodes=null; }
  else if(ambNodes){ ambNodes.g.gain.value=cfg.amb/100*0.16; }
}
function se(kind){ const ctx=ensureCtx(); if(!ctx) return; const t=ctx.currentTime; const vol=cfg.se/100;
  if(kind==='rubble'){ const b=ctx.createBufferSource(); const buf=ctx.createBuffer(1,ctx.sampleRate*0.6,ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); b.buffer=buf; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400; const g=ctx.createGain(); g.gain.value=0.9*vol; b.connect(f); f.connect(g); g.connect(ctx.destination); b.start(); }
  else if(kind==='hit'){ const o=ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(60,t+0.12); const g=ctx.createGain(); g.gain.setValueAtTime(0.4*vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+0.18); }
  else if(kind==='power'){ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(1700,t+0.25); const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12*vol,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+0.42); }
  else if(kind==='heart'){ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=55; const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3*vol,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+0.5); }
}

/* ---------- fx ---------- */
function fx(kind){
  if(kind==='shake'){ el('stage').classList.remove('shake'); void el('stage').offsetWidth; el('stage').classList.add('shake'); se('rubble'); }
  else if(kind==='flash'){ const f=el('flash'); f.style.transition='none'; f.style.opacity='.85'; requestAnimationFrame(()=>{ f.style.transition='opacity .5s'; f.style.opacity='0'; }); }
  else if(kind==='pline'){ const p=el('pline'); p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); se('power'); setTimeout(()=>p.classList.remove('show'),1400); }
  else if(kind==='sepia_on'){ el('stage').classList.add('sepia'); }
  else if(kind==='sepia_off'){ el('stage').classList.remove('sepia'); }
  else if(kind==='heart'){ se('heart'); }
  else if(kind==='hit'){ se('hit'); el('stage').classList.add('shake'); setTimeout(()=>el('stage').classList.remove('shake'),500); }
}

/* ---------- タイプライタ ---------- */
let typing=false, typeTimer=null, fullText='', shownLen=0, ttEl, curColor='var(--narr)';
function typeStart(text,color,narr){
  fullText=text; shownLen=0; typing=true; ttEl=el('ttext'); curColor=color;
  ttEl.className=narr?'narr':''; ttEl.style.setProperty('--tcolor',color);
  const speed=Math.max(4, 46-cfg.speed*0.42); // ms/char
  clearInterval(typeTimer);
  typeTimer=setInterval(()=>{
    shownLen++; render();
    if(shownLen>=fullText.length){ clearInterval(typeTimer); typing=false; render(); onLineDone(); }
  }, speed);
  render();
  function render(){ ttEl.innerHTML= esc(fullText.slice(0,shownLen)) + (typing?'<span class="cursor">▍</span>':''); }
}
function typeFinish(){ if(!typing) return; clearInterval(typeTimer); shownLen=fullText.length; typing=false; el('ttext').innerHTML=esc(fullText); onLineDone(); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- 進行 ---------- */
let cur=null;         // {beats,i}
let stack=[];         // choice reply 合流
let locked=false;     // カード/fx 中
let autoOn=false, skipOn=false, autoTimer=null;
function curScenes(){ return (SCRIPT[EPS[st.ep]]||{scenes:[]}).scenes; }
function curScene(){ return curScenes()[st.scene]; }

function beatVisible(b){ if(!b) return false; return true; }
function step(){
  if(!cur) return;
  while(true){
    if(cur.i>=cur.beats.length){
      if(stack.length){ cur=stack.pop(); continue; }
      return nextScene();
    }
    const b=cur.beats[cur.i++];
    if(!stack.length){ st.beat=cur.i; save(); }
    if(b.bg){ setBG(b.bg); continue; }
    if(b.bgm){ playBGM(b.bgm); continue; }
    if(b.amb!=null){ ambient(!!b.amb); continue; }
    if(b.se){ se(b.se); continue; }
    if(b.fx){ locked=true; runFx(b.fx); return; }
    if(b.show){ showSprite(b.show, b.pos, b.expr); continue; }
    if(b.hide){ if(b.hide==='all') clearSprites(); else hideSprite(b.hide); continue; }
    if(b.expr){ setExpr(b.who||b.expr.who, b.expr); continue; }
    if(b.wait){ locked=true; setTimeout(()=>{ locked=false; step(); }, b.wait); return; }
    if(b.choose){ renderChoices(b.choose); return; }
    if(b.game){ renderGame(b.game); return; }
    if(b.explore){ renderExplore(b.explore); return; }
    if(b.map){ unlockMap(b.map); continue; }
    if(b.countdark){ renderCountdark(b.countdark); return; }
    if(b.when){ if(st.choices && st.choices[b.when]){ stack.push(cur); cur={beats:b.reply||[], i:0}; } continue; }
    if(b.card){ locked=true; showCard(b.card); return; }
    if(b.end){ if(stack.length){cur=stack.pop();continue;} return nextScene(); }
    if(b.say!=null){ renderSay(b); return; }
  }
}
function renderSay(b){
  const c=CHARS[b.say]||CHARS.narr; const isNarr=(b.say==='narr');
  el('namebar').className = c.name? '' : 'empty';
  el('nm').textContent=c.name||''; el('namebar').style.setProperty('--who', c.color);
  if(b.say!=='narr' && b.say!=='you'){ ensureShown(b.say, b.ex); }
  speaking(b.say);
  const color = isNarr?'var(--narr)': (c.color.indexOf('var')===0? getComputedStyle(document.documentElement).getPropertyValue(c.color.slice(4,-1)).trim()||'#e9edf2' : c.color);
  markSeen(b.text);
  el('adv').classList.remove('hide');
  if(skipOn && wasSeen(b.text)){ el('ttext').innerHTML=esc(b.text); el('ttext').className=isNarr?'narr':''; el('ttext').style.setProperty('--tcolor',color); pushLog(b.say,c.name,b.text); onLineDone(); return; }
  pushLog(b.say,c.name,b.text);
  if(b.say==='kai'||b.say==='rin'){ playVoice(b.say,b.text); showMark(b.say,b.text,b.ex); } else stopVoice();
  typeStart(b.text, color, isNarr);
}
function onLineDone(){
  if(autoOn && !locked){ const wait= 700 + fullText.length*(60 - cfg.auto*0.5)*0.5 + (30-cfg.auto*0.28)*fullText.length; clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(autoOn) advance(); }, Math.max(600, 900+fullText.length*(38-cfg.auto*0.3))); }
  else if(skipOn){ clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(skipOn) advance(); }, 40); }
}
function advance(){
  if(locked) return;
  if(el('choices').classList.contains('show')) return;
  if(el('mg').classList.contains('show') || _exOpen || el('lorecard').classList.contains('show') || el('cdark').classList.contains('show')) return;
  if(typing){ typeFinish(); return; }
  step();
}
function nextScene(){
  const scs=curScenes();
  if(st.scene < scs.length-1){ st.scene++; st.beat=0; save(); enterScene(); }
  else { // episode end
    st.cleared=true; save(); endEpisode();
  }
}
function enterScene(){
  const sc=curScene(); if(!sc){ endEpisode(); return; }
  clearSprites(); speaking(null);
  /* 場面転換: 前の文/名前/タイピング/ボイスを消して新しい文から始める */
  typing=false; clearInterval(typeTimer); el('ttext').innerHTML=''; el('ttext').className=''; el('namebar').className='empty'; el('adv').classList.add('hide'); stopVoice();
  if(sc.bg) setBG(sc.bg); if(sc.bgm) playBGM(sc.bgm); if(sc.amb!=null) ambient(!!sc.amb);
  cur={beats:sc.beats, i:st.beat||0}; stack=[]; locked=false;
  if((st.beat||0)===0 && sc.card){ locked=true; showCard(sc.card); }

}
function runFx(kind){ if(kind==='lookup'&&window.BG3D&&window.BG3D.lookUp) window.BG3D.lookUp(); fx(kind); const dur=(kind==='shake'||kind==='hit')?600:(kind==='pline'?1500:(kind==='lookup'?2600:400)); setTimeout(()=>{ locked=false; step(); }, dur); }

/* ---------- カード ---------- */

/* ---------- 選択肢 ---------- */

function startEpisode(idx){
  st={ ep:idx, scene:0, beat:0, seen:st.seen||{}, cleared:st.cleared||false, choices:{}, maxEp:st.maxEp||0, lore:st.lore||{}, map:st.map||{} };
  el('chapsel').classList.remove('show'); el('title').classList.add('gone');
  ensureCtx(); if(actx&&actx.state==='suspended') actx.resume(); enterScene();
}
function endEpisode(){
  stopBGM(); ambient(false); clearSprites();
  const isLast = st.ep >= EPS.length-1;
  st.cleared=true; if(!isLast) st.maxEp=Math.max(st.maxEp||0, st.ep+1); save();
  playBGM('ed');
  el('namebar').className='empty'; el('adv').classList.add('hide');
  const c=el('scard'); c._done=true; clearTimeout(c._t);
  el('scNo').textContent='第'+numJP(st.ep+1)+'話 ／ 完';
  el('scTtl').textContent= isLast? '第一部 完' : 'つづく';
  el('scSub').textContent= isLast? '——正解が視える少年と、正解の外側にいる少女の物語は、いつか続く。'
    : '次の話へ —— '+((SCRIPT[EPS[st.ep+1]]||{}).title||'').replace(/^第[^\s]+話\s*/,'');
  c.classList.add('show'); locked=true;
  c._t=setTimeout(()=>{
    c.classList.remove('show');
    if(isLast){ el('tCont').disabled=false; el('tScene').disabled=false; el('title').classList.remove('gone'); }
    else { st.ep++; st.scene=0; st.beat=0; save(); enterScene(); }
  }, 6400);
}

/* ---------- 入力 ---------- */
el('stage').addEventListener('click',e=>{ if(e.target.closest('#hud')||e.target.closest('#choices')||e.target.closest('#backlog')||e.target.closest('#settings')||e.target.closest('#chapsel')||e.target.closest('#savemenu')||e.target.closest('#title')) return;
  if(window.BG3D && window.BG3D._moved){ window.BG3D._moved=false; return; } /* 見回しドラッグは送らない */
  if(el('scard').classList.contains('show')){ const c=el('scard'); if(c._fin&&!c._done) c._fin(); return; }
  if(skipOn){ toggleSkip(false); return; } /* スキップ中のクリックは停止のみ */
  advance(); });
document.addEventListener('keydown',e=>{ if(el('title').classList.contains('gone')===false) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(el('scard').classList.contains('show')){ const c=el('scard'); if(c._fin&&!c._done) c._fin(); return; } advance(); }
  if(e.key==='Control') skipHold(true);
});
document.addEventListener('keyup',e=>{ if(e.key==='Control') skipHold(false); });
function skipHold(on){ if(on!==skipOn){ toggleSkip(on); } }

el('btnAuto').addEventListener('click',()=>{ autoOn=!autoOn; el('btnAuto').classList.toggle('act',autoOn); if(autoOn){ skipOn=false; el('btnSkip').classList.remove('act'); if(!typing) onLineDone(); } else clearTimeout(autoTimer); });
function toggleSkip(v){ skipOn=(v!=null)?v:!skipOn; el('btnSkip').classList.toggle('act',skipOn); if(skipOn){ autoOn=false; el('btnAuto').classList.remove('act'); if(!typing&&!locked) advance(); else if(typing) typeFinish(); } else clearTimeout(autoTimer); }
el('btnSkip').addEventListener('click',()=>toggleSkip());
el('btnLog').addEventListener('click',openLog);
el('btnLore').addEventListener('click',ev=>{ ev.stopPropagation(); openLoredex(); });
el('mmap').addEventListener('click',ev=>{ ev.stopPropagation(); openMapfull(); });
el('blclose').addEventListener('click',()=>el('backlog').classList.remove('show'));
el('btnSave').addEventListener('click',()=>{ save(); openSaveMenu('save'); });
el('btnSet').addEventListener('click',()=>el('settings').classList.add('show'));
el('setClose').addEventListener('click',()=>{ el('settings').classList.remove('show'); saveCfg(); });
el('btnTitle').addEventListener('click',()=>{ save(); el('title').classList.remove('gone'); el('tCont').disabled=false; el('tScene').disabled=(!(st.cleared||(st.maxEp||0)>0)); paintTitle(); });
function paintTitle(){
  const sub=el('tSub'); if(!sub) return;
  const mx=st.maxEp||0;
  if(st.cleared && mx>=14){ sub.innerHTML='——読んでるよ、カイ。<br><span style="opacity:.7">（——見つけた）</span>'; }
  else if(mx>=5){ sub.innerHTML='空があった。広かった。果てが、なかった。<br><span style="opacity:.75">第二部 沈黙の地平線 へ</span>'; }
  else { sub.innerHTML='すべての正解が視える俺が、<br>答えのない少女と世界を変えるまで'; }
}

/* 設定スライダ */
function bindSet(id,key,fmt){ const s=el(id); s.value=cfg[key]; el('v'+id.slice(3)).textContent=(fmt?fmt(cfg[key]):cfg[key]); s.addEventListener('input',()=>{ cfg[key]=+s.value; el('v'+id.slice(3)).textContent=(fmt?fmt(cfg[key]):cfg[key]); if(key==='bgm'){ const a=el('bgm'+bgmCur); a.volume=cfg.bgm/100*0.85; } if(key==='amb') ambient(!!ambNodes); saveCfg(); }); }
bindSet('setSpeed','speed'); bindSet('setAuto','auto'); bindSet('setBgm','bgm'); bindSet('setSe','se'); bindSet('setAmb','amb'); bindSet('setVoice','voice');
function bindTgl(id,key,onTxt,offTxt,onChange){ const b=el(id); const paint=()=>{ b.textContent=cfg[key]?onTxt:offTxt; }; paint();
  b.addEventListener('click',ev=>{ ev.stopPropagation(); cfg[key]=cfg[key]?0:1; paint(); saveCfg(); onChange&&onChange(); }); }
bindTgl('setMg','mgskip','自動スキップ中','遊ぶ');
bindTgl('setDrift','fixview','固定中','ゆっくり動く',()=>{ window.SEIKAI_FIXVIEW=!!cfg.fixview; });
window.SEIKAI_FIXVIEW=!!cfg.fixview;

el('tScene').addEventListener('click',openChap);
el('chapClose').addEventListener('click',()=>el('chapsel').classList.remove('show'));
function openChap(){
  const list=el('chaplist'); list.innerHTML='';
  EPS.forEach((k,i)=>{
    const ep=SCRIPT[k]||{title:'第'+numJP(i+1)+'話'};
    const unlocked = i<=(st.maxEp||0);
    const ttl=(ep.title||'').replace(/^第[^\s]+話\s*/,'');
    const b=document.createElement('button'); b.className='chapbtn'; b.disabled=!unlocked;
    b.innerHTML='<span class="cno">CH.'+String(i+1).padStart(2,'0')+'</span><span>'+(unlocked?esc(ttl):'？？？')+'</span>'+(unlocked?'':'<span class="clk">🔒</span>');
    if(unlocked) b.addEventListener('click',()=>startEpisode(i));
    list.appendChild(b);
  });
  el('chapsel').classList.add('show');
}

/* ---------- 複数セーブスロット ---------- */
const SLOTS=6;
function slotKey(i){ return 'seikai_slot_'+i; }
function readSlot(i){ try{ return JSON.parse(localStorage.getItem(slotKey(i))||'null'); }catch(e){ return null; } }
function fmtTs(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
let smMode='save';
function openSaveMenu(mode){ smMode=mode; el('smTabSave').classList.toggle('act',mode==='save'); el('smTabLoad').classList.toggle('act',mode==='load');
  const box=el('smslots'); box.innerHTML='';
  for(let i=1;i<=SLOTS;i++){ const d=readSlot(i);
    const btn=document.createElement('button'); btn.className='slotbtn';
    const label=d? ('第'+numJP(d.meta.ep+1)+'話 '+((d.meta.ttl||'').replace(/^第[^\s]+話\s*/,''))+' ／ 場面'+(d.meta.scene+1)) : '― 空きスロット ―';
    btn.innerHTML='<span class="slno">SLOT '+i+'</span><span class="sllabel">'+esc(label)+'</span><span class="slts">'+(d?fmtTs(d.meta.ts):'')+'</span>';
    if(mode==='load' && !d) btn.disabled=true;
    btn.addEventListener('click',()=>{
      if(mode==='save'){ const meta={ep:st.ep,scene:st.scene,ttl:(SCRIPT[EPS[st.ep]]||{}).title||'',ts:Date.now()};
        try{ localStorage.setItem(slotKey(i), JSON.stringify({st:JSON.parse(JSON.stringify(st)),meta})); }catch(e){}
        toast('SLOT '+i+' にセーブしました'); openSaveMenu('save'); }
      else if(d){ st=Object.assign({ep:0,scene:0,beat:0,seen:{},cleared:false,choices:{},maxEp:0}, d.st);
        save(); el('savemenu').classList.remove('show'); el('title').classList.add('gone');
        ensureCtx(); if(actx&&actx.state==='suspended')actx.resume(); enterScene(); }
    });
    box.appendChild(btn);
  }
  el('savemenu').classList.add('show');
}
el('smTabSave').addEventListener('click',()=>openSaveMenu('save'));
el('smTabLoad').addEventListener('click',()=>openSaveMenu('load'));
el('smClose').addEventListener('click',()=>el('savemenu').classList.remove('show'));
el('tLoad').addEventListener('click',()=>openSaveMenu('load'));

let toastT=null;
function toast(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

function copyFallback(url){ const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('リンクをコピーしました'); }catch(e){} document.body.removeChild(ta); }
function shareCopy(){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(SHARE_URL).then(()=>toast('リンクをコピーしました'),()=>copyFallback(SHARE_URL)); } else copyFallback(SHARE_URL); }

<!-- ════════ THREE.JS 360° 背景ビューア ════════ -->
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
const AP='assets/seikai/';
const canvas=document.getElementById('bg3d');
let renderer=null;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ window.BG3D={ok:false}; }
if(renderer){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 100);
  const loader=new THREE.TextureLoader();
  const geo=new THREE.SphereGeometry(10,64,44);
  function applyTex(t){ t.colorSpace=THREE.SRGBColorSpace; t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; return t; }
  function mkSphere(){ const m=new THREE.MeshBasicMaterial({side:THREE.BackSide,transparent:true,opacity:0,depthTest:false,depthWrite:false});
    const s=new THREE.Mesh(geo,m); s.rotation.y=Math.PI/2; scene.add(s); return s; }
  const sA=mkSphere(), sB=mkSphere(); let cur=sA;
  const cache={}; let fades=[];
  function loadTex(key, ok, fail){
    if(cache[key]){ ok(cache[key]); return; }
    loader.load(AP+'pano-'+key+'.jpg', t=>{ cache[key]=applyTex(t); ok(cache[key]); }, undefined, ()=>fail&&fail());
  }
  let freeMode=false;
  window.BG3D={ ok:true, _moved:false,
    setFree(on){ freeMode=on; if(!on){ tlon=Math.max(-28,Math.min(28,tlon)); tlat=Math.max(-17,Math.min(17,tlat)); } },
    view(){ return {lon:lon, lat:lat}; },
    lookUp(){ tlat=44; tlon=tlon*0.3; },
    project(lonH,latH){ const phi=THREE.MathUtils.degToRad(90-latH), th=THREE.MathUtils.degToRad(lonH);
      const v=new THREE.Vector3(Math.sin(phi)*Math.sin(th), Math.cos(phi), -Math.sin(phi)*Math.cos(th));
      const dir=new THREE.Vector3(); camera.getWorldDirection(dir); const front=v.dot(dir)>0.15;
      const q=v.clone().project(camera);
      return {x:(q.x*0.5+0.5)*innerWidth, y:(-q.y*0.5+0.5)*innerHeight, front:front}; },
    setPano(key, onOk, onFail){
      loadTex(key, t=>{
        const inc=(cur===sA)?sB:sA, out=cur;
        inc.material.map=t; inc.material.needsUpdate=true; inc.renderOrder=2; out.renderOrder=1;
        fades=fades.filter(f=>f.inc!==inc && f.inc!==out);
        fades.push({inc,out,t:(inc.material.opacity||0)}); cur=inc; onOk&&onOk();
      }, ()=>{ onFail&&onFail(); });
    } };
  // 見回し操作
  let lon=0,lat=2,tlon=0,tlat=0, drag=false, sx=0,sy=0, dist=0, auto=0, gyroOn=false, glon=0,glat=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function down(x,y){ drag=true; sx=x; sy=y; dist=0; window.BG3D._moved=false; }
  function move(x,y){ if(!drag) return; const dx=x-sx, dy=y-sy; dist+=Math.abs(dx)+Math.abs(dy);
    const LN=freeMode?170:28, LT=freeMode?58:17;
    tlon=clamp(tlon - dx*0.09, -LN,LN); tlat=clamp(tlat + dy*0.08, -LT,LT); sx=x; sy=y; if(dist>10) window.BG3D._moved=true; }
  function up(){ drag=false; }
  window.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('#hud,#textwrap,#choices,#backlog,#settings,#chapsel,#savemenu,#title,#mg,#lorecard,#loredex,#exhint,#hs,#mmap,#mapfull,#cdark')) return; down(e.clientX,e.clientY); });
  window.addEventListener('pointermove',e=>move(e.clientX,e.clientY),{passive:true});
  window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  window.addEventListener('deviceorientation',e=>{ if(e.gamma==null) return; gyroOn=true;
    glon=clamp(e.gamma*0.7,-22,22); glat=clamp((e.beta-45)*0.35,-15,15); }, true);
  function resize(){ const a=innerWidth/innerHeight; camera.aspect=a; camera.fov=a<1?58:72; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false); }
  window.addEventListener('resize',resize); resize();
  function tick(){ requestAnimationFrame(tick);
    auto+=0.0015; const still=freeMode||window.SEIKAI_FIXVIEW;
    const ax=still?0:Math.sin(auto)*6, ay=still?0:Math.cos(auto*0.6)*2.2;
    const goalLon=tlon+ax+((gyroOn&&!still)?glon:0), goalLat=tlat+ay+((gyroOn&&!still)?glat:0)+(still?0:2);
    lon+=(goalLon-lon)*(still?0.12:0.045); lat+=(goalLat-lat)*(still?0.12:0.045);
    if(!drag && !still){ tlon*=0.985; tlat*=0.985; }
    const phi=THREE.MathUtils.degToRad(90-lat), th=THREE.MathUtils.degToRad(lon);
    camera.lookAt(Math.sin(phi)*Math.sin(th), Math.cos(phi), -Math.sin(phi)*Math.cos(th));
    for(const f of fades){ f.t=Math.min(1,f.t+0.02); f.inc.material.opacity=f.t; f.out.material.opacity=Math.max(0,1-f.t); }
    fades=fades.filter(f=>f.t<1);
    renderer.render(scene,camera);
  }
  tick();
  const hint=document.getElementById('hint3d');
  if(hint){ setTimeout(()=>{ hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),4200); }, 1800); }
}
</script>
