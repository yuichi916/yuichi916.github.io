<style>
:root{
  --bg:#f4f0e6; --ink:#161510; --accent:#c43d2a;
  --paper:#fbf9f3; --line:#d6ccb6; --muted:#5c574b; --soft:#ebe4d3;
  --tint:#f8e6e0; --mark:rgba(196,61,42,.15);
  --radius:10px; --gutter:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-size:16px; line-height:1.8;
  word-break:auto-phrase; overflow-wrap:break-word; text-wrap:pretty;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 var(--gutter)}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h2:focus{outline:none}
.muted{color:var(--muted)}
.visually-hidden{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* 見出し帯 */
.top{border-bottom:1px solid var(--line); padding:14px 0 12px}
.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{margin:0; font-size:17px; font-weight:700; letter-spacing:.02em}
.brand small{font-weight:500; color:var(--muted); margin-left:.4em; font-size:13px}
.dots{list-style:none; display:flex; gap:6px; margin:0; padding:0}
.dots li{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--muted); display:grid; place-items:center; font-size:9px; line-height:1; color:#fff}
.dots li.now{border-color:var(--ink); box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink)}
.dots li.ok{background:var(--ink); border-color:var(--ink)}
.dots li.ng{background:var(--accent); border-color:var(--accent)}

/* はじめの画面 */
.intro{padding:28px 0 40px}
.intro h2{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif; font-size:clamp(28px,7vw,44px); line-height:1.3; margin:0 0 6px; letter-spacing:.02em}
.intro .kicker{color:var(--accent); font-weight:700; margin:0 0 4px; font-size:14px; letter-spacing:.08em}
.intro .lead{font-size:17px; max-width:36em}
.steps{counter-reset:s; list-style:none; padding:0; margin:18px 0; display:grid; gap:8px; max-width:40em}
.steps li{counter-increment:s; display:flex; gap:.7em; align-items:baseline}
.steps li::before{content:counter(s); flex:none; width:1.7em; height:1.7em; border-radius:50%; background:var(--ink); color:var(--bg); display:inline-grid; place-items:center; font-size:.85em; font-weight:700}
.types{display:grid; gap:10px; margin:18px 0 22px; padding:0; list-style:none}
@media (min-width:720px){.types{grid-template-columns:1fr 1fr}}
.types li{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px}
.types b{display:block}
.types .n{color:var(--accent); margin-right:.3em}
.note{font-size:14px; color:var(--muted)}

/* 問題の画面 */
.q{padding:18px 0 0}
.q-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin:0 0 6px}
.q-no{font-weight:700; color:var(--accent); font-size:15px; letter-spacing:.04em}
.q-scene{margin:0; font-size:22px; line-height:1.4}
.ask{margin:4px 0 14px; padding:8px 12px; border-left:3px solid var(--ink); background:var(--soft); border-radius:0 8px 8px 0; font-size:15px}
.ask .lbl{font-weight:700; margin-right:.3em}
.pair{display:grid; gap:14px}
@media (min-width:880px){.pair{grid-template-columns:1fr 1fr; align-items:start}}
.panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px 12px}
.panel h3{margin:0 0 2px; font-size:13px; letter-spacing:.08em; color:var(--muted); font-weight:700}
.panel .ttl{margin:0 0 10px; font-weight:700; font-size:16px; line-height:1.5}
.src p{margin:0 0 .45em; font-size:15px; line-height:1.85}
.src .h{font-weight:700; margin-top:.7em}
.src .h:first-child{margin-top:0}
mark{background:var(--mark); color:inherit; border-bottom:2px solid var(--accent); padding:0 1px}
.tbl-wrap{overflow-x:auto; margin:.2em 0 .7em}
.tbl{border-collapse:collapse; width:100%; font-size:14px; font-variant-numeric:tabular-nums; line-height:1.5}
.tbl th,.tbl td{border:1px solid var(--line); padding:5px 7px; text-align:right}
.tbl td{white-space:nowrap}
.tbl th{background:var(--soft); font-weight:700; font-size:13px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{font-weight:700}
.tbl td.hit{background:var(--mark); box-shadow:inset 0 0 0 2px var(--accent)}
.hint{font-size:14px; color:var(--muted); margin:0 0 8px}
.sents{list-style:none; margin:0; padding:0}
.sents li{margin:0 0 8px}
.sent{display:flex; gap:.65em; width:100%; text-align:start; background:#fff; border:1.5px solid var(--line); border-radius:var(--radius); padding:10px 12px; cursor:pointer; line-height:1.75; font-size:15.5px; position:relative}
.sent:hover{border-color:var(--ink)}
.sent .no{flex:none; display:inline-grid; place-items:center; width:1.85em; height:1.85em; margin-top:.05em; border-radius:50%; border:1.5px solid var(--ink); font-weight:700; font-size:.85em; line-height:1}
.sent .tx{flex:1; min-width:0}
.sent[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent)}
.sent[aria-pressed="true"] .no{background:var(--accent); border-color:var(--accent); color:#fff}
.sent:disabled{cursor:default}
.sent:disabled:hover{border-color:var(--line)}
.sent.is-answer,.sent.is-answer:disabled:hover{border-color:var(--accent); background:var(--tint); box-shadow:inset 0 0 0 1.5px var(--accent)}
.sent.is-answer .no{background:var(--accent); border-color:var(--accent); color:#fff}
.sent.is-miss{border-style:dashed; border-color:var(--muted); box-shadow:none}
.sent.is-miss .no{background:transparent; color:var(--ink); border-color:var(--muted)}
.tag{display:table; font-size:12px; font-weight:700; line-height:1; padding:4px 8px; border-radius:999px; margin:1px 0 5px}
.tag.err{background:var(--accent); color:#fff}
.tag.mine{background:var(--soft); color:var(--ink); border:1px solid var(--muted)}
.wp{background:var(--mark); text-decoration:underline wavy var(--accent) 1.5px; text-underline-offset:4px}
.nb{white-space:nowrap}

.explain{margin:16px 0 0; background:#fff; border:1.5px solid var(--ink); border-radius:var(--radius); padding:16px 18px 8px}
.verdict{margin:0 0 6px; font-size:20px; font-weight:700; line-height:1.4}
.verdict .mk{display:inline-grid; place-items:center; width:1.5em; height:1.5em; border-radius:50%; margin-right:.35em; font-size:.9em; vertical-align:.05em}
.verdict.ok .mk{background:var(--ink); color:var(--bg)}
.verdict.ng .mk{background:var(--accent); color:#fff}
.typeline{margin:0 0 10px}
.chip{display:inline-block; background:var(--ink); color:var(--bg); border-radius:6px; padding:1px 8px; font-weight:700; font-size:14px; margin-right:.4em}
.explain dl{margin:0}
.explain dt{font-weight:700; font-size:14px; color:var(--accent); margin-top:10px}
.explain dd{margin:2px 0 0}
.explain dl,.explain .typeline{max-width:46em}

.actions{position:sticky; bottom:0; z-index:5; margin-top:14px; padding:12px 0 calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 72%, rgba(244,240,230,0)); display:flex; justify-content:center}
.btn{appearance:none; border:0; border-radius:999px; background:var(--ink); color:var(--bg); font-weight:700; padding:12px 26px; min-height:48px; cursor:pointer; font-size:16px; line-height:1.3}
.btn:disabled{background:#bdb5a4; color:var(--bg); cursor:not-allowed}
.btn.accent{background:var(--accent); color:#fff}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btns{display:flex; flex-wrap:wrap; gap:10px; margin:18px 0}

/* 結果の画面 */
.final{padding:26px 0 44px}
.score{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif; font-size:clamp(26px,6.5vw,40px); margin:0 0 4px; line-height:1.35}
.score em{font-style:normal; color:var(--accent); font-size:1.35em}
.bytype{border-collapse:collapse; width:100%; max-width:560px; margin:14px 0 6px}
.bytype th,.bytype td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
.bytype td.num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:700}
.bar{height:8px; background:var(--soft); border-radius:99px; overflow:hidden; min-width:60px}
.bar i{display:block; height:100%; background:var(--ink)}
.review{list-style:none; padding:0; margin:16px 0; display:grid; gap:6px; max-width:640px}
.review li{display:flex; gap:.6em; align-items:baseline; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:15px}
.review .r{flex:none; font-weight:700; width:1.3em; text-align:center}
.review .r.ng{color:var(--accent)}
.advice{background:#fff; border-left:4px solid var(--accent); padding:10px 14px; border-radius:0 8px 8px 0; max-width:640px}
footer{border-top:1px solid var(--line); margin-top:30px; padding:14px 0 28px; font-size:13px; color:var(--muted)}
@media (max-width:420px){
  .q-scene{font-size:20px}
  .panel{padding:12px 13px 10px}
  .tbl{font-size:13px}
  .tbl th,.tbl td{padding:4px 5px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
/* ===== サイトに合わせる（記事と同じ上の帯・下のリンク列・字） ===== */
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif}
.crumb{border-bottom:2px solid #1a1812;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;color:#6b6759;text-transform:uppercase}
.crumb .wrap{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.crumb a{text-decoration:none;color:inherit}.crumb a:hover{color:var(--accent)}
.feelwrap{margin-top:34px}
footer{border-top:2px solid #1a1812;padding:22px 0 40px}
.flinks{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:#6b6759;text-transform:uppercase}
.flinks a{text-decoration:none;color:inherit}.flinks a:hover{color:var(--accent)}
#foot{margin-top:12px;font-size:12px}
/* 押せない間のボタンは灰色（.btn.accent の赤が上書きしていた）。字は濃く（薄い字だと 1.8:1 で読みにくい） */
.btn:disabled,.btn.accent:disabled{background:#bdb5a4;color:#161510;cursor:not-allowed}
/* 答え合わせのあとに移る先の上に、少し余白 */
.pair,.panel{scroll-margin-top:12px}
/* 結果の一覧で、第10問だけ題が右にずれないように */
.review .qn{display:inline-block;min-width:4.6em}
</style>

  var ADVICE = {
    "1": "数字は1つずつ元の資料に戻って確かめる。割合なら分母、金額なら単位、日付なら「前日」などの言葉まで。",
    "2": "資料の「〜の場合」「〜だけ」「誰が」に先に印を付け、AIの文に残っているかを見る。",
    "3": "資料の「ただし」「〜を除く」に先に印を付け、AIの文のどこに入ったかを探す。",
    "4": "「決まった」「〜のため」「値上げ」のような断定や言い換えが、資料に本当に書いてあるかを見る。"
  };
  var app = document.getElementById("app");
  var dotsEl = document.getElementById("dots");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var state = { queue: [], pos: 0, results: {}, selected: null, answered: false };

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  // 数字と単位のまとまり（7〜9月・10月15日・2,400千円・2027年4月 など）を行の途中で切らない
  var NB_RE = /((?:約)?\d[\d,.]*(?:〜\d[\d,.]*)?(?:年\d+月|月\d+日|か月|週間|営業日|千円|万円|円|人|社|割|月|日|時|年|%))/g;
  var NW_RE = /(落としている|そのもの|言い換え|問い合わせ|但し書き|言い過ぎ|食い違)/g;
  function fmt(s){ return esc(s).replace(NB_RE, '<span class="nb">$1</span>').replace(NW_RE, '<span class="nb">$1</span>'); }
  // text の中の marks（部分文字列）を <tag class=cls> で囲む。重なりはまとめる。
  function highlight(text, marks, tag, cls){
    var spans = [];
    (marks || []).forEach(function(m){
      if (!m) return;
      var from = 0, i;
      while ((i = text.indexOf(m, from)) !== -1){ spans.push([i, i + m.length]); from = i + m.length; }
    });
    if (!spans.length) return fmt(text);
    spans.sort(function(a,b){ return a[0]-b[0]; });
    var merged = [spans[0].slice()];
    for (var k=1; k<spans.length; k++){
      var last = merged[merged.length-1];
      if (spans[k][0] <= last[1]) last[1] = Math.max(last[1], spans[k][1]); else merged.push(spans[k].slice());
    }
    var out = "", pos = 0, open = "<" + tag + (cls ? ' class="' + cls + '"' : "") + ">";
    merged.forEach(function(s){ out += fmt(text.slice(pos, s[0])) + open + fmt(text.slice(s[0], s[1])) + "</" + tag + ">"; pos = s[1]; });
    return out + fmt(text.slice(pos));
  }
  function scrollToEl(el){
    if (!el) return;
    el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }
  function itemById(id){ for (var i=0;i<ITEMS.length;i++){ if (ITEMS[i].id === id) return ITEMS[i]; } return null; }

  function renderDots(){
    var html = "";
    state.queue.forEach(function(id, i){
      var r = state.results[id];
      var cls = r === true ? "ok" : r === false ? "ng" : (i === state.pos && !state.done ? "now" : "");
      var label = "第" + id + "問" + (r === true ? "：見抜けた" : r === false ? "：見落とし" : "");
      html += '<li class="' + cls + '" aria-label="' + label + '"></li>';
    });
    dotsEl.innerHTML = html;
  }

  function renderIntro(){
    state.queue = []; state.done = false; renderDots();
    var types = Object.keys(TYPES).sort().map(function(k){
      return '<li><b><span class="n">' + NUM[+k] + '</span>' + esc(TYPES[k].name) + '</b><span class="muted">' + fmt(TYPES[k].desc) + '</span></li>';
    }).join("");
    app.innerHTML =
      '<section class="intro">' +
        '<p class="kicker">新人編・全' + ITEMS.length + '問</p>' +
        '<h2>AIのまちがい探し</h2>' +
        '<p class="lead">' + fmt(DATA.lead) + '</p>' +
        '<ol class="steps">' +
          '<li>元の資料を読む（AIに渡した資料です）</li>' +
          '<li>AIが作った文から、資料と食い違う1文を選ぶ</li>' +
          '<li>答え合わせで、資料のどこと食い違うかを確かめる</li>' +
        '</ol>' +
        '<p><b>誤りの型は4つ</b>（どの問も、このどれか1つです）</p>' +
        '<ul class="types">' + types + '</ul>' +
        (DATA.types_note ? '<p class="note">' + fmt(DATA.types_note) + '</p>' : '') +
        '<p class="note">' + fmt(DATA.note) + '</p>' +
        '<div class="btns"><button class="btn accent" id="go" type="button">はじめる</button></div>' +
      '</section>';
    document.getElementById("go").addEventListener("click", function(){ startRound(ITEMS.map(function(it){ return it.id; })); });
  }

  function startRound(ids){
    state.queue = ids.slice(); state.pos = 0; state.results = {}; state.done = false;
    renderQuestion();
  }

  function sourceHTML(it, reveal){
    var marks = reveal ? it.source_marks : [];
    var cells = reveal ? (it.source_cells || []) : [];
    return it.source.map(function(b){
      if (b.k === "p") return "<p>" + highlight(b.t, marks, "mark") + "</p>";
      if (b.k === "h") return '<p class="h">' + highlight(b.t, marks, "mark") + "</p>";
      if (b.k === "table"){
        var h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + b.head.map(function(c){ return '<th scope="col">' + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        b.rows.forEach(function(r, ri){
          h += "<tr>" + r.map(function(c, ci){
            var hit = cells.some(function(rc){ return rc[0] === ri && rc[1] === ci; });
            return "<td" + (hit ? ' class="hit"' : "") + ">" + esc(c) + "</td>";
          }).join("") + "</tr>";
        });
        return h + "</tbody></table></div>";
      }
      return "";
    }).join("");
  }

  function sentsHTML(it){
    return it.ai.map(function(s, i){
      var n = i + 1, cls = "sent", pressed = state.selected === n, tag = "", text = fmt(s);
      if (state.answered){
        if (n === it.answer){ cls += " is-answer"; tag = '<span class="tag err">誤りの文</span> '; text = highlight(s, [it.wrong_part], "span", "wp"); }
        else if (pressed){ cls += " is-miss"; tag = '<span class="tag mine">あなたの選択</span> '; }
        if (n === it.answer && pressed){ tag = '<span class="tag err">誤りの文（あなたの選択）</span> '; }
      }
      return '<li><button type="button" class="' + cls + '" data-n="' + n + '" aria-pressed="' + (pressed ? "true" : "false") + '"' + (state.answered ? " disabled" : "") + '>' +
        '<span class="no" aria-hidden="true">' + n + '</span><span class="tx">' + tag + text + '</span></button></li>';
    }).join("");
  }

  function renderQuestion(){
    var id = state.queue[state.pos], it = itemById(id);
    state.selected = null; state.answered = false;
    renderDots();
    app.innerHTML =
      '<section class="q" aria-labelledby="qscene">' +
        '<div class="q-head"><span class="q-no">第' + it.id + '問（' + (state.pos + 1) + ' / ' + state.queue.length + '）</span>' +
        '<h2 class="q-scene" id="qscene" tabindex="-1">' + esc(it.scene) + '</h2></div>' +
        '<p class="ask"><span class="lbl">AIに頼んだこと</span>「' + fmt(it.request) + '」</p>' +
        '<div class="pair">' +
          '<section class="panel" aria-labelledby="srcTitle"><h3>元の資料</h3><p class="ttl" id="srcTitle">' + fmt(it.source_title) + '</p><div class="src" id="src">' + sourceHTML(it, false) + '</div></section>' +
          '<section class="panel" aria-labelledby="aiTitle"><h3 id="aiTitle">' + esc(it.ai_title) + '</h3><p class="hint" id="hint">資料と食い違う文を1つ選んでください。</p><ol class="sents" id="sents">' + sentsHTML(it) + '</ol></section>' +
        '</div>' +
        '<div id="explainSlot" aria-live="polite"></div>' +
        '<div class="actions"><button class="btn accent" id="act" type="button" disabled>文を1つ選んでください</button></div>' +
      '</section>';
    bindSents(it);
    document.getElementById("act").addEventListener("click", function(){ onAction(it); });
    window.scrollTo(0, 0);
    document.getElementById("qscene").focus({ preventScroll: true });
  }

  function bindSents(it){
    Array.prototype.forEach.call(document.querySelectorAll("#sents .sent"), function(btn){
      btn.addEventListener("click", function(){
        if (state.answered) return;
        state.selected = +btn.getAttribute("data-n");
        Array.prototype.forEach.call(document.querySelectorAll("#sents .sent"), function(b){
          b.setAttribute("aria-pressed", (+b.getAttribute("data-n") === state.selected) ? "true" : "false");
        });
        var act = document.getElementById("act");
        act.disabled = false;
        act.textContent = "(" + state.selected + ") を選んで答え合わせ";
      });
    });
  }

  function onAction(it){
    if (!state.answered){
      if (state.selected == null) return;
      state.answered = true;
      var ok = state.selected === it.answer;
      state.results[it.id] = ok;
      renderDots();
      document.getElementById("src").innerHTML = sourceHTML(it, true);
      document.getElementById("sents").innerHTML = sentsHTML(it);
      document.getElementById("hint").textContent = ok ? "見抜けました。印の部分が誤りです。" : "印の付いた文が誤りでした。";
      var t = TYPES[String(it.type)];
      var slot = document.getElementById("explainSlot");
      slot.innerHTML =
        '<section class="explain" id="explain">' +
          '<p class="verdict ' + (ok ? "ok" : "ng") + '"><span class="mk" aria-hidden="true">' + (ok ? "○" : "×") + '</span>' +
            (ok ? "見抜けました" : "おしい。誤りは (" + it.answer + ") でした") + '</p>' +
          '<p class="typeline"><span class="chip">' + NUM[it.type] + ' ' + esc(t.name) + '</span><span class="muted">' + fmt(t.desc) + '</span></p>' +
          '<dl>' +
            '<dt>元の資料のどこと食い違うか</dt><dd>' + fmt(it.where) + '</dd>' +
            '<dt>正しくは</dt><dd>' + fmt(it.correct) + '</dd>' +
            '<dt>見落としやすい理由</dt><dd>' + fmt(it.why_missed) + '</dd>' +
            '<dt>次に見抜くコツ</dt><dd>' + fmt(it.tip) + '</dd>' +
          '</dl>' +
        '</section>';
      var act = document.getElementById("act");
      var last = state.pos === state.queue.length - 1;
      act.textContent = last ? "結果を見る" : "次の問題へ";
      act.classList.remove("accent");
      scrollToEl(window.innerWidth >= 880 ? document.querySelector(".pair") : document.getElementById("aiTitle").parentNode);
    } else {
      if (state.pos < state.queue.length - 1){ state.pos++; renderQuestion(); }
      else { renderFinal(); }
    }
  }

  function renderFinal(){
    state.done = true;
    renderDots();
    var total = state.queue.length, right = 0, byType = {};
    Object.keys(TYPES).forEach(function(k){ byType[k] = { n: 0, ok: 0 }; });
    state.queue.forEach(function(id){
      var it = itemById(id), k = String(it.type);
      byType[k].n++;
      if (state.results[id]){ right++; byType[k].ok++; }
    });
    var rows = Object.keys(TYPES).sort().filter(function(k){ return byType[k].n > 0; }).map(function(k){
      var b = byType[k], pct = b.n ? Math.round(100 * b.ok / b.n) : 0;
      return '<tr><th scope="row">' + NUM[+k] + ' ' + esc(TYPES[k].name) + '</th><td style="width:34%"><div class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></div></td><td class="num">' + b.ok + ' / ' + b.n + '</td></tr>';
    }).join("");
    var review = state.queue.map(function(id){
      var it = itemById(id), ok = state.results[id];
      return '<li><span class="r ' + (ok ? "ok" : "ng") + '" aria-label="' + (ok ? "見抜けた" : "見落とし") + '">' + (ok ? "○" : "×") + '</span><span><span class="qn">第' + it.id + '問</span>' + esc(it.scene) + '<span class="muted">（' + NUM[it.type] + ' ' + esc(TYPES[String(it.type)].short) + '）</span></span></li>';
    }).join("");
    // いちばん取りこぼした型（割合が低い順、同じなら問題数が多い順）
    var weak = Object.keys(byType).filter(function(k){ return byType[k].n > 0 && byType[k].ok < byType[k].n; })
      .sort(function(a,b){ var ra = byType[a].ok / byType[a].n, rb = byType[b].ok / byType[b].n; return ra - rb || byType[b].n - byType[a].n; })[0];
    var advice = weak
      ? '<p class="advice"><b>いちばん見落としたのは「' + NUM[+weak] + ' ' + esc(TYPES[weak].name) + '」。</b><br>' + fmt(ADVICE[weak]) + '</p>'
      : '<p class="advice"><b>全部見抜けました。</b><br>本物の仕事では、誤りが1つとは限りません。0個のことも、3個のこともあります。1文ずつ資料に戻る手順は、そのまま使えます。</p>';
    var missed = state.queue.filter(function(id){ return !state.results[id]; });
    app.innerHTML =
      '<section class="final" aria-labelledby="scoreTitle">' +
        '<p class="kicker muted">結果</p>' +
        '<h2 class="score" id="scoreTitle" tabindex="-1">' + total + '問中 <em>' + right + '問</em> 見抜けました</h2>' +
        '<table class="bytype"><caption class="visually-hidden">誤りの型ごとの正解数</caption><tbody>' + rows + '</tbody></table>' +
        advice +
        '<ol class="review">' + review + '</ol>' +
        '<div class="btns">' +
          (missed.length ? '<button class="btn accent" id="retry" type="button">見落とした' + missed.length + '問だけ解き直す</button>' : "") +
          '<button class="btn ghost" id="again" type="button">最初から</button>' +
        '</div>' +
      '</section>';
    if (missed.length) document.getElementById("retry").addEventListener("click", function(){ startRound(missed); });
    document.getElementById("again").addEventListener("click", function(){ renderIntro(); window.scrollTo(0,0); });
    window.scrollTo(0, 0);
    document.getElementById("scoreTitle").focus({ preventScroll: true });
  }

  document.getElementById("foot").textContent = "練習用の試作です（" + DATA.version + "）。";
  renderIntro();
})();
</script>
</body>
</html>
