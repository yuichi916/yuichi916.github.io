<script>
"use strict";
const $=id=>document.getElementById(id);
const S=window.HYAKU_SCRIPT.scenes;
const A="assets/hyaku/";
const st={scene:0,i:0,auto:false,skip:false,voice:true,bgm:true,waiting:false,typing:null,ended:false};
// ── 多言語 ──
const LANGS=["ja","en","zh","ko","es","fr","de"];
const JA_UI={title:"百の悪行",sub:"―魔王は百の悪行を残して死んだ。ぜんぶ、嘘だった。―",sub_clear:"――どうか、良い夜明けを。",
  start:"はじめから",cont:"つづきから",chap:"章をえらぶ",close:"とじる",log:"履歴",save:"保存",saved:"保存済",menu:"目次",
  note:"フルボイス(AI音声)・挿絵つき・約30分<br>音が出ます。ヘッドホン推奨",
  end_fin:"（了）",end_line:"どうか、良い夜明けを。",
  end_credit1:"原作テキスト版は 小説家になろう で公開中",
  end_credit2:"文章・挿絵・音声: AI生成(Claude / Stable Diffusion / ElevenLabs) + 作者",
  end_credit3:"音楽: 君の音。 / なぐもりずの音楽室 (BGM素材集より)",
  back:"表紙へもどる",
  chapters:["序","一　目録","二　検証","三　告白","四　第一条","五　第百条","六　これを読んだあなたへ"]};
let lang=new URLSearchParams(location.search).get("lang");
if(!LANGS.includes(lang)) lang=localStorage.getItem("hyaku_lang");
if(!LANGS.includes(lang)){
  const nav=(navigator.language||"ja").toLowerCase();
  lang=LANGS.find(l=>nav.startsWith(l))||( nav.startsWith("zh")?"zh":"ja");
  if(!LANGS.includes(lang)) lang="ja";
}
let vlang=localStorage.getItem("hyaku_vlang")||((lang==="ja")?"ja":"en");
let lang2=localStorage.getItem("hyaku_lang2");
if(!LANGS.includes(lang2)||lang2===lang) lang2="off";
let L=null; // 現在言語の辞書(ja=null)
const I18N={};
async function loadLang(lg){
  if(lg==="ja") return null;
  if(I18N[lg]) return I18N[lg];
  const r=await fetch(`assets/hyaku/i18n/${lg}.json`);
  I18N[lg]=await r.json();
  return I18N[lg];
}
function tr(b){
  if(!L) return {t:b.t,n:b.n||""};
  return {t:(L.t&&L.t[b.ix]!=null)?L.t[b.ix]:b.t, n:b.n?(L.names[b.n]||b.n):""};
}
function ui(key){ return L?(L.ui[key]??JA_UI[key]):JA_UI[key]; }
function tr2(b){
  if(lang2==="off"||lang2===lang) return null;
  if(lang2==="ja") return b.t;
  const D=I18N[lang2];
  if(!D||b.ix==null) return null;
  return (D.t[b.ix]!=null)?D.t[b.ix]:null;
}
function updateDual(){ $("box").classList.toggle("dual",lang2!=="off"&&lang2!==lang); }
function rerenderCur(){
  if(!st._cur) return;
  if(st.typing){ clearInterval(st.typing); st.typing=null; st.waiting=true; $("cue").style.opacity=1; }
  const x=tr(st._cur); $("tx").textContent=x.t;
  const x2=tr2(st._cur); $("tx2").textContent=(x2!=null)?x2:"";
  const nameEl=$("name");
  if(x.n){nameEl.textContent=x.n;nameEl.style.display="block";}else nameEl.style.display="none";
}
async function setLang2(lg){
  lang2=(lg===lang)?"off":lg;
  localStorage.setItem("hyaku_lang2",lang2);
  if(lang2!=="off"&&lang2!=="ja") await loadLang(lang2);
  updateDual(); applyUiLang(); rerenderCur();
}
function applyUiLang(){
  document.documentElement.lang=lang;
  document.title=ui("title")+(lang==="ja"?" — サウンドノベル":" — Sound Novel");
  const h1=document.querySelector("#title h1");
  h1.textContent=ui("title");
  h1.style.letterSpacing=(lang==="ja")?"":".04em";
  document.querySelector("#title p.sub").textContent=
    localStorage.getItem("hyaku_clear")?ui("sub_clear"):ui("sub");
  $("btnStart").textContent=ui("start");
  $("btnCont").textContent=ui("cont");
  $("btnChap").textContent=ui("chap");
  document.querySelector("#title .note").innerHTML=ui("note");
  $("btnLog").textContent=ui("log");
  $("btnSave").textContent=ui("save");
  $("btnMenu").textContent=ui("menu");
  $("btnVLang").textContent="VO:"+vlang.toUpperCase();
  $("btnLogClose").textContent=ui("close");
  $("btnBack").textContent=ui("back");
  const end=$("ending");
  end.querySelector("p:nth-child(1)").textContent=ui("end_fin");
  end.querySelector("p:nth-child(2)").textContent=ui("end_line");
  document.querySelectorAll("#langMenu button[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  document.querySelectorAll("#langMenu button[data-lang2]").forEach(b=>b.classList.toggle("on",b.dataset.lang2===lang2));
}
async function setLang(lg){
  lang=lg; localStorage.setItem("hyaku_lang",lg);
  vlang=(lg==="ja")?"ja":"en"; localStorage.setItem("hyaku_vlang",vlang);
  if(lang2===lang){ lang2="off"; localStorage.setItem("hyaku_lang2",lang2); }
  L=await loadLang(lg);
  updateDual(); applyUiLang();
  rerenderCur(); // 表示中の行を再描画
}
let bgFront=null, curBg=null, curBgm=null;
const bgmAudio=new Audio(); bgmAudio.loop=true; bgmAudio.volume=0;
let voiceAudio=null, bgmFadeTimer=null, autoTimer=null;

function setBG(key){
  if(key===curBg) return; curBg=key;
  const a=$("bgA"), b=$("bgB");
  const back=(bgFront===a)?b:a, front=(bgFront===a)?a:b;
  back.style.backgroundImage=`url(${A}img/bg_${key}.jpg)`;
  back.classList.add("on"); front.classList.remove("on");
  bgFront=back;
}
function setCG(key){
  const cg=$("cg");
  if(!key){ cg.classList.remove("on"); return; }
  cg.style.backgroundImage=`url(${A}img/bg_${key}.jpg)`;
  cg.classList.add("on");
}
function setBGM(key){
  if(key===curBgm) return; curBgm=key;
  if(!st.bgm){ bgmAudio.pause(); return; }
  clearInterval(bgmFadeTimer);
  const fadeOut=setInterval(()=>{
    bgmAudio.volume=Math.max(0,bgmAudio.volume-0.08);
    if(bgmAudio.volume<=0){
      clearInterval(fadeOut);
      bgmAudio.src=`${A}bgm/${key}.mp3`;
      bgmAudio.play().catch(()=>{});
      bgmFadeTimer=setInterval(()=>{
        bgmAudio.volume=Math.min(0.55,bgmAudio.volume+0.05);
        if(bgmAudio.volume>=0.55) clearInterval(bgmFadeTimer);
      },90);
    }
  },70);
}
function stopVoice(){ if(voiceAudio){voiceAudio.pause(); voiceAudio=null;} }
function playVoice(key,onend){
  stopVoice();
  if(!st.voice||!key){ if(onend) onend(); return; }
  const vdir=(vlang==="en")?"voice_en":"voice";
  const a=new Audio(`${A}${vdir}/${key}.mp3`);
  voiceAudio=a;
  a.onended=()=>{ if(voiceAudio===a){voiceAudio=null; if(onend) onend();} };
  a.onerror=()=>{ if(voiceAudio===a){voiceAudio=null; if(onend) onend();} };
  a.play().catch(()=>{ if(onend) onend(); });
}
function showSprite(key,on){
  const el=$("sp_"+key); if(el) el.classList.toggle("on",on);
}
function hideAllSprites(){
  document.querySelectorAll(".sprite").forEach(e=>e.classList.remove("on"));
}

function run(){
  if(st.ended) return;
  while(true){
    const sc=S[st.scene];
    if(!sc){ ending(); return; }
    if(st.i===0){ setBG(sc.bg); setBGM(sc.bgm); setCG(null); hideAllSprites(); }
    if(st.i>=sc.beats.length){
      st.scene++; st.i=0;
      if(st.scene>=S.length){ ending(); return; }
      continue;
    }
    const b=sc.beats[st.i++];
    if(b.bg!==undefined){ setBG(b.bg); setCG(null); continue; }
    if(b.bgm!==undefined){ setBGM(b.bgm); continue; }
    if(b.cg!==undefined){ setCG(b.cg); continue; }
    if(b.show!==undefined){ showSprite(b.show,true); continue; }
    if(b.hide!==undefined){ showSprite(b.hide,false); continue; }
    if(b.t!==undefined){ say(b); return; }
  }
}

const blog=[];
function pushLog(b){
  blog.push({n:b.n||"",t:b.t});
  if(blog.length>120) blog.shift();
}
function say(b){
  const x=tr(b);
  const x2=tr2(b); // 第2言語は字幕としてビート頭から全文表示
  pushLog({n:x.n,t:x.t+((x2!=null)?"\n"+x2:"")});
  st.waiting=false; $("cue").style.opacity=0;
  const nameEl=$("name");
  if(x.n){ nameEl.textContent=x.n; nameEl.style.display="block"; }
  else nameEl.style.display="none";
  const tx=$("tx");
  $("tx2").textContent=(x2!=null)?x2:"";
  st._cur=b;
  if(st.skip){ // 高速スキップ: 全文即表示・ボイスなし・即送り
    stopVoice();
    tx.textContent=x.t;
    st.waiting=true;
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{ if(st.skip&&st.waiting&&!st.ended) advance(); },70);
    return;
  }
  tx.textContent="";
  let pos=0; const full=x.t;
  let voiceDone=!b.v, textDone=false;
  const maybeAuto=()=>{
    if(st.auto&&voiceDone&&textDone&&!st.ended){
      clearTimeout(autoTimer);
      autoTimer=setTimeout(()=>{ if(st.auto&&st.waiting) advance(); },900);
    }
  };
  playVoice(b.v,()=>{ voiceDone=true; maybeAuto(); });
  clearInterval(st.typing);
  st.typing=setInterval(()=>{
    pos++; tx.textContent=full.slice(0,pos);
    const w=$("txwrap"); w.scrollTop=w.scrollHeight;
    if(pos>=full.length){
      clearInterval(st.typing); st.typing=null;
      st.waiting=true; textDone=true; $("cue").style.opacity=1; maybeAuto();
    }
  },28);
}
function advance(){
  if(st.typing){ // 全文表示へ
    clearInterval(st.typing); st.typing=null;
    $("tx").textContent=tr(st._cur).t;
    st.waiting=true; $("cue").style.opacity=1;
    return;
  }
  if(st.waiting){ st.waiting=false; stopVoice(); run(); }
}

function ending(){
  st.ended=true; st.skip=false; $("btnSkip").classList.remove("on");
  stopVoice();
  $("ending").style.display="flex";
  localStorage.removeItem("hyaku_save");
  localStorage.setItem("hyaku_clear","1");
}
function applyTitleState(){
  // クリア後: 表紙が素顔のイベント絵に変わり、副題も変わる
  if(localStorage.getItem("hyaku_clear")){
    $("title").style.background="#000 url(assets/hyaku/img/bg_keyvisual.jpg) center/cover";
  }
  applyUiLang();
}

function save(){
  localStorage.setItem("hyaku_save",JSON.stringify({scene:st.scene,i:Math.max(0,st.i-1)}));
  const btn=$("btnSave"); btn.textContent=ui("saved"); setTimeout(()=>btn.textContent=ui("save"),1200);
}
function startAt(scene,i){
  st.scene=scene; st.i=i; st.ended=false;
  $("title").style.display="none"; $("chapters").style.display="none"; $("ending").style.display="none";
  curBg=null; curBgm=null; setCG(null); hideAllSprites();
  run();
}

// --- UI ---
$("stage").addEventListener("click",()=>advance());
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); advance(); }
});
$("btnAuto").onclick=e=>{ e.stopPropagation(); st.auto=!st.auto; $("btnAuto").classList.toggle("on",st.auto); if(st.auto&&st.waiting) advance(); };
$("btnSkip").onclick=e=>{
  e.stopPropagation(); st.skip=!st.skip; $("btnSkip").classList.toggle("on",st.skip);
  if(st.skip){ stopVoice(); if(st.typing){ clearInterval(st.typing); st.typing=null; $("tx").textContent=tr(st._cur).t; st.waiting=true; } if(st.waiting) advance(); }
};
$("btnBgm").onclick=e=>{
  e.stopPropagation(); st.bgm=!st.bgm; $("btnBgm").classList.toggle("on",st.bgm);
  if(!st.bgm){ bgmAudio.pause(); }
  else if(curBgm){ const k=curBgm; curBgm=null; setBGM(k); }
  else if(curBgm){ const k=curBgm; curBgm=null; setBGM(k); }
};
$("btnVLang").onclick=e=>{
  e.stopPropagation(); vlang=(vlang==="ja")?"en":"ja";
  localStorage.setItem("hyaku_vlang",vlang);
  $("btnVLang").textContent="VO:"+vlang.toUpperCase();
};
$("btnLang").onclick=e=>{
  e.stopPropagation();
  const m=$("langMenu"); m.style.display=(m.style.display==="flex")?"none":"flex";
};
document.querySelectorAll("#langMenu button[data-lang]").forEach(b=>{
  b.onclick=async e=>{ e.stopPropagation(); $("langMenu").style.display="none"; await setLang(b.dataset.lang); };
});
document.querySelectorAll("#langMenu button[data-lang2]").forEach(b=>{
  b.onclick=async e=>{ e.stopPropagation(); $("langMenu").style.display="none"; await setLang2(b.dataset.lang2); };
});
// マウスホイール: 上回転でバックログを開く / パネル内は通常スクロール
$("stage").addEventListener("wheel",e=>{
  if($("backlog").style.display==="flex") return;
  if($("title").style.display!=="none"&&getComputedStyle($("title")).display!=="none") return;
  if(e.deltaY<0){ e.preventDefault(); $("btnLog").click(); }
},{passive:false});
$("btnLog").onclick=e=>{
  e.stopPropagation();
  const inner=$("backlogInner"); inner.innerHTML="";
  blog.forEach(x=>{
    const p=document.createElement("p");
    if(x.n){ const s=document.createElement("span"); s.className="bl-name"; s.textContent=`【${x.n}】`; p.appendChild(s); p.appendChild(document.createElement("br")); }
    p.appendChild(document.createTextNode(x.t));
    inner.appendChild(p);
  });
  $("backlog").style.display="flex";
  inner.scrollTop=inner.scrollHeight;
};
$("btnLogClose").onclick=e=>{ e.stopPropagation(); $("backlog").style.display="none"; };
$("backlog").addEventListener("click",e=>e.stopPropagation());
$("btnVoice").onclick=e=>{ e.stopPropagation(); st.voice=!st.voice; $("btnVoice").classList.toggle("on",st.voice); if(!st.voice) stopVoice(); };
$("btnSave").onclick=e=>{ e.stopPropagation(); save(); };
$("btnMenu").onclick=e=>{ e.stopPropagation(); openChapters(); };
$("btnStart").onclick=()=>startAt(0,0);
$("btnCont").onclick=()=>{
  const s=JSON.parse(localStorage.getItem("hyaku_save")||"null");
  if(s) startAt(s.scene,s.i); else startAt(0,0);
};
$("btnChap").onclick=()=>openChapters();
$("btnBack").onclick=()=>{ applyTitleState(); $("ending").style.display="none"; $("title").style.display="flex"; bgmAudio.pause(); curBgm=null; };
function openChapters(){
  const c=$("chapters"); c.innerHTML="";
  const titles=ui("chapters");
  S.forEach((sc,idx)=>{
    const b=document.createElement("button");
    b.textContent=titles[idx]||sc.title;
    b.onclick=()=>startAt(idx,0);
    c.appendChild(b);
  });
  const close=document.createElement("button");
  close.textContent=ui("close"); close.style.marginTop="14px";
  close.onclick=()=>{ c.style.display="none"; };
  c.appendChild(close);
  c.style.display="flex";
}
if(localStorage.getItem("hyaku_save")) $("btnCont").style.display="block";
(async()=>{ L=await loadLang(lang); if(lang2!=="off"&&lang2!=="ja") await loadLang(lang2); updateDual(); applyTitleState(); })();
</script>
