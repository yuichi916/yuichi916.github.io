<script>
// Genre color palette
const GENRE_COLORS = {
  ambient: '#7a4af0',
  classic: '#d4a050',
  jazz: '#5fc8ff',
  metal: '#e23a4e',
  progressive: '#9b58e0',
  healing: '#f0c878',
  celt: '#54c878',
  jpop: '#ff6b9d',
  anime: '#ff9d6b',
  game: '#6bbeff',
  indies: '#a87adb',
  'pop-rock': '#f5a042',
  'blues-folk': '#c87a4a',
  nature: '#88c878',
  unknown: '#7a2a3a',
};

async function loadGraph() {
  try {
    const r = await fetch('scripts/universe.json');
    if (!r.ok) throw new Error('universe.json not found — run build_universe.py');
    return await r.json();
  } catch (e) {
    document.getElementById('loading').textContent = 'universe loading… ' + e.message;
    throw e;
  }
}

// Hex color mix for visited dimming
function mixColor(hex1, hex2, t){
  function p(h){ h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  if (!hex1 || !hex1.startsWith('#') || hex1.length < 7) return hex2;
  const a = p(hex1), b = p(hex2);
  const m = a.map((v,i) => Math.round(v * (1-t) + b[i] * t));
  return '#' + m.map(v => v.toString(16).padStart(2,'0')).join('');
}

function buildGraph(data) {
  const Graph = graphology.Graph;
  const g = new Graph({ type: 'undirected', multi: false });
  for (const n of data.nodes) {
    const color = GENRE_COLORS[n.genre] || GENRE_COLORS.unknown;
    g.addNode(n.id, {
      label: n.name,
      x: n.x ?? Math.random() * 100 - 50,
      y: n.y ?? Math.random() * 100 - 50,
      size: n.r ?? 2.5,
      color: color,
      origColor: color,
      genre: n.genre,
      inCollection: n.in_collection,
      album: n.album,
      degree: n.degree,
      yt: n.yt,
      asin: n.asin,
      origin: n.origin,
      country: n.country,
      years_active: n.years_active,
      mb_tags: n.mb_tags,
      mbid: n.mbid,
    });
  }
  for (const e of data.edges) {
    if (g.hasNode(e.source) && g.hasNode(e.target) && !g.hasEdge(e.source, e.target)) {
      // Multi-source edges drawn brighter
      const nSrc = (e.src || []).length;
      const alpha = 0.04 + 0.06 * Math.min(nSrc - 1, 3);
      g.addEdge(e.source, e.target, {
        size: 0.4 + 0.3 * Math.min(nSrc - 1, 2),
        color: `rgba(212,160,80,${alpha.toFixed(3)})`,
        origColor: `rgba(212,160,80,${alpha.toFixed(3)})`,
        weight: e.weight,
        src: e.src || [],
      });
    }
  }
  return g;
}

let sigma, graph, allNodeIds, hoveredNode;

// ═══ Game state (localStorage-persisted) ═══════════════════════════════
const STATE_KEY = 'salon_universe_state_v2';
let state = {
  visited: [],
  score: 0,
  achievements: [],
  chainStreak: 0,    // current chain (resets on non-chain click)
  longestChain: 0,
  genresVisited: [], // for "全色覚醒" achievement
  firstSession: Date.now(),
  lastVisit: 0,
};
try {
  const raw = localStorage.getItem(STATE_KEY);
  if (raw){
    const loaded = JSON.parse(raw);
    state = { ...state, ...loaded };
  }
} catch {}
let visited = new Set(state.visited || []);
let earnedAchv = new Set(state.achievements || []);
let genreSet = new Set(state.genresVisited || []);
let lastClickViaChain = false;  // set by chainBtn handler before focusNode

function saveState(){
  state.visited = [...visited];
  state.achievements = [...earnedAchv];
  state.genresVisited = [...genreSet];
  state.lastVisit = Date.now();
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch {}
}

// ─── Levels ──────────────────────────────────────────────────────────
const LEVELS = [
  { lv: 1, title: '旅人',          en: 'Traveler',   minPts: 0,    desc: '最初の一歩。' },
  { lv: 2, title: '探索者',        en: 'Explorer',   minPts: 15,   desc: '7人と出会った。' },
  { lv: 3, title: '蒐集家',        en: 'Collector',  minPts: 60,   desc: '30人を超えた。 ジャンルが見えてくる。' },
  { lv: 4, title: '鑑定家',        en: 'Connoisseur',minPts: 180,  desc: 'マイナー領域が解放される。' },
  { lv: 5, title: '神秘家',        en: 'Mystic',     minPts: 450,  desc: '深層が見えてくる。' },
  { lv: 6, title: '音の魔術師',    en: 'Sorcerer',   minPts: 1000, desc: '宇宙のすべてが手に届く。' },
];
function levelFor(pts){
  let cur = LEVELS[0];
  for (const l of LEVELS){ if (pts >= l.minPts) cur = l; }
  return cur;
}
function nextLevel(pts){
  for (const l of LEVELS){ if (pts < l.minPts) return l; }
  return null; // maxed
}

// ─── Achievements ───────────────────────────────────────────────────
const ACHIEVEMENTS = [
  { id: 'first',   icon: '✦', name: '最初の出会い',     desc: '初めての音楽との出会い。',
    check: (s) => visited.size >= 1 },
  { id: 'ten',     icon: '✶', name: '10人の旅',         desc: '10人のアーティストに出会う。',
    check: () => visited.size >= 10 },
  { id: 'fifty',   icon: '✺', name: '50人の交友',       desc: '50人のアーティストに出会う。',
    check: () => visited.size >= 50 },
  { id: 'hundred', icon: '❉', name: '100の発見',         desc: '100人のアーティストに出会う。',
    check: () => visited.size >= 100 },
  { id: 'allgen',  icon: '◈', name: '全色覚醒',         desc: '14ジャンル全てから少なくとも1人。',
    check: () => genreSet.size >= 14 },
  { id: 'rare',    icon: '◐', name: 'マイナー発掘',     desc: '関連の少ない (度数<5) アーティストに出会う。',
    check: () => state._rareFound },
  { id: 'chain3',  icon: '⌁', name: '連鎖の旅人',       desc: '「つぎへ→」で3連鎖。',
    check: () => state.longestChain >= 3 },
  { id: 'chain7',  icon: '⚡', name: '長き連鎖',         desc: '「つぎへ→」で7連鎖。',
    check: () => state.longestChain >= 7 },
  { id: 'night',   icon: '🌙', name: '夜更かし',         desc: '深夜0–4時に音楽を発見する。',
    check: () => state._nightOwl },

    check: () => (state.diceCount || 0) >= 5 },
];
function checkAchievements(){
  const newly = [];
  for (const a of ACHIEVEMENTS){
    if (!earnedAchv.has(a.id) && a.check(state)){
      earnedAchv.add(a.id);
      newly.push(a);
    }
  }

}

// ─── Toasts ─────────────────────────────────────────────────────────
function toast(klass, html, dur){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + (klass || '');
  el.innerHTML = html;
  stack.appendChild(el);
  setTimeout(() => el.remove(), dur || 4200);
}

function ripple(x, y, kind){
  const r = document.createElement('div');
  r.className = 'ripple' + (kind ? ' ' + kind : '');
  r.style.left = x + 'px';
  r.style.top  = y + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 1200);
}

// ─── Score award ────────────────────────────────────────────────────
function awardClick(id){
  const a = graph.getNodeAttributes(id);
  const isNew = !visited.has(id);
  let pts = 0;
  let bits = [];
  if (isNew){
    pts += 1; bits.push('+1 初の出会い');
    if ((a.degree || 0) < 5){ pts += 3; bits.push('+3 マイナー発掘'); state._rareFound = true; }
    if (!a.inCollection){ pts += 1; bits.push('+1 外部発見'); }
    if (lastClickViaChain){
      state.chainStreak = (state.chainStreak || 0) + 1;
      if (state.chainStreak > 1) {
        const bonus = Math.min(3, Math.floor(state.chainStreak / 2));
        if (bonus > 0){ pts += bonus; bits.push(`+${bonus} 連鎖×${state.chainStreak}`); }
      }
      if (state.chainStreak > (state.longestChain || 0)) state.longestChain = state.chainStreak;
    } else {
      state.chainStreak = 0;
    }
    const hr = new Date().getHours();
    if (hr >= 0 && hr < 4) state._nightOwl = true;
    if (a.genre) genreSet.add(a.genre);
  }
  visited.add(id);
  state.score = (state.score || 0) + pts;
  if (isNew && pts > 0){
    toast('score', `<span class="pts">+${pts}</span> pts <span style="color:var(--ink-soft);font-size:11.5px;margin-left:8px">${bits.join(' · ')}</span>`);
  }
  // Level up?
  const cur = levelFor(state.score - pts);
  const next = levelFor(state.score);
  if (next.lv > cur.lv){
    toast('cheer', `<span class="title">★ Lv ${next.lv} ${next.title} に昇格</span><span class="body">${next.desc}</span>`, 6000);
    // Find chip position & ripple — reuse toastStack region
    ripple(window.innerWidth / 2, 80, 'lvup');
    applyLevelGating();
  }
  // Achievements
  const earned = checkAchievements();
  for (const a of earned){
    toast('cheer', `<span class="title">${a.icon} 実績解禁: ${a.name}</span><span class="body">${a.desc}</span>`, 5500);
  }
  // Update UI
  refreshGameUI();
  saveState();
  // Reset chain flag (consumed)
  lastClickViaChain = false;
  // Refresh sigma to update visited muting + level gating
  if (sigma) sigma.refresh();
}

function refreshGameUI(){
  const lv = levelFor(state.score);
  const next = nextLevel(state.score);
  document.getElementById('lvNum').textContent = lv.lv;
  document.getElementById('lvTitle').textContent = lv.title;
  document.getElementById('scorePts').textContent = (state.score || 0).toLocaleString();
  if (next){
    const span = next.minPts - lv.minPts;
    const pos = state.score - lv.minPts;
    document.getElementById('scoreBar').style.width = Math.min(100, 100 * pos / span) + '%';
  } else {
    document.getElementById('scoreBar').style.width = '100%';
  }
  document.getElementById('visitedCount').textContent = visited.size.toLocaleString();
  document.getElementById('achvCount').textContent = earnedAchv.size;
  document.getElementById('achvTotal').textContent = ACHIEVEMENTS.length;
}

function isUnvisited(id){ return !visited.has(id); }

// Level-based visibility gating: low-degree (rare/maniac) nodes appear only
// after Lv 4. Until then they render as faint mystery dots without labels.
function applyLevelGating(){
  if (!sigma) return;
  sigma.refresh();
}
function isLockedByLevel(attrs){
  const lv = levelFor(state.score).lv;
  const deg = attrs.degree || 0;
  // Lv 1: only show degree >= 12 (popular nodes)
  // Lv 2: show degree >= 6
  // Lv 3: show degree >= 3
  // Lv 4+: show all
  // BUT visited nodes always show
  const cutoffs = { 1: 12, 2: 6, 3: 3 };
  const cutoff = cutoffs[lv] || 0;
  return deg < cutoff;
}

// Backward-compat: older code calls markVisited
function markVisited(id){
  awardClick(id);
}

async function main() {
  const data = await loadGraph();
  graph = buildGraph(data);

  // Spread overlapping nodes apart while preserving the layout structure.
  try {
    if (window.graphologyLibrary && window.graphologyLibrary.NoverlapLayout){
      window.graphologyLibrary.NoverlapLayout.assign(graph, {
        maxIterations: 80,
        settings: { margin: 1.5, ratio: 1.2, expansion: 1.05, gridSize: 24, speed: 3 },
      });
    }
  } catch (e) { console.warn('noverlap failed', e); }

  // statNodes is in the visited counter — set total side
  const sn = document.getElementById('statNodes');
  if (sn) sn.textContent = data.stats.total_nodes.toLocaleString();
  // Source breakdown is shown in the achievement modal now (less clutter on bar)
  allNodeIds = graph.nodes();

  sigma = new Sigma(graph, document.getElementById('graph'), {
    renderEdgeLabels: false,
    labelSize: 11,
    labelWeight: 'normal',
    labelColor: { color: '#f0e8d8' },
    labelDensity: 1.2,
    labelGridCellSize: 60,
    labelRenderedSizeThreshold: 4,  // show more labels at zoom
    enableEdgeEvents: false,
    minCameraRatio: 0.005,  // 200x zoom in (was 20x)
    maxCameraRatio: 80,
    // Reducer hooks: hover, visited muting, level-based mystery gating.
    nodeReducer: (id, attrs) => {
      const r = { ...attrs };
      const wasVisited = visited.has(id);
      const locked = !wasVisited && isLockedByLevel(attrs);
      if (locked){
        // Render as a faint mystery node; label hidden
        r.color = '#2a2138';
        r.size  = Math.max(1.2, (attrs.size || 2) * 0.55);
        r.label = '';
      } else if (wasVisited){
        // Visited nodes are muted/desaturated so unvisited ones pop out
        r.color = mixColor(attrs.origColor, '#3a2438', 0.55);
      }
      // Hover dim
      if (hoveredNode && id !== hoveredNode && !graph.hasEdge(hoveredNode, id) && !graph.hasEdge(id, hoveredNode)) {
        r.color = '#2a1830';
        r.label = '';
      }
      return r;
    },
    edgeReducer: (id, attrs) => {
      const r = { ...attrs };
      if (hoveredNode && !graph.hasExtremity(id, hoveredNode)) {
        r.hidden = true;
      }
      if (hoveredNode && graph.hasExtremity(id, hoveredNode)) {
        r.color = 'rgba(240,200,120,0.6)';
        r.size = 1.4;
      }
      return r;
    },
  });

  // Hover & click
  sigma.on('enterNode', ({ node }) => {
    hoveredNode = node;
    sigma.refresh();
  });
  sigma.on('leaveNode', () => {
    hoveredNode = null;
    sigma.refresh();
  });
  sigma.on('clickNode', ({ node, event }) => {
    const attrs = graph.getNodeAttributes(node);
    const wasVisited = visited.has(node);
    if (!wasVisited && isLockedByLevel(attrs)){
      // Locked: hint, but don't open. Award a small "peek" experience.
      toast('unlock', `<span class="title">？ 未解禁の領域</span><span class="body">Lv が上がるとマイナーな作家が解放されます</span>`, 3500);
      return;
    }
    // Ripple at click position for sphere-style flair
    if (event && event.original){
      ripple(event.original.clientX, event.original.clientY);
    }
    showInfo(node);
    awardClick(node);
  });
  // clickStage: don't close info (info has its own × button) — instead just deselect any hover
  sigma.on('clickStage', () => { /* keep info open */ });

  // Controls
  document.getElementById('zoomIn').onclick = () => {
    const cam = sigma.getCamera();
    cam.animatedZoom({ duration: 300 });
  };
  document.getElementById('zoomOut').onclick = () => {
    const cam = sigma.getCamera();
    cam.animatedUnzoom({ duration: 300 });
  };
  document.getElementById('zoomReset').onclick = () => {
    sigma.getCamera().animatedReset({ duration: 500 });
  };
  document.getElementById('infoClose').onclick = () => closeInfo();

  // Achievement modal
  const achvOpen = () => {
    document.getElementById('modalNodes').textContent = data.stats.total_nodes.toLocaleString();
    document.getElementById('modalEdges').textContent = data.stats.total_edges.toLocaleString();
    const lst = document.getElementById('achvList');
    lst.innerHTML = ACHIEVEMENTS.map(a => {
      const e = earnedAchv.has(a.id);
      return `<div class="achv-item ${e ? 'earned' : 'locked'}">
        <div class="icon">${a.icon}</div>
        <div>
          <div class="name">${a.name}</div>
          <div class="desc">${a.desc}</div>
        </div>
      </div>`;
    }).join('');
    document.getElementById('achvModal').classList.add('open');
  };
  document.getElementById('achvPanel').onclick = achvOpen;
  document.getElementById('lvBadge').onclick = achvOpen;
  document.getElementById('achvModalClose').onclick = () =>
    document.getElementById('achvModal').classList.remove('open');
  document.getElementById('achvModal').onclick = (e) => {
    if (e.target.id === 'achvModal') document.getElementById('achvModal').classList.remove('open');
  };

  // Initial UI sync
  refreshGameUI();

  // Play button: toggle inline YouTube player
  document.getElementById('playBtn').onclick = () => {
    const p = document.getElementById('infoPlayer');
    if (p.classList.contains('open')){
      resetPlayer();
    } else {
      startPlayer();
    }
  };

  // Genre filter panel
  buildFilterPanel();

  // Serendipity dice — preferentially surface an artist YOU haven't clicked yet.
  document.getElementById('dice').onclick = () => {
    // Filter to unvisited & not locked at current level (so the dice respects gating)
    const candidates = allNodeIds.filter(id =>
      isUnvisited(id) && !graph.getNodeAttribute(id, 'hidden') &&
      !isLockedByLevel(graph.getNodeAttributes(id))
    );
    const pool = candidates.length ? candidates : allNodeIds;
    if (!pool.length) return;
    // Weight by degree so well-connected hubs surface more often
    const weights = pool.map(id => Math.max(1, graph.getNodeAttribute(id, 'degree') || 1));
    const total = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    let pick = pool[0];
    for (let i = 0; i < pool.length; i++){
      r -= weights[i];
      if (r <= 0){ pick = pool[i]; break; }
    }
    state.diceCount = (state.diceCount || 0) + 1;
    lastClickViaChain = false;
    focusNode(pick);
  };

  // Search
  const inp = document.getElementById('searchInput');
  const sug = document.getElementById('suggestions');
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2) { sug.classList.remove('open'); return; }
    const matches = [];
    for (const id of allNodeIds) {
      const a = graph.getNodeAttributes(id);
      if (a.label.toLowerCase().includes(q)) {
        matches.push({ id, label: a.label, inColl: a.inCollection, genre: a.genre });
        if (matches.length >= 30) break;
      }
    }
    sug.innerHTML = matches.map(m =>
      `<a href="#" data-id="${m.id}" class="${m.inColl ? 'in-coll' : ''}">${m.label}<span class="sub">${m.genre || ''}</span></a>`
    ).join('');
    sug.classList.toggle('open', matches.length > 0);
    sug.querySelectorAll('a').forEach(a => {
      a.onclick = (e) => {
        e.preventDefault();
        focusNode(a.getAttribute('data-id'));
        sug.classList.remove('open');
        inp.value = a.textContent;
      };
    });
  });
  inp.addEventListener('blur', () => setTimeout(() => sug.classList.remove('open'), 200));

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('visitedCount').textContent = visited.size.toLocaleString();

  // Reset camera to a sensible overview (graph spans roughly [-1000, 1000])
  sigma.getCamera().setState({ x: 0.5, y: 0.5, ratio: 1.1, angle: 0 });

  // Surface today's pick as a clickable banner — no auto-camera-move so the
  // visitor still sees the whole universe at first paint.
  const today = pickOfTheDay();
  if (today && !visited.has(today)){
    const a = graph.getNodeAttributes(today);
    showTodayHint(a.label, today);
  }
}

function showTodayHint(label, id){
  let el = document.getElementById('today-hint');
  if (!el){
    el = document.createElement('div');
    el.id = 'today-hint';
    el.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);'
      + 'background:rgba(20,16,26,.96);border:1px solid var(--amber);'
      + 'border-radius:18px;padding:10px 22px;color:var(--amber-soft);'
      + 'font-family:Cormorant Garamond,serif;font-style:italic;font-size:13.5px;'
      + 'letter-spacing:.04em;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.55);'
      + 'cursor:pointer;backdrop-filter:blur(8px);transition:all .3s;';
    document.body.appendChild(el);
  }
  el.innerHTML = `今日のおすすめ: <strong style="color:var(--paper);font-weight:600">${label}</strong> <span style="opacity:.6;font-size:11px;margin-left:6px">クリックで訪れる →</span>`;
  el.onclick = () => {

function flashHint(text){
  let el = document.getElementById('hint');
  if (!el){
    el = document.createElement('div');
    el.id = 'hint';
    el.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);'

  el.style.opacity = '1';

function buildFilterPanel(){
  const counts = {};
  for (const id of allNodeIds){
    const g = graph.getNodeAttribute(id, 'genre') || 'unknown';
    counts[g] = (counts[g] || 0) + 1;
  }
  const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  const html = entries.map(([g, c]) => `
    <label class="item">
      <input type="checkbox" data-g="${g}" checked>
      <span class="swatch" style="background:${GENRE_COLORS[g] || '#7a2a3a'}"></span>
      <span>${g}</span>
      <span class="count">${c.toLocaleString()}</span>
    </label>`).join('');
  document.getElementById('filterItems').innerHTML = html;

  function applyFilter(){
    const enabled = new Set();
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => {
      if (cb.checked) enabled.add(cb.getAttribute('data-g'));
    });
    const unvisitedOnly = document.getElementById('filterPanel').dataset.unvisitedOnly === 'true';
    for (const id of allNodeIds){
      const g = graph.getNodeAttribute(id, 'genre') || 'unknown';
      const visible = enabled.has(g) && (!unvisitedOnly || isUnvisited(id));
      graph.setNodeAttribute(id, 'hidden', !visible);
    }
    sigma.refresh();
  }

  document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', applyFilter);
  });
  document.getElementById('filterAll').onclick = () => {
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => cb.checked = true);
    document.getElementById('filterPanel').dataset.collOnly = 'false';
    applyFilter();
  };
  document.getElementById('filterNone').onclick = () => {
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => cb.checked = false);
    applyFilter();
  };
  document.getElementById('filterUnvisited').onclick = () => {
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => cb.checked = true);
    document.getElementById('filterPanel').dataset.unvisitedOnly = 'true';
    applyFilter();
  };
}

function focusNode(id) {
  if (!graph.hasNode(id)) return;
  const a = graph.getNodeAttributes(id);
  const cam = sigma.getCamera();
  cam.animate({ x: a.x, y: a.y, ratio: 0.15 }, { duration: 600 });
  setTimeout(() => {
    showInfo(id);
    awardClick(id);
    // Tiny ripple at the canvas center for the search/dice/chain navigations
    ripple(window.innerWidth / 2, window.innerHeight / 2);
  }, 600);
}

let currentNodeId = null;

function showInfo(id) {
  const a = graph.getNodeAttributes(id);
  currentNodeId = id;
  document.getElementById('infoName').textContent = a.label;
  const wasVisited = visited.has(id);
  const sub = wasVisited
    ? `${(a.genre || '').toUpperCase()} · 再会`
    : `${(a.genre || '').toUpperCase()} · 初めての出会い`;
  document.getElementById('infoSub').textContent = sub;
  // Album: title only (year dropped per user request — cleaner)
  const albEl = document.getElementById('infoAlbum');
  if (a.album){
    albEl.innerHTML = `<span class="album-label">推奨盤</span>${a.album}`;
    albEl.style.display = '';
  } else {
    albEl.innerHTML = '';
    albEl.style.display = 'none';
  }
  // Player & button state — auto-load YouTube embed on click when we have an ID.
  resetPlayer();
  const playBtn = document.getElementById('playBtn');
  if (a.yt){
    playBtn.disabled = false;
    playBtn.title = 'クリックで停止';
    // Auto-start player so a click on a node = instant playback
    setTimeout(() => startPlayer(), 50);
  } else {
    playBtn.disabled = false;
    playBtn.textContent = '▶ YouTube で開く';
    playBtn.title = '即試聴IDなし — YouTube検索を新規タブで開きます';
  }
  // Meta — count similarity sources via incident edges
  const srcCount = {};
  graph.forEachEdge(id, (eid, attrs, s, t) => {
    const ss = attrs.src || [];
    for (const x of ss){ srcCount[x] = (srcCount[x] || 0) + 1; }
  });
  const SRC_LABEL = {
    lastfm: 'Last.fm',
    musicbrainz: 'MusicBrainz',
    wikipedia: 'Wikipedia',
    curated: '手選',
  };
  const srcStr = Object.entries(srcCount).sort((x,y) => y[1] - x[1])
    .map(([k,v]) => `${SRC_LABEL[k] || k} ${v}`).join(' · ');
  let meta = `関連 ${Math.round(a.degree || 0)} 作家`;
  if (a.origin) meta += `<br>出身: ${a.origin}`;
  if (a.country) meta += (a.origin ? ' · ' : '<br>出身: ') + a.country;
  if (a.years_active) meta += `<br>活動: ${a.years_active}`;
  if (srcStr) meta += `<br><span style="color:var(--ink-soft)">出典: ${srcStr}</span>`;
  document.getElementById('infoMeta').innerHTML = meta;
  // External links
  const enc = encodeURIComponent(a.label + (a.album ? ' ' + a.album : ''));
  const ytTab = a.yt
    ? `https://www.youtube.com/watch?v=${a.yt}`
    : `https://www.youtube.com/results?search_query=${encodeURIComponent(a.label + (a.album ? ' ' + a.album : ' full album'))}`;
  const amzMain = a.asin
    ? `https://www.amazon.co.jp/dp/${a.asin}?tag=viewsengineer-22`
    : `https://www.amazon.co.jp/s?k=${enc}&i=digital-music&tag=viewsengineer-22`;
  const links = [
    `<a href="${ytTab}" target="_blank" rel="noopener">YouTube ↗</a>`,
    `<a href="${amzMain}" target="_blank" rel="noopener sponsored">${a.asin ? '🎧 アルバムへ' : '🎧 Amazon'}</a>`,
    `<a href="https://www.last.fm/music/${encodeURIComponent(a.label)}" target="_blank" rel="noopener">📊 Last.fm</a>`,
  ];
  document.getElementById('infoLinks').innerHTML = links.join('');

  // つぎへ — chain to a related artist YOU haven't seen yet.
  const chainBtn = document.getElementById('chainBtn');
  if (chainBtn){
    const neighbors = [];
    graph.forEachNeighbor(id, (nid, attr) => {
      neighbors.push({nid, attrs: attr});
    });
    if (neighbors.length){
      chainBtn.style.display = '';
      chainBtn.onclick = () => {
        const fresh = neighbors.filter(n => !visited.has(n.nid) &&
          !isLockedByLevel(n.attrs));
        const pool = fresh.length ? fresh : neighbors;
        const next = pool[Math.floor(Math.random() * pool.length)];
        lastClickViaChain = true;
        focusNode(next.nid);
      };
    } else {
      chainBtn.style.display = 'none';
    }
  }
  document.getElementById('info').classList.add('open');
}

// Today's pick — deterministic artist (preferring well-connected hubs you
// haven't clicked yet). Refreshes daily so revisits feel new without state-loss.
function pickOfTheDay(){
  const unvisited = allNodeIds.filter(id => isUnvisited(id));
  const pool = unvisited.length ? unvisited : allNodeIds;
  // Sort by degree desc and pick a hub-ish but not the absolute top one
  const sorted = [...pool].sort((a, b) =>
    (graph.getNodeAttribute(b, 'degree') || 0) - (graph.getNodeAttribute(a, 'degree') || 0));
  const top = sorted.slice(0, Math.min(500, sorted.length));
  if (!top.length) return null;
  const today = new Date();
  const seed = today.getFullYear() * 1000 + today.getMonth() * 50 + today.getDate();
  return top[seed % top.length];
}

function resetPlayer(){
  const p = document.getElementById('infoPlayer');
  p.innerHTML = '';
  p.classList.remove('open');
  const btn = document.getElementById('playBtn');
  btn.classList.remove('playing');
}

function startPlayer(){
  if (!currentNodeId) return;
  const a = graph.getNodeAttributes(currentNodeId);
  const btn = document.getElementById('playBtn');
  if (!a.yt){
    // Fallback: open YouTube search in new tab
    const q = encodeURIComponent(a.label + (a.album ? ' ' + a.album : ' full album'));
    window.open(`https://www.youtube.com/results?search_query=${q}`, '_blank', 'noopener');
    return;
  }
  const p = document.getElementById('infoPlayer');
  // youtube.com/embed (NOT youtube-nocookie) so Premium-logged-in browsers
  // can pass auth cookies and skip ads. modestbranding=1 dampens YouTube logo.
  p.innerHTML = `<iframe src="https://www.youtube.com/embed/${a.yt}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  p.classList.add('open');
  btn.classList.add('playing');
  btn.textContent = '■ 停止';
}

function closeInfo() {
  document.getElementById('info').classList.remove('open');
  resetPlayer();
  currentNodeId = null;
}

main().catch(err => {
  console.error(err);
  document.getElementById('loading').textContent = 'load failed: ' + err.message;
});
</script>
