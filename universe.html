<script>
// Genre color palette
const GENRE_COLORS = {
  ambient: '#7a4af0',
  classic: '#d4a050',
  jazz: '#5fc8ff',
  metal: '#e23a4e',
  progressive: '#9b58e0',
  healing: '#f0c878',
  celt: '#54c878',
  jpop: '#ff6b9d',
  anime: '#ff9d6b',
  game: '#6bbeff',
  indies: '#a87adb',
  'pop-rock': '#f5a042',
  'blues-folk': '#c87a4a',
  nature: '#88c878',
  unknown: '#7a2a3a',
};

async function loadGraph() {
  try {
    const r = await fetch('scripts/universe.json');
    if (!r.ok) throw new Error('universe.json not found — run build_universe.py');
    return await r.json();
  } catch (e) {
    document.getElementById('loading').textContent = 'universe loading… ' + e.message;
    throw e;
  }
}

// Hex color mix for visited dimming
function mixColor(hex1, hex2, t){
  function p(h){ h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  if (!hex1 || !hex1.startsWith('#') || hex1.length < 7) return hex2;
  const a = p(hex1), b = p(hex2);
  const m = a.map((v,i) => Math.round(v * (1-t) + b[i] * t));
  return '#' + m.map(v => v.toString(16).padStart(2,'0')).join('');
}

function buildGraph(data) {
  const Graph = graphology.Graph;
  const g = new Graph({ type: 'undirected', multi: false });
  for (const n of data.nodes) {
    const color = GENRE_COLORS[n.genre] || GENRE_COLORS.unknown;
    g.addNode(n.id, {
      label: n.name,
      x: n.x ?? Math.random() * 100 - 50,
      y: n.y ?? Math.random() * 100 - 50,
      size: n.r ?? 2.5,
      color: color,
      origColor: color,
      genre: n.genre,
      inCollection: n.in_collection,
      album: n.album,
      degree: n.degree,
      yt: n.yt,
      asin: n.asin,
      origin: n.origin,
      country: n.country,
      years_active: n.years_active,
      mb_tags: n.mb_tags,
      mbid: n.mbid,
    });
  }
  for (const e of data.edges) {
    if (g.hasNode(e.source) && g.hasNode(e.target) && !g.hasEdge(e.source, e.target)) {
      // Multi-source edges drawn brighter
      const nSrc = (e.src || []).length;
      const alpha = 0.04 + 0.06 * Math.min(nSrc - 1, 3);
      g.addEdge(e.source, e.target, {
        size: 0.4 + 0.3 * Math.min(nSrc - 1, 2),
        color: `rgba(212,160,80,${alpha.toFixed(3)})`,
        origColor: `rgba(212,160,80,${alpha.toFixed(3)})`,
        weight: e.weight,
        src: e.src || [],
      });
    }
  }
  return g;
}

let sigma, graph, allNodeIds, hoveredNode;

// Track which artists the user has clicked (localStorage-persisted).
const VISITED_KEY = 'salon_universe_visited_v1';
let visited = new Set();
try {
  const raw = localStorage.getItem(VISITED_KEY);
  if (raw) visited = new Set(JSON.parse(raw));
} catch {}
function markVisited(id){
  visited.add(id);
  try { localStorage.setItem(VISITED_KEY, JSON.stringify([...visited])); } catch {}
  document.getElementById('visitedCount').textContent = visited.size.toLocaleString();
  // Trigger a redraw so the visited node gets desaturated
  if (sigma) sigma.refresh();
}

function isUnvisited(id){ return !visited.has(id); }

async function main() {
  const data = await loadGraph();
  graph = buildGraph(data);

  // Spread overlapping nodes apart while preserving the layout structure.
  try {
    if (window.graphologyLibrary && window.graphologyLibrary.NoverlapLayout){
      window.graphologyLibrary.NoverlapLayout.assign(graph, {
        maxIterations: 80,
        settings: { margin: 1.5, ratio: 1.2, expansion: 1.05, gridSize: 24, speed: 3 },
      });
    }
  } catch (e) { console.warn('noverlap failed', e); }

  document.getElementById('statNodes').textContent = data.stats.total_nodes.toLocaleString();
  document.getElementById('statEdges').textContent = data.stats.total_edges.toLocaleString();
  document.getElementById('statColl').textContent = data.stats.in_collection.toLocaleString();
  // Sources breakdown
  if (data.stats.edges_by_source){
    const order = ['lastfm', 'wikipedia', 'musicbrainz', 'curated'];
    const labels = {lastfm: 'Last.fm', wikipedia: 'Wikipedia', musicbrainz: 'MusicBrainz', curated: '手選'};
    const parts = [];
    for (const k of order){
      const c = data.stats.edges_by_source[k];
      if (c) parts.push(`${labels[k]} ${c.toLocaleString()}`);
    }
    if (data.stats.multi_source_edges){
      parts.push(`<span style="color:var(--amber)">複合 ${data.stats.multi_source_edges.toLocaleString()}</span>`);
    }
    const sb = document.createElement('span');
    sb.innerHTML = ' · ' + parts.join(' · ');
    sb.style.color = 'var(--ink-soft)';
    sb.style.fontSize = '10px';
    document.querySelector('.stats').appendChild(sb);
  }
  allNodeIds = graph.nodes();

  sigma = new Sigma(graph, document.getElementById('graph'), {
    renderEdgeLabels: false,
    labelSize: 11,
    labelWeight: 'normal',
    labelColor: { color: '#f0e8d8' },
    labelDensity: 1.2,
    labelGridCellSize: 60,
    labelRenderedSizeThreshold: 4,  // show more labels at zoom
    enableEdgeEvents: false,
    minCameraRatio: 0.005,  // 200x zoom in (was 20x)
    maxCameraRatio: 80,
    // Reducer hooks for hover-highlighting + visited-state styling
    nodeReducer: (id, attrs) => {
      const r = { ...attrs };
      // Visited nodes are muted/desaturated so unvisited ones pop out
      if (visited.has(id)){
        r.color = mixColor(attrs.origColor, '#3a2438', 0.55);
      }
      // Hover dim
      if (hoveredNode && id !== hoveredNode && !graph.hasEdge(hoveredNode, id) && !graph.hasEdge(id, hoveredNode)) {
        r.color = '#2a1830';
        r.label = '';
      }
      return r;
    },
    edgeReducer: (id, attrs) => {
      const r = { ...attrs };
      if (hoveredNode && !graph.hasExtremity(id, hoveredNode)) {
        r.hidden = true;
      }
      if (hoveredNode && graph.hasExtremity(id, hoveredNode)) {
        r.color = 'rgba(240,200,120,0.6)';
        r.size = 1.4;
      }
      return r;
    },
  });

  // Hover & click
  sigma.on('enterNode', ({ node }) => {
    hoveredNode = node;
    sigma.refresh();
  });
  sigma.on('leaveNode', () => {
    hoveredNode = null;
    sigma.refresh();
  });
  sigma.on('clickNode', ({ node }) => { showInfo(node); markVisited(node); });
  // clickStage: don't close info (info has its own × button) — instead just deselect any hover
  sigma.on('clickStage', () => { /* keep info open */ });

  // Controls
  document.getElementById('zoomIn').onclick = () => {
    const cam = sigma.getCamera();
    cam.animatedZoom({ duration: 300 });
  };
  document.getElementById('zoomOut').onclick = () => {
    const cam = sigma.getCamera();
    cam.animatedUnzoom({ duration: 300 });
  };
  document.getElementById('zoomReset').onclick = () => {
    sigma.getCamera().animatedReset({ duration: 500 });
  };
  document.getElementById('infoClose').onclick = () => closeInfo();

  // Play button: toggle inline YouTube player
  document.getElementById('playBtn').onclick = () => {
    const p = document.getElementById('infoPlayer');
    if (p.classList.contains('open')){
      resetPlayer();
    } else {
      startPlayer();
    }
  };

  // Genre filter panel
  buildFilterPanel();

  // Serendipity dice — preferentially surface an artist YOU haven't clicked yet.
  document.getElementById('dice').onclick = () => {
    const unvisited = allNodeIds.filter(id => isUnvisited(id) && !graph.getNodeAttribute(id, 'hidden'));
    const pool = unvisited.length ? unvisited : allNodeIds;
    if (!pool.length) return;
    // Weight by degree so well-connected hubs surface more often
    const weights = pool.map(id => Math.max(1, graph.getNodeAttribute(id, 'degree') || 1));
    const total = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    let pick = pool[0];
    for (let i = 0; i < pool.length; i++){
      r -= weights[i];
      if (r <= 0){ pick = pool[i]; break; }
    }
    focusNode(pick);
  };

  // Search
  const inp = document.getElementById('searchInput');
  const sug = document.getElementById('suggestions');
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2) { sug.classList.remove('open'); return; }
    const matches = [];
    for (const id of allNodeIds) {
      const a = graph.getNodeAttributes(id);
      if (a.label.toLowerCase().includes(q)) {
        matches.push({ id, label: a.label, inColl: a.inCollection, genre: a.genre });
        if (matches.length >= 30) break;
      }
    }
    sug.innerHTML = matches.map(m =>
      `<a href="#" data-id="${m.id}" class="${m.inColl ? 'in-coll' : ''}">${m.label}<span class="sub">${m.genre || ''}</span></a>`
    ).join('');
    sug.classList.toggle('open', matches.length > 0);
    sug.querySelectorAll('a').forEach(a => {
      a.onclick = (e) => {
        e.preventDefault();
        focusNode(a.getAttribute('data-id'));
        sug.classList.remove('open');
        inp.value = a.textContent;
      };
    });
  });
  inp.addEventListener('blur', () => setTimeout(() => sug.classList.remove('open'), 200));

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('visitedCount').textContent = visited.size.toLocaleString();

  // Reset camera to a sensible overview (graph spans roughly [-1000, 1000])
  sigma.getCamera().setState({ x: 0.5, y: 0.5, ratio: 1.1, angle: 0 });

  // Surface today's pick as a clickable banner — no auto-camera-move so the
  // visitor still sees the whole universe at first paint.
  const today = pickOfTheDay();
  if (today && !visited.has(today)){
    const a = graph.getNodeAttributes(today);
    showTodayHint(a.label, today);
  }
}

function showTodayHint(label, id){
  let el = document.getElementById('today-hint');
  if (!el){
    el = document.createElement('div');
    el.id = 'today-hint';
    el.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);'
      + 'background:rgba(20,16,26,.96);border:1px solid var(--amber);'
      + 'border-radius:18px;padding:10px 22px;color:var(--amber-soft);'
      + 'font-family:Cormorant Garamond,serif;font-style:italic;font-size:13.5px;'
      + 'letter-spacing:.04em;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.55);'
      + 'cursor:pointer;backdrop-filter:blur(8px);transition:all .3s;';
    document.body.appendChild(el);
  }
  el.innerHTML = `今日のおすすめ: <strong style="color:var(--paper);font-weight:600">${label}</strong> <span style="opacity:.6;font-size:11px;margin-left:6px">クリックで訪れる →</span>`;
  el.onclick = () => {
    focusNode(id);
    markVisited(id);
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 400);
  };
  // Auto-fade after a while if the visitor doesn't engage
  setTimeout(() => {
    if (el && document.body.contains(el)) {
      el.style.opacity = '0.4';
    }
  }, 8000);
}

function flashHint(text){
  let el = document.getElementById('hint');
  if (!el){
    el = document.createElement('div');
    el.id = 'hint';
    el.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);'
      + 'background:rgba(20,16,26,.96);border:1px solid var(--amber);'
      + 'border-radius:18px;padding:8px 18px;color:var(--amber-soft);'
      + 'font-family:Cormorant Garamond,serif;font-style:italic;font-size:13px;'
      + 'letter-spacing:.04em;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.5);'
      + 'transition:opacity .4s;backdrop-filter:blur(8px);';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 4500);
}

function buildFilterPanel(){
  const counts = {};
  for (const id of allNodeIds){
    const g = graph.getNodeAttribute(id, 'genre') || 'unknown';
    counts[g] = (counts[g] || 0) + 1;
  }
  const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  const html = entries.map(([g, c]) => `
    <label class="item">
      <input type="checkbox" data-g="${g}" checked>
      <span class="swatch" style="background:${GENRE_COLORS[g] || '#7a2a3a'}"></span>
      <span>${g}</span>
      <span class="count">${c.toLocaleString()}</span>
    </label>`).join('');
  document.getElementById('filterItems').innerHTML = html;

  function applyFilter(){
    const enabled = new Set();
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => {
      if (cb.checked) enabled.add(cb.getAttribute('data-g'));
    });
    const unvisitedOnly = document.getElementById('filterPanel').dataset.unvisitedOnly === 'true';
    for (const id of allNodeIds){
      const g = graph.getNodeAttribute(id, 'genre') || 'unknown';
      const visible = enabled.has(g) && (!unvisitedOnly || isUnvisited(id));
      graph.setNodeAttribute(id, 'hidden', !visible);
    }
    sigma.refresh();
  }

  document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', applyFilter);
  });
  document.getElementById('filterAll').onclick = () => {
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => cb.checked = true);
    document.getElementById('filterPanel').dataset.collOnly = 'false';
    applyFilter();
  };
  document.getElementById('filterNone').onclick = () => {
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => cb.checked = false);
    applyFilter();
  };
  document.getElementById('filterUnvisited').onclick = () => {
    document.querySelectorAll('.filter-panel input[type=checkbox]').forEach(cb => cb.checked = true);
    document.getElementById('filterPanel').dataset.unvisitedOnly = 'true';
    applyFilter();
  };
}

function focusNode(id) {
  if (!graph.hasNode(id)) return;
  const a = graph.getNodeAttributes(id);
  const cam = sigma.getCamera();
  cam.animate({ x: a.x, y: a.y, ratio: 0.15 }, { duration: 600 });
  setTimeout(() => showInfo(id), 600);
}

let currentNodeId = null;

function showInfo(id) {
  const a = graph.getNodeAttributes(id);
  currentNodeId = id;
  document.getElementById('infoName').textContent = a.label;
  const wasVisited = visited.has(id);
  const sub = wasVisited
    ? `${(a.genre || '').toUpperCase()} · 再会`
    : `${(a.genre || '').toUpperCase()} · 初めての出会い`;
  document.getElementById('infoSub').textContent = sub;
  // Album: title only (year dropped per user request — cleaner)
  const albEl = document.getElementById('infoAlbum');
  if (a.album){
    albEl.innerHTML = `<span class="album-label">推奨盤</span>${a.album}`;
    albEl.style.display = '';
  } else {
    albEl.innerHTML = '';
    albEl.style.display = 'none';
  }
  // Player & button state — auto-load YouTube embed on click when we have an ID.
  resetPlayer();
  const playBtn = document.getElementById('playBtn');
  if (a.yt){
    playBtn.disabled = false;
    playBtn.title = 'クリックで停止';
    // Auto-start player so a click on a node = instant playback
    setTimeout(() => startPlayer(), 50);
  } else {
    playBtn.disabled = false;
    playBtn.textContent = '▶ YouTube で開く';
    playBtn.title = '即試聴IDなし — YouTube検索を新規タブで開きます';
  }
  // Meta — count similarity sources via incident edges
  const srcCount = {};
  graph.forEachEdge(id, (eid, attrs, s, t) => {
    const ss = attrs.src || [];
    for (const x of ss){ srcCount[x] = (srcCount[x] || 0) + 1; }
  });
  const SRC_LABEL = {
    lastfm: 'Last.fm',
    musicbrainz: 'MusicBrainz',
    wikipedia: 'Wikipedia',
    curated: '手選',
  };
  const srcStr = Object.entries(srcCount).sort((x,y) => y[1] - x[1])
    .map(([k,v]) => `${SRC_LABEL[k] || k} ${v}`).join(' · ');
  let meta = `関連 ${Math.round(a.degree || 0)} 作家`;
  if (a.origin) meta += `<br>出身: ${a.origin}`;
  if (a.country) meta += (a.origin ? ' · ' : '<br>出身: ') + a.country;
  if (a.years_active) meta += `<br>活動: ${a.years_active}`;
  if (srcStr) meta += `<br><span style="color:var(--ink-soft)">出典: ${srcStr}</span>`;
  document.getElementById('infoMeta').innerHTML = meta;
  // External links
  const enc = encodeURIComponent(a.label + (a.album ? ' ' + a.album : ''));
  const ytTab = a.yt
    ? `https://www.youtube.com/watch?v=${a.yt}`
    : `https://www.youtube.com/results?search_query=${encodeURIComponent(a.label + (a.album ? ' ' + a.album : ' full album'))}`;
  const amzMain = a.asin
    ? `https://www.amazon.co.jp/dp/${a.asin}?tag=viewsengineer-22`
    : `https://www.amazon.co.jp/s?k=${enc}&i=digital-music&tag=viewsengineer-22`;
  const links = [
    `<a href="${ytTab}" target="_blank" rel="noopener">YouTube ↗</a>`,
    `<a href="${amzMain}" target="_blank" rel="noopener sponsored">${a.asin ? '🎧 アルバムへ' : '🎧 Amazon'}</a>`,
    `<a href="https://www.last.fm/music/${encodeURIComponent(a.label)}" target="_blank" rel="noopener">📊 Last.fm</a>`,
  ];
  document.getElementById('infoLinks').innerHTML = links.join('');

  // つぎへ — chain to a related artist YOU haven't seen yet.
  const chainBtn = document.getElementById('chainBtn');
  if (chainBtn){
    const neighbors = [];
    graph.forEachNeighbor(id, (nid, attr) => {
      neighbors.push({nid, attrs: attr});
    });
    if (neighbors.length){
      chainBtn.style.display = '';
      chainBtn.onclick = () => {
        const fresh = neighbors.filter(n => !visited.has(n.nid));
        const pool = fresh.length ? fresh : neighbors;
        const next = pool[Math.floor(Math.random() * pool.length)];
        focusNode(next.nid);
      };
    } else {
      chainBtn.style.display = 'none';
    }
  }
  document.getElementById('info').classList.add('open');
}

// Today's pick — deterministic artist (preferring well-connected hubs you
// haven't clicked yet). Refreshes daily so revisits feel new without state-loss.
function pickOfTheDay(){
  const unvisited = allNodeIds.filter(id => isUnvisited(id));
  const pool = unvisited.length ? unvisited : allNodeIds;
  // Sort by degree desc and pick a hub-ish but not the absolute top one
  const sorted = [...pool].sort((a, b) =>
    (graph.getNodeAttribute(b, 'degree') || 0) - (graph.getNodeAttribute(a, 'degree') || 0));
  const top = sorted.slice(0, Math.min(500, sorted.length));
  if (!top.length) return null;
  const today = new Date();
  const seed = today.getFullYear() * 1000 + today.getMonth() * 50 + today.getDate();
  return top[seed % top.length];
}

function resetPlayer(){
  const p = document.getElementById('infoPlayer');
  p.innerHTML = '';
  p.classList.remove('open');
  const btn = document.getElementById('playBtn');
  btn.classList.remove('playing');
}

function startPlayer(){
  if (!currentNodeId) return;
  const a = graph.getNodeAttributes(currentNodeId);
  const btn = document.getElementById('playBtn');
  if (!a.yt){
    // Fallback: open YouTube search in new tab
    const q = encodeURIComponent(a.label + (a.album ? ' ' + a.album : ' full album'));
    window.open(`https://www.youtube.com/results?search_query=${q}`, '_blank', 'noopener');
    return;
  }
  const p = document.getElementById('infoPlayer');
  p.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${a.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  p.classList.add('open');
  btn.classList.add('playing');
  btn.textContent = '■ 停止';
}

function closeInfo() {
  document.getElementById('info').classList.remove('open');
  resetPlayer();
  currentNodeId = null;
}

main().catch(err => {
  console.error(err);
  document.getElementById('loading').textContent = 'load failed: ' + err.message;
});
</script>
