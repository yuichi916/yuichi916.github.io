<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>CG2 render</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:"Yu Mincho","Noto Serif JP",serif}
.st{position:relative;width:1280px;height:720px;overflow:hidden;background:#05070c;display:none}
.st.on{display:block}
.cbar{position:absolute;left:0;right:0;height:9.5%;background:#000;z-index:20}
.cT{top:0}.cB{bottom:0}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 200px rgba(2,4,10,.7);z-index:15}

/* ===== A: ミイラの絵(はみ出した色の花) ===== */
#A .bgi{position:absolute;inset:-4%;background:url('assets/seikai/op3d/townarc/f0050.jpg') center 62%/cover;filter:brightness(.5) saturate(.55) blur(2px)}
#A .paper{position:absolute;left:50%;top:50%;width:56%;height:74%;transform:translate(-50%,-50%) rotate(-3.2deg);
  background:linear-gradient(160deg,#efe7d6,#ded3bd);box-shadow:0 26px 60px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.15);
  border-radius:2px}
#A .paper::after{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 50%),
  radial-gradient(ellipse at 80% 90%,rgba(120,100,70,.22),transparent 46%)}
#A .crayon{position:absolute;border-radius:50%;filter:blur(.4px)}
#A .stem{position:absolute;background:#4b7a3a;border-radius:2px;filter:blur(.3px)}
#A .over{position:absolute;border-radius:50%;filter:blur(2.4px);mix-blend-mode:multiply}
#A .warm{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,220,160,.22),transparent 58%);z-index:12}

/* ===== B: ノノと夢(空を見たかった妹) ===== */
#B .bgi{position:absolute;inset:-6%;background:url('assets/seikai/bg-dream.jpg') center/cover;filter:brightness(.72) saturate(.8) contrast(1.05)}
#B .haze{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 46%,rgba(150,200,255,.30),transparent 56%),
  linear-gradient(180deg,rgba(180,214,255,.22),rgba(6,10,20,.5));mix-blend-mode:screen}
#B .nono{position:absolute;left:50%;bottom:6%;height:74%;transform:translateX(-50%);
  filter:drop-shadow(0 14px 40px rgba(0,0,0,.7)) brightness(1.06) saturate(.9);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,rgba(0,0,0,.35) 82%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 55%,rgba(0,0,0,.35) 82%,transparent 100%);
  opacity:.86}
#B .glow{position:absolute;left:50%;bottom:8%;width:44%;height:78%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 46%,rgba(200,230,255,.34),transparent 62%);filter:blur(6px)}
#B .mote{position:absolute;background:rgba(220,238,255,.75);border-radius:50%}
#B .sky{position:absolute;left:50%;top:14%;width:26%;height:26%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 44% 40%,#eaf6ff,#a9d2f5 52%,rgba(150,200,240,.12) 100%);
  box-shadow:0 0 80px 26px rgba(180,220,255,.4);opacity:.62}
</style></head>
<body>
<div class="st on" id="A">
  <div class="bgi"></div>
  <div class="paper" id="pap"></div>
  <div class="warm"></div>
  <div class="vig"></div><div class="cbar cT"></div><div class="cbar cB"></div>
</div>
<div class="st" id="B">
  <div class="bgi"></div><div class="haze"></div>
  <div class="sky"></div>
  <div class="glow"></div>
  <img class="nono" src="assets/seikai/cg-imouto.png">
  <div id="motes"></div>
  <div class="vig"></div><div class="cbar cT"></div><div class="cbar cB"></div>
</div>
<script>
// A: はみ出した色の花(赤/青/黄) — 不器用な線とはみ出た色
const P=document.getElementById('pap');
const FL=[[26,42,'#d9483f'],[52,32,'#2f6fb5'],[74,48,'#e0b52c'],[38,66,'#d9483f'],[62,70,'#2f6fb5']];
let h='';
FL.forEach(([x,y,c],i)=>{
  // はみ出した色(輪郭からズレた塗り)
  h+='<div class="over" style="left:'+(x-9)+'%;top:'+(y-8)+'%;width:22%;height:19%;background:'+c+';opacity:.30"></div>';
  // 花びら5枚(不器用な円)
  for(let k=0;k<5;k++){
    const a=k*72*Math.PI/180+i;
    h+='<div class="crayon" style="left:'+(x+Math.cos(a)*6.6-3.4)+'%;top:'+(y+Math.sin(a)*7.4-3.8)+'%;width:7.6%;height:8.2%;background:'+c+';opacity:.9"></div>';
  }
  h+='<div class="crayon" style="left:'+(x-2.6)+'%;top:'+(y-2.9)+'%;width:5.4%;height:6%;background:#e8c840;opacity:.95"></div>';
  h+='<div class="stem" style="left:'+(x-0.5)+'%;top:'+(y+6)+'%;width:1.2%;height:'+(20-i*1.5)+'%;transform:rotate('+(i%2?4:-5)+'deg)"></div>';
});
P.innerHTML=h;
// B: 夢の粒子
let m='';
for(let i=0;i<80;i++){ const s=(1+Math.random()*3).toFixed(1);
  m+='<div class="mote" style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*92).toFixed(1)+'%;width:'+s+'px;height:'+s+'px;opacity:'+(0.25+Math.random()*0.6).toFixed(2)+'"></div>'; }
document.getElementById('motes').innerHTML=m;
window.__show=function(id){ document.querySelectorAll('.st').forEach(e=>e.classList.remove('on')); document.getElementById(id).classList.add('on'); };
</script>
</body></html>
