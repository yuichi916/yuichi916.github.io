<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>CG2 render</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:"Yu Mincho","Noto Serif JP",serif}
.st{position:relative;width:1280px;height:720px;overflow:hidden;background:#05070c;display:none}
.st.on{display:block}
.cbar{position:absolute;left:0;right:0;height:9.5%;background:#000;z-index:20}
.cT{top:0}.cB{bottom:0}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 200px rgba(2,4,10,.7);z-index:15}

/* ===== A: ミイラの絵(はみ出した色の花) ===== */
#A .bgi{position:absolute;inset:-4%;background:url('assets/seikai/op3d/townarc/f0050.jpg') center 62%/cover;filter:brightness(.5) saturate(.55) blur(2px)}
#A .paper{position:absolute;left:34%;top:50%;width:47%;height:70%;transform:translate(-50%,-50%) rotate(-3.6deg);
  background:linear-gradient(160deg,#efe7d6,#ded3bd);box-shadow:0 26px 60px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.15);
  border-radius:2px}
#A .paper::after{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 50%),
  radial-gradient(ellipse at 80% 90%,rgba(120,100,70,.22),transparent 46%)}
#A .crayon{position:absolute;border-radius:50%;filter:blur(.4px)}
#A .stem{position:absolute;background:#4b7a3a;border-radius:2px;filter:blur(.3px)}
#A .over{position:absolute;border-radius:50%;filter:blur(2.4px);mix-blend-mode:multiply}
#A .warm{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 45%,rgba(255,220,160,.20),transparent 58%);z-index:12}
#A .mii{position:absolute;right:2%;bottom:-2%;height:92%;z-index:11;
  filter:drop-shadow(0 14px 40px rgba(0,0,0,.8)) brightness(.94) contrast(1.03)}
#A .miiglow{position:absolute;right:4%;bottom:2%;width:34%;height:80%;z-index:10;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,226,170,.22),transparent 62%);filter:blur(8px)}

/* ===== B: ノノと夢(空を見たかった妹) ===== */
#B .bgi{position:absolute;inset:-6%;background:url('assets/seikai/bg-dream.jpg') center/cover;filter:brightness(.72) saturate(.8) contrast(1.05)}
#B .haze{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 46%,rgba(150,200,255,.30),transparent 56%),
  linear-gradient(180deg,rgba(180,214,255,.22),rgba(6,10,20,.5));mix-blend-mode:screen}
#B .nono{position:absolute;left:50%;bottom:6%;height:74%;transform:translateX(-50%);
  filter:drop-shadow(0 14px 40px rgba(0,0,0,.7)) brightness(1.06) saturate(.9);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,rgba(0,0,0,.35) 82%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 55%,rgba(0,0,0,.35) 82%,transparent 100%);
  opacity:.86}
#B .glow{position:absolute;left:50%;bottom:8%;width:44%;height:78%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 46%,rgba(200,230,255,.34),transparent 62%);filter:blur(6px)}
#B .mote{position:absolute;background:rgba(220,238,255,.75);border-radius:50%}
#B .sky{position:absolute;left:50%;top:14%;width:26%;height:26%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 44% 40%,#eaf6ff,#a9d2f5 52%,rgba(150,200,240,.12) 100%);
  box-shadow:0 0 80px 26px rgba(180,220,255,.4);opacity:.62}
</style></head>
<body>
<div class="st on" id="A">
  <div class="bgi"></div>
  <div class="paper" id="pap"></div>
  <img class="mii" src="assets/seikai/cg-miira.png">
  <div class="miiglow"></div>
  <div class="warm"></div>
  <div class="vig"></div><div class="cbar cT"></div><div class="cbar cB"></div>
</div>
<div class="st" id="B">
  <div class="bgi"></div><div class="haze"></div>
  <div class="sky"></div>
  <div class="glow"></div>
  <img class="nono" src="assets/seikai/cg-imouto.png">
  <div id="motes"></div>
  <div class="vig"></div><div class="cbar cT"></div><div class="cbar cB"></div>
</div>
<script>
// A: 子供の手描きクレヨン画(歪んだ線・塗りのはみ出し・重ね塗り)
const P=document.getElementById('pap');
// 決定的な擬似乱数(毎回同じ絵に)
let _s=20260728; const rnd=()=>{ _s=(_s*1103515245+12345)&0x7fffffff; return _s/0x7fffffff; };
const jit=(v,a)=>v+(rnd()*2-1)*a;
// 手描きの閉曲線(円を歪ませたベジェ)
function wobbleBlob(cx,cy,r,n,wob){
  let d='';
  const pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const rr=r*(1+(rnd()*2-1)*wob);
    pts.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*(0.86+rnd()*0.28)]);
  }
  d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for(let i=0;i<n;i++){
    const p1=pts[(i+1)%n], p0=pts[i];
    const mx=(p0[0]+p1[0])/2+jit(0,r*0.22), my=(p0[1]+p1[1])/2+jit(0,r*0.22);
    d+=' Q'+mx.toFixed(1)+','+my.toFixed(1)+' '+p1[0].toFixed(1)+','+p1[1].toFixed(1);
  }
  return d+'Z';
}
// 手描きの線(ゆらぐ)
function wobbleLine(x1,y1,x2,y2,seg,wob){
  let d='M'+x1.toFixed(1)+','+y1.toFixed(1);
  for(let i=1;i<=seg;i++){
    const t=i/seg;
    d+=' L'+jit(x1+(x2-x1)*t,wob).toFixed(1)+','+jit(y1+(y2-y1)*t,wob*0.6).toFixed(1);
  }
  return d;
}
const FL=[[190,300,'#c9382f','#e2564a'],[430,190,'#2a5f9e','#4b86c4'],[690,320,'#d9a41f','#efc244'],[300,520,'#3f8a46','#5faa62'],[610,540,'#a8408f','#c266ac']];
let sv='<svg viewBox="0 0 900 700" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">';
sv+='<defs><filter id="cr" x="-20%" y="-20%" width="140%" height="140%">'
  +'<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>'
  +'<feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>'
  +'<filter id="cr2" x="-20%" y="-20%" width="140%" height="140%">'
  +'<feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3" result="n2"/>'
  +'<feDisplacementMap in="SourceGraphic" in2="n2" scale="2.2"/></filter></defs>';
FL.forEach(([cx,cy,dark,light],i)=>{
  // ① はみ出した塗り(輪郭より先に、ずらして塗る)
  sv+='<path d="'+wobbleBlob(cx+jit(0,16),cy+jit(0,14),74,9,0.20)+'" fill="'+light+'" opacity="0.5" filter="url(#cr)"/>';
  // ② 花びら5枚(歪んだ塊)
  for(let k=0;k<5;k++){
    const a=k*72*Math.PI/180+i*0.6;
    sv+='<path d="'+wobbleBlob(cx+Math.cos(a)*52,cy+Math.sin(a)*52,34,8,0.26)+'" fill="'+light+'" opacity="0.92" filter="url(#cr)"/>';
    sv+='<path d="'+wobbleBlob(cx+Math.cos(a)*52,cy+Math.sin(a)*52,34,8,0.26)+'" fill="none" stroke="'+dark+'" stroke-width="4.5" stroke-linejoin="round" opacity="0.75" filter="url(#cr2)"/>';
  }
  // ③ 中心(黄・ぐるぐる塗り)
  sv+='<path d="'+wobbleBlob(cx,cy,27,8,0.2)+'" fill="#efc93f" filter="url(#cr)"/>';
  for(let k=0;k<3;k++) sv+='<path d="'+wobbleBlob(cx,cy,20-k*6,7,0.3)+'" fill="none" stroke="#c99a1e" stroke-width="3" opacity="0.6" filter="url(#cr2)"/>';
  // ④ 茎(ゆらぐ線)+葉
  const sy=cy+66, ey=cy+66+(150-i*14);
  sv+='<path d="'+wobbleLine(cx+jit(0,6),sy,cx+jit(0,18),ey,7,7)+'" fill="none" stroke="#4b8a3c" stroke-width="9" stroke-linecap="round" opacity="0.9" filter="url(#cr2)"/>';
  sv+='<path d="'+wobbleBlob(cx+jit(26,10),sy+58,26,7,0.32)+'" fill="#57a044" opacity="0.85" filter="url(#cr)"/>';
});
// ⑤ 地面の線(子供が引く一本線)
sv+='<path d="'+wobbleLine(40,640,860,632,14,9)+'" fill="none" stroke="#6b8f4a" stroke-width="10" stroke-linecap="round" opacity="0.8" filter="url(#cr2)"/>';
// ⑥ 太陽(隅にはみ出す)
sv+='<path d="'+wobbleBlob(806,96,64,9,0.18)+'" fill="#f0c53c" opacity="0.85" filter="url(#cr)"/>';
for(let k=0;k<8;k++){ const a=k*45*Math.PI/180;
  sv+='<path d="'+wobbleLine(806+Math.cos(a)*70,96+Math.sin(a)*70,806+Math.cos(a)*104,96+Math.sin(a)*104,3,6)+'" fill="none" stroke="#e8b62c" stroke-width="7" stroke-linecap="round" opacity="0.8" filter="url(#cr2)"/>'; }
sv+='</svg>';
P.innerHTML=sv;
// B: 夢の粒子
let m='';
for(let i=0;i<80;i++){ const s=(1+Math.random()*3).toFixed(1);
  m+='<div class="mote" style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*92).toFixed(1)+'%;width:'+s+'px;height:'+s+'px;opacity:'+(0.25+Math.random()*0.6).toFixed(2)+'"></div>'; }
document.getElementById('motes').innerHTML=m;
window.__show=function(id){ document.querySelectorAll('.st').forEach(e=>e.classList.remove('on')); document.getElementById(id).classList.add('on'); };
</script>
</body></html>
