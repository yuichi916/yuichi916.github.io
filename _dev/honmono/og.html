<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>honmono og</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(700px 400px at 95% 0%,rgba(184,69,47,.12),transparent 60%),linear-gradient(180deg,#f6efe1,#efe3cc);color:#2a2118;
  font-family:"Shippori Mincho",serif;display:grid;grid-template-columns:520px 1fr;gap:36px;padding:64px 64px 56px}
.l{display:flex;flex-direction:column;justify-content:center}
.eb{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;color:#b8452f;letter-spacing:.3em;font-size:22px}
h1{font-size:104px;font-weight:800;line-height:1.08;margin:18px 0 22px;letter-spacing:.02em}
h1 em{font-style:normal;color:#b8452f}
.sub{font-size:28px;line-height:1.5;font-weight:500}
.meta{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:20px;color:#6d5f4f;margin-top:22px}
.r{display:grid;grid-template-rows:1fr 1fr;gap:20px;align-content:center}
.c{position:relative;background:#fffaf0;border:2px solid rgba(60,40,20,.18);border-radius:18px;padding:46px 28px 22px;font-size:25px;line-height:1.75;overflow:hidden}
.c b{position:absolute;top:12px;left:24px;font-family:"M PLUS Rounded 1c",sans-serif;font-size:20px;color:#9a8b78;letter-spacing:.1em}
.c i{position:absolute;top:10px;right:18px;font-style:normal;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:22px;color:#fff;background:#2a2118;border-radius:999px;padding:0 14px}
.c:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,#fffaf0)}
</style>
</head>
<body>
<div class="l">
  <div class="eb">文豪の原文 × AIの文</div>
  <h1>どっちが<br><em>本物</em>？</h1>
  <div class="sub">片方は青空文庫の原文そのまま。<br>片方は、AIが原文を見ずに書いた文。</div>
  <div class="meta">全10問 ・ 30人50作品から出題 ・ 約2分</div>
</div>
<div class="r">
  <div class="c"><b>A</b><i>？</i><span id="a"></span></div>
  <div class="c"><b>B</b><i>？</i><span id="b"></span></div>
</div>
<script>
fetch('../../data/honmono/pairs.json').then((r) => r.json()).then((d) => {
  const p = d.pairs.find((x) => x.id === '000424');
  document.getElementById('a').textContent = p.ai.slice(0, 64);
  document.getElementById('b').textContent = p.original.slice(0, 64);
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
});
</script>
</body>
</html>
