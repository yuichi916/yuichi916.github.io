<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>mazeru og</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{color:#1f2a44;font-family:"Zen Maru Gothic",sans-serif;
  background:
    radial-gradient(circle at 50% 120%,transparent 58%,rgba(31,42,68,.05) 59%,rgba(31,42,68,.05) 63%,transparent 64%) 0 0/72px 36px,
    radial-gradient(900px 520px at 30% 30%,#fbf5e8,#efe3c9 75%);
  display:grid;grid-template-columns:520px 1fr;gap:30px;padding:60px 60px 54px}
.l{display:flex;flex-direction:column;justify-content:center}
.eb{font-weight:900;color:#c8442f;letter-spacing:.24em;font-size:22px}
h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:116px;line-height:1.05;margin:14px 0 22px;letter-spacing:.02em}
h1 em{font-style:normal;color:#c8442f}
.sub{font-size:30px;line-height:1.5;font-weight:700}
.meta{font-weight:700;font-size:21px;color:#5d6578;margin-top:24px}
.r{display:flex;flex-direction:column;justify-content:center;gap:22px}
.eq{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:900;white-space:nowrap}
.c{display:inline-flex;align-items:center;gap:8px;height:66px;padding:0 20px 0 14px;border-radius:16px;background:#fffaf0;
  border:2px solid rgba(31,42,68,.16);box-shadow:0 3px 0 rgba(31,42,68,.08),0 8px 18px rgba(31,42,68,.08)}
.c.res{border-color:#c8442f;box-shadow:0 0 0 5px rgba(200,68,47,.15),0 8px 18px rgba(31,42,68,.1)}
.e{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:36px;line-height:1}
.op{color:#8b8f99;font-size:30px}
</style>
</head>
<body>
<div class="l">
  <div class="eb">2つまぜると、</div>
  <h1>まぜる<br><em>日本</em></h1>
  <div class="sub">水と火をまぜたら、何ができる？<br>妖怪、和食、行事、名所、昔話……</div>
  <div class="meta" id="meta">要素 ― 個 ・ 登録なし・無料</div>
</div>
<div class="r" id="eqs"></div>
<script>
// 例と数は make_og.py が ?d= に JSON で渡す（表にある組だけを出す）
const q = new URLSearchParams(location.search).get('d');
const d = q ? JSON.parse(q) : { n: 0, ex: [] };
document.getElementById('meta').textContent = '要素 ' + d.n.toLocaleString('ja-JP') + ' 個 ・ ドラッグでもタップでも ・ 無料';
const chip = (x, cls) => '<span class="c' + (cls || '') + '"><span class="e">' + x[1] + '</span>' + x[0] + '</span>';
document.getElementById('eqs').innerHTML = d.ex.map(e => '<div class="eq">' + chip(e[0]) + '<span class="op">＋</span>' + chip(e[1]) + '<span class="op">＝</span>' + chip(e[2], ' res') + '</div>').join('');
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
