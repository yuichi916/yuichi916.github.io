<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>nencho-2026 og</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f6f3ec;color:#1d2321;font-family:"Zen Kaku Gothic New",sans-serif;position:relative}
.band{position:absolute;inset:0 0 auto 0;height:14px;background:#1f6f5c}
.l{position:absolute;left:72px;top:70px;width:640px}
.eb{font-size:28px;font-weight:700;color:#1f6f5c;letter-spacing:.04em}
h1{font-size:76px;line-height:1.18;font-weight:900;margin-top:14px;letter-spacing:.01em}
.sub{font-size:28px;color:#58605c;margin-top:22px;line-height:1.5}
.r{position:absolute;right:64px;top:64px;width:400px;display:grid;gap:16px}
.k{background:#fffdf8;border:2px solid #e3ddd0;border-radius:20px;padding:20px 26px}
.k .t{font-size:22px;color:#58605c;font-weight:700}
.k .v{font-family:"JetBrains Mono",monospace;font-size:52px;font-weight:700;line-height:1.1;margin-top:4px}
.k .v small{font-family:"Zen Kaku Gothic New";font-size:26px;margin-left:6px}
.k .v .ar{color:#1f6f5c;font-family:"Zen Kaku Gothic New";font-size:36px;margin:0 6px}
.k.main{background:#1f6f5c;border-color:#1f6f5c;color:#fff}
.k.main .t{color:#e3f0ea}
.foot{position:absolute;left:72px;bottom:34px;width:600px;font-size:22px;color:#8a918c}
</style>
</head>
<body>
<div class="band"></div>
<div class="l">
  <div class="eb">令和8年分（2026年）の年末調整</div>
  <h1>年末調整、<br>いくら戻る？</h1>
  <div class="sub">年収と家族構成を入れると、今年の所得税・去年との差・戻る目安を1分で概算</div>
</div>
<div class="r">
  <div class="k main"><div class="t">基礎控除（去年は58〜95万円）</div><div class="v"><small style="margin:0 6px 0 0">最大</small>104<small>万円</small></div></div>
  <div class="k"><div class="t">給与所得控除の最低額</div><div class="v">65<span class="ar">→</span>74<small>万円</small></div></div>
  <div class="k"><div class="t">所得税がかからない年収の線</div><div class="v">160<span class="ar">→</span>178<small>万円</small></div></div>
</div>
<div class="foot">国税庁「令和8年分 年末調整のしかた」の手順と表で計算 ・ yuichi916.github.io</div>
<script>document.fonts.ready.then(() => document.body.dataset.ready = '1');</script>
</body>
</html>
