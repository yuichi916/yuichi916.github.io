<!DOCTYPE html><meta charset="utf-8"><title>preview</title>
<!-- 化けくらべの場面を並べて見る確認用ページ（_dev/ は公開対象外）。
     ?seed=7 … 3 つの場面を同じシードで / ?mode=daily&date=2026-09-26 … その夜のお題（左: 化けたまま、右: 正体） -->
<style>body{background:#222;color:#ddd;font:12px monospace;margin:8px}canvas{image-rendering:pixelated;width:432px;height:648px;margin:4px;border:1px solid #444}.row{display:flex;flex-wrap:wrap}</style>
<div class="row" id="row"></div>
<script type="module">
import * as K from '../assets/bakekurabe/core.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'scenes';
function draw(px, tanuki, reveal){
  const cv = document.createElement('canvas'); cv.width = K.W; cv.height = K.H;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(K.W, K.H);
  const buf = px.slice();
  for (const t of tanuki||[]) {
    K.BODY.forEach((p,i)=>{ const s=K.spriteToScene(t,p.x,p.y); buf[s.y*K.W+s.x] = reveal? p.natural : t.paint[i]; });
  }
  for (let i=0;i<buf.length;i++){ const c=K.PALETTE[buf[i]]; img.data[i*4]=c[0]; img.data[i*4+1]=c[1]; img.data[i*4+2]=c[2]; img.data[i*4+3]=255; }
  for (const t of tanuki||[]) for (const e of K.EYES){ const s=K.spriteToScene(t,e.x,e.y); const i=s.y*K.W+s.x; img.data.set([...K.EYE_RGB,255], i*4); }
  ctx.putImageData(img,0,0); document.getElementById('row').appendChild(cv);
}
if (mode==='scenes') {
  const seed = +(q.get('seed')||1);
  for (const k of K.KINDS) draw(K.makeScene(k, seed, +(q.get('phase')||0.45)).px);
} else {
  const d = K.dailyPuzzle(q.get('date')||'2026-09-25');
  draw(d.scene.px, d.tanuki, false); draw(d.scene.px, d.tanuki, true);
  document.title = 'daily ' + d.kind + ' ' + d.tanuki.map(t=>t.level+':'+K.bakeScore(d.scene.px,t,t.paint)).join(',');
}
</script>
