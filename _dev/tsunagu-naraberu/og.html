<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(700px 520px at 18% 60%, rgba(255,138,101,.35), transparent 60%),radial-gradient(700px 520px at 82% 60%, rgba(77,208,225,.35), transparent 60%),linear-gradient(180deg,#0d0b1f,#1b1640);font-family:"M PLUS Rounded 1c",sans-serif;color:#e9ecff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.cast{position:absolute;left:0;right:0;bottom:-10px;display:flex;justify-content:center;align-items:flex-end;height:470px}
.cast img{height:100%;margin:0 -44px;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.cast img:nth-child(2),.cast img:nth-child(3){height:92%}
.logo{position:absolute;left:0;right:0;top:26px;text-align:center;font-size:96px;font-weight:900;letter-spacing:.03em;line-height:1;text-shadow:0 6px 0 rgba(10,8,30,.85)}
.t{color:#ff8a65}.n{color:#4dd0e1}.x{color:#b9bedd;font-size:.6em;margin:0 .12em;vertical-align:.1em}
.tag{position:absolute;left:0;right:0;top:136px;text-align:center;font-size:30px;font-weight:800;color:#fff3a8;text-shadow:0 3px 0 rgba(10,8,30,.9)}
.pill{position:absolute;bottom:30px;z-index:3;font-size:22px;font-weight:900;padding:8px 18px;border-radius:999px;background:rgba(10,8,30,.82);border:2px solid}
.pl{left:56px;color:#ff8a65;border-color:#ff8a65}.pr{right:56px;color:#4dd0e1;border-color:#4dd0e1}
</style></head><body>
<div class="grid"></div>
<div class="cast">
  <img src="../../assets/tsunagu-naraberu/chara/hinata/select.webp">
  <img src="../../assets/tsunagu-naraberu/chara/momo/select.webp">
  <img src="../../assets/tsunagu-naraberu/chara/rin/select.webp">
  <img src="../../assets/tsunagu-naraberu/chara/suzu/select.webp">
</div>
<div class="logo"><span class="t">つなぐ</span><span class="x">×</span><span class="n">ならべる</span></div>
<div class="tag">ルールのちがう2つの盤で、直接戦う。</div>
<div class="pill pl">つなぐ派</div>
<div class="pill pr">ならべる派</div>
</body></html>
