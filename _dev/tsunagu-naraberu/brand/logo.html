<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<!-- 『ツナラベ！』のロゴ。brand/render.py が透過PNGに撮る。?sub=0 で副題なし、?lang=en で英語の副題 -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
body{width:1400px;height:620px;display:flex;align-items:center;justify-content:center}
svg{overflow:visible}
.f{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900}
</style></head><body>
<svg id="logo" width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd0a8"/><stop offset=".45" stop-color="#ff9a5c"/><stop offset="1" stop-color="#f2603a"/></linearGradient>
    <linearGradient id="gN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8fbff"/><stop offset=".45" stop-color="#5fe0f2"/><stop offset="1" stop-color="#1fa6c9"/></linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7b8ff"/><stop offset="1" stop-color="#8a52e8"/></linearGradient>
    <radialGradient id="gBlob" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffe2d6"/><stop offset=".35" stop-color="#ff7a6b"/><stop offset="1" stop-color="#c8333f"/></radialGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="8" flood-color="#0b0820" flood-opacity=".55"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- 文字: 外側の濃い縁 → 白い縁 → グラデーションの中身 → つや -->
    <g id="word" class="f" font-size="258" text-anchor="middle">
      <g transform="translate(205 330) rotate(-6)"><text stroke="#1b1640" stroke-width="44" stroke-linejoin="round" paint-order="stroke">ツ</text><text stroke="#fff" stroke-width="20" stroke-linejoin="round" fill="url(#gT)" paint-order="stroke">ツ</text></g>
      <g transform="translate(445 312) rotate(4)"><text stroke="#1b1640" stroke-width="44" stroke-linejoin="round" paint-order="stroke">ナ</text><text stroke="#fff" stroke-width="20" stroke-linejoin="round" fill="url(#gT)" paint-order="stroke">ナ</text></g>
      <g transform="translate(690 334) rotate(-4)"><text stroke="#1b1640" stroke-width="44" stroke-linejoin="round" paint-order="stroke">ラ</text><text stroke="#fff" stroke-width="20" stroke-linejoin="round" fill="url(#gN)" paint-order="stroke">ラ</text></g>
      <g transform="translate(935 314) rotate(6)"><text stroke="#1b1640" stroke-width="44" stroke-linejoin="round" paint-order="stroke">ベ</text><text stroke="#fff" stroke-width="20" stroke-linejoin="round" fill="url(#gN)" paint-order="stroke">ベ</text></g>
    </g>
    <!-- 「！」: 棒はならべる派のパネル、点はつなぐ派のつぶ -->
    <g transform="translate(1135 205) rotate(10)">
      <rect x="-50" y="-150" width="100" height="190" rx="30" fill="#1b1640"/>
      <rect x="-38" y="-138" width="76" height="166" rx="22" fill="#fff"/>
      <rect x="-29" y="-129" width="58" height="148" rx="16" fill="url(#gPanel)"/>
      <rect x="-21" y="-121" width="42" height="40" rx="12" fill="url(#gGloss)"/>
      <path d="M0 -70 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3z" fill="#fff" opacity=".9"/>
    </g>
    <g transform="translate(1160 345)">
      <circle r="58" fill="#1b1640"/>
      <circle r="46" fill="#fff"/>
      <circle r="38" fill="url(#gBlob)"/>
      <ellipse cx="-13" cy="-19" rx="13" ry="7" fill="#fff" opacity=".7" transform="rotate(-25 -13 -19)"/>
      <ellipse cx="-11" cy="-2" rx="4.6" ry="6.4" fill="#26162e"/><ellipse cx="11" cy="-2" rx="4.6" ry="6.4" fill="#26162e"/>
      <circle cx="-9.6" cy="-4.4" r="1.8" fill="#fff"/><circle cx="12.4" cy="-4.4" r="1.8" fill="#fff"/>
      <path d="M-7 10 q7 7 14 0" stroke="#26162e" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- きらり -->
    <g fill="#fff3a8">
      <path d="M70 120 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
      <path d="M1240 470 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
      <path d="M575 70 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    </g>
  </g>
  <!-- 副題の帯 -->
  <g id="sub" class="f">
    <rect x="250" y="420" width="800" height="84" rx="42" fill="#1b1640"/>
    <rect x="258" y="428" width="784" height="68" rx="34" fill="none" stroke="#fff3a8" stroke-width="3" opacity=".9"/>
    <text id="subText" x="650" y="477" text-anchor="middle" font-size="40" fill="#fff3a8" letter-spacing="2"><tspan fill="#ffb08a">つなぐ</tspan> × <tspan fill="#8ff0ff">ならべる</tspan>　異種対戦パズル</text>
  </g>
</svg>
<script>
const q = new URLSearchParams(location.search);
if (q.get('sub') === '0') document.getElementById('sub').remove();
if (q.get('lang') === 'en') document.getElementById('subText').innerHTML = '<tspan fill="#ffb08a">CONNECT</tspan> × <tspan fill="#8ff0ff">LINE UP</tspan>  PUZZLE DUEL';
</script>
</body></html>
