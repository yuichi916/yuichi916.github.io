<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>伏せる OG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;color:#eef2f6;
  background:radial-gradient(700px 500px at 92% 0%,rgba(127,214,176,.22),transparent 60%),
             radial-gradient(700px 600px at 0% 100%,rgba(127,200,255,.16),transparent 60%),
             linear-gradient(160deg,#0f1720,#142230 70%,#0d151d);position:relative}
.l{position:absolute;left:70px;top:70px;width:560px}
.eyebrow{display:inline-block;font-size:24px;font-weight:800;color:#0f1720;background:#7fd6b0;border-radius:999px;padding:4px 18px;letter-spacing:.06em}
h1{font-size:76px;font-weight:800;line-height:1.28;margin-top:26px;letter-spacing:.01em}
h1 span{color:#7fd6b0}
.sub{font-size:28px;font-weight:700;line-height:1.6;margin-top:22px;color:#cfd8e2}
.foot{position:absolute;left:70px;bottom:52px;font-size:22px;color:#93a1b1;font-weight:700}
.card{position:absolute;right:56px;top:74px;width:500px;border-radius:22px;background:#17232f;border:2px solid rgba(255,255,255,.12);padding:26px 28px}
.row{font-size:27px;font-weight:700;line-height:1.5;white-space:nowrap}
.row+.row{margin-top:4px}
.before .hl{background:rgba(255,143,163,.25);border-bottom:3px solid #ff8fa3;border-radius:4px;padding:0 3px}
.before .hp{background:rgba(255,211,107,.22);border-bottom:3px solid #ffd36b;border-radius:4px;padding:0 3px}
.before .ha{background:rgba(127,200,255,.22);border-bottom:3px solid #7fc8ff;border-radius:4px;padding:0 3px}
.arrow{text-align:center;font-size:34px;color:#7fd6b0;margin:12px 0 10px;font-weight:800}
.after{background:#0d151d;border-radius:14px;padding:16px 18px}
.after .t{color:#ff8fa3}.after .p{color:#ffd36b}.after .a{color:#7fc8ff}
.lab{font-size:18px;color:#93a1b1;font-weight:700;margin-bottom:6px;letter-spacing:.06em}
</style>
</head>
<body>
<div class="l">
  <div class="eyebrow">通信ゼロ・ブラウザの中だけ</div>
  <h1>AIに貼る前に、<br><span>伏せる。</span></h1>
  <p class="sub">名前・電話・住所・マイナンバーを<br>伏せ字に。AIの返事は元に戻せる。</p>
</div>
<div class="foot">yuichi916.github.io/fuseru.html</div>
<div class="card">
  <div class="lab">貼る前</div>
  <div class="before">
    <div class="row">営業部 <span class="hl">田中 一郎</span> 様</div>
    <div class="row">電話 <span class="hp">090-0000-1234</span></div>
    <div class="row"><span class="ha">港区芝公園9-9-9</span></div>
  </div>
  <div class="arrow">↓</div>
  <div class="lab">AIに貼る文</div>
  <div class="after">
    <div class="row">営業部 <span class="t">[人名1]</span> 様</div>
    <div class="row">電話 <span class="p">[電話1]</span></div>
    <div class="row"><span class="a">[住所1]</span></div>
  </div>
</div>
<script>document.body.dataset.ready = '1';</script>
</body>
</html>
