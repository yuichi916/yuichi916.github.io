<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:"Zen Maru Gothic",sans-serif;color:#1d1b19;
  background:radial-gradient(900px 600px at 85% 20%,rgba(200,68,47,.10),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(184,137,42,.10),transparent 60%),#f4ede0;
  display:flex;align-items:center;padding:0 64px;gap:36px}
.l{flex:0 0 430px}
.k{font-size:24px;font-weight:900;letter-spacing:.14em;color:#c8442f}
h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:150px;line-height:1.02;letter-spacing:.06em;margin:6px 0 12px}
p{font-size:38px;font-weight:900;line-height:1.35}
.s{margin-top:20px;font-size:21px;font-weight:700;color:#6b645b}
.r{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;background:#fffbf3;border:1px solid rgba(29,27,25,.14);border-radius:28px;padding:34px 20px;box-shadow:0 18px 40px rgba(29,27,25,.10)}
.hand{display:flex;gap:14px}
.t{position:relative;width:104px;height:124px;border-radius:16px;background:linear-gradient(#fffdf8,#f6efe2);border:2px solid #c8442f;box-shadow:0 5px 0 #a5331f,0 14px 24px rgba(200,68,47,.2);display:grid;place-items:center;transform:translateY(-8px)}
.t span{font-family:"Shippori Mincho",serif;font-weight:800;font-size:64px;line-height:1}
.t small{position:absolute;right:9px;top:5px;font-size:16px;color:#958c82;font-weight:700}
.t em{position:absolute;left:-9px;top:-11px;width:32px;height:32px;border-radius:50%;background:#c8442f;color:#fff;font-style:normal;font-size:17px;font-weight:900;display:grid;place-items:center}
.w{font-family:"Shippori Mincho",serif;font-weight:800;font-size:30px;color:#6b645b}
.calc{display:flex;align-items:center;gap:12px;font-weight:900}
.calc .c,.calc .m{min-width:92px;padding:6px 14px;border-radius:14px;font-size:38px;color:#fff;text-align:center}
.calc .c{background:#2f6db5}.calc .m{background:#c8442f}
.calc i{font-style:normal;color:#6b645b;font-size:30px}
.calc b{font-family:"Shippori Mincho",serif;font-size:58px}
.j{display:flex;gap:10px}
.j span{background:#24313f;color:#ffd77a;border-radius:999px;padding:6px 18px;font-size:22px;font-weight:900}
</style></head><body>
<div class="l">
  <div class="k">漢字のローグライト</div>
  <h1>役札</h1>
  <p>漢字の手札で、<br>役をつくる。</p>
  <div class="s">まぜる漢字 ・ 無料・登録なし</div>
</div>
<div class="r">
  <div class="hand">
    <div class="t"><span>一</span><small>1</small><em>1</em></div><div class="t"><span>石</span><small>5</small><em>2</em></div>
    <div class="t"><span>二</span><small>2</small><em>3</em></div><div class="t"><span>鳥</span><small>11</small><em>4</em></div>
  </div>
  <div class="w">いっせきにちょう</div>
  <div class="calc"><span class="c">79</span><i>×</i><span class="m">24</span><i>＝</i><b>1,896</b></div>
  <div class="j"><span>4字の熟語 倍8</span><span>四字の札 倍×3</span></div>
</div>
</body></html>
