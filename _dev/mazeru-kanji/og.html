<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:"Zen Maru Gothic",sans-serif;color:#1d1b19;
  background:radial-gradient(900px 600px at 85% 20%,rgba(200,68,47,.10),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(184,137,42,.10),transparent 60%),#f4ede0;
  display:flex;align-items:center;padding:0 70px;gap:40px}
.l{flex:1}
.k{font-size:24px;font-weight:900;letter-spacing:.14em;color:#c8442f}
h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:118px;line-height:1.05;letter-spacing:.03em;margin:8px 0 14px}
h1 i{font-style:normal;color:#c8442f}
p{font-size:36px;font-weight:900;line-height:1.4}
.s{margin-top:22px;font-size:22px;font-weight:700;color:#6b645b}
.hive{--w:150px;--h:calc(var(--w)*.866);--g:9px;position:relative;width:calc(var(--w)*2.5 + var(--g)*2);height:calc(var(--h)*3 + var(--g)*2)}
.t{position:absolute;left:calc(50% - var(--w)/2);top:calc(50% - var(--h)/2);width:var(--w);height:var(--h);transform:translate(var(--x,0),var(--y,0))}
.t b{position:absolute;inset:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:rgba(29,27,25,.3)}
.t b::before{content:"";position:absolute;inset:3px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(170deg,#fffdf8,#f1e6d1)}
.t span{position:absolute;inset:0;display:grid;place-items:center;font-family:"Shippori Mincho",serif;font-weight:800;font-size:66px}
.t.c b{background:#a5331f}.t.c b::before{background:radial-gradient(circle at 40% 30%,#d65a43,#c8442f 60%,#b23a26)}.t.c span{color:#fff}
.p1{--y:calc(-1*(var(--h) + var(--g)))}.p4{--y:calc(var(--h) + var(--g))}
.p2{--x:calc(.75*var(--w) + var(--g)*.87);--y:calc(-.5*(var(--h) + var(--g)))}.p3{--x:calc(.75*var(--w) + var(--g)*.87);--y:calc(.5*(var(--h) + var(--g)))}
.p5{--x:calc(-.75*var(--w) - var(--g)*.87);--y:calc(.5*(var(--h) + var(--g)))}.p6{--x:calc(-.75*var(--w) - var(--g)*.87);--y:calc(-.5*(var(--h) + var(--g)))}
</style></head><body>
<div class="l">
  <div class="k">毎日1問の漢字パズル</div>
  <h1>まぜる<i>漢字</i></h1>
  <p>7つの漢字で、<br>熟語はいくつ作れる？</p>
  <div class="s">学年別のれんしゅう ・ 印刷できるプリントも無料</div>
</div>
<div class="hive">
  <div class="t c"><b></b><span>火</span></div>
  <div class="t p1"><b></b><span>花</span></div><div class="t p2"><b></b><span>山</span></div><div class="t p3"><b></b><span>口</span></div>
  <div class="t p4"><b></b><span>水</span></div><div class="t p5"><b></b><span>大</span></div><div class="t p6"><b></b><span>人</span></div>
</div>
</body></html>
