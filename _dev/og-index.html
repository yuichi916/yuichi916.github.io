<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OG index</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f4f0e6;color:#161510;
  font-family:Inter,"Hiragino Sans","Yu Gothic",sans-serif}
#stage{position:relative;width:1200px;height:630px;display:flex}

/* 左: 見出し */
.left{flex:1.32;padding:52px 44px 44px 56px;display:flex;flex-direction:column;justify-content:space-between;
  border-right:1px solid rgba(26,24,18,.2)}
.brand{font-family:"Shippori Mincho",serif;font-size:34px;font-weight:700;letter-spacing:.04em}
.brand span{color:#c43d2a}
.kick{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.24em;
  color:#8a7a52;margin-top:6px}
.h{font-family:"Shippori Mincho",serif;font-size:70px;line-height:1.26;font-weight:700;margin-top:26px;white-space:nowrap}
.h em{font-style:normal;color:#c43d2a;position:relative}
.h em::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:14px;
  background:rgba(196,61,42,.16);z-index:-1}
.nums{display:flex;gap:26px;margin-top:auto;padding-top:18px;border-top:1px solid rgba(26,24,18,.18)}
.n b{display:block;font-family:Inter,sans-serif;font-size:30px;font-weight:700;line-height:1}
.n span{font-size:12.5px;color:#6b6759;letter-spacing:.04em}

/* 右: 時間で選ぶ入口 */
.right{flex:1;padding:52px 46px 44px 40px;background:#efe9db;display:flex;flex-direction:column}
.rt{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.22em;color:#8a7a52;
  display:flex;justify-content:space-between;margin-bottom:22px}
.row{padding:16px 0;border-bottom:1px solid rgba(26,24,18,.16)}
.row:last-of-type{border-bottom:0}
.row .t{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:700;color:#c43d2a;line-height:1}
.row .d{font-family:"Shippori Mincho",serif;font-size:20px;font-weight:700;margin-top:7px;line-height:1.4}
.row .s{font-size:12.5px;color:#6b6759;margin-top:4px}
.foot{margin-top:auto;font-size:13px;color:#6b6759;line-height:1.7}
.foot b{color:#161510}
</style>
</head>
<body>
<div id="stage">
  <div class="left">
    <div>
      <div class="brand">ひとりぶんの棚<span>.</span></div>
      <div class="kick">MADE WITH AI, BY ONE PERSON</div>
      <div class="h">AIと二人で、<br><em>ここまで作った</em>。</div>
    </div>
    <div class="nums">
      <div class="n"><b>16</b><span>作品</span></div>
      <div class="n"><b>1,830</b><span>ボイス</span></div>
      <div class="n"><b>12.7万</b><span>字</span></div>
      <div class="n"><b>7</b><span>言語</span></div>
    </div>
  </div>
  <div class="right">
    <div class="rt"><span>はじめての人へ</span><span>FIRST TIME</span></div>
    <div class="row">
      <div class="t">3分</div>
      <div class="d">サイコロを一回だけ押す</div>
      <div class="s">19,810組を並べた音楽の地図</div>
    </div>
    <div class="row">
      <div class="t">10分</div>
      <div class="d">絵本を、ぱらぱらめくる</div>
      <div class="s">21ページ・16の世界がせり上がる</div>
    </div>
    <div class="row">
      <div class="t">30分</div>
      <div class="d">物語を一本、読み切る</div>
      <div class="s">フルボイスのサウンドノベル・7言語</div>
    </div>
    <div class="foot">
      <b>ぜんぶブラウザで無料。</b>登録もインストールもいりません。<br>
      作り方も、詰まった所も、全部書いています。
    </div>
  </div>
</div>
</body>
</html>
