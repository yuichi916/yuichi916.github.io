<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庭 — 心を整える小さな箱庭 | Niwa</title>
<meta name="description" content="2.5Dのクォータービューでヘックスタイルを置き、自分だけの癒やしの箱庭を育てる。森・水・家・祠を組み合わせて、心の整う情景を作る。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Cormorant+Garamond:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-day:    #f6efe0;
    --bg-dusk:   #e8c5a8;
    --bg-night:  #2c2a40;
    --bg-dawn:   #c8b6d0;
    --ink:       #3a342a;
    --ink-soft:  #6b6457;
    --accent:    #d49a72;
    --accent-deep:#9a6a48;
    --leaf:      #88a76d;
    --water:     #91bccc;
    --sakura:    #f0c1cb;
    --paper:     rgba(252, 248, 238, 0.86);
    --shadow:    rgba(60, 50, 40, 0.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; width:100%; overflow:hidden; user-select:none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Zen Maru Gothic', 'Shippori Mincho', serif;
    color: var(--ink);
    background: var(--bg-day);
    overscroll-behavior: none;
    touch-action: none;
  }
  #container { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }

  /* Loading veil */
  #loading {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(180deg, #f0e3cd 0%, #e6d2b3 100%);
    transition: opacity 1.4s ease;
  }
  #loading.hide { opacity:0; pointer-events:none; }
  #loading .title {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    letter-spacing: 0.5em;
    color: var(--ink);
    text-shadow: 0 2px 10px rgba(0,0,0,0.08);
  }
  #loading .sub {
    margin-top: 0.8rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.9rem, 2vw, 1.3rem);
    color: var(--ink-soft);
    letter-spacing: 0.3em;
  }
  #loading .progress {
    margin-top: 2rem;
    width: 240px; height: 2px;
    background: rgba(58, 52, 42, 0.18);
    border-radius: 1px;
    overflow: hidden;
  }
  #loading .bar {
    height: 100%; width: 0%;
    background: var(--ink);
    transition: width 0.4s ease;
  }
  #loading .hint {
    margin-top: 1.4rem;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
  }

  /* Top-left status */
  #status {
    position:fixed; top:18px; left:20px;
    z-index: 12;
    background: var(--paper);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 12px 18px;
    box-shadow: 0 6px 20px var(--shadow);
    display:flex; flex-direction:column; gap:6px;
    font-family: 'Shippori Mincho', serif;
  }
  #status .row { display:flex; align-items:baseline; gap:10px; }
  #status .label {
    font-size: 0.7rem; letter-spacing:0.2em;
    color: var(--ink-soft);
  }
  #status .heart {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--accent-deep);
    font-variant-numeric: tabular-nums;
  }
  #status .time-of-day {
    font-size: 0.9rem;
    color: var(--ink);
  }
  #status .sub-msg {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 2px;
    max-width: 220px;
    line-height: 1.5;
  }

  /* Bottom-right tile palette */
  #palette {
    position:fixed; right:18px; bottom:18px;
    z-index: 12;
    background: var(--paper);
    backdrop-filter: blur(8px);
    border-radius: 18px;
    padding: 14px 14px 12px;
    box-shadow: 0 8px 24px var(--shadow);
    display:flex; flex-direction:column; gap: 8px;
    max-width: 360px;
  }
  #palette .head {
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 4px 6px;
    border-bottom: 1px solid rgba(58, 52, 42, 0.1);
  }
  #palette .head .title {
    font-family: 'Shippori Mincho', serif;
    font-size: 0.95rem;
    letter-spacing: 0.25em;
  }
  #palette .head .next {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--ink-soft);
  }
  #palette .grid {
    display:grid;
    grid-template-columns: repeat(5, 56px);
    gap: 6px;
    padding-top: 4px;
  }
  #palette .tile {
    width: 56px; height: 64px;
    border-radius: 10px;
    border: 1.5px solid rgba(58, 52, 42, 0.14);
    background: #fff8eb;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s, box-shadow 0.2s;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 2px;
    padding: 4px 2px;
    position: relative;
  }
  #palette .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  #palette .tile.active { border-color: var(--accent-deep); box-shadow: 0 0 0 3px rgba(212, 154, 114, 0.3); background:#fff2d8; transform:translateY(-2px); }
  #palette .tile .icon {
    font-size: 1.5rem; line-height: 1;
  }
  #palette .tile .name {
    font-size: 0.62rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  #palette .tile .count {
    position:absolute; top: 2px; right:4px;
    font-size: 0.66rem;
    font-weight: 600;
    color: var(--accent-deep);
    font-variant-numeric: tabular-nums;
  }
  #palette .tile.empty { opacity: 0.45; pointer-events:none; }
  #palette .actions {
    display:flex; gap: 6px; margin-top:6px; padding-top:8px;
    border-top: 1px solid rgba(58, 52, 42, 0.1);
  }
  #palette button {
    flex: 1;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid rgba(58, 52, 42, 0.18);
    background: #fff8eb;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s;
  }
  #palette button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  #palette button.danger { color: #b56a4a; }
  #palette button.danger:hover { background: #c87a55; color:#fff; border-color: #c87a55; }

  /* Top-right corner with link back */
  #back {
    position:fixed; top:18px; right:20px; z-index: 12;
    background: var(--paper);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 4px 12px var(--shadow);
  }
  #back:hover { background: #fff; color: var(--accent-deep); }

  /* Bottom-left controls */
  #controls {
    position:fixed; bottom: 20px; left: 20px;
    z-index: 12;
    display: flex; gap: 8px;
  }
  #controls .ctl {
    background: var(--paper);
    backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.74rem;
    letter-spacing: 0.12em;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 4px 12px var(--shadow);
    border: 1px solid transparent;
    transition: border-color 0.15s, background 0.15s;
  }
  #controls .ctl:hover { border-color: var(--accent); background: #fff; }
  #controls .ctl.on { background: var(--accent-deep); color:#fff; }

  /* Help toast (auto-fades) */
  #toast {
    position:fixed; left:50%; bottom: 100px;
    transform: translateX(-50%);
    z-index: 11;
    background: var(--paper);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 0.84rem;
    letter-spacing: 0.1em;
    color: var(--ink);
    box-shadow: 0 6px 18px var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    max-width: min(80vw, 500px);
    text-align: center;
  }
  #toast.show { opacity: 1; }

  /* Tile selected indicator (cursor follow) */
  #hover-info {
    position:fixed;
    z-index: 11;
    background: rgba(252, 248, 238, 0.95);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    color: var(--ink);
    box-shadow: 0 4px 12px var(--shadow);
    pointer-events:none;
    opacity: 0;
    transition: opacity 0.1s;
    font-family: 'Shippori Mincho', serif;
    letter-spacing: 0.1em;
  }
  #hover-info.show { opacity: 1; }

  /* Achievements toast */
  #achievement {
    position:fixed; top: 90px; left: 50%;
    transform: translateX(-50%);
    z-index: 13;
    background: linear-gradient(135deg, #fff8e8, #fce8c8);
    border: 1px solid var(--accent);
    box-shadow: 0 8px 28px rgba(212,154,114,0.36);
    border-radius: 14px;
    padding: 14px 24px;
    font-family: 'Shippori Mincho', serif;
    color: var(--ink);
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.4s, transform 0.4s;
  }
  #achievement.show { opacity: 1; transform: translate(-50%, 10px); }
  #achievement .lab { font-size: 0.66rem; letter-spacing: 0.4em; color: var(--accent-deep); }
  #achievement .ttl { margin-top: 4px; font-size: 1.05rem; letter-spacing: 0.15em; }
  #achievement .dsc { margin-top: 4px; font-size: 0.78rem; color: var(--ink-soft); }

  /* Mobile tweaks */
  @media (max-width: 720px) {
    #palette .grid { grid-template-columns: repeat(4, 52px); }
    #palette .tile { width: 52px; height: 60px; }
    #status .sub-msg { display:none; }
    #status { padding: 8px 12px; }
    #status .heart { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div id="container"></div>

<div id="loading">
  <div class="title">庭</div>
  <div class="sub">N&nbsp;I&nbsp;W&nbsp;A &nbsp;&mdash;&nbsp; Mind&nbsp;Garden</div>
  <div class="progress"><div class="bar" id="loadbar"></div></div>
  <div class="hint">小さな箱庭を、ひとつずつ整える</div>
</div>

<a id="back" href="index.html">&larr; もどる</a>

<div id="status">
  <div class="row">
    <span class="label">心 / KOKORO</span>
    <span class="heart" id="kokoro">0</span>
  </div>
  <div class="row">
    <span class="label">刻 / TIME</span>
    <span class="time-of-day" id="time">朝</span>
  </div>
  <div class="sub-msg" id="message">そっと六角を選び、緑や水を置いて、自分の景色を作ってください。</div>
</div>

<div id="palette">
  <div class="head">
    <span class="title">置　く</span>
    <span class="next">Tile Palette</span>
  </div>
  <div class="grid" id="paletteGrid"></div>
  <div class="actions">
    <button id="removeBtn" class="danger">取り除く</button>
    <button id="rotateBtn">回転</button>
    <button id="resetBtn">最初から</button>
  </div>
</div>

<div id="controls">
  <div class="ctl" id="bgmCtl">♪ BGM</div>
  <div class="ctl" id="cameraCtl">視点</div>
</div>

<div id="hover-info"></div>
<div id="toast"></div>
<div id="achievement">
  <div class="lab">心が整う</div>
  <div class="ttl" id="achTitle">＋10</div>
  <div class="dsc" id="achDesc"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// 庭 — 心を整える小さな箱庭 (2.5D box-garden v1)
// クォータービュー + ヘックスタイル配置 + 癒やし系シナジー
// ─────────────────────────────────────────────────────────────

const HEX_R = 1.7;                     // hex radius (world units)
const HEX_W = Math.sqrt(3) * HEX_R;    // flat-top width
const HEX_H = 2 * HEX_R;               // flat-top height
const GRID_RADIUS = 7;                 // hex rings from center
const CAMERA_VIEW = 17;                // ortho frustum half-height (smaller=zoomed-in)
const ROTATIONS = [0, Math.PI/2, Math.PI, Math.PI*3/2];

let scene, camera, renderer;
let raycaster, mouse = new THREE.Vector2();
let groundGroup, tileGroup, decorGroup, hoverMesh;
let cellMap = new Map();              // "q,r" -> { cellMesh, axial, world, type, mesh, rot }
let palette = [];                     // active palette state (counts)
let selectedType = null;
let placedKokoro = 0;
let timeOfDay = 0.25;                 // 0..1  (0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk)
let timeSpeed = 1 / 240;              // seconds per full day @ 240s
let lastTs = performance.now();
let camRotIndex = 0;
let bgmEnabled = false;
let bgmCtx = null, bgmGain = null;
let glbAssets = {};                   // named meshes from village_kit.glb
let achievementsUnlocked = new Set();
let toastTimer = 0;

// ─── Tile types ──────────────────────────────────────────────
// each: id, name, icon, color (base), kind (terrain/structure), max stock, synergy callbacks
const TILE_DEFS = [
  { id:'meadow',   name:'草原',   icon:'🌿', color:0xb8d39e, kind:'terrain',    stock: 30 },
  { id:'forest',   name:'森',     icon:'🌲', color:0x6e9358, kind:'terrain',    stock: 18 },
  { id:'water',    name:'水辺',   icon:'💧', color:0xa8cfd9, kind:'terrain',    stock: 14 },
  { id:'sakura',   name:'桜',     icon:'🌸', color:0xf3c4cf, kind:'terrain',    stock:  6 },
  { id:'rice',     name:'田',     icon:'🌾', color:0xd9c97a, kind:'terrain',    stock:  8 },
  { id:'path',     name:'道',     icon:'•',  color:0xcdb98a, kind:'terrain',    stock: 20 },
  { id:'house',    name:'家',     icon:'🏠', color:0xc9a884, kind:'structure',  stock:  6 },
  { id:'shrine',   name:'祠',     icon:'⛩️', color:0xc26060, kind:'structure',  stock:  3 },
  { id:'pagoda',   name:'塔',     icon:'🏯', color:0x8a4848, kind:'structure',  stock:  2 },
  { id:'bridge',   name:'橋',     icon:'🌉', color:0x9a7456, kind:'structure',  stock:  4 },
  { id:'well',     name:'井戸',   icon:'⌬',  color:0x8090a0, kind:'structure',  stock:  3 },
  { id:'lantern',  name:'灯籠',   icon:'🪔', color:0xd0a060, kind:'structure',  stock:  6 },
  { id:'mill',     name:'水車',   icon:'⚙', color:0xa48050, kind:'structure',  stock:  2 },
  { id:'tea',      name:'茶室',   icon:'🍵', color:0xcfbb96, kind:'structure',  stock:  3 },
];

// ─── Hex math (axial) ────────────────────────────────────────
function axialToWorld(q, r) {
  const x = HEX_W * (q + r / 2);
  const z = HEX_R * 1.5 * r;
  return [x, z];
}
function worldToAxial(x, z) {
  const q = (Math.sqrt(3)/3 * x - 1/3 * z) / HEX_R;
  const r = (2/3 * z) / HEX_R;
  return roundAxial(q, r);
}
function roundAxial(qf, rf) {
  const sf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
  if (dq > dr && dq > ds) q = -r - s;
  else if (dr > ds) r = -q - s;
  return [q, r];
}
function axialKey(q, r) { return q + ',' + r; }
function hexNeighbors(q, r) {
  return [[q+1,r],[q-1,r],[q,r+1],[q,r-1],[q+1,r-1],[q-1,r+1]];
}
function hexDistance(a, b) {
  return (Math.abs(a[0]-b[0]) + Math.abs(a[0]+a[1]-b[0]-b[1]) + Math.abs(a[1]-b[1])) / 2;
}

// ─── Setup ───────────────────────────────────────────────────
function setLoadBar(pct){
  const b = document.getElementById('loadbar');
  if (b) b.style.width = (pct*100).toFixed(1) + '%';
}

async function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf6efe0);
  scene.fog = new THREE.Fog(0xf6efe0, 30, 80);

  const aspect = window.innerWidth / window.innerHeight;
  camera = new THREE.OrthographicCamera(
    -CAMERA_VIEW * aspect, CAMERA_VIEW * aspect,
    CAMERA_VIEW, -CAMERA_VIEW,
    0.1, 200
  );
  setCameraAngle();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('container').appendChild(renderer.domElement);

  raycaster = new THREE.Raycaster();

  // lights
  const ambient = new THREE.AmbientLight(0xfff2dc, 0.5);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
  sun.position.set(18, 28, 14);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -28;
  sun.shadow.camera.right = 28;
  sun.shadow.camera.top = 28;
  sun.shadow.camera.bottom = -28;
  sun.shadow.bias = -0.0003;
  sun.shadow.normalBias = 0.04;
  scene.add(sun);

  const hemi = new THREE.HemisphereLight(0xb8d9ff, 0xd9b88a, 0.32);
  scene.add(hemi);

  // store refs
  scene.userData = { sun, ambient, hemi };

  // groups
  groundGroup = new THREE.Group();
  tileGroup   = new THREE.Group();
  decorGroup  = new THREE.Group();
  scene.add(groundGroup, tileGroup, decorGroup);

  setLoadBar(0.1);

  // Load GLB
  await loadVillageKit();
  setLoadBar(0.7);

  // build the hex board
  buildHexBoard();
  setLoadBar(0.85);

  // place a few seed decorations (mountains around, sky birds optional)
  buildBoardFrame();
  setLoadBar(0.95);

  // hover indicator
  hoverMesh = makeHexHighlight();
  hoverMesh.visible = false;
  scene.add(hoverMesh);

  // initial palette state
  initPalette();
  selectType('meadow');

  // start with a tiny seed garden in center
  seedInitialGarden();

  // UI hooks
  bindUI();

  // input
  bindInput();

  // resize
  window.addEventListener('resize', onResize);

  // start loop
  setLoadBar(1.0);
  setTimeout(()=>{
    document.getElementById('loading').classList.add('hide');
    showToast('六角を選び、緑や水を重ねて整えてゆく');
  }, 400);

  animate();
}

function setCameraAngle() {
  // fixed isometric (quarter-view)
  const dist = 40;
  const yaw = Math.PI / 4 + ROTATIONS[camRotIndex];
  const pitch = Math.PI / 5.5;  // ~32°
  camera.position.x = Math.sin(yaw) * Math.cos(pitch) * dist;
  camera.position.z = Math.cos(yaw) * Math.cos(pitch) * dist;
  camera.position.y = Math.sin(pitch) * dist + 6;
  camera.lookAt(0, 0, 0);
}

// ─── GLB Loader ──────────────────────────────────────────────
function loadVillageKit() {
  return new Promise((resolve) => {
    const loader = new THREE.GLTFLoader();
    loader.load(
      'assets/models/village_kit.glb',
      (gltf) => {
        const ringByPagoda = [];
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material && child.material.color) {
              child.material = child.material.clone();
            }
            // Collect by name; allow duplicates (Torus.001 etc.)
            const base = child.name.replace(/\.\d+$/, '');
            if (!glbAssets[base]) glbAssets[base] = [];
            glbAssets[base].push(child);
          }
        });
        console.log('[Niwa] GLB loaded:', Object.keys(glbAssets).join(', '));
        resolve();
      },
      undefined,
      (err) => {
        console.warn('[Niwa] GLB failed, fallback to procedural:', err);
        resolve();
      }
    );
  });
}

function cloneGlbGroup(baseName) {
  // attempts to find related parts (e.g., Pagoda + Torus rings)
  const parts = glbAssets[baseName];
  if (!parts || parts.length === 0) return null;
  const group = new THREE.Group();
  for (const p of parts) {
    const m = p.clone();
    m.material = p.material;
    group.add(m);
  }
  return group;
}

function clonePagodaWithSourin() {
  const grp = cloneGlbGroup('Pagoda');
  if (!grp) return null;
  const rings = glbAssets['Torus'] || [];
  for (const r of rings) {
    const m = r.clone();
    m.material = r.material;
    grp.add(m);
  }
  return grp;
}

// ─── Hex board ───────────────────────────────────────────────
function makeHexShape(size) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i + Math.PI / 6;
    const x = size * Math.cos(a), y = size * Math.sin(a);
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  shape.closePath();
  return shape;
}

function makeHexCell(q, r, baseColor) {
  const shape = makeHexShape(HEX_R * 0.985);
  const geom = new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2 });
  geom.rotateX(-Math.PI/2);
  const col = new THREE.Color(baseColor);
  // jitter for variety
  const jitter = (q*17 + r*31) % 13 / 130;
  col.offsetHSL(0, -0.04, -0.03 + jitter);
  const mat = new THREE.MeshLambertMaterial({ color: col });
  const m = new THREE.Mesh(geom, mat);
  m.receiveShadow = true;
  m.castShadow = false;
  const [wx, wz] = axialToWorld(q, r);
  m.position.set(wx, 0, wz);
  m.userData = { axial:[q,r], baseColor };
  return m;
}

function makeHexHighlight() {
  const shape = makeHexShape(HEX_R * 0.965);
  const geom = new THREE.ExtrudeGeometry(shape, { depth: 0.18, bevelEnabled: false });
  geom.rotateX(-Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xd49a72, transparent: true, opacity: 0.42,
    depthWrite: false,
  });
  const m = new THREE.Mesh(geom, mat);
  m.renderOrder = 5;
  return m;
}

function buildHexBoard() {
  for (let q = -GRID_RADIUS; q <= GRID_RADIUS; q++) {
    for (let r = -GRID_RADIUS; r <= GRID_RADIUS; r++) {
      const s = -q - r;
      if (Math.abs(s) > GRID_RADIUS) continue;
      const cell = makeHexCell(q, r, 0xb8d39e); // default meadow tone
      groundGroup.add(cell);
      cellMap.set(axialKey(q, r), {
        axial: [q, r],
        world: axialToWorld(q, r),
        cellMesh: cell,
        type: null,
        decorMesh: null,
        rot: 0,
      });
    }
  }
}

function buildBoardFrame() {
  // soft ring of distant pastel hills around the board
  const hillGroup = new THREE.Group();
  for (let i = 0; i < 24; i++) {
    const angle = (i / 24) * Math.PI * 2;
    const dist = GRID_RADIUS * HEX_W * 1.45 + 6 + ((i*7)%5)*0.5;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    const h = 2 + ((i*13)%7) * 0.4;
    const geom = new THREE.ConeGeometry(2.4 + ((i*11)%5)*0.25, h, 6);
    const col = new THREE.Color().setHSL(0.32 + ((i*5)%10)*0.005, 0.22, 0.55 + ((i*3)%5)*0.02);
    const mat = new THREE.MeshLambertMaterial({ color: col, flatShading: true });
    const m = new THREE.Mesh(geom, mat);
    m.position.set(x, h/2 - 0.2, z);
    m.castShadow = false;
    m.receiveShadow = true;
    hillGroup.add(m);
  }
  scene.add(hillGroup);

  // distant clouds (subtle billboards) — float high, well above the board
  const cloudGroup = new THREE.Group();
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2 + Math.random()*0.3;
    const radius = 28 + Math.random()*22;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const y = 22 + Math.random()*9;
    const r = 1.4 + Math.random()*1.2;
    const geom = new THREE.SphereGeometry(r, 12, 8);
    const mat = new THREE.MeshLambertMaterial({ color: 0xfffcf2, transparent: true, opacity: 0.85 });
    const m = new THREE.Mesh(geom, mat);
    m.scale.y = 0.5;
    m.position.set(x, y, z);
    cloudGroup.add(m);
  }
  scene.add(cloudGroup);
  scene.userData.clouds = cloudGroup;

  // border ring (thin dark trim)
  const trim = new THREE.Mesh(
    new THREE.RingGeometry(GRID_RADIUS * HEX_W * 1.05, GRID_RADIUS * HEX_W * 1.08, 64),
    new THREE.MeshBasicMaterial({ color: 0x8a7a5e, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
  );
  trim.rotation.x = -Math.PI/2;
  trim.position.y = 0.16;
  scene.add(trim);
}

// ─── Decoration builders (per tile type) ─────────────────────
function buildDecorMesh(type, axial) {
  const [q, r] = axial;
  switch (type) {
    case 'meadow':  return null; // floor only (color shift)
    case 'forest':  return decorForest(q, r);
    case 'water':   return null; // recolor floor
    case 'sakura':  return decorSakura(q, r);
    case 'rice':    return decorRice(q, r);
    case 'path':    return null; // floor only
    case 'house':   return decorHouse(q, r);
    case 'shrine':  return decorShrine(q, r);
    case 'pagoda':  return decorPagoda(q, r);
    case 'bridge':  return decorBridge(q, r);
    case 'well':    return decorWell(q, r);
    case 'lantern': return decorLantern(q, r);
    case 'mill':    return decorMill(q, r);
    case 'tea':     return decorTea(q, r);
  }
  return null;
}

function styleCellFloor(cellRecord, type) {
  const mesh = cellRecord.cellMesh;
  const baseDef = TILE_DEFS.find(d => d.id === type);
  let col = baseDef ? new THREE.Color(baseDef.color) : new THREE.Color(0xb8d39e);
  if (type === null) col = new THREE.Color(0xb8d39e);
  // jitter for variety
  const [q,r] = cellRecord.axial;
  const jitter = (q*17 + r*31) % 13 / 200;
  col.offsetHSL(0, -0.02, -0.02 + jitter);
  mesh.material.color = col;
  mesh.userData.baseColor = col.getHex();
}

function decorForest(q, r) {
  const g = new THREE.Group();

  const seedVal = (q*191 + r*89);

  for (let i = 0; i < n; i++) {
    const tx = ((seedVal + i*73) % 100) / 100 * (HEX_R*0.9) - HEX_R*0.45;
    const tz = ((seedVal + i*131) % 100) / 100 * (HEX_R*0.9) - HEX_R*0.45;
    const tree = makeTree(0.42 + ((seedVal+i*7)%30)*0.012);
    tree.position.set(tx, 0.12, tz);
    g.add(tree);
  }
  return g;
}

// ─── Palette ─────────────────────────────────────────────────
function initPalette() {
  palette = TILE_DEFS.map(d => ({ ...d, remaining: d.stock }));
  renderPalette();
}

function renderPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = '';
  for (const def of palette) {
    const el = document.createElement('div');
    el.className = 'tile';
    if (def.remaining <= 0) el.classList.add('empty');
    if (def.id === selectedType) el.classList.add('active');
    el.dataset.tileId = def.id;
    el.innerHTML = `
      <div class="icon">${def.icon}</div>
      <div class="name">${def.name}</div>
      <div class="count">${def.remaining}</div>
    `;
    el.addEventListener('click', () => selectType(def.id));
    grid.appendChild(el);
  }
}

function selectType(id) {
  selectedType = id;
  renderPalette();
}

function decrementStock(id) {
  const p = palette.find(t => t.id === id);
  if (p) { p.remaining = Math.max(0, p.remaining - 1); renderPalette(); }
}

function incrementStock(id) {
  const p = palette.find(t => t.id === id);
  if (p) { p.remaining += 1; renderPalette(); }
}

// ─── Tile placement / removal ───────────────────────────────
let removeMode = false;

function placeTile(q, r, type) {
  const key = axialKey(q, r);
  const rec = cellMap.get(key);
  if (!rec) return false;
  const def = palette.find(t => t.id === type);
  if (!def || def.remaining <= 0) {
    showToast(def ? `${def.name} の在庫が尽きました` : 'タイル不明');
    return false;
  }

  // remove previous decor if any
  if (rec.decorMesh) {
    decorGroup.remove(rec.decorMesh);
    if (rec.type) incrementStock(rec.type);
    rec.decorMesh = null;
  }

  // recolor floor based on terrain types; structures keep base meadow/path under them
  if (type === 'meadow' || type === 'forest' || type === 'water' || type === 'sakura' || type === 'rice' || type === 'path') {
    styleCellFloor(rec, type);
  } else {
    // for structures, use a soft path-like floor underneath
    styleCellFloor(rec, 'path');
  }

  // build decor mesh
  const m = buildDecorMesh(type, [q, r]);
  if (m) {
    const [wx, wz] = axialToWorld(q, r);
    m.position.x = wx;
    m.position.z = wz;
    m.rotation.y = ROTATIONS[rec.rot];
    decorGroup.add(m);
    rec.decorMesh = m;
  }

  rec.type = type;
  decrementStock(type);
  playPlaceSound();
  flashCell(rec);

  // kokoro recompute (cheap)
  recalcKokoro();
  checkAchievements();
  return true;
}

function removeTile(q, r) {
  const key = axialKey(q, r);
  const rec = cellMap.get(key);
  if (!rec || !rec.type) return false;
  if (rec.decorMesh) {
    decorGroup.remove(rec.decorMesh);
    rec.decorMesh = null;
  }
  incrementStock(rec.type);
  rec.type = null;
  styleCellFloor(rec, null);
  playPlaceSound(0.7);
  recalcKokoro();
  return true;
}

function rotateTile(q, r) {
  const key = axialKey(q, r);
  const rec = cellMap.get(key);
  if (!rec || !rec.decorMesh) return;
  rec.rot = (rec.rot + 1) % 4;
  rec.decorMesh.rotation.y = ROTATIONS[rec.rot];
  playPlaceSound(0.5);
}

function flashCell(rec) {
  // briefly raise the cell
  const t0 = performance.now();
  const dur = 380;
  const targetY = 0.0;
  const startY = 0.18;
  function step() {
    const t = (performance.now() - t0) / dur;
    if (t >= 1) { rec.cellMesh.position.y = targetY; return; }
    const ease = 1 - Math.pow(1-t, 3);
    rec.cellMesh.position.y = startY * (1 - ease);
    requestAnimationFrame(step);
  }
  rec.cellMesh.position.y = startY;
  requestAnimationFrame(step);
}

// ─── Kokoro (synergy scoring) ────────────────────────────────
function recalcKokoro() {
  let total = 0;
  let placed = 0;
  for (const rec of cellMap.values()) {
    if (!rec.type) continue;
    placed++;
    const t = rec.type;
    let base = 1;
    if (t === 'forest') base = 2;
    if (t === 'sakura') base = 3;
    if (t === 'shrine') base = 4;
    if (t === 'pagoda') base = 6;
    if (t === 'mill')   base = 3;
    if (t === 'tea')    base = 4;
    if (t === 'lantern')base = 2;
    if (t === 'well')   base = 2;
    if (t === 'house')  base = 1;
    if (t === 'bridge') base = 2;
    if (t === 'rice')   base = 2;
    if (t === 'water')  base = 1;
    if (t === 'path')   base = 0;
    if (t === 'meadow') base = 0;

    // synergy: count specific neighbor types
    let bonus = 0;
    const neigh = hexNeighbors(...rec.axial);
    let nForest=0,nWater=0,nHouse=0,nShrine=0,nPath=0,nLantern=0,nMeadow=0,nSakura=0,nMill=0;
    for (const [nq,nr] of neigh) {
      const nrec = cellMap.get(axialKey(nq, nr));
      if (!nrec || !nrec.type) continue;
      switch(nrec.type) {
        case 'forest': nForest++; break;
        case 'water':  nWater++;  break;
        case 'house':  nHouse++;  break;
        case 'shrine': nShrine++; break;
        case 'path':   nPath++;   break;
        case 'lantern':nLantern++;break;
        case 'meadow': nMeadow++; break;
        case 'sakura': nSakura++; break;
        case 'mill':   nMill++;   break;
      }
    }
    // synergy rules
    if (t === 'house' && nForest >= 1) bonus += 1;
    if (t === 'house' && nWater  >= 1) bonus += 1;
    if (t === 'house' && nPath   >= 1) bonus += 1;
    if (t === 'shrine'&& nForest >= 2) bonus += 3;
    if (t === 'shrine'&& nLantern>= 1) bonus += 2;
    if (t === 'pagoda'&& nForest >= 3) bonus += 5;
    if (t === 'bridge'&& nWater  >= 2) bonus += 3;
    if (t === 'mill'  && nWater  >= 2) bonus += 4;
    if (t === 'tea'   && nSakura >= 1) bonus += 3;
    if (t === 'tea'   && nWater  >= 1) bonus += 2;
    if (t === 'sakura'&& nWater  >= 1) bonus += 1;
    if (t === 'sakura'&& nMeadow >= 2) bonus += 1;
    if (t === 'forest'&& nForest >= 2) bonus += 1;  // grove bonus
    if (t === 'lantern'&&nPath   >= 1) bonus += 1;
    if (t === 'well'  && nHouse  >= 1) bonus += 1;

    total += base + bonus;
  }
  placedKokoro = total;
  document.getElementById('kokoro').textContent = total;
  // update soft hint
  updateMessage(placed, total);
}

function updateMessage(placed, total) {
  const msgEl = document.getElementById('message');
  const lines = [
    '六角を選び、緑や水を重ねて整えてゆく。',
    '森の隣に家を置くと、心がやわらぐ。',
    '水辺に橋を架けると、流れが生まれる。',
    '桜の隣に茶室を置けば、静かな時が訪れる。',
    '塔の足元には森を、祠の前には灯りを。',
    '水車は水辺に。三方を水に囲まれると、よく回る。',
    '同じ景色を、ゆっくり育ててください。',
  ];
  if (placed === 0) msgEl.textContent = lines[0];
  else if (placed < 5) msgEl.textContent = lines[1];
  else if (placed < 15) msgEl.textContent = lines[2 + (placed % 4)];
  else if (placed < 30) msgEl.textContent = lines[4 + (total % 3)];
  else msgEl.textContent = lines[6];
}

function seedInitialGarden() {
  // center: shrine, surrounded by 1 lantern, 1 path, 1 forest
  placeTile(0, 0, 'shrine');
  placeTile(1, 0, 'path');
  placeTile(-1, 0, 'forest');
  placeTile(0, 1, 'lantern');
  placeTile(0, -1, 'meadow');
}

// ─── Achievements ────────────────────────────────────────────
const ACHIEVEMENTS = [
  { id:'first',     title:'最初のひとつ',   desc:'一枚目を置いた',   check: () => countPlaced() >= 1 },
  { id:'fifteen',   title:'十五の景色',     desc:'15枚を置いた',     check: () => countPlaced() >= 15 },
  { id:'kokoro30',  title:'心 30',          desc:'スコア30に到達',   check: () => placedKokoro >= 30 },
  { id:'kokoro80',  title:'心 80',          desc:'スコア80に到達',   check: () => placedKokoro >= 80 },
  { id:'grove',     title:'三本の森',       desc:'森を3つ隣接',     check: () => countAdjacentSame('forest', 2) },
  { id:'sakuratea', title:'花のもとに茶',   desc:'桜の隣に茶室',     check: () => countAdjacent('tea','sakura') },
  { id:'shrineforest', title:'森の祠',     desc:'祠の隣に森を3つ',  check: () => countAdjacent('shrine','forest', 3) },
  { id:'milllake',  title:'水車の歌',       desc:'水車の隣に水を2つ', check: () => countAdjacent('mill','water', 2) },
];

function countPlaced() {
  let n=0; for (const r of cellMap.values()) if (r.type && r.type !== 'meadow' && r.type !== 'path') n++;
  return n;
}
function countAdjacent(typeA, typeB, minCount=1) {
  for (const rec of cellMap.values()) {
    if (rec.type !== typeA) continue;
    let cnt = 0;
    for (const [nq,nr] of hexNeighbors(...rec.axial)) {
      const n = cellMap.get(axialKey(nq, nr));
      if (n && n.type === typeB) cnt++;
    }
    if (cnt >= minCount) return true;
  }
  return false;
}
function countAdjacentSame(type, neighbors) {
  for (const rec of cellMap.values()) {
    if (rec.type !== type) continue;
    let cnt = 0;
    for (const [nq,nr] of hexNeighbors(...rec.axial)) {
      const n = cellMap.get(axialKey(nq, nr));
      if (n && n.type === type) cnt++;
    }
    if (cnt >= neighbors) return true;
  }
  return false;
}

function checkAchievements() {
  for (const a of ACHIEVEMENTS) {
    if (achievementsUnlocked.has(a.id)) continue;
    if (a.check()) {
      achievementsUnlocked.add(a.id);
      showAchievement(a.title, a.desc);
    }
  }
}

function showAchievement(title, desc) {
  const el = document.getElementById('achievement');
  document.getElementById('achTitle').textContent = title;
  document.getElementById('achDesc').textContent = desc;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3200);
}

// ─── Input ───────────────────────────────────────────────────
function bindInput() {
  const canvas = renderer.domElement;
  let downX=0, downY=0, downT=0;
  canvas.addEventListener('pointerdown', (e)=>{ downX=e.clientX; downY=e.clientY; downT=performance.now(); });
  canvas.addEventListener('pointerup', (e)=>{
    const dx=e.clientX-downX, dy=e.clientY-downY, dt=performance.now()-downT;
    if (Math.hypot(dx,dy) < 6 && dt < 350) handleTap(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', (e)=>{ updateHover(e.clientX, e.clientY); });
  canvas.addEventListener('pointerleave', ()=>{ hoverMesh.visible = false; document.getElementById('hover-info').classList.remove('show'); });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'r' || e.key === 'R') document.getElementById('rotateBtn').click();
    if (e.key === 'x' || e.key === 'X' || e.key === 'Delete' || e.key === 'Backspace') document.getElementById('removeBtn').click();
    // hotkeys 1..9 for first 9 palette items
    const idx = parseInt(e.key, 10);
    if (!isNaN(idx) && idx >= 1 && idx <= TILE_DEFS.length) selectType(TILE_DEFS[idx-1].id);
  });
}

function castRayToBoard(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  for (const rec of cellMap.values()) meshes.push(rec.cellMesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length === 0) return null;
  return hits[0].object.userData.axial;
}

function handleTap(cx, cy) {
  const ax = castRayToBoard(cx, cy);
  if (!ax) return;
  const [q, r] = ax;
  if (removeMode) {
    removeTile(q, r);
  } else {
    if (selectedType) placeTile(q, r, selectedType);
  }
}

function updateHover(cx, cy) {
  const ax = castRayToBoard(cx, cy);
  const hoverEl = document.getElementById('hover-info');
  if (!ax) {
    hoverMesh.visible = false;
    hoverEl.classList.remove('show');
    return;
  }
  const [q, r] = ax;
  const [wx, wz] = axialToWorld(q, r);
  hoverMesh.position.set(wx, 0.05, wz);
  hoverMesh.visible = true;
  // label
  const rec = cellMap.get(axialKey(q, r));
  if (rec && rec.type) {
    const def = TILE_DEFS.find(d => d.id === rec.type);
    hoverEl.textContent = def ? def.name : '';
  } else {
    hoverEl.textContent = removeMode ? '取り除く' : (selectedType ? '置く: ' + (TILE_DEFS.find(d=>d.id===selectedType)?.name || '') : '');
  }
  hoverEl.style.left = (cx + 14) + 'px';
  hoverEl.style.top  = (cy + 14) + 'px';
  hoverEl.classList.add('show');
}

// ─── UI binding ──────────────────────────────────────────────
function bindUI() {
  document.getElementById('removeBtn').addEventListener('click', () => {
    removeMode = !removeMode;
    document.getElementById('removeBtn').textContent = removeMode ? '配置にもどす' : '取り除く';
    showToast(removeMode ? '取り除くタイルをタップ' : '配置モード');
  });
  document.getElementById('rotateBtn').addEventListener('click', () => {
    // rotate last hovered? Use last placed instead.
    // Find any cell under hoverMesh
    const rec = pickHoveredCell();
    if (rec) rotateTile(...rec.axial);
    else showToast('回転したい建物の上にカーソルを合わせて R');
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('箱庭を最初からやり直しますか？（積み上げた景色は消えます）')) return;
    for (const rec of cellMap.values()) {
      if (rec.decorMesh) { decorGroup.remove(rec.decorMesh); rec.decorMesh = null; }
      rec.type = null;
      styleCellFloor(rec, null);
    }
    initPalette();
    achievementsUnlocked.clear();
    recalcKokoro();
    seedInitialGarden();
    showToast('最初の景色から');
  });
  document.getElementById('bgmCtl').addEventListener('click', () => toggleBgm());
  document.getElementById('cameraCtl').addEventListener('click', () => {
    camRotIndex = (camRotIndex + 1) % 4;
    setCameraAngle();
  });
}

function pickHoveredCell() {
  if (!hoverMesh.visible) return null;
  // brute search
  for (const rec of cellMap.values()) {
    const [wx, wz] = rec.world;
    if (Math.abs(wx - hoverMesh.position.x) < 0.01 && Math.abs(wz - hoverMesh.position.z) < 0.01) return rec;
  }
  return null;
}

// ─── Audio ───────────────────────────────────────────────────
function playPlaceSound(vol = 1.0) {
  try {
    if (!bgmCtx) bgmCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = bgmCtx;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(660, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12 * vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + 0.25);
  } catch(e){}
}

function toggleBgm() {
  bgmEnabled = !bgmEnabled;
  const ctl = document.getElementById('bgmCtl');
  ctl.classList.toggle('on', bgmEnabled);
  ctl.textContent = bgmEnabled ? '♪ BGM ✓' : '♪ BGM';
  if (bgmEnabled) startAmbientBgm();
  else stopAmbientBgm();
}

let bgmNodes = [];
function startAmbientBgm() {
  try {
    if (!bgmCtx) bgmCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = bgmCtx;
    bgmGain = ctx.createGain();
    bgmGain.gain.value = 0.0;
    bgmGain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 2.0);
    bgmGain.connect(ctx.destination);
    // gentle pentatonic drift
    const pitches = [196, 233, 294, 349, 392, 466, 587]; // G3-D5 (G mixolydian-ish)
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.type = i === 0 ? 'sine' : (i === 1 ? 'triangle' : 'sine');
      o.frequency.value = pitches[(i*2) % pitches.length] / (i === 2 ? 2 : 1);
      og.gain.value = 0.4 / (i+1);
      o.connect(og).connect(bgmGain);
      // detune wobble
      o.detune.value = (i-1) * 3;
      bgmNodes.push({ o, og, i });
      o.start();
    }
    // slow LFO modulating gain
    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    lfo.frequency.value = 0.08;
    lfoG.gain.value = 0.03;
    lfo.connect(lfoG).connect(bgmGain.gain);
    lfo.start();
    bgmNodes.push({ o: lfo, og: lfoG, i: 99 });
    // melodic random plucks
    bgmNodes.push({ interval: setInterval(()=>playRandomPluck(pitches), 2500) });
  } catch(e){ console.warn(e); }
}

function playRandomPluck(pitches) {
  if (!bgmEnabled || !bgmCtx) return;
  const ctx = bgmCtx;
  const t = ctx.currentTime;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'triangle';
  o.frequency.value = pitches[Math.floor(Math.random()*pitches.length)];
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.04, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
  o.connect(g).connect(bgmGain || ctx.destination);
  o.start(t); o.stop(t + 1.3);
}

function stopAmbientBgm() {
  for (const n of bgmNodes) {
    if (n.interval) clearInterval(n.interval);
    if (n.o && n.o.stop) try { n.o.stop(); } catch(e){}
  }
  bgmNodes = [];
  if (bgmGain) { try { bgmGain.disconnect(); } catch(e){} bgmGain = null; }
}

// ─── Toast ───────────────────────────────────────────────────
function showToast(msg, ms=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), ms);
}

// ─── Time-of-day ─────────────────────────────────────────────
function updateTimeOfDay(dt) {
  timeOfDay = (timeOfDay + dt * timeSpeed) % 1.0;
  const t = timeOfDay;
  // sky color palettes:
  // 0.0 night (#1a1c30), 0.2 dawn (#f0c2a8), 0.45 noon (#f6efe0), 0.7 dusk (#e8b58d), 0.9 night again
  const palette = [
    { t: 0.0,  col: 0x1a1c30, sun: 0x4060a0, amb: 0x303048, intensity: 0.25 },
    { t: 0.18, col: 0xe8c2a8, sun: 0xffb480, amb: 0xc09080, intensity: 0.55 },
    { t: 0.5,  col: 0xf6efe0, sun: 0xfff1d6, amb: 0xfff2dc, intensity: 0.95 },
    { t: 0.74, col: 0xe8b58d, sun: 0xffa060, amb: 0xc0807a, intensity: 0.55 },
    { t: 0.95, col: 0x1a1c30, sun: 0x4060a0, amb: 0x303048, intensity: 0.25 },
  ];
  let p0 = palette[0], p1 = palette[1];
  for (let i = 0; i < palette.length - 1; i++) {
    if (t >= palette[i].t && t < palette[i+1].t) { p0 = palette[i]; p1 = palette[i+1]; break; }
  }
  const k = (t - p0.t) / (p1.t - p0.t);
  const c0 = new THREE.Color(p0.col), c1 = new THREE.Color(p1.col);
  const cf = c0.clone().lerp(c1, k);
  scene.background = cf;
  scene.fog.color = cf;
  const sun = scene.userData.sun;
  const ambient = scene.userData.ambient;
  sun.color.setHex(p0.sun).lerp(new THREE.Color(p1.sun), k);
  ambient.color.setHex(p0.amb).lerp(new THREE.Color(p1.amb), k);
  sun.intensity = p0.intensity + (p1.intensity - p0.intensity) * k;
  ambient.intensity = 0.3 + sun.intensity * 0.25;
  // sun position (rotates around board)
  const sunAngle = t * Math.PI * 2 - Math.PI/2;
  sun.position.set(Math.cos(sunAngle) * 26, Math.max(6, Math.sin(sunAngle) * 30 + 6), Math.sin(sunAngle) * 18 + 4);

  // boost lantern emissive at night
  const nightFactor = Math.max(0, Math.min(1, 1 - sun.intensity / 0.95));
  decorGroup.traverse(obj => {
    if (obj.userData && obj.userData.isLanternHead && obj.material) {
      obj.material.emissiveIntensity = 0.2 + nightFactor * 0.9;
    }
  });

  // time label
  const labels = ['夜', '夜', '暁', '朝', '朝', '昼', '昼', '夕', '夕', '宵', '夜'];
  const idx = Math.min(labels.length-1, Math.floor(t * labels.length));
  document.getElementById('time').textContent = labels[idx];
}

// ─── Mill wheel animation ────────────────────────────────────
function animateDecor(dt) {
  decorGroup.traverse(obj => {
    if (obj.userData && obj.userData.isMillWheel) {
      obj.rotation.x += dt * 1.2;
    }
  });
  // float clouds
  if (scene.userData.clouds) {
    scene.userData.clouds.rotation.y += dt * 0.005;
  }
}

// ─── Loop ────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTs) / 1000);
  lastTs = now;
  updateTimeOfDay(dt);
  animateDecor(dt);
  renderer.render(scene, camera);
}

function onResize() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.left = -CAMERA_VIEW * aspect;
  camera.right = CAMERA_VIEW * aspect;
  camera.top = CAMERA_VIEW;
  camera.bottom = -CAMERA_VIEW;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
