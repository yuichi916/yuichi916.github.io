<style>
:root{
  --indigo:#0a1320;
  --indigo-2:#13243a;
  --indigo-3:#1d3552;
  --paper:#e8dcb8;
  --paper-soft:#f3e7c4;
  --paper-dim:#b8a878;
  --ink-soft:#7a6e58;
  --candle:#ffb968;
  --candle-soft:#ffd970;
  --candle-deep:#d68a30;
  --moss:#5a7a4a;
  --vermilion:#b04030;
  --water:#7ac0d8;
  --night-blue:#3a5070;
  --wood:#a87a4a;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;background:var(--indigo);color:var(--paper);
  font-family:"Shippori Mincho","Cormorant Garamond",serif;
  font-feature-settings:"palt";letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;  /* world handles all panning */
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
a{color:var(--candle);text-decoration:none;}
a:hover{color:var(--candle-soft);}

/* ──── grain (over everything) ──── */
body::after{content:"";position:fixed;inset:0;z-index:300;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7 0 0 0 0 0.6 0 0 0 0 0.4 0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.4;mix-blend-mode:overlay;}

/* ──── top bar ──── */
.bar{position:fixed;top:0;left:0;right:0;z-index:60;height:54px;
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  background:linear-gradient(180deg,rgba(10,19,32,.92),rgba(10,19,32,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:auto;}
.bar .brand{display:flex;align-items:center;gap:10px;
  font-family:"Shippori Mincho",serif;font-weight:700;font-size:16px;
  letter-spacing:.18em;color:var(--paper-soft);}
.bar .brand .lantern{display:inline-block;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff2c0, var(--candle) 50%, transparent 80%);
  box-shadow:0 0 10px var(--candle), 0 0 20px rgba(255,180,90,.4);
  animation:flicker 4s ease-in-out infinite;}
@keyframes flicker{0%,30%,40%,100%{opacity:1;}35%,42%{opacity:.75;}}
.bar .brand .sub{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:12.5px;color:var(--ink-soft);letter-spacing:.16em;margin-left:4px;font-weight:400;}
.bar .tools{display:flex;gap:8px;align-items:center;}
.bar .tool{width:34px;height:34px;border-radius:50%;
  background:rgba(28,42,58,.6);border:1px solid rgba(216,178,112,.18);
  color:var(--paper-dim);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;}
.bar .tool:hover{border-color:var(--candle);color:var(--candle);}
.bar .tool.active{color:var(--candle);border-color:var(--candle);
  box-shadow:0 0 10px rgba(255,185,104,.4);}
.bar .back{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:13px;color:var(--ink-soft);padding-left:8px;}
.bar .back:hover{color:var(--candle);}
@media (max-width:720px){
  .bar{padding:0 12px;}
  .bar .brand .sub{display:none;}
}

/* ──── world (camera-driven) ──── */
.world{position:fixed;inset:0;overflow:hidden;}
.layer{position:absolute;top:0;bottom:0;left:0;will-change:transform;
  pointer-events:none;}
/* each layer's content is wide and absolutely positioned within it */
.layer-content{position:relative;width:100%;height:100%;}

/* skydome (fixed gradient, slight nebula) */
.layer-sky{
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(58,80,112,.45), transparent 65%),
    radial-gradient(ellipse 50% 30% at 20% 14%, rgba(120,80,160,.15), transparent 70%),
    radial-gradient(ellipse 50% 30% at 80% 22%, rgba(180,140,220,.12), transparent 70%),
    linear-gradient(180deg, var(--indigo) 0%, var(--indigo-2) 50%, var(--indigo) 100%);}

/* starfield (layered) */
.stars-near, .stars-far{position:absolute;inset:0;mix-blend-mode:screen;}
.stars-far{
  background-image:
    radial-gradient(0.7px 0.7px at 6% 14%, #fff2c0, transparent),
    radial-gradient(0.6px 0.6px at 19% 8%, #ffe9b0, transparent),
    radial-gradient(0.8px 0.8px at 31% 22%, #fff8d8, transparent),
    radial-gradient(0.6px 0.6px at 47% 6%, #ffd970, transparent),
    radial-gradient(0.7px 0.7px at 58% 26%, #fff2c0, transparent),
    radial-gradient(0.5px 0.5px at 71% 14%, #fff8d8, transparent),
    radial-gradient(0.8px 0.8px at 84% 8%, #ffe9b0, transparent),
    radial-gradient(0.6px 0.6px at 92% 28%, #fff2c0, transparent),
    radial-gradient(0.5px 0.5px at 12% 38%, #fff8d8, transparent),
    radial-gradient(0.6px 0.6px at 38% 44%, #ffe9b0, transparent),
    radial-gradient(0.7px 0.7px at 64% 38%, #fff2c0, transparent),
    radial-gradient(0.5px 0.5px at 86% 42%, #ffd970, transparent);
  background-size:1200px 600px;background-repeat:repeat-x;opacity:.55;}
.stars-near{
  background-image:
    radial-gradient(1px 1px at 13% 18%, #fff8d8, transparent),
    radial-gradient(0.9px 0.9px at 28% 12%, #fff2c0, transparent),
    radial-gradient(1.1px 1.1px at 52% 22%, #ffd970, transparent),
    radial-gradient(0.9px 0.9px at 75% 16%, #fff8d8, transparent),
    radial-gradient(1px 1px at 91% 26%, #fff2c0, transparent);
  background-size:900px 500px;background-repeat:repeat-x;opacity:.85;
  animation:twinkleAll 6s ease-in-out infinite;}
@keyframes twinkleAll{
  0%,100%{opacity:.85;}
  50%{opacity:.55;}
}

/* moon (mostly fixed) */
.moon{position:absolute;top:9%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fffce6, var(--candle-soft) 35%, #a88848 75%, transparent 95%);
  box-shadow:0 0 60px rgba(255,217,112,.32), 0 0 120px rgba(255,217,112,.18);}

/* far mountains */
.far-mtn{position:absolute;bottom:30%;left:0;width:200%;height:30%;
  background:
    linear-gradient(180deg, transparent 0%, rgba(20,30,46,.45) 60%, rgba(10,19,32,.85) 100%);}
.far-mtn svg{position:absolute;left:0;bottom:0;width:100%;height:100%;
  display:block;filter:blur(.5px);}

/* mid-distance hills */
.mid-hill{position:absolute;bottom:18%;left:0;width:200%;height:35%;}
.mid-hill svg{position:absolute;left:0;bottom:0;width:100%;height:100%;display:block;}

/* trees (near) */
.near-tree{position:absolute;bottom:0;left:0;width:200%;height:60%;
  pointer-events:none;}
.near-tree svg{position:absolute;left:0;bottom:0;width:100%;height:100%;display:block;}

/* ground (gentle slope, walkable feeling) */
.ground{position:absolute;bottom:0;left:0;width:200%;height:14%;
  background:
    linear-gradient(180deg, rgba(30,22,12,.55) 0%, rgba(15,10,4,.95) 100%);}
.ground::before{content:"";position:absolute;left:0;top:0;width:100%;height:6px;
  background:linear-gradient(180deg, rgba(216,178,112,.3), transparent);}

/* fog (front, soft drift) */
.fog{position:absolute;bottom:8%;left:0;width:200%;height:32%;
  background:
    radial-gradient(ellipse 40% 50% at 15% 60%, rgba(216,178,112,.07), transparent 70%),
    radial-gradient(ellipse 30% 40% at 50% 70%, rgba(216,178,112,.06), transparent 70%),
    radial-gradient(ellipse 35% 50% at 80% 50%, rgba(216,178,112,.06), transparent 70%);
  filter:blur(6px);}

/* place objects (decorative, walkable past) */
.place-obj{position:absolute;bottom:14%;pointer-events:auto;cursor:pointer;z-index:3;
  transition:filter .2s;}
.place-obj svg{display:block;}
.place-obj:hover{filter:brightness(1.18) drop-shadow(0 0 12px rgba(255,217,112,.4));}
.place-obj .place-name{position:absolute;left:50%;top:-32px;transform:translateX(-50%);
  font-family:"Shippori Mincho",serif;font-weight:700;font-size:13px;
  letter-spacing:.14em;color:var(--paper-soft);white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  background:rgba(10,19,32,.7);padding:3px 12px;border-radius:2px;
  border:1px solid rgba(216,178,112,.22);
  opacity:.7;transition:opacity .2s;}
.place-obj.near .place-name{opacity:1;
  border-color:var(--candle);
  box-shadow:0 0 16px rgba(255,180,90,.3);}

/* avatar — placed slightly left of centre so the world extends to the right */
.avatar{position:fixed;left:38%;bottom:13%;transform:translateX(-50%);
  z-index:50;width:120px;height:160px;pointer-events:none;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));}
.avatar::before{content:"";position:absolute;left:50%;bottom:-8px;
  transform:translateX(-50%);
  width:160px;height:18px;border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(255,217,112,.32) 0%, rgba(255,180,90,.12) 50%, transparent 80%);
  z-index:0;}
.avatar .lantern-glow{position:absolute;left:66%;top:22%;
  width:240px;height:240px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,
    rgba(255,217,112,.45) 0%, rgba(255,180,90,.18) 30%, rgba(255,140,40,.05) 60%, transparent 82%);
  z-index:1;mix-blend-mode:screen;
  pointer-events:none;animation:lanternGlow 3s ease-in-out infinite;}
@keyframes lanternGlow{
  0%,100%{opacity:.85;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}
}
.avatar .body{position:absolute;left:0;top:0;width:100%;height:100%;
  z-index:2;}
.avatar.walking .body{animation:walkBob .6s ease-in-out infinite;}
@keyframes walkBob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-2px);}
}
.avatar.flip .body{transform:scaleX(-1);}
.avatar.flip.walking .body{animation:walkBobFlip .6s ease-in-out infinite;}
@keyframes walkBobFlip{
  0%,100%{transform:scaleX(-1) translateY(0);}
  50%{transform:scaleX(-1) translateY(-2px);}
}

/* hint above avatar */
.hint{position:fixed;left:38%;bottom:calc(13% + 180px);transform:translate(-50%, 8px);
  z-index:55;font-family:"Shippori Mincho",serif;font-size:13.5px;
  color:var(--paper);background:rgba(10,19,32,.92);
  border:1px solid var(--candle);border-radius:4px;padding:8px 16px;
  letter-spacing:.06em;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .2s, transform .2s;
  box-shadow:0 6px 18px rgba(0,0,0,.6), 0 0 16px rgba(255,180,90,.2);}
.hint.show{opacity:1;transform:translate(-50%, 0);}
.hint kbd{font-family:"JetBrains Mono",monospace;font-size:11px;
  background:rgba(255,185,104,.18);border:1px solid var(--candle);
  border-radius:3px;padding:2px 7px;color:var(--candle-soft);margin:0 3px;
  letter-spacing:.02em;}

/* compass / progress bar (top bar middle) */
.compass{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:62;
  width:min(440px, 60vw);height:32px;
  display:flex;align-items:center;gap:10px;pointer-events:none;
  font-family:"Cormorant Garamond",serif;font-style:italic;font-size:11px;
  color:var(--paper-dim);letter-spacing:.16em;}
.compass .label{flex-shrink:0;color:var(--ink-soft);}
.compass .track{flex:1;height:2px;background:rgba(216,178,112,.16);
  border-radius:1px;position:relative;}
.compass .progress{position:absolute;left:0;top:0;height:100%;
  background:linear-gradient(90deg, var(--candle), var(--candle-soft));
  border-radius:1px;width:0;}
.compass .pin{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;
  background:var(--candle);box-shadow:0 0 12px rgba(255,180,90,.6);}
.compass .marker{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:5px;height:5px;border-radius:50%;
  background:rgba(216,178,112,.5);}
.compass .marker.visited{background:#88e0a0;}
@media (max-width:720px){.compass{width:62vw;}}

/* minimap (bottom-right) */
.minimap{position:fixed;right:14px;bottom:14px;z-index:62;
  width:200px;height:46px;
  background:rgba(10,19,32,.88);border:1px solid rgba(216,178,112,.2);
  border-radius:4px;padding:6px 8px;
  font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-soft);
  letter-spacing:.06em;backdrop-filter:blur(8px);pointer-events:none;}
.minimap .title{margin-bottom:3px;color:var(--paper-dim);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;}
.minimap .mini-track{position:relative;height:6px;background:rgba(216,178,112,.14);
  border-radius:3px;}
.minimap .mini-pin{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:6px;height:6px;border-radius:50%;background:var(--candle);
  box-shadow:0 0 6px var(--candle);}
.minimap .mini-marker{position:absolute;top:50%;transform:translate(-50%,-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(216,178,112,.4);}
.minimap .mini-marker.visited{background:#88e0a0;}
@media (max-width:720px){.minimap{width:140px;height:42px;}}

/* mobile touch buttons */
.tcontrol{display:none;}
@media (pointer:coarse), (max-width:720px){
  .tcontrol{display:flex;position:fixed;bottom:14px;left:14px;z-index:62;gap:8px;}
  .tcontrol button{
    width:52px;height:52px;border-radius:50%;
    background:rgba(10,19,32,.85);border:1px solid rgba(216,178,112,.3);
    color:var(--paper-soft);font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);}
  .tcontrol button:active{background:rgba(255,185,104,.2);color:var(--candle);}
}

/* ──── overlay (place content modal) ──── */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);padding:60px 16px 80px;overflow-y:auto;}
.overlay.open{display:flex;animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.overlay-inner{background:linear-gradient(180deg, #15243a 0%, #0a1320 100%);
  border:1px solid var(--candle);border-radius:6px;
  padding:36px 40px 32px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;
  position:relative;box-shadow:0 24px 60px rgba(0,0,0,.7), 0 0 40px rgba(255,180,90,.12);}
.overlay-close{position:absolute;top:12px;right:16px;background:transparent;
  border:none;color:var(--ink-soft);cursor:pointer;font-size:24px;line-height:1;
  width:36px;height:36px;border-radius:50%;transition:all .15s;}
.overlay-close:hover{color:var(--candle);background:rgba(255,185,104,.1);}
.overlay-eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.32em;text-transform:uppercase;color:var(--candle);
  display:inline-flex;align-items:center;gap:10px;margin-bottom:6px;}
.overlay-eyebrow::before{content:"";width:30px;height:1px;background:var(--candle);}
.overlay-inner h2{font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:clamp(26px,3.4vw,38px);color:var(--paper);
  margin:4px 0 4px;letter-spacing:.08em;line-height:1.25;}
.overlay-inner h2 em{font-style:normal;color:var(--candle);}
.overlay-en{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:14px;color:var(--paper-dim);letter-spacing:.16em;margin-bottom:18px;}
.overlay-deck{font-family:"Shippori Mincho",serif;font-size:15px;
  color:var(--paper-dim);line-height:2.1;margin-bottom:22px;}
.overlay-deck em{font-style:normal;color:var(--paper-soft);}
.overlay-cta{display:inline-flex;align-items:center;gap:14px;
  font-family:"Cormorant Garamond","Shippori Mincho",serif;font-style:italic;
  font-size:15.5px;letter-spacing:.06em;color:var(--candle);
  padding:12px 26px;border:1px solid rgba(255,185,104,.4);border-radius:4px;
  background:rgba(255,185,104,.05);cursor:pointer;transition:all .2s;text-decoration:none;}
.overlay-cta:hover{background:rgba(255,185,104,.15);border-color:var(--candle);
  gap:20px;color:var(--candle-soft);}

/* ── breathing widget (inside overlay) ── */
.breath-widget{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.breath-circle{width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,180,80,.55), rgba(255,140,40,.32) 50%, rgba(176,64,48,.05) 90%);
  box-shadow:0 0 50px rgba(255,140,40,.32), inset 0 0 30px rgba(255,217,112,.32);
  display:flex;align-items:center;justify-content:center;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:24px;color:var(--paper-soft);letter-spacing:.12em;
  transition:transform 4s cubic-bezier(.4,0,.4,1);}
.breath-circle.in, .breath-circle.hold{transform:scale(1.32);}
.breath-circle.out{transform:scale(1);}
.breath-phase{font-family:"Shippori Mincho",serif;font-size:14.5px;
  color:var(--paper-dim);letter-spacing:.16em;min-height:24px;}
.breath-phase b{color:var(--candle);font-weight:500;}
.breath-btn{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:14.5px;letter-spacing:.06em;color:var(--candle);
  padding:9px 22px;border:1px solid rgba(255,185,104,.4);border-radius:4px;
  background:transparent;cursor:pointer;transition:all .2s;}
.breath-btn:hover{background:rgba(255,185,104,.1);}
.breath-hint{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;
  max-width:380px;line-height:1.7;text-align:center;}

/* ── poems ── */
.poems{display:flex;flex-direction:column;gap:26px;}
.poem{font-family:"Shippori Mincho",serif;color:var(--paper-soft);
  font-size:14.5px;line-height:2.3;letter-spacing:.06em;
  border-left:1px solid rgba(122,192,216,.32);
  padding-left:18px;}
.poem .signature{display:block;margin-top:4px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;}
.poem em{color:var(--candle-soft);font-style:normal;}

/* ── ambient tiles ── */
.ambient-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;}
.amb-tile{padding:14px 16px;background:rgba(28,42,58,.6);
  border:1px solid rgba(122,192,216,.22);border-radius:4px;
  text-decoration:none;color:var(--paper);transition:all .2s;
  display:flex;flex-direction:column;gap:3px;}
.amb-tile:hover{border-color:var(--water);background:rgba(122,192,216,.1);
  transform:translateY(-2px);}
.amb-tile .icon{font-size:20px;margin-bottom:4px;}
.amb-tile .name{font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:13.5px;color:var(--paper);}
.amb-tile .src{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:10px;color:var(--paper-dim);letter-spacing:.06em;text-transform:uppercase;}

/* ── starscape ── */
.starscape{position:relative;width:100%;height:240px;
  border-radius:6px;overflow:hidden;
  border:1px solid rgba(216,178,112,.18);
  background:radial-gradient(ellipse at 50% 100%, #1a2838 0%, var(--indigo) 100%);}
.starscape .horizon{position:absolute;bottom:0;left:0;right:0;height:14%;
  background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.7) 100%);}
.starscape .star{position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff8d8;box-shadow:0 0 4px #fff2c0;}
.starscape .star.lg{width:3px;height:3px;
  box-shadow:0 0 6px #fff8d8, 0 0 12px rgba(255,217,112,.5);}
.starscape .star.tw{animation:starTw 3s ease-in-out infinite;}
@keyframes starTw{
  0%,100%{opacity:.85;transform:scale(1);}
  50%{opacity:.4;transform:scale(.85);}
}
.starscape .shootingstar{position:absolute;width:80px;height:1px;
  background:linear-gradient(90deg, transparent, #fff8d8, transparent);
  transform:rotate(-15deg);opacity:0;animation:shoot 12s linear infinite;}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0) rotate(-15deg);}
  3%{opacity:.85;}
  10%{opacity:0;transform:translate(180px,40px) rotate(-15deg);}
  100%{opacity:0;}
}

/* ── intro splash (first time) ── */
.splash{position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg, rgba(10,19,32,.96), rgba(10,19,32,.99));
  flex-direction:column;gap:20px;padding:24px;text-align:center;}
.splash.hidden{display:none;}
.splash .title{font-family:"Shippori Mincho",serif;font-weight:500;
  font-size:clamp(32px,5vw,52px);letter-spacing:.18em;color:var(--paper);}
.splash .title em{font-style:normal;color:var(--candle);
  text-shadow:0 0 24px rgba(255,180,90,.5);}
.splash .en{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:clamp(14px,1.5vw,17px);color:var(--candle);letter-spacing:.32em;}
.splash .sub{font-family:"Shippori Mincho",serif;font-size:14.5px;
  color:var(--paper-dim);max-width:520px;line-height:2.1;}
.splash .keys{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:8px;
  font-family:"Shippori Mincho",serif;color:var(--paper-dim);font-size:13px;}
.splash .keys span{display:inline-flex;align-items:center;gap:6px;}
.splash .keys kbd{font-family:"JetBrains Mono",monospace;font-size:11px;
  background:rgba(255,185,104,.15);border:1px solid var(--candle);
  border-radius:3px;padding:2px 7px;color:var(--candle-soft);}
.splash .enter-btn{margin-top:22px;
  padding:14px 36px;background:linear-gradient(180deg, var(--candle-soft), var(--candle-deep));
  color:var(--indigo);font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:15.5px;letter-spacing:.18em;border:none;border-radius:3px;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,180,90,.4);transition:all .2s;}
.splash .enter-btn:hover{transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(255,180,90,.55);}
</style>
</head>
<body>

<script>
// ─── World configuration ────────────────────────────────────────────
const WORLD_WIDTH = 10800;   // total world width in px (camera ranges 0..WORLD_WIDTH)
const PLACES = [
  {id:"tsuki",   x:900,  name:"月光の書架",    en:"Moonlit Library",
   icon:"shelf", color:"#d8c08a"},
  {id:"oto",     x:2100, name:"音の祠",        en:"Sound Shrine",
   icon:"torii", color:"#c5a0ff"},
  {id:"tabi",    x:3300, name:"ひとり旅の道",  en:"Solitary Road",
   icon:"sign",  color:"#e09080"},
  {id:"takibi",  x:4500, name:"焚き火の前",    en:"At the Bonfire",
   icon:"fire",  color:"#ff8a3a"},
  {id:"mizube",  x:5700, name:"水辺の岸",      en:"Water's Edge",
   icon:"water", color:"#7ac0d8"},
  {id:"toki",    x:6900, name:"時の砂時計",    en:"Hourglass",
   icon:"clock", color:"#c2956a"},
  {id:"amaoto",  x:8100, name:"雨音の部屋",    en:"Room of Rain",
   icon:"hut",   color:"#9ec5e0"},
  {id:"hoshi",   x:9300, name:"星見台",        en:"Observatory",
   icon:"scope", color:"#fff2c0"},
];
const INTERACT_RANGE = 130;   // how close to a place to trigger hint

// ─── State (exposed on window for tooling) ─────────────────────────
let cameraX = 0;
window.__niwaSetCamera = (x) => { cameraX = Math.max(0, Math.min(WORLD_WIDTH, x)); applyCamera(); };
window.__niwaGetCamera = () => cameraX;
let walking = false;
let facing = 1;  // 1 = right, -1 = left
let activePlace = null;
let inOverlay = false;
let visited = new Set();
try {
  const raw = localStorage.getItem("niwa_visited_v2");
  if(raw) visited = new Set(JSON.parse(raw));
} catch(e){}

// ─── Build place objects (decorative SVGs along the ground) ────────
function placeSvg(p){
  const c = p.color;
  switch(p.icon){
    case "shelf": return `<svg width="120" height="140" viewBox="0 0 120 140">
      <rect x="14" y="22" width="92" height="98" fill="#3a2818" stroke="${c}" stroke-width="1"/>

      <rect x="14" y="94" width="92" height="2" fill="${c}" opacity=".5"/>
      <!-- books on shelves -->
      <g fill="${c}" opacity=".85">
        <rect x="18" y="26" width="6" height="14"/><rect x="26" y="24" width="5" height="16"/>
        <rect x="34" y="28" width="7" height="12"/><rect x="44" y="25" width="5" height="15"/>
        <rect x="52" y="27" width="6" height="13"/><rect x="62" y="26" width="5" height="14"/>
        <rect x="72" y="24" width="7" height="16"/><rect x="84" y="27" width="5" height="13"/>

        <rect x="18" y="52" width="6" height="14"/><rect x="28" y="50" width="7" height="16"/>
        <rect x="40" y="53" width="5" height="13"/><rect x="50" y="51" width="6" height="15"/>
        <rect x="60" y="54" width="7" height="12"/><rect x="72" y="50" width="5" height="16"/>

        <rect x="40" y="79" width="6" height="13"/><rect x="52" y="77" width="5" height="15"/>

      <line x1="40" y1="56" x2="100" y2="56" stroke="#fff2c0" stroke-width="2" opacity=".7"/>

    case "sign": return `<svg width="100" height="130" viewBox="0 0 100 130">

    case "fire": return `<svg width="140" height="120" viewBox="0 0 140 120">

      <ellipse cx="70" cy="100" rx="44" ry="8" fill="#3a2818"/>
      <rect x="34" y="92" width="72" height="6" fill="#5a3818" rx="3" transform="rotate(-8 70 95)"/>

        <animate attributeName="d" values="M70 45 Q63 58 64 70 Q68 78 70 84 Q72 78 76 70 Q77 58 70 45 Z;M70 42 Q64 56 65 70 Q67 78 70 84 Q73 78 75 70 Q76 56 70 42 Z;M70 45 Q63 58 64 70 Q68 78 70 84 Q72 78 76 70 Q77 58 70 45 Z" dur="2.4s" repeatCount="indefinite"/>

      <defs>
        <linearGradient id="flame-g" x1="50%" y1="0%" x2="50%" y2="100%">

    </svg>`;
    case "water": return `<svg width="160" height="120" viewBox="0 0 160 120">

      <path d="M10 80 Q80 60 150 80" stroke="#5a3e22" stroke-width="6" fill="none"/>
      <line x1="30" y1="76" x2="30" y2="95" stroke="#5a3e22" stroke-width="2"/>

    case "hut": return `<svg width="140" height="140" viewBox="0 0 140 140">

        <animate attributeName="opacity" values=".55;.35;.55" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- rain drops -->

function buildPlaces(){
  const layer = document.getElementById("place-layer");
  PLACES.forEach(p => {
    const div = document.createElement("div");
    div.className = "place-obj";
    div.dataset.id = p.id;
    div.style.left = p.x + "px";
    div.innerHTML = `<div class="place-name">${p.name}</div>${placeSvg(p)}`;
    div.onclick = () => openOverlay(p.id);
    // align bottom of svg to ground; offset so that x is the centre
    setTimeout(() => {
      const w = div.querySelector("svg").getAttribute("width") || 120;
      div.style.marginLeft = (-w / 2) + "px";
    }, 0);
    layer.appendChild(div);
  });
}
buildPlaces();

// ─── Camera + parallax loop ─────────────────────────────────────────
const moonEl = document.getElementById("moon");
function applyCamera(){
  const layers = document.querySelectorAll(".layer[data-speed]");
  layers.forEach(l => {
    const sp = parseFloat(l.dataset.speed);
    l.style.transform = `translateX(${-cameraX * sp}px)`;
  });
  // moon moves a tiny bit so it feels alive
  if(moonEl){
    const t = cameraX / WORLD_WIDTH;
    moonEl.style.left = (75 - t * 30) + "%";
  }
  // check proximity to a place
  let near = null;
  let minD = INTERACT_RANGE;
  PLACES.forEach(p => {
    const d = Math.abs(cameraX - p.x);
    if(d < minD){ minD = d; near = p; }
  });
  // place-obj near class
  document.querySelectorAll(".place-obj").forEach(el => {
    el.classList.toggle("near", near && el.dataset.id === near.id);
  });
  // hint
  const hintEl = document.getElementById("hint");
  if(near && !inOverlay){
    activePlace = near;
    document.getElementById("hint-text").textContent = `${near.name} へ`;
    hintEl.classList.add("show");
  } else {
    activePlace = null;
    hintEl.classList.remove("show");
  }
  // compass + minimap
  updateCompass();
}

function updateCompass(){
  const ratio = Math.max(0, Math.min(1, cameraX / WORLD_WIDTH));
  document.getElementById("compass-progress").style.width = (ratio * 100) + "%";
  document.getElementById("compass-pin").style.left = (ratio * 100) + "%";
  document.getElementById("mini-pin").style.left = (ratio * 100) + "%";
}

// place markers on compass + minimap
{
  const ct = document.getElementById("compass-track");
  const mt = document.getElementById("mini-track");
  PLACES.forEach(p => {
    const ratio = p.x / WORLD_WIDTH;
    const m1 = document.createElement("div");
    m1.className = "marker" + (visited.has(p.id) ? " visited" : "");
    m1.style.left = (ratio * 100) + "%";
    m1.dataset.id = p.id;
    m1.title = p.name;
    ct.appendChild(m1);
    const m2 = document.createElement("div");
    m2.className = "mini-marker" + (visited.has(p.id) ? " visited" : "");
    m2.style.left = (ratio * 100) + "%";
    m2.dataset.id = p.id;
    mt.appendChild(m2);
  });
}

// ─── Input ──────────────────────────────────────────────────────────
const keys = {left:false, right:false};
window.addEventListener("keydown", (e) => {
  if(e.repeat) return;
  if(inOverlay){
    if(e.key === "Escape") closeOverlay();
    return;
  }
  if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A"){ keys.left = true; e.preventDefault(); }
  else if(e.key === "ArrowRight" || e.key === "d" || e.key === "D"){ keys.right = true; e.preventDefault(); }
  else if(e.key === " " || e.key === "Enter"){
    if(activePlace){ openOverlay(activePlace.id); e.preventDefault(); }
  }
});
window.addEventListener("keyup", (e) => {
  if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
  else if(e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
});

// touch controls
const tLeft = document.getElementById("t-left");
const tRight = document.getElementById("t-right");
const tAct = document.getElementById("t-act");
function bindHold(el, key){
  const start = (e) => { e.preventDefault(); keys[key] = true; };
  const end = (e) => { keys[key] = false; };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("pointerleave", end);
}
bindHold(tLeft, "left");
bindHold(tRight, "right");
tAct.onclick = () => { if(activePlace) openOverlay(activePlace.id); };

// also: clicking on a place-obj triggers open (handled in build)

// ─── Main loop ──────────────────────────────────────────────────────
const SPEED = 4.5;
const FAST_FACTOR = 2.0;
let lastT = performance.now();
const avatar = document.getElementById("avatar");
function loop(t){
  const dt = Math.min(40, t - lastT);
  lastT = t;
  if(!inOverlay){
    let moved = false;
    const step = SPEED * (dt / 16);
    if(keys.left){
      cameraX = Math.max(0, cameraX - step);
      facing = -1;
      moved = true;
    }
    if(keys.right){
      cameraX = Math.min(WORLD_WIDTH, cameraX + step);
      facing = 1;
      moved = true;
    }
    if(moved){
      avatar.classList.add("walking");
      avatar.classList.toggle("flip", facing === -1);
    } else {
      avatar.classList.remove("walking");
    }
    applyCamera();
  }
  requestAnimationFrame(loop);
}
applyCamera();
requestAnimationFrame(loop);

function openOverlay(id){
  inOverlay = true;
  const inner = document.getElementById("overlay-inner");
  inner.innerHTML = `<button class="overlay-close" id="overlay-close" aria-label="close">×</button>${renderPlaceContent(id)}`;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("overlay-close").onclick = closeOverlay;
  document.getElementById("overlay").onclick = (e) => {
    if(e.target.id === "overlay") closeOverlay();
  };
  // mark visited
  if(!visited.has(id)){
    visited.add(id);
    try { localStorage.setItem("niwa_visited_v2", JSON.stringify([...visited])); } catch(e){}
    document.querySelectorAll(`.marker[data-id="${id}"], .mini-marker[data-id="${id}"]`).forEach(el => el.classList.add("visited"));
  }
  // wire breath widget if present
  if(id === "takibi") setupBreath();
  if(id === "hoshi") setupStarscape();
}
function closeOverlay(){
  inOverlay = false;
  document.getElementById("overlay").classList.remove("open");
}

// ── breath widget ──
function setupBreath(){
  const circle = document.getElementById("breath-circle");
  const phase = document.getElementById("breath-phase");
  const btn = document.getElementById("breath-btn");
  if(!circle) return;
  let running = false, stopFlag = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function cycle(n){
    for(let i = 0; i < n && !stopFlag; i++){
      circle.classList.remove("out");circle.classList.add("in");
      phase.innerHTML = `<b>吸う</b> · 4秒  (${i+1}/${n})`;
      circle.textContent = "吸";
      await sleep(4000); if(stopFlag) break;
      circle.classList.add("hold");
      phase.innerHTML = `<b>とめる</b> · 7秒  (${i+1}/${n})`;
      circle.textContent = "止";
      await sleep(7000); if(stopFlag) break;
      circle.classList.remove("in","hold");circle.classList.add("out");
      phase.innerHTML = `<b>吐く</b> · 8秒  (${i+1}/${n})`;
      circle.textContent = "吐";
      await sleep(8000);
    }
    if(!stopFlag){ phase.innerHTML = "<b>おしまい</b>  ·  どうぞ、 ゆっくりと。"; circle.textContent = "✿"; }
    else { phase.textContent = "いつでも、 また来てね。"; circle.textContent = "息"; }
    circle.classList.remove("in","hold","out");
    btn.textContent = "もう一度"; running = false; stopFlag = false;
  }
  btn.onclick = () => {
    if(running){ stopFlag = true; btn.textContent = "はじめる"; }
    else { running = true; btn.textContent = "やめる"; cycle(3); }
  };
}

// ── starscape ──
function setupStarscape(){
  const sky = document.getElementById("starscape");
  if(!sky) return;
  for(let i = 0; i < 90; i++){
    const s = document.createElement("div");
    s.className = "star" + (Math.random() < 0.18 ? " lg" : "") + (Math.random() < 0.6 ? " tw" : "");
    s.style.left = (Math.random() * 100) + "%";
    s.style.top = (Math.random() * 78) + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    sky.appendChild(s);
  }
  function shoot(){
    const ss = document.createElement("div");
    ss.className = "shootingstar";
    ss.style.left = (Math.random() * 60 + 10) + "%";
    ss.style.top = (Math.random() * 40) + "%";
    sky.appendChild(ss);
    setTimeout(() => ss.remove(), 12500);
  }
  shoot();
  const t = setInterval(() => { if(!sky.isConnected){ clearInterval(t); return;} shoot(); }, 11000);
}

// ─── Ambient audio (toggle, off by default) ────────────────────────
let ambientAudio = null;
const ambBtn = document.getElementById("ambient-toggle");
ambBtn.onclick = () => {
  if(!ambientAudio){
    ambientAudio = new Audio("https://cdn.pixabay.com/audio/2023/09/04/audio_caf4f95541.mp3");
    ambientAudio.loop = true;
    ambientAudio.volume = 0.26;
    ambientAudio.addEventListener("error", () => {
      ambBtn.title = "環境音が読み込めませんでした";
      ambBtn.classList.remove("active");
    });
  }
  if(ambientAudio.paused){
    ambientAudio.play().then(() => {
      ambBtn.classList.add("active");
      ambBtn.title = "静かな環境音 (オン)";
    }).catch(() => { ambBtn.title = "ブラウザに止められたかも"; });
  } else {
    ambientAudio.pause();
    ambBtn.classList.remove("active");
    ambBtn.title = "静かな環境音 (オフ)";
  }
};
