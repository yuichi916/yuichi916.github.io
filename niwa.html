// ─── Controls (mouse + touch + keyboard) ──────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tipEl = document.getElementById('hover-tip');

function setupControls(){
  const dom = renderer.domElement;
  dom.addEventListener('mousedown', e => {
    isDragging = true;
    dragStart = {x: e.clientX, y: e.clientY};
    previousMousePosition = {x: e.clientX, y: e.clientY};
  });
  dom.addEventListener('mousemove', e => {
    if(isDragging){
      const dx = e.clientX - previousMousePosition.x;
      const dy = e.clientY - previousMousePosition.y;
      cameraYawOffset -= dx * 0.005;
      cameraPitch = Math.max(0.18, Math.min(1.2, cameraPitch + dy * 0.003));
      previousMousePosition = {x: e.clientX, y: e.clientY};
      return;
    }
    hoverPlace(e.clientX, e.clientY);
  });
  dom.addEventListener('mouseup', e => {
    if(!isDragging) return;
    const moved = Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y);
    if(moved < 6 && !inOverlay){
      handleTap(e.clientX, e.clientY);
    }
    isDragging = false;
  });
  dom.addEventListener('mouseleave', () => {
    isDragging = false;
  });
  dom.addEventListener('wheel', e => {
    e.preventDefault();
    cameraDist = Math.max(6, Math.min(40, cameraDist + e.deltaY * 0.015));
  }, {passive: false});
}

// Tap on a place opens it; tap on the ground sets a move target.
function handleTap(cx, cy){
  mouse.x = (cx / window.innerWidth) * 2 - 1;
  mouse.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // 1) place click first
  const placeHits = raycaster.intersectObjects(clickableObjects, true);
  if(placeHits.length){
    let obj = placeHits[0].object;
    while(obj.parent && !obj.userData.name) obj = obj.parent;
    if(obj.userData.id){
      // walk toward it; if very close, open immediately
      const dist = Math.hypot(avatar3D.position.x - obj.position.x,
                              avatar3D.position.z - obj.position.z);
      if(dist < PLACE_INTERACT_RADIUS){
        openOverlay(obj.userData.id);
      } else {
        avatarTarget = {x: obj.position.x, z: obj.position.z};
        if(targetMarker){
          targetMarker.position.set(obj.position.x,
            getWalkableY(obj.position.x, obj.position.z) + 0.05, obj.position.z);
          targetMarker.visible = true;
        }
      }
      return;
    }
  }
  // 2) ground click
  if(groundMesh){
    const gHits = raycaster.intersectObject(groundMesh);
    if(gHits.length){
      const p = gHits[0].point;
      avatarTarget = {x: p.x, z: p.z};
      if(targetMarker){
        targetMarker.position.set(p.x, getWalkableY(p.x, p.z) + 0.05, p.z);
        targetMarker.visible = true;
      }
    }
  }
}

function hoverPlace(cx, cy){
  // Avatar-mode: tip is driven by proximity, not hover. Just track cursor for click.
  mouse.x = (cx / window.innerWidth) * 2 - 1;
  mouse.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects, true);
  if(hits.length){
    let obj = hits[0].object;
    while(obj.parent && !obj.userData.name) obj = obj.parent;
    if(obj.userData.name){
      renderer.domElement.style.cursor = 'pointer';
      return;
    }
  }
  renderer.domElement.style.cursor = 'default';
}

function clickPlace(cx, cy){
  mouse.x = (cx / window.innerWidth) * 2 - 1;
  mouse.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects, true);
  if(hits.length){
    let obj = hits[0].object;
    while(obj.parent && !obj.userData.name) obj = obj.parent;
    if(obj.userData.id) openOverlay(obj.userData.id);
  }
}

// ── Touch controls (single-finger orbit, pinch zoom, tap click) ───
function setupTouch(){
  const dom = renderer.domElement;
  let lastTouch = null;
  let pinchD = 0;
  let moved = 0;
  dom.addEventListener('touchstart', e => {
    if(e.touches.length === 1){
      lastTouch = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      dragStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      isDragging = true;
      moved = 0;
    } else if(e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchD = Math.hypot(dx, dy);
      isDragging = false;
    }
  }, {passive: true});
  dom.addEventListener('touchmove', e => {
    if(e.touches.length === 1 && isDragging){
      const t = e.touches[0];
      const dx = t.clientX - lastTouch.x;
      const dy = t.clientY - lastTouch.y;
      moved += Math.abs(dx) + Math.abs(dy);
      // drag rotates camera only after a small threshold
      if(moved > 12){
        cameraYawOffset -= dx * 0.005;
        cameraPitch = Math.max(0.18, Math.min(1.2, cameraPitch + dy * 0.003));
      }
      lastTouch = {x: t.clientX, y: t.clientY};
      e.preventDefault();
    } else if(e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if(pinchD > 0){
        const ratio = pinchD / d;
        cameraDist = Math.max(6, Math.min(40, cameraDist * ratio));
      }
      pinchD = d;
      e.preventDefault();
    }
  }, {passive: false});
  dom.addEventListener('touchend', e => {
    if(isDragging && e.changedTouches.length === 1){
      const t = e.changedTouches[0];
      const total = Math.abs(t.clientX - dragStart.x) + Math.abs(t.clientY - dragStart.y);
      if(total < 12 && !inOverlay) handleTap(t.clientX, t.clientY);
    }
    isDragging = false;
    pinchD = 0;
    moved = 0;
  });
}

function setupKeyboard(){
  window.addEventListener('keydown', e => {
    if(inOverlay){
      if(e.key === 'Escape') closeOverlay();
      return;
    }
    const k = e.key.toLowerCase();
    if((k === 'f' || k === ' ' || k === 'enter') && nearbyPlace){
      openOverlay(nearbyPlace.id);
      e.preventDefault();
    }
  });
}

// ─── Avatar / camera update each frame ────────────────────────────
function updateAvatar(dt){
  if(!avatar3D || inOverlay) return;
  let vx = 0, vz = 0;
  let walking = false;
  // tap-to-move
  if(avatarTarget){
    const dx = avatarTarget.x - avatar3D.position.x;
    const dz = avatarTarget.z - avatar3D.position.z;
    const d = Math.hypot(dx, dz);
    if(d > 0.45){
      vx = dx / d;
      vz = dz / d;
      avatar3D.position.x += vx * avatarSpeed;
      avatar3D.position.z += vz * avatarSpeed;
      avatarYaw = Math.atan2(vx, vz);
      avatar3D.rotation.y = avatarYaw;
      walking = true;
    } else {
      avatarTarget = null;
      if(targetMarker) targetMarker.visible = false;
    }
  }
  // clamp to a sensible bounding box
  const r = Math.hypot(avatar3D.position.x, avatar3D.position.z);
  const MAX_R = 60;
  if(r > MAX_R){
    const a = Math.atan2(avatar3D.position.x, avatar3D.position.z);
    avatar3D.position.x = Math.sin(a) * MAX_R;
    avatar3D.position.z = Math.cos(a) * MAX_R;
  }
  // ground follow + stair climb
  const y = getWalkableY(avatar3D.position.x, avatar3D.position.z);
  // smooth Y lerp
  avatar3D.position.y += (y - avatar3D.position.y) * 0.35;
  // leg animation (simple bob)
  if(avatar3D.userData.legs){
    const phase = performance.now() * 0.008;
    if(walking){
      avatar3D.userData.legs.L.position.z = Math.sin(phase) * 0.16;
      avatar3D.userData.legs.R.position.z = -Math.sin(phase) * 0.16;
      avatar3D.userData.legs.L.position.y = 0.22 + Math.abs(Math.sin(phase)) * 0.08;
      avatar3D.userData.legs.R.position.y = 0.22 + Math.abs(Math.sin(phase + Math.PI)) * 0.08;
    } else {
      avatar3D.userData.legs.L.position.z = 0;
      avatar3D.userData.legs.R.position.z = 0;
      avatar3D.userData.legs.L.position.y = 0.22;
      avatar3D.userData.legs.R.position.y = 0.22;
    }
  }
  // detect nearby place
  let near = null;
  let nearDist = PLACE_INTERACT_RADIUS;
  for(const loc of LOCATIONS){
    const d = Math.hypot(avatar3D.position.x - loc.x, avatar3D.position.z - loc.z);
    if(d < nearDist){ nearDist = d; near = loc; }
  }
  if(near !== nearbyPlace){
    nearbyPlace = near;
    updateProximityHint();
  }
}

function updateCameraFollow(){
  if(!avatar3D || !camera) return;
  const targetY = avatar3D.position.y + 1.5;
  const horiz = Math.cos(cameraPitch) * cameraDist;
  const vert  = Math.sin(cameraPitch) * cameraDist;
  camera.position.x = avatar3D.position.x + Math.sin(cameraYawOffset) * horiz;
  camera.position.z = avatar3D.position.z + Math.cos(cameraYawOffset) * horiz;
  camera.position.y = targetY + vert;
  camera.lookAt(avatar3D.position.x, targetY, avatar3D.position.z);
}

function updateProximityHint(){
  const tip = document.getElementById('hover-tip');
  const btn = document.getElementById('enter-place-btn');
  if(nearbyPlace){
    tip.innerHTML = `${nearbyPlace.name}`;
    tip.style.left = '50%';
    tip.style.top = '58%';
    tip.style.transform = 'translate(-50%, 0)';
    tip.classList.add('show');
    if(btn){ btn.style.display = 'flex'; btn.textContent = `${nearbyPlace.name} に入る`; }
  } else {
    tip.classList.remove('show');
    if(btn) btn.style.display = 'none';
  }
}

// ─── Animation loop ────────────────────────────────────────────────
let frameCount = 0;
function animate(){
  requestAnimationFrame(animate);
  frameCount++;
  const t = performance.now() * 0.001;
  // avatar + camera
  updateAvatar();
  updateCameraFollow();
  if(window.__niwaAnimHook) window.__niwaAnimHook(t);
  // flicker fire flames + sparks
  clickableObjects.forEach(g => {
    if(g.userData.flame){
      const f = g.userData.flame;
      f.scale.y = 1 + Math.sin(t * 7 + g.position.x) * 0.07;
      f.scale.x = 1 + Math.cos(t * 9 + g.position.z) * 0.05;
      if(g.userData.fireLight){
        g.userData.fireLight.intensity = 1.5 + Math.sin(t * 5) * 0.3;
      }
      if(g.userData.sparks){
        g.userData.sparks.forEach((sp, idx) => {
          const phase = (t + sp.userData.offset) % 2;
          sp.position.y = sp.userData.baseY + phase * 2;
          sp.material.opacity = Math.max(0, 0.9 - phase * 0.45);
          sp.position.x = sp.userData.vx + Math.sin(t * 2 + idx) * 0.1;
          sp.position.z = sp.userData.vz + Math.cos(t * 2 + idx) * 0.1;
        });
      }
    }
    // pond ripples
    if(g.userData.ripples){
      g.userData.ripples.forEach(r => {
        const phase = (t * 0.5 + r.userData.phase) % 2;
        r.scale.setScalar(1 + phase * 1.2);
        r.material.opacity = Math.max(0, 0.45 - phase * 0.22);
      });
    }
    // rain drops
    if(g.userData.rain){
      g.userData.rain.children.forEach(d => {
        d.position.y -= d.userData.speed;
        if(d.position.y < 0.5) d.position.y = d.userData.init;
      });
    }
    // chimney smoke rising
    if(g.userData.smoke){
      g.userData.smoke.forEach((sp, i) => {
        const phase = (t * 0.3 + sp.userData.phase) % 4;
        sp.position.y = sp.userData.baseY + phase * 0.8;
        sp.position.x = (g.userData.smoke[0]?.position.x || 0) + Math.sin(t * 0.5 + i) * 0.2;
        sp.material.opacity = Math.max(0, 0.55 - phase * 0.15);
        sp.scale.setScalar(1.2 + phase * 0.7);
      });
    }
  });
  // moon halo facing camera
  if(scene && scene.userData.halo){
    scene.userData.halo.lookAt(camera.position);
  }
  // NPCs gentle wandering, follow terrain
  if(window.__npcs){
    window.__npcs.forEach(npc => {
      const o = npc.userData.origin;
      const nx = o.x + Math.sin(t * 0.4 + o.phase) * 1.2;
      const nz = o.z + Math.cos(t * 0.4 + o.phase) * 1.2;
      npc.position.set(nx, getTerrainHeight(nx, nz), nz);
      npc.rotation.y = t * 0.4 + o.phase + Math.PI / 2;
    });
  }
  // water wheel spins
  if(window.__watermill && window.__watermill.userData.wheel){
    window.__watermill.userData.wheel.rotation.z += 0.012;
  }
  // boat bobbing on lake
  if(window.__boat){
    window.__boat.position.y = 0.3 + Math.sin(t * 0.8) * 0.06;
    window.__boat.rotation.z = Math.sin(t * 0.5) * 0.04;
  }
  // ─── Game systems (day/night, particles) ───
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastDtTime) / 1000);
  lastDtTime = now;
  updateTimeOfDay(dt);
  updatePetals(dt, t);
  updateSmoke(dt, t);
  updateFireflies(dt, t);
  if (composer) composer.render(dt);
  else renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  if(!camera || !renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  if (bloomPass) bloomPass.setSize(window.innerWidth, window.innerHeight);
});

// ─── GLB loader & integration ───────────────────────────────
function loadVillageKit() {
  return new Promise((resolve, reject) => {
    if (typeof THREE.GLTFLoader !== 'function') return reject('no GLTFLoader');
    const loader = new THREE.GLTFLoader();
    loader.load(
      'assets/models/village_kit.glb',
      (gltf) => {
        // First, upgrade materials and mark all meshes shadow-ready
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material && child.material.isMeshStandardMaterial !== true) {
              const col = (child.material.color && child.material.color.clone()) || new THREE.Color(0xc8b896);
              child.material = new THREE.MeshStandardMaterial({
                color: col, roughness: 0.85, metalness: 0.0,
              });
            } else if (child.material) {
              child.material = child.material.clone();
            }
          }
        });
        // Collect mesh references grouped by Blender-object name (the parent group's name).
        // GLTF exporter splits a multi-material object into mesh primitives — those primitives
        // sit under an Object3D parent that retains the original Blender name (Pagoda, Torii, …).
        const meshesByParent = {};
        gltf.scene.traverse((obj) => {
          if (obj.isMesh) {
            // walk up parents until we find a named Object3D (the Blender Object node)
            let p = obj;
            while (p && (!p.name || /^Cube|^Cylinder|^Torus|^Sphere|^Cone|^Plane|^Mesh/i.test(p.name)) && p.parent && p.parent.parent) {
              p = p.parent;
            }
            const key = (p && p.name) ? p.name : 'unnamed';
            if (!meshesByParent[key]) meshesByParent[key] = [];
            meshesByParent[key].push(obj);
            if (!glbAssets[obj.name]) glbAssets[obj.name] = [];
            glbAssets[obj.name].push(obj);
          }
        });
        // Build groups by cloning the mesh refs into fresh Groups (so we don't mutate gltf.scene)
        const namedGroups = {};
        for (const [key, meshes] of Object.entries(meshesByParent)) {
          // compute centroid in original local space to anchor the group
          const g = new THREE.Group();
          for (const m of meshes) {
            const c = m.clone();
            if (m.material) c.material = m.material.clone();
            // Bake world transform into the cloned mesh (so the group can be moved freely)
            m.updateWorldMatrix(true, false);
            c.position.setFromMatrixPosition(m.matrixWorld);
            c.quaternion.setFromRotationMatrix(m.matrixWorld);
            c.scale.setFromMatrixScale(m.matrixWorld);
            g.add(c);
          }
          // recenter group on its bounding box centroid (so position.set positions the center)
          const box = new THREE.Box3().setFromObject(g);
          const center = box.getCenter(new THREE.Vector3());
          for (const c of g.children) {
            c.position.x -= center.x;
            c.position.z -= center.z;
            // keep y so the structure stands on the ground naturally
            c.position.y -= box.min.y;
          }
          namedGroups[key] = g;
        }
        glbAssets.__rootScene = gltf.scene;
        glbAssets.__namedGroups = namedGroups;
        console.log('[niwa] GLB groups:', Object.keys(namedGroups));
        resolve();
      },
      undefined,
      (err) => reject(err)
    );
  });
}

function cloneNamedGroup(name) {
  const groups = glbAssets.__namedGroups || {};
  const g = groups[name];
  if (g) {
    const c = g.clone(true);
    c.traverse(m => { if (m.isMesh && m.material) m.material = m.material.clone(); });
    return c;
  }
  return null;
}

function placeGlbHighlights() {
  const groups = glbAssets.__namedGroups || {};
  const names = Object.keys(groups);
  if (!names.length) {
    console.warn('[niwa] no named GLB groups available');
    return;
  }
  // Strategy: place each available named structure at a thoughtful spot.
  // Plan candidate spots ordered by visual prominence.
  const SPOTS = [
    { x:  32, z: -34, scale: 1.8, rot: 0.2, prefer:['Pagoda'] },
    { x: -28, z: -28, scale: 1.4, rot:-0.3, prefer:['BellTower'] },
    { x:  34, z:  22, scale: 1.3, rot: 0.8, prefer:['Watchtower'] },
    { x: -18, z:  22, scale: 1.0, rot: 0.0, prefer:['Teahouse','Longhouse'] },
    { x:  12, z: -16, scale: 1.0, rot: 1.4, prefer:['Longhouse','Teahouse'] },
    { x: -22, z:   2, scale: 1.0, rot: 0.3, prefer:['Watermill'] },
    { x:   2, z:  20, scale: 0.8, rot: 0.0, prefer:['Well'] },
  ];
  const used = new Set();
  for (const spot of SPOTS) {
    let chosen = null, chosenName = null;
    // prefer specific names first
    for (const p of spot.prefer) {
      if (groups[p] && !used.has(p)) { chosen = groups[p]; chosenName = p; break; }
    }
    // fallback: any unused
    if (!chosen) {
      for (const n of names) {
        if (used.has(n)) continue;
        if (n === 'Avatar' || n === 'Torus' || n.startsWith('Torus')) continue; // skip
        chosen = groups[n]; chosenName = n; break;
      }
    }
    if (!chosen) break;
    used.add(chosenName);
    const clone = chosen.clone(true);
    clone.traverse(m => {
      if (m.isMesh && m.material) m.material = m.material.clone();
      m.castShadow = true; m.receiveShadow = true;
    });
    const y = getTerrainHeight(spot.x, spot.z);
    clone.position.set(spot.x, y + 0.05, spot.z);
    clone.scale.setScalar(spot.scale);
    clone.rotation.y = spot.rot;
    scene.add(clone);
    // pagoda + bell tower add warm light
    if (chosenName === 'Pagoda' || chosenName === 'BellTower' || chosenName === 'Watchtower') {
      const pl = new THREE.PointLight(0xffa260, 0.6, 14);
      pl.position.set(spot.x, y + 5, spot.z);
      pl.userData.isLanternLight = true;
      scene.add(pl);
    }
  }
  // Garden stone lanterns (Toro) along plaza ring — augment existing lanterns
  if (groups['Toro']) {
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 + Math.PI/12;
      const dist = 12.5;
      const lx = Math.cos(angle) * dist;
      const lz = Math.sin(angle) * dist;
      const toro = groups['Toro'].clone(true);
      toro.traverse(m => {
        if (m.isMesh && m.material) m.material = m.material.clone();
        m.castShadow = true; m.receiveShadow = true;
      });
      toro.position.set(lx, getTerrainHeight(lx, lz) + 0.05, lz);
      toro.scale.setScalar(0.7);
      scene.add(toro);
      const pl = new THREE.PointLight(0xffa860, 0.4, 6);
      pl.position.set(lx, getTerrainHeight(lx, lz) + 1.3, lz);
      pl.userData.isLanternLight = true;
      scene.add(pl);
    }
  }
}

// ─── Day/night cycle (240s = 1 full day) ───────────────────
function updateTimeOfDay(dt) {
  timeOfDay = (timeOfDay + dt / DAY_SECONDS) % 1.0;
  const t = timeOfDay;
  const lights = scene.userData.lights;
  if (!lights) return;
  // palette stops: 0 night, 0.18 dawn, 0.5 noon, 0.78 dusk, 0.95 night
  const stops = [
    { t: 0.0,  bg: 0x05071a, fog: 0x05071a, sun: 0x6080c0, sunI: 0.30, amb: 0x303048, ambI: 0.42, fill: 0x1a2240, fillI: 0.18 },
    { t: 0.18, bg: 0xc89870, fog: 0xa88060, sun: 0xffbc80, sunI: 0.55, amb: 0x806858, ambI: 0.4,  fill: 0x5a4a48, fillI: 0.20 },
    { t: 0.5,  bg: 0x7ab0e0, fog: 0x90b8d8, sun: 0xfff1d6, sunI: 0.78, amb: 0xc8c0b0, ambI: 0.48, fill: 0x6080a0, fillI: 0.24 },
    { t: 0.78, bg: 0xa86048, fog: 0x885040, sun: 0xff9050, sunI: 0.55, amb: 0x8a5448, ambI: 0.42, fill: 0x4a3030, fillI: 0.20 },
    { t: 0.95, bg: 0x05071a, fog: 0x05071a, sun: 0x6080c0, sunI: 0.30, amb: 0x303048, ambI: 0.42, fill: 0x1a2240, fillI: 0.18 },
  ];
  let s0 = stops[0], s1 = stops[1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i].t && t < stops[i+1].t) { s0 = stops[i]; s1 = stops[i+1]; break; }
  }
  const k = (t - s0.t) / (s1.t - s0.t || 1);
  const bgCol = new THREE.Color(s0.bg).lerp(new THREE.Color(s1.bg), k);
  scene.background = bgCol;
  scene.fog.color = new THREE.Color(s0.fog).lerp(new THREE.Color(s1.fog), k);
  lights.sun.color = new THREE.Color(s0.sun).lerp(new THREE.Color(s1.sun), k);
  lights.sun.intensity = s0.sunI + (s1.sunI - s0.sunI) * k;
  lights.ambient.color = new THREE.Color(s0.amb).lerp(new THREE.Color(s1.amb), k);
  lights.ambient.intensity = s0.ambI + (s1.ambI - s0.ambI) * k;
  if (lights.fill) {
    lights.fill.color = new THREE.Color(s0.fill).lerp(new THREE.Color(s1.fill), k);
    lights.fill.intensity = s0.fillI + (s1.fillI - s0.fillI) * k;
  }
  // sun rotates around: angle 0 = east, sweeps overhead, descends to west
  const sa = t * Math.PI * 2 - Math.PI/2;
  lights.sun.position.set(Math.cos(sa) * 70, Math.max(8, Math.sin(sa) * 75 + 6), Math.sin(sa) * 40);

  // lantern emissive scales with darkness (1 - sunI/1.1)
  const nightFactor = Math.max(0, Math.min(1, 1 - lights.sun.intensity / 1.0));
  for (const lh of lanternHeads) {
    if (lh.mesh.material && lh.mesh.material.emissiveIntensity !== undefined) {
      lh.mesh.material.emissiveIntensity = 0.25 + nightFactor * 1.4;
    }
    if (lh.light) lh.light.intensity = 0.15 + nightFactor * 1.0;
  }
  // boost any GLB Toro and unmarked PointLights tagged as lanternLight
  scene.traverse(obj => {
    if (obj.isPointLight && obj.userData.isLanternLight) {
      obj.intensity = 0.15 + nightFactor * 1.1;
    }
  });
  // fireflies visible only at night
  if (firefliesGroup) firefliesGroup.visible = nightFactor > 0.4;
  // moon orb fades with daylight
  if (scene.userData.moon) {
    const moonOpacity = Math.max(0, nightFactor * 1.0 - 0.05);
    scene.userData.moon.traverse(c => {
      if (c.material && c.material.transparent !== undefined) {
        c.material.opacity = moonOpacity;
      }
    });
  }
  // bloom strength rises at night for more "glow" feel — never overpowering at day
  if (bloomPass) {
    bloomPass.strength = 0.25 + nightFactor * 0.85;
    bloomPass.threshold = 0.88 - nightFactor * 0.2;  // at night, smaller emissive bits bloom too
  }

  // time-of-day label
  const labels = ['夜','夜','暁','朝','朝','昼','昼','夕','夕','宵','夜'];
  const idx = Math.min(labels.length-1, Math.floor(t * labels.length));
  const tEl = document.getElementById('time-val');
  if (tEl) tEl.textContent = labels[idx];
}

// ─── Particles: sakura petals ──────────────────────────────
function buildPetals() {
  petalsGroup = new THREE.Group();
  const N = 80;
  const petalMat = new THREE.SpriteMaterial({
    map: makePetalTexture(),
    color: 0xffd8e6,
    transparent: true,
    depthWrite: false,
    opacity: 0.85,
  });
  for (let i = 0; i < N; i++) {
    const s = new THREE.Sprite(petalMat.clone());
    s.scale.set(0.4, 0.4, 1);
    s.userData = {
      x0: (Math.random() - 0.5) * 60,
      z0: (Math.random() - 0.5) * 60,
      y0: 4 + Math.random() * 16,
      phase: Math.random() * Math.PI * 2,
      speed: 0.45 + Math.random() * 0.45,
      swirl: 0.5 + Math.random() * 0.8,
    };
    s.position.set(s.userData.x0, s.userData.y0, s.userData.z0);
    petalsGroup.add(s);
  }
  scene.add(petalsGroup);
}
function makePetalTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const ctx = c.getContext('2d');
  // teardrop petal shape
  ctx.fillStyle = '#ffd6e0';
  ctx.beginPath();
  ctx.ellipse(16, 16, 6, 12, Math.PI/4, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ffeef4';
  ctx.beginPath();
  ctx.ellipse(15, 13, 3, 8, Math.PI/4, 0, Math.PI*2);
  ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
function updatePetals(dt, t) {
  if (!petalsGroup) return;
  for (const s of petalsGroup.children) {
    s.position.y -= s.userData.speed * dt;
    s.position.x = s.userData.x0 + Math.sin(t * s.userData.swirl + s.userData.phase) * 2.0;
    s.position.z = s.userData.z0 + Math.cos(t * (s.userData.swirl*0.7) + s.userData.phase) * 1.5;
    if (s.position.y < 0.5) {
      s.userData.y0 = 12 + Math.random() * 10;
      s.userData.x0 = (Math.random() - 0.5) * 60;
      s.userData.z0 = (Math.random() - 0.5) * 60;
      s.position.y = s.userData.y0;
    }
    s.material.rotation = t * 0.4 + s.userData.phase;
  }
}

// ─── Particles: chimney/incense smoke columns ─────────────
function buildSmokeColumns() {
  smokeGroup = new THREE.Group();
  // place a few "smoke source" positions near villages (manual coords)
  const sources = [
    {x: -7, z: 4},
    {x:  5, z: 6},
    {x: -10, z: -10},
    {x:  6, z: -4},
  ];
  const smokeMat = new THREE.SpriteMaterial({
    map: makeSmokeTexture(),
    color: 0xfff8e8,
    transparent: true,
    depthWrite: false,
    opacity: 0.45,
  });
  for (const src of sources) {
    const baseY = getTerrainHeight(src.x, src.z) + 1.8;
    for (let i = 0; i < 12; i++) {
      const s = new THREE.Sprite(smokeMat.clone());
      const sz = 0.7 + Math.random() * 0.6;
      s.scale.set(sz, sz, 1);
      s.userData = {
        baseX: src.x, baseY, baseZ: src.z,
        phase: Math.random() * 4.0,
        speed: 0.4 + Math.random() * 0.3,
      };
      s.position.set(src.x, baseY + Math.random() * 3, src.z);
      smokeGroup.add(s);
    }
  }
  scene.add(smokeGroup);
}
function makeSmokeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 4, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.4)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
function updateSmoke(dt, t) {
  if (!smokeGroup) return;
  for (const s of smokeGroup.children) {
    const phase = (t * s.userData.speed + s.userData.phase) % 4.0;
    s.position.y = s.userData.baseY + phase * 1.0;
    s.position.x = s.userData.baseX + Math.sin(t * 0.5 + s.userData.phase) * 0.4;
    s.position.z = s.userData.baseZ + Math.cos(t * 0.5 + s.userData.phase) * 0.4;
    s.material.opacity = Math.max(0, 0.55 - phase * 0.13);
    s.scale.setScalar(0.6 + phase * 0.5);
  }
}

// ─── Particles: fireflies at night ────────────────────────
function buildFireflies() {
  firefliesGroup = new THREE.Group();
  const ffMat = new THREE.MeshBasicMaterial({ color: 0xffe690, transparent: true, opacity: 0.9 });
  for (let i = 0; i < 32; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), ffMat.clone());
    const angle = Math.random() * Math.PI * 2;
    const dist = 5 + Math.random() * 18;
    m.userData = {
      cx: Math.cos(angle) * dist,
      cz: Math.sin(angle) * dist,
      cy: 1.4 + Math.random() * 1.2,
      r: 0.6 + Math.random() * 1.6,
      speed: 0.5 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2,
      blinkPhase: Math.random() * Math.PI * 2,
    };
    m.position.set(m.userData.cx, m.userData.cy, m.userData.cz);
    firefliesGroup.add(m);
  }
  firefliesGroup.visible = false;
  scene.add(firefliesGroup);
}
function updateFireflies(dt, t) {
  if (!firefliesGroup || !firefliesGroup.visible) return;
  for (const m of firefliesGroup.children) {
    const u = m.userData;
    m.position.x = u.cx + Math.sin(t * u.speed + u.phase) * u.r;
    m.position.z = u.cz + Math.cos(t * u.speed * 0.7 + u.phase) * u.r;
    m.position.y = u.cy + Math.sin(t * u.speed * 1.3 + u.phase) * 0.4;
    const blink = 0.4 + 0.5 * Math.max(0, Math.sin(t * 2.6 + u.blinkPhase));
    m.material.opacity = blink;
  }
}

function awardKokoroForVisit(placeId) {

// ─── Audio: place sound + Lofi BGM ────────────────────────
function playPlaceSound(vol = 1.0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const tn = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(660, tn);
    o.frequency.exponentialRampToValueAtTime(880, tn + 0.06);
    o.frequency.exponentialRampToValueAtTime(528, tn + 0.4);
    g.gain.setValueAtTime(0.0001, tn);
    g.gain.exponentialRampToValueAtTime(0.16 * vol, tn + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, tn + 0.55);
    o.connect(g).connect(ctx.destination);
    o.start(tn); o.stop(tn + 0.6);
  } catch(e){}
}
function toggleBgm() {
  bgmEnabled = !bgmEnabled;
  const btn = document.getElementById('bgm-toggle');
  if (btn) btn.classList.toggle('on', bgmEnabled);
  if (bgmEnabled) startBgm(); else stopBgm();
}
function startBgm() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    bgmGain = ctx.createGain();
    bgmGain.gain.value = 0.0;
    bgmGain.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + 2.5);
    bgmGain.connect(ctx.destination);
    // gentle drone pad
    const pitches = [196, 233, 294, 349, 392, 466, 587];
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = pitches[i*2 % pitches.length] / (i === 2 ? 2 : 1);
      const og = ctx.createGain();
      og.gain.value = 0.45 / (i+1);
      o.connect(og).connect(bgmGain);
      o.detune.value = (i-1)*4;
      bgmNodes.push({ o, og });
      o.start();
    }
    // LFO modulating master gain (gentle swell)
    const lfo = ctx.createOscillator();
    const lg = ctx.createGain();
    lfo.frequency.value = 0.06;
    lg.gain.value = 0.025;
    lfo.connect(lg).connect(bgmGain.gain);
    lfo.start();
    bgmNodes.push({ o: lfo, og: lg });
    // random sparse plucks
    bgmNodes.push({ interval: setInterval(() => {
      if (!bgmEnabled) return;
      const tn = ctx.currentTime;
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.type = 'triangle';
      o2.frequency.value = pitches[Math.floor(Math.random()*pitches.length)];
      g2.gain.setValueAtTime(0.0001, tn);
      g2.gain.exponentialRampToValueAtTime(0.035, tn + 0.04);
      g2.gain.exponentialRampToValueAtTime(0.0001, tn + 1.4);
      o2.connect(g2).connect(bgmGain || ctx.destination);
      o2.start(tn); o2.stop(tn + 1.5);
    }, 3300) });
  } catch(e){ console.warn(e); }
}
function stopBgm() {
  for (const n of bgmNodes) {
    if (n.interval) clearInterval(n.interval);
    if (n.o && n.o.stop) try { n.o.stop(); } catch(e){}
  }
  bgmNodes = [];
  if (bgmGain) { try { bgmGain.disconnect(); } catch(e){} bgmGain = null; }
}

function openOverlay(id){
  inOverlay = true;
  const inner = document.getElementById("overlay-inner");
  inner.innerHTML = `<button class="overlay-close" id="overlay-close" aria-label="close">×</button>${renderPlaceContent(id)}`;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("overlay-close").onclick = closeOverlay;
  document.getElementById("overlay").onclick = (e) => {
    if(e.target.id === "overlay") closeOverlay();
  };
  if(!visitedPlaces.has(id)){
    visitedPlaces.add(id);
    try { localStorage.setItem("niwa_visited_v3", JSON.stringify([...visitedPlaces])); } catch(e){}
    refreshVisitedDots();
  }
  if(typeof awardKokoroForVisit === 'function') awardKokoroForVisit(id);
  if(id === "takibi") setupBreath();
  if(id === "hoshi") setupStarscape();
}
function closeOverlay(){
  inOverlay = false;
  document.getElementById("overlay").classList.remove("open");
}

function refreshVisitedDots(){
  const row = document.getElementById("visited-row");
  // remove old dots (keep .vlabel)
  row.querySelectorAll(".vdot").forEach(el => el.remove());
  LOCATIONS.forEach(loc => {
    const d = document.createElement("span");
    d.className = "vdot" + (visitedPlaces.has(loc.id) ? " on" : "");
    d.title = loc.name;
    row.appendChild(d);
  });
  row.classList.add("show");
}

function setupBreath(){
  const circle = document.getElementById("breath-circle");
  const phase = document.getElementById("breath-phase");
  const btn = document.getElementById("breath-btn");
  if(!circle) return;
  let running = false, stopFlag = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function cycle(n){
    for(let i = 0; i < n && !stopFlag; i++){
      circle.classList.remove("out");circle.classList.add("in");
      phase.innerHTML = `<b>吸う</b> · 4秒  (${i+1}/${n})`;
      circle.textContent = "吸";
      await sleep(4000); if(stopFlag) break;
      circle.classList.add("hold");
      phase.innerHTML = `<b>とめる</b> · 7秒  (${i+1}/${n})`;
      circle.textContent = "止";
      await sleep(7000); if(stopFlag) break;
      circle.classList.remove("in","hold");circle.classList.add("out");
      phase.innerHTML = `<b>吐く</b> · 8秒  (${i+1}/${n})`;
      circle.textContent = "吐";
      await sleep(8000);
    }
    if(!stopFlag){ phase.innerHTML = "<b>おしまい</b>  ·  どうぞ、 ゆっくりと。"; circle.textContent = "✿"; }
    else { phase.textContent = "いつでも、 また来てね。"; circle.textContent = "息"; }
    circle.classList.remove("in","hold","out");
    btn.textContent = "もう一度"; running = false; stopFlag = false;
  }
  btn.onclick = () => {
    if(running){ stopFlag = true; btn.textContent = "はじめる"; }
    else { running = true; btn.textContent = "やめる"; cycle(3); }
  };
}

function setupStarscape(){
  const sky = document.getElementById("starscape");
  if(!sky) return;
  for(let i = 0; i < 90; i++){
    const s = document.createElement("div");
    s.className = "star" + (Math.random() < 0.18 ? " lg" : "") + (Math.random() < 0.6 ? " tw" : "");
    s.style.left = (Math.random() * 100) + "%";
    s.style.top = (Math.random() * 78) + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    sky.appendChild(s);
  }
  function shoot(){
    const ss = document.createElement("div");
    ss.className = "shootingstar";
    ss.style.left = (Math.random() * 60 + 10) + "%";
    ss.style.top = (Math.random() * 40) + "%";
    sky.appendChild(ss);
    setTimeout(() => ss.remove(), 12500);
  }
  shoot();
  const t = setInterval(() => { if(!sky.isConnected){ clearInterval(t); return;} shoot(); }, 11000);
}

// ─── Ambient audio (toggle, off by default) ────────────────────────
let ambientAudio = null;
const ambBtn = document.getElementById("ambient-toggle");
ambBtn.onclick = () => {
  if(!ambientAudio){
    ambientAudio = new Audio("https://cdn.pixabay.com/audio/2023/09/04/audio_caf4f95541.mp3");
    ambientAudio.loop = true;
    ambientAudio.volume = 0.26;
    ambientAudio.addEventListener("error", () => {
      ambBtn.title = "環境音が読み込めませんでした";
      ambBtn.classList.remove("active");
    });
  }
  if(ambientAudio.paused){
    ambientAudio.play().then(() => {
      ambBtn.classList.add("active");
      ambBtn.title = "静かな環境音 (オン)";
    }).catch(() => { ambBtn.title = "ブラウザに止められたかも"; });
  } else {
    ambientAudio.pause();
    ambBtn.classList.remove("active");
    ambBtn.title = "静かな環境音 (オフ)";
  }
};

const enterBtn = document.getElementById('enter-place-btn');
if(enterBtn){
  enterBtn.onclick = () => { if(nearbyPlace) openOverlay(nearbyPlace.id); };
}

// ─── Target marker pulse animation ────────────────────────────────
function animateTargetMarker(t){
  if(targetMarker && targetMarker.visible && targetMarker.userData.pulse){
    const s = 1 + Math.sin(t * 4) * 0.18;
    targetMarker.userData.pulse.scale.setScalar(s);
    targetMarker.userData.pulse.material.opacity = 0.45 + Math.sin(t * 4) * 0.25;
    targetMarker.rotation.y = t * 0.6;
  }
}
// hook into existing animate loop via a global the loop already calls
const __oldAnimateHook = window.__niwaAnimHook;
window.__niwaAnimHook = (t) => { animateTargetMarker(t); if(__oldAnimateHook) __oldAnimateHook(t); };

// ─── Splash dismiss ────────────────────────────────────────────────
document.getElementById('enter-btn').onclick = () => {
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('bar').classList.add('show');
  init();
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
  }, 500);
};
