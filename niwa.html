<style>
:root{
  --indigo:#0a0a1a;
  --indigo-2:#15192e;
  --paper:#e8dcb8;
  --paper-soft:#f3e7c4;
  --paper-dim:#b8a878;
  --ink-soft:#7a6e58;
  --candle:#ffb968;
  --candle-soft:#ffd970;
  --candle-deep:#d68a30;
  --moss:#5a7a4a;
  --vermilion:#b04030;
  --water:#7ac0d8;
  --night-blue:#3a5070;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;background:var(--indigo);color:var(--paper);
  font-family:"Shippori Mincho","Cormorant Garamond",serif;
  font-feature-settings:"palt";letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
a{color:var(--candle);text-decoration:none;}
a:hover{color:var(--candle-soft);}

body::after{content:"";position:fixed;inset:0;z-index:300;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7 0 0 0 0 0.6 0 0 0 0 0.4 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.35;mix-blend-mode:overlay;}

#container{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;}
#container canvas{display:block;}

/* splash */
.splash{position:fixed;inset:0;z-index:200;
  background:linear-gradient(180deg, rgba(10,10,26,.99), rgba(15,12,30,.99));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:40px 24px;transition:opacity .5s;text-align:center;}
.splash.hidden{opacity:0;pointer-events:none;}
.splash .en{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:clamp(14px,1.5vw,17px);color:var(--candle);letter-spacing:.32em;}
.splash .title{font-family:"Shippori Mincho",serif;font-weight:500;
  font-size:clamp(38px,5.5vw,68px);letter-spacing:.22em;color:var(--paper);}
.splash .title em{font-style:normal;color:var(--candle);
  text-shadow:0 0 24px rgba(255,180,90,.5);}
.splash .sub{font-family:"Shippori Mincho",serif;font-size:14.5px;
  color:var(--paper-dim);max-width:520px;line-height:2.1;}
.splash .keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
  font-family:"Shippori Mincho",serif;color:var(--paper-dim);font-size:12.5px;margin-top:8px;}
.splash .keys span{display:inline-flex;align-items:center;gap:6px;}
.splash .keys kbd{font-family:"JetBrains Mono",monospace;font-size:11px;
  background:rgba(255,185,104,.15);border:1px solid var(--candle);
  border-radius:3px;padding:2px 7px;color:var(--candle-soft);}
.splash button{margin-top:24px;
  padding:14px 38px;background:linear-gradient(180deg, var(--candle-soft), var(--candle-deep));
  color:var(--indigo);font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:15.5px;letter-spacing:.22em;border:none;border-radius:3px;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,180,90,.4);transition:all .2s;}
.splash button:hover{transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(255,180,90,.55);}

/* top bar (after splash) */
.bar{position:fixed;top:0;left:0;right:0;z-index:60;height:54px;
  display:none;align-items:center;justify-content:space-between;padding:0 22px;
  background:linear-gradient(180deg,rgba(10,10,26,.92),rgba(10,10,26,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.bar.show{display:flex;}
.bar .brand{display:flex;align-items:center;gap:10px;
  font-family:"Shippori Mincho",serif;font-weight:700;font-size:16px;
  letter-spacing:.18em;color:var(--paper-soft);}
.bar .brand .lantern{display:inline-block;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff2c0, var(--candle) 50%, transparent 80%);
  box-shadow:0 0 10px var(--candle), 0 0 20px rgba(255,180,90,.4);
  animation:flicker 4s ease-in-out infinite;}
@keyframes flicker{0%,30%,40%,100%{opacity:1;}35%,42%{opacity:.75;}}
.bar .brand .sub{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:12.5px;color:var(--ink-soft);letter-spacing:.16em;margin-left:4px;font-weight:400;}
.bar .info{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:12px;color:var(--ink-soft);letter-spacing:.1em;}
.bar .info kbd{font-family:"JetBrains Mono",monospace;font-size:10.5px;
  background:rgba(255,185,104,.12);border:1px solid rgba(255,185,104,.3);
  border-radius:3px;padding:1px 6px;color:var(--candle);margin:0 3px;}
.bar .tools{display:flex;gap:8px;align-items:center;}
.bar .tool{width:34px;height:34px;border-radius:50%;
  background:rgba(28,42,58,.6);border:1px solid rgba(216,178,112,.18);
  color:var(--paper-dim);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;}
.bar .tool:hover{border-color:var(--candle);color:var(--candle);}
.bar .tool.active{color:var(--candle);border-color:var(--candle);
  box-shadow:0 0 10px rgba(255,185,104,.4);}
.bar .back{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:13px;color:var(--ink-soft);padding-left:8px;}
.bar .back:hover{color:var(--candle);}
@media (max-width:720px){
  .bar{padding:0 12px;}
  .bar .brand .sub, .bar .info{display:none;}
}

/* hover tooltip when a place is highlighted */
.hover-tip{position:fixed;z-index:55;pointer-events:none;
  font-family:"Shippori Mincho",serif;font-size:13.5px;color:var(--paper);
  background:rgba(10,10,26,.94);border:1px solid var(--candle);border-radius:3px;
  padding:7px 14px;letter-spacing:.06em;white-space:nowrap;opacity:0;
  transition:opacity .15s;
  box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 14px rgba(255,180,90,.2);
  transform:translate(-50%, -120%);}

/* "入る" button shown when avatar is near a place */
.enter-place-btn{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);
  z-index:58;display:none;align-items:center;gap:10px;
  padding:14px 32px;cursor:pointer;
  background:linear-gradient(180deg, var(--candle-soft), var(--candle-deep));
  color:var(--indigo);
  font-family:"Shippori Mincho",serif;font-weight:700;font-size:15px;letter-spacing:.18em;
  border:1px solid var(--candle-soft);border-radius:4px;
  box-shadow:0 8px 22px rgba(255,180,90,.45);
  transition:transform .2s, box-shadow .2s;
  animation:enterPulse 1.6s ease-in-out infinite;}
.enter-place-btn:hover{transform:translateX(-50%) translateY(-3px);
  box-shadow:0 14px 30px rgba(255,180,90,.6);}
@keyframes enterPulse{
  0%,100%{box-shadow:0 8px 22px rgba(255,180,90,.45),0 0 0 0 rgba(255,217,112,.5);}
  50%   {box-shadow:0 8px 22px rgba(255,180,90,.45),0 0 0 18px rgba(255,217,112,0);}
}
.hover-tip.show{opacity:1;}
.hover-tip kbd{font-family:"JetBrains Mono",monospace;font-size:10.5px;
  background:rgba(255,185,104,.16);border:1px solid var(--candle);
  border-radius:2px;padding:1px 5px;color:var(--candle-soft);margin-left:6px;}

/* visited dots (top centre) */
.visited-row{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:62;
  display:none;align-items:center;gap:8px;pointer-events:none;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  color:var(--ink-soft);font-size:11px;letter-spacing:.16em;}
.visited-row.show{display:flex;}
.visited-row .vlabel{flex-shrink:0;}
.visited-row .vdot{width:8px;height:8px;border-radius:50%;
  background:rgba(216,178,112,.32);transition:all .25s;}
.visited-row .vdot.on{background:var(--candle);
  box-shadow:0 0 8px var(--candle);}

/* ── overlay (place content modal, same as before) ── */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);padding:60px 16px;overflow-y:auto;}
.overlay.open{display:flex;animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.overlay-inner{background:linear-gradient(180deg, #15192e 0%, #0a0a1a 100%);
  border:1px solid var(--candle);border-radius:6px;
  padding:36px 40px 32px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;
  position:relative;box-shadow:0 24px 60px rgba(0,0,0,.7), 0 0 40px rgba(255,180,90,.12);}
.overlay-close{position:absolute;top:12px;right:16px;background:transparent;
  border:none;color:var(--ink-soft);cursor:pointer;font-size:24px;line-height:1;
  width:36px;height:36px;border-radius:50%;transition:all .15s;}
.overlay-close:hover{color:var(--candle);background:rgba(255,185,104,.1);}
.overlay-eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.32em;text-transform:uppercase;color:var(--candle);
  display:inline-flex;align-items:center;gap:10px;margin-bottom:6px;}
.overlay-eyebrow::before{content:"";width:30px;height:1px;background:var(--candle);}
.overlay-inner h2{font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:clamp(26px,3.4vw,38px);color:var(--paper);
  margin:4px 0 4px;letter-spacing:.08em;line-height:1.25;}
.overlay-inner h2 em{font-style:normal;color:var(--candle);}
.overlay-en{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:14px;color:var(--paper-dim);letter-spacing:.16em;margin-bottom:18px;}
.overlay-deck{font-family:"Shippori Mincho",serif;font-size:15px;
  color:var(--paper-dim);line-height:2.1;margin-bottom:22px;}
.overlay-deck em{font-style:normal;color:var(--paper-soft);}
.overlay-cta{display:inline-flex;align-items:center;gap:14px;
  font-family:"Cormorant Garamond","Shippori Mincho",serif;font-style:italic;
  font-size:15.5px;letter-spacing:.06em;color:var(--candle);
  padding:12px 26px;border:1px solid rgba(255,185,104,.4);border-radius:4px;
  background:rgba(255,185,104,.05);cursor:pointer;transition:all .2s;text-decoration:none;}
.overlay-cta:hover{background:rgba(255,185,104,.15);border-color:var(--candle);
  gap:20px;color:var(--candle-soft);}

.breath-widget{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.breath-circle{width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,180,80,.55), rgba(255,140,40,.32) 50%, rgba(176,64,48,.05) 90%);
  box-shadow:0 0 50px rgba(255,140,40,.32), inset 0 0 30px rgba(255,217,112,.32);
  display:flex;align-items:center;justify-content:center;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:24px;color:var(--paper-soft);letter-spacing:.12em;
  transition:transform 4s cubic-bezier(.4,0,.4,1);}
.breath-circle.in, .breath-circle.hold{transform:scale(1.32);}
.breath-circle.out{transform:scale(1);}
.breath-phase{font-family:"Shippori Mincho",serif;font-size:14.5px;
  color:var(--paper-dim);letter-spacing:.16em;min-height:24px;}
.breath-phase b{color:var(--candle);font-weight:500;}
.breath-btn{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:14.5px;letter-spacing:.06em;color:var(--candle);
  padding:9px 22px;border:1px solid rgba(255,185,104,.4);border-radius:4px;
  background:transparent;cursor:pointer;transition:all .2s;}
.breath-btn:hover{background:rgba(255,185,104,.1);}
.breath-hint{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;
  max-width:380px;line-height:1.7;text-align:center;}

.poems{display:flex;flex-direction:column;gap:26px;}
.poem{font-family:"Shippori Mincho",serif;color:var(--paper-soft);
  font-size:14.5px;line-height:2.3;letter-spacing:.06em;
  border-left:1px solid rgba(122,192,216,.32);padding-left:18px;}
.poem .signature{display:block;margin-top:4px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;}
.poem em{color:var(--candle-soft);font-style:normal;}

.ambient-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.amb-tile{padding:14px 16px;background:rgba(28,42,58,.6);
  border:1px solid rgba(122,192,216,.22);border-radius:4px;
  text-decoration:none;color:var(--paper);transition:all .2s;
  display:flex;flex-direction:column;gap:3px;}
.amb-tile:hover{border-color:var(--water);background:rgba(122,192,216,.1);
  transform:translateY(-2px);}
.amb-tile .icon{font-size:20px;margin-bottom:4px;}
.amb-tile .name{font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:13.5px;color:var(--paper);}
.amb-tile .src{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:10px;color:var(--paper-dim);letter-spacing:.06em;text-transform:uppercase;}

.starscape{position:relative;width:100%;height:240px;
  border-radius:6px;overflow:hidden;
  border:1px solid rgba(216,178,112,.18);
  background:radial-gradient(ellipse at 50% 100%, #1a2838 0%, var(--indigo) 100%);}
.starscape .horizon{position:absolute;bottom:0;left:0;right:0;height:14%;
  background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.7) 100%);}
.starscape .star{position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff8d8;box-shadow:0 0 4px #fff2c0;}
.starscape .star.lg{width:3px;height:3px;
  box-shadow:0 0 6px #fff8d8, 0 0 12px rgba(255,217,112,.5);}
.starscape .star.tw{animation:starTw 3s ease-in-out infinite;}
@keyframes starTw{
  0%,100%{opacity:.85;transform:scale(1);}
  50%{opacity:.4;transform:scale(.85);}
}
.starscape .shootingstar{position:absolute;width:80px;height:1px;
  background:linear-gradient(90deg, transparent, #fff8d8, transparent);
  transform:rotate(-15deg);opacity:0;animation:shoot 12s linear infinite;}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0) rotate(-15deg);}
  3%{opacity:.85;}
  10%{opacity:0;transform:translate(180px,40px) rotate(-15deg);}
  100%{opacity:0;}
}

/* status HUD (added v3 game layer) */
.status-hud{
  position:fixed; right:18px; top:80px; z-index: 80;
  background: rgba(14, 26, 38, 0.55);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255, 200, 130, 0.25);
  border-radius: 12px;
  padding: 10px 14px;
  color:#f4ead0;
  font-family: 'Shippori Mincho', serif;
  box-shadow: 0 6px 24px rgba(0,0,0,0.42);
  display:flex; flex-direction:column; gap:6px;
  pointer-events:auto;
}
.status-hud .status-row{ display:flex; align-items:baseline; gap:8px; }
.status-hud .status-label{
  font-size: 0.7rem; letter-spacing:0.25em; color: rgba(255, 220, 170, 0.65);
}
.status-hud .status-val{
  font-size: 1.18rem; font-weight: 600; color:#ffc176;
  font-variant-numeric: tabular-nums; letter-spacing:0.05em;
}
.status-hud .time-lbl{ margin-left: 8px; }
.status-hud .time-val{ color:#a8c8ff; font-size: 0.9rem; }
.status-hud .status-tools{ display:flex; gap:6px; padding-top:4px; border-top:1px solid rgba(255,200,130,0.15); }
.status-hud .status-btn{
  flex:1; background: rgba(255,205,150,0.08); color:#f4ead0;
  border:1px solid rgba(255, 200, 130, 0.3);
  padding:6px 10px; border-radius:8px;
  font-family: inherit; font-size:0.78rem; letter-spacing:0.15em;
  cursor:pointer; transition: background 0.15s;
}
.status-hud .status-btn:hover{ background: rgba(255,205,150,0.22); }
.status-hud .status-btn.on{ background:#c98a48; border-color:#c98a48; color:#1a0e06; }

.achievement-banner{
  position:fixed; top: 110px; left: 50%;
  transform: translateX(-50%);
  z-index: 90;
  background: linear-gradient(135deg, rgba(40,20,8,0.92), rgba(80,40,16,0.92));
  border: 1px solid rgba(255, 196, 120, 0.5);
  box-shadow: 0 12px 40px rgba(255, 150, 80, 0.32), 0 0 60px rgba(255, 180, 100, 0.18);
  border-radius: 14px;
  padding: 14px 28px;
  color: #f4ead0;
  font-family: 'Shippori Mincho', serif;
  opacity: 0; pointer-events:none;
  transition: opacity 0.4s, transform 0.4s;
  text-align: center;
  min-width: 260px;
}
.achievement-banner.show{ opacity:1; transform: translate(-50%, 10px); }
.achievement-banner .ach-lab{ font-size: 0.66rem; letter-spacing: 0.4em; color: #ffb070; }
.achievement-banner .ach-ttl{ margin-top: 4px; font-size: 1.05rem; letter-spacing: 0.18em; color: #fff2cf; }
.achievement-banner .ach-dsc{ margin-top: 4px; font-size: 0.78rem; color: rgba(255, 232, 195, 0.72); letter-spacing:0.1em; }

@media (max-width: 720px){
  .status-hud{ top:auto; bottom: 80px; right: 12px; padding: 8px 10px; }
  .status-hud .status-val{ font-size: 1rem; }
}
</style>

<body>

<!-- splash -->
<div class="splash" id="splash">
  <div class="en">A Quiet Garden · № 08</div>
  <div class="title">心 の <em>庭</em></div>
  <div class="sub">
    月夜の庭を、 ドラッグで見渡しながら散策します。<br>
    八つの場所をクリックして、 心を整える小さな世界を巡ろう。
  </div>
  <div class="keys">
    <span><kbd>タップ</kbd> 行きたい場所へ歩く</span>
    <span><kbd>ドラッグ</kbd> 視点を回す</span>
    <span><kbd>F</kbd> または <kbd>入る</kbd>ボタン</span>
  </div>
  <button id="enter-btn">庭に入る</button>
</div>

<!-- top bar (visible after splash) -->

function hash(x, y, seed = 0) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 45.164) * 43758.5453;
  return n - Math.floor(n);
}

// ─── Procedural canvas texture generators ──────────────────────────
// 1) Lush moonlit grass + dirt path + scattered flowers
function makeGrassTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const x = c.getContext('2d');

  // base gradient — moonlit green
  const g = x.createRadialGradient(512, 512, 100, 512, 512, 720);
  g.addColorStop(0, '#3a5a3a');
  g.addColorStop(0.3, '#2c4a30');
  g.addColorStop(0.7, '#1e3624');
  g.addColorStop(1, '#0e1c14');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);

  // grass clumps (many overlapping ellipses)
  for(let i = 0; i < 850; i++){
    const r = 14 + Math.random() * 38;
    const px = Math.random() * 1024, py = Math.random() * 1024;
    x.fillStyle = `rgba(${60 + Math.random()*70}, ${110 + Math.random()*70}, ${60 + Math.random()*40}, ${0.16 + Math.random()*0.28})`;
    x.beginPath(); x.ellipse(px, py, r, r * 0.7, Math.random() * Math.PI, 0, Math.PI * 2); x.fill();
  }
  // single blades
  for(let i = 0; i < 3500; i++){
    x.strokeStyle = `rgba(${90 + Math.random()*70}, ${150 + Math.random()*70}, ${80 + Math.random()*40}, ${0.3 + Math.random()*0.4})`;
    x.lineWidth = 0.8 + Math.random() * 0.6;
    const px = Math.random() * 1024, py = Math.random() * 1024;
    x.beginPath(); x.moveTo(px, py);
    x.lineTo(px + (Math.random() - 0.5) * 4, py - 3 - Math.random() * 6);
    x.stroke();
  }
  // moonlit flower specks (white / yellow)
  for(let i = 0; i < 220; i++){
    x.fillStyle = Math.random() > 0.5 ? 'rgba(255,248,220,0.85)' : 'rgba(255,217,140,0.7)';
    x.beginPath();
    x.arc(Math.random() * 1024, Math.random() * 1024, 1 + Math.random() * 1.2, 0, Math.PI * 2);
    x.fill();
  }
  // dirt patches (worn areas)
  for(let i = 0; i < 12; i++){
    const px = Math.random() * 1024, py = Math.random() * 1024;
    const r = 50 + Math.random() * 90;
    const gr = x.createRadialGradient(px, py, 10, px, py, r);
    gr.addColorStop(0, 'rgba(110, 80, 55, 0.55)');
    gr.addColorStop(1, 'rgba(110, 80, 55, 0)');
    x.fillStyle = gr;
    x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fill();
  }
  return c;
}

// 2) Wood plank texture (warm)
function makeWoodTexture(baseHue = 28){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  // base
  x.fillStyle = `hsl(${baseHue}, 30%, 28%)`;
  x.fillRect(0, 0, 512, 512);
  // vertical planks
  const plankCount = 8;
  for(let i = 0; i < plankCount; i++){
    const px = i * (512 / plankCount);
    const w = (512 / plankCount);
    const shade = -10 + Math.random() * 20;
    x.fillStyle = `hsl(${baseHue}, ${30 + Math.random()*20}%, ${22 + Math.random()*16}%)`;
    x.fillRect(px, 0, w, 512);
    // plank gap
    x.fillStyle = 'rgba(10,5,0,0.7)';
    x.fillRect(px - 1, 0, 2, 512);
    // grain
    for(let j = 0; j < 24; j++){
      x.strokeStyle = `rgba(${30 + Math.random()*30}, ${20 + Math.random()*20}, ${10 + Math.random()*10}, ${0.18 + Math.random()*0.18})`;
      x.lineWidth = 0.6 + Math.random();
      const y = Math.random() * 512;
      x.beginPath();
      x.moveTo(px + 1, y);
      x.bezierCurveTo(px + w/3, y + (Math.random()-0.5)*8,
                       px + 2*w/3, y + (Math.random()-0.5)*8,
                       px + w - 1, y + (Math.random()-0.5)*4);
      x.stroke();
    }
    // knots
    if(Math.random() < 0.4){
      const ky = Math.random() * 512;
      const kg = x.createRadialGradient(px + w/2, ky, 1, px + w/2, ky, 10);
      kg.addColorStop(0, 'rgba(10,5,0,0.8)');
      kg.addColorStop(1, 'rgba(40,25,12,0)');
      x.fillStyle = kg;
      x.beginPath(); x.arc(px + w/2, ky, 10, 0, Math.PI * 2); x.fill();
    }
  }
  return c;
}

// 3) Thatch / shingle roof texture
function makeRoofTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  // base brown
  x.fillStyle = '#3a2818';
  x.fillRect(0, 0, 512, 512);
  // shingle rows
  const rows = 14;
  for(let r = 0; r < rows; r++){
    const ry = r * (512 / rows);
    const rh = 512 / rows;
    const offset = (r % 2) * 18;
    for(let i = -1; i <= 14; i++){
      const ix = i * 40 + offset;
      const shade = 40 + Math.random() * 30;
      const sat = 35 + Math.random() * 15;
      x.fillStyle = `hsl(${22 + Math.random()*10}, ${sat}%, ${shade/3}%)`;
      x.beginPath();
      x.moveTo(ix, ry + rh);
      x.lineTo(ix + 8, ry + rh * 0.4);
      x.quadraticCurveTo(ix + 22, ry, ix + 36, ry + rh * 0.4);
      x.lineTo(ix + 44, ry + rh);
      x.closePath();
      x.fill();
      // edge shadow
      x.strokeStyle = 'rgba(10, 5, 0, 0.4)';
      x.lineWidth = 0.6;
      x.stroke();
    }
  }
  return c;
}

// 4) Stone wall (for hourglass platform, observatory base)
function makeStoneTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#5a544a';
  x.fillRect(0, 0, 512, 512);
  // stones - irregular polygons
  for(let i = 0; i < 80; i++){
    const cx = Math.random() * 512, cy = Math.random() * 512;
    const r = 25 + Math.random() * 35;
    const sides = 5 + Math.floor(Math.random() * 4);
    x.fillStyle = `hsl(${30 + Math.random()*15}, ${10 + Math.random()*15}%, ${30 + Math.random()*25}%)`;
    x.beginPath();
    for(let s = 0; s <= sides; s++){
      const a = (s / sides) * Math.PI * 2 + Math.random() * 0.3;
      const rr = r * (0.7 + Math.random() * 0.4);
      x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    x.closePath();
    x.fill();
    x.strokeStyle = 'rgba(20, 15, 10, 0.6)';
    x.lineWidth = 1.2;
    x.stroke();
  }
  // mossy patches
  for(let i = 0; i < 40; i++){
    const g = x.createRadialGradient(Math.random()*512, Math.random()*512, 4,
                                     Math.random()*512, Math.random()*512, 28);
    g.addColorStop(0, 'rgba(60, 100, 50, 0.45)');
    g.addColorStop(1, 'rgba(60, 100, 50, 0)');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  }
  return c;
}

// 5) Tree sprite (canvas with transparency, used as billboard)
function makeTreeSprite(seed = 0){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 384;
  const x = c.getContext('2d');
  const W = 256, H = 384;
  // trunk
  const tw = 22 + (hash(seed, 1) * 8);
  const th = 130 + hash(seed, 2) * 40;
  const tg = x.createLinearGradient(W/2 - tw, 0, W/2 + tw, 0);
  tg.addColorStop(0, '#2a1810');
  tg.addColorStop(0.5, '#4a3018');
  tg.addColorStop(1, '#2a1810');
  x.fillStyle = tg;
  x.fillRect(W/2 - tw/2, H - th, tw, th);
  // bark cracks
  for(let i = 0; i < 6; i++){
    x.strokeStyle = 'rgba(10, 5, 0, 0.5)';
    x.lineWidth = 0.7;
    x.beginPath();
    x.moveTo(W/2 - tw/2 + (i * tw / 6), H - th);
    x.lineTo(W/2 - tw/2 + (i * tw / 6) + (Math.random() - 0.5) * 4, H);
    x.stroke();
  }
  // foliage — many overlapping circles
  const fY = H - th + 10;
  const fSize = 110 + hash(seed, 3) * 30;
  // dark base
  for(let i = 0; i < 120; i++){
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * fSize * 0.85;
    const px = W/2 + Math.cos(a) * r;
    const py = fY + Math.sin(a) * r * 0.85 - fSize * 0.4;
    const rad = 24 + Math.random() * 20;
    const hue = 90 + Math.random() * 30;
    const sat = 30 + Math.random() * 25;
    const lt = 12 + Math.random() * 14;
    x.fillStyle = `hsl(${hue}, ${sat}%, ${lt}%)`;
    x.globalAlpha = 0.55 + Math.random() * 0.3;
    x.beginPath();
    x.arc(px, py, rad, 0, Math.PI * 2);
    x.fill();
  }
  x.globalAlpha = 1.0;
  // highlight on moonlit side (top-right)
  for(let i = 0; i < 30; i++){
    const a = Math.random() * Math.PI * 0.6 + Math.PI * 1.7;
    const r = Math.random() * fSize * 0.6;
    const px = W/2 + Math.cos(a) * r;
    const py = fY + Math.sin(a) * r * 0.85 - fSize * 0.45;
    const rad = 14 + Math.random() * 12;
    x.fillStyle = `hsl(${100 + Math.random()*20}, 40%, ${40 + Math.random()*15}%)`;
    x.globalAlpha = 0.5;
    x.beginPath(); x.arc(px, py, rad, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1.0;
  return c;
}

// 6) Fern / bush sprite
function makeBushSprite(seed = 0){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 96;
  const x = c.getContext('2d');
  const W = 128, H = 96;
  // base shadow
  x.fillStyle = 'rgba(10, 20, 10, 0.4)';
  x.beginPath(); x.ellipse(W/2, H - 8, 50, 8, 0, 0, Math.PI * 2); x.fill();
  // foliage
  for(let i = 0; i < 40; i++){
    const angle = Math.random() * Math.PI - Math.PI;
    const dist = Math.random() * 38;
    const px = W/2 + Math.cos(angle) * dist;
    const py = H - 22 + Math.sin(angle) * dist * 0.4 - Math.random() * 14;
    const rad = 11 + Math.random() * 10;
    const hue = 85 + Math.random() * 30;
    x.fillStyle = `hsl(${hue}, ${30 + Math.random()*25}%, ${14 + Math.random()*16}%)`;
    x.globalAlpha = 0.65 + Math.random() * 0.25;
    x.beginPath(); x.arc(px, py, rad, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1;
  return c;
}

// 7) Smoke particle (single soft puff)
function makeSmokeTexture(){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 4, 64, 64, 60);
  g.addColorStop(0, 'rgba(220, 220, 220, 0.55)');
  g.addColorStop(0.6, 'rgba(180, 180, 180, 0.2)');
  g.addColorStop(1, 'rgba(180, 180, 180, 0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return c;
}

// Texture cache
const TEX = {};
function ensureTextures(){
  if(TEX.ready) return;
  TEX.grass = new THREE.CanvasTexture(makeGrassTexture());
  TEX.grass.wrapS = TEX.grass.wrapT = THREE.RepeatWrapping;
  TEX.grass.repeat.set(2, 2);
  TEX.wood = new THREE.CanvasTexture(makeWoodTexture(28));
  TEX.wood.wrapS = TEX.wood.wrapT = THREE.RepeatWrapping;
  TEX.woodDark = new THREE.CanvasTexture(makeWoodTexture(18));
  TEX.woodDark.wrapS = TEX.woodDark.wrapT = THREE.RepeatWrapping;
  TEX.roof = new THREE.CanvasTexture(makeRoofTexture());
  TEX.roof.wrapS = TEX.roof.wrapT = THREE.RepeatWrapping;
  TEX.stone = new THREE.CanvasTexture(makeStoneTexture());
  TEX.stone.wrapS = TEX.stone.wrapT = THREE.RepeatWrapping;
  TEX.smoke = new THREE.CanvasTexture(makeSmokeTexture());
  TEX.trees = [
    new THREE.CanvasTexture(makeTreeSprite(0)),
    new THREE.CanvasTexture(makeTreeSprite(7)),
    new THREE.CanvasTexture(makeTreeSprite(13)),
    new THREE.CanvasTexture(makeTreeSprite(21)),
  ];
  TEX.bushes = [
    new THREE.CanvasTexture(makeBushSprite(2)),
    new THREE.CanvasTexture(makeBushSprite(9)),
    new THREE.CanvasTexture(makeBushSprite(17)),
  ];
  TEX.ready = true;
}

// ─── Locations ─────────────────────────────────────────────────────
const LOCATIONS = [
  {id:"takibi",  x:0,    z:0,   name:"焚き火の前",   en:"At the Bonfire",   type:"firepit"},
  {id:"tsuki",   x:-16,  z:-15, name:"月光の書架",   en:"Moonlit Library",  type:"library"},
  {id:"oto",     x:16,   z:-13, name:"音の祠",       en:"Sound Shrine",     type:"torii"},
  {id:"tabi",    x:0,    z:-26, name:"ひとり旅の道", en:"Solitary Road",    type:"road"},
  {id:"mizube",  x:-19,  z:6,   name:"水辺の岸",     en:"Water's Edge",     type:"pond"},
  {id:"toki",    x:19,   z:8,   name:"時の砂時計",   en:"Hourglass",        type:"hourglass"},
  {id:"amaoto",  x:-11,  z:19,  name:"雨音の部屋",   en:"Room of Rain",     type:"hut"},
  {id:"hoshi",   x:13,   z:21,  name:"星見台",       en:"Observatory",      type:"observatory"},
];

// ─── Three.js init ─────────────────────────────────────────────────
function init() {
  ensureTextures();
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 65, 145);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 12, 18);
  camera.lookAt(0, 1.5, 0);

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // Cinematic tone mapping for "pre-rendered" feel
  // (output stays Linear to match existing material brightness; tone mapping + bloom give cinematic punch)
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.78;
  document.getElementById('container').appendChild(renderer.domElement);

  // EffectComposer + Bloom for soft glow on lanterns/moon/fireflies
  if (typeof THREE.EffectComposer === 'function') {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.42,  // strength
      0.7,   // radius
      0.88   // threshold (high — only emissive lanterns/fire bloom, not mid-grays)
    );
    composer.addPass(bloomPass);
  }

  createStarfield();
  createMoonOrb();

  // Lighting — references stored on scene.userData for day/night cycle
  const ambient = new THREE.AmbientLight(0x9090b8, 0.42);
  scene.add(ambient);

  const moonLight = new THREE.DirectionalLight(0xd0d0ff, 0.85);
  moonLight.position.set(60, 80, 40);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.width = 2048;
  moonLight.shadow.mapSize.height = 2048;
  moonLight.shadow.camera.left = -70;
  moonLight.shadow.camera.right = 70;
  moonLight.shadow.camera.top = 70;
  moonLight.shadow.camera.bottom = -70;
  moonLight.shadow.bias = -0.0001;
  scene.add(moonLight);

  // Subtle warm fill from a low east-side amber
  const fill = new THREE.HemisphereLight(0x1a2240, 0x3a2818, 0.18);
  scene.add(fill);

  scene.userData.lights = { ambient, sun: moonLight, fill };

  createGround();
  buildSurroundingMountains();
  buildLargeLake();
  buildVillageBuildings();
  LOCATIONS.forEach(loc => createLocation(loc));

  // Dense forest — bias trees toward outer rings
  for(let i = 0; i < 220; i++){
    const angle = hash(i, 0, 100) * Math.PI * 2;
    // bias toward outer ring (sqrt curve)
    const t = Math.sqrt(hash(0, i, 100));
    const dist = 18 + t * 50;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    if(notTooCloseToPlaces(x, z, 4) && notInLake(x, z)) createTree(x, z);
  }
  // Pine trees on mountain slopes
  for(let i = 0; i < 60; i++){
    const angle = hash(i, 50, 100) * Math.PI * 2;
    const dist = 55 + hash(50, i, 100) * 12;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    if(notTooCloseToPlaces(x, z, 3) && notInLake(x, z)) createTree(x, z);
  }
  // Bushes scattered
  for(let i = 0; i < 100; i++){
    const x = (hash(i, 10, 100) - 0.5) * 90;
    const z = (hash(10, i, 100) - 0.5) * 90;
    if(Math.sqrt(x*x + z*z) > 7 &&
       notTooCloseToPlaces(x, z, 2.5) &&
       notInLake(x, z)) createBush(x, z);
  }
  // Lanterns along the central paths
  for(let i = 0; i < 12; i++){
    const angle = (i / 12) * Math.PI * 2;
    const dist = 9;
    createPathLantern(Math.cos(angle) * dist, Math.sin(angle) * dist);
  }
  // NPCs (small wandering villagers)
  buildNPCs();

  // Create the player avatar at the south entry
  buildAvatar3D();

  // Target marker (pulsing ring shown where you tapped)
  buildTargetMarker();

  setupControls();
  setupKeyboard();
  setupTouch();
  refreshVisitedDots();
  setupGameLayer();
  animate();
}

// ─── Player avatar (3D) ────────────────────────────────────────────
function buildAvatar3D(){
  const g = new THREE.Group();
  // body — robe-like cylinder

// Stair-aware elevation: returns the highest "walkable" surface at (x, z).
// Combines terrain + the south stone steps + the river bridge.
function getWalkableY(x, z){
  let y = getTerrainHeight(x, z);
  // south stone steps (10 steps along z = 9..18 with width ±2.1)
  if(Math.abs(x) < 2.1 && z > 8.5 && z < 18.5){
    const t = Math.max(0, Math.min(9, (18 - z) / 0.9));
    const stepIndex = Math.floor(t);
    const stepY = getTerrainHeight(0, 18 - stepIndex * 0.9) + 0.3 + stepIndex * 0.15;
    if(stepY > y) y = stepY;
  }
  // river bridge: planks centred around (-10, 16) rotated. Local check on a generous box.
  const bridgeX = -10, bridgeZ = 16;
  const dx = x - bridgeX, dz = z - bridgeZ;
  if(Math.abs(dx) < 1.8 && Math.abs(dz) < 1.8){
    const bridgeY = getTerrainHeight(bridgeX, bridgeZ) + 0.65;
    if(bridgeY > y) y = bridgeY;
  }
  // terraces (east hill, around 48, 26)
  const txp = x - 48, tzp = z - 26;
  // rotate -0.8: local coords
  const cos = Math.cos(0.8), sin = Math.sin(0.8);
  const lx = txp * cos - tzp * sin;
  const lz = txp * sin + tzp * cos;
  if(Math.abs(lx) < 3 && lz > -0.5 && lz < 6){
    const tStep = Math.floor(lz / 1.4);
    const tStepClamped = Math.max(0, Math.min(3, tStep));
    const terY = getTerrainHeight(48, 26) + 0.6 + tStepClamped * 0.7;
    if(terY > y) y = terY;
  }
  return y;
}

function notTooCloseToPlaces(x, z, r){
  for(const loc of LOCATIONS){
    const d = Math.hypot(x - loc.x, z - loc.z);
    if(d < r + 3.5) return false;
  }
  // also avoid village buildings
  for(const v of (window.__villagePos || [])){
    if(Math.hypot(x - v.x, z - v.z) < r + 2.5) return false;
  }
  return true;
}

const LAKE = {cx: -32, cz: -38, rx: 18, rz: 14};
function notInLake(x, z){
  const dx = (x - LAKE.cx) / LAKE.rx;
  const dz = (z - LAKE.cz) / LAKE.rz;
  return (dx*dx + dz*dz) > 1.0;
}

// ─── Terrain heightmap ──────────────────────────────────────────────
// Central plaza is flat; gentle rolling outside; mountains rise toward
// the rim; lake sinks into the ground; a river valley cuts south from
// the lake to the rim. Buildings, trees, NPCs all follow this.
const RIVER_PATH = [
  {x: -32, z: -24}, {x: -28, z: -16}, {x: -22, z: -8},
  {x: -16, z: 4},   {x: -10, z: 16},  {x: -4, z: 28},
  {x: 2, z: 42},    {x: 8, z: 56},
];
function distToRiver(x, z){
  let minD = Infinity;
  for(let i = 0; i < RIVER_PATH.length - 1; i++){
    const a = RIVER_PATH[i], b = RIVER_PATH[i+1];
    const abx = b.x - a.x, abz = b.z - a.z;
    const apx = x - a.x, apz = z - a.z;
    const t = Math.max(0, Math.min(1, (apx*abx + apz*abz) / (abx*abx + abz*abz)));
    const px = a.x + abx * t, pz = a.z + abz * t;
    const d = Math.hypot(x - px, z - pz);
    if(d < minD) minD = d;
  }
  return minD;
}

function getTerrainHeight(x, z){
  const dist = Math.hypot(x, z);

  // 1. central plaza: flat
  if(dist < 9) return 0;

  // 2. lake depression
  const lakeDX = (x - LAKE.cx) / LAKE.rx;
  const lakeDZ = (z - LAKE.cz) / LAKE.rz;
  const lakeR = Math.sqrt(lakeDX*lakeDX + lakeDZ*lakeDZ);
  if(lakeR < 1.0){
    return -1.4 + (1 - lakeR) * -0.2;
  }
  // lake shore rim
  let shoreLift = 0;
  if(lakeR < 1.3) shoreLift = (1 - (lakeR - 1.0) / 0.3) * 0.8 - 0.2;

  // 3. river valley along the river path (depressed by 0.5 within 2.5 wide)
  const dRiver = distToRiver(x, z);
  let riverDip = 0;
  if(dRiver < 2.5) riverDip = -(1 - dRiver / 2.5) * 0.7;

  // 4. gentle rolling terrain
  let h = Math.sin(x * 0.075) * Math.cos(z * 0.075) * 0.7 +
          Math.sin(x * 0.18 + 1.2) * Math.cos(z * 0.16 + 0.7) * 0.32 +
          Math.sin(x * 0.34 + 2.1) * Math.cos(z * 0.28 + 1.4) * 0.18;

  // 5. mountain rise toward the rim (smooth, after dist 35)
  if(dist > 35){
    const t = Math.min(1, (dist - 35) / 35);
    h += t * t * 9;
  }

  // 6. ease in from the central plaza (smooth transition)
  if(dist < 18){
    const blend = Math.min(1, (dist - 9) / 9);
    h *= blend * blend;
  }

  return h + shoreLift + riverDip;
}

// Helper: place an object at terrain height
function placeOnTerrain(obj, x, z, extraY = 0){
  obj.position.set(x, getTerrainHeight(x, z) + extraY, z);
}

// ─── Large lake to the north ──────────────────────────────────────
function buildLargeLake(){
  // water surface (ellipse)
  const waterGeo = new THREE.PlaneGeometry(LAKE.rx * 2, LAKE.rz * 2, 24, 24);
  // ripple displacement
  const pos = waterGeo.attributes.position;
  for(let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, Math.sin(x * 0.4) * 0.08 + Math.cos(y * 0.3) * 0.06);
  }
  waterGeo.computeVertexNormals();
  const waterMat = new THREE.MeshLambertMaterial({
    color: 0x3a6a90, transparent: true, opacity: 0.85,
    emissive: 0x1a3852, emissiveIntensity: 0.3,
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(LAKE.cx, 0.1, LAKE.cz);
  scene.add(water);
  // shoreline stones
  for(let i = 0; i < 40; i++){
    const t = i / 40 * Math.PI * 2;
    const stoneR = 0.3 + Math.random() * 0.45;
    const stoneGeo = new THREE.DodecahedronGeometry(stoneR);
    const stoneMat = new THREE.MeshLambertMaterial({
      color: 0x5a544a, flatShading: true,
    });
    const stone = new THREE.Mesh(stoneGeo, stoneMat);
    const r = 1.03 + Math.random() * 0.08;
    stone.position.set(
      LAKE.cx + Math.cos(t) * LAKE.rx * r,
      0.2,
      LAKE.cz + Math.sin(t) * LAKE.rz * r
    );
    stone.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
    stone.castShadow = true;
    scene.add(stone);
  }
  // a small wooden dock (pier)
  const dockGroup = new THREE.Group();
  for(let i = 0; i < 5; i++){
    const plankGeo = new THREE.BoxGeometry(2.0, 0.12, 0.6);
    const plankMat = new THREE.MeshLambertMaterial({color: 0x5a3818});
    const plank = new THREE.Mesh(plankGeo, plankMat);
    plank.position.set(0, 0.4, i * 0.7);
    plank.castShadow = true;
    dockGroup.add(plank);
  }
  // support posts
  for(const dz of [0, 1.4, 2.8]){
    for(const dx of [-0.9, 0.9]){
      const pGeo = new THREE.BoxGeometry(0.18, 1.4, 0.18);
      const pMat = new THREE.MeshLambertMaterial({color: 0x3a2818});
      const p = new THREE.Mesh(pGeo, pMat);
      p.position.set(dx, -0.3, dz);
      p.castShadow = true;
      dockGroup.add(p);
    }
  }
  dockGroup.position.set(LAKE.cx + LAKE.rx * 0.7, 0, LAKE.cz - LAKE.rz * 0.2);
  dockGroup.rotation.y = Math.PI / 4;
  scene.add(dockGroup);
  // small rowboat
  const boatGroup = new THREE.Group();
  const boatGeo = new THREE.ConeGeometry(0.8, 2.6, 6, 1, false, 0, Math.PI);
  const boatMat = new THREE.MeshLambertMaterial({color: 0x6a4828});
  const boat = new THREE.Mesh(boatGeo, boatMat);
  boat.rotation.z = Math.PI / 2;
  boat.scale.set(1, 1, 0.5);
  boatGroup.add(boat);
  boatGroup.position.set(LAKE.cx + LAKE.rx * 0.5, 0.3, LAKE.cz - LAKE.rz * 0.1);
  boatGroup.userData.bob = true;
  scene.add(boatGroup);
  window.__boat = boatGroup;
}

  // Stone steps leading to the main central plaza from the south

function buildLonghouse(g){
  const wallTex = TEX.wood.clone(); wallTex.needsUpdate = true;
  wallTex.repeat.set(3, 1);
  const w = 6, h = 2.2, d = 2.6;
  // foundation
  const baseGeo = new THREE.BoxGeometry(w + 0.4, 0.3, d + 0.4);
  const baseMat = new THREE.MeshLambertMaterial({map: TEX.stone});
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.15;
  base.receiveShadow = true;
  g.add(base);
  // walls
  const wallGeo = new THREE.BoxGeometry(w, h, d);
  const wallMat = new THREE.MeshLambertMaterial({map: wallTex});
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.y = 0.3 + h / 2;
  wall.castShadow = wall.receiveShadow = true;
  g.add(wall);
  // gable thatch roof — use 2 triangle planes for the slopes + 2 vertical gables
  const roofTex = TEX.roof.clone(); roofTex.needsUpdate = true;
  roofTex.repeat.set(2, 1);
  const slopeMat = new THREE.MeshLambertMaterial({map: roofTex});
  const slopeGeo = new THREE.PlaneGeometry(w + 0.4, d * 0.9);
  const slope1 = new THREE.Mesh(slopeGeo, slopeMat);
  slope1.position.y = h + 0.3 + d * 0.22;
  slope1.position.z = d * 0.25;
  slope1.rotation.x = -Math.PI / 4;
  slope1.castShadow = true;
  g.add(slope1);
  const slope2 = new THREE.Mesh(slopeGeo, slopeMat);
  slope2.position.y = h + 0.3 + d * 0.22;
  slope2.position.z = -d * 0.25;
  slope2.rotation.x = Math.PI / 4;
  slope2.castShadow = true;
  g.add(slope2);
  // ridge
  const ridgeGeo = new THREE.BoxGeometry(w + 0.4, 0.18, 0.18);
  const ridge = new THREE.Mesh(ridgeGeo, new THREE.MeshLambertMaterial({color: 0x1a0e08}));
  ridge.position.y = h + 0.3 + d * 0.45;
  g.add(ridge);
  // gable triangle plates
  for(const sz of [d/2 + 0.01, -d/2 - 0.01]){
    const gShape = new THREE.Shape();
    gShape.moveTo(-w/2 - 0.2, 0);
    gShape.lineTo(w/2 + 0.2, 0);
    gShape.lineTo(0, d * 0.45);
    gShape.lineTo(-w/2 - 0.2, 0);
    const gGeo = new THREE.ShapeGeometry(gShape);
    const gMat = new THREE.MeshLambertMaterial({map: wallTex});
    const gable = new THREE.Mesh(gGeo, gMat);
    gable.position.set(0, h + 0.3, sz);
    g.add(gable);
  }
  // door
  const doorGeo = new THREE.BoxGeometry(0.8, 1.6, 0.05);
  const doorMat = new THREE.MeshLambertMaterial({color: 0x2a1808});
  const door = new THREE.Mesh(doorGeo, doorMat);
  door.position.set(-1.5, 1.1, d / 2 + 0.03);
  g.add(door);
  // window glow
  for(const wx of [1.0, 2.2]){
    const winGeo = new THREE.BoxGeometry(0.7, 0.6, 0.06);
    const winMat = new THREE.MeshLambertMaterial({
      color: 0xffcc70, emissive: 0xffaa40, emissiveIntensity: 0.6,
    });
    const win = new THREE.Mesh(winGeo, winMat);
    win.position.set(wx, 1.4, d / 2 + 0.04);
    g.add(win);
  }
  // chimney + smoke
  const chimGeo = new THREE.BoxGeometry(0.4, 1.4, 0.4);
  const chim = new THREE.Mesh(chimGeo, baseMat);
  chim.position.set(-w * 0.35, h + 0.3 + 0.7, -d * 0.15);
  chim.castShadow = true;
  g.add(chim);
  // simple smoke billboard
  const smkMat = new THREE.SpriteMaterial({
    map: TEX.smoke, transparent: true, opacity: 0.45, depthWrite: false, fog: false,
  });
  const smk = new THREE.Sprite(smkMat);
  smk.position.set(-w * 0.35, h + 2.8, -d * 0.15);
  smk.scale.set(2, 2, 1);
  smk.userData = {phase: Math.random() * 3, baseY: h + 2.8};
  g.add(smk);
  g.userData.smoke = [smk];
}

function buildTeahouse(g){

// ─── Stars ─────────────────────────────────────────────────────────
function createStarfield(){
  const starGeo = new THREE.BufferGeometry();
  const N = 1400;
  const positions = new Float32Array(N * 3);
  const sizes = new Float32Array(N);
  for(let i = 0; i < N; i++){
    positions[i*3]   = (Math.random() - 0.5) * 220;
    positions[i*3+1] = Math.random() * 110 + 18;
    positions[i*3+2] = (Math.random() - 0.5) * 220;
    sizes[i] = 0.18 + Math.random() * 0.4;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const starMat = new THREE.PointsMaterial({
    color: 0xfff2c0, size: 0.32, transparent: true, opacity: 0.85,
    sizeAttenuation: true,
  });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
}

// ─── Ground ────────────────────────────────────────────────────────
function createGround(){
  const size = 160;
  const groundGeo = new THREE.PlaneGeometry(size, size, 140, 140);
  const positions = groundGeo.attributes.position;
  for(let i = 0; i < positions.count; i++){
    const x = positions.getX(i);
    const y = positions.getY(i);
    positions.setZ(i, getTerrainHeight(x, y));
  }
  groundGeo.computeVertexNormals();

  const groundMat = new THREE.MeshLambertMaterial({map: TEX.grass});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  groundMesh = ground;  // used for tap-to-move raycast

  // Stone path circle around centre
  const pathGeo = new THREE.RingGeometry(7, 9.5, 64);
  const ringMat = new THREE.MeshLambertMaterial({map: TEX.stone});
  TEX.stone.repeat.set(3, 1);
  const path = new THREE.Mesh(pathGeo, ringMat);
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.04;
  scene.add(path);

  // Radial dirt paths to each location (segmented so they follow the terrain)
  const dirtMat = new THREE.MeshLambertMaterial({
    color: 0x6a4828, transparent: true, opacity: 0.9,
  });
  LOCATIONS.forEach(loc => {
    const dist = Math.hypot(loc.x, loc.z);
    if(dist < 4) return;
    const segments = 10;
    for(let s = 0; s < segments; s++){
      const t0 = s / segments;
      const t1 = (s + 1) / segments;
      const startDist = 4 + (dist - 4) * t0;
      const endDist = 4 + (dist - 4) * t1;
      const ang = Math.atan2(loc.x, loc.z);
      const mx = Math.sin(ang) * (startDist + endDist) / 2;
      const mz = Math.cos(ang) * (startDist + endDist) / 2;
      const segLen = endDist - startDist;
      const segGeo = new THREE.PlaneGeometry(1.8, segLen);
      const seg = new THREE.Mesh(segGeo, dirtMat);
      seg.rotation.x = -Math.PI / 2;
      seg.position.set(mx, getTerrainHeight(mx, mz) + 0.04, mz);
      seg.rotation.z = -ang + Math.PI;
      seg.receiveShadow = true;
      scene.add(seg);
    }
  });

  // River — narrow water strip following RIVER_PATH segments
  buildRiver();
  // Bridge over river near plaza
  buildRiverBridge();
  // Rice paddies and vegetable fields (cluster of small platforms)
  buildRicePaddies();
  // Stone retaining walls (terracing on a hill)
  buildStoneTerraces();
  // Small water mill
  buildWatermill();

  // Stones, flowers and grass tufts scattered, follow terrain
  for(let i = 0; i < 110; i++){
    const angle = Math.random() * Math.PI * 2;
    const dist = 12 + Math.random() * 55;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    if(!notTooCloseToPlaces(x, z, 2.5) || !notInLake(x, z)) continue;
    if(distToRiver(x, z) < 1.5) continue;
    const ty = getTerrainHeight(x, z);
    if(Math.random() < 0.5){
      const stGeo = new THREE.DodecahedronGeometry(0.18 + Math.random() * 0.22);
      const stMat = new THREE.MeshLambertMaterial({color: 0x6a6258});
      const st = new THREE.Mesh(stGeo, stMat);
      st.position.set(x, ty + 0.1, z);
      st.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
      st.castShadow = true;
      scene.add(st);
    } else {
      const tuftMat = new THREE.SpriteMaterial({
        map: TEX.bushes[i % TEX.bushes.length],
        transparent: true, depthWrite: false,
      });
      const tuft = new THREE.Sprite(tuftMat);
      tuft.scale.set(0.8 + Math.random() * 0.4, 0.6 + Math.random() * 0.3, 1);
      tuft.position.set(x, ty + tuft.scale.y / 2, z);
      scene.add(tuft);
    }
  }
}

// ─── River + bridge ───────────────────────────────────────────────
function buildRiver(){
  const waterMat = new THREE.MeshLambertMaterial({
    color: 0x3a6a90, transparent: true, opacity: 0.82,
    emissive: 0x1a3852, emissiveIntensity: 0.35,
  });
  for(let i = 0; i < RIVER_PATH.length - 1; i++){
    const a = RIVER_PATH[i], b = RIVER_PATH[i+1];
    const len = Math.hypot(b.x - a.x, b.z - a.z);
    const mx = (a.x + b.x) / 2;
    const mz = (a.z + b.z) / 2;
    const segGeo = new THREE.PlaneGeometry(1.6, len, 6, 8);
    const positions = segGeo.attributes.position;
    for(let p = 0; p < positions.count; p++){
      positions.setZ(p, Math.sin(positions.getY(p) * 0.6) * 0.04);
    }
    segGeo.computeVertexNormals();
    const seg = new THREE.Mesh(segGeo, waterMat);
    seg.rotation.x = -Math.PI / 2;
    seg.position.set(mx, getTerrainHeight(mx, mz) + 0.15, mz);
    seg.rotation.z = -Math.atan2(b.x - a.x, b.z - a.z);
    scene.add(seg);
  }
  // Pebbles along banks
  for(let i = 0; i < 50; i++){
    const segIdx = Math.floor(Math.random() * (RIVER_PATH.length - 1));
    const a = RIVER_PATH[segIdx], b = RIVER_PATH[segIdx + 1];
    const t = Math.random();
    const cx = a.x + (b.x - a.x) * t;
    const cz = a.z + (b.z - a.z) * t;
    const sideX = -(b.z - a.z) / Math.hypot(b.x - a.x, b.z - a.z);
    const sideZ =  (b.x - a.x) / Math.hypot(b.x - a.x, b.z - a.z);
    const offset = (Math.random() < 0.5 ? -1 : 1) * (0.9 + Math.random() * 0.5);
    const x = cx + sideX * offset;
    const z = cz + sideZ * offset;
    const pebbleGeo = new THREE.DodecahedronGeometry(0.16 + Math.random() * 0.2);
    const pebbleMat = new THREE.MeshLambertMaterial({color: 0x5a544a});
    const pebble = new THREE.Mesh(pebbleGeo, pebbleMat);
    pebble.position.set(x, getTerrainHeight(x, z) + 0.1, z);
    pebble.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
    scene.add(pebble);
  }
}

function buildRiverBridge(){
  // Locate a river point near the village (around z = 16)
  const bx = -10, bz = 16;
  const ang = Math.atan2(RIVER_PATH[4].x - RIVER_PATH[3].x,
                         RIVER_PATH[4].z - RIVER_PATH[3].z);
  const bg = new THREE.Group();
  // wooden plank deck
  for(let i = -3; i <= 3; i++){
    const plankGeo = new THREE.BoxGeometry(0.4, 0.15, 3.0);
    const plankMat = new THREE.MeshLambertMaterial({color: 0x6a4828});
    const plank = new THREE.Mesh(plankGeo, plankMat);
    plank.position.set(i * 0.5, 0, 0);
    plank.castShadow = true;
    bg.add(plank);
  }
  // railing posts
  for(const dx of [-1.6, -0.6, 0.6, 1.6]){
    for(const dz of [-1.4, 1.4]){
      const postGeo = new THREE.BoxGeometry(0.08, 0.7, 0.08);
      const post = new THREE.Mesh(postGeo,
        new THREE.MeshLambertMaterial({color: 0x4a3018}));
      post.position.set(dx, 0.35, dz);
      bg.add(post);
    }
  }
  // rails
  for(const dz of [-1.4, 1.4]){
    const railGeo = new THREE.BoxGeometry(3.5, 0.07, 0.07);
    const rail = new THREE.Mesh(railGeo,
      new THREE.MeshLambertMaterial({color: 0x4a3018}));
    rail.position.set(0, 0.65, dz);
    bg.add(rail);
  }
  bg.position.set(bx, getTerrainHeight(bx, bz) + 0.5, bz);
  bg.rotation.y = ang;
  scene.add(bg);
}

    {cx: 42,  cz: -2, rot: -0.3},

    mud.receiveShadow = true;
    pg.add(mud);
    // water on top (shallow)

    const water = new THREE.Mesh(wGeo, wMat);
    water.position.y = 0.12;

    // rice plants (rows of small green tufts)

    // wooden bunding (raised edges)

    for(const ez of [-2.55, 2.55]){
      const ebGeo = new THREE.BoxGeometry(7, 0.15, 0.18);

      eb.position.set(0, 0.18, ez);

    for(const ex of [-3.55, 3.55]){
      const ebGeo = new THREE.BoxGeometry(0.18, 0.15, 5.2);
      const eb = new THREE.Mesh(ebGeo, bundMat);
      eb.position.set(ex, 0.18, 0);
      pg.add(eb);
    }
    pg.position.set(s.cx, getTerrainHeight(s.cx, s.cz), s.cz);
    pg.rotation.y = s.rot;
    scene.add(pg);
    if(!window.__villagePos) window.__villagePos = [];
    window.__villagePos.push({x: s.cx, z: s.cz});
  });
  // Vegetable plot near the longhouse — rows of cabbages
  const veg = new THREE.Group();
  for(let r = -2; r <= 2; r++){
    for(let c = -3; c <= 3; c++){
      const cabGeo = new THREE.SphereGeometry(0.22, 8, 6);
      const cabMat = new THREE.MeshLambertMaterial({color: 0x5a8a3a});
      const cab = new THREE.Mesh(cabGeo, cabMat);
      cab.position.set(c * 0.65, 0.2, r * 0.8);
      veg.add(cab);
    }
  }
  // mud ridges
  for(let r = -2; r <= 2; r++){

  const vp = {x: 16, z: 36};
  veg.position.set(vp.x, getTerrainHeight(vp.x, vp.z), vp.z);
  scene.add(veg);
  if(window.__villagePos) window.__villagePos.push(vp);
}

// ─── Water mill (small) on the river ──────────────────────────────
function buildWatermill(){
  const wmg = new THREE.Group();

  const wallTex = TEX.wood.clone(); wallTex.needsUpdate = true;
  wallTex.repeat.set(2, 1);
  const wallGeo = new THREE.BoxGeometry(2.6, 2.4, 2.6);

  wall.castShadow = true;

  wmg.add(base);
  // pagoda-style roof
  buildPagodaRoof(2.1, 0.9, 2.1, wmg, 2.4, 0x2a1808);
  // water wheel (side)
  const wheelGroup = new THREE.Group();
  const wheelRadius = 1.2;
  // outer ring
  const ringGeo = new THREE.TorusGeometry(wheelRadius, 0.08, 6, 16);
  const ringMat = new THREE.MeshLambertMaterial({color: 0x3a2818});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  wheelGroup.add(ring);
  // 8 paddle blades
  for(let i = 0; i < 8; i++){
    const a = (i / 8) * Math.PI * 2;
    const padGeo = new THREE.BoxGeometry(0.06, 0.5, 0.7);
    const pad = new THREE.Mesh(padGeo, ringMat);
    pad.position.set(Math.cos(a) * (wheelRadius - 0.2), Math.sin(a) * (wheelRadius - 0.2), 0);
    pad.rotation.z = a;
    wheelGroup.add(pad);
  }
  // axle
  const axGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 8);
  const axMat = new THREE.MeshLambertMaterial({color: 0x4a3018});
  const ax = new THREE.Mesh(axGeo, axMat);
  ax.rotation.x = Math.PI / 2;
  wheelGroup.add(ax);
  wheelGroup.position.set(1.6, 1.4, 0);
  wheelGroup.rotation.y = Math.PI / 2;
  wmg.add(wheelGroup);
  wmg.userData.wheel = wheelGroup;
  // place on river near segment 5
  const wp = RIVER_PATH[5];
  wmg.position.set(wp.x + 1.5, getTerrainHeight(wp.x + 1.5, wp.z) + 0.3, wp.z);
  wmg.rotation.y = -Math.atan2(RIVER_PATH[6].x - wp.x, RIVER_PATH[6].z - wp.z);
  scene.add(wmg);
  window.__watermill = wmg;
}

// ─── Place builders (custom per location) ──────────────────────────
function createLocation(loc){
  const group = new THREE.Group();
  group.userData = {name: loc.name, en: loc.en, id: loc.id};

  switch(loc.type){
    case "firepit":      buildFirepit(group); break;
    case "library":      buildLibrary(group); break;
    case "torii":        buildTorii(group); break;
    case "road":         buildRoad(group); break;
    case "pond":         buildPond(group); break;
    case "hourglass":    buildHourglassTower(group); break;
    case "hut":          buildRainHut(group); break;
    case "observatory":  buildObservatory(group); break;
  }

  // Label sprite (canvas)
  const canvas = document.createElement('canvas');
  canvas.width = 384; canvas.height = 96;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(10,10,26,.88)';
  ctx.fillRect(0, 24, 384, 56);
  ctx.strokeStyle = '#ffb968'; ctx.lineWidth = 2;
  ctx.strokeRect(0, 24, 384, 56);
  ctx.fillStyle = '#f3e7c4';
  ctx.font = 'bold 30px "Shippori Mincho",serif';
  ctx.textAlign = 'center';
  ctx.fillText(loc.name, 192, 60);
  const labelTex = new THREE.CanvasTexture(canvas);
  const labelMat = new THREE.SpriteMaterial({map: labelTex, transparent: true, opacity: 0.9});
  const label = new THREE.Sprite(labelMat);
  const labelY = (loc.type === "observatory") ? 11
              : (loc.type === "library") ? 8.5
              : (loc.type === "torii") ? 7.5
              : (loc.type === "hut") ? 6.5
              : 5;
  label.position.y = labelY;
  label.scale.set(6.5, 1.6, 1);
  label.userData = {isLabel: true};
  group.add(label);

  group.position.set(loc.x, getTerrainHeight(loc.x, loc.z), loc.z);
  scene.add(group);
  clickableObjects.push(group);
}

// 焚き火 — 石の炉 + 薪 + 周りの丸太椅子
function buildFirepit(group){
  // ground hollow (slightly darker disc)
  const baseGeo = new THREE.CircleGeometry(2.4, 24);
  const baseMat = new THREE.MeshLambertMaterial({color: 0x2a201a});
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.rotation.x = -Math.PI / 2; base.position.y = 0.05;
  base.receiveShadow = true;
  group.add(base);
  // stones in circle
  for(let i = 0; i < 10; i++){
    const angle = (i / 10) * Math.PI * 2;
    const w = 0.4 + hash(i, 0, 7) * 0.2;
    const stoneGeo = new THREE.BoxGeometry(w, 0.45, w * 0.85);
    const stoneMat = new THREE.MeshLambertMaterial({color: 0x6a6a5a});
    const stone = new THREE.Mesh(stoneGeo, stoneMat);
    stone.position.set(Math.cos(angle) * 1.85, 0.23, Math.sin(angle) * 1.85);
    stone.rotation.y = hash(i, 1, 7) * Math.PI;
    stone.castShadow = true;
    group.add(stone);
  }
  // logs (crossed)
  const logMat = new THREE.MeshLambertMaterial({color: 0x4a2818});
  for(let i = 0; i < 3; i++){
    const logGeo = new THREE.CylinderGeometry(0.16, 0.16, 2.4, 8);
    const log = new THREE.Mesh(logGeo, logMat);
    log.rotation.z = Math.PI/2;
    log.rotation.y = (i / 3) * Math.PI;
    log.position.y = 0.3 + i * 0.08;
    log.castShadow = true;
    group.add(log);
  }
  // flame group
  const flameGroup = new THREE.Group();
  flameGroup.position.y = 0.4;
  group.add(flameGroup);
  group.userData.flame = flameGroup;

  const flameGeo1 = new THREE.ConeGeometry(0.7, 1.7, 8);
  const flameMat1 = new THREE.MeshBasicMaterial({color: 0xff7a30, transparent: true, opacity: 0.85, fog: false});
  const flame1 = new THREE.Mesh(flameGeo1, flameMat1);
  flame1.position.y = 0.85;
  flameGroup.add(flame1);

  const flameGeo2 = new THREE.ConeGeometry(0.42, 1.1, 8);
  const flameMat2 = new THREE.MeshBasicMaterial({color: 0xfff2c0, transparent: true, opacity: 0.95, fog: false});
  const flame2 = new THREE.Mesh(flameGeo2, flameMat2);
  flame2.position.y = 0.7;
  flameGroup.add(flame2);

  // sparks (instanced via small spheres)
  const sparks = [];
  for(let i = 0; i < 8; i++){
    const sparkGeo = new THREE.SphereGeometry(0.08, 6, 6);
    const sparkMat = new THREE.MeshBasicMaterial({color: 0xffd970, transparent: true, opacity: 0.8, fog: false});
    const sp = new THREE.Mesh(sparkGeo, sparkMat);
    sp.userData = {offset: i * 0.3, baseY: 1.5, vx: (Math.random() - 0.5) * 0.4, vz: (Math.random() - 0.5) * 0.4};
    sp.position.set(sp.userData.vx, sp.userData.baseY, sp.userData.vz);
    flameGroup.add(sp);
    sparks.push(sp);
  }
  group.userData.sparks = sparks;
  // warm fire light
  const fireLight = new THREE.PointLight(0xff7a30, 1.7, 14);
  fireLight.position.y = 1.4;
  group.add(fireLight);
  group.userData.fireLight = fireLight;

  // 丸太椅子 (3 log seats around the fire)
  const logSeatMat = new THREE.MeshLambertMaterial({color: 0x5a3818});
  for(let i = 0; i < 3; i++){
    const ang = (i / 3) * Math.PI * 2 + 0.3;
    const sx = Math.cos(ang) * 3.0;
    const sz = Math.sin(ang) * 3.0;
    const logGeo = new THREE.CylinderGeometry(0.32, 0.38, 1.2, 10);
    const logSeat = new THREE.Mesh(logGeo, logSeatMat);
    logSeat.position.set(sx, 0.6, sz);
    logSeat.rotation.x = Math.PI / 2;
    logSeat.rotation.y = ang + Math.PI / 2;
    logSeat.castShadow = true;
    group.add(logSeat);
    // rings on the log ends
    const ringEnd = new THREE.Mesh(
      new THREE.CircleGeometry(0.32, 12),
      new THREE.MeshLambertMaterial({color: 0x7a4a28})
    );
    ringEnd.position.set(sx + Math.cos(ang + Math.PI/2) * 0.6,
                         0.6,
                         sz + Math.sin(ang + Math.PI/2) * 0.6);
    ringEnd.rotation.y = ang + Math.PI / 2;
    group.add(ringEnd);
  }
}

// Curved pagoda roof (with upturned eaves) from a custom BufferGeometry
function buildPagodaRoof(width, height, depth, group, y, color = 0x2a1808){
  // 4-sided slope with upturned corners
  const w = width, d = depth, h = height;
  const vs = [
    // top peak
    [0, h, 0],
    // mid corners (outer + slight lift)
    [w*0.6, h*0.7, d*0.6], [-w*0.6, h*0.7, d*0.6],
    [-w*0.6, h*0.7, -d*0.6], [w*0.6, h*0.7, -d*0.6],
    // lower outer corners (eaves uplifted)
    [w, h*0.18, d], [-w, h*0.18, d],
    [-w, h*0.18, -d], [w, h*0.18, -d],
    // edge midpoints (lower)
    [w*1.05, h*0.05, 0], [0, h*0.05, d*1.05],
    [-w*1.05, h*0.05, 0], [0, h*0.05, -d*1.05],
  ];
  const idx = [
    // four panels (peak → mid → corner)
    0,1,2,  0,2,3,  0,3,4,  0,4,1,
    // eaves panels
    1,5,10, 2,10,6,
    2,6,11, 3,11,7,
    3,7,12, 4,12,8,
    4,8,9,  1,9,5,
  ];
  const positions = new Float32Array(vs.length * 3);
  vs.forEach((v, i) => { positions[i*3]=v[0]; positions[i*3+1]=v[1]; positions[i*3+2]=v[2]; });
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setIndex(idx);
  geom.computeVertexNormals();
  const roofTex = TEX.roof.clone(); roofTex.needsUpdate = true;
  const roofMat = new THREE.MeshLambertMaterial({map: roofTex, color: color});
  const roof = new THREE.Mesh(geom, roofMat);
  roof.position.y = y;
  roof.castShadow = true;
  group.add(roof);
  // ridge cap
  const ridgeGeo = new THREE.BoxGeometry(0.18, 0.12, 0.18);
  const ridgeMat = new THREE.MeshLambertMaterial({color: 0x1a0a04});
  const ridgeRoot = new THREE.Mesh(ridgeGeo, ridgeMat);
  ridgeRoot.position.y = y + h * 0.95;
  group.add(ridgeRoot);
  return roof;
}

// 月光の書架 — 五重塔 (5-tier Japanese pagoda)
function buildLibrary(group){
  // stone base platform
  const baseGeo = new THREE.BoxGeometry(6.5, 0.4, 6.5);
  const baseMat = new THREE.MeshLambertMaterial({map: TEX.stone});
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.2;
  base.castShadow = base.receiveShadow = true;
  group.add(base);
  // base steps
  const step2Geo = new THREE.BoxGeometry(7.5, 0.2, 7.5);
  const step2 = new THREE.Mesh(step2Geo, baseMat);
  step2.position.y = 0.05;
  step2.receiveShadow = true;
  group.add(step2);

  // 5 tiers of pagoda
  const tiers = 5;
  let curY = 0.4;
  for(let f = 0; f < tiers; f++){
    const w = 4.2 - f * 0.45;
    const h = 1.5 - f * 0.05;
    // wall — wooden box
    const wallTex = TEX.woodDark.clone();
    wallTex.needsUpdate = true;
    wallTex.repeat.set(1.2, 0.5);
    const wallGeo = new THREE.BoxGeometry(w, h, w);
    const wallMat = new THREE.MeshLambertMaterial({map: wallTex});
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.y = curY + h / 2;
    wall.castShadow = wall.receiveShadow = true;
    group.add(wall);

    // window slots glowing (1 per face)
    if(f < tiers - 1){
      for(let side = 0; side < 4; side++){
        const ang = side * Math.PI / 2;
        const winGeo = new THREE.BoxGeometry(w * 0.4, h * 0.45, 0.08);
        const winMat = new THREE.MeshLambertMaterial({
          color: 0xffcc70, emissive: 0xffaa40, emissiveIntensity: 0.65,
        });
        const win = new THREE.Mesh(winGeo, winMat);
        win.position.set(
          Math.cos(ang) * (w/2 + 0.04),
          curY + h * 0.55,
          Math.sin(ang) * (w/2 + 0.04)
        );
        win.rotation.y = ang;
        group.add(win);
        // window lattice
        for(let k = -1; k <= 1; k++){
          const latGeo = new THREE.BoxGeometry(0.05, h * 0.45, 0.02);
          const latMat = new THREE.MeshLambertMaterial({color: 0x2a1808});
          const lat = new THREE.Mesh(latGeo, latMat);
          lat.position.set(
            Math.cos(ang) * (w/2 + 0.09) + Math.sin(ang) * (k * w * 0.08),
            curY + h * 0.55,
            Math.sin(ang) * (w/2 + 0.09) - Math.cos(ang) * (k * w * 0.08)
          );
          lat.rotation.y = ang;
          group.add(lat);
        }
      }
    }

    // curved pagoda roof
    buildPagodaRoof(w * 0.85, 0.7, w * 0.85, group, curY + h, 0x2a1808);

    // corner pendants (small bells under eaves)
    for(let cx = -1; cx <= 1; cx += 2){
      for(let cz = -1; cz <= 1; cz += 2){
        const pendGeo = new THREE.ConeGeometry(0.06, 0.18, 6);
        const pendMat = new THREE.MeshLambertMaterial({
          color: 0xc89a5a, emissive: 0x6a3818, emissiveIntensity: 0.3,
        });
        const pend = new THREE.Mesh(pendGeo, pendMat);
        pend.position.set(cx * w * 0.85, curY + h - 0.15, cz * w * 0.85);
        pend.rotation.x = Math.PI;
        group.add(pend);
      }
    }
    curY += h + 0.5;  // add roof height
  }

  // sourin (top finial) — 5 rings
  const sourinBaseGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.6, 8);
  const sourinMat = new THREE.MeshLambertMaterial({
    color: 0xc89a5a, emissive: 0x6a3818, emissiveIntensity: 0.4,
  });
  const sourin = new THREE.Mesh(sourinBaseGeo, sourinMat);
  sourin.position.y = curY + 0.8;
  group.add(sourin);
  for(let i = 0; i < 5; i++){
    const ringGeo = new THREE.TorusGeometry(0.18 - i * 0.02, 0.025, 6, 12);
    const ring = new THREE.Mesh(ringGeo, sourinMat);
    ring.position.y = curY + 0.3 + i * 0.2;
    ring.rotation.x = Math.PI / 2;
    group.add(ring);
  }
  // top hoju (sacred jewel)
  const hojuGeo = new THREE.SphereGeometry(0.12, 8, 8);
  const hojuMat = new THREE.MeshLambertMaterial({
    color: 0xffd970, emissive: 0xffd970, emissiveIntensity: 0.7,
  });
  const hoju = new THREE.Mesh(hojuGeo, hojuMat);
  hoju.position.y = curY + 1.7;
  group.add(hoju);

  // stone lanterns flanking the entrance
  const lan1 = buildStoneLantern();
  lan1.position.set(3.5, 0, 3.5);
  group.add(lan1);
  const lan2 = buildStoneLantern();
  lan2.position.set(-3.5, 0, 3.5);
  group.add(lan2);

  return;  // skip old library code below

  // (legacy code below is unreachable)
  for(let f = 0; f < 3; f++){
    const w = 4.6 - f * 0.6;
    const wallGeo = new THREE.BoxGeometry(w, 2.0, w);
    const wallTex = TEX.woodDark.clone();
    wallTex.needsUpdate = true;
    wallTex.repeat.set(1.5, 0.6);
    const wallMat = new THREE.MeshLambertMaterial({map: wallTex});
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.y = 1.5 + f * 2.4;
    wall.castShadow = wall.receiveShadow = true;
    group.add(wall);
    // book spines on each face
    for(let side = 0; side < 4; side++){
      const ang = side * Math.PI / 2;
      for(let b = 0; b < 10; b++){
        const bookW = 0.18 + hash(f, b+side, 5) * 0.16;
        const bookH = 1.0 + hash(b, f+side, 5) * 0.6;
        const bookGeo = new THREE.BoxGeometry(bookW, bookH, 0.18);
        const bookColors = [0x8a6a4a, 0xc28a4a, 0x7a4a4a, 0x6a8a5a, 0xc5a070, 0xa86a4a];
        const bc = bookColors[Math.floor(hash(f, b*2+side, 9) * bookColors.length)];
        const bookMat = new THREE.MeshLambertMaterial({color: bc});
        const book = new THREE.Mesh(bookGeo, bookMat);
        const offset = (b - 4.5) * (w * 0.85 / 10);
        book.position.set(
          Math.cos(ang) * (w/2 + 0.1) + Math.sin(ang) * offset,
          1.5 + f * 2.4 + (hash(b, f, 11) - 0.5) * 0.2,
          Math.sin(ang) * (w/2 + 0.1) - Math.cos(ang) * offset
        );
        book.rotation.y = ang + Math.PI/2;
        group.add(book);
      }
    }
    // roof slab — sloped tile pyramid
    const slabRoofGeo = new THREE.ConeGeometry(w * 0.78, 0.6, 4);
    const slabRoofTex = TEX.roof.clone();
    slabRoofTex.needsUpdate = true;
    const slabMat = new THREE.MeshLambertMaterial({map: slabRoofTex});
    const slab = new THREE.Mesh(slabRoofGeo, slabMat);
    slab.position.y = 2.8 + f * 2.4;
    slab.rotation.y = Math.PI / 4;
    slab.castShadow = true;
    group.add(slab);
  }
  // Top lantern
  const topLanGeo = new THREE.BoxGeometry(0.9, 1.2, 0.9);
  const topLanMat = new THREE.MeshLambertMaterial({
    color: 0xffcc70, emissive: 0xffaa40, emissiveIntensity: 0.7,
  });
  const topLan = new THREE.Mesh(topLanGeo, topLanMat);
  topLan.position.y = 9.2;
  group.add(topLan);

// 水辺の岸 — 太鼓橋 + 池 + 蓮 + 石灯籠
function buildPond(group){
  // ── 太鼓橋 (arched red bridge over the pond) ──
  const red = 0xb04030;
  const bridgeMat = new THREE.MeshLambertMaterial({color: red});
  // arched deck (segments)
  const segments = 9;
  for(let i = 0; i < segments; i++){
    const t = (i / (segments - 1)) - 0.5;
    const x = t * 8;
    const y = 0.6 + Math.cos(t * Math.PI) * 1.0;  // arch profile
    const segGeo = new THREE.BoxGeometry(1.0, 0.18, 1.6);
    const seg = new THREE.Mesh(segGeo, bridgeMat);
    seg.position.set(x, y, 5);
    seg.rotation.z = -t * 0.6;
    seg.castShadow = seg.receiveShadow = true;
    group.add(seg);
    // railing posts on each side
    if(i % 2 === 0){
      for(const dz of [0.8, -0.8]){
        const postGeo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
        const post = new THREE.Mesh(postGeo, bridgeMat);
        post.position.set(x, y + 0.4, 5 + dz);
        group.add(post);
        // giboshi (ornamental top) — small onion shape
        const gibGeo = new THREE.SphereGeometry(0.1, 8, 6);
        const gib = new THREE.Mesh(gibGeo, bridgeMat);
        gib.position.set(x, y + 0.75, 5 + dz);
        group.add(gib);
      }
    }
  }
  // bridge railings (continuous)
  const railGeo = new THREE.BoxGeometry(8, 0.08, 0.08);
  for(const dz of [0.8, -0.8]){
    const rail = new THREE.Mesh(railGeo, bridgeMat);
    rail.position.set(0, 1.4, 5 + dz);
    rail.geometry = new THREE.BoxGeometry(8, 0.08, 0.08);
    group.add(rail);
  }
  // ── 池 (water) ──
  const pondGeo = new THREE.CircleGeometry(4.0, 48);
  const pondMat = new THREE.MeshLambertMaterial({
    color: 0x4a7090, transparent: true, opacity: 0.78,
    emissive: 0x223040, emissiveIntensity: 0.4,
  });
  const pond = new THREE.Mesh(pondGeo, pondMat);
  pond.rotation.x = -Math.PI / 2; pond.position.y = 0.02;
  group.add(pond);
  group.userData.water = pond;
  // ripple rings
  for(let i = 0; i < 3; i++){
    const ringGeo = new THREE.RingGeometry(0.5 + i * 0.4, 0.55 + i * 0.4, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xaadcf0, transparent: true, opacity: 0.4, side: THREE.DoubleSide, fog: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.04;
    ring.userData = {phase: i * 1.2};
    group.add(ring);
  }
  group.userData.ripples = group.children.filter(c => c.geometry instanceof THREE.RingGeometry);
  // stones around
  for(let i = 0; i < 8; i++){
    const angle = (i / 8) * Math.PI * 2;
    const rockGeo = new THREE.DodecahedronGeometry(0.35 + hash(i, 5) * 0.25);
    const rockMat = new THREE.MeshLambertMaterial({color: 0x6a6258});
    const rock = new THREE.Mesh(rockGeo, rockMat);
    rock.position.set(Math.cos(angle) * 3.6, 0.18, Math.sin(angle) * 3.6);
    rock.rotation.set(hash(i, 6)*2, hash(i, 7)*2, hash(i, 8)*2);
    rock.castShadow = true;
    group.add(rock);
  }
  // 蓮の葉 (lily pads on water)
  for(let i = 0; i < 6; i++){
    const lilyGeo = new THREE.CircleGeometry(0.4 + Math.random() * 0.2, 12);
    const lilyMat = new THREE.MeshLambertMaterial({
      color: 0x3a6a4a, side: THREE.DoubleSide,
    });
    const lily = new THREE.Mesh(lilyGeo, lilyMat);
    const angle = Math.random() * Math.PI * 2;
    const dist = 1.0 + Math.random() * 2.4;
    lily.position.set(Math.cos(angle) * dist, 0.06, Math.sin(angle) * dist);
    lily.rotation.x = -Math.PI / 2;
    group.add(lily);
  }
  // 蓮の花
  for(let i = 0; i < 3; i++){
    const flowerGeo = new THREE.SphereGeometry(0.18, 8, 6);
    const flowerMat = new THREE.MeshLambertMaterial({
      color: 0xffc0d0, emissive: 0xff80a0, emissiveIntensity: 0.2,
    });
    const flower = new THREE.Mesh(flowerGeo, flowerMat);
    const angle = Math.random() * Math.PI * 2;
    const dist = 1.4 + Math.random() * 1.8;
    flower.position.set(Math.cos(angle) * dist, 0.18, Math.sin(angle) * dist);
    group.add(flower);
  }
  // 石灯籠 (proper toro)
  const toro = buildStoneLantern();
  toro.position.set(-3.4, 0, 1.8);
  group.add(toro);
  const toro2 = buildStoneLantern();
  toro2.position.set(-3.6, 0, -1.5);
  group.add(toro2);
  // small reflection light
  const pondLight = new THREE.PointLight(0x60a0c0, 0.5, 10);
  pondLight.position.set(0, 1.5, 0);
  group.add(pondLight);
}

// 雨音の部屋
function buildRainHut(group){
  // walls (textured wood)
  const wallW = 3.4, wallH = 3.2, wallD = 3.4;
  const wallTex = TEX.wood.clone();
  wallTex.needsUpdate = true;
  wallTex.repeat.set(2, 1);
  const wallGeo = new THREE.BoxGeometry(wallW, wallH, wallD);
  const wallMat = new THREE.MeshLambertMaterial({map: wallTex});
  const walls = new THREE.Mesh(wallGeo, wallMat);
  walls.position.y = wallH / 2;
  walls.castShadow = walls.receiveShadow = true;
  group.add(walls);

  // foundation stones
  const baseGeo = new THREE.BoxGeometry(wallW + 0.3, 0.3, wallD + 0.3);
  const baseMat = new THREE.MeshLambertMaterial({map: TEX.stone});
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.15;
  base.receiveShadow = true;
  group.add(base);

  // chimney with smoke
  const chimGeo = new THREE.BoxGeometry(0.5, 1.8, 0.5);
  const chimMat = new THREE.MeshLambertMaterial({map: TEX.stone});
  const chim = new THREE.Mesh(chimGeo, chimMat);
  chim.position.set(-wallW * 0.25, wallH + 0.9, -wallD * 0.25);
  chim.castShadow = true;
  group.add(chim);
  // smoke from chimney
  group.userData.smoke = [];
  for(let i = 0; i < 5; i++){
    const sMat = new THREE.SpriteMaterial({
      map: TEX.smoke, transparent: true, opacity: 0.5,
      depthWrite: false, fog: false,
    });
    const sp = new THREE.Sprite(sMat);
    sp.scale.set(1.5, 1.5, 1);
    sp.position.set(-wallW * 0.25, wallH + 2 + i * 0.6, -wallD * 0.25);
    sp.userData = {phase: i * 0.8, baseY: wallH + 2};
    group.add(sp);
    group.userData.smoke.push(sp);
  }
  // window
  const winGeo = new THREE.BoxGeometry(1.0, 1.0, 0.08);
  const winMat = new THREE.MeshLambertMaterial({
    color: 0xffcc70, emissive: 0xffaa40, emissiveIntensity: 0.8,
  });
  const win = new THREE.Mesh(winGeo, winMat);
  win.position.set(0, wallH * 0.55, wallD / 2 + 0.06);
  group.add(win);
  // window cross
  const xv = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.0, 0.02),
    new THREE.MeshLambertMaterial({color: 0x2a1a10}));
  xv.position.set(0, wallH * 0.55, wallD / 2 + 0.12); group.add(xv);
  const xh = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 0.02),
    new THREE.MeshLambertMaterial({color: 0x2a1a10}));
  xh.position.set(0, wallH * 0.55, wallD / 2 + 0.12); group.add(xh);
  // door
  const doorGeo = new THREE.BoxGeometry(0.9, 1.8, 0.08);
  const doorMat = new THREE.MeshLambertMaterial({color: 0x3a2818});
  const door = new THREE.Mesh(doorGeo, doorMat);
  door.position.set(-1.0, 0.9, wallD / 2 + 0.05);
  group.add(door);
  // roof — textured pyramid
  const roofTex = TEX.roof.clone();
  roofTex.needsUpdate = true;
  roofTex.repeat.set(1, 1);
  const roofGeo = new THREE.ConeGeometry(wallW * 0.85, wallH * 0.65, 4);
  const roofMat = new THREE.MeshLambertMaterial({map: roofTex});
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = wallH + wallH * 0.32;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  group.add(roof);
  // roof ridge
  const ridgeGeo = new THREE.BoxGeometry(0.12, 0.12, wallW * 1.6);
  const ridgeMat = new THREE.MeshLambertMaterial({color: 0x2a1808});
  const ridge = new THREE.Mesh(ridgeGeo, ridgeMat);
  ridge.position.y = wallH + wallH * 0.65;
  group.add(ridge);
  // rain drops (lines)
  const rainGroup = new THREE.Group();
  group.add(rainGroup);
  group.userData.rain = rainGroup;
  for(let i = 0; i < 40; i++){
    const dropGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 4);
    const dropMat = new THREE.MeshBasicMaterial({color: 0xaadcf0, transparent: true, opacity: 0.55, fog: false});
    const drop = new THREE.Mesh(dropGeo, dropMat);
    drop.position.set(
      (Math.random() - 0.5) * 5,
      6 + Math.random() * 4,
      (Math.random() - 0.5) * 5
    );
    drop.userData = {speed: 0.2 + Math.random() * 0.15, init: drop.position.y};
    rainGroup.add(drop);
  }
  // warm window light
  const winLight = new THREE.PointLight(0xffaa40, 0.7, 8);
  winLight.position.set(0, 2.4, wallD / 2 + 1);
  group.add(winLight);
}

// 星見台 — 物見櫓 (3-story watchtower / yagura)
function buildObservatory(group){
  // stone foundation
  const foundGeo = new THREE.BoxGeometry(3.5, 0.4, 3.5);
  const foundMat = new THREE.MeshLambertMaterial({map: TEX.stone});
  const found = new THREE.Mesh(foundGeo, foundMat);
  found.position.y = 0.2;
  found.castShadow = found.receiveShadow = true;
  group.add(found);
  // 4 corner pillars going up to top
  const pillarMat = new THREE.MeshLambertMaterial({color: 0x4a3018});
  const totalH = 7.5;
  for(const cx of [-1.4, 1.4]){
    for(const cz of [-1.4, 1.4]){
      const pillarGeo = new THREE.BoxGeometry(0.2, totalH, 0.2);
      const pillar = new THREE.Mesh(pillarGeo, pillarMat);
      pillar.position.set(cx, 0.4 + totalH / 2, cz);
      pillar.castShadow = true;
      group.add(pillar);
    }
  }
  // 3 floors (boxes inside the pillars)
  const woodTex = TEX.wood.clone(); woodTex.needsUpdate = true;
  for(let f = 0; f < 3; f++){
    const fy = 0.4 + f * 2.3 + 1.1;
    const w = 2.6 - f * 0.15;
    // floor
    const flGeo = new THREE.BoxGeometry(w + 0.2, 0.18, w + 0.2);
    const flMat = new THREE.MeshLambertMaterial({color: 0x6a4828});
    const fl = new THREE.Mesh(flGeo, flMat);
    fl.position.set(0, fy - 1.1, 0);
    group.add(fl);
    // upper floor walls (slats)
    if(f < 3){
      for(let side = 0; side < 4; side++){
        const ang = side * Math.PI / 2;
        const wallGeo = new THREE.BoxGeometry(w, 1.2, 0.08);
        const wallMat = new THREE.MeshLambertMaterial({map: woodTex});
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(
          Math.cos(ang) * (w / 2 + 0.05),
          fy - 0.4,
          Math.sin(ang) * (w / 2 + 0.05)
        );
        wall.rotation.y = ang;
        group.add(wall);
      }
    }
    // railing
    const railGeo = new THREE.BoxGeometry(w + 0.4, 0.04, 0.04);
    const railMat = new THREE.MeshLambertMaterial({color: 0x3a2818});
    for(let side = 0; side < 4; side++){
      const ang = side * Math.PI / 2;
      const rail = new THREE.Mesh(railGeo, railMat);
      rail.position.set(
        Math.cos(ang) * (w / 2 + 0.1),
        fy - 1.0 + 0.5,
        Math.sin(ang) * (w / 2 + 0.1)
      );
      rail.rotation.y = ang;
      group.add(rail);
    }
  }
  // observation top with curved pagoda roof
  buildPagodaRoof(2.6, 1.4, 2.6, group, 7.0, 0x2a1808);
  // sourin
  const sourinGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.8, 8);
  const sourinMat = new THREE.MeshLambertMaterial({
    color: 0xc89a5a, emissive: 0x6a3818, emissiveIntensity: 0.4,
  });
  const sourin = new THREE.Mesh(sourinGeo, sourinMat);
  sourin.position.y = 8.5;
  group.add(sourin);
  // telescope on top floor
  const teleGeo = new THREE.CylinderGeometry(0.14, 0.14, 1.8, 12);
  const teleMat = new THREE.MeshLambertMaterial({color: 0x2a1a10});
  const tele = new THREE.Mesh(teleGeo, teleMat);
  tele.position.set(0.2, 6.6, 0.4);
  tele.rotation.z = Math.PI / 5;
  tele.rotation.y = Math.PI / 6;
  group.add(tele);
  // lens flare
  const lensGeo = new THREE.SphereGeometry(0.15, 8, 8);
  const lensMat = new THREE.MeshBasicMaterial({color: 0xfff8d8, fog: false});
  const lens = new THREE.Mesh(lensGeo, lensMat);
  lens.position.set(1.0, 7.1, 0.4);
  group.add(lens);
  // stone lanterns at base
  const lan1 = buildStoneLantern(); lan1.position.set(2.4, 0, 2.4); group.add(lan1);
  const lan2 = buildStoneLantern(); lan2.position.set(-2.4, 0, 2.4); group.add(lan2);
  // ladder/stairs leading up
  for(let i = 0; i < 8; i++){
    const stairGeo = new THREE.BoxGeometry(1.0, 0.12, 0.3);
    const stairMat = new THREE.MeshLambertMaterial({color: 0x4a3818});
    const stair = new THREE.Mesh(stairGeo, stairMat);
    stair.position.set(2.5 + i * 0.18, 0.1 + i * 0.18, 0);
    stair.castShadow = true;
    group.add(stair);
  }
}

function createTree(x, z){
  const idx = Math.floor(hash(x, z, 1) * TEX.trees.length);

    map: TEX.trees[idx],

  sprite.position.set(x, ty + scale / 2, z);

  scene.add(sprite);
}

function createPathLantern(x, z){
