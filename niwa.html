<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ===========================================================
 *  心の庭 — 9 compact dioramas, scene-switched
 * =========================================================== */

const SCENE_RADIUS = 12;       // each diorama is a 24m disc, framed in view
const SCENE_BOUND = 11;        // avatar can walk up to this radius

const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#bcd6e2', 26, 70);

/* Loader bar helper */
let loadProgress = 0;
function setLoad(p, label){
  loadProgress = Math.max(loadProgress, p);
  const el = document.getElementById('loadbar');
  const pct = document.getElementById('loadpct');
  if(el) el.style.width = (loadProgress*100).toFixed(0)+'%';
  if(pct) pct.textContent = (label||'LOADING') + ' · ' + (loadProgress*100).toFixed(0)+'%';
}
setLoad(0.05, 'INIT');
setTimeout(()=>{
  const sp = document.getElementById('splash');
  if(sp && !sp.classList.contains('hidden')){ sp.classList.add('hidden'); }
}, 12000);
window.addEventListener('error', e=>{
  const pct = document.getElementById('loadpct');
  if(pct) pct.textContent = 'ERR · ' + (e.message||'unknown').slice(0,40);
});

/* Orthographic camera (quarter-view) ====================== */
function makeOrthoCam(){
  const aspect = window.innerWidth/window.innerHeight;
  const s = 13.5;  // vertical half-size in world units (controls framing)
  const c = new THREE.OrthographicCamera(-s*aspect, s*aspect, s, -s, 0.1, 200);
  c.position.set(20, 22, 20);
  c.lookAt(0, 1.2, 0);
  return c;
}
let camera = makeOrthoCam();

/* Lighting ================================================ */
const sun = new THREE.DirectionalLight(0xfff4d0, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = -16;
sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16;
sun.shadow.camera.bottom = -16;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xa8d4e8, 0x6a5a3a, 0.6);
scene.add(hemi);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.22);
scene.add(ambientLight);

const moon = new THREE.DirectionalLight(0xa0c0e8, 0.0);
moon.position.set(-12, 14, -10);
scene.add(moon);

/* Sky (atmospheric scattering) ============================ */
const sky = new Sky();
sky.scale.setScalar(450);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 4;
skyU.rayleigh.value = 2;
skyU.mieCoefficient.value = 0.005;
skyU.mieDirectionalG.value = 0.85;

const sunSph = new THREE.Vector3();
function setSun(elev, azim){
  const phi = THREE.MathUtils.degToRad(90 - elev);
  const theta = THREE.MathUtils.degToRad(azim);
  sunSph.setFromSphericalCoords(1, phi, theta);
  skyU.sunPosition.value.copy(sunSph);
  sun.position.set(sunSph.x*22, Math.max(2, sunSph.y*22), sunSph.z*22);
}
setSun(50, -25);

/* Material helpers ======================================== */
function mat(hex, opts={}){
  return new THREE.MeshStandardMaterial({
    color: hex, roughness: 0.85, metalness: 0.03, envMapIntensity: 0.9, ...opts
  });
}

setLoad(0.18, 'LIGHTING');

/* Procedural canvas textures ============================== */
function makeNoiseCanvas(w, h, fn){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w,h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i = (y*w+x)*4;
    const [r,g,b] = fn(x,y);
    img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  return c;
}
function noise(x,y,s=1){
  return (Math.sin(x*0.137*s + y*0.231*s) + Math.sin(x*0.31*s + y*0.13*s)*0.7 + Math.sin(x*0.6*s)*0.4)*0.5+0.5;
}
function tex(canvas, repeat=4, srgb=true){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat,repeat);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const GRASS_TEX = tex(makeNoiseCanvas(256,256,(x,y)=>{
  const n = noise(x,y,2.2);
  return [80+n*45, 130+n*55, 55+n*30];
}), 6);
const DIRT_TEX = tex(makeNoiseCanvas(256,256,(x,y)=>{
  const n = noise(x,y,2.4);
  return [140+n*40, 100+n*30, 70+n*20];
}), 6);
const STONE_TEX = tex(makeNoiseCanvas(256,256,(x,y)=>{
  const n = noise(x,y,3.0);
  return [170+n*40, 165+n*38, 150+n*30];
}), 4);
const SAND_TEX = tex(makeNoiseCanvas(256,256,(x,y)=>{
  const n = noise(x,y,3.2);
  return [220+n*25, 200+n*22, 160+n*20];
}), 4);
const MOSS_TEX = tex(makeNoiseCanvas(256,256,(x,y)=>{
  const n = noise(x,y,2.8);
  return [70+n*30, 110+n*40, 50+n*25];
}), 6);
const WOOD_TEX = tex((()=>{
  // wood plank canvas
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#9b6a3e'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<24;i++){
    ctx.fillStyle = `rgba(${60+Math.random()*40},${40+Math.random()*30},${20+Math.random()*20},${0.45+Math.random()*0.3})`;
    ctx.fillRect(0, i*11 + Math.random()*2, 256, 1.5);
  }
  for(let i=0;i<6;i++){
    ctx.fillStyle = `rgba(${30+Math.random()*30},${20+Math.random()*20},${10},0.55)`;
    ctx.fillRect(Math.random()*256, 0, 1.5, 256);
  }
  return c;
})(), 1);
WOOD_TEX.repeat.set(2, 1);

setLoad(0.28, 'TEXTURES');

/* Terrain disc builder ==================================== */
function terrainDisc(radius, heightFn, paletteFn, mapTex){
  const seg = 96;
  const g = new THREE.CircleGeometry(radius, seg);
  g.rotateX(-Math.PI/2);
  // subdivide more for height detail
  const dense = new THREE.PlaneGeometry(radius*2, radius*2, 80, 80);
  dense.rotateX(-Math.PI/2);
  const pos = dense.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const tmpC = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const r = Math.hypot(x,z);
    // soften height near boundary
    const taper = THREE.MathUtils.clamp(1.0 - (r/radius - 0.85)*5, 0, 1);
    pos.setY(i, (heightFn(x,z))*taper);
    paletteFn(x, z, pos.getY(i), r, tmpC);
    colors[i*3]   = tmpC.r;
    colors[i*3+1] = tmpC.g;
    colors[i*3+2] = tmpC.b;
  }
  pos.needsUpdate = true;
  dense.computeVertexNormals();
  dense.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  // discard verts outside disc by alpha-clipping via shader-friendly trick:
  // simply taper alpha — but for simplicity, just leave a square plane and clip with circle ring on top
  const m = new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors:true, map: mapTex || GRASS_TEX,
    roughness: 1.0, metalness: 0.0, envMapIntensity: 0.7
  });
  const mesh = new THREE.Mesh(dense, m);
  mesh.receiveShadow = true;
  return mesh;
}

/* Procedural builders (proven from v71) =================== */
function curvedRoof(radius, depth, color){
  const pts = [];
  const N = 10;
  for(let i=0;i<=N;i++){
    const t = i/N;
    pts.push(new THREE.Vector2(radius*(1-t*t*0.6), t*depth + Math.sin(t*Math.PI)*depth*0.15));
  }
  const g = new THREE.LatheGeometry(pts, 4);
  const mesh = new THREE.Mesh(g, mat(color));
  mesh.rotation.y = Math.PI/4;
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

function makePagoda(){
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.4, 3.4), mat(0x7a6f56));
  base.position.y = 0.2; base.castShadow=base.receiveShadow=true; g.add(base);
  const tierColors = [0xb04030, 0xa53a26, 0x9c331f, 0x8a2a18];
  const sizes = [2.6, 2.1, 1.6, 1.1];
  let y = 0.4;
  for(let i=0;i<4;i++){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(sizes[i], 0.9, sizes[i]), mat(tierColors[i]));
    wall.position.y = y + 0.45; wall.castShadow=wall.receiveShadow=true; g.add(wall);

// Stone grouping (石組): triadic — tall (主石) + mid (副石) + flat (添石)
function makeStoneGroup(rnd = Math.random){
  const g = new THREE.Group();
  const stoneA = mat(0x8a8067, {roughness:0.95});
  const stoneB = mat(0x6a6050, {roughness:0.95});
  const stoneC = mat(0xa49880, {roughness:0.95});
  // 主石 (tall vertical)
  const tall = new THREE.Mesh(new THREE.ConeGeometry(0.35+rnd()*0.1, 1.2+rnd()*0.4, 6+Math.floor(rnd()*3)), stoneA);
  tall.position.set(0, 0.55, 0);
  tall.rotation.set((rnd()-0.5)*0.4, rnd()*Math.PI, (rnd()-0.5)*0.3);
  tall.scale.set(1, 1, 0.85);
  tall.castShadow = tall.receiveShadow = true;
  g.add(tall);
  // 副石 (medium, slightly behind)
  const mid = new THREE.Mesh(new THREE.DodecahedronGeometry(0.42+rnd()*0.1, 0), stoneB);
  mid.position.set(0.55+rnd()*0.2, 0.35, -0.3+rnd()*0.2);
  mid.rotation.set(rnd()*Math.PI, rnd()*Math.PI, rnd()*Math.PI);
  mid.scale.set(1, 0.75, 1.1);
  mid.castShadow = mid.receiveShadow = true;
  g.add(mid);
  // 添石 (flat, in front)
  const flat = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35+rnd()*0.08, 0), stoneC);
  flat.position.set(-0.45+rnd()*0.2, 0.15, 0.5+rnd()*0.2);
  flat.rotation.set(rnd()*Math.PI*0.5, rnd()*Math.PI, rnd()*Math.PI*0.5);
  flat.scale.set(1.3, 0.4, 1.0);
  flat.castShadow = flat.receiveShadow = true;
  g.add(flat);
  // 苔 patch under the trinity
  const moss = new THREE.Mesh(new THREE.CircleGeometry(0.9, 16).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:0x4a6a36, roughness:1.0, transparent:true, opacity:0.85}));
  moss.position.y = 0.01;
  g.add(moss);
  return g;
}

// Azalea patch (低木): cluster of small rounded shrubs
function makeAzaleaPatch(count = 5, color = 0xc8553d){
  const g = new THREE.Group();
  for(let i=0;i<count;i++){
    const r = 0.18 + Math.random()*0.12;
    const shrub = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6),
      mat(color, {roughness:0.85}));
    const ang = (i/count)*Math.PI*2 + Math.random()*0.3;
    const dist = Math.random()*0.6;
    shrub.position.set(Math.sin(ang)*dist, r*0.8, Math.cos(ang)*dist);
    shrub.castShadow = true;
    g.add(shrub);
    // a few colorful blossom dots
    if(Math.random() < 0.5){
      for(let k=0;k<3;k++){
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4),
          mat(0xff8aa0, {emissive:0xff5a7a, emissiveIntensity:0.15}));
        dot.position.set(
          shrub.position.x + (Math.random()-0.5)*r*0.8,
          shrub.position.y + (Math.random()-0.5)*r*0.6 + r*0.4,
          shrub.position.z + (Math.random()-0.5)*r*0.8
        );
        g.add(dot);
      }
    }
  }
  return g;
}

// Bamboo grove (中木): tall thin segmented stalks
function makeBambooGrove(count = 9){
  const g = new THREE.Group();
  const bambooMat = mat(0x6a8a3a, {roughness:0.7});
  for(let i=0;i<count;i++){
    const stalk = new THREE.Group();
    const h = 2.2 + Math.random()*1.4;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, h, 6), bambooMat);
    stem.position.y = h/2;
    stem.castShadow = true;
    stalk.add(stem);
    // node rings
    const nodes = Math.floor(h/0.35);
    for(let n=1;n<nodes;n++){
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.012, 4, 8), mat(0x4a6a2a));
      ring.position.y = n*0.35;
      ring.rotation.x = Math.PI/2;
      stalk.add(ring);
    }
    // tiny leaves at top
    for(let k=0;k<4;k++){
      const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.06),
        new THREE.MeshStandardMaterial({color:0x5a7a30, side:THREE.DoubleSide, transparent:true, alphaTest:0.5}));
      leaf.position.set(Math.cos(k)*0.15, h - 0.15 - k*0.12, Math.sin(k)*0.15);
      leaf.rotation.set(k*0.3, k*0.7, k*0.4);
      stalk.add(leaf);
    }
    const ang = (i/count)*Math.PI*2;
    const rad = 0.4 + Math.random()*0.7;
    stalk.position.set(Math.sin(ang)*rad, 0, Math.cos(ang)*rad);
    stalk.userData.windPhase = Math.random()*Math.PI*2;
    TREE_GROUPS.push(stalk);
    g.add(stalk);
  }
  return g;
}

// Bamboo fence (segment)
function makeBambooFence(length = 3.0){
  const g = new THREE.Group();
  const bambooMat = mat(0xc8a86a, {roughness:0.75});
  const dark = mat(0x6a4a2a);
  // 2 posts
  for(const dx of [-length/2, length/2]){

    post.position.set(dx, 0.5, 0);
    post.castShadow = true;
    g.add(post);

  // vertical stakes
  const stakes = Math.floor(length/0.12);
  for(let i=0;i<stakes;i++){
    const x = (i/(stakes-1) - 0.5)*length;
    const stake = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.8, 5), bambooMat);
    stake.position.set(x, 0.4, 0);
    stake.castShadow = true;

  // 2 horizontal rails
  for(const y of [0.2, 0.75]){
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, length, 5), dark);
    rail.rotation.z = Math.PI/2;
    rail.position.set(0, y, 0);
    g.add(rail);
  }
  return g;
}

  base.position.y = 0.10; base.castShadow=base.receiveShadow=true; g.add(base);
  // shaft (hex)
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.9, 6), stoneM);
  shaft.position.y = 0.65; shaft.castShadow=true; g.add(shaft);
  // mid platter (chudai)
  const platter = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.30, 0.10, 8), stoneM);
  platter.position.y = 1.15; g.add(platter);
  // light chamber (hibukuro) — hex with cutouts
  const cham = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.34, 0.32), stoneM);
  cham.position.y = 1.36; cham.castShadow = true;
  g.add(cham);
  // 4 light windows
  for(let i=0;i<4;i++){
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.18),
      mat(0xffe2a8, {emissive:0xffaa44, emissiveIntensity:0}));
    const ang = (i/4)*Math.PI*2;
    win.position.set(Math.sin(ang)*0.161, 1.36, Math.cos(ang)*0.161);
    win.lookAt(0, 1.36, 0); win.rotation.y += Math.PI;
    win.userData.lamp = true;
    g.add(win);
  }
  // roof (kasagi) — wide flat hex with point
  const roof1 = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.10, 8), stoneM);
  roof1.position.y = 1.58; g.add(roof1);
  const roof2 = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.18, 8), stoneM);
  roof2.position.y = 1.72; roof2.castShadow = true; g.add(roof2);
  // finial (hoju)
  const fin = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), stoneM);
  fin.position.y = 1.86; g.add(fin);
  // point light at chamber
  const pl = new THREE.PointLight(0xffaa44, 0, 5, 2);
  pl.position.y = 1.36;
  g.add(pl);
  g.userData.lampLight = pl;
  return g;
}

// Layered planting helper — places 4 layers (canopy, sub, shrub, ground) at a spot
function layeredPlanting(root, x, z, theme = 'forest'){
  const themes = {
    forest:    { canopy:'pine',    sub:'broad',   shrubColor:0x4a7a40, mossColor:0x3a5a30 },
    autumn:    { canopy:'momiji',  sub:'momiji',  shrubColor:0xa83a30, mossColor:0x6a5230 },
    spring:    { canopy:'sakura',  sub:'broad',   shrubColor:0xd968a0, mossColor:0x4a6a36 },
    shrine:    { canopy:'pine',    sub:'sakura',  shrubColor:0x4a7a40, mossColor:0x3a5230 },
    lake:      { canopy:'willow',  sub:'broad',   shrubColor:0x5a8a4a, mossColor:0x4a6a36 },
  };
  const th = themes[theme] || themes.forest;
  // canopy
  const t1 = makeTree(th.canopy);
  t1.position.set(x, 0, z);
  t1.scale.setScalar(1.4 + Math.random()*0.3);
  root.add(t1);
  // sub
  const t2 = makeTree(th.sub);
  t2.position.set(x + (Math.random()-0.5)*1.4, 0, z + (Math.random()-0.5)*1.4);
  t2.scale.setScalar(0.9);
  root.add(t2);
  // shrubs (3)
  for(let i=0;i<3;i++){
    const ang = (i/3)*Math.PI*2;
    const r = 0.7 + Math.random()*0.4;
    const az = makeAzaleaPatch(3, th.shrubColor);
    az.position.set(x + Math.sin(ang)*r*1.5, 0, z + Math.cos(ang)*r*1.5);
    root.add(az);
  }
  // moss patch
  const moss = new THREE.Mesh(new THREE.CircleGeometry(1.8, 16).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({color:th.mossColor, roughness:1.0, transparent:true, opacity:0.7}));
  moss.position.set(x, 0.02, z);
  root.add(moss);
}

/* === Engawa (Japanese wooden veranda) ==================== */
function makeEngawa(width = 3.0, depth = 1.0){
  const g = new THREE.Group();
  const deckTex = WOOD_TEX.clone();
  deckTex.needsUpdate = true;
  deckTex.repeat.set(width*0.6, depth);
  deckTex.wrapS = deckTex.wrapT = THREE.RepeatWrapping;
  deckTex.colorSpace = THREE.SRGBColorSpace;
  const woodM = new THREE.MeshStandardMaterial({ map: deckTex, color:0xb88a5a, roughness:0.85, metalness:0.03 });
  // base (foundation stones)
  const stoneM = mat(0x6a5a40);
  for(const sx of [-width*0.45, 0, width*0.45]){
    const stone = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, depth*0.8), stoneM);
    stone.position.set(sx, 0.15, 0);
    stone.castShadow = stone.receiveShadow = true;
    g.add(stone);
  }
  // deck planks (4-6 per width)
  const plankCount = Math.max(4, Math.floor(depth/0.22));
  for(let i=0;i<plankCount;i++){
    const plank = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, depth/plankCount - 0.01), woodM);
    plank.position.set(0, 0.34, (i/(plankCount-1) - 0.5)*depth);
    plank.castShadow = plank.receiveShadow = true;
    g.add(plank);
  }
  // edge trim
  const trim = new THREE.Mesh(new THREE.BoxGeometry(width+0.04, 0.05, 0.06), mat(0x5a3a20));
  trim.position.set(0, 0.36, depth/2 + 0.02);
  g.add(trim);
  return g;
}

/* === Stepping stones (沓脱石) ============================ */
function makeSteppingStones(points){
  const g = new THREE.Group();
  const stoneM = mat(0x7a7060, {roughness:0.95});
  for(const [x,z, scale=1.0, rot=Math.random()*Math.PI] of points){
    const stone = new THREE.Mesh(
      new THREE.CylinderGeometry(0.32*scale, 0.36*scale, 0.10, 8, 1),
      stoneM
    );
    stone.position.set(x, 0.05, z);
    stone.rotation.y = rot;
    stone.scale.set(1, 1, 0.85+Math.random()*0.2);
    stone.castShadow = stone.receiveShadow = true;
    g.add(stone);
  }
  return g;
}

/* Tree builder ============================================ */
const TREE_GROUPS = [];   // for wind sway
function makeTree(kind, rnd=Math.random){
  const g = new THREE.Group();
  if(kind==='pine'){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.14, 0.85, 6), mat(0x4a3020));
    trunk.position.y = 0.42; trunk.castShadow=true; g.add(trunk);
    for(let i=0;i<3;i++){
      const c = new THREE.Mesh(new THREE.ConeGeometry(0.7 - i*0.15, 0.85, 8), mat([0x3F6B3A, 0x4d7a44, 0x5a8a50][i]));
      c.position.y = 0.85 + i*0.5; c.castShadow=true; g.add(c);
    }
  } else if(kind==='sakura'){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.7, 6), mat(0x4a3020));
    trunk.position.y = 0.35; trunk.castShadow=true; g.add(trunk);
    for(let i=0;i<5;i++){
      const ang = (i/5)*Math.PI*2;
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.4 + rnd()*0.1, 8, 8), mat(0xf0b8c8));
      ball.position.set(Math.sin(ang)*0.3, 1.0 + Math.cos(ang)*0.12, Math.cos(ang)*0.3);
      ball.castShadow=true; g.add(ball);
    }
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 10), mat(0xf8d0d8));
    center.position.y = 1.2; center.castShadow=true; g.add(center);
  } else if(kind==='momiji'){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.10, 0.65, 6), mat(0x3a261a));
    trunk.position.y = 0.32; trunk.castShadow=true; g.add(trunk);
    for(let i=0;i<4;i++){
      const ang = (i/4)*Math.PI*2;
      const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.33 + rnd()*0.09, 8, 8), mat(0xc8553d));
      lobe.position.set(Math.sin(ang)*0.27, 0.8 + Math.cos(ang)*0.1, Math.cos(ang)*0.27);
      lobe.castShadow=true; g.add(lobe);
    }
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.36, 8, 8), mat(0xd9694a));
    center.position.y = 1.0; center.castShadow=true; g.add(center);
  } else if(kind==='willow'){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.14, 1.0, 6), mat(0x4a3020));
    trunk.position.y = 0.5; trunk.castShadow=true; g.add(trunk);
    for(let i=0;i<7;i++){
      const ang = (i/7)*Math.PI*2;
      const drape = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.02, 1.4, 6), mat(0x7aa860));
      drape.position.set(Math.sin(ang)*0.5, 0.8, Math.cos(ang)*0.5);
      drape.castShadow=true;
      g.add(drape);
    }
    const top = new THREE.Mesh(new THREE.SphereGeometry(0.55, 8, 8), mat(0x86bd6a));
    top.position.y = 1.4; top.castShadow=true; g.add(top);
  } else { // broadleaf
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.15, 0.85, 6), mat(0x4a3020));
    trunk.position.y = 0.42; trunk.castShadow=true; g.add(trunk);
    const top = new THREE.Mesh(new THREE.SphereGeometry(0.65, 10, 10), mat(0x5a8a50));
    top.position.y = 1.15; top.castShadow=true; g.add(top);
    const top2 = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 8), mat(0x73a45c));
    top2.position.set(0.2, 1.3, -0.1); top2.castShadow=true; g.add(top2);
  }
  g.userData.windPhase = Math.random()*Math.PI*2;
  TREE_GROUPS.push(g);
  return g;
}

function makeRock(rnd=Math.random, scale=1){
  const m = rnd() < 0.6 ? mat(0x8a8067) : mat(0x6a6050);
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35+rnd()*0.5, 0), m);
  r.rotation.set(rnd()*Math.PI, rnd()*Math.PI, rnd()*Math.PI);
  r.scale.set(scale*(0.9+rnd()*0.4), scale*(0.6+rnd()*0.5), scale*(0.9+rnd()*0.4));
  r.castShadow = true; r.receiveShadow = true;
  return r;
}

function makeBush(rnd=Math.random){
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.22+rnd()*0.18, 8, 6), mat([0x3F6B3A,0x4a7340,0x5a8a50][Math.floor(rnd()*3)]));
  b.castShadow = true;
  return b;
}

/* Avatar (jointed) ======================================== */
function makeAvatar(){
  const g = new THREE.Group();
  const skin = mat(0xf2cba5, {roughness:0.65});
  const cloth = mat(0x3e6a89);
  const trim = mat(0xe8dcb8);
  const pants = mat(0x2a1a14);
  const hair = mat(0x1a1410, {roughness:0.5});
  const sash = mat(0xb04030);

  const hip = new THREE.Group();
  hip.position.y = 0.42;
  g.add(hip);
  const pantsMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.22, 0.45, 8), pants);
  pantsMesh.position.y = -0.05; pantsMesh.castShadow = true;
  hip.add(pantsMesh);

  function leg(side){
    const l = new THREE.Group();
    l.position.set(side*0.08, -0.23, 0);
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.2, 10), pants);
    thigh.position.y = -0.10; thigh.castShadow = true;
    l.add(thigh);
    const knee = new THREE.Group();
    knee.position.y = -0.20;
    l.add(knee);
    const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.075, 0.2, 10), pants);
    shin.position.y = -0.10; shin.castShadow = true;
    knee.add(shin);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.06, 0.22), mat(0x3a2010));
    foot.position.set(0, -0.23, 0.06); foot.castShadow = true;
    knee.add(foot);
    l.userData = { knee };
    return l;
  }
  const legL = leg(-1), legR = leg(1);
  hip.add(legL); hip.add(legR);

  const torso = new THREE.Group();
  torso.position.y = 0.2;
  hip.add(torso);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.25, 0.48, 10), cloth);
  body.position.y = 0.18; body.castShadow = true;
  torso.add(body);
  const sashM = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.10, 12), sash);
  sashM.position.y = 0; torso.add(sashM);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.035, 6, 16), trim);
  collar.position.y = 0.36; collar.rotation.x = Math.PI/2;
  torso.add(collar);

  function arm(side){
    const a = new THREE.Group();
    a.position.set(side*0.24, 0.36, 0);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.36, 8), cloth);
    upper.position.y = -0.18; upper.castShadow = true;
    a.add(upper);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), skin);
    hand.position.y = -0.38;
    a.add(hand);
    return a;
  }
  const armL = arm(-1), armR = arm(1);
  torso.add(armL); torso.add(armR);

  const head = new THREE.Group();
  head.position.y = 0.48;
  torso.add(head);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.07,0.07,8), skin);
  neck.position.y = -0.06; head.add(neck);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 14), skin);
  skull.position.y = 0.07; skull.castShadow = true; head.add(skull);
  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.155, 16, 12, 0, Math.PI*2, 0, Math.PI*0.55), hair);
  hairCap.position.y = 0.07; head.add(hairCap);
  const bangs = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.06, 0.11), hair);
  bangs.position.set(0, 0.16, 0.085); bangs.rotation.x = -0.12;
  head.add(bangs);
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8), hair);
  tuft.position.set(0, 0.04, -0.13); head.add(tuft);

  // face texture
  const faceCan = document.createElement('canvas');
  faceCan.width = 128; faceCan.height = 128;
  const fc = faceCan.getContext('2d');
  fc.fillStyle = '#2a1a14';
  fc.fillRect(36, 50, 18, 4); fc.fillRect(74, 50, 18, 4);
  fc.fillStyle = '#1a1410';
  fc.beginPath(); fc.ellipse(46, 62, 9, 6, 0, 0, Math.PI*2); fc.fill();
  fc.beginPath(); fc.ellipse(82, 62, 9, 6, 0, 0, Math.PI*2); fc.fill();
  fc.fillStyle = '#ffffff';
  fc.beginPath(); fc.arc(48, 60, 2, 0, Math.PI*2); fc.fill();
  fc.beginPath(); fc.arc(84, 60, 2, 0, Math.PI*2); fc.fill();
  fc.fillStyle = 'rgba(180,130,100,.35)';
  fc.beginPath(); fc.ellipse(64, 78, 3, 5, 0, 0, Math.PI*2); fc.fill();
  fc.strokeStyle = '#5a2410'; fc.lineWidth = 2;
  fc.beginPath(); fc.arc(64, 92, 7, 0.2*Math.PI, 0.8*Math.PI); fc.stroke();
  fc.fillStyle = 'rgba(255,158,138,.55)';
  fc.beginPath(); fc.ellipse(36, 80, 9, 6, 0, 0, Math.PI*2); fc.fill();
  fc.beginPath(); fc.ellipse(92, 80, 9, 6, 0, 0, Math.PI*2); fc.fill();
  const faceTex = new THREE.CanvasTexture(faceCan);
  faceTex.colorSpace = THREE.SRGBColorSpace;
  const facePlane = new THREE.Mesh(
    new THREE.PlaneGeometry(0.24, 0.24),
    new THREE.MeshBasicMaterial({ map: faceTex, transparent:true, alphaTest:0.02 })
  );
  facePlane.position.set(0, 0.07, 0.135);
  head.add(facePlane);

  // hat
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.12, 16), mat(0xd9a86a));
  hat.position.y = 0.20; hat.castShadow=true;
  head.add(hat);
  const hatRim = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.028, 6, 16), mat(0xb88a4a));
  hatRim.position.y = 0.175; hatRim.rotation.x = Math.PI/2;
  head.add(hatRim);

  // selection ring
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.36, 0.44, 32),
    new THREE.MeshBasicMaterial({color:0x6BE07A, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false}));
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.02;
  g.add(ring);
  g.userData.ring = ring;

  g.userData.joints = { hip, torso, head, legL, legR, armL, armR };
  return g;
}

  if(!currentScene) return;
  // Dispose all children of currentScene.root
  currentScene.root.traverse(o=>{
    if(o.geometry && !o.userData.shared) o.geometry.dispose();
    if(o.material){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for(const m of mats) if(!m.userData?.shared) m.dispose();
    }
  });
  scene.remove(currentScene.root);
  currentScene = null;
  ENTITIES.trees.length = 0;
  ENTITIES.npcs.length = 0;
  ENTITIES.particles.length = 0;
  ENTITIES.flames.length = 0;
  ENTITIES.lamps.length = 0;
  ENTITIES.lampLights.length = 0;
  ENTITIES.boats.length = 0;
  ENTITIES.hourhands.length = 0;
  ENTITIES.minhands.length = 0;
  TREE_GROUPS.length = 0;
}

function buildScene(name){
  const def = SCENES[name];
  if(!def){ console.warn('scene not found', name); return; }
  clearScene();
  const root = new THREE.Group();
  scene.add(root);
  currentScene = { name, def, root };
  // Mood: sun position & sky scattering
  setSun(def.sun[0], def.sun[1]);
  skyU.turbidity.value = def.turbidity ?? 4;
  skyU.rayleigh.value = def.rayleigh ?? 2;
  scene.fog.color = new THREE.Color(def.fogColor || '#bcd6e2');
  scene.fog.near = def.fogNear ?? 26;
  scene.fog.far  = def.fogFar  ?? 70;
  renderer.toneMappingExposure = def.exposure ?? 1.05;
  // Build geometry
  def.build(root);
  // Avatar position
  if(def.avatarStart){
    avatar.position.set(def.avatarStart[0], 0, def.avatarStart[1]);
    avatar.lookAt(0, avatar.position.y, 0);
  } else {
    avatar.position.set(0, 0, SCENE_RADIUS*0.65);
    avatar.lookAt(0, 0, 0);
  }
  // ground-clamp avatar
  avatar.position.y = sampleHeight(avatar.position.x, avatar.position.z);
  // Concept card
  const cc = document.getElementById('concept');
  document.getElementById('c-type').textContent = def.num + ' · ' + (def.kind?.toUpperCase() || 'SCENE');
  document.getElementById('c-title').textContent = def.title;
  document.getElementById('c-en').textContent = def.en;
  document.getElementById('c-desc').textContent = def.concept || '';
  cc.classList.add('show');
  // Tabs
  document.querySelectorAll('.scene-tab').forEach(t=>t.classList.toggle('active', t.dataset.scene===name));
  // Visited heart
  visited.add(name); updateHearts();
}

// sample height of current scene's ground (called for avatar Y follow)
const _rayDown = new THREE.Raycaster();
const _down = new THREE.Vector3(0,-1,0);
function sampleHeight(x, z){
  if(!currentScene || !currentScene.root) return 0;
  // find ground mesh in current scene
  const ground = currentScene.root.userData.ground;
  if(!ground) return 0;
  _rayDown.set(new THREE.Vector3(x, 30, z), _down);
  const hits = _rayDown.intersectObject(ground);
  return hits.length ? hits[0].point.y : 0;
}

        reed.add(blade);
      }
      reed.position.set(-6+i*1.4, -0.15, -1.5);

    }
    // Azalea patches in foreground
    for(const [x,z] of [[-2,3],[2,3.5],[6,2]]){
      const az = makeAzaleaPatch(4, [0xd968a0, 0xc8553d, 0xff8aa0][Math.floor(Math.random()*3)]);
      az.position.set(x, 0, z);
      root.add(az);
    }
    // Several pebbles for richer ground layer
    for(let i=0;i<20;i++){
      const ang = Math.random()*Math.PI*2;
      const r = 2 + Math.random()*5;
      const x = Math.sin(ang)*r;
      const z = Math.cos(ang)*r * 0.45 + 2;
      if(z < -1) continue;
      const peb = new THREE.Mesh(new THREE.SphereGeometry(0.10+Math.random()*0.07, 8, 6),
        mat(0xaaa090, {roughness:0.6}));
      peb.scale.y = 0.5;
      peb.position.set(x, 0.05, z);
      peb.castShadow=true;
      root.add(peb);
    }
  }
};

    root.add(rain);

    // Stone path leading to the cabin
    root.add(makeSteppingStones([
      [3,5,1.0,0],[2.5,4,1.0,0.2],[2,3,0.95,0.4],[1.5,2,1.0,0.1],[1,1,1.05,0.3],
    ]));

let audioCtx=null, ambientGain=null;
function startAmbient(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  ambientGain = audioCtx.createGain(); ambientGain.gain.value=0;
  ambientGain.connect(audioCtx.destination);
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*3, audioCtx.sampleRate);
  const nd = buf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<nd.length;i++){
    const w = Math.random()*2-1;
    b0 = 0.997*b0 + w*0.099; b1 = 0.963*b1 + w*0.297; b2 = 0.57*b2 + w*1.05;
    nd[i] = (b0+b1+b2+w*0.18) * 0.06;
  }
  const noise = audioCtx.createBufferSource(); noise.buffer = buf; noise.loop=true;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
  noise.connect(lp).connect(ambientGain); noise.start();
  function chime(){
    if(!ambientGain) return;
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type='sine';
    o.frequency.value=[440,523.25,587.33,659.25,783.99][Math.floor(Math.random()*5)];
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+2.8);
    o.connect(g).connect(ambientGain); o.start(); o.stop(audioCtx.currentTime+2.9);
    setTimeout(chime, 6000+Math.random()*8000);
  }
  setTimeout(chime, 3000);
  ambientGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime+1.5);
}
function stopAmbient(){
  if(ambientGain){
    const a = ambientGain; const ctx = audioCtx;
    a.gain.linearRampToValueAtTime(0, ctx.currentTime+0.6);
    setTimeout(()=>{ try{ a.disconnect(); }catch(e){} }, 800);
    ambientGain = null;
  }
}
btnSound.addEventListener('click', ()=>{
  const on = btnSound.classList.toggle('active');
  btnSound.textContent = on ? 'SOUND · ON' : 'SOUND · OFF';
  if(on) startAmbient(); else stopAmbient();
});

/* === Avatar control ===================================== */
const keys = { w:false,a:false,s:false,d:false,shift:false };
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let moveTarget = null;
const camYaw = -Math.PI*0.25;   // fixed camera angle

window.addEventListener('keydown', e=>{
  if(e.code==='KeyW' || e.key==='ArrowUp')    keys.w = true;
  if(e.code==='KeyS' || e.key==='ArrowDown')  keys.s = true;
  if(e.code==='KeyA' || e.key==='ArrowLeft')  keys.a = true;
  if(e.code==='KeyD' || e.key==='ArrowRight') keys.d = true;
  if(e.key==='Shift') keys.shift = true;

});
window.addEventListener('keyup', e=>{
  if(e.code==='KeyW' || e.key==='ArrowUp')    keys.w = false;
  if(e.code==='KeyS' || e.key==='ArrowDown')  keys.s = false;
  if(e.code==='KeyA' || e.key==='ArrowLeft')  keys.a = false;
  if(e.code==='KeyD' || e.key==='ArrowRight') keys.d = false;
  if(e.key==='Shift') keys.shift = false;
});

let pointerDown = false, dragMoved = false, lastPx=0, lastPy=0;
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  pointerDown = true; dragMoved = false;
  lastPx = e.clientX; lastPy = e.clientY;
});
canvas.addEventListener('pointermove', e=>{
  if(pointerDown){
    if(Math.abs(e.clientX-lastPx)+Math.abs(e.clientY-lastPy)>4) dragMoved = true;
    lastPx=e.clientX; lastPy=e.clientY;
  }
});
canvas.addEventListener('pointerup', e=>{
  pointerDown = false;
  if(!dragMoved) handleClick(e.clientX, e.clientY);
});
canvas.addEventListener('pointercancel', ()=>{ pointerDown = false; });

function handleClick(cx, cy){
  ndc.x = (cx / window.innerWidth) * 2 - 1;
  ndc.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  if(!currentScene) return;
  const ground = currentScene.root.userData.ground;
  if(!ground) return;
  const hits = raycaster.intersectObject(ground);
  if(hits.length){
    const p = hits[0].point;
    moveTarget = new THREE.Vector3(p.x, 0, p.z);
  }
}

/* === Animation loop ===================================== */
const clock = new THREE.Clock();

function animate(){
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  /* ── Avatar movement ── */
  let moving = false;
  const moveSpeed = keys.shift ? 5.2 : 3.0;
  let mx = 0, mz = 0;
  if(keys.w) mz -= 1;
  if(keys.s) mz += 1;
  if(keys.a) mx -= 1;
  if(keys.d) mx += 1;
  if(mx || mz){
    const len = Math.hypot(mx,mz); mx/=len; mz/=len;
    const wx = mx*Math.cos(camYaw) - mz*Math.sin(camYaw);
    const wz = mx*Math.sin(camYaw) + mz*Math.cos(camYaw);
    avatar.position.x += wx * moveSpeed * dt;
    avatar.position.z += wz * moveSpeed * dt;
    avatar.lookAt(avatar.position.x + wx, avatar.position.y, avatar.position.z + wz);
    moving = true; moveTarget = null;
  } else if(moveTarget){
    const dx = moveTarget.x - avatar.position.x;
    const dz = moveTarget.z - avatar.position.z;
    const d = Math.hypot(dx,dz);
    if(d < 0.18) moveTarget = null;
    else {
      const sp = moveSpeed * dt;
      avatar.position.x += dx/d*sp;
      avatar.position.z += dz/d*sp;
      avatar.lookAt(avatar.position.x+dx, avatar.position.y, avatar.position.z+dz);
      moving = true;
    }
  }
  // clamp to scene radius
  const r = Math.hypot(avatar.position.x, avatar.position.z);
  if(r > SCENE_BOUND){
    avatar.position.x *= SCENE_BOUND/r;
    avatar.position.z *= SCENE_BOUND/r;
  }
  // follow terrain
  avatar.position.y = sampleHeight(avatar.position.x, avatar.position.z);

  /* ── Avatar joints animation ── */
  const j = avatar.userData.joints;
  if(j){
    if(moving){
      const sw = Math.sin(t*10);
      const cw = Math.cos(t*10);
      j.legL.rotation.x = sw * 0.55;
      j.legR.rotation.x = -sw * 0.55;
      if(j.legL.userData?.knee){
        j.legL.userData.knee.rotation.x = -Math.max(0, sw) * 0.9;
        j.legR.userData.knee.rotation.x = -Math.max(0, -sw) * 0.9;
      }
      j.armL.rotation.x = -sw * 0.45;
      j.armR.rotation.x = sw * 0.45;
      j.torso.position.y = 0.20 + Math.abs(sw)*0.025;
      j.torso.rotation.z = cw * 0.04;
    } else {
      const idle = Math.sin(t*1.6)*0.04;
      j.legL.rotation.x *= 0.85; j.legR.rotation.x *= 0.85;
      if(j.legL.userData?.knee){
        j.legL.userData.knee.rotation.x *= 0.9;
        j.legR.userData.knee.rotation.x *= 0.9;
      }
      j.armL.rotation.x = idle; j.armR.rotation.x = -idle;
      j.torso.position.y = 0.20 + idle*0.4;
      j.torso.rotation.z *= 0.9;
    }
    j.head.rotation.y = Math.sin(t*0.4)*0.1;
  }

  /* ── Day/night ── */
  // Scene-forced night override
  const forceNight = currentScene && currentScene.def.forceNight;
  const targetN = (forceNight || nightMode) ? 1 : 0;
  nightT += (targetN-nightT)*Math.min(1, dt*1.0);
  sun.intensity = 3.4 * (1-nightT) + 0.2;
  hemi.intensity = 0.6 * (1-nightT*0.85);
  moon.intensity = 0.55 * nightT;
  ambientLight.intensity = 0.22 + 0.10*nightT;
  // lamps glow at night
  for(const lm of ENTITIES.lamps){ if(lm.material?.emissive) lm.material.emissiveIntensity = nightT * 1.4; }
  for(const pl of ENTITIES.lampLights){ pl.intensity = 1.5 * nightT; }
  // flames flicker
  for(const f of ENTITIES.flames){
    f.position.y = (f.userData.flame === 1 ? 0.78 : 0.92) + Math.sin(t*8 + f.userData.flame*2)*0.05;
    f.scale.y = 1 + Math.sin(t*9 + f.userData.flame)*0.08;
    f.rotation.y = Math.sin(t*4 + f.userData.flame)*0.2;
  }
  // boat rock
  for(const b of ENTITIES.boats){
    b.rotation.z = Math.sin(t*1.2)*0.04;
    b.position.y = -0.05 + Math.sin(t*1.2)*0.02;
  }
  // clock hands
  for(const h of ENTITIES.hourhands) h.rotation.z = -t*0.04;
  for(const m of ENTITIES.minhands)  m.rotation.z = -t*0.5;
  // tree wind sway
  for(const tr of TREE_GROUPS){
    tr.rotation.z = Math.sin(t*1.4 + tr.userData.windPhase)*0.025;
  }
  // water uniform update
  if(currentScene && currentScene.root.userData.waterU){
    currentScene.root.userData.waterU.uTime.value = t;
  }
  // NPC walk
  for(const n of ENTITIES.npcs){
    const ud = n.userData;
    if(ud.speed === 0) continue; // static
    const path = ud.path;
    const tgt = path[(ud.wp+1)%path.length];
    const dxn = tgt[0]-n.position.x, dzn = tgt[1]-n.position.z;
    const dn = Math.hypot(dxn,dzn);
    const step = ud.speed*dt;
    if(dn < step*1.5){
      n.position.x = tgt[0]; n.position.z = tgt[1];
      ud.wp = (ud.wp+1)%path.length;
    } else {
      n.position.x += dxn/dn*step;
      n.position.z += dzn/dn*step;
      n.lookAt(tgt[0], n.position.y, tgt[1]);
    }
    n.position.y = sampleHeight(n.position.x, n.position.z);
    if(ud.joints){
      const swn = Math.sin(t*9 + ud.wp);
      ud.joints.legL.rotation.x = swn*0.5;
      ud.joints.legR.rotation.x = -swn*0.5;
      ud.joints.body.position.y = 0.52 + Math.abs(swn)*0.02;
    }
  }
  // particles
  for(const p of ENTITIES.particles){
    if(p.type === 'spark'){
      const o = p.obj;
      o.userData.phase += dt;
      const lf = (o.userData.phase % 1.5) / 1.5;
      o.position.x = Math.sin(o.userData.phase*4)*0.4*lf;
      o.position.y = 0.6 + lf*1.8;
      o.position.z = Math.cos(o.userData.phase*3)*0.4*lf;
      o.material.opacity = 1 - lf;
    } else if(p.type === 'rain'){
      const positions = p.obj.geometry.attributes.position;
      const state = p.obj.userData.state;
      for(let i=0;i<state.length;i++){
        state[i].y -= 12*dt;
        if(state[i].y < 0){ state[i].y = 8 + Math.random()*2; state[i].x = (Math.random()-0.5)*22; state[i].z = (Math.random()-0.5)*22; }
        positions.array[i*6]   = state[i].x; positions.array[i*6+1] = state[i].y;       positions.array[i*6+2] = state[i].z;
        positions.array[i*6+3] = state[i].x; positions.array[i*6+4] = state[i].y - 0.5; positions.array[i*6+5] = state[i].z;
      }
      positions.needsUpdate = true;
    }
  }

  composer.render();
  requestAnimationFrame(animate);
}
