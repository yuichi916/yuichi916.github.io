<style>
:root{
  --indigo:#0a0a1a;
  --indigo-2:#15192e;
  --paper:#e8dcb8;
  --paper-soft:#f3e7c4;
  --paper-dim:#b8a878;
  --ink-soft:#7a6e58;
  --candle:#ffb968;
  --candle-soft:#ffd970;
  --candle-deep:#d68a30;
  --moss:#5a7a4a;
  --vermilion:#b04030;
  --water:#7ac0d8;
  --night-blue:#3a5070;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;background:var(--indigo);color:var(--paper);
  font-family:"Shippori Mincho","Cormorant Garamond",serif;
  font-feature-settings:"palt";letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
a{color:var(--candle);text-decoration:none;}
a:hover{color:var(--candle-soft);}

body::after{content:"";position:fixed;inset:0;z-index:300;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7 0 0 0 0 0.6 0 0 0 0 0.4 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.35;mix-blend-mode:overlay;}

#container{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;}
#container canvas{display:block;}

/* splash */
.splash{position:fixed;inset:0;z-index:200;
  background:linear-gradient(180deg, rgba(10,10,26,.99), rgba(15,12,30,.99));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:40px 24px;transition:opacity .5s;text-align:center;}
.splash.hidden{opacity:0;pointer-events:none;}
.splash .en{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:clamp(14px,1.5vw,17px);color:var(--candle);letter-spacing:.32em;}
.splash .title{font-family:"Shippori Mincho",serif;font-weight:500;
  font-size:clamp(38px,5.5vw,68px);letter-spacing:.22em;color:var(--paper);}
.splash .title em{font-style:normal;color:var(--candle);
  text-shadow:0 0 24px rgba(255,180,90,.5);}
.splash .sub{font-family:"Shippori Mincho",serif;font-size:14.5px;
  color:var(--paper-dim);max-width:520px;line-height:2.1;}
.splash .keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
  font-family:"Shippori Mincho",serif;color:var(--paper-dim);font-size:12.5px;margin-top:8px;}
.splash .keys span{display:inline-flex;align-items:center;gap:6px;}
.splash .keys kbd{font-family:"JetBrains Mono",monospace;font-size:11px;
  background:rgba(255,185,104,.15);border:1px solid var(--candle);
  border-radius:3px;padding:2px 7px;color:var(--candle-soft);}
.splash button{margin-top:24px;
  padding:14px 38px;background:linear-gradient(180deg, var(--candle-soft), var(--candle-deep));
  color:var(--indigo);font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:15.5px;letter-spacing:.22em;border:none;border-radius:3px;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,180,90,.4);transition:all .2s;}
.splash button:hover{transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(255,180,90,.55);}

/* top bar (after splash) */
.bar{position:fixed;top:0;left:0;right:0;z-index:60;height:54px;
  display:none;align-items:center;justify-content:space-between;padding:0 22px;
  background:linear-gradient(180deg,rgba(10,10,26,.92),rgba(10,10,26,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.bar.show{display:flex;}
.bar .brand{display:flex;align-items:center;gap:10px;
  font-family:"Shippori Mincho",serif;font-weight:700;font-size:16px;
  letter-spacing:.18em;color:var(--paper-soft);}
.bar .brand .lantern{display:inline-block;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff2c0, var(--candle) 50%, transparent 80%);
  box-shadow:0 0 10px var(--candle), 0 0 20px rgba(255,180,90,.4);
  animation:flicker 4s ease-in-out infinite;}
@keyframes flicker{0%,30%,40%,100%{opacity:1;}35%,42%{opacity:.75;}}
.bar .brand .sub{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:12.5px;color:var(--ink-soft);letter-spacing:.16em;margin-left:4px;font-weight:400;}
.bar .info{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:12px;color:var(--ink-soft);letter-spacing:.1em;}
.bar .info kbd{font-family:"JetBrains Mono",monospace;font-size:10.5px;
  background:rgba(255,185,104,.12);border:1px solid rgba(255,185,104,.3);
  border-radius:3px;padding:1px 6px;color:var(--candle);margin:0 3px;}
.bar .tools{display:flex;gap:8px;align-items:center;}
.bar .tool{width:34px;height:34px;border-radius:50%;
  background:rgba(28,42,58,.6);border:1px solid rgba(216,178,112,.18);
  color:var(--paper-dim);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;}
.bar .tool:hover{border-color:var(--candle);color:var(--candle);}
.bar .tool.active{color:var(--candle);border-color:var(--candle);
  box-shadow:0 0 10px rgba(255,185,104,.4);}
.bar .back{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:13px;color:var(--ink-soft);padding-left:8px;}
.bar .back:hover{color:var(--candle);}
@media (max-width:720px){
  .bar{padding:0 12px;}
  .bar .brand .sub, .bar .info{display:none;}
}

/* hover tooltip when a place is highlighted */
.hover-tip{position:fixed;z-index:55;pointer-events:none;
  font-family:"Shippori Mincho",serif;font-size:13.5px;color:var(--paper);
  background:rgba(10,10,26,.94);border:1px solid var(--candle);border-radius:3px;
  padding:7px 14px;letter-spacing:.06em;white-space:nowrap;opacity:0;
  transition:opacity .15s;
  box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 14px rgba(255,180,90,.2);
  transform:translate(-50%, -120%);}
.hover-tip.show{opacity:1;}
.hover-tip kbd{font-family:"JetBrains Mono",monospace;font-size:10.5px;
  background:rgba(255,185,104,.16);border:1px solid var(--candle);
  border-radius:2px;padding:1px 5px;color:var(--candle-soft);margin-left:6px;}

/* visited dots (top centre) */
.visited-row{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:62;
  display:none;align-items:center;gap:8px;pointer-events:none;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  color:var(--ink-soft);font-size:11px;letter-spacing:.16em;}
.visited-row.show{display:flex;}
.visited-row .vlabel{flex-shrink:0;}
.visited-row .vdot{width:8px;height:8px;border-radius:50%;
  background:rgba(216,178,112,.32);transition:all .25s;}
.visited-row .vdot.on{background:var(--candle);
  box-shadow:0 0 8px var(--candle);}

/* ── overlay (place content modal, same as before) ── */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.78);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);padding:60px 16px;overflow-y:auto;}
.overlay.open{display:flex;animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.overlay-inner{background:linear-gradient(180deg, #15192e 0%, #0a0a1a 100%);
  border:1px solid var(--candle);border-radius:6px;
  padding:36px 40px 32px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;
  position:relative;box-shadow:0 24px 60px rgba(0,0,0,.7), 0 0 40px rgba(255,180,90,.12);}
.overlay-close{position:absolute;top:12px;right:16px;background:transparent;
  border:none;color:var(--ink-soft);cursor:pointer;font-size:24px;line-height:1;
  width:36px;height:36px;border-radius:50%;transition:all .15s;}
.overlay-close:hover{color:var(--candle);background:rgba(255,185,104,.1);}
.overlay-eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.32em;text-transform:uppercase;color:var(--candle);
  display:inline-flex;align-items:center;gap:10px;margin-bottom:6px;}
.overlay-eyebrow::before{content:"";width:30px;height:1px;background:var(--candle);}
.overlay-inner h2{font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:clamp(26px,3.4vw,38px);color:var(--paper);
  margin:4px 0 4px;letter-spacing:.08em;line-height:1.25;}
.overlay-inner h2 em{font-style:normal;color:var(--candle);}
.overlay-en{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:14px;color:var(--paper-dim);letter-spacing:.16em;margin-bottom:18px;}
.overlay-deck{font-family:"Shippori Mincho",serif;font-size:15px;
  color:var(--paper-dim);line-height:2.1;margin-bottom:22px;}
.overlay-deck em{font-style:normal;color:var(--paper-soft);}
.overlay-cta{display:inline-flex;align-items:center;gap:14px;
  font-family:"Cormorant Garamond","Shippori Mincho",serif;font-style:italic;
  font-size:15.5px;letter-spacing:.06em;color:var(--candle);
  padding:12px 26px;border:1px solid rgba(255,185,104,.4);border-radius:4px;
  background:rgba(255,185,104,.05);cursor:pointer;transition:all .2s;text-decoration:none;}
.overlay-cta:hover{background:rgba(255,185,104,.15);border-color:var(--candle);
  gap:20px;color:var(--candle-soft);}

.breath-widget{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.breath-circle{width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,180,80,.55), rgba(255,140,40,.32) 50%, rgba(176,64,48,.05) 90%);
  box-shadow:0 0 50px rgba(255,140,40,.32), inset 0 0 30px rgba(255,217,112,.32);
  display:flex;align-items:center;justify-content:center;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:24px;color:var(--paper-soft);letter-spacing:.12em;
  transition:transform 4s cubic-bezier(.4,0,.4,1);}
.breath-circle.in, .breath-circle.hold{transform:scale(1.32);}
.breath-circle.out{transform:scale(1);}
.breath-phase{font-family:"Shippori Mincho",serif;font-size:14.5px;
  color:var(--paper-dim);letter-spacing:.16em;min-height:24px;}
.breath-phase b{color:var(--candle);font-weight:500;}
.breath-btn{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:14.5px;letter-spacing:.06em;color:var(--candle);
  padding:9px 22px;border:1px solid rgba(255,185,104,.4);border-radius:4px;
  background:transparent;cursor:pointer;transition:all .2s;}
.breath-btn:hover{background:rgba(255,185,104,.1);}
.breath-hint{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;
  max-width:380px;line-height:1.7;text-align:center;}

.poems{display:flex;flex-direction:column;gap:26px;}
.poem{font-family:"Shippori Mincho",serif;color:var(--paper-soft);
  font-size:14.5px;line-height:2.3;letter-spacing:.06em;
  border-left:1px solid rgba(122,192,216,.32);padding-left:18px;}
.poem .signature{display:block;margin-top:4px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:11px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;}
.poem em{color:var(--candle-soft);font-style:normal;}

.ambient-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.amb-tile{padding:14px 16px;background:rgba(28,42,58,.6);
  border:1px solid rgba(122,192,216,.22);border-radius:4px;
  text-decoration:none;color:var(--paper);transition:all .2s;
  display:flex;flex-direction:column;gap:3px;}
.amb-tile:hover{border-color:var(--water);background:rgba(122,192,216,.1);
  transform:translateY(-2px);}
.amb-tile .icon{font-size:20px;margin-bottom:4px;}
.amb-tile .name{font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:13.5px;color:var(--paper);}
.amb-tile .src{font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:10px;color:var(--paper-dim);letter-spacing:.06em;text-transform:uppercase;}

.starscape{position:relative;width:100%;height:240px;
  border-radius:6px;overflow:hidden;
  border:1px solid rgba(216,178,112,.18);
  background:radial-gradient(ellipse at 50% 100%, #1a2838 0%, var(--indigo) 100%);}
.starscape .horizon{position:absolute;bottom:0;left:0;right:0;height:14%;
  background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.7) 100%);}
.starscape .star{position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff8d8;box-shadow:0 0 4px #fff2c0;}
.starscape .star.lg{width:3px;height:3px;
  box-shadow:0 0 6px #fff8d8, 0 0 12px rgba(255,217,112,.5);}
.starscape .star.tw{animation:starTw 3s ease-in-out infinite;}
@keyframes starTw{
  0%,100%{opacity:.85;transform:scale(1);}
  50%{opacity:.4;transform:scale(.85);}
}
.starscape .shootingstar{position:absolute;width:80px;height:1px;
  background:linear-gradient(90deg, transparent, #fff8d8, transparent);
  transform:rotate(-15deg);opacity:0;animation:shoot 12s linear infinite;}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0) rotate(-15deg);}
  3%{opacity:.85;}
  10%{opacity:0;transform:translate(180px,40px) rotate(-15deg);}
  100%{opacity:0;}
}
</style>

<body>

<!-- splash -->
<div class="splash" id="splash">
  <div class="en">A Quiet Garden · № 08</div>
  <div class="title">心 の <em>庭</em></div>
  <div class="sub">
    月夜の庭を、 ドラッグで見渡しながら散策します。<br>
    八つの場所をクリックして、 心を整える小さな世界を巡ろう。
  </div>
  <div class="keys">
    <span><kbd>ドラッグ</kbd> 視点を回す</span>
    <span><kbd>スクロール</kbd> ズーム</span>
    <span><kbd>クリック</kbd> 場所に入る</span>
  </div>
  <button id="enter-btn">庭に入る</button>
</div>

<!-- top bar (visible after splash) -->
<header class="bar" id="bar">
  <div class="brand">
    <span class="lantern"></span>心の庭<span class="sub">A Quiet Garden</span>
  </div>
  <div class="info"><kbd>ドラッグ</kbd>回転 <kbd>スクロール</kbd>ズーム <kbd>クリック</kbd>入る</div>
  <div class="tools">
    <button class="tool" id="ambient-toggle" title="静かな環境音 (オフ)" aria-label="ambient">♪</button>
    <a class="back" href="/">← 入口へ</a>
  </div>
</header>

<!-- visited dots -->
<div class="visited-row" id="visited-row">
  <span class="vlabel">巡った場所</span>
</div>

<!-- Three.js canvas mount -->
<div id="container"></div>

<!-- hover tooltip for highlighted place -->
<div class="hover-tip" id="hover-tip"></div>

<!-- overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-inner" id="overlay-inner"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Three.js scene state ──────────────────────────────────────────
let scene, camera, renderer;
let isDragging = false, dragStart = {x: 0, y: 0}, previousMousePosition = {x: 0, y: 0};
const clickableObjects = [];
let hoveredObject = null;
let inOverlay = false;
const visitedPlaces = new Set();

try {
  const raw = localStorage.getItem("niwa_visited_v3");
  if(raw) JSON.parse(raw).forEach(v => visitedPlaces.add(v));
} catch(e){}

function hash(x, y, seed = 0) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 45.164) * 43758.5453;
  return n - Math.floor(n);
}

// ─── Locations ─────────────────────────────────────────────────────
const LOCATIONS = [
  {id:"takibi",  x:0,    z:0,   name:"焚き火の前",   en:"At the Bonfire",   type:"firepit"},
  {id:"tsuki",   x:-16,  z:-15, name:"月光の書架",   en:"Moonlit Library",  type:"library"},
  {id:"oto",     x:16,   z:-13, name:"音の祠",       en:"Sound Shrine",     type:"torii"},
  {id:"tabi",    x:0,    z:-26, name:"ひとり旅の道", en:"Solitary Road",    type:"road"},
  {id:"mizube",  x:-19,  z:6,   name:"水辺の岸",     en:"Water's Edge",     type:"pond"},
  {id:"toki",    x:19,   z:8,   name:"時の砂時計",   en:"Hourglass",        type:"hourglass"},
  {id:"amaoto",  x:-11,  z:19,  name:"雨音の部屋",   en:"Room of Rain",     type:"hut"},
  {id:"hoshi",   x:13,   z:21,  name:"星見台",       en:"Observatory",      type:"observatory"},
];

// ─── Three.js init ─────────────────────────────────────────────────
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 55, 130);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(40, 36, 40);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('container').appendChild(renderer.domElement);

  createStarfield();
  createMoonOrb();

  // Lighting
  const ambient = new THREE.AmbientLight(0x9090b8, 0.42);
  scene.add(ambient);

  const moonLight = new THREE.DirectionalLight(0xd0d0ff, 0.85);
  moonLight.position.set(60, 80, 40);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.width = 2048;
  moonLight.shadow.mapSize.height = 2048;
  moonLight.shadow.camera.left = -70;
  moonLight.shadow.camera.right = 70;
  moonLight.shadow.camera.top = 70;
  moonLight.shadow.camera.bottom = -70;
  moonLight.shadow.bias = -0.0001;
  scene.add(moonLight);

  // Subtle warm fill from a low east-side amber
  const fill = new THREE.HemisphereLight(0x1a2240, 0x3a2818, 0.18);
  scene.add(fill);

  createGround();
  LOCATIONS.forEach(loc => createLocation(loc));

  // Trees scattered around (avoiding centre)
  for(let i = 0; i < 60; i++){
    const angle = hash(i, 0, 100) * Math.PI * 2;
    const dist = 22 + hash(0, i, 100) * 24;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    if(notTooCloseToPlaces(x, z, 4)) createTree(x, z);
  }
  // Bushes scattered (no centre)
  for(let i = 0; i < 36; i++){
    const x = (hash(i, 10, 100) - 0.5) * 70;
    const z = (hash(10, i, 100) - 0.5) * 70;
    if(Math.sqrt(x*x + z*z) > 7 && notTooCloseToPlaces(x, z, 3)) createBush(x, z);
  }
  // Lanterns along the central paths
  for(let i = 0; i < 12; i++){
    const angle = (i / 12) * Math.PI * 2;
    const dist = 9;
    createPathLantern(Math.cos(angle) * dist, Math.sin(angle) * dist);
  }

  setupControls();
  setupKeyboard();
  setupTouch();
  refreshVisitedDots();
  animate();
}

function notTooCloseToPlaces(x, z, r){
  for(const loc of LOCATIONS){
    const d = Math.hypot(x - loc.x, z - loc.z);
    if(d < r + 3.5) return false;
  }
  return true;
}

// ─── Stars ─────────────────────────────────────────────────────────
function createStarfield(){
  const starGeo = new THREE.BufferGeometry();
  const N = 1400;
  const positions = new Float32Array(N * 3);
  const sizes = new Float32Array(N);
  for(let i = 0; i < N; i++){
    positions[i*3]   = (Math.random() - 0.5) * 220;
    positions[i*3+1] = Math.random() * 110 + 18;
    positions[i*3+2] = (Math.random() - 0.5) * 220;
    sizes[i] = 0.18 + Math.random() * 0.4;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const starMat = new THREE.PointsMaterial({
    color: 0xfff2c0, size: 0.32, transparent: true, opacity: 0.85,
    sizeAttenuation: true,
  });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
}

// ─── Ground ────────────────────────────────────────────────────────
function createGround(){
  const size = 110;
  const groundGeo = new THREE.PlaneGeometry(size, size, 90, 90);
  const positions = groundGeo.attributes.position;
  for(let i = 0; i < positions.count; i++){
    const x = positions.getX(i);
    const y = positions.getY(i);
    const dist = Math.sqrt(x*x + y*y);
    const noise = Math.sin(x * 0.15) * Math.cos(y * 0.15) * 0.42 +
                  Math.sin(x * 0.4) * Math.cos(y * 0.3) * 0.22;
    positions.setZ(i, noise - (dist < 16 ? 0.32 : 0));
  }
  groundGeo.computeVertexNormals();

  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  // moonlit moss base
  const grad = ctx.createRadialGradient(512, 512, 160, 512, 512, 720);
  grad.addColorStop(0, '#3a4838');
  grad.addColorStop(0.3, '#2a382a');
  grad.addColorStop(0.6, '#1c281f');
  grad.addColorStop(1, '#0e161a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 1024);
  // moss patches
  for(let i = 0; i < 280; i++){
    ctx.fillStyle = `rgba(${50 + Math.random()*40}, ${90 + Math.random()*60}, ${50 + Math.random()*30}, ${0.18 + Math.random()*0.32})`;
    ctx.beginPath();
    ctx.arc(Math.random()*1024, Math.random()*1024, 14 + Math.random()*30, 0, Math.PI*2);
    ctx.fill();
  }
  // dewy highlights
  for(let i = 0; i < 1600; i++){
    ctx.strokeStyle = `rgba(${110 + Math.random()*50}, ${140 + Math.random()*60}, ${90 + Math.random()*40}, 0.36)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const x = Math.random() * 1024, y = Math.random() * 1024;
    ctx.moveTo(x, y); ctx.lineTo(x + (Math.random() - 0.5) * 4, y + Math.random() * 5);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

  const groundMat = new THREE.MeshLambertMaterial({map: tex});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Stone path circle around centre
  const pathGeo = new THREE.RingGeometry(7, 9.5, 64);
  const pathMat = new THREE.MeshLambertMaterial({color: 0x4a4438});
  const path = new THREE.Mesh(pathGeo, pathMat);
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.04;
  scene.add(path);
}

// ─── Place builders (custom per location) ──────────────────────────
function createLocation(loc){
  const group = new THREE.Group();
  group.userData = {name: loc.name, en: loc.en, id: loc.id};

  switch(loc.type){
    case "firepit":      buildFirepit(group); break;
    case "library":      buildLibrary(group); break;
    case "torii":        buildTorii(group); break;
    case "road":         buildRoad(group); break;
    case "pond":         buildPond(group); break;
    case "hourglass":    buildHourglassTower(group); break;
    case "hut":          buildRainHut(group); break;
    case "observatory":  buildObservatory(group); break;
  }

  // Label sprite (canvas)
  const canvas = document.createElement('canvas');
  canvas.width = 384; canvas.height = 96;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(10,10,26,.88)';
  ctx.fillRect(0, 24, 384, 56);
  ctx.strokeStyle = '#ffb968'; ctx.lineWidth = 2;
  ctx.strokeRect(0, 24, 384, 56);
  ctx.fillStyle = '#f3e7c4';
  ctx.font = 'bold 30px "Shippori Mincho",serif';
  ctx.textAlign = 'center';
  ctx.fillText(loc.name, 192, 60);
  const labelTex = new THREE.CanvasTexture(canvas);
  const labelMat = new THREE.SpriteMaterial({map: labelTex, transparent: true, opacity: 0.9});
  const label = new THREE.Sprite(labelMat);
  const labelY = (loc.type === "observatory") ? 11
              : (loc.type === "library") ? 8.5
              : (loc.type === "torii") ? 7.5
              : (loc.type === "hut") ? 6.5
              : 5;
  label.position.y = labelY;
  label.scale.set(6.5, 1.6, 1);
  label.userData = {isLabel: true};
  group.add(label);

  group.position.set(loc.x, 0, loc.z);
  scene.add(group);
  clickableObjects.push(group);
}

// 焚き火
function buildFirepit(group){
  // ground hollow (slightly darker disc)
  const baseGeo = new THREE.CircleGeometry(2.4, 24);
  const baseMat = new THREE.MeshLambertMaterial({color: 0x2a201a});
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.rotation.x = -Math.PI / 2; base.position.y = 0.05;
  base.receiveShadow = true;
  group.add(base);
  // stones in circle
  for(let i = 0; i < 10; i++){
    const angle = (i / 10) * Math.PI * 2;
    const w = 0.4 + hash(i, 0, 7) * 0.2;
    const stoneGeo = new THREE.BoxGeometry(w, 0.45, w * 0.85);
    const stoneMat = new THREE.MeshLambertMaterial({color: 0x6a6a5a});
    const stone = new THREE.Mesh(stoneGeo, stoneMat);
    stone.position.set(Math.cos(angle) * 1.85, 0.23, Math.sin(angle) * 1.85);
    stone.rotation.y = hash(i, 1, 7) * Math.PI;
    stone.castShadow = true;
    group.add(stone);
  }
  // logs (crossed)
  const logMat = new THREE.MeshLambertMaterial({color: 0x4a2818});
  for(let i = 0; i < 3; i++){
    const logGeo = new THREE.CylinderGeometry(0.16, 0.16, 2.4, 8);
    const log = new THREE.Mesh(logGeo, logMat);
    log.rotation.z = Math.PI/2;
    log.rotation.y = (i / 3) * Math.PI;
    log.position.y = 0.3 + i * 0.08;
    log.castShadow = true;
    group.add(log);
  }
  // flame group
  const flameGroup = new THREE.Group();
  flameGroup.position.y = 0.4;
  group.add(flameGroup);
  group.userData.flame = flameGroup;

  const flameGeo1 = new THREE.ConeGeometry(0.7, 1.7, 8);
  const flameMat1 = new THREE.MeshBasicMaterial({color: 0xff7a30, transparent: true, opacity: 0.85, fog: false});
  const flame1 = new THREE.Mesh(flameGeo1, flameMat1);
  flame1.position.y = 0.85;
  flameGroup.add(flame1);

  const flameGeo2 = new THREE.ConeGeometry(0.42, 1.1, 8);
  const flameMat2 = new THREE.MeshBasicMaterial({color: 0xfff2c0, transparent: true, opacity: 0.95, fog: false});
  const flame2 = new THREE.Mesh(flameGeo2, flameMat2);
  flame2.position.y = 0.7;
  flameGroup.add(flame2);

  // sparks (instanced via small spheres)
  const sparks = [];
  for(let i = 0; i < 8; i++){
    const sparkGeo = new THREE.SphereGeometry(0.08, 6, 6);
    const sparkMat = new THREE.MeshBasicMaterial({color: 0xffd970, transparent: true, opacity: 0.8, fog: false});
    const sp = new THREE.Mesh(sparkGeo, sparkMat);
    sp.userData = {offset: i * 0.3, baseY: 1.5, vx: (Math.random() - 0.5) * 0.4, vz: (Math.random() - 0.5) * 0.4};
    sp.position.set(sp.userData.vx, sp.userData.baseY, sp.userData.vz);
    flameGroup.add(sp);
    sparks.push(sp);
  }
  group.userData.sparks = sparks;
  // warm fire light
  const fireLight = new THREE.PointLight(0xff7a30, 1.7, 14);
  fireLight.position.y = 1.4;
  group.add(fireLight);
  group.userData.fireLight = fireLight;
}

// 月光の書架
function buildLibrary(group){
  // Pagoda-like book tower
  const baseGeo = new THREE.BoxGeometry(5.5, 0.5, 5.5);
  const baseMat = new THREE.MeshLambertMaterial({color: 0x3a2818});
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.25;
  base.castShadow = base.receiveShadow = true;
  group.add(base);

  // Tower body (3 floors of bookshelves)
  for(let f = 0; f < 3; f++){
    const w = 4.6 - f * 0.6;
    const wallGeo = new THREE.BoxGeometry(w, 2.0, w);
    const wallMat = new THREE.MeshLambertMaterial({color: 0x4a3018});
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.y = 1.5 + f * 2.4;
    wall.castShadow = wall.receiveShadow = true;
    group.add(wall);
    // book spines on each face
    for(let side = 0; side < 4; side++){
      const ang = side * Math.PI / 2;
      for(let b = 0; b < 10; b++){
        const bookW = 0.18 + hash(f, b+side, 5) * 0.16;
        const bookH = 1.0 + hash(b, f+side, 5) * 0.6;
        const bookGeo = new THREE.BoxGeometry(bookW, bookH, 0.18);
        const bookColors = [0x8a6a4a, 0xc28a4a, 0x7a4a4a, 0x6a8a5a, 0xc5a070, 0xa86a4a];
        const bc = bookColors[Math.floor(hash(f, b*2+side, 9) * bookColors.length)];
        const bookMat = new THREE.MeshLambertMaterial({color: bc});
        const book = new THREE.Mesh(bookGeo, bookMat);
        const offset = (b - 4.5) * (w * 0.85 / 10);
        book.position.set(
          Math.cos(ang) * (w/2 + 0.1) + Math.sin(ang) * offset,
          1.5 + f * 2.4 + (hash(b, f, 11) - 0.5) * 0.2,
          Math.sin(ang) * (w/2 + 0.1) - Math.cos(ang) * offset
        );
        book.rotation.y = ang + Math.PI/2;
        group.add(book);
      }
    }
    // roof slab
    const slabGeo = new THREE.BoxGeometry(w + 0.6, 0.25, w + 0.6);
    const slabMat = new THREE.MeshLambertMaterial({color: 0x2a1a10});
    const slab = new THREE.Mesh(slabGeo, slabMat);
    slab.position.y = 2.6 + f * 2.4;
    slab.castShadow = true;
    group.add(slab);
  }
  // Top lantern
  const topLanGeo = new THREE.BoxGeometry(0.9, 1.2, 0.9);
  const topLanMat = new THREE.MeshLambertMaterial({
    color: 0xffcc70, emissive: 0xffaa40, emissiveIntensity: 0.7,
  });
  const topLan = new THREE.Mesh(topLanGeo, topLanMat);
  topLan.position.y = 9.2;
  group.add(topLan);
  const lanLight = new THREE.PointLight(0xffcc70, 0.6, 10);
  lanLight.position.y = 9.2;
  group.add(lanLight);
}

// 雨音の部屋
function buildRainHut(group){
  // walls
  const wallW = 3.2, wallH = 3.2, wallD = 3.2;
  const wallGeo = new THREE.BoxGeometry(wallW, wallH, wallD);
  const wallMat = new THREE.MeshLambertMaterial({color: 0x6a5040});
  const walls = new THREE.Mesh(wallGeo, wallMat);
  walls.position.y = wallH / 2;
  walls.castShadow = walls.receiveShadow = true;
  group.add(walls);
  // wood plank texture (vertical planks)
  for(let side = 0; side < 4; side++){
    const ang = side * Math.PI / 2;
    for(let p = -wallW/2; p < wallW/2; p += 0.28){
      const plankGeo = new THREE.BoxGeometry(0.16, wallH, 0.05);
      const plankMat = new THREE.MeshLambertMaterial({color: 0x8a6850});
      const plank = new THREE.Mesh(plankGeo, plankMat);
      plank.position.set(
        Math.cos(ang) * (wallD/2 + 0.025) + Math.sin(ang) * p,
        wallH / 2,
        Math.sin(ang) * (wallD/2 + 0.025) - Math.cos(ang) * p
      );
      plank.rotation.y = ang;
      group.add(plank);
    }
  }
  // window

// ─── Controls (mouse + touch + keyboard) ──────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tipEl = document.getElementById('hover-tip');

function setupControls(){
  const dom = renderer.domElement;
  dom.addEventListener('mousedown', e => {
    isDragging = true;
    dragStart = {x: e.clientX, y: e.clientY};
    previousMousePosition = {x: e.clientX, y: e.clientY};
  });
  dom.addEventListener('mousemove', e => {
    if(isDragging){
      const dx = e.clientX - previousMousePosition.x;
      const dy = e.clientY - previousMousePosition.y;
      orbitCamera(dx, dy);
      previousMousePosition = {x: e.clientX, y: e.clientY};
      tipEl.classList.remove('show');
      return;
    }
    hoverPlace(e.clientX, e.clientY);
  });
  dom.addEventListener('mouseup', e => {
    if(!isDragging) return;
    const moved = Math.abs(e.clientX - dragStart.x) + Math.abs(e.clientY - dragStart.y);
    if(moved < 5 && !inOverlay){
      clickPlace(e.clientX, e.clientY);
    }
    isDragging = false;
  });
  dom.addEventListener('mouseleave', () => {
    isDragging = false;
    tipEl.classList.remove('show');
    if(hoveredObject){ hoveredObject.scale.set(1,1,1); hoveredObject = null; }
  });
  dom.addEventListener('wheel', e => {
    e.preventDefault();
    const dz = e.deltaY > 0 ? 1.05 : 0.95;
    camera.position.multiplyScalar(dz);
    const d = camera.position.length();
    if(d < 16) camera.position.setLength(16);
    if(d > 90) camera.position.setLength(90);
  }, {passive: false});
}

function orbitCamera(dx, dy){
  camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), dx * 0.005);
  const pitchAxis = new THREE.Vector3(-camera.position.z, 0, camera.position.x).normalize();
  const curD = camera.position.length();
  camera.position.applyAxisAngle(pitchAxis, -dy * 0.003);
  camera.position.setLength(curD);
  camera.position.y = Math.max(8, Math.min(70, camera.position.y));
  camera.lookAt(0, 0, 0);
}

function hoverPlace(cx, cy){
  mouse.x = (cx / window.innerWidth) * 2 - 1;
  mouse.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects, true);
  if(hits.length){
    let obj = hits[0].object;
    while(obj.parent && !obj.userData.name) obj = obj.parent;
    if(obj.userData.name){
      renderer.domElement.style.cursor = 'pointer';
      if(hoveredObject !== obj){
        if(hoveredObject) hoveredObject.scale.set(1, 1, 1);
        hoveredObject = obj;
        obj.scale.set(1.06, 1.06, 1.06);
      }
      tipEl.innerHTML = `${obj.userData.name} <kbd>CLICK</kbd>`;
      tipEl.style.left = cx + 'px';
      tipEl.style.top = cy + 'px';
      tipEl.classList.add('show');
      return;
    }
  }
  renderer.domElement.style.cursor = 'default';
  if(hoveredObject){ hoveredObject.scale.set(1, 1, 1); hoveredObject = null; }
  tipEl.classList.remove('show');
}

function clickPlace(cx, cy){
  mouse.x = (cx / window.innerWidth) * 2 - 1;
  mouse.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects, true);
  if(hits.length){
    let obj = hits[0].object;
    while(obj.parent && !obj.userData.name) obj = obj.parent;
    if(obj.userData.id) openOverlay(obj.userData.id);
  }
}

// ── Touch controls (single-finger orbit, pinch zoom, tap click) ───
function setupTouch(){
  const dom = renderer.domElement;
  let lastTouch = null;
  let pinchD = 0;
  dom.addEventListener('touchstart', e => {
    if(e.touches.length === 1){
      lastTouch = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      dragStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
      isDragging = true;
    } else if(e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchD = Math.hypot(dx, dy);
      isDragging = false;
    }
  }, {passive: true});
  dom.addEventListener('touchmove', e => {
    if(e.touches.length === 1 && isDragging){
      const t = e.touches[0];
      orbitCamera(t.clientX - lastTouch.x, t.clientY - lastTouch.y);
      lastTouch = {x: t.clientX, y: t.clientY};
      e.preventDefault();
    } else if(e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if(pinchD > 0){
        const ratio = pinchD / d;
        camera.position.multiplyScalar(ratio);
        const dist = camera.position.length();
        if(dist < 16) camera.position.setLength(16);
        if(dist > 90) camera.position.setLength(90);
      }
      pinchD = d;
      e.preventDefault();
    }
  }, {passive: false});
  dom.addEventListener('touchend', e => {
    if(isDragging && e.changedTouches.length === 1){
      const t = e.changedTouches[0];
      const moved = Math.abs(t.clientX - dragStart.x) + Math.abs(t.clientY - dragStart.y);
      if(moved < 7 && !inOverlay) clickPlace(t.clientX, t.clientY);
    }
    isDragging = false;
    pinchD = 0;
  });
}

function setupKeyboard(){
  window.addEventListener('keydown', e => {
    if(e.key === 'Escape' && inOverlay){
      closeOverlay();
    }
  });
}

// ─── Animation loop ────────────────────────────────────────────────
let frameCount = 0;
function animate(){
  requestAnimationFrame(animate);
  frameCount++;
  const t = performance.now() * 0.001;
  // flicker fire flames + sparks
  clickableObjects.forEach(g => {
    if(g.userData.flame){
      const f = g.userData.flame;
      f.scale.y = 1 + Math.sin(t * 7 + g.position.x) * 0.07;
      f.scale.x = 1 + Math.cos(t * 9 + g.position.z) * 0.05;
      if(g.userData.fireLight){
        g.userData.fireLight.intensity = 1.5 + Math.sin(t * 5) * 0.3;
      }
      if(g.userData.sparks){
        g.userData.sparks.forEach((sp, idx) => {
          const phase = (t + sp.userData.offset) % 2;
          sp.position.y = sp.userData.baseY + phase * 2;
          sp.material.opacity = Math.max(0, 0.9 - phase * 0.45);
          sp.position.x = sp.userData.vx + Math.sin(t * 2 + idx) * 0.1;
          sp.position.z = sp.userData.vz + Math.cos(t * 2 + idx) * 0.1;
        });
      }
    }
    // pond ripples
    if(g.userData.ripples){
      g.userData.ripples.forEach(r => {
        const phase = (t * 0.5 + r.userData.phase) % 2;
        r.scale.setScalar(1 + phase * 1.2);
        r.material.opacity = Math.max(0, 0.45 - phase * 0.22);
      });
    }
    // rain drops
    if(g.userData.rain){
      g.userData.rain.children.forEach(d => {
        d.position.y -= d.userData.speed;
        if(d.position.y < 0.5) d.position.y = d.userData.init;
      });
    }
  });
  // moon halo facing camera
  if(scene && scene.userData.halo){
    scene.userData.halo.lookAt(camera.position);
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  if(!camera || !renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function openOverlay(id){
  inOverlay = true;
  const inner = document.getElementById("overlay-inner");
  inner.innerHTML = `<button class="overlay-close" id="overlay-close" aria-label="close">×</button>${renderPlaceContent(id)}`;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("overlay-close").onclick = closeOverlay;
  document.getElementById("overlay").onclick = (e) => {
    if(e.target.id === "overlay") closeOverlay();
  };
  if(!visitedPlaces.has(id)){
    visitedPlaces.add(id);
    try { localStorage.setItem("niwa_visited_v3", JSON.stringify([...visitedPlaces])); } catch(e){}
    refreshVisitedDots();
  }
  if(id === "takibi") setupBreath();
  if(id === "hoshi") setupStarscape();
}
function closeOverlay(){
  inOverlay = false;
  document.getElementById("overlay").classList.remove("open");
}

function refreshVisitedDots(){
  const row = document.getElementById("visited-row");
  // remove old dots (keep .vlabel)
  row.querySelectorAll(".vdot").forEach(el => el.remove());
  LOCATIONS.forEach(loc => {
    const d = document.createElement("span");
    d.className = "vdot" + (visitedPlaces.has(loc.id) ? " on" : "");
    d.title = loc.name;
    row.appendChild(d);
  });
  row.classList.add("show");
}

function setupBreath(){
  const circle = document.getElementById("breath-circle");
  const phase = document.getElementById("breath-phase");
  const btn = document.getElementById("breath-btn");
  if(!circle) return;
  let running = false, stopFlag = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function cycle(n){
    for(let i = 0; i < n && !stopFlag; i++){
      circle.classList.remove("out");circle.classList.add("in");
      phase.innerHTML = `<b>吸う</b> · 4秒  (${i+1}/${n})`;
      circle.textContent = "吸";
      await sleep(4000); if(stopFlag) break;
      circle.classList.add("hold");
      phase.innerHTML = `<b>とめる</b> · 7秒  (${i+1}/${n})`;
      circle.textContent = "止";
      await sleep(7000); if(stopFlag) break;
      circle.classList.remove("in","hold");circle.classList.add("out");
      phase.innerHTML = `<b>吐く</b> · 8秒  (${i+1}/${n})`;
      circle.textContent = "吐";
      await sleep(8000);
    }
    if(!stopFlag){ phase.innerHTML = "<b>おしまい</b>  ·  どうぞ、 ゆっくりと。"; circle.textContent = "✿"; }
    else { phase.textContent = "いつでも、 また来てね。"; circle.textContent = "息"; }
    circle.classList.remove("in","hold","out");
    btn.textContent = "もう一度"; running = false; stopFlag = false;
  }
  btn.onclick = () => {
    if(running){ stopFlag = true; btn.textContent = "はじめる"; }
    else { running = true; btn.textContent = "やめる"; cycle(3); }
  };
}

function setupStarscape(){
  const sky = document.getElementById("starscape");
  if(!sky) return;
  for(let i = 0; i < 90; i++){
    const s = document.createElement("div");
    s.className = "star" + (Math.random() < 0.18 ? " lg" : "") + (Math.random() < 0.6 ? " tw" : "");
    s.style.left = (Math.random() * 100) + "%";
    s.style.top = (Math.random() * 78) + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    sky.appendChild(s);
  }
  function shoot(){
    const ss = document.createElement("div");
    ss.className = "shootingstar";
    ss.style.left = (Math.random() * 60 + 10) + "%";
    ss.style.top = (Math.random() * 40) + "%";
    sky.appendChild(ss);
    setTimeout(() => ss.remove(), 12500);
  }
  shoot();
  const t = setInterval(() => { if(!sky.isConnected){ clearInterval(t); return;} shoot(); }, 11000);
}

// ─── Ambient audio (toggle, off by default) ────────────────────────
let ambientAudio = null;
const ambBtn = document.getElementById("ambient-toggle");
ambBtn.onclick = () => {
  if(!ambientAudio){
    ambientAudio = new Audio("https://cdn.pixabay.com/audio/2023/09/04/audio_caf4f95541.mp3");
    ambientAudio.loop = true;
    ambientAudio.volume = 0.26;
    ambientAudio.addEventListener("error", () => {
      ambBtn.title = "環境音が読み込めませんでした";
      ambBtn.classList.remove("active");
    });
  }
  if(ambientAudio.paused){
    ambientAudio.play().then(() => {
      ambBtn.classList.add("active");
      ambBtn.title = "静かな環境音 (オン)";
    }).catch(() => { ambBtn.title = "ブラウザに止められたかも"; });
  } else {
    ambientAudio.pause();
    ambBtn.classList.remove("active");
    ambBtn.title = "静かな環境音 (オフ)";
  }
};

// ─── Splash dismiss ────────────────────────────────────────────────
document.getElementById('enter-btn').onclick = () => {
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('bar').classList.add('show');
  init();
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
  }, 500);
};
</script>
