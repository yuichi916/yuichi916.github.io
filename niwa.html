h1.title .en{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;font-size:14px;letter-spacing:.18em;color:var(--paper-2);opacity:.85;margin-top:2px}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

/* ===========================================================
 *  心の庭 — Three.js 3D quarter-view (commercial-quality)
 *  Self-contained: no external GLB/HDRI; all geometry procedural
 * =========================================================== */

const WORLD_SIZE = 80;
const HALF = WORLD_SIZE/2;

/* === Renderer / Scene / Camera ============================ */
const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#9ec6d8');
scene.fog = new THREE.Fog('#bcd6e2', 60, 140);

const camera = new THREE.PerspectiveCamera(28, window.innerWidth/window.innerHeight, 0.5, 220);
camera.position.set(18, 22, 22);
camera.lookAt(0, 0, 0);

let loadProgress = 0;
function setLoad(p, label){
  loadProgress = Math.max(loadProgress, p);
  const el = document.getElementById('loadbar');
  const pct = document.getElementById('loadpct');
  if(el) el.style.width = (loadProgress*100).toFixed(0)+'%';
  if(pct) pct.textContent = (label||'LOADING') + ' · ' + (loadProgress*100).toFixed(0)+'%';
}

/* === Lighting ============================================ */
const sun = new THREE.DirectionalLight(0xfff4d0, 2.4);
sun.position.set(24, 28, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 90;
sun.shadow.camera.left = -45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -45;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xa8d4e8, 0x6a5a3a, 0.55);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffffff, 0.18);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0xa0c0e8, 0.0);
moon.position.set(-20, 22, -16);
scene.add(moon);

/* === HDRI environment (Polyhaven CC0) ===================== */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envDay = null, envNight = null;
const rgbeLoader = new RGBELoader();
// Day sky
rgbeLoader.load(
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloofendal_43d_clear_puresky_1k.hdr',
  (hdr)=>{
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    envDay = pmrem.fromEquirectangular(hdr).texture;
    scene.environment = envDay;
    hdr.dispose();
    setLoad(0.35, 'SKY · DAY');
  }
);
// Night sky
rgbeLoader.load(
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/satara_night_no_lamps_1k.hdr',
  (hdr)=>{
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    envNight = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose();
    setLoad(0.4, 'SKY · NIGHT');
  }
);

/* === PBR textures (Polyhaven CC0) ========================= */
const texLoader = new THREE.TextureLoader();
function loadTex(url, repeat=20, srgb=true){
  const t = texLoader.load(url, ()=>{ /* loaded */ });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const PH = 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/';
const grassPBR = {
  diff: loadTex(PH + 'leafy_grass/leafy_grass_diff_1k.jpg', 22, true),
  nor:  loadTex(PH + 'leafy_grass/leafy_grass_nor_gl_1k.jpg', 22, false),
  ao:   loadTex(PH + 'leafy_grass/leafy_grass_ao_1k.jpg', 22, false),
  rough:loadTex(PH + 'leafy_grass/leafy_grass_rough_1k.jpg', 22, false),
};
const woodPBR = {
  diff: loadTex(PH + 'wood_planks_grey/wood_planks_grey_diff_1k.jpg', 1, true),
};
const stonePBR = {
  diff: loadTex(PH + 'cobblestone_floor_07/cobblestone_floor_07_diff_1k.jpg', 1, true),
};

/* === Toon ramp + material helper ========================= */
function makeToonRamp(steps=4){
  const c = document.createElement('canvas');
  c.width = steps; c.height = 1;
  const ctx = c.getContext('2d');
  for(let i=0;i<steps;i++){
    const v = Math.floor(((i+1)/steps)*255);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(i,0,1,1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}
const toonGradient = makeToonRamp(4);
function toonMat(hex, opts={}){
  return new THREE.MeshToonMaterial({ color: hex, gradientMap: toonGradient, ...opts });
}

/* === Procedural canvas textures ========================== */
function makeNoiseCanvas(w, h, baseFn){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w,h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i = (y*w+x)*4;
      const [r,g,b] = baseFn(x,y);
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return c;
}
function pseudoNoise(x,y,s=1){
  return (Math.sin(x*0.137*s + y*0.231*s) + Math.sin(x*0.31*s + y*0.13*s)*0.7 + Math.sin(x*0.6*s)*0.4)*0.5+0.5;
}

const grassTex = (()=>{
  const c = makeNoiseCanvas(256,256,(x,y)=>{
    const n = pseudoNoise(x,y,2.2);
    const mossy = pseudoNoise(x+50,y+40,4)*0.3;
    return [90+n*40-mossy*20, 130+n*55, 60+n*30-mossy*15];
  });
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(22,22);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

/* === Procedural terrain (heightmap) ====================== */
const TERRAIN_SEG = 200;
function terrainHeight(wx, wz){
  const dPlaza = Math.hypot(wx, wz);
  const dLake = Math.hypot(wx-18, wz+16);   // (note +z = south in our convention)
  const dHillN = Math.hypot(wx, wz+18);
  const dHillNW = Math.hypot(wx+22, wz-8);

  let h = Math.sin(wx*0.13)*0.4 + Math.sin(wz*0.17)*0.4 + Math.sin((wx+wz)*0.08)*0.3;

  if(dPlaza < 6) h *= Math.max(0, (dPlaza-3)/3);
  if(dHillN < 10) h += (1-dHillN/10)*3.2;
  if(dHillNW < 7) h += (1-dHillNW/7)*1.6;
  if(dLake < 9)  h -= (1-dLake/9)*2.2;

  return h;
}

const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, TERRAIN_SEG, TERRAIN_SEG);
groundGeo.rotateX(-Math.PI/2);
{
  const pos = groundGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    pos.setY(i, terrainHeight(pos.getX(i), pos.getZ(i)));
  }
  pos.needsUpdate = true;
  groundGeo.computeVertexNormals();

  // vertex colors: grass / dirt / path / sand / moss
  const colors = new Float32Array(pos.count*3);
  const grassC = new THREE.Color('#7ea64a');
  const grassDarkC = new THREE.Color('#5a7a3d');
  const pathC = new THREE.Color('#c2956a');
  const sandC = new THREE.Color('#e6c98a');
  const mossC = new THREE.Color('#4a6a36');
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i), y = pos.getY(i);
    let c = grassC.clone();
    const dPlaza = Math.hypot(x,z);
    const dLake = Math.hypot(x-18, z+16);
    const onNSPath = Math.abs(x) < 0.95 && dPlaza > 4 && dPlaza < 28;
    const onEWPath = Math.abs(z) < 0.95 && dPlaza > 4 && dPlaza < 28;
    const inPlaza  = dPlaza < 4.3;
    if(inPlaza){ c.copy(pathC).lerp(sandC, 0.18); }
    else if(onNSPath || onEWPath){ c.copy(pathC); }
    else {
      const n = pseudoNoise(x*8, z*8, 1.4);
      c.copy(grassC).lerp(grassDarkC, n*0.5);
      if(y > 1.5) c.lerp(mossC, Math.min(1,(y-1.5)/2));
      if(y < -0.5) c.lerp(sandC, Math.min(1,(-y-0.5)/1.2));
      if(dLake < 9.6 && dLake > 9.0) c.lerp(sandC, 0.7);
    }
    colors[i*3]   = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
const groundMat = new THREE.MeshStandardMaterial({
  map: grassPBR.diff,
  normalMap: grassPBR.nor,
  aoMap: grassPBR.ao,
  roughnessMap: grassPBR.rough,
  vertexColors: true,
  color: 0xffffff,
  roughness: 1.0,
  metalness: 0.0,
  envMapIntensity: 0.7,

function curvedRoof(radius, depth, color){
  const pts = [];
  const N = 10;
  for(let i=0;i<=N;i++){
    const t = i/N;
    const r = radius * (1 - t*t*0.6);
    const y = t * depth + Math.sin(t*Math.PI)*depth*0.15;
    pts.push(new THREE.Vector2(r, y));
  }
  const g = new THREE.LatheGeometry(pts, 4);
  const mesh = new THREE.Mesh(g, toonMat(color));
  mesh.rotation.y = Math.PI/4;
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

function makePagoda(){
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.4, 3.4), toonMat(0x7a6f56));
  base.position.y = 0.2; base.castShadow=base.receiveShadow=true; g.add(base);
  const tierColors = [0xb04030, 0xa53a26, 0x9c331f, 0x8a2a18];
  const sizes = [2.6, 2.1, 1.6, 1.1];
  let y = 0.4;
  for(let i=0;i<4;i++){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(sizes[i], 0.9, sizes[i]), toonMat(tierColors[i]));
    wall.position.y = y + 0.45; wall.castShadow=wall.receiveShadow=true; g.add(wall);
    const roof = curvedRoof(sizes[i]*0.95, 0.8, 0x3a3024);
    roof.position.y = y + 0.9;
    g.add(roof);
    for(const dz of [-1,1]){
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.35), toonMat(0xffe2a8, {emissive:0xffaa44, emissiveIntensity:0.0}));
      win.position.set(0, y+0.5, dz*sizes[i]/2 + dz*0.001);
      win.rotation.y = dz<0 ? Math.PI : 0;
      win.userData.lamp = true;
      g.add(win);
    }
    y += 0.95;
  }
  const finial = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.5,8), toonMat(0xffb968, {emissive:0xffb968, emissiveIntensity:0.2}));

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}

function makeTreeMesh(kind, rnd){
  const g = new THREE.Group();
  if(kind==='pine'){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,0.7,6), toonMat(0x4a3020));
    trunk.position.y = 0.35; trunk.castShadow=true; g.add(trunk);
    for(let i=0;i<3;i++){
      const c = new THREE.Mesh(new THREE.ConeGeometry(0.6 - i*0.13, 0.7, 8), toonMat([0x3F6B3A, 0x4d7a44, 0x5a8a50][i]));
      c.position.y = 0.7 + i*0.42; c.castShadow=true; g.add(c);
    }
  } else if(kind==='sakura'){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.10,0.6,6), toonMat(0x4a3020));
    trunk.position.y = 0.3; trunk.castShadow=true; g.add(trunk);
    for(let i=0;i<5;i++){
      const ang = (i/5)*Math.PI*2;
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.32 + rnd()*0.1, 8, 8), toonMat(0xf0b8c8));
      ball.position.set(Math.sin(ang)*0.25, 0.85 + Math.cos(ang)*0.1, Math.cos(ang)*0.25);
      ball.castShadow=true; g.add(ball);
    }
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 10), toonMat(0xf8d0d8));
    center.position.y = 1.0; center.castShadow=true; g.add(center);
  } else if(kind==='momiji'){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.09,0.55,6), toonMat(0x3a261a));
    trunk.position.y = 0.27; trunk.castShadow=true; g.add(trunk);
    for(let i=0;i<4;i++){
      const ang = (i/4)*Math.PI*2;
      const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.28 + rnd()*0.08, 8, 8), toonMat(0xc8553d));
      lobe.position.set(Math.sin(ang)*0.22, 0.65 + Math.cos(ang)*0.08, Math.cos(ang)*0.22);
      lobe.castShadow=true; g.add(lobe);
    }
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.30, 8, 8), toonMat(0xd9694a));
    center.position.y = 0.8; center.castShadow=true; g.add(center);
  } else {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.13,0.7,6), toonMat(0x4a3020));
    trunk.position.y = 0.35; trunk.castShadow=true; g.add(trunk);
    const top = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 10), toonMat(0x5a8a50));
    top.position.y = 0.95; top.castShadow=true; g.add(top);
    const top2 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), toonMat(0x73a45c));
    top2.position.set(0.2, 1.05, -0.1); top2.castShadow=true; g.add(top2);
  }
  return g;
}

(function scatterTrees(){
  const rnd = mulberry32(20260521);
  let count = 0;
  for(let i=0;i<320 && count<180;i++){
    const x = (rnd()-0.5)*WORLD_SIZE*0.95;
    const z = (rnd()-0.5)*WORLD_SIZE*0.95;
    const y = terrainHeight(x,z);
    if(y < -0.5) continue;
    let near = false;
    for(const p of PLACES) if(Math.hypot(x-p.wx, z-p.wz) < 3.0){ near = true; break; }
    if(near) continue;
    if((Math.abs(x) < 1.6 && Math.abs(z) < 30) || (Math.abs(z) < 1.6 && Math.abs(x) < 30)) continue;
    if(Math.hypot(x+22, z+14) < 3) continue; // pond

    const r = rnd();
    const kind = r < 0.32 ? 'pine' : r < 0.55 ? 'broad' : r < 0.80 ? 'sakura' : 'momiji';
    const t = makeTreeMesh(kind, rnd);
    t.position.set(x, y, z);
    const s = 0.85 + rnd()*0.55;
    t.scale.setScalar(s);
    t.rotation.y = rnd()*Math.PI*2;
    scene.add(t);
    count++;
  }
})();

(function scatterRocks(){
  const rnd = mulberry32(20260522);
  const rockMat = toonMat(0x8a8067);
  const rockMatD = toonMat(0x6a6050);
  for(let i=0;i<80;i++){
    const x = (rnd()-0.5)*WORLD_SIZE*0.9;
    const z = (rnd()-0.5)*WORLD_SIZE*0.9;
    const y = terrainHeight(x,z);
    if(y < -0.6) continue;
    let near = false;
    for(const p of PLACES) if(Math.hypot(x-p.wx, z-p.wz) < 2.5){ near = true; break; }
    if(near) continue;
    if((Math.abs(x) < 1.6 && Math.abs(z) < 30) || (Math.abs(z) < 1.6 && Math.abs(x) < 30)) continue;
    const m = rnd() < 0.6 ? rockMat : rockMatD;
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3+rnd()*0.5, 0), m);
    r.position.set(x, y, z);
    r.rotation.set(rnd()*Math.PI, rnd()*Math.PI, rnd()*Math.PI);
    r.scale.y = 0.6 + rnd()*0.4;
    r.castShadow = true; r.receiveShadow = true;
    scene.add(r);
  }
})();

(function instancedGrass(){
  const c = document.createElement('canvas'); c.width = 16; c.height = 32;
  const cctx = c.getContext('2d');
  cctx.fillStyle = '#7ea14a';
  cctx.beginPath();
  cctx.moveTo(8, 32); cctx.lineTo(2, 0); cctx.lineTo(14, 0); cctx.closePath(); cctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;

  const geo = new THREE.PlaneGeometry(0.18, 0.4);
  geo.translate(0, 0.2, 0);
  const mat = new THREE.MeshLambertMaterial({color:0xffffff, side:THREE.DoubleSide, transparent:true, alphaTest:0.5, map: tex, alphaMap: tex});

  const N = 2200;
  const inst = new THREE.InstancedMesh(geo, mat, N);
  const dummy = new THREE.Object3D();
  const rnd = mulberry32(20260530);
  let added = 0;
  for(let i=0;i<N*3 && added<N;i++){
    const x = (rnd()-0.5)*WORLD_SIZE*0.9;
    const z = (rnd()-0.5)*WORLD_SIZE*0.9;
    const y = terrainHeight(x,z);
    if(y < -0.3) continue;
    if(Math.abs(x) < 1.5 && Math.abs(z) < 30) continue;
    if(Math.abs(z) < 1.5 && Math.abs(x) < 30) continue;
    dummy.position.set(x, y, z);
    dummy.rotation.y = rnd()*Math.PI*2;
    dummy.scale.set(0.6+rnd()*0.7, 0.6+rnd()*0.8, 1);
    dummy.updateMatrix();
    inst.setMatrixAt(added++, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  inst.count = added;
  scene.add(inst);
})();

function makeAvatar(){
  const g = new THREE.Group();

  const skin = toonMat(0xf2cba5);
  const cloth = toonMat(0x3e6a89);
  const trim = toonMat(0xe8dcb8);
  const pants = toonMat(0x2a1a14);
  const hair = toonMat(0x1a1410);
  const sash = toonMat(0xb04030);

  // pivot at feet
  const hip = new THREE.Group();
  hip.position.y = 0.36;
  g.add(hip);

  const pantsMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.20, 0.4, 8), pants);
  pantsMesh.position.y = -0.05; pantsMesh.castShadow = true;
  hip.add(pantsMesh);

  function leg(side){
    const l = new THREE.Group();
    l.position.set(side*0.07, -0.2, 0);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.35, 8), pants);
    upper.position.y = -0.18; upper.castShadow = true;
    l.add(upper);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.18), toonMat(0x3a2010));
    foot.position.set(0, -0.39, 0.04); foot.castShadow = true;
    l.add(foot);
    return l;
  }
  const legL = leg(-1); const legR = leg(1);
  hip.add(legL); hip.add(legR);

  const torso = new THREE.Group();
  torso.position.y = 0.18;
  hip.add(torso);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.42, 10), cloth);
  body.position.y = 0.15; body.castShadow = true;
  torso.add(body);
  const sashMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.08, 12), sash);
  sashMesh.position.y = 0.0;
  torso.add(sashMesh);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.03, 6, 16), trim);
  collar.position.y = 0.32; collar.rotation.x = Math.PI/2;
  torso.add(collar);

  function arm(side){
    const a = new THREE.Group();
    a.position.set(side*0.21, 0.32, 0);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.32, 8), cloth);
    upper.position.y = -0.16; upper.castShadow = true;
    a.add(upper);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), skin);
    hand.position.y = -0.34;
    a.add(hand);
    return a;
  }
  const armL = arm(-1); const armR = arm(1);
  torso.add(armL); torso.add(armR);

  const head = new THREE.Group();
  head.position.y = 0.42;
  torso.add(head);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.06,8), skin);
  neck.position.y = -0.05;
  head.add(neck);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 14), skin);
  skull.position.y = 0.06; skull.castShadow = true;
  head.add(skull);
  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.135, 16, 12, 0, Math.PI*2, 0, Math.PI*0.55), hair);
  hairCap.position.y = 0.06;
  head.add(hairCap);
  const bangs = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.1), hair);
  bangs.position.set(0, 0.135, 0.075); bangs.rotation.x = -0.12;
  head.add(bangs);
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8), hair);
  tuft.position.set(0, 0.04, -0.12);
  head.add(tuft);
  const eyeMat = new THREE.MeshBasicMaterial({color:0x1a1410});
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.015, 6, 6), eyeMat);
  eyeL.position.set(-0.04, 0.05, 0.12);
  head.add(eyeL);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.04;
  head.add(eyeR);
  const mouth = new THREE.Mesh(new THREE.PlaneGeometry(0.025, 0.005), new THREE.MeshBasicMaterial({color:0x4a2010}));
  mouth.position.set(0, 0.01, 0.13);
  head.add(mouth);
  const cheekMat = new THREE.MeshBasicMaterial({color:0xff9e8a, transparent:true, opacity:0.5});
  const ckL = new THREE.Mesh(new THREE.CircleGeometry(0.017, 8), cheekMat);
  ckL.position.set(-0.065, 0.03, 0.122);
  head.add(ckL);
  const ckR = ckL.clone(); ckR.position.x = 0.065;
  head.add(ckR);
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.10, 16), toonMat(0xd9a86a));
  hat.position.y = 0.18; hat.castShadow=true;
  head.add(hat);
  const hatRim = new THREE.Mesh(new THREE.TorusGeometry(0.20, 0.025, 6, 16), toonMat(0xb88a4a));
  hatRim.position.y = 0.155; hatRim.rotation.x = Math.PI/2;
  head.add(hatRim);

  // ground selection ring
  const ringMat = new THREE.MeshBasicMaterial({color:0x6BE07A, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false});
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.40, 32), ringMat);
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.02;
  g.add(ring);
  g.userData.ring = ring;

  g.userData.joints = { hip, torso, head, legL, legR, armL, armR };
  return g;
}

  if(e.code==='KeyS' || e.key==='ArrowDown')  keys.s = false;
  if(e.code==='KeyA' || e.key==='ArrowLeft')  keys.a = false;
  if(e.code==='KeyD' || e.key==='ArrowRight') keys.d = false;
  if(e.key==='Shift') keys.shift = false;
});

let pointerDown = false, dragMoved = false, lastPx=0, lastPy=0;
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  pointerDown = true; dragMoved = false;
  lastPx = e.clientX; lastPy = e.clientY;
});
canvas.addEventListener('pointermove', e=>{
  if(pointerDown){
    const dx = e.clientX-lastPx, dy = e.clientY-lastPy;
    if(Math.abs(dx)+Math.abs(dy)>4) dragMoved = true;
    camState.yaw   -= dx*0.0045;
    camState.pitch -= dy*0.003;
    camState.pitch = Math.max(0.15, Math.min(1.15, camState.pitch));
    lastPx=e.clientX; lastPy=e.clientY;
  } else {
    updateHoverLabel(e.clientX, e.clientY);
  }
});
canvas.addEventListener('pointerup', e=>{
  pointerDown = false;
  if(!dragMoved) handleCanvasClick(e.clientX, e.clientY);
});
canvas.addEventListener('pointercancel', ()=>{ pointerDown = false; });
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camState.dist *= (e.deltaY>0 ? 1.08 : 0.92);
  camState.dist = Math.max(8, Math.min(48, camState.dist));
}, {passive:false});

function handleCanvasClick(cx, cy){
  ndc.x = (cx / window.innerWidth) * 2 - 1;
  ndc.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const placeGroups = [...placeObjects.values()].map(v=>v.group);
  const placeHits = raycaster.intersectObjects(placeGroups, true);
  if(placeHits.length){
    let n = placeHits[0].object;
    while(n && !n.userData.placeId) n = n.parent;
    if(n){
      const p = PLACES.find(p=>p.id===n.userData.placeId);
      if(p){
        const d = Math.hypot(avatar.position.x-p.wx, avatar.position.z-p.wz);
        if(d < 3.0){ openModal(p); return; }
        moveTarget = new THREE.Vector3(p.wx, 0, p.wz);
        moveTarget.userData = { placeId: p.id };
        return;
      }
    }
  }
  const groundHits = raycaster.intersectObject(ground);
  if(groundHits.length){
    moveTarget = groundHits[0].point.clone();
    moveTarget.userData = {};
  }
}

function updateHoverLabel(cx, cy){
  ndc.x = (cx / window.innerWidth) * 2 - 1;
  ndc.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const placeGroups = [...placeObjects.values()].map(v=>v.group);
  const hits = raycaster.intersectObjects(placeGroups, true);
  const labelEl = document.getElementById('placelabel');
  if(hits.length){
    let n = hits[0].object;
    while(n && !n.userData.placeId) n = n.parent;
    if(n){
      const p = PLACES.find(p=>p.id===n.userData.placeId);
      if(p){
        labelEl.textContent = p.title;
        labelEl.style.left = cx + 'px';
        labelEl.style.top  = cy + 'px';
        labelEl.classList.add('show');
        canvas.style.cursor = 'pointer';
        return;
      }
    }
  }
  labelEl.classList.remove('show');
  canvas.style.cursor = 'default';
}

function nearestPlace(pos, maxD){
  let best=null, bd=maxD;
  for(const p of PLACES){
    const d = Math.hypot(pos.x-p.wx, pos.z-p.wz);
    if(d<bd){ bd=d; best=p; }
  }
  return best;
}

/* === UI: modal + hearts ================================= */
const modal = document.getElementById('modal');
const visited = new Set();
function updateHearts(){
  const total = PLACES.length;
  const root = document.getElementById('hearts');
  if(!root.children.length){
    for(let i=0;i<total;i++){
      const div = document.createElement('div');
      div.className='h';
      div.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C0 8 2 4 5.5 4c2 0 3.5 1 6.5 4 3-3 4.5-4 6.5-4 3.5 0 5.5 4 3 8.5C19 16.65 12 21 12 21z"/></svg>';
      root.appendChild(div);
    }
  }
  const got = visited.size;
  for(let i=0;i<total;i++) root.children[i].classList.toggle('on', i<got);
}
updateHearts();

function openModal(p){
  visited.add(p.id); updateHearts();
  document.getElementById('m-num').textContent  = p.num;
  document.getElementById('m-title').firstChild.nodeValue = p.title;
  document.getElementById('m-en').textContent   = p.en;
  document.getElementById('m-body').innerHTML   = p.body;
  const go = document.getElementById('m-go');
  if(p.href){
    go.href = p.href;
    go.classList.remove('disabled');
    document.getElementById('m-go-label').textContent = p.cta || 'VISIT';
  } else {
    go.href = 'javascript:void(0)';
    go.classList.add('disabled');
    document.getElementById('m-go-label').textContent = p.cta || 'CLOSE';
  }
  modal.classList.add('show');
}
function closeModal(){ modal.classList.remove('show'); }
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });

/* === Toolbar ============================================ */
const btnSound = document.getElementById('btn-sound');
const btnTime  = document.getElementById('btn-time');
const btnCam   = document.getElementById('btn-cam');

let nightMode = false;
let nightT = 0;
btnTime.addEventListener('click', ()=>{
  nightMode = !nightMode;
  btnTime.textContent = nightMode ? 'DAY' : 'NIGHT';
  btnTime.classList.toggle('active', nightMode);
});

btnCam.classList.add('active');
btnCam.addEventListener('click', ()=>{

// Sound
let audioCtx=null, ambient=null;
function startAmbient(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  ambient = audioCtx.createGain(); ambient.gain.value=0;
  ambient.connect(audioCtx.destination);
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*3, audioCtx.sampleRate);
  const nd = buf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<nd.length;i++){
    const w = Math.random()*2-1;
    b0 = 0.997*b0 + w*0.099; b1 = 0.963*b1 + w*0.297; b2 = 0.57*b2 + w*1.05;
    nd[i] = (b0+b1+b2+w*0.18) * 0.06;
  }
  const noise = audioCtx.createBufferSource(); noise.buffer = buf; noise.loop=true;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
  noise.connect(lp).connect(ambient); noise.start();
  function chime(){
    if(!ambient) return;
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type='sine';
    o.frequency.value=[440,523.25,587.33,659.25,783.99][Math.floor(Math.random()*5)];
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+2.8);
    o.connect(g).connect(ambient); o.start(); o.stop(audioCtx.currentTime+2.9);
    setTimeout(chime, 6000+Math.random()*8000);
  }
  setTimeout(chime, 3000);
  ambient.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime+1.5);
}
function stopAmbient(){
  if(ambient){
    const a = ambient; const ctx = audioCtx;
    a.gain.linearRampToValueAtTime(0, ctx.currentTime+0.6);
    setTimeout(()=>{ try{ a.disconnect(); }catch(e){} }, 800);
    ambient = null;
  }
}
btnSound.addEventListener('click', ()=>{
  const on = btnSound.classList.toggle('active');
  btnSound.textContent = on ? 'SOUND · ON' : 'SOUND · OFF';
  btnSound.setAttribute('aria-pressed', on?'true':'false');
  if(on) startAmbient(); else stopAmbient();
});

/* === Post-processing ===================================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.7, 0.85);
composer.addPass(bloom);
const smaa = new SMAAPass(window.innerWidth*renderer.getPixelRatio(), window.innerHeight*renderer.getPixelRatio());
composer.addPass(smaa);
composer.addPass(new OutputPass());

/* === Mini-map ============================================ */
const mini = document.getElementById('mini');
mini.width = 200; mini.height = 200;
const mctx = mini.getContext('2d');
function drawMini(){
  const w = mini.width, h = mini.height;
  mctx.fillStyle = nightMode ? '#0a1620' : '#dfecda';
  mctx.fillRect(0,0,w,h);
  const wxToMx = wx => (wx/WORLD_SIZE+0.5)*w;
  const wzToMy = wz => (wz/WORLD_SIZE+0.5)*h;
  mctx.strokeStyle = '#b89a6a'; mctx.lineWidth = 4;
  mctx.beginPath();
  mctx.moveTo(wxToMx(-28), wzToMy(0)); mctx.lineTo(wxToMx(28), wzToMy(0));
  mctx.moveTo(wxToMx(0), wzToMy(-28)); mctx.lineTo(wxToMx(0), wzToMy(28));
  mctx.stroke();
  // water
  mctx.fillStyle = '#6fa8c7';
  mctx.beginPath(); mctx.arc(wxToMx(18), wzToMy(16), 8.5/WORLD_SIZE*w, 0, Math.PI*2); mctx.fill();
  mctx.beginPath(); mctx.arc(wxToMx(-22), wzToMy(-14), 2/WORLD_SIZE*w, 0, Math.PI*2); mctx.fill();
  // places
  for(const p of PLACES){
    mctx.fillStyle = visited.has(p.id) ? '#b04030' : '#3a3024';
    mctx.beginPath(); mctx.arc(wxToMx(p.wx), wzToMy(p.wz), 4.5, 0, Math.PI*2); mctx.fill();
  }
  // avatar
  mctx.fillStyle = '#ffb968';
  mctx.beginPath(); mctx.arc(wxToMx(avatar.position.x), wzToMy(avatar.position.z), 4.5, 0, Math.PI*2); mctx.fill();
  mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5; mctx.stroke();
}

/* === Loop ================================================ */
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();

function animate(){
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  let moving = false;
  const moveSpeed = (keys.shift ? 6.0 : 3.4);

  let mx = 0, mz = 0;
  if(keys.w) mz -= 1;
  if(keys.s) mz += 1;
  if(keys.a) mx -= 1;
  if(keys.d) mx += 1;
  if(mx || mz){
    const len = Math.hypot(mx,mz); mx/=len; mz/=len;
    const yaw = camState.yaw;
    const wx = mx*Math.cos(yaw) - mz*Math.sin(yaw);
    const wz = mx*Math.sin(yaw) + mz*Math.cos(yaw);
    avatar.position.x += wx * moveSpeed * dt;
    avatar.position.z += wz * moveSpeed * dt;
    avatar.lookAt(avatar.position.x + wx, avatar.position.y, avatar.position.z + wz);
    moving = true;
    moveTarget = null;
  } else if(moveTarget){
    const dx = moveTarget.x - avatar.position.x;
    const dz = moveTarget.z - avatar.position.z;
    const d = Math.hypot(dx, dz);
    if(d < 0.18){
      if(moveTarget.userData && moveTarget.userData.placeId){
        const p = PLACES.find(p=>p.id===moveTarget.userData.placeId);
        if(p) openModal(p);
      }
      moveTarget = null;
    } else {
      const sp = moveSpeed * dt;
      avatar.position.x += dx/d * sp;
      avatar.position.z += dz/d * sp;
      avatar.lookAt(avatar.position.x + dx, avatar.position.y, avatar.position.z + dz);
      moving = true;
    }
  }
  avatar.position.x = Math.max(-HALF+1, Math.min(HALF-1, avatar.position.x));
  avatar.position.z = Math.max(-HALF+1, Math.min(HALF-1, avatar.position.z));
  avatar.position.y = terrainHeight(avatar.position.x, avatar.position.z);

  const joints = avatar.userData.joints;
  if(moving){
    const sw = Math.sin(t*10);
    joints.legL.rotation.x = sw * 0.55;
    joints.legR.rotation.x = -sw * 0.55;
    joints.armL.rotation.x = -sw * 0.45;
    joints.armR.rotation.x = sw * 0.45;
    joints.torso.position.y = 0.18 + Math.abs(sw)*0.025;
  } else {
    const idle = Math.sin(t*1.6)*0.04;
    joints.legL.rotation.x *= 0.85; joints.legR.rotation.x *= 0.85;
    joints.armL.rotation.x = idle; joints.armR.rotation.x = -idle;
    joints.torso.position.y = 0.18 + idle*0.4;
  }
  joints.head.rotation.y = Math.sin(t*0.4)*0.1;

  if(camFollow){
    camState.target.lerp(avatar.position, 0.12);
  }
  const cx = camState.target.x + Math.sin(camState.yaw)*Math.cos(camState.pitch)*camState.dist;
  const cy = camState.target.y + Math.sin(camState.pitch)*camState.dist + 0.3;
  const cz = camState.target.z + Math.cos(camState.yaw)*Math.cos(camState.pitch)*camState.dist;
  camera.position.set(cx, cy, cz);
  camera.lookAt(camState.target.x, camState.target.y+1.0, camState.target.z);

  // day/night
  const tgtN = nightMode ? 1 : 0;
  nightT += (tgtN-nightT)*Math.min(1, dt*1.0);
  sun.intensity = 2.4 * (1-nightT) + 0.2;
  hemi.intensity = 0.55 * (1-nightT*0.85);
  moon.intensity = 0.5 * nightT;
  ambient.intensity = 0.18 + 0.08*nightT;
  // env map swap (with simple threshold to avoid flicker)
  if(nightT > 0.55 && envNight && scene.environment !== envNight) scene.environment = envNight;
  if(nightT < 0.45 && envDay && scene.environment !== envDay) scene.environment = envDay;
  // Use HDR background when available (photoreal sky), darken at night via toneMapping exposure
  renderer.toneMappingExposure = 1.05 * (1 - nightT*0.55) + 0.25;
  if(scene.background instanceof THREE.Color){
    const dayBg = new THREE.Color('#9ec6d8');
    const nightBg = new THREE.Color('#10182a');
    scene.background.copy(dayBg).lerp(nightBg, nightT);
  }
  scene.fog.color = (scene.background instanceof THREE.Color)
    ? scene.background.clone()
    : new THREE.Color('#9ec6d8').lerp(new THREE.Color('#10182a'), nightT);
  scene.fog.near = 60 - nightT*15;
  scene.fog.far = 140 - nightT*40;
  skySun.material.opacity = (1-nightT);
  skyMoon.material.opacity = nightT;
  starMat.opacity = nightT;
  scene.traverse(o=>{
    if(o.userData && o.userData.lamp && o.material && o.material.emissive){
      o.material.emissiveIntensity = nightT * 1.4;
    }
    if(o.userData && o.userData.lampLight){
      o.userData.lampLight.intensity = 1.3 * nightT;
    }
    if(o.userData && o.userData.flame){
      o.position.y = 0.7 + Math.sin(t*8 + o.userData.flame*2)*0.05;
      o.scale.y = 1 + Math.sin(t*9 + o.userData.flame)*0.08;
      o.rotation.y = Math.sin(t*4 + o.userData.flame)*0.2;
    }
    if(o.userData && o.userData.flameLight){
      o.userData.flameLight.intensity = 1.8 + Math.sin(t*15)*0.4;
    }
    if(o.userData && o.userData.boat){
      o.userData.boat.rotation.z = Math.sin(t*1.2)*0.04;
      o.userData.boat.position.y = -0.05 + Math.sin(t*1.2)*0.02;
    }
    if(o.userData && o.userData.role==='hourhand'){
      o.rotation.z = -t*0.04;
    }
    if(o.userData && o.userData.role==='minhand'){
      o.rotation.z = -t*0.5;
    }
  });

  // NPCs
  for(const n of NPCS){
    const ud = n.userData;
    const path = ud.path;
    const tgt = path[(ud.wp+1)%path.length];
    const dxn = tgt[0]-n.position.x, dzn = tgt[1]-n.position.z;
    const dn = Math.hypot(dxn,dzn);
    const step = ud.speed * dt;
    if(dn < step*1.5){
      n.position.x = tgt[0]; n.position.z = tgt[1];
      ud.wp = (ud.wp+1)%path.length;
    } else {
      n.position.x += dxn/dn*step;
      n.position.z += dzn/dn*step;
      n.lookAt(tgt[0], n.position.y, tgt[1]);
    }
    n.position.y = terrainHeight(n.position.x, n.position.z);
    const swn = Math.sin(t*9 + ud.wp);
    if(ud.joints){
      ud.joints.legL.rotation.x = swn*0.5;
      ud.joints.legR.rotation.x = -swn*0.5;
      ud.joints.body.position.y = 0.48 + Math.abs(swn)*0.02;
    }
    const now = performance.now();
    if(now > ud.nextBubbleAt && !ud.bubbleText){
      ud.bubbleText = NPC_PHRASES[Math.floor(Math.random()*NPC_PHRASES.length)];
      ud.bubbleUntil = now + 2800;
      ud.nextBubbleAt = now + 7000 + Math.random()*8000;
      ud.bubbleEl.textContent = ud.bubbleText;
    }
    if(ud.bubbleText && now > ud.bubbleUntil) ud.bubbleText = null;
    if(ud.bubbleText){
      tmpVec.set(n.position.x, n.position.y+1.5, n.position.z).project(camera);
      if(tmpVec.z < 1){
        const sx = (tmpVec.x*0.5+0.5)*window.innerWidth;
        const sy = (-tmpVec.y*0.5+0.5)*window.innerHeight;
        ud.bubbleEl.style.left = sx+'px';
        ud.bubbleEl.style.top = sy+'px';
        ud.bubbleEl.classList.add('show');
      } else {
        ud.bubbleEl.classList.remove('show');
      }
    } else {
      ud.bubbleEl.classList.remove('show');
    }
  }

  // clouds
  for(const c of CLOUDS){
    c.position.x += c.userData.vx * dt;
    if(c.position.x > HALF+15){ c.position.x = -HALF-15; c.position.z = (Math.random()-0.5)*60; }
    c.children.forEach(p=>{ p.material.opacity = (1-nightT)*0.85; });
  }

  // petals
  for(const p of PETALS){
    p.position.y += p.userData.vy * dt;
    p.position.x += p.userData.vx * dt;
    p.userData.spin += p.userData.spinSpeed * dt;
    p.rotation.set(p.userData.spin, p.userData.spin*0.7, 0);
    if(p.position.y < 0.05){
      p.position.set((Math.random()-0.5)*WORLD_SIZE*0.7, 7+Math.random()*4, (Math.random()-0.5)*WORLD_SIZE*0.7);
    }
  }

  // fireflies
  for(const f of FIREFLIES){
    f.userData.phase += dt*1.5;
    f.position.x = f.userData.cx + Math.sin(f.userData.phase)*0.6;
    f.position.z = f.userData.cz + Math.cos(f.userData.phase*0.9)*0.6;
    f.position.y = 0.7 + terrainHeight(f.position.x, f.position.z) + Math.sin(f.userData.phase*1.2)*0.35;
    f.material.opacity = nightT * (0.4 + 0.6*Math.abs(Math.sin(f.userData.phase*2.5)));
  }

  drawMini();
  composer.render();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

setLoad(1.0, 'READY');
setTimeout(()=>{
  const sp = document.getElementById('splash');
  if(sp) sp.classList.add('hidden');
  setTimeout(()=>{ if(sp) sp.remove(); }, 900);
}, 350);

animate();

</script>
