<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quest Test</title>
  <script>
    window.onload = () => {
      const iframe = document.getElementById('f');
      iframe.onload = () => {
        const w = iframe.contentWindow;
        setTimeout(() => {
          w.EHON.open();
          setTimeout(() => {
            w.EHON.enterWorld();
            setTimeout(() => {
              const banner = w.document.querySelector('.quest-banner');
              const spots = w.document.querySelectorAll('.quest-spot');
              const results = [];
              results.push('banner=' + (banner ? 'OK' : 'MISSING'));
              results.push('spots=' + spots.length);
              results.push('bannerText=' + (banner ? banner.innerText.replace(/\n/g,' ').trim() : 'n/a'));
              document.getElementById('result').textContent = results.join(' | ');
              document.title = 'RESULT: ' + results.join(', ');
            }, 2000);
          }, 1000);
        }, 1500);
      };
    };
  </script>
</head>
<body style="margin:0">
<div id="result" style="position:fixed;top:0;left:0;z-index:9999;background:#fff;padding:8px;font:13px monospace;max-width:100%">loading...</div>
<iframe id="f" src="http://localhost:8777/ehon.html" style="width:100vw;height:100vh;border:0"></iframe>
</body>
</html>
