<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>lingo — YouTube English × 日本語</title>
  <link rel="icon" href="favicon.svg" />
  <style>
    :root {
      --bg: #0b0d11;
      --fg: #e6e8ec;
      --dim: #9aa3b2;
      --accent: #6ea8ff;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px;
      color: var(--dim);
      letter-spacing: 0.04em;
    }
    h1 .accent { color: var(--accent); }
    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 960px;
      margin-bottom: 20px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: var(--fg);
      font-size: 15px;
    }
    .input-row button {
      padding: 10px 18px;
      background: var(--accent);
      color: #0b0d11;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-row button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #player-wrap {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    #player-wrap iframe { width: 100%; height: 100%; border: 0; }
    #subtitles {
      width: 100%;
      max-width: 960px;
      min-height: 96px;
      padding: 20px 8px;
      text-align: center;
    }
    #sub-en {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--fg);
    }
    #sub-ja {
      font-size: 20px;
      line-height: 1.4;
      color: var(--dim);
      margin-top: 8px;
    }
    #status {
      margin-top: 12px;
      color: var(--dim);
      font-size: 14px;
      min-height: 20px;
    }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <h1>🌍 <span class="accent">lingo</span> — YouTube English × 日本語</h1>
  <div class="input-row">
    <input id="url-input" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" />
    <button id="load-btn">読み込む</button>
  </div>
  <div id="player-wrap"></div>
  <div id="subtitles">
    <div id="sub-en"></div>
    <div id="sub-ja"></div>
  </div>
  <div id="status"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    (function () {
      const ID_RE = /^[A-Za-z0-9_-]{11}$/;

      function extractVideoId(input) {
        if (!input) return null;
        const trimmed = input.trim();
        if (ID_RE.test(trimmed)) return trimmed;
        try {
          const u = new URL(trimmed);
          if (u.hostname === 'youtu.be') {
            const id = u.pathname.slice(1);
            return ID_RE.test(id) ? id : null;
          }
          if (u.hostname.endsWith('youtube.com')) {
            const v = u.searchParams.get('v');
            if (v && ID_RE.test(v)) return v;
            const m = u.pathname.match(/^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/);
            if (m) return m[1];
          }
        } catch (e) {
          return null;
        }
        return null;
      }

      function findActiveCue(cues, t) {
        if (!cues || !cues.length) return null;
        let lo = 0, hi = cues.length - 1;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          const c = cues[mid];
          if (t < c.start) hi = mid - 1;
          else if (t >= c.end) lo = mid + 1;
          else return c;
        }
        return null;
      }

      if (window.location.search.includes('selftest=1')) {
        console.assert(extractVideoId('https://youtu.be/dQw4w9WgXcQ') === 'dQw4w9WgXcQ', 'youtu.be');
        console.assert(extractVideoId('https://www.youtube.com/watch?v=dQw4w9WgXcQ') === 'dQw4w9WgXcQ', 'watch');
        console.assert(extractVideoId('https://www.youtube.com/shorts/dQw4w9WgXcQ') === 'dQw4w9WgXcQ', 'shorts');
        console.assert(extractVideoId('not-a-url') === null, 'invalid');
        const cues = [{start:0,end:2,en:'a'},{start:2,end:4,en:'b'},{start:5,end:7,en:'c'}];
        console.assert(findActiveCue(cues, 1) && findActiveCue(cues, 1).en === 'a', 'cue@1');
        console.assert(findActiveCue(cues, 3) && findActiveCue(cues, 3).en === 'b', 'cue@3');
        console.assert(findActiveCue(cues, 4.5) === null, 'gap@4.5');
        console.assert(findActiveCue(cues, 6) && findActiveCue(cues, 6).en === 'c', 'cue@6');
        console.log('lingo selftest passed');
      }

      window.__lingo = { extractVideoId, findActiveCue };
    })();
  </script>
  <script>
    const WORKER_URL = 'https://lingo-transcript.yuichi916.workers.dev';
    const { extractVideoId, findActiveCue } = window.__lingo;

    const urlInput = document.getElementById('url-input');
    const loadBtn = document.getElementById('load-btn');
    const playerWrap = document.getElementById('player-wrap');
    const subEn = document.getElementById('sub-en');
    const subJa = document.getElementById('sub-ja');
    const statusEl = document.getElementById('status');

    let player = null;
    let cues = [];
    let pollTimer = null;
    let lastShownAt = 0;
    const GRACE_MS = 500;

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('error', !!isError);
    }

    function clearSubtitles() {
      subEn.textContent = '';
      subJa.textContent = '';
    }

    function renderCue(cue) {
      subEn.textContent = cue.en || '';
      subJa.textContent = cue.ja || '';
      lastShownAt = Date.now();
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const t = player.getCurrentTime();
        const c = findActiveCue(cues, t);
        if (c) {
          renderCue(c);
        } else if (Date.now() - lastShownAt > GRACE_MS) {
          clearSubtitles();
        }
      }, 250);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function mountPlayer(videoId) {
      playerWrap.innerHTML = '<div id="player"></div>';
      if (player) { try { player.destroy(); } catch (e) {} player = null; }
      player = new YT.Player('player', {
        videoId,
        playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
          onReady: () => startPolling(),
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED || e.data === YT.PlayerState.PAUSED) {
              // keep current cue visible
            }
          },
        },
      });
    }

    async function loadVideo() {
      const raw = urlInput.value.trim();
      const videoId = extractVideoId(raw);
      if (!videoId) {
        setStatus('YouTube の URL を確認してください', true);
        return;
      }
      setStatus('字幕を取得中...');
      loadBtn.disabled = true;
      clearSubtitles();
      cues = [];

      try {
        const res = await fetch(`${WORKER_URL}/api/transcript?v=${videoId}`);
        if (res.status === 404) {
          mountPlayer(videoId);
          setStatus('この動画には英字幕がありません', true);
          loadBtn.disabled = false;
          return;
        }
        if (!res.ok) {
          mountPlayer(videoId);
          setStatus('字幕の取得に失敗しました。少し待って再試行してください', true);
          loadBtn.disabled = false;
          return;
        }
        const data = await res.json();
        cues = data.cues || [];
        mountPlayer(videoId);
        setStatus(`${cues.length} cues 読み込み済み`);
      } catch (err) {
        mountPlayer(videoId);
        setStatus('字幕の取得に失敗しました。少し待って再試行してください', true);
      } finally {
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener('click', loadVideo);
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadVideo(); });

    window.onYouTubeIframeAPIReady = () => { /* player mounted lazily on loadVideo */ };
  </script>
</body>
</html>
