<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>lingo — YouTube English × 日本語</title>
  <link rel="icon" href="favicon.svg" />
  <style>
    :root {
      --bg: #0b0d11;
      --fg: #e6e8ec;
      --dim: #9aa3b2;
      --accent: #6ea8ff;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px;
      color: var(--dim);
      letter-spacing: 0.04em;
    }
    h1 .accent { color: var(--accent); }
    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 960px;
      margin-bottom: 20px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: var(--fg);
      font-size: 15px;
    }
    .input-row select {
      padding: 10px 12px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: var(--fg);
      font-size: 14px;
      cursor: pointer;
    }
    .input-row button {
      padding: 10px 18px;
      background: var(--accent);
      color: #0b0d11;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-row button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #player-wrap {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    #player-wrap iframe { width: 100%; height: 100%; border: 0; }
    #player-wrap.hidden { display: none; }
    #results {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 720px) { #results { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 440px) { #results { grid-template-columns: 1fr; } }
    #results.hidden { display: none; }
    .result-card {
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
    }
    .result-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .result-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .result-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .result-duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 600;
    }
    .result-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
    .result-title {
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .result-meta { color: var(--dim); font-size: 12px; }
    #subtitles {
      width: 100%;
      max-width: 960px;
      min-height: 96px;
      padding: 20px 8px;
      text-align: center;
    }
    #sub-en {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--fg);
      white-space: pre-line;
    }
    #sub-ja {
      font-size: 20px;
      line-height: 1.4;
      color: var(--dim);
      margin-top: 8px;
      white-space: pre-line;
    }
    .ka-past { display: none; }
    .ka-current {
      color: var(--accent);
      background: rgba(110, 168, 255, 0.18);
      border-radius: 4px;
      padding: 0 2px;
    }
    #sub-en .ka-future { color: var(--fg); }
    #sub-ja .ka-future { color: var(--dim); }
    .toggle-btn {
      padding: 10px 14px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: var(--dim);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .toggle-btn.on {
      background: rgba(110, 168, 255, 0.18);
      border-color: var(--accent);
      color: var(--accent);
    }
    #status {
      margin-top: 12px;
      color: var(--dim);
      font-size: 14px;
      min-height: 20px;
    }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <h1>🌍 <span class="accent">lingo</span> — YouTube English × 日本語</h1>
  <div class="input-row">
    <input id="url-input" type="text" placeholder="YouTube URL or 検索キーワード" autocomplete="off" />
    <select id="sort-select" title="検索ソート (URLのときは無視)">
      <option value="relevance">関連度順</option>
      <option value="date">新着順</option>
      <option value="views">再生数順</option>
      <option value="rating">高評価順</option>
    </select>
    <button id="hl-toggle" class="toggle-btn" title="今読んでいる箇所をハイライトし、読み終わった単語を消す">強調 OFF</button>
    <button id="load-btn">読み込む / 検索</button>
  </div>
  <div id="player-wrap"></div>
  <div id="results" class="hidden"></div>
  <div id="subtitles">
    <div id="sub-en"></div>
    <div id="sub-ja"></div>
  </div>
  <div id="status"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    (function () {
      const ID_RE = /^[A-Za-z0-9_-]{11}$/;

      function extractVideoId(input) {
        if (!input) return null;
        const trimmed = input.trim();
        if (ID_RE.test(trimmed)) return trimmed;
        try {
          const u = new URL(trimmed);
          if (u.hostname === 'youtu.be') {
            const id = u.pathname.slice(1);
            return ID_RE.test(id) ? id : null;
          }
          if (u.hostname.endsWith('youtube.com')) {
            const v = u.searchParams.get('v');
            if (v && ID_RE.test(v)) return v;
            const m = u.pathname.match(/^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/);
            if (m) return m[1];
          }
        } catch (e) {
          return null;
        }
        return null;
      }

      function findActiveCue(cues, t) {
        if (!cues || !cues.length) return null;
        let lo = 0, hi = cues.length - 1;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          const c = cues[mid];
          if (t < c.start) hi = mid - 1;
          else if (t >= c.end) lo = mid + 1;
          else return c;
        }
        return null;
      }

      function findActiveCues(cues, t) {
        if (!cues || !cues.length) return [];
        const out = [];
        for (let i = 0; i < cues.length; i++) {
          const c = cues[i];
          if (c.start <= t && t < c.end) out.push(c);
          else if (c.start > t) break;
        }
        return out;
      }

      if (window.location.search.includes('selftest=1')) {
        console.assert(extractVideoId('https://youtu.be/dQw4w9WgXcQ') === 'dQw4w9WgXcQ', 'youtu.be');
        console.assert(extractVideoId('https://www.youtube.com/watch?v=dQw4w9WgXcQ') === 'dQw4w9WgXcQ', 'watch');
        console.assert(extractVideoId('https://www.youtube.com/shorts/dQw4w9WgXcQ') === 'dQw4w9WgXcQ', 'shorts');
        console.assert(extractVideoId('not-a-url') === null, 'invalid');
        const cues = [{start:0,end:2,en:'a'},{start:2,end:4,en:'b'},{start:5,end:7,en:'c'}];
        console.assert(findActiveCue(cues, 1) && findActiveCue(cues, 1).en === 'a', 'cue@1');
        console.assert(findActiveCue(cues, 3) && findActiveCue(cues, 3).en === 'b', 'cue@3');
        console.assert(findActiveCue(cues, 4.5) === null, 'gap@4.5');
        console.assert(findActiveCue(cues, 6) && findActiveCue(cues, 6).en === 'c', 'cue@6');
        const ov = [{start:0,end:5,en:'a'},{start:2,end:6,en:'b'},{start:4,end:8,en:'c'}];
        const at3 = findActiveCues(ov, 3); console.assert(at3.length === 2 && at3[0].en==='a' && at3[1].en==='b', 'overlap@3');
        const at5 = findActiveCues(ov, 5); console.assert(at5.length === 2 && at5[0].en==='b' && at5[1].en==='c', 'overlap@5');
        console.log('lingo selftest passed');
      }

      window.__lingo = { extractVideoId, findActiveCue, findActiveCues };
    })();
  </script>
  <script>
    const WORKER_URL = 'https://lingo-transcript.yuichi916.workers.dev';
    const { extractVideoId, findActiveCue, findActiveCues } = window.__lingo;

    const urlInput = document.getElementById('url-input');
    const sortSelect = document.getElementById('sort-select');
    const hlToggle = document.getElementById('hl-toggle');
    const loadBtn = document.getElementById('load-btn');
    const playerWrap = document.getElementById('player-wrap');
    const resultsEl = document.getElementById('results');
    const subEn = document.getElementById('sub-en');
    const subJa = document.getElementById('sub-ja');
    const statusEl = document.getElementById('status');

    let player = null;
    let cues = [];
    let pollTimer = null;
    let highlightMode = localStorage.getItem('lingo.hl') === '1';
    applyHighlightToggleUI();
    hlToggle.addEventListener('click', () => {
      highlightMode = !highlightMode;
      localStorage.setItem('lingo.hl', highlightMode ? '1' : '0');
      applyHighlightToggleUI();
    });
    function applyHighlightToggleUI() {
      hlToggle.classList.toggle('on', highlightMode);
      hlToggle.textContent = highlightMode ? '強調 ON' : '強調 OFF';
    }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('error', !!isError);
    }

    function clearSubtitles() {
      subEn.textContent = '';
      subJa.textContent = '';
    }

    function renderActiveCues(active, t) {
      if (highlightMode) {
        const enHTML = active.map((c) => renderKaraoke(c.en, c, t)).filter(Boolean).join('<br>');
        const jaHTML = active.map((c) => renderKaraoke(c.ja, c, t)).filter(Boolean).join('<br>');
        subEn.innerHTML = enHTML;
        subJa.innerHTML = jaHTML;
      } else {
        const enLines = active.map((c) => c.en).filter(Boolean);
        const jaLines = active.map((c) => c.ja).filter(Boolean);
        subEn.textContent = enLines.join('\n');
        subJa.textContent = jaLines.join('\n');
      }
    }

    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
    }

    function tokenizeForKaraoke(text) {
      const tokens = [];
      let buf = '';
      for (const ch of text) {
        if (/\s/.test(ch)) {
          if (buf) { tokens.push(buf); buf = ''; }
          tokens.push(ch);
        } else if (/[぀-ヿ㐀-鿿ｦ-ￜ]/.test(ch)) {
          if (buf) { tokens.push(buf); buf = ''; }
          tokens.push(ch);
        } else {
          buf += ch;
        }
      }
      if (buf) tokens.push(buf);
      return tokens;
    }

    function renderKaraoke(text, cue, t) {
      if (!text) return '';
      const dur = Math.max(0.001, cue.end - cue.start);
      const elapsed = Math.max(0, Math.min(dur, t - cue.start));
      const progress = elapsed / dur;
      const tokens = tokenizeForKaraoke(text);
      // Treat whitespace tokens as zero-weight (they don't count as "spoken units")
      const wordIdx = [];
      tokens.forEach((tok, i) => { if (!/^\s+$/.test(tok)) wordIdx.push(i); });
      if (!wordIdx.length) return escHtml(text);
      const currentNth = Math.min(wordIdx.length - 1, Math.floor(progress * wordIdx.length));
      const currentTokenIdx = wordIdx[currentNth];
      // past: tokens before currentTokenIdx (drop leading whitespace too) → hidden
      // current: tokens[currentTokenIdx] → highlighted
      // future: tokens after → normal
      const past = tokens.slice(0, currentTokenIdx).join('');
      const cur = tokens[currentTokenIdx] || '';
      const fut = tokens.slice(currentTokenIdx + 1).join('');
      return (
        `<span class="ka-past">${escHtml(past)}</span>` +
        `<span class="ka-current">${escHtml(cur)}</span>` +
        `<span class="ka-future">${escHtml(fut)}</span>`
      );
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const t = player.getCurrentTime();
        const active = findActiveCues(cues, t);
        if (active.length) {
          renderActiveCues(active, t);
        } else {
          clearSubtitles();
        }
      }, 200);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function mountPlayer(videoId) {
      playerWrap.innerHTML = '<div id="player"></div>';
      if (player) { try { player.destroy(); } catch (e) {} player = null; }
      player = new YT.Player('player', {
        videoId,
        playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
        events: {
          onReady: () => startPolling(),
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED || e.data === YT.PlayerState.PAUSED) {
              // keep current cue visible
            }
          },
        },
      });
    }

    function showResults() {
      resultsEl.classList.remove('hidden');
      playerWrap.classList.add('hidden');
      clearSubtitles();
    }

    function hideResults() {
      resultsEl.classList.add('hidden');
      playerWrap.classList.remove('hidden');
    }

    function renderResults(items) {
      resultsEl.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.style.gridColumn = '1 / -1';
        empty.style.color = 'var(--dim)';
        empty.style.textAlign = 'center';
        empty.style.padding = '24px';
        empty.textContent = 'ヒットなし';
        resultsEl.appendChild(empty);
        return;
      }
      for (const it of items) {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-thumb">
            <img src="${escapeHtml(it.thumbnail)}" alt="" loading="lazy" />
            ${it.duration ? `<div class="result-duration">${escapeHtml(it.duration)}</div>` : ''}
          </div>
          <div class="result-body">
            <div class="result-title">${escapeHtml(it.title)}</div>
            <div class="result-meta">${escapeHtml(it.channel)}${it.views ? ' · ' + escapeHtml(it.views) : ''}</div>
          </div>
        `;
        card.addEventListener('click', () => loadByVideoId(it.videoId));
        resultsEl.appendChild(card);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
    }

    async function loadByVideoId(videoId) {
      setStatus('字幕を取得中...');
      loadBtn.disabled = true;
      hideResults();
      clearSubtitles();
      cues = [];
      let srcLang = 'en';
      try {
        const res = await fetch(`${WORKER_URL}/api/transcript?v=${videoId}`);
        if (res.status === 404) {
          mountPlayer(videoId);
          setStatus('この動画には英字幕がありません', true);
          return;
        }
        if (res.status === 503) {
          mountPlayer(videoId);
          setStatus('YouTube が一時的に制限中です。数十秒待って再試行してください', true);
          return;
        }
        if (!res.ok) {
          mountPlayer(videoId);
          setStatus('字幕の取得に失敗しました。少し待って再試行してください', true);
          return;
        }
        const data = await res.json();
        cues = data.cues || [];
        srcLang = data?.lang?.from || 'en';
        mountPlayer(videoId);
        setStatus(`${cues.length} cues 読み込み済み`);
      } catch (err) {
        mountPlayer(videoId);
        setStatus('字幕の取得に失敗しました。少し待って再試行してください', true);
        return;
      } finally {
        loadBtn.disabled = false;
      }

      backfillMissingTranslations(cues, srcLang).catch(() => {});
    }

    const SEP = '\n\n␞\n\n';
    const SEP_ENC_LEN = encodeURIComponent(SEP).length;
    const LINGVA_BUDGET = 3000;
    const LINGVA = ['https://lingva.ml', 'https://lingva.lunar.icu'];

    async function backfillMissingTranslations(cuesArr, srcLang) {
      const sides = [];
      // Side ja: needed for any cue with empty ja
      if (cuesArr.some((c) => !c.ja)) {
        const srcFor = srcLang === 'ja' ? 'ja' : srcLang;
        sides.push({ target: 'ja', from: srcFor, pickSrc: (c) => (srcFor === 'ja' ? c.ja : c.en || c.ja) || '' });
      }
      // Side en: needed for any cue with empty en (non-en source videos)
      if (cuesArr.some((c) => !c.en)) {
        const srcFor = srcLang === 'en' ? 'en' : srcLang;
        sides.push({ target: 'en', from: srcFor, pickSrc: (c) => (srcFor === 'en' ? c.en : c.ja || c.en) || '' });
      }
      if (!sides.length) return;

      setStatus('字幕を逐次補完中...');
      const totals = { ja: 0, en: 0 };
      const dones = { ja: 0, en: 0 };

      await Promise.all(sides.map((side) => backfillSideIncremental(cuesArr, side, totals, dones)));

      const remEn = cuesArr.filter((c) => !c.en).length;
      const remJa = cuesArr.filter((c) => !c.ja).length;
      if (remEn === 0 && remJa === 0) {
        setStatus(`${cuesArr.length} cues 全て補完完了`);
      } else {
        setStatus(`補完完了 (EN欠損 ${remEn} / JA欠損 ${remJa})`, remEn + remJa > cuesArr.length / 4);
      }
    }

    async function backfillSideIncremental(cuesArr, side, totals, dones) {
      // Collect cues that need this side, ordered by closeness to current playback position
      const missIndices = [];
      for (let i = 0; i < cuesArr.length; i++) if (!cuesArr[i][side.target]) missIndices.push(i);
      if (!missIndices.length) return;

      const sortByCurrent = () => {
        const t = (player && typeof player.getCurrentTime === 'function') ? player.getCurrentTime() : 0;
        missIndices.sort((a, b) => {
          const da = Math.abs((cuesArr[a].start + cuesArr[a].end) / 2 - t);
          const db = Math.abs((cuesArr[b].start + cuesArr[b].end) / 2 - t);
          return da - db;
        });
      };
      sortByCurrent();

      const orderedSources = missIndices.map((i) => side.pickSrc(cuesArr[i]));
      const validIndices = [];
      const validSources = [];
      for (let k = 0; k < missIndices.length; k++) {
        if (orderedSources[k]) { validIndices.push(missIndices[k]); validSources.push(orderedSources[k]); }
      }
      if (!validSources.length) return;

      totals[side.target] = validSources.length;

      // Chunk by byte budget
      const groups = [];
      const groupIdx = [];
      let cur = [];
      let curIdx = [];
      let curBytes = 0;
      for (let k = 0; k < validSources.length; k++) {
        const t = validSources[k];
        const tBytes = encodeURIComponent(t).length;
        const sepCost = cur.length ? SEP_ENC_LEN : 0;
        if (cur.length && curBytes + sepCost + tBytes > LINGVA_BUDGET) {
          groups.push(cur); groupIdx.push(curIdx);
          cur = []; curIdx = []; curBytes = 0;
        }
        cur.push(t); curIdx.push(validIndices[k]);
        curBytes += (cur.length === 1 ? 0 : SEP_ENC_LEN) + tBytes;
      }
      if (cur.length) { groups.push(cur); groupIdx.push(curIdx); }

      for (let g = 0; g < groups.length; g++) {
        const parts = await lingvaTranslateGroup(groups[g], side.from, side.target);
        for (let i = 0; i < groups[g].length; i++) {
          const cueIdx = groupIdx[g][i];
          if (parts[i]) cuesArr[cueIdx][side.target] = parts[i];
        }
        dones[side.target] += groups[g].length;
        const ja = totals.ja ? `JA ${dones.ja}/${totals.ja}` : '';
        const en = totals.en ? `EN ${dones.en}/${totals.en}` : '';
        setStatus(`字幕を逐次補完中... ${[ja, en].filter(Boolean).join(' / ')}`);
      }
    }

    async function lingvaTranslateGroup(group, from, to) {
      const joined = group.join(SEP);
      for (const inst of LINGVA) {
        try {
          const url = `${inst}/api/v1/${from}/${to}/${encodeURIComponent(joined)}`;
          const res = await fetch(url);
          if (!res.ok) continue;
          const body = await res.json();
          const tl = body?.translation || '';
          if (!tl) continue;
          const parts = tl.split(SEP);
          if (parts.length === group.length) return parts.map((s) => s.trim());
          return group.map((_, i) => (parts[i] ?? '').trim());
        } catch (e) {
          continue;
        }
      }
      return group.map(() => '');
    }

    async function runSearch(query) {
      setStatus('検索中...');
      loadBtn.disabled = true;
      try {
        const sort = sortSelect.value || 'relevance';
        const res = await fetch(`${WORKER_URL}/api/search?q=${encodeURIComponent(query)}&sort=${encodeURIComponent(sort)}`);
        if (res.status === 503) {
          setStatus('YouTube が一時的に制限中です。数十秒待って再試行してください', true);
          return;
        }
        if (!res.ok) {
          setStatus('検索に失敗しました', true);
          return;
        }
        const data = await res.json();
        renderResults(data.results || []);
        showResults();
        setStatus(`${(data.results || []).length} 件ヒット`);
      } catch (err) {
        setStatus('検索に失敗しました', true);
      } finally {
        loadBtn.disabled = false;
      }
    }

    async function submitInput() {
      const raw = urlInput.value.trim();
      if (!raw) return;
      const videoId = extractVideoId(raw);
      if (videoId) {
        await loadByVideoId(videoId);
      } else {
        await runSearch(raw);
      }
    }

    loadBtn.addEventListener('click', submitInput);
    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitInput(); });

    window.onYouTubeIframeAPIReady = () => { /* player mounted lazily on loadVideo */ };
  </script>
</body>
</html>
