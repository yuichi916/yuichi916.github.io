<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hitofude Hanabi — Story</title>
<meta name="description" content="一筆花火の物語モード。七つの祭りを巡り、星座・灯籠流し・影絵・雪のそり・狐の嫁入り・百鬼夜行・灯の家を一筆で描く全7章と最終章「送り火」。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="story.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="shud" class="hidden">
  <div class="s-name" id="sName"></div>
  <div class="s-info" id="sInfo"></div>
  <button id="sRetry" class="iconbtn" aria-label="Retry"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg></button>
</div>
<div id="labels"></div>
<div id="float"></div>

<div id="dlg" class="hidden">
  <canvas id="dFace" width="200" height="200"></canvas>
  <div class="d-body"><div class="d-name" id="dName"></div><div class="d-text" id="dText"></div></div>
  <div class="d-next">▼</div>
  <button id="dSkip" class="d-skip">スキップ ▶▶</button>
</div>

<div id="smenu" class="screen">
  <div class="logo"><div class="logo-ja">一筆花火</div><div class="logo-en">STORY — 送り火</div></div>
  <div class="s-menu" id="sMenu"></div>
  <div class="tagline">七つの祭りを巡り、送り火の尺玉を上げる</div>
</div>

<div id="card" class="screen hidden">
  <div class="c-main" id="cMain"></div>
  <div class="c-sub" id="cSub"></div>
  <button id="cBtn" class="btn2 light"></button>
</div>

<script type="module" src="story.js" onerror="try{var n=+sessionStorage.getItem('hanabiRetry')||0;if(n<3){sessionStorage.setItem('hanabiRetry',n+1);setTimeout(function(){location.reload()},500)}}catch(e){}"></script>
</body>
</html>
