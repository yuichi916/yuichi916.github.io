<body>
<canvas id="c"></canvas>
<canvas id="raidCv"></canvas>
<div id="kazuLabels"></div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="nightname"><b id="nWorld"></b><span id="nName"></span><div class="twisttag" id="twistTag"></div><div class="streak" id="streak"></div><div class="tech" id="tech"><span title=""><i>★</i><b id="tPv">4</b></span><span><i id="tGrL"></i><b id="tGr">0</b></span></div></div>
    <div class="goal">
      <div class="goal-nums"><span id="gScore">0</span><small>/ <span id="gTarget">0</span></small></div>
      <div class="goal-bar"><i id="gBar"></i><u class="tick t2"></u><u class="tick t3"></u></div>
      <div class="raidbar" id="raidBar"><b id="raidName"></b><div class="rb"><i id="raidHp"></i><s id="raidGhost"></s><u style="left:33.33%"></u><u style="left:66.66%"></u></div><div class="rlife" id="raidLife"></div></div>
      <div class="goal-stars" id="gStars"><u style="left:40%">★</u><u style="left:64%">★★</u><u style="left:100%">★★★</u></div>
    </div>
    <div class="topright"><div class="lives" id="lives"></div><div class="strokes" id="strokes"></div><button id="sndBtn" class="iconbtn" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg></button><button id="pauseBtn" class="iconbtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
  </div>
  <div class="combo" id="combo"><span class="c-pts" id="cPts">0</span><span class="c-x">×</span><span class="c-mult" id="cMult">1</span><em class="c-lab l1" id="cLabP"></em><em class="c-lab l2" id="cLabM"></em></div>
  <div class="remain" id="remain"></div>
  <div class="heat" id="heat"><span id="heatTxt"></span></div>
  <div class="bags" id="bags"></div>
  <div class="engi" id="engi"></div>
  <div class="coins" id="hudCoins"></div>
  <div class="inkbar"><i id="inkBar"></i></div>
  <canvas id="boss" width="280" height="280" class="hidden"></canvas>
  <div class="spellbar off" id="spellBar"><small id="spLabel"></small><b id="spName"></b><span id="spBonus"></span></div>
</div>
<div id="hurt"></div>
<div id="zoneLabels"></div>
<div id="float"></div>
<div id="teach" class="hidden"></div>
<svg id="tether" class="hidden" aria-hidden="true"><line stroke="#fff4d6" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/><circle class="fg" r="10" fill="#fff4d6" opacity=".18"/><circle class="tp" r="5" fill="none" stroke="#ffe08a" stroke-width="2"/></svg><div id="grandLabels"></div><div id="techFeed"></div><canvas id="mini" class="hidden"></canvas><div id="nightCard" class="hidden"></div><div id="revive" class="hidden"></div><div id="guideRing" class="hidden"></div><div id="guide" class="hidden"></div><div id="tutGo" class="hidden"><span></span></div><div id="hand" class="hidden"><svg viewBox="0 0 48 64"><path d="M18 30V9a4.5 4.5 0 0 1 9 0v16l11 3c4 1 6 4 5 8l-3 15c-1 4-3 6-7 6H22c-3 0-5-1-7-4L6 39c-2-3 1-6 4-5l8 5z" fill="#fff6df" stroke="#3a2412" stroke-width="3" stroke-linejoin="round"/></svg></div>

<div id="title" class="screen">
  <div class="logo"><div class="logo-ja">一筆花火<span class="logo-no">弐</span></div><div class="logo-en">HITOFUDE HANABI 2</div></div>
  <button id="playBtn" class="bigbtn">PLAY</button><div id="contInfo" class="continfo hidden"></div>
  <div class="menu" id="titleMenu"></div>
  <div class="tagline" id="tagline"></div><div id="sndHint" class="sndhint hidden"></div>
</div>

<div id="tveil" class="tveil hidden"><div class="logo"><div class="logo-ja">一筆花火<span class="logo-no">弐</span></div><div class="logo-en">HITOFUDE HANABI 2</div></div><div class="tv-sub" id="tveilSub"></div></div>

<div id="newrun" class="screen hidden"><div class="panel wide">
  <h2 id="nrTitle"></h2>
  <div class="fuses" id="fuseList"></div>
  <h3 class="nrsub" id="nrSchoolT"></h3>
  <div class="fuses" id="schoolList"></div>
  <div class="ranks"><button id="rankPrev" class="arrow">‹</button><div class="rankbox"><b id="rankName"></b><small id="rankDesc"></small></div><button id="rankNext" class="arrow">›</button></div>
  <div class="row"><button id="nrBack" class="btn2"></button><button id="nrGo" class="bigbtn small"></button></div>
</div></div>

<div id="inter" class="screen hidden"><div class="panel inter">
  <div class="res">
    <div class="res-title" id="resTitle"></div>
    <div class="stars" id="resStars"></div>
    <div class="res-score" id="resScore"></div>
    <div class="techsum" id="techSum"></div>
    <div class="ledger" id="ledger"></div>
    <div class="charmwork" id="charmWork"></div>
    <div class="purse"><span class="coin"></span><b id="purse">0</b></div>
    <div class="pouch" id="pouch"></div>
  </div>
  <div class="shop">
    <div class="shophead"><canvas id="neko" width="140" height="140"></canvas><h3 id="shopTitle"></h3><div class="torasay" id="toraSay"></div></div>
    <div class="cards" id="cards"></div>
    <div class="row bottom">
      <button id="reroll" class="btn2"></button>
      <button id="shopQuit" class="btn2"></button>
      <div class="held" id="held"></div>
      <button id="nextBtn" class="bigbtn small"></button>
    </div>
    <div class="nextinfo" id="nextInfo"></div>
  </div>
</div></div>

<div id="tale" class="tale hidden"><img class="tl-stand" src="tale/img/akari_stand.webp" alt=""><div class="tl-box">
  <div class="tl-head" id="tlHead"></div>
  <div class="tl-row tl-who"><div class="tl-icon" id="tlIcon"></div><div class="tl-say"><b id="tlName"></b><span id="tlLine"></span></div></div>
  <div class="tl-row tl-me"><img class="tl-face" id="tlFace" alt=""><div class="tl-say"><b id="tlMe"></b><span id="tlReply"></span></div></div>
  <div class="tl-tail" id="tlTail"></div>
  <div class="tl-next" id="tlNext"></div>
  <img class="tl-kon" src="tale/img/kon.webp" alt="">
</div></div>

<div id="rankScr" class="screen hidden"><div class="panel rankp" id="rankPanel"></div></div>

<div id="over" class="screen hidden"><div class="panel">
  <div class="res-title" id="ovTitle"></div>
  <div class="ov-big" id="ovNights"></div>
  <div class="ledger" id="ovStats"></div>
  <div class="unlocks" id="ovUnlocks"></div>
  <div class="ovrank" id="ovRank"></div>
  <div class="row"><button id="ovTitleBtn" class="btn2"></button><button id="ovShare" class="btn2 hidden"></button><button id="ovEndless" class="btn2 hidden"></button><button id="ovDaily" class="btn2 hidden"></button><button id="ovPgRank" class="btn2 hidden"></button><button id="ovAgain" class="bigbtn small"></button></div>
</div></div>

<div id="pause" class="screen hidden"><div class="panel">
  <h2 id="pzTitle"></h2>
  <div class="toggles"><button id="pzSound" class="btn2"></button><button id="pzMusic" class="btn2"></button><button id="pzLang" class="btn2"></button></div>
  <div class="toggles"><button id="pzTouch" class="btn2"></button><button id="pzHaptic" class="btn2 hidden"></button></div>
  <div class="held big" id="pzHeld"></div>
  <div class="row"><button id="pzQuit" class="btn2"></button><button id="pzResume" class="bigbtn small"></button></div>
</div></div>

<div id="book" class="screen hidden"><div class="panel wide">
  <h2 id="bkTitle"></h2>
  <div class="booklist" id="bookList"></div>
  <div class="row"><button id="bkBack" class="bigbtn small"></button></div>
</div></div>

  <canvas id="ipCanvas"></canvas>
  <div class="sk-name" id="skName"></div>
  <div class="sk-msg" id="skMsg"></div>
  <button id="skNext" class="btn2 light"></button>
</div>

<div id="talk" class="hidden"><canvas id="talkFace" width="160" height="160"></canvas><div class="tk"><b id="talkWho"></b><p id="talkMsg"></p><small id="talkNext"></small></div></div>
<div id="tip" class="hidden"></div>
<script type="module" src="main.js" onerror="try{var n=+sessionStorage.getItem('hanabiRetry')||0;if(n<3){sessionStorage.setItem('hanabiRetry',n+1);setTimeout(function(){location.reload()},500)}}catch(e){}"></script>
</body>
</html>
