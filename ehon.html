<style>
  :root{--ink:#3a2f25}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);
    /* ノベルゲーム風の室内: 藍色の壁 → 木の床、中央に世界が浮くスポット光、四隅ヴィネット */
    background:
      radial-gradient(120% 78% at 50% 46%, rgba(255,236,198,.30) 0%, rgba(255,236,198,0) 48%),
      linear-gradient(180deg, transparent 0 57%, #4a3728 57%, #2c1e13 100%),
      linear-gradient(180deg, #201a2b 0%, #29223a 38%, #35304c 57%),
      radial-gradient(150% 125% at 50% 46%, transparent 38%, rgba(0,0,0,.6) 100%);
    overflow:hidden;height:100%}
  #stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1700px}

  /* ステージ枠(本+世界を載せる領域) — 全画面。透明レンダラーで背景と一体 */
  .ehon-stage{position:relative;width:100vw;height:100vh}
  #world-a,#world-b{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s}
  #world-a.active,#world-b.active{opacity:1;pointer-events:auto}

  /* 本の土台(方式A=水彩画像) */
  .book-base{position:absolute;left:50%;bottom:4%;width:108%;
    transform:translateX(-50%);transform-origin:50% 90%;
    filter:drop-shadow(0 26px 30px rgba(0,0,0,.45));
    transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
  #world-a.closed .book-base{transform:translateX(-50%) scale(.9) rotateX(14deg)}

  /* 本の上にせり上がる世界(方式A) — 本の奥から高く大きく飛び出す */
  .world-pop{position:absolute;left:50%;bottom:40%;width:64%;transform:translateX(-50%);
    pointer-events:none;cursor:pointer;filter:drop-shadow(0 18px 16px rgba(0,0,0,.35));z-index:6}
  .world-pop .layer{position:absolute;left:50%;bottom:0;width:100%;
    transform:translate(-50%,64%) scale(.42);transform-origin:50% 100%;
    opacity:0;transition:transform 1.1s cubic-bezier(.18,.9,.24,1),opacity .7s;
    will-change:transform}
  /* せり上がり後: 本の面より高く(-16%)・少し大きく(1.14)立ち上がる */
  #world-a.popped .world-pop .layer{opacity:1;transform:translate(-50%,-6%) scale(1.12)}

  /* 方式B: Three.js canvas (本と最初の見開きがそろってから、ふわっと見せる) */
  #world-b canvas{width:100%;height:100%;display:block;opacity:0;transition:opacity .6s ease}
  #world-b canvas.ready{opacity:1}

  /* 方式A 3D本コンテナ */
  .book-base-3d {
    position:absolute;left:50%;bottom:2%;width:104%;height:56%;
    transform:translateX(-50%);transform-origin:50% 90%;
    cursor:pointer;
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .book-base-3d canvas{width:100%;height:100%;display:block}
  #world-a.closed .book-base-3d{transform:translateX(-50%) scale(.9) rotateX(14deg)}

  /* UI */
  /* 題の札は、左上の目次ボタンの右から、上中央のしおりの手前まで (しおりは最大で幅約300px)。
     狭い画面では、しおりの下の段に置き、右側の本文パネル (幅 34vw + 余白 4vw) の手前で折り返す */
  #title-card{position:fixed;left:70px;top:14px;max-width:calc(50vw - 240px);padding:10px 14px;
    background:rgba(250,245,235,.85);border:1px solid #b9a784;border-radius:5px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .6s}
  @media(max-width:919px){#title-card{left:14px;top:64px;max-width:min(440px,calc(62vw - 26px))}}
  #title-card.show{opacity:1}
  #title-card.show.on-sheet{opacity:0}   /* 目次と奥付はシートが自分の見出しを持つ (札がシートに重ならないように) */
  #title-card h1{font-size:clamp(16px,3.2vw,26px);letter-spacing:.04em}
  #title-card p{font-size:13px;color:#6b5b45;margin-top:4px}
  #mode-toggle{position:fixed;right:18px;bottom:18px;display:none;z-index:10;
    border-radius:999px;overflow:hidden;border:1px solid #b9a784;background:#faf5eb}
  #mode-toggle.show{display:flex}
  #mode-toggle button{border:0;padding:10px 18px;background:transparent;font:inherit;cursor:pointer;color:#8a7860}
  #mode-toggle button.sel{background:#7a6450;color:#fdf8ee}
  #mode-toggle button:disabled{opacity:.4;cursor:not-allowed}
  #hint{position:fixed;left:0;right:0;bottom:64px;text-align:center;color:#fdf8ee;
    text-shadow:0 1px 3px rgba(0,0,0,.55);opacity:.92;font-size:15px;pointer-events:none;transition:opacity .5s}
  #hint.gone,#hint.waiting{opacity:0}
  .status-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:#fdf8ee;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.7);padding:0 24px;line-height:1.6}

  /* ページめくりナビ */
  #nav-prev, #nav-next {
    position:fixed; top:50%; transform:translateY(-50%);
    width:52px; height:52px; border-radius:50%;
    background:rgba(250,245,235,.88); border:1px solid #b9a784;
    box-shadow:0 3px 12px rgba(0,0,0,.3); cursor:pointer;
    font-size:22px; display:none; align-items:center; justify-content:center;
    z-index:20; color:#5e4c37; transition:opacity .3s;
    user-select:none;
  }
  #nav-prev { left:14px; }
  #nav-next { right:14px; }
  #nav-prev.show, #nav-next.show { display:flex; }
  #nav-prev:disabled, #nav-next:disabled { opacity:.3; cursor:not-allowed; }

  /* 言語トグルボタン */
  #lang-toggle {
    position:fixed; right:18px; bottom:76px;
    width:44px; height:44px; border-radius:50%;
    background:rgba(250,245,235,.88); border:1px solid #b9a784;
    box-shadow:0 3px 12px rgba(0,0,0,.3); cursor:pointer;
    font-size:18px; display:none; align-items:center; justify-content:center;
    z-index:20; color:#5e4c37; transition:opacity .3s;
    user-select:none; font-weight:bold;
  }
  #lang-toggle.show { display:flex; }
  #lang-toggle:hover { background:rgba(250,245,235,1); }
  #bgm-toggle {
    position:fixed; right:18px; bottom:128px;
    width:44px; height:44px; border-radius:50%;
    background:rgba(250,245,235,.88); border:1px solid #b9a784;
    box-shadow:0 3px 12px rgba(0,0,0,.3); cursor:pointer;
    font-size:18px; display:none; align-items:center; justify-content:center;
    z-index:20; color:#8c7a54; transition:opacity .3s,color .3s;
    user-select:none;
  }
  #bgm-toggle.show { display:flex; }
  #bgm-toggle.playing { color:#a3552f; }
  #bgm-toggle:hover { background:rgba(250,245,235,1); }

  /* mode-a page fade-in */
  #world-a.page-fade { animation: pageFadeIn .3s ease; }
  @keyframes pageFadeIn { from { opacity:0; } to { opacity:1; } }

  /* world counter dots */
  #world-dots {
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%);
    display:none; gap:8px; z-index:20;
  }
  #world-dots.show { display:flex; }
  #world-dots.on-sheet { display:none; }   /* 目次と奥付の紙の上に点の列が重ならないように */
  #world-dots .dot {
    width:8px; height:8px; border-radius:50%;
    background:#b9a784; transition:background .3s;
  }
  #world-dots .dot.active { background:#5e4c37; }

  /* 没入ズーム */
  #world-a.immersed .world-pop {
    position:fixed; inset:0; width:100vw; height:100vh;
    bottom:unset; left:unset; transform:none;
    z-index:50; background:#000a;
    display:flex; align-items:center; justify-content:center;
  }
  #immerse-back {
    position:fixed; top:16px; right:16px; z-index:60;
    background:rgba(250,245,235,.9); border:1px solid #b9a784;
    border-radius:999px; padding:8px 18px; cursor:pointer;
    font-family:inherit; font-size:14px; display:none;
  }
  #immerse-back.show { display:block; }

  /* ---- ミニクエスト UI ---- */
  @keyframes questPulse {
    0%,100%{ box-shadow:0 0 8px 3px #ffd700aa, 0 0 20px 6px #ffd70044; transform:translate(-50%,-50%) scale(1); }
    50%{ box-shadow:0 0 14px 6px #ffd700cc, 0 0 32px 12px #ffd70066; transform:translate(-50%,-50%) scale(1.15); }
  }
  @keyframes questPulseLit {
    0%,100%{ box-shadow:0 0 10px 5px #ffe566cc, 0 0 26px 10px #fff08866; transform:translate(-50%,-50%) scale(1); }
    50%{ box-shadow:0 0 18px 9px #ffe566ee, 0 0 40px 16px #fff08899; transform:translate(-50%,-50%) scale(1.12); }
  }
  @keyframes questShake {
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    20%{ transform:translate(calc(-50% - 6px),-50%) scale(1); }
    40%{ transform:translate(calc(-50% + 6px),-50%) scale(1); }
    60%{ transform:translate(calc(-50% - 4px),-50%) scale(1); }
    80%{ transform:translate(calc(-50% + 4px),-50%) scale(1); }
  }
  @keyframes questSpark {
    0%{ opacity:1; transform:translate(-50%,-50%) scale(0.5); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(3); }
  }
  @keyframes questBannerIn {
    from{ opacity:0; transform:translateX(-50%) translateY(-24px); }
    to{ opacity:1; transform:translateX(-50%) translateY(0); }
  }
  @keyframes questClearIn {
    from{ opacity:0; transform:translate(-50%,-50%) scale(.8); }
    to{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
  @keyframes questMetaIn {
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes questGoldPop {
    0%{ opacity:0; transform:translateX(-50%) scale(.5); }
    60%{ opacity:1; transform:translateX(-50%) scale(1.1); }
    100%{ opacity:1; transform:translateX(-50%) scale(1); }
  }

  /* バナー */
  .quest-banner {
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    z-index:65; max-width:380px; width:90vw;
    background:linear-gradient(160deg,#f7edd5 0%,#e9d8a8 60%,#d4b96a 100%);
    border:2px solid #b08a32; border-radius:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,200,.4);
    padding:10px 16px 10px;
    animation:questBannerIn .5s cubic-bezier(.18,.9,.24,1) both;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  .quest-banner .qb-title {
    font-size:13px; font-weight:bold; color:#5a3a00;
    letter-spacing:.06em; margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .quest-banner .qb-progress {
    font-size:12px; color:#7a5a10; font-weight:normal;
    background:rgba(255,220,80,.3); border-radius:4px; padding:1px 6px;
  }
  .quest-banner .qb-intro {
    font-size:12px; color:#5a3a00; line-height:1.55;
  }
  .quest-banner.quest-cleared-banner .qb-title { color:#3a6a00; }
  .quest-banner.quest-cleared-banner .qb-progress { color:#3a6a00; background:rgba(80,220,80,.25); }

  /* ホットスポット */
  .quest-spot {
    position:fixed; width:28px; height:28px; border-radius:50%;
    background:rgba(255,215,0,.25); border:2px solid #ffd700;
    cursor:pointer; z-index:62;
    transform:translate(-50%,-50%);
    animation:questPulse 2.2s ease-in-out infinite;
    transition:background .3s;
  }
  .quest-spot.lit {
    background:rgba(255,230,100,.7); border-color:#fff088;
    animation:questPulseLit 1.8s ease-in-out infinite;
  }
  .quest-spot.shaking {
    animation:questShake .4s ease-in-out;
  }
  .quest-spot .spot-inner {
    position:absolute; inset:5px; border-radius:50%;
    background:rgba(255,230,80,.5);
  }
  .quest-spot.lit .spot-inner { background:rgba(255,250,150,.9); }

  /* 世界ドット: クリア済み */
  #world-dots .dot.quest-cleared {
    background:#c8a020;
    box-shadow:0 0 6px 2px #ffd70088;
  }

  /* クリアオーバーレイ */
  .quest-clear-overlay {
    position:fixed; left:50%; top:50%;
    transform:translate(-50%,-50%);
    z-index:70; text-align:center;
    background:linear-gradient(160deg,#f7edd5 0%,#e9d8a8 60%,#d4b96a 100%);
    border:2px solid #b08a32; border-radius:12px;
    box-shadow:0 8px 32px rgba(0,0,0,.55), 0 0 60px rgba(255,215,0,.25);
    padding:28px 32px 24px;
    max-width:340px; width:88vw;
    animation:questClearIn .5s cubic-bezier(.18,.9,.24,1) both;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  .quest-clear-overlay .qco-star { font-size:36px; margin-bottom:8px; }
  .quest-clear-overlay .qco-title { font-size:15px; font-weight:bold; color:#5a3a00; margin-bottom:10px; }
  .quest-clear-overlay .qco-msg { font-size:13px; color:#5a3a00; line-height:1.6; margin-bottom:16px; }
  .quest-clear-overlay button {
    border:1px solid #b08a32; background:#5a3a00; color:#fdf8ee;
    border-radius:6px; padding:7px 22px; cursor:pointer;
    font-family:inherit; font-size:13px;
  }
  .quest-clear-overlay button:hover { background:#7a5a20; }

  /* メタ報酬オーバーレイ */
  .quest-meta-overlay {
    position:fixed; inset:0; z-index:80;
    background:rgba(20,10,0,.82);
    display:flex; align-items:center; justify-content:center;
    animation:questMetaIn .8s ease both;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  .quest-meta-inner {
    text-align:center; max-width:360px; width:88vw;
    padding:36px 28px 28px;
    background:linear-gradient(170deg,#f7edd5 0%,#e9d8a8 60%,#d4b96a 100%);
    border:2px solid #b08a32; border-radius:14px;
    box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 80px rgba(255,215,0,.3);
    position:relative;
  }
  .quest-meta-inner .qm-deco {
    font-size:42px; margin-bottom:12px;
    display:block; animation:questGoldPop .8s .2s cubic-bezier(.18,.9,.24,1) both;
    position:relative; left:50%; transform:translateX(-50%);
  }
  .quest-meta-inner .qm-title {
    font-size:18px; font-weight:bold; color:#5a3a00;
    letter-spacing:.05em; margin-bottom:12px; line-height:1.4;
  }
  .quest-meta-inner .qm-msg {
    font-size:13px; color:#5a3a00; line-height:1.7; margin-bottom:20px;
  }
  .quest-meta-inner button {
    border:1px solid #b08a32; background:#5a3a00; color:#fdf8ee;
    border-radius:8px; padding:10px 28px; cursor:pointer;
    font-family:inherit; font-size:14px;
  }
  .quest-meta-inner button:hover { background:#7a5a20; }

  /* ---- ページオーバーレイ (右頁: story + ボタン + JP バッジ) ---- */
  #page-overlay{position:absolute;right:4%;bottom:18%;width:min(34vw,320px);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .14s ease;text-align:left}
  #page-overlay.show{opacity:1;pointer-events:auto;transition:opacity .45s ease .12s}
  .po-story{font-size:.92rem;line-height:1.9;color:#3a2f22;background:rgba(255,250,238,.82);
    border-radius:10px;padding:12px 14px;box-shadow:0 2px 12px rgba(60,40,10,.18)}
  .po-jp-badge{display:inline-block;margin-top:8px;font-size:.7rem;padding:2px 8px;border-radius:99px;
    background:#8c6d46;color:#fff;letter-spacing:.06em}
  .po-enter{display:inline-block;margin-top:10px;font-weight:700;color:#fff;background:#a3552f;
    padding:10px 18px;border-radius:99px;text-decoration:none;box-shadow:0 3px 10px rgba(120,50,10,.35)}
  .po-enter:hover{background:#c26a3d}
  /* 入口のボタンは、ゆっくり灯って誘う */
  #page-overlay.show .po-enter{animation:poEnter 2.8s ease-in-out 1.4s infinite}
  @keyframes poEnter{0%,100%{box-shadow:0 3px 10px rgba(120,50,10,.35)}50%{box-shadow:0 3px 24px rgba(255,176,96,.8)}}
  /* 飛び出しに乗せたときの札 */
  #pop-hint{position:fixed;left:0;top:0;z-index:70;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s;
    padding:6px 12px;border:1px solid #c9a86a;border-radius:999px;background:rgba(36,24,14,.9);color:#ffe9c4;font-size:13px}
  #pop-hint.show{opacity:1}

  /* ---- 目次: 世界の地図 ---- */
  .toc-wrap{position:absolute;inset:6% 8% 10%;overflow:auto;z-index:30;
    background:rgba(252,246,232,.94);border-radius:14px;padding:22px 26px;
    box-shadow:0 8px 40px rgba(60,40,10,.3)}
  /* 目次/奥付は、紙が着地するころに浮かび、次の頁へ行くときはすっと消える */
  .toc-wrap,.colo-wrap{animation:ehonSheetIn .42s cubic-bezier(.2,.8,.2,1) .2s both}
  .toc-wrap.leaving,.colo-wrap.leaving{opacity:0;transition:opacity .16s ease;animation:none}
  /* 先に組んで隠しておく奥付 (組み直しが起きない)。組んだ直後だけ見えないほど薄く描いて、初めて使う文字の
     描き込みを済ませておく (0.001 だと 8bit で 0 に丸まり、Chrome が描き込み自体を省いてしまう) */
  .colo-wrap.prewarm{visibility:hidden;pointer-events:none;animation:none}
  /* overflow:hidden = スクロールする箱にしない。スクロールする箱は高解像度の画面で別の層になり、
     重なった頁の文章まで描き方が変わって、文字が一瞬薄く見える */
  .colo-wrap.prewarm.warm{visibility:visible;opacity:.02;background:transparent;overflow:hidden}
  .colo-wrap.prewarm.warm *{background:transparent!important;border-color:transparent!important}   /* 描くのは文字だけ (ボタンの形が透けないように) */
  @keyframes ehonSheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .toc-title{font-size:1.3rem;margin:0 0 12px;color:#4a3a24;letter-spacing:.12em}

<script id="ehon2-core">
/* ehon2 コア純関数 (Node テスト対象: tests/ehon2_core_test.mjs が id 抽出で評価する)
   DOM・localStorage 非依存の純関数のみ置くこと。
   メインscriptより前に置く: ZukanEngine 等が定義時に window.EHON2 を参照するため */
window.EHON2 = (function () {
  /* 日替わり配置: 日付+動物IDのFNV風ハッシュで候補スポットから1つ選ぶ */
  function dailySpotIndex(dateStr, animalId, spotCount) {
    if (!spotCount) return 0;
    const s = dateStr + ':' + animalId;
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h = ((h ^ s.charCodeAt(i)) * 16777619) >>> 0; }
    return h % spotCount;
  }
  /* 図鑑状態 reducer (localStorage 読み書きは呼び出し側 ZukanEngine の責務) */
  function zukanAdd(state, animalId, dateStr) {
    const found = Object.assign({}, state && state.found);
    if (!found[animalId]) found[animalId] = dateStr; /* 初発見日を保持 */
    return { found: found };
  }
  function zukanIsComplete(state, animalIds) {
    const found = (state && state.found) || {};
    return animalIds.every(function (id) { return !!found[id]; });
  }
  return { dailySpotIndex: dailySpotIndex, zukanAdd: zukanAdd, zukanIsComplete: zukanIsComplete };
})();
</script>

function playCry(animalId) {
  const a = ANIMALS.find(x => x.id === animalId); if (!a) return;
  try {
    const ctx = playCry._ctx || (playCry._ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    let t = ctx.currentTime;
    for (let r = 0; r < (a.cry.repeat || 1); r++) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = a.cry.type;
      o.frequency.setValueAtTime(a.cry.f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, a.cry.f1), t + a.cry.dur);
      if (a.cry.vib) { const lfo = ctx.createOscillator(), lg = ctx.createGain();
        lfo.frequency.value = a.cry.vib; lg.gain.value = a.cry.f0 * 0.05;
        lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + a.cry.dur); }
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a.cry.dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + a.cry.dur + 0.05);
      t += a.cry.dur + 0.07;
    }
  } catch (e) { /* 音は飾り: 失敗しても図鑑登録は進める */ }
}
window.renderShareButton = function (el) {
  if (!el) return;
  const btn = document.createElement('button');
  btn.className = 'po-enter';
  btn.textContent = '🐾 ' + tt(I18N.ui.share);
  btn.addEventListener('click', async () => {
    /* canvas でカード生成 */
    const cv = document.createElement('canvas'); cv.width = 1200; cv.height = 630;
    const cx = cv.getContext('2d');
    const g = cx.createLinearGradient(0, 0, 0, 630);
    g.addColorStop(0, '#2c2418'); g.addColorStop(1, '#584428');
    cx.fillStyle = g; cx.fillRect(0, 0, 1200, 630);
    cx.fillStyle = '#ffe9b8'; cx.font = 'bold 64px serif'; cx.textAlign = 'center';
    cx.fillText((ehonLang() === 'jp') ? '🐾 いきもの図鑑 コンプリート！' : '🐾 Creature Book Complete!', 600, 200);
    cx.font = '38px serif';
    cx.fillText((ehonLang() === 'jp') ? '10匹ぜんぶ みつけた' : 'All 10 creatures found', 600, 290);
    cx.font = '30px monospace'; cx.fillStyle = '#d9c08a';
    cx.fillText('yuichi916.github.io/ehon.html', 600, 560);
    const shareText = (ehonLang() === 'jp')
      ? 'とびだす絵本の「いきもの図鑑」をコンプリートした！🐾📖'
      : 'I completed the Creature Book in this pop-up world book! 🐾📖';
    const url = 'https://yuichi916.github.io/ehon.html';
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const file = blob ? new File([blob], 'ehon-zukan.png', { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ text: shareText, url, files: [file] }); return; } catch (e) {}
    }
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) + '&url=' + encodeURIComponent(url), '_blank');
  });
  el.appendChild(btn);
};

  function onAnimalClick(animalId) {

/* 目次の絵: 頁が thumb を持っていればそれ (作品の絵で描き直したもの)、なければ toc_<slug>_v1.webp */
function tocThumb(p) { return p.thumb || ('toc_' + p.id.replace(/-/g, '') + '_v1.webp'); }
function renderToc() {
  const host = document.getElementById('world-b');
  window.disposeWorldB && window.disposeWorldB();
  /* Remove any existing wrap overlays; preserve canvas (隠しておいた奥付は残す) */
  host.querySelectorAll('.toc-wrap,.colo-wrap:not(.prewarm),.status-msg').forEach(el => el.remove());
  const wrap = document.createElement('div');
  wrap.className = 'toc-wrap';

  /* Title */
  const title = document.createElement('h2');
  title.className = 'toc-title';
  title.textContent = tt(I18N.ui.toc);
  wrap.appendChild(title);

  /* Group pages by chapter */
  const chapters = [];
  PAGES.forEach((p, i) => {
    if (p.type !== 'content' && p.type !== 'adventure') return;
    const ch = p.chapter ? tt(p.chapter) : '';
    let grp = chapters.find(c => c.name === ch);
    if (!grp) { grp = { name: ch, items: [] }; chapters.push(grp); }
    grp.items.push({ p, i });
  });

  /* Build chapter sections */
  for (const ch of chapters) {
    const chDiv = document.createElement('div');
    chDiv.className = 'toc-ch';

    const chName = document.createElement('span');
    chName.className = 'toc-ch-name';
    chName.textContent = ch.name;
    chDiv.appendChild(chName);

    const grid = document.createElement('div');
    grid.className = 'toc-grid';

    for (const { p, i } of ch.items) {
      const ready = !!p.story || p.type === 'adventure';
      const card = document.createElement('button');
      card.className = 'toc-card' + (ready ? '' : ' toc-soon');
      card.dataset.page = i;

      /* Image */
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = '';
      img.src = getMediaUrl(tocThumb(p));
      img.onerror = function() { this.style.display = 'none'; };
      card.appendChild(img);

      /* Title */
      const cardTitle = document.createElement('span');
      cardTitle.className = 'toc-card-t';
      cardTitle.textContent = tt(p.title);
      card.appendChild(cardTitle);

      /* Subtitle */
      const cardSub = document.createElement('span');
      cardSub.className = 'toc-card-s';
      cardSub.textContent = tt(p.sub);
      card.appendChild(cardSub);

      grid.appendChild(card);
    }

    chDiv.appendChild(grid);
    wrap.appendChild(chDiv);
  }

  /* Zukan button */
  const zukanBtn = document.createElement('button');
  zukanBtn.className = 'toc-zukan';
  zukanBtn.id = 'toc-zukan-btn';
  zukanBtn.textContent = '🐾 ' + tt(I18N.ui.zukan);
  wrap.appendChild(zukanBtn);

  host.appendChild(wrap);

  /* Event listeners */
  wrap.querySelectorAll('.toc-card').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      EHON.switchPage(parseInt(b.dataset.page, 10));
    });
  });

  const zb = wrap.querySelector('#toc-zukan-btn');
  zb.addEventListener('click', e => {
    e.stopPropagation();
    if (window.ZukanEngine) window.ZukanEngine.openModal();
  });
}
/* 奥付の紙は初めて使う文字が多く、組むとレイアウトだけで 60ms かかる (めくりの最中だとコマが落ちる)。

function updateNavButtons() {
  const idx = EHON.state.currentPageIdx;
  const prev = document.getElementById('nav-prev');

  prev.disabled = (idx === 0);

  /* 方式A を持つ頁 (既存3世界) のみトグルを見せる */

/* ---- 現在地 (上部のしおり) とスクリーンリーダー向けの頁名 ---- */
function updateCompass() {
  const i = EHON.state.currentPageIdx;
  const nameOf = (k) => PAGES[k] ? tt(PAGES[k].title) : '';
  document.getElementById('book-chapter-title').textContent = nameOf(i) || '本をひらく';
  document.getElementById('book-chapter-count').textContent =
    String(i + 1).padStart(2, '0') + ' / ' + String(PAGES.length).padStart(2, '0');
  const prev = document.getElementById('nav-prev'), next = document.getElementById('nav-next');
  prev.setAttribute('aria-label', i > 0 ? '前の世界：' + nameOf(i - 1) : '前の世界はありません');
  next.setAttribute('aria-label', i < PAGES.length - 1 ? '次の世界：' + nameOf(i + 1) : '次の世界はありません');
}
function announcePage() {
  document.getElementById('book-turn-status').textContent = tt(PAGES[EHON.state.currentPageIdx].title);
}

/* ---- 共通シェル ---- */
const EHON = {
  state: { open: false, mode: 'b', booted: { a: false, b: false }, currentPageIdx: 1, immerse: false },
  _turning: false,
  _queued: null,
  _fromQueue: false,
  /* めくり中に押された先 (予約があればそれ) を基準に、次/前を決める */
  targetIdx() { return this._queued !== null ? this._queued : this.state.currentPageIdx; },
  open() {
    if (this.state.open) return;
    this.state.open = true;
    document.getElementById('hint').classList.add('gone');
    document.getElementById('title-card').classList.add('show');
    document.getElementById('mode-toggle').classList.add('show');
    document.getElementById('lang-toggle').classList.add('show');
    document.getElementById('bgm-toggle').classList.add('show');
    startBGM();  /* 本を開く=ユーザー操作なので自動再生できる */
    document.getElementById('nav-prev').classList.add('show');
    document.getElementById('nav-next').classList.add('show');
    document.getElementById('world-dots').classList.add('show');
    document.getElementById('goto-toc').classList.add('show');
    updateNavButtons();
    updateModeToggle(PAGES[this.state.currentPageIdx]);
    refreshAllText();  /* 開いた瞬間に現在頁のタイトル/オーバーレイへ更新 (HTML初期値のままにしない) */
    updateCompass();
    if (this.state.mode === 'a') {
      document.getElementById('world-a').classList.remove('closed');
      document.getElementById('world-a').classList.add('popped');
    }
    /* 紙が1枚めくれて、その着地に合わせて世界が立ち上がる */
    if (this.state.mode === 'b' && window.openBookThenPop) {
      this._turning = true;
      window.openBookThenPop(() => this._landed());
    }
  },
  /* 紙が着地した: 予約があれば、そのまますぐ次をめくる */
  _landed() {
    this._turning = false;
    announcePage();
    const q = this._queued;
    this._queued = null;
    if (q !== null && q !== this.state.currentPageIdx) {
      this._fromQueue = true;
      this.switchPage(q);
      this._fromQueue = false;
    }
  },
  _applyMode(m) {
    this.state.mode = m;
    document.getElementById('btn-a').classList.toggle('sel', m === 'a');
    document.getElementById('btn-b').classList.toggle('sel', m === 'b');
    document.getElementById('world-a').classList.toggle('active', m === 'a');
    document.getElementById('world-b').classList.toggle('active', m === 'b');
  },
  setMode(m) {
    this._applyMode(m);
    if (m === 'a') {
      if (!this.state.booted.a) { this.state.booted.a = true; window.bootWorldA && window.bootWorldA(); }
      if (this.state.open) {
        document.getElementById('world-a').classList.remove('closed');
        document.getElementById('world-a').classList.add('popped');
      }
    }
    if (m === 'b') {
      if (!this.state.booted.b) { this.state.booted.b = true; window.bootWorldB && window.bootWorldB(); }
      else if (this.state.open && window.popWorldB) window.popWorldB();
    }
  },
  switchPage(newIdx) {
    if (newIdx < 0 || newIdx >= PAGES.length) return;
    if (!this.state.open) { this.open(); return; }   /* 閉じた本は、まず開く */
    if (this._turning) { this._queued = newIdx; return; }
    if (newIdx === this.state.currentPageIdx) return;
    const prevIdx = this.state.currentPageIdx;
    this.state.currentPageIdx = newIdx;

    const self = this;
    function _doPageSwap(idx) {
      const pg = PAGES[idx];
      setTitleCard(pg);
      renderPageOverlay(pg);
      updateModeToggle(pg);
      /* 前の頁の目次を片づける (紙の裏に隠れている間に)。奥付は捨てずに隠す (組み直しが重いので) */
      const hostB = document.getElementById('world-b');
      hostB.querySelectorAll('.toc-wrap,.status-msg').forEach(el => el.remove());
      hostB.querySelectorAll('.colo-wrap').forEach(el => { el.classList.add('prewarm'); el.classList.remove('leaving'); });
      const sheet = pg.type === 'toc' || pg.type === 'colophon';
      const mode = (self.state.mode === 'a' && pg.modes.includes('a')) ? 'a' : 'b';
      const cameFromA = self.state.mode === 'a' && mode === 'b';
      if (mode !== self.state.mode) self._applyMode(mode);
      if (pg.type === 'toc') renderToc();
      if (pg.type === 'colophon') renderColophon();
      if (mode === 'a' && !sheet) {
        self.state.booted.a = false;
        window.bootWorldA && window.bootWorldA();
        const wa = document.getElementById('world-a');
        wa.classList.remove('page-fade');
        void wa.offsetWidth;
        wa.classList.add('page-fade');
        wa.addEventListener('animationend', () => wa.classList.remove('page-fade'), { once: true });
      }
      /* 水彩モードからは紙をめくらずに来るので、3Dの頁と世界をそろえる */
      if (cameFromA && window.syncPageB) window.syncPageB(idx);
    }

    /* 紙が持ち上がる間に、前の頁の文字と目次をそっと消す */
    const ov = document.getElementById('page-overlay');
    if (ov) ov.classList.remove('show');
    document.getElementById('world-b').querySelectorAll('.toc-wrap,.colo-wrap').forEach(el => el.classList.add('leaving'));

    /* ドット・ナビボタン・しおりは押した瞬間に更新 */
    document.querySelectorAll('#world-dots .dot').forEach((d, i) =>
      d.classList.toggle('active', i === newIdx));
    updateNavButtons();
    updateCompass();

    /* 3D でめくる (水彩モードでは直接差し替え) */
    const dir = newIdx > prevIdx ? 'next' : 'prev';
    this._turning = true;
    if (this.state.mode === 'b' && window.flipPageTransition) {
      window.flipPageTransition(prevIdx, newIdx, dir, _doPageSwap, () => self._landed());
    } else {
      _doPageSwap(newIdx);
      this._landed();
    }
  },
  enterWorld() {
    if (this.state.immerse) return;
    this.state.immerse = true;
    if (this.state.mode === 'a') {
      document.getElementById('world-a').classList.add('immersed');
      const page = PAGES[this.state.currentPageIdx];
      if (page.quest) QuestEngine.enter(page.id);
    }
    if (this.state.mode === 'b' && window.immerseWorldB) {
      window.immerseWorldB();
    }
    document.getElementById('immerse-back').classList.add('show');
    document.getElementById('nav-prev').classList.remove('show');
    document.getElementById('nav-next').classList.remove('show');
    document.getElementById('mode-toggle').classList.remove('show');
    document.getElementById('lang-toggle').classList.remove('show');
    document.getElementById('world-dots').classList.remove('show');
  },
  exitWorld() {
    if (!this.state.immerse) return;
    this.state.immerse = false;
    QuestEngine.exit();
    document.getElementById('world-a').classList.remove('immersed');
    if (window.exitImmerseB) window.exitImmerseB();
    document.getElementById('immerse-back').classList.remove('show');
    if (this.state.open) {
      document.getElementById('nav-prev').classList.add('show');
      document.getElementById('nav-next').classList.add('show');
      document.getElementById('mode-toggle').classList.add('show');
      document.getElementById('lang-toggle').classList.add('show');
      document.getElementById('world-dots').classList.add('show');
    }
  }
};

/* ================================================================
   ミニクエストシステム
   ================================================================ */
const QUESTS = {
  enchanted: {
    title: '眠れる妖精の森',
    intro: '森のあかりが消えている。3つの灯りをともして妖精を目覚めさせよう。',
    type: 'find',
    spots: [{x:0.34,y:0.5},{x:0.52,y:0.34},{x:0.66,y:0.56}],
    clear: '森に灯がともり、妖精たちが舞いはじめた！'
  },
  valhalla: {
    title: 'ルーンの儀',
    intro: '3つのルーンを左→中→右の順にともせ。',
    type: 'sequence',
    spots: [{x:0.34,y:0.44,order:1},{x:0.5,y:0.36,order:2},{x:0.66,y:0.46,order:3}],
    clear: 'ルーンが輝き、広間にオーロラが満ちた！'
  },
  darkfantasy: {
    title: '鎮魂の鐘',
    intro: '崩れた大聖堂の鐘を3つ鳴らし、影を払え。',
    type: 'find',
    spots: [{x:0.36,y:0.34},{x:0.52,y:0.28},{x:0.66,y:0.42}],
    clear: '鐘が鳴り、影が晴れて光が差した！'
  },
};

const QuestEngine = (function () {
  const LS_KEY = 'ehon_quest';
  const LS_META = 'ehon_quest_meta';

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      if (!s.cleared) s.cleared = {};
      return s;
    } catch (e) { return { cleared: {} }; }
  }
  function saveState(s) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function isMetaShown() {
    try { return !!localStorage.getItem(LS_META); } catch (e) { return false; }
  }
  function markMetaShown() {
    try { localStorage.setItem(LS_META, '1'); } catch (e) {}
  }

  /* 現在アクティブなクエスト状態 */
  let _worldId = null;
  let _quest = null;
  let _litCount = 0;
  let _nextOrder = 1;         /* sequence用 */
  let _spotEls = [];
  let _bannerEl = null;
  let _clearPending = false;

  function _removeBanner() {
    if (_bannerEl && _bannerEl.parentNode) _bannerEl.parentNode.removeChild(_bannerEl);
    _bannerEl = null;
  }
  function _removeSpots() {
    _spotEls.forEach(el => { if (el.parentNode) el.parentNode.removeChild(el); });
    _spotEls = [];
  }
  function _removeClearOverlay() {
    const el = document.getElementById('_quest-clear-overlay');
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function _updateBanner() {
    if (!_bannerEl || !_quest) return;
    const prog = _bannerEl.querySelector('.qb-progress');
    if (prog) prog.textContent = _litCount + '/' + _quest.spots.length;
  }

  function _markDotCleared(worldId) {
    const idx = PAGES.findIndex(p => p.id === worldId);
    if (idx < 0) return;
    const dots = document.querySelectorAll('#world-dots .dot');
    if (dots[idx]) dots[idx].classList.add('quest-cleared');
  }

  function _checkAllCleared() {
    const state = loadState();
    const allIds = Object.keys(QUESTS);
    return allIds.every(id => state.cleared[id]);
  }

  function _showMeta() {
    if (isMetaShown()) return;
    markMetaShown();
    const overlay = document.createElement('div');
    overlay.className = 'quest-meta-overlay';
    overlay.innerHTML = `
      <div class="quest-meta-inner">
        <span class="qm-deco">✦ 📖 ✦</span>
        <div class="qm-title">3つの世界を巡り、絵本は完成した</div>
        <div class="qm-msg">妖精の森・北欧の広間・崩れゆく大聖堂。<br>すべての物語が一冊の絵本へと綴じられた。<br>おとぎ話の結末は、旅人の心の中にある。</div>
        <button id="_quest-meta-close">絵本を閉じる</button>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('_quest-meta-close').addEventListener('click', () => {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    });
  }

  function _showClear() {
    if (!_quest) return;
    _clearPending = true;
    _removeClearOverlay();
    const overlay = document.createElement('div');
    overlay.id = '_quest-clear-overlay';
    overlay.className = 'quest-clear-overlay';
    overlay.innerHTML = `
      <div class="qco-star">✨</div>
      <div class="qco-title">クエスト達成！</div>
      <div class="qco-msg">${_quest.clear}</div>
      <button id="_quest-clear-close">つづける</button>`;
    document.body.appendChild(overlay);
    document.getElementById('_quest-clear-close').addEventListener('click', () => {
      _removeClearOverlay();
      _clearPending = false;
      if (_checkAllCleared()) _showMeta();
    });
  }

  function _lightSpot(el, idx) {
    el.classList.add('lit');
    /* 簡易スパーク効果 */
    const spark = document.createElement('div');
    spark.style.cssText = `position:fixed;
      width:48px;height:48px;border-radius:50%;
      left:${el.style.left};top:${el.style.top};
      transform:translate(-50%,-50%);
      background:radial-gradient(circle,rgba(255,230,80,.9) 0%,rgba(255,215,0,.0) 70%);
      pointer-events:none;z-index:63;
      animation:questSpark .5s ease-out forwards;`;
    document.body.appendChild(spark);
    setTimeout(() => { if (spark.parentNode) spark.parentNode.removeChild(spark); }, 600);
  }

  function _handleSpotClick(el, spotData, idx) {
    if (el.classList.contains('lit')) return;
    const state = loadState();
    if (state.cleared[_worldId]) return; /* クリア済みは再チャレンジ不要 */

    if (_quest.type === 'find') {
      _litCount++;
      _lightSpot(el, idx);
      _updateBanner();
      if (_litCount >= _quest.spots.length) {
        state.cleared[_worldId] = true;
        saveState(state);
        _markDotCleared(_worldId);
        setTimeout(() => _showClear(), 400);
      }
    } else if (_quest.type === 'sequence') {
      const required = spotData.order;
      if (required === _nextOrder) {
        _litCount++;
        _nextOrder++;
        _lightSpot(el, idx);
        _updateBanner();
        if (_litCount >= _quest.spots.length) {
          state.cleared[_worldId] = true;
          saveState(state);
          _markDotCleared(_worldId);
          setTimeout(() => _showClear(), 400);
        }
      } else {
        /* 順番違い: 全スポットをシェイク+リセット */
        _spotEls.forEach(s => {
          s.classList.remove('lit');
          s.classList.add('shaking');
          s.addEventListener('animationend', () => s.classList.remove('shaking'), { once: true });
        });
        _litCount = 0;
        _nextOrder = 1;
        _updateBanner();
      }
    }
  }

  function enter(worldId) {
    exit(); /* 念のため前回分クリーンアップ */
    const quest = QUESTS[worldId];
    if (!quest) return; /* 定義なし世界はスキップ */

    _worldId = worldId;
    _quest = quest;
    _litCount = 0;
    _nextOrder = 1;
    _clearPending = false;

    const state = loadState();
    const alreadyCleared = !!state.cleared[worldId];

    /* バナー */
    const banner = document.createElement('div');
    banner.className = 'quest-banner' + (alreadyCleared ? ' quest-cleared-banner' : '');
    banner.innerHTML = `
      <div class="qb-title">
        ${alreadyCleared ? '✓ ' : ''}${quest.title}
        <span class="qb-progress">${alreadyCleared ? 'クリア済' : '0/' + quest.spots.length}</span>
      </div>
      <div class="qb-intro">${alreadyCleared ? 'この世界のクエストはクリア済みです。' : quest.intro}</div>`;
    document.body.appendChild(banner);
    _bannerEl = banner;

    /* ホットスポット */
    quest.spots.forEach((spotData, idx) => {
      const el = document.createElement('div');
      el.className = 'quest-spot' + (alreadyCleared ? ' lit' : '');
      el.innerHTML = '<div class="spot-inner"></div>';
      /* ウィンドウ座標(immersed時は全画面) */
      el.style.left = (spotData.x * 100) + 'vw';
      el.style.top  = (spotData.y * 100) + 'vh';
      if (alreadyCleared) {
        _litCount++;
      } else {
        el.addEventListener('click', e => {
          e.stopPropagation();
          _handleSpotClick(el, spotData, idx);
        });
      }
      document.body.appendChild(el);
      _spotEls.push(el);
    });

    if (alreadyCleared) _updateBannerCleared();
  }

  function _updateBannerCleared() {
    if (!_bannerEl) return;
    const prog = _bannerEl.querySelector('.qb-progress');
    if (prog) prog.textContent = 'クリア済 ✓';
  }

  function exit() {
    _removeBanner();
    _removeSpots();
    _removeClearOverlay();
    _worldId = null;
    _quest = null;
    _litCount = 0;
    _nextOrder = 1;
    _clearPending = false;
  }

  function markDotsOnLoad() {
    const state = loadState();
    Object.keys(state.cleared).forEach(id => {
      if (state.cleared[id]) _markDotCleared(id);
    });
  }

  return { enter, exit, markDotsOnLoad };
})();

window.QuestEngine = QuestEngine;

/* タッチスワイプ */

/* ---- 方式A: 3D本ステージ + 上にせり上がる世界 ---- */
window.bootWorldA = async function () {
  if (_IS_GITHUB) await resolveEhonFileids();
  const worldId = PAGES[EHON.state.currentPageIdx].id;
  const root = document.getElementById('world-a');

  /* 前回の mountBook3D を破棄（メモリリーク防止） */
  if (window._bookA3dDispose) {
    try { window._bookA3dDispose(); } catch (e) {}
    window._bookA3dDispose = null;
  }

  root.innerHTML = '';

  /* 本の土台(3D) */
  const bookContainer = document.createElement('div');
  bookContainer.className = 'book-base-3d';
  root.appendChild(bookContainer);
  /* mountBook3D は module script 側で定義。非同期で呼び出しリトライ */
  (function tryMount(attempts) {
    if (typeof window.mountBook3D === 'function') {
      const handle = window.mountBook3D(bookContainer, { camPos: [0, 5.0, 11], lookAtY: 0.7 });
      if (handle && handle.dispose) window._bookA3dDispose = handle.dispose;
    } else if (attempts < 20) {
      setTimeout(() => tryMount(attempts + 1), 100);
    }
  })(0);

  /* 404/onerror フォールバック用フラグ */
  let failShown = false;
  function showPrepMsg(pop) {
    if (failShown) return;
    failShown = true;
    pop.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'status-msg';
    msg.textContent = 'この世界は準備中なのだ';
    pop.appendChild(msg);
  }

  /* 本の上にせり上がる世界(奥→手前) */
  const pop = document.createElement('div');
  pop.className = 'world-pop';
  pop.addEventListener('click', e => {
    e.stopPropagation();
    if (EHON.state.open) EHON.enterWorld();
  });
  const layers = [
    { k: 'far',  depth: 0.30 },
    { k: 'mid',  depth: 0.60 },
    { k: 'fore', depth: 1.0 },
  ];
  layers.forEach((L, i) => {
    const img = document.createElement('img');
    img.className = 'layer ' + L.k;
    img.alt = '';
    img.style.zIndex = i + 1;
    img.dataset.depth = L.depth;
    img.style.transitionDelay = (i * 90) + 'ms';
    img.onerror = () => showPrepMsg(pop);
    getImageUrl(worldId + '_' + L.k + '.png').then(u => { img.src = u; });
    pop.appendChild(img);
  });
  root.appendChild(pop);

  /* 視差(マウス/ジャイロ): 手前ほど大きく動く */
  function applyParallax(cx, cy) {
    if (EHON.state.mode !== 'a' || !root.classList.contains('popped')) return;
    if (EHON.state.immerse) return;
    pop.querySelectorAll('.layer').forEach(el => {
      const dp = parseFloat(el.dataset.depth);
      /* popのベース(-16%, scale1.14)を保ちつつ視差を加算 */
      el.style.transform = `translate(calc(-50% + ${cx * dp * 34}px), calc(-6% + ${cy * dp * -14}px)) scale(1.12)`;
    });
  }
  /* 古いリスナーを除去してから登録 (ワールド切替ごとの蓄積防止) */
  if (window._ehonParallaxListeners) {
    window.removeEventListener('mousemove', window._ehonParallaxListeners.mouse, { passive: true });
    window.removeEventListener('deviceorientation', window._ehonParallaxListeners.gyro, { passive: true });
  }
  const onMouseMove = e => {
    applyParallax(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5);
  };
  const onDeviceOrientation = ev => {
    if (ev.gamma == null) return;
    applyParallax(Math.max(-.5, Math.min(.5, ev.gamma / 45)),
                  Math.max(-.5, Math.min(.5, (ev.beta - 45) / 45)));
  };
  window.addEventListener('mousemove', onMouseMove, { passive: true });
  window.addEventListener('deviceorientation', onDeviceOrientation, { passive: true });
  window._ehonParallaxListeners = { mouse: onMouseMove, gyro: onDeviceOrientation };

  /* 既にopen済みなら、1フレーム空けてからpop(せり上がりアニメを効かせる) */
  if (EHON.state.open) {
    root.classList.remove('closed', 'popped');
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('popped')));
  }
};

/* ---- DOMContentLoaded: 初期化 ---- */
window.addEventListener('DOMContentLoaded', () => {
  /* ドット生成 */
  const dotsWrap = document.getElementById('world-dots');
  dotsWrap.innerHTML = '';
  PAGES.forEach((p, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === EHON.state.currentPageIdx ? ' active' : '');
    d.setAttribute('aria-label', tt(p.title));
    d.addEventListener('click', e => { e.stopPropagation(); EHON.switchPage(i); });
    dotsWrap.appendChild(d);
  });

  /* 初期ロード: setMode でクラス切替 + 起動（booted フラグはsetMode内で管理） */
  EHON.setMode(EHON.state.mode);
  updateCompass();

  /* クリア済みドットをマーク */
  QuestEngine.markDotsOnLoad();
});
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* WebGL非対応フォールバック */
(function () {
  try {
    const c = document.createElement('canvas');
    if (!(c.getContext('webgl2') || c.getContext('webgl'))) {
      const btn = document.getElementById('btn-b');
      btn.disabled = true; btn.title = 'この端末は3D非対応';
    }
  } catch (e) { document.getElementById('btn-b').disabled = true; }
})();

/* ================================================================
   本のステージ
   紙がめくれる → 世界が立ち上がる、をひとつの時計で動かす。
   - 世界(ジオラマ)は紙の動きに合わせて畳まれ、紙が降りてくるのに合わせて立ち上がる
   - 次の頁の世界は先読みし、GPU へ少しずつ転送しておく (めくりの最中に固まらない)
   ================================================================ */
/* コマ撮りのテストでだけ window.__ehonClock に時計を差し替える */
const nowMs = () => (window.__ehonClock ? window.__ehonClock() : performance.now());
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const quietMotion = () => document.documentElement.classList.contains('quiet-turns');

/* 動きの設計値 */
const TURN_MS = 1400;         /* 1枚めくる時間 (紙をゆっくり味わえる速さ) */
const TURN_FAST_MS = 950;     /* 続けてめくるとき */
/* 静かな動き (OS で「アニメーションを減らす」を選んだ人も既定でこちら): 速さは同じまま、
   紙の反りを弱め、ねじれ・傾き・ばねの弾みをなくす。短く速く回すと、かえって目に強い */
const TURN_QUIET_MS = 1400;
const QUIET_RISE_MS = 650;    /* 静かな動きで、世界が弾まずに立ち上がる時間 */
const FOLD_MS = 360;          /* 前の世界は、紙が持ち上がりきる前に畳み終える */
const RISE_AT = 0.55;         /* 紙がここまで進んだら、次の世界が立ち上がり始める */
const SPRING_W = 10.4, SPRING_Z = 0.7;   /* 立ち上がりのばね (720ms のめくりでの値): 紙の着地直後に約5%行き過ぎて戻る */
/* めくりが長いほどばねをゆるめ、世界がちょうど紙の着地に合わせて立ち上がるようにする */
const springFor = (turnMs) => SPRING_W * Math.pow(720 / turnMs, 0.7);
const LEAN = 0.28;            /* 畳まれる/立ち上がるときの傾き (rad) */
const CURL = 2.1, TWIST = 0.16;          /* めくる紙の反りと、手前の角が先に上がるねじれ */
const PEEK_EVERY = 4200, PEEK_MS = 1100; /* 開く前: 紙の角がときどき持ち上がって誘う */
const LEAF_NX = 32, LEAF_NZ = 8;

/* めくる紙の進み方: 角がゆっくり持ち上がり、同じ速さで運ばれ、ふわりと降りる。
   速さの山は台形 (両肩はなめらか)。3次の ease-in-out は真ん中で平均の3倍の速さになり、
   紙がはじかれたように見えた。これは最大でも平均の約1.5倍 */
const TURN_IN = 0.32, TURN_OUT = 0.34;
function turnEase(k) {
  if (k <= 0) return 0;
  if (k >= 1) return 1;
  const vmax = 1 / (1 - (TURN_IN + TURN_OUT) / 2);
  const g = (t) => t * t * t - t * t * t * t / 2;   /* なめらかな加速 (smoothstep) を積分したもの */
  if (k < TURN_IN) return vmax * TURN_IN * g(k / TURN_IN);
  if (k > 1 - TURN_OUT) return 1 - vmax * TURN_OUT * g((1 - k) / TURN_OUT);
  return vmax * (k - TURN_IN / 2);
}
function springRise(sec, w) {
  if (sec <= 0) return 0;
  const z = SPRING_Z, wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * sec);
  return 1 - e * (Math.cos(wd * sec) + (z * w / wd) * Math.sin(wd * sec));
}

/* ------ 読み込み: ローダーは1組だけ作って使い回す (Draco の Worker を増やさない) ------ */
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
draco.setWorkerLimit(2);
draco.preload();
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(draco);
/* ダウンロードと解析を分ける: 先読みでは回線だけ先に使い、解析は動きが収まってから */
const byteCache = new Map();   /* url -> Promise<ArrayBuffer> */
function fetchBytes(url) {
  let p = byteCache.get(url);
  if (!p) {
    p = fetch(url, { credentials: 'same-origin' }).then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
      return r.arrayBuffer();
    });
    byteCache.set(url, p);
    p.catch(() => byteCache.delete(url));
  }
  return p;
}
function loadGLB(url) {
  return fetchBytes(url).then((buf) => {
    byteCache.delete(url);   /* 解析したら手放す (必要ならブラウザのキャッシュから取り直せる) */
    return gltfLoader.parseAsync(buf, url.slice(0, url.lastIndexOf('/') + 1));
  });
}
/* 本(GLB)の 2048px テクスチャは 1024px で十分: 転送が 1/4、GPU メモリも約 50MB 減る */
async function shrinkTextures(root, max) {
  if (typeof createImageBitmap !== 'function') return;
  await Promise.all(collectTextures(root).map(async (t) => {
    const img = t.image;
    if (!img || !(img.width > max || img.height > max)) return;

/* ------ 紙の立体カード (物語の頁): ゲームの背景とキャラクターの立ち絵が、根元を軸に起き上がる ------ */

    tex.flipY = false;

    if (c.float) {
      /* ひろわれるのを待つ言葉のかけら: ページから浮かび上がり、こちらを向いたまま漂う (明るい空の前でも白く飛ばない重ね方) */

        map: front, transparent: true, depthWrite: false, toneMapped: false }));
      hinge.add(glow);

/* 奥のカードから順に起き上がる。ばねの行き過ぎは、全部のカードに同じだけ */

      c.hinge.visible = p > 0.03;

/* ------ めくり ------ */
function startTurn(o) {
  const rig = V.pageRig, L = rig.turn;
  if (turn) finishTurn(true);   /* 念のため: 前のめくりが残っていたら即着地させる */
  V.sway.goal = 0;   /* 次の頁は正面から見せる */
  const sigma = o.dir === 'next' ? 1 : -1;
  const quiet = quietMotion();
  const fromTex = spreadNow(o.fromSlug), toTex = spreadNow(o.toSlug);
  /* 開く前の「角のゆらぎ」の途中で押されても、その形から途切れずにつなぐ */
  const cont = L.front.visible && L.sigma === sigma;
  const phi0 = cont ? L.phi : 0, lift0 = cont ? L.peekLift : 0, twist0 = cont ? L.peekTwist : 0;
  L.peek = L.peekLift = L.peekTwist = 0;
  prepareLeaf(L, sigma, fromTex, toTex);
  (sigma > 0 ? rig.right : rig.left).material.map = toTex;   /* めくれて見えてくる下の頁は、もう次の頁 */
  (sigma > 0 ? rig.left : rig.right).material.map = fromTex;
  L.front.visible = L.back.visible = true;
  V.host.querySelectorAll('.status-msg').forEach((el) => el.remove());
  /* 前の世界は紙が持ち上がるのに合わせて畳む。次の世界はいまから用意する */
  if (curWorld) foldWorld(curWorld, sigma);
  const inc = hasWorld(o.toPage) ? requestWorld(o.toPage) : null;
  curWorld = inc;
  if (inc) { inc.pendingRise = false; queueWarm(inc, true); }
  turn = { t0: nowMs(), dur: quiet ? TURN_QUIET_MS : (o.fast ? TURN_FAST_MS : TURN_MS), sigma, quiet, phi0, lift0, twist0,
           toSlug: o.toSlug, toTex, inc, swapped: false, riseAsked: false,
           onSwap: o.onSwap, onLand: o.onLand, shouldRise: o.shouldRise };
  if (!spreadReady.has(o.toSlug)) {
    loadSpreadTex(o.toSlug).then((tex) => {
      if (turn && turn.toSlug === o.toSlug) { L.back.material.map = tex; (sigma > 0 ? rig.right : rig.left).material.map = tex; turn.toTex = tex; }
      else if (PAGES[EHON.state.currentPageIdx] && slugOf(PAGES[EHON.state.currentPageIdx]) === o.toSlug) setSpread(tex);
    });

}
function updateTurn(t) {
  const T = turn, L = V.pageRig.turn;
  const k = clamp01((t - T.t0) / T.dur);
  const E = turnEase(k);
  const phi = T.phi0 + (Math.PI - T.phi0) * E;
  const s = Math.sin(Math.PI * E);
  /* 持ち上げるときは外側が先、降りるときは外側が遅れる (静かな動きでは反りを半分に) */
  const curl = CURL * (T.quiet ? 0.4 : 0.8) * s * (0.35 - E);
  const twist = T.quiet ? 0 : TWIST * s * (1 - E);
  const fade = 1 - clamp01(k / 0.35);
  poseLeaf(L, phi, E, curl, T.lift0 * fade, twist, T.twist0 * fade);
  /* 頁の文字の差し替え (レイアウトが走る) は、紙がまだゆっくり持ち上がっている間に済ませる。
     前の文章はもう消えているので見た目は変わらず、紙がいちばん速く動く中盤にコマ落ちを持ち込まない */
  if (!T.swapped && t - T.t0 >= Math.max(0.22 * T.dur, 150)) { T.swapped = true; if (T.onSwap) T.onSwap(); }
  if (!T.riseAsked && k >= RISE_AT) {

  setSpread(T.toTex);   /* 着地: 左右とも新しい見開きにそろえ、めくっていた紙をしまう */

/* ------ ステージ本体 ------ */
/* 縦長の画面 (スマホ) では、本の幅が画面に収まるところまでカメラを引く。横長では元の構図のまま */
function frameCamera() {
  const { cam, controls } = V;
  const need = 6.2 / (Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * cam.aspect);
  const dist = Math.max(V.baseDist, need);
  const off = cam.position.clone().sub(controls.target);
  if (off.lengthSq() === 0) return;

  cam.position.copy(controls.target).add(off);

function pickPixelRatio(w, h) {
  const cap = Math.min(window.devicePixelRatio || 1, 2);

function ensureStage() {
  if (V) return V;
  const host = document.getElementById('world-b');

    renderer = new THREE.WebGLRenderer({ antialias: (window.devicePixelRatio || 1) < 1.5, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { return null; }
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
  cam.position.set(0, 7, 14);
  cam.lookAt(0, 1.0, 0);
  scene.add(new THREE.HemisphereLight(0xfff2d8, 0x55607a, 1.2));
  const sun = new THREE.DirectionalLight(0xfff0d0, 1.5);
  sun.position.set(6, 12, 6); scene.add(sun);

  const controls = new OrbitControls(cam, renderer.domElement);
  controls.enablePan = false; controls.minDistance = 9; controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.49; controls.target.set(0, 1.5, 0);
  controls.autoRotate = true; controls.autoRotateSpeed = 0.55;

  const bookGrp = new THREE.Group();
  scene.add(bookGrp);
  V = { renderer, scene, cam, controls, bookGrp, host, book: null, bookTopY: 0, pageRig: null,
        mascot: null, boy: null, lastT: nowMs(), idleT0: Infinity, prefetchTimer: 0,
        sway: { t0: nowMs(), center: 0, goal: null } };
  /* 手で回したら、その向きを揺れの新しい中心にする (手を離したとたんに引き戻さない) */
  controls.addEventListener('end', () => {
    const S = V.sway, P = swayParams();
    S.center = wrapAngle(controls.getAzimuthalAngle() - P.A * Math.sin(P.w * (nowMs() - S.t0) / 1000));
    S.goal = null;
  });

  const fit = () => {
    const w = host.clientWidth, h = host.clientHeight;
    if (w === 0 || h === 0) return;
    renderer.setPixelRatio(pickPixelRatio(w, h));
    renderer.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();

  };
  V.baseDist = new THREE.Vector3(0, 7, 14).distanceTo(controls.target);   /* 横長の画面での元の距離 */

  new ResizeObserver(fit).observe(host);

  /* 本をクリックで開く */
  host.addEventListener('click', () => { if (window.EHON) window.EHON.open(); });
  /* いきもの図鑑: 立ち上がっている世界の動物だけ拾う */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', (ev) => {

    ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, cam);
    const hits = ray.intersectObject(am, true);

  });
  let animalPicked = false;   /* 動物を押したときは、離しても作品はひらかない */
  /* 飛び出しを押すと、その作品がひらく。マウスを乗せると少し浮いて「▶ ひらく」の札が出る。
     本を回すドラッグはひらかない。動物に当たったときは図鑑のほう */
  const hint = document.createElement('div');
  hint.id = 'pop-hint';
  document.body.appendChild(hint);
  const canHover = !!(window.matchMedia && window.matchMedia('(hover: hover)').matches);
  const worldHit = (ev) => {
    const w = curWorld, page = PAGES[EHON.state.currentPageIdx];
    if (!w || w !== worlds.get(page.id) || !w.lift || !w.root || !w.root.parent || w.rise < 0.99 || turn || !page.link) return false;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, cam);
    const shown = (o) => { for (; o; o = o.parent) if (!o.visible) return false; return true; };   /* 当たり判定は非表示の部品にも当たるので */
    const hit = ray.intersectObject(w.lift, true).find((h) => h.object.isMesh && shown(h.object));
    return !!hit && !hit.object.userData.animalId;

  const setHover = (on, ev) => {
    if (on !== hovering) {

      renderer.domElement.style.cursor = on ? 'pointer' : '';
      hint.classList.toggle('show', on);
    }
    if (curWorld) curWorld.hoverTarget = on ? 1 : 0;
    if (on && ev) {
      hint.textContent = '▶ ' + tt(I18N.ui.open) + ' — ' + tt(PAGES[EHON.state.currentPageIdx].title);
      hint.style.transform = `translate(${ev.clientX + 16}px, ${ev.clientY + 14}px)`;
    }

    if (!d || Math.hypot(ev.clientX - d.x, ev.clientY - d.y) > 6 || performance.now() - d.t > 600) return;

}
async function buildBook() {
  const firstSlug = slugOf(PAGES[EHON.state.currentPageIdx]);

  /* 本・最初の見開き・案内人を並べて読み込む (順番待ちしない) */
  const [gltf, , , mGltf, bGltf] = await Promise.all([
    soft(loadGLB(window.getAssetUrl('book.glb')), 'book'),
    loadSpreadTex('toc'), loadSpreadTex(firstSlug),
    soft(loadGLB(window.getAssetUrl('mascot_v1.glb')), 'mascot'),
    soft(loadGLB(window.getAssetUrl('boy_v1.glb')), 'boy')
  ]);
  if (gltf) {
    const book = gltf.scene;
    await shrinkTextures(book, 1024);
    let bb = new THREE.Box3().setFromObject(book);
    const bs = bb.getSize(new THREE.Vector3());
    const bScale = 11 / Math.max(bs.x, bs.z);
    book.scale.setScalar(bScale);
    bb = new THREE.Box3().setFromObject(book);
    const bc = bb.getCenter(new THREE.Vector3());

    book.position.y -= bb.min.y;

    V.bookTopY = (new THREE.Box3().setFromObject(book)).max.y;
    /* 見える見開きは、本物の背の谷を持つ左右2枚の紙 */
    const halfW = bs.x * bScale * 0.92 / 2, depth = bs.z * bScale * 0.90;
    const root = new THREE.Group(); root.name = 'book-page-rig';
    const leftGeo = makeBookLeafGeometry('left', halfW, depth, V.bookTopY);
    const rightGeo = makeBookLeafGeometry('right', halfW, depth, V.bookTopY);
    const left = new THREE.Mesh(leftGeo, makePaperMaterial());
    const right = new THREE.Mesh(rightGeo, makePaperMaterial());
    const crease = makeSpineRibbon(left, depth);
    const leaf = makeTurningLeaf(leftGeo, rightGeo, halfW, depth);
    root.add(left, right, crease, leaf.front, leaf.back);
    root.position.y = V.bookTopY;
    V.bookGrp.add(root);

    left.material.map = spreadNow('toc');
    right.material.map = spreadNow(firstSlug);
    prepareLeaf(leaf, 1, spreadNow('toc'), spreadNow(firstSlug));
    poseLeaf(leaf, 0, 0, 0, 0, 0, 0);
    leaf.front.visible = leaf.back.visible = !EHON.state.open;

  }

  const placeGuide = (g, x, rotY) => {
    const obj = g.scene;
    const b = new THREE.Box3().setFromObject(obj);
    const sz = b.getSize(new THREE.Vector3());
    obj.scale.setScalar(3.5 / Math.max(0.001, sz.y));
    obj.position.set(x, 0, -3.0);
    obj.rotation.y = rotY;

  if (bGltf) V.boy = placeGuide(bGltf, -4.9, -2.7);

  uploadQueue.splice(0).forEach((t) => V.renderer.initTexture(t));
  try { await V.renderer.compileAsync(V.scene, V.cam); } catch (e) {}
  V.renderer.domElement.classList.add('ready');
  V.bookDone = true;
  const hint = document.getElementById('hint');
  if (hint) hint.classList.remove('waiting');
  V.idleT0 = nowMs() + 1600;
  /* 最初の世界を先に用意し、前後の頁はそのあとで (先読みは最初の世界の転送が終わるまで待つ) */
  const first = PAGES[EHON.state.currentPageIdx];
  if (hasWorld(first)) requestWorld(first);

}

/* 開く前: 紙の角がときどき持ち上がる */
function updateIdle(t) {
  if (EHON.state.open) return;
  const L = V.pageRig.turn;
  if (!L.front.visible) return;
  let b = 0;
  const ph = t - V.idleT0;
  if (ph > 0 && !quietMotion()) {
    const p = ph % PEEK_EVERY;
    if (p < PEEK_MS) b = Math.pow(Math.sin(Math.PI * p / PEEK_MS), 2);
  }
  if (b === 0 && L.peek === 0) return;

  poseLeaf(L, 0.02 * b, 0, 0, L.peekLift, 0, L.peekTwist);
}

/* カメラは本の正面を中心に、ゆっくり左右へ揺れる。ぐるりと一周させると、紙のカードの裏や地図の縁ばかり
   見える時間ができる。頁をめくると、手で回した向きから正面へゆっくり戻る。

}
function swayCamera(t, dt) {

    if (Math.abs(d) < 0.002) S.goal = null;

  const err = wrapAngle(S.center + P.A * Math.sin(P.w * s) - V.controls.getAzimuthalAngle());
  const v = Math.max(-P.back, Math.min(P.back, P.A * P.w * Math.cos(P.w * s) + err * 3));   /* 方位の速さ (rad/s) */

}

function loop() {
  requestAnimationFrame(loop);
  const t = nowMs();
  const dt = Math.min(0.1, Math.max(0, (t - V.lastT) / 1000));
  V.lastT = t;
  if (!V.host.classList.contains('active')) {   /* 水彩モードの間は3Dを描かない (めくりの途中なら着地させる) */
    if (turn) finishTurn(false);
    return;
  }
  swayCamera(t, dt);
  V.controls.update(dt);   /* 自動回転は秒基準 (高リフレッシュの画面でも速くならない) */
  if (V.mascot) V.mascot.position.y = Math.sin(t / 900) * 0.12;
  if (V.boy) V.boy.position.y = Math.sin(t / 900 + 2.0) * 0.11;
  if (V.pageRig) { if (turn) updateTurn(t); else updateIdle(t); }
  let moving = !!turn;
  worlds.forEach((e) => {
    if (e.anim) { updateWorld(e, t); moving = true; }
    if (e.animalWait > 0 && --e.animalWait === 0 && e.animal) e.animal.visible = true;
    if (e.tick && e.root && e.root.parent && e.root.visible) e.tick(e, t);   /* 漂う言葉のかけら・回る銀河 */
    if (e.lift && (e.hoverK || e.hoverTarget)) {   /* 乗せると、少し浮く (押せる合図) */
      e.hoverK = (e.hoverK || 0) + ((e !== curWorld ? 0 : e.hoverTarget || 0) - (e.hoverK || 0)) * Math.min(1, dt * 10);
      if (e.hoverK < 0.001) e.hoverK = 0;
      e.lift.position.y = e.hoverK * 0.09;
    }
  });
  /* 紙や世界が動いている間は、裏方の仕事 (解析・GPU 転送) をしない。急ぎの世界だけは例外 */
  const warmed = warmStep(moving);
  if (!moving && !warming && calmQueue.length && !buildingNow()) startBuild(calmQueue.shift());
  if (V.coloPrewarmAt && !moving && !warming && t > V.coloPrewarmAt) { V.coloPrewarmAt = 0; window.prewarmColophon && window.prewarmColophon(); }
  V.renderer.render(V.scene, V.cam);
  if (warmed) markGpuWork();   /* この描画 (小さく描いた形の転送を含む) の後ろに目印を置く */
}

/* ------ 外から呼ばれる入口 (本体スクリプトの EHON から) ------ */
window.bootWorldB = function () {
  if (!window.WebGLRenderingContext || !ensureStage()) {
    showStaticFallback(document.getElementById('world-b'), PAGES[EHON.state.currentPageIdx]);
    const hint = document.getElementById('hint');
    if (hint) hint.classList.remove('waiting');
    return Promise.resolve();
  }
  return V.ready;
};
/* 本を開く: 表紙代わりの見開きから、いまの頁へめくる。世界は紙が降りてくるのに合わせて立つ */
window.openBookThenPop = function (onLand) {
  const go = () => {
    const page = PAGES[EHON.state.currentPageIdx];
    if (!V.pageRig) { window.syncPageB(EHON.state.currentPageIdx); if (onLand) onLand(); return; }
    startTurn({ fromSlug: 'toc', toSlug: slugOf(page), toPage: page, dir: 'next', onLand });
  };
  if (V && V.bookDone) go();
  else pendingOpen = go;   /* 本の準備ができたらすぐ */
};
window.flipPageTransition = function (prevIdx, newIdx, dir, doPageSwap, onLand) {
  const prevPage = PAGES[prevIdx], newPage = PAGES[newIdx];
  if (!V || !V.pageRig || !prevPage || !newPage) { doPageSwap(newIdx); if (onLand) onLand(); return; }
  startTurn({
    fromSlug: slugOf(prevPage), toSlug: slugOf(newPage), toPage: newPage, dir,
    fast: !!(window.EHON && (EHON._fromQueue || EHON._queued !== null)),   /* 続けてめくるときは少し速く */
    shouldRise: () => !(window.EHON && EHON._queued !== null),   /* すぐ次へめくる予約があれば、途中の世界は立てない */
    onSwap: () => doPageSwap(newIdx), onLand
  });
};
/* 水彩モードから戻ったときなど、めくらずに頁をそろえる */
window.syncPageB = function (idx) {
  if (!V) return;
  const page = PAGES[idx];
  if (V.pageRig) {
    const slug = slugOf(page);
    setSpread(spreadNow(slug));
    V.pageRig.turn.front.visible = V.pageRig.turn.back.visible = false;
    loadSpreadTex(slug).then((tex) => { if (!turn && EHON.state.currentPageIdx === idx) setSpread(tex); });
  }
  const e = hasWorld(page) ? requestWorld(page) : null;
  if (curWorld && curWorld !== e) foldWorld(curWorld, 1);
  curWorld = e;
  if (e && EHON.state.open) requestRise(e, 1);
  afterLanding();
};
window.popWorldB = function () { window.syncPageB(EHON.state.currentPageIdx); };
/* 目次/奥付を描く前に、頁の上の案内表示だけ片づける (世界はステージが畳む) */
window.disposeWorldB = function () {
  document.getElementById('world-b').querySelectorAll('.status-msg,.toc-wrap,.colo-wrap:not(.prewarm)').forEach((el) => el.remove());
};
window.immerseWorldB = () => {
  if (V && V.controls) { V.controls.minDistance = 2; V.controls.maxDistance = 8; }
};
window.exitImmerseB = () => {
  if (V && V.controls) { V.controls.minDistance = 9; V.controls.maxDistance = 30; }
};
/* 旧API: 外部から呼ばれても壊れないように残す */
window.mountBook3D = function mountBook3D() {
  const noop = () => {};
  return { dispose: noop, scene: null, renderer: null, cam: null, bookTopYPromise: Promise.resolve(0) };
};

/* WebGL 不可・GLB 失敗時の静的フォールバック */
function showStaticFallback(host, page) {
  let d = host.querySelector('.status-msg');
  if (!d) { d = document.createElement('div'); d.className = 'status-msg'; host.appendChild(d); }
  const img = document.createElement('img');
  img.alt = '';
  img.style.maxWidth = '60%';
  img.style.borderRadius = '12px';
  img.src = getMediaUrl(tocThumb(page));
  img.onerror = function () { this.remove(); };
  d.innerHTML = '';
  d.appendChild(img);
  d.appendChild(document.createElement('br'));
  d.appendChild(document.createTextNode(tt(I18N.ui.preparing)));
}
/* 検証用: 状態をのぞく口 (描画には関与しない) */
window.__ehon3DRuntime = {
  THREE,
  getV: () => V,
  state: () => ({
    turning: !!turn,
    cur: curWorld ? { id: curWorld.id, rise: +curWorld.rise.toFixed(3), lean: +curWorld.lean.toFixed(3), warm: curWorld.warm, attached: !!(curWorld.root && curWorld.root.parent) } : null,
    worlds: [...worlds.values()].map((e) => ({ id: e.id, ready: e.ready, warm: e.warm, rise: +e.rise.toFixed(3), anim: e.anim ? e.anim.kind : null, attached: !!(e.root && e.root.parent) })),
    leafPhi: V && V.pageRig ? +V.pageRig.turn.phi.toFixed(3) : null,
    warming: warming ? warming.e.id + ':' + warming.phase : null
  })
};
</script>
