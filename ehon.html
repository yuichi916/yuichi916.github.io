<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>飛び出す絵本 — Enchanted</title>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<style>
  :root{--ink:#3a2f25}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);
    background:radial-gradient(130% 110% at 50% 8%,#e7d9bd 0%,#b59c77 45%,#5e4c37 100%),
      repeating-linear-gradient(94deg,#6b5742 0 40px,#7a6450 40px 42px);
    background-blend-mode:multiply;overflow:hidden;height:100%}
  #stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1700px}

  /* ステージ枠(本+世界を載せる領域) — 大きめに */
  .ehon-stage{position:relative;width:min(99vw,1180px);height:min(97vh,1120px)}
  #world-a,#world-b{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s}
  #world-a.active,#world-b.active{opacity:1;pointer-events:auto}

  /* 本の土台(方式A=水彩画像) */
  .book-base{position:absolute;left:50%;bottom:4%;width:108%;
    transform:translateX(-50%);transform-origin:50% 90%;
    filter:drop-shadow(0 26px 30px rgba(0,0,0,.45));
    transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
  #world-a.closed .book-base{transform:translateX(-50%) scale(.9) rotateX(14deg)}

  /* 本の上にせり上がる世界(方式A) — 本の奥から高く大きく飛び出す */
  .world-pop{position:absolute;left:50%;bottom:30%;width:74%;transform:translateX(-50%);
    pointer-events:none;cursor:pointer;filter:drop-shadow(0 18px 16px rgba(0,0,0,.35))}
  .world-pop .layer{position:absolute;left:50%;bottom:0;width:100%;
    transform:translate(-50%,64%) scale(.42);transform-origin:50% 100%;
    opacity:0;transition:transform 1.1s cubic-bezier(.18,.9,.24,1),opacity .7s;
    will-change:transform}
  /* せり上がり後: 本の面より高く(-16%)・少し大きく(1.14)立ち上がる */
  #world-a.popped .world-pop .layer{opacity:1;transform:translate(-50%,-16%) scale(1.14)}

  /* 方式B: Three.js canvas */
  #world-b canvas{width:100%;height:100%;display:block}

  /* UI */
  #title-card{position:fixed;left:24px;top:20px;max-width:50vw;padding:10px 14px;
    background:rgba(250,245,235,.85);border:1px solid #b9a784;border-radius:5px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .6s}
  #title-card.show{opacity:1}
  #title-card h1{font-size:clamp(16px,3.2vw,26px);letter-spacing:.04em}
  #title-card p{font-size:13px;color:#6b5b45;margin-top:4px}
  #mode-toggle{position:fixed;right:18px;bottom:18px;display:none;z-index:10;
    border-radius:999px;overflow:hidden;border:1px solid #b9a784;background:#faf5eb}
  #mode-toggle.show{display:flex}
  #mode-toggle button{border:0;padding:10px 18px;background:transparent;font:inherit;cursor:pointer;color:#8a7860}
  #mode-toggle button.sel{background:#7a6450;color:#fdf8ee}
  #mode-toggle button:disabled{opacity:.4;cursor:not-allowed}
  #hint{position:fixed;left:0;right:0;bottom:64px;text-align:center;color:#fdf8ee;
    text-shadow:0 1px 3px rgba(0,0,0,.55);opacity:.92;font-size:15px;pointer-events:none}
  #hint.gone{opacity:0;transition:opacity .5s}
  .status-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:#fdf8ee;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.7);padding:0 24px;line-height:1.6}

  /* ページめくりナビ */
  #nav-prev, #nav-next {
    position:fixed; top:50%; transform:translateY(-50%);
    width:52px; height:52px; border-radius:50%;
    background:rgba(250,245,235,.88); border:1px solid #b9a784;
    box-shadow:0 3px 12px rgba(0,0,0,.3); cursor:pointer;
    font-size:22px; display:none; align-items:center; justify-content:center;
    z-index:20; color:#5e4c37; transition:opacity .3s;
    user-select:none;
  }
  #nav-prev { left:14px; }
  #nav-next { right:14px; }
  #nav-prev.show, #nav-next.show { display:flex; }
  #nav-prev:disabled, #nav-next:disabled { opacity:.3; cursor:not-allowed; }

  /* ページめくりアニメ: 本のページが背表紙(中央)を軸に回転してめくれる */
  .ehon-stage{transform-style:preserve-3d}
  #page-flip{position:absolute; left:50%; bottom:9%; width:33%; height:32%;
    transform-origin:left center; transform:rotateY(0deg);
    background:linear-gradient(100deg,#efe6d1 0%,#f7f1e2 55%,#e8dcc2 100%);
    border:1px solid #d6c9ae; border-radius:3px 10px 10px 3px;
    box-shadow:-8px 8px 18px rgba(0,0,0,.30);
    opacity:0; pointer-events:none; z-index:40; backface-visibility:hidden;}
  .ehon-stage.flipping #page-flip{ animation: pageflip .66s cubic-bezier(.4,.05,.35,1); }
  @keyframes pageflip{
    0%   { opacity:0; transform:rotateY(0deg); }
    10%  { opacity:.98; }
    50%  { box-shadow:-16px 10px 26px rgba(0,0,0,.38); }
    92%  { opacity:.98; }
    100% { opacity:0; transform:rotateY(-172deg); }
  }

  /* world counter dots */
  #world-dots {
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%);
    display:none; gap:8px; z-index:20;
  }
  #world-dots.show { display:flex; }
  #world-dots .dot {
    width:8px; height:8px; border-radius:50%;
    background:#b9a784; transition:background .3s;
  }
  #world-dots .dot.active { background:#5e4c37; }

  /* 没入ズーム */
  #world-a.immersed .world-pop {
    position:fixed; inset:0; width:100vw; height:100vh;
    bottom:unset; left:unset; transform:none;
    z-index:50; background:#000a;
    display:flex; align-items:center; justify-content:center;
  }
  #immerse-back {
    position:fixed; top:16px; right:16px; z-index:60;
    background:rgba(250,245,235,.9); border:1px solid #b9a784;
    border-radius:999px; padding:8px 18px; cursor:pointer;
    font-family:inherit; font-size:14px; display:none;
  }
  #immerse-back.show { display:block; }

  /* cabin link */
  #cabin-link {
    position:fixed; left:16px; bottom:16px; z-index:10;
    font-size:13px; color:#8a7860; text-decoration:none;
    background:rgba(250,245,235,.75); border:1px solid #b9a784;
    border-radius:4px; padding:5px 10px;
    transition:opacity .3s; opacity:.7;
  }
  #cabin-link:hover { opacity:1; }
</style></head>
<body>
<div id="stage">
  <div class="ehon-stage">
    <div id="world-a" class="closed active"></div>
    <div id="world-b"></div>
    <div id="page-flip"></div>
  </div>
</div>
<div id="title-card"><h1>Enchanted — 妖精の森の絵本</h1><p>本をひらくと、ページの上に魔法の世界がたちあがる</p></div>
<div id="mode-toggle">
  <button id="btn-a" class="sel">水彩</button>
  <button id="btn-b">3D</button>
</div>
<div id="hint">本をひらく</div>
<button id="nav-prev" aria-label="前の世界">◀</button>
<button id="nav-next" aria-label="次の世界">▶</button>
<div id="world-dots"></div>
<button id="immerse-back">✕ もどる</button>
<a id="cabin-link" href="cabin.html">← 小屋へ</a>

<script>
/* ---- アセット参照: ローカル vs GitHub Pages(pCloud) ---- */
const PCLOUD_PROXY = 'https://niwa-cors.yuichi916.workers.dev';
const PCLOUD_PUBLINK = 'kZqt6O5Z4gUlPEmDoLyJhwfgiE5ztFhhp9Fk';
const _IS_GITHUB = location.hostname.endsWith('github.io');
const ASSET_BASE = './_ehon_assets';

let _EHON_FILEID_PROMISE = null;
let _EHON_FILEIDS = {};
function resolveEhonFileids() {
  if (_EHON_FILEID_PROMISE) return _EHON_FILEID_PROMISE;
  _EHON_FILEID_PROMISE = (async () => {
    try {
      const r = await fetch(`https://api.pcloud.com/showpublink?code=${PCLOUD_PUBLINK}`,
        { referrerPolicy: 'no-referrer', credentials: 'omit', mode: 'cors' });
      const d = await r.json();
      const map = {};
      for (const c of ((d.metadata || {}).contents || [])) {
        if (c.isfolder && c.name === 'ehon-assets') {
          for (const f of (c.contents || [])) {
            if (!f.isfolder && f.name) map[f.name] = f.fileid;
          }
        }
      }
      _EHON_FILEIDS = map;
      console.log('ehon: pCloud fileids resolved', map);
      return map;
    } catch (e) {
      console.warn('ehon: pCloud showpublink failed, using local fallback', e);
      _EHON_FILEID_PROMISE = null;
      return {};
    }
  })();
  return _EHON_FILEID_PROMISE;
}
function getAssetUrl(filename) {
  if (_IS_GITHUB) {
    const id = _EHON_FILEIDS[filename];
    if (id) return `${PCLOUD_PROXY}/g/${id}`;
    console.warn(`ehon: fileid not found for ${filename}, falling back to local`);
  }
  return `${ASSET_BASE}/ehon/${filename}`;
}
/* 画像は CORS 不要(<img>)なので、ブラウザ自身が getpublinkdownload で直CDN URLを取得して読む。
   ブラウザIPで署名されるためWorkerプロキシのIP束縛フレーキー(間欠410)を回避でき確実。
   GLB は fetch(CORS必須)のため Worker /g/ を使う(getAssetUrl)。 */
const _ehonDlCache = {};
async function getImageUrl(filename) {
  if (!_IS_GITHUB) return `${ASSET_BASE}/ehon/${filename}`;
  if (_ehonDlCache[filename]) return _ehonDlCache[filename];
  await resolveEhonFileids();
  const id = _EHON_FILEIDS[filename];
  if (!id) return `${ASSET_BASE}/ehon/${filename}`;
  try {
    const r = await fetch(`https://api.pcloud.com/getpublinkdownload?code=${PCLOUD_PUBLINK}&fileid=${id}`,
      { referrerPolicy: 'no-referrer', credentials: 'omit', mode: 'cors' });
    const d = await r.json();
    if (d.result === 0 && d.hosts && d.hosts.length) {
      const u = `https://${d.hosts[0]}${d.path}`;
      _ehonDlCache[filename] = u;
      return u;
    }
  } catch (e) { console.warn('ehon: getpublinkdownload failed', filename, e); }
  return `${PCLOUD_PROXY}/g/${id}`;  /* 最後の砦: Workerプロキシ */
}
window.getImageUrl = getImageUrl;
window._IS_GITHUB = _IS_GITHUB;
window.resolveEhonFileids = resolveEhonFileids;
window.getAssetUrl = getAssetUrl;
if (_IS_GITHUB) resolveEhonFileids().catch(() => {});

/* ---- 世界一覧 ---- */
const WORLDS = [
  {id:'enchanted',   title:'Enchanted',    sub:'妖精の森の絵本'},
  {id:'valhalla',    title:'Valhalla',     sub:'北欧の神々の広間'},
  {id:'darkfantasy', title:'Dark Fantasy', sub:'崩れゆく大聖堂'},
];

/* ---- ナビボタン状態更新 ---- */
function updateNavButtons() {
  const idx = EHON.state.currentWorldIdx;
  const prev = document.getElementById('nav-prev');
  const next = document.getElementById('nav-next');
  prev.disabled = (idx === 0);
  next.disabled = (idx === WORLDS.length - 1);
}

/* ---- 共通シェル ---- */
const EHON = {
  state: { open: false, mode: 'a', booted: { a: false, b: false }, currentWorldIdx: 0, immerse: false },
  open() {
    if (this.state.open) return;
    this.state.open = true;
    document.getElementById('hint').classList.add('gone');
    document.getElementById('title-card').classList.add('show');
    document.getElementById('mode-toggle').classList.add('show');
    document.getElementById('nav-prev').classList.add('show');
    document.getElementById('nav-next').classList.add('show');
    document.getElementById('world-dots').classList.add('show');
    updateNavButtons();
    if (this.state.mode === 'a') {
      document.getElementById('world-a').classList.remove('closed');
      document.getElementById('world-a').classList.add('popped');
    }
    if (this.state.mode === 'b' && window.popWorldB) window.popWorldB();
  },
  setMode(m) {
    this.state.mode = m;
    document.getElementById('btn-a').classList.toggle('sel', m === 'a');
    document.getElementById('btn-b').classList.toggle('sel', m === 'b');
    document.getElementById('world-a').classList.toggle('active', m === 'a');
    document.getElementById('world-b').classList.toggle('active', m === 'b');
    if (m === 'a') {
      if (!this.state.booted.a) { this.state.booted.a = true; window.bootWorldA && window.bootWorldA(); }
      if (this.state.open) {
        document.getElementById('world-a').classList.remove('closed');
        document.getElementById('world-a').classList.add('popped');
      }
    }
    if (m === 'b') {
      if (!this.state.booted.b) { this.state.booted.b = true; window.bootWorldB && window.bootWorldB(); }
      else if (this.state.open && window.popWorldB) window.popWorldB();
    }
  },
  switchWorld(newIdx) {
    if (newIdx < 0 || newIdx >= WORLDS.length) return;
    if (newIdx === this.state.currentWorldIdx) return;
    this.state.currentWorldIdx = newIdx;
    const world = WORLDS[newIdx];

    /* ページめくりアニメ(背表紙を軸にページが回転) */
    const stage = document.querySelector('.ehon-stage');
    stage.classList.remove('flipping');
    void stage.offsetWidth;  /* リフローでアニメ再起動 */
    stage.classList.add('flipping');
    stage.addEventListener('animationend', () => stage.classList.remove('flipping'), { once: true });

    /* めくり中盤(ページが世界を覆う頃)で世界を差し替え */
    const mode = this.state.mode;
    const self = this;
    setTimeout(() => {
      document.querySelector('#title-card h1').textContent = world.title + ' — ' + world.sub;
      if (mode === 'a') {
        self.state.booted.a = false;
        window.bootWorldA && window.bootWorldA();  /* open時は自前でpop */
      }
      if (mode === 'b') {
        window.disposeWorldB && window.disposeWorldB();
        self.state.booted.b = false;
        window.bootWorldB && window.bootWorldB();
        if (self.state.open && window.popWorldB) setTimeout(() => window.popWorldB(), 200);
      }
    }, 300);

    /* ドット更新 */
    document.querySelectorAll('#world-dots .dot').forEach((d, i) =>
      d.classList.toggle('active', i === newIdx));

    /* ナビボタン状態更新 */
    updateNavButtons();
  },
  enterWorld() {
    if (this.state.immerse) return;
    this.state.immerse = true;
    if (this.state.mode === 'a') {
      document.getElementById('world-a').classList.add('immersed');
    }
    if (this.state.mode === 'b' && window.immerseWorldB) {
      window.immerseWorldB();
    }
    document.getElementById('immerse-back').classList.add('show');
    document.getElementById('nav-prev').classList.remove('show');
    document.getElementById('nav-next').classList.remove('show');
    document.getElementById('mode-toggle').classList.remove('show');
    document.getElementById('world-dots').classList.remove('show');
  },
  exitWorld() {
    if (!this.state.immerse) return;
    this.state.immerse = false;
    document.getElementById('world-a').classList.remove('immersed');
    if (window.exitImmerseB) window.exitImmerseB();
    document.getElementById('immerse-back').classList.remove('show');
    if (this.state.open) {
      document.getElementById('nav-prev').classList.add('show');
      document.getElementById('nav-next').classList.add('show');
      document.getElementById('mode-toggle').classList.add('show');
      document.getElementById('world-dots').classList.add('show');
    }
  }
};
window.EHON = EHON;

document.getElementById('btn-a').addEventListener('click', e => { e.stopPropagation(); EHON.setMode('a'); });
document.getElementById('btn-b').addEventListener('click', e => { e.stopPropagation(); EHON.setMode('b'); });
document.getElementById('nav-prev').addEventListener('click', e => { e.stopPropagation(); EHON.switchWorld(EHON.state.currentWorldIdx - 1); });
document.getElementById('nav-next').addEventListener('click', e => { e.stopPropagation(); EHON.switchWorld(EHON.state.currentWorldIdx + 1); });
document.getElementById('immerse-back').addEventListener('click', e => { e.stopPropagation(); EHON.exitWorld(); });

/* キーボードナビ */
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') EHON.switchWorld(EHON.state.currentWorldIdx - 1);
  if (e.key === 'ArrowRight') EHON.switchWorld(EHON.state.currentWorldIdx + 1);
});

/* タッチスワイプ */
(function () {
  let _tx = null;
  window.addEventListener('touchstart', e => { _tx = e.changedTouches[0].clientX; }, { passive: true });
  window.addEventListener('touchend', e => {
    if (_tx === null) return;
    const dx = e.changedTouches[0].clientX - _tx;
    _tx = null;
    if (Math.abs(dx) < 50) return;
    if (dx < 0) EHON.switchWorld(EHON.state.currentWorldIdx + 1);
    else EHON.switchWorld(EHON.state.currentWorldIdx - 1);
  }, { passive: true });
})();

/* ---- 方式A: 水彩の本ステージ + 上にせり上がる世界 ---- */
window.bootWorldA = async function () {
  if (_IS_GITHUB) await resolveEhonFileids();
  const worldId = WORLDS[EHON.state.currentWorldIdx].id;
  const root = document.getElementById('world-a');
  root.innerHTML = '';

  /* 本の土台(水彩) */
  const book = document.createElement('img');
  book.className = 'book-base';
  book.alt = '';
  getImageUrl('book_open.png').then(u => { book.src = u; });
  book.addEventListener('click', () => EHON.open());
  root.appendChild(book);

  /* 404/onerror フォールバック用フラグ */
  let failShown = false;
  function showPrepMsg(pop) {
    if (failShown) return;
    failShown = true;
    pop.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'status-msg';
    msg.textContent = 'この世界は準備中なのだ';
    pop.appendChild(msg);
  }

  /* 本の上にせり上がる世界(奥→手前) */
  const pop = document.createElement('div');
  pop.className = 'world-pop';
  pop.addEventListener('click', e => {
    e.stopPropagation();
    if (EHON.state.open) EHON.enterWorld();
  });
  const layers = [
    { k: 'far',  depth: 0.30 },
    { k: 'mid',  depth: 0.60 },
    { k: 'fore', depth: 1.0 },
  ];
  layers.forEach((L, i) => {
    const img = document.createElement('img');
    img.className = 'layer ' + L.k;
    img.alt = '';
    img.style.zIndex = i + 1;
    img.dataset.depth = L.depth;
    img.style.transitionDelay = (i * 90) + 'ms';
    img.onerror = () => showPrepMsg(pop);
    getImageUrl(worldId + '_' + L.k + '.png').then(u => { img.src = u; });
    pop.appendChild(img);
  });
  root.appendChild(pop);

  /* 視差(マウス/ジャイロ): 手前ほど大きく動く */
  function applyParallax(cx, cy) {
    if (EHON.state.mode !== 'a' || !root.classList.contains('popped')) return;
    if (EHON.state.immerse) return;
    pop.querySelectorAll('.layer').forEach(el => {
      const dp = parseFloat(el.dataset.depth);
      /* popのベース(-16%, scale1.14)を保ちつつ視差を加算 */
      el.style.transform = `translate(calc(-50% + ${cx * dp * 34}px), calc(-16% + ${cy * dp * -14}px)) scale(1.14)`;
    });
  }
  /* 古いリスナーを除去してから登録 (ワールド切替ごとの蓄積防止) */
  if (window._ehonParallaxListeners) {
    window.removeEventListener('mousemove', window._ehonParallaxListeners.mouse, { passive: true });
    window.removeEventListener('deviceorientation', window._ehonParallaxListeners.gyro, { passive: true });
  }
  const onMouseMove = e => {
    applyParallax(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5);
  };
  const onDeviceOrientation = ev => {
    if (ev.gamma == null) return;
    applyParallax(Math.max(-.5, Math.min(.5, ev.gamma / 45)),
                  Math.max(-.5, Math.min(.5, (ev.beta - 45) / 45)));
  };
  window.addEventListener('mousemove', onMouseMove, { passive: true });
  window.addEventListener('deviceorientation', onDeviceOrientation, { passive: true });
  window._ehonParallaxListeners = { mouse: onMouseMove, gyro: onDeviceOrientation };

  /* 既にopen済みなら、1フレーム空けてからpop(せり上がりアニメを効かせる) */
  if (EHON.state.open) {
    root.classList.remove('closed', 'popped');
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('popped')));
  }
};

/* ---- DOMContentLoaded: 初期化 ---- */
window.addEventListener('DOMContentLoaded', () => {
  /* ドット生成 */
  const dotsEl = document.getElementById('world-dots');
  WORLDS.forEach((w, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.title = w.title;
    dotsEl.appendChild(dot);
  });

  /* 方式Aの初期ロード */
  EHON.state.booted.a = true;
  window.bootWorldA();
});
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* WebGL非対応フォールバック */
(function () {
  try {
    const c = document.createElement('canvas');
    if (!(c.getContext('webgl2') || c.getContext('webgl'))) {
      const btn = document.getElementById('btn-b');
      btn.disabled = true; btn.title = 'この端末は3D非対応';
    }
  } catch (e) { document.getElementById('btn-b').disabled = true; }
})();

let _popB = null;
let _renderer = null;
let _bDisposed = false;
let _controls = null;

window.popWorldB = () => { if (_popB) _popB(); };

window.disposeWorldB = () => {
  _bDisposed = true;
  if (_renderer) { _renderer.dispose(); _renderer = null; }
  const host = document.getElementById('world-b');
  host.innerHTML = '';
  _popB = null;
  _controls = null;
};

window.immerseWorldB = () => {
  if (_controls) {
    _controls.minDistance = 2;
    _controls.maxDistance = 8;
  }
};

window.exitImmerseB = () => {
  if (_controls) {
    _controls.minDistance = 9;
    _controls.maxDistance = 30;
  }
};

window.bootWorldB = async function () {
  if (window._IS_GITHUB) await window.resolveEhonFileids();
  const worldId = WORLDS[EHON.state.currentWorldIdx].id;
  const host = document.getElementById('world-b');
  host.innerHTML = '';

  _bDisposed = false;

  const msg = document.createElement('div');
  msg.className = 'status-msg';
  msg.textContent = '3Dを読み込み中…';
  host.appendChild(msg);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  _renderer = renderer;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, host.clientWidth / host.clientHeight, 0.1, 500);
  cam.position.set(0, 7, 14);
  const fit = () => {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
  };

  const controls = new OrbitControls(cam, renderer.domElement);
  controls.enablePan = false; controls.minDistance = 9; controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.49; controls.target.set(0, 1.5, 0);
  controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
  _controls = controls;

  scene.add(new THREE.HemisphereLight(0xfff2d8, 0x55607a, 1.2));
  const sun = new THREE.DirectionalLight(0xfff0d0, 1.5);
  sun.position.set(6, 12, 6); scene.add(sun);

  const draco = new DRACOLoader();
  draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);

  const fail = (label, url, err) => {
    host.innerHTML = '';
    const failMsg = document.createElement('div');
    failMsg.className = 'status-msg';
    failMsg.textContent = 'この世界は準備中なのだ';
    host.appendChild(failMsg);
    console.error('ehon 3D load error', label, url, err);
  };
  const loadGLB = (url) => new Promise((res, rej) =>
    loader.load(url, g => res(g), undefined, e => rej(e)));

  const bookUrl = window.getAssetUrl('book.glb');
  const dioUrl = window.getAssetUrl(worldId + '_diorama.glb');

  let dioramaGrp = null, targetY = 0;
  (async () => {
    try {
      /* 本(土台)を読み込み接地 */
      const bookGltf = await loadGLB(bookUrl).catch(e => { fail('本(book.glb)', bookUrl, e); throw e; });
      if (_bDisposed) return;
      const book = bookGltf.scene;
      let bb = new THREE.Box3().setFromObject(book);
      let bs = bb.getSize(new THREE.Vector3());
      const bScale = 11 / Math.max(bs.x, bs.z);
      book.scale.setScalar(bScale);
      bb = new THREE.Box3().setFromObject(book);
      const bc = bb.getCenter(new THREE.Vector3());
      book.position.x -= bc.x; book.position.z -= bc.z;
      book.position.y -= bb.min.y;
      scene.add(book);
      const bookTopY = (new THREE.Box3().setFromObject(book)).max.y;

      /* ジオラマを本の上に乗せる */
      const dioGltf = await loadGLB(dioUrl).catch(e => { fail('ジオラマ', dioUrl, e); throw e; });
      if (_bDisposed) return;
      const dio = dioGltf.scene;
      let db = new THREE.Box3().setFromObject(dio);
      let ds = db.getSize(new THREE.Vector3());
      const dScale = 7.5 / Math.max(ds.x, ds.y, ds.z);
      dio.scale.setScalar(dScale);
      db = new THREE.Box3().setFromObject(dio);
      const dc = db.getCenter(new THREE.Vector3());
      dio.position.x -= dc.x; dio.position.z -= dc.z;
      dio.position.y -= db.min.y;
      dioramaGrp = new THREE.Group();
      dioramaGrp.add(dio);
      dioramaGrp.position.y = bookTopY;
      targetY = bookTopY;
      dioramaGrp.scale.setScalar(EHON.state.open ? 1 : 0.001);
      scene.add(dioramaGrp);
      controls.target.set(0, bookTopY + 1.5, 0);
      if (msg.parentNode) msg.remove();
      if (EHON.state.open) window.popWorldB();
    } catch (e) { /* fail() already shown */ }
  })();

  /* せり上がりアニメ */
  _popB = () => {
    if (!dioramaGrp) return;
    const t0 = performance.now();
    (function pop() {
      if (_bDisposed) return;
      const k = Math.min(1, (performance.now() - t0) / 950);
      const e = 1 - Math.pow(1 - k, 3);
      dioramaGrp.scale.setScalar(0.001 + e * 0.999);
      dioramaGrp.position.y = targetY - 3 * (1 - e);
      if (k < 1) requestAnimationFrame(pop);
    })();
  };

  fit();
  addEventListener('resize', fit);
  (function loop() {
    if (_bDisposed) return;
    if (EHON.state.mode === 'b') { controls.update(); renderer.render(scene, cam); }
    requestAnimationFrame(loop);
  })();
};
</script>
</body></html>
