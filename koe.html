<style>
:root{
  --ink:#e9edf2; --dim:#9fb0c2; --faint:#6b7a8c;
  --narr:#c8d4e0; --sub:#f0d9a6; --gold:#ffd24a;
  --panel:rgba(10,14,22,.78); --panel2:rgba(14,20,30,.9);
  --line:rgba(159,192,232,.22); --neon:#37e0d0; --neon2:#ff5c7a; --amber:#f4cf7a;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --mono:"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070c;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;cursor:pointer}
button{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
img{-webkit-user-drag:none}

/* ===== 3D 360 background (three.js) ===== */
#bg3d{position:absolute;inset:0;z-index:0;display:block;touch-action:none}
/* ===== background layers (crossfade fallback) ===== */
.bg{position:absolute;inset:0;z-index:1;pointer-events:none;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;transform:scale(1.06);will-change:opacity}
.bg.show{opacity:1}
.bg.ken{animation:kenburns 24s ease-out both}
@keyframes kenburns{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 55%,rgba(0,0,0,.34) 100%);z-index:5}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:6;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

/* ===== イベントCG(一枚絵) =====
   背景の上・立ち絵の下に置き、表示中は立ち絵を隠して一枚絵に画面を渡す。 */
#evcg{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;
  background-position:center;background-size:cover;
  transition:opacity 1.1s ease, transform 9s linear;transform:scale(1.045)}
#evcg.on{opacity:1;transform:scale(1)}
#stage.hascg .sprite{opacity:0 !important}

/* ===== 記憶絵フラッシュ(採取/モンタージュ) ===== */
#memflash{position:absolute;inset:0;z-index:9;opacity:0;pointer-events:none;
  background-size:cover;background-position:center;
  transition:opacity .38s ease;filter:saturate(.55) contrast(1.06)}
#memflash.on{opacity:1}

/* ===== sprites ===== */
#sprites{position:absolute;inset:0;z-index:8;pointer-events:none}
.sprite{position:absolute;bottom:-2%;left:50%;height:92%;width:auto;opacity:0;transform-origin:bottom center;
  transform:translateX(-50%) scale(var(--sc,1)) translateY(7%);filter:brightness(.82) saturate(.92);
  transition:opacity .5s ease,filter .7s ease,transform .55s cubic-bezier(.2,.7,.2,1),left .55s cubic-bezier(.2,.7,.2,1),margin-bottom .45s ease;will-change:opacity,transform,filter}
.sprite.on{opacity:1;animation:spbreathe 5.2s ease-in-out infinite}
@keyframes spbreathe{0%,100%{transform:translateX(-50%) scale(var(--sc,1)) translateY(0)}50%{transform:translateX(-50%) scale(var(--sc,1)) translateY(-0.7%)}}
.sprite.speaking{filter:brightness(1.02) saturate(1);z-index:3;margin-bottom:1.7%}
.sprite.dim{filter:brightness(.5) saturate(.76)}
/* 感情マーク(会話ギミック) */
#emark{position:absolute;z-index:11;left:50%;top:14%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  font-size:clamp(30px,4.4vw,54px);filter:drop-shadow(0 2px 7px rgba(0,0,0,.65))}
#emark.show{animation:emarkpop 1s cubic-bezier(.2,1.3,.4,1)}
@keyframes emarkpop{0%{opacity:0;transform:translate(-50%,-20%) scale(.3) rotate(-12deg)}22%{opacity:1;transform:translate(-50%,-64%) scale(1.18) rotate(7deg)}62%{opacity:1;transform:translate(-50%,-66%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-80%) scale(.85)}}
/* 蛍光灯フリッカー(残響区の照明) */
#flick{position:absolute;inset:0;z-index:7;background:#05070c;opacity:0;pointer-events:none}

/* ===== dialogue ===== */
#textwrap{position:absolute;left:0;right:0;bottom:0;z-index:12;padding:0 clamp(12px,4vw,80px) clamp(14px,3.5vh,42px)}
#namebar{display:inline-flex;align-items:center;gap:10px;margin:0 0 -1px 10px;padding:7px 20px 6px;
  background:linear-gradient(180deg,rgba(20,28,40,.94),rgba(12,18,28,.94));border:1px solid var(--line);border-bottom:none;
  border-radius:10px 10px 0 0;font-family:var(--serif);font-size:clamp(15px,2vw,19px);letter-spacing:.06em;min-height:20px}
#namebar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--who,transparent);box-shadow:0 0 10px var(--who,transparent)}
#namebar.empty{opacity:0}
#tbox{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;
  padding:clamp(16px,2.6vh,26px) clamp(20px,3vw,40px);backdrop-filter:blur(7px);box-shadow:0 -4px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  min-height:clamp(96px,15vh,150px);position:relative}
#ttext{font-family:var(--serif);font-size:clamp(16px,2.15vw,21px);line-height:1.95;letter-spacing:.03em;color:var(--tcolor,var(--narr));
  text-shadow:0 1px 8px rgba(0,0,0,.6);min-height:1.9em}
#ttext.narr{font-style:italic;color:var(--narr);opacity:.94}
/* セイレンの台詞。声ではない伝え方であることを字面で示す(一段小さく・字間広く) */
#ttext.saysoft{font-size:calc(clamp(16px,2.15vw,21px)*.94);letter-spacing:.06em;opacity:.92}
#ttext .cursor{display:inline-block;width:.5em;color:var(--neon);animation:blink 1s steps(1) infinite;transform:translateY(1px)}
@keyframes blink{50%{opacity:0}}
#adv{position:absolute;right:16px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--faint);opacity:.7;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#adv.hide{opacity:0}
#hint3d{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24vh + 8px);z-index:9;pointer-events:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:rgba(210,230,245,.8);background:rgba(6,12,20,.5);
  border:1px solid var(--line);border-radius:999px;padding:6px 16px;opacity:0;transition:opacity .6s;backdrop-filter:blur(4px);white-space:nowrap}
#hint3d.show{opacity:1}

/* choices */
#choices{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at 50% 45%,rgba(4,8,14,.6),rgba(4,8,14,.86));backdrop-filter:blur(3px)}
#choices.show{display:flex}
#chtimer{width:min(60vw,420px);height:4px;margin:2px auto 0;border-radius:2px;background:rgba(150,180,220,.15);overflow:hidden}
#chtimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9a4a,#ffd24a)}
#hbeat{position:absolute;inset:0;z-index:13;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center, transparent 52%, rgba(140,12,24,.55) 100%)}
#hbeat.on{animation:hbv 1.05s ease-out}
@keyframes hbv{0%{opacity:0}10%{opacity:.8}30%{opacity:.12}44%{opacity:.55}100%{opacity:0}}
.choice{font-family:var(--serif);font-size:clamp(15px,2vw,19px);color:var(--ink);background:linear-gradient(180deg,rgba(22,32,46,.9),rgba(14,20,30,.92));
  border:1px solid var(--line);border-left:2px solid var(--neon);padding:15px 34px;border-radius:8px;cursor:pointer;min-width:min(560px,86vw);text-align:center;
  transition:.18s;letter-spacing:.03em}
.choice:hover{background:linear-gradient(180deg,rgba(40,60,84,.95),rgba(24,36,52,.95));border-left-color:var(--neon2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(55,224,208,.15)}

/* ===== 3D探索(見回して探す) ===== */
#exhint{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:26;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;padding:9px 16px;border-radius:18px;background:rgba(8,14,24,.86);border:1px solid rgba(255,210,90,.35);color:#ffe8b0;font-size:13px;letter-spacing:.06em;font-family:var(--serif);white-space:normal;text-align:center;width:max-content;max-width:min(92vw,560px)}
#exhint.show{display:flex}
#exhint button{font-size:11px;color:#9aa7b8;border:1px solid rgba(160,180,200,.35);border-radius:6px;padding:3px 9px;background:rgba(20,28,40,.6);cursor:pointer}
#hs{position:absolute;z-index:25;width:84px;height:84px;margin:-42px;display:none;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
#hs.show{display:flex}
#hs .c{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#ffe9a8,#ffb64a);box-shadow:0 0 22px 6px rgba(255,200,90,.55);animation:hspulse 1.6s ease-in-out infinite}
#hs.arrow .c{display:none}
#hs .a{display:none;font-size:26px;color:#ffd24a;text-shadow:0 0 12px rgba(255,200,90,.8)}
#hs.arrow .a{display:block;animation:hspulse 1.2s ease-in-out infinite}
@keyframes hspulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:1}}

/* ===== scene / chapter card ===== */
#scard{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse at 50% 45%,rgba(6,9,16,.86),rgba(2,3,7,.97));opacity:0;visibility:hidden;transition:opacity 1s;text-align:center;padding:24px}
#scard.show{opacity:1;visibility:visible}
#scard .rule{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:0;transition:opacity 1.2s .2s}
#scard .no{font-family:var(--mono);font-size:clamp(12px,1.8vw,15px);letter-spacing:.5em;color:var(--neon);text-indent:.5em;opacity:0;transform:translateY(8px);transition:all 1.1s .25s}
#scard .ttl{font-family:var(--serif);font-size:clamp(30px,6vw,60px);letter-spacing:.14em;text-indent:.14em;color:#eaf2ff;opacity:0;transform:translateY(10px);transition:all 1.2s .5s;text-shadow:0 0 40px rgba(55,224,208,.25)}
#scard .sb{font-family:var(--serif);font-size:clamp(13px,2vw,17px);color:var(--dim);opacity:0;max-width:min(600px,90vw);line-height:2;transform:translateY(8px);transition:all 1.2s .9s}
#scard.show .rule,#scard.show .no,#scard.show .ttl,#scard.show .sb{opacity:1;transform:none}

/* ===== HUD controls ===== */
#hud{position:absolute;top:0;right:0;z-index:14;display:flex;gap:4px;padding:12px 14px}
.hbtn{font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--dim);background:rgba(10,16,24,.6);border:1px solid var(--line);
  border-radius:7px;padding:7px 12px;cursor:pointer;transition:.15s;backdrop-filter:blur(4px)}
.hbtn:hover{color:var(--ink);border-color:var(--neon);background:rgba(20,32,46,.7)}
.hbtn.act{color:#04121a;background:var(--neon);border-color:var(--neon);font-weight:700}

/* backlog */
#backlog{position:absolute;inset:0;z-index:40;display:none;background:rgba(3,6,11,.94);backdrop-filter:blur(6px);padding:5vh 0}
#backlog.show{display:block}
#blinner{max-width:820px;margin:0 auto;height:90vh;overflow-y:auto;padding:0 24px}
#blinner h3{font-family:var(--serif);color:var(--sub);font-size:16px;letter-spacing:.1em;margin-bottom:18px;text-align:center;position:sticky;top:0;background:linear-gradient(rgba(3,6,11,.95),transparent);padding:6px 0 14px}
.blrow{margin:0 0 14px;font-family:var(--serif);line-height:1.8;font-size:15px}
.blrow .bn{font-size:12px;color:var(--who,var(--faint));letter-spacing:.08em;display:block;margin-bottom:2px}
.blrow .bt{color:var(--ink)}
.blrow.narr .bt{font-style:italic;color:var(--dim)}
#blclose{position:absolute;top:14px;right:18px;z-index:41}

/* settings */
#settings{position:absolute;inset:0;z-index:42;display:none;align-items:center;justify-content:center;background:rgba(3,6,11,.9);backdrop-filter:blur(6px)}
#settings.show{display:flex}
#savemenu{position:absolute;inset:0;z-index:72;display:none;align-items:center;justify-content:center;background:rgba(3,6,11,.9);backdrop-filter:blur(6px)}
#savemenu.show{display:flex}
.smtabs{display:flex;gap:8px;margin-bottom:16px}
.smtab{flex:1;font-family:var(--serif);font-size:14px;letter-spacing:.1em;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;transition:.2s}
.smtab.act{color:#eaf6ff;border-color:var(--neon);background:rgba(55,224,208,.08)}
#smslots{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding-right:4px}
.slotbtn{display:flex;align-items:center;gap:12px;text-align:left;font-family:var(--serif);font-size:13px;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;transition:.2s}
.slotbtn:hover:not(:disabled){border-color:var(--neon);background:rgba(55,224,208,.06)}
.slotbtn:disabled{opacity:.35;cursor:not-allowed}
.slotbtn .slno{font-family:var(--mono);font-size:10px;color:var(--neon);flex:0 0 48px;letter-spacing:.08em}
.slotbtn .sllabel{flex:1;line-height:1.5}
.slotbtn .slts{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 auto}
.sharerow{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;z-index:2}
.sharebtn{font-family:var(--serif);font-size:13px;letter-spacing:.08em;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;transition:.2s}
.sharebtn:hover{border-color:var(--neon);color:#eaf6ff;box-shadow:0 0 18px rgba(55,224,208,.18);background:rgba(55,224,208,.06)}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:90;background:rgba(10,16,24,.96);border:1px solid var(--neon);color:#eaf6ff;font-size:13px;letter-spacing:.05em;padding:9px 20px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.setpanel{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:26px 30px;width:min(440px,92vw);font-size:14px}
.setpanel h3{font-family:var(--serif);color:var(--sub);letter-spacing:.1em;margin-bottom:18px;font-size:18px}
.setrow{display:flex;align-items:center;gap:14px;margin:14px 0}
.setrow label{flex:0 0 120px;color:var(--dim)}
.setrow input[type=range]{flex:1;accent-color:var(--neon)}
.setrow .val{flex:0 0 44px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--faint)}

/* ===== title screen ===== */
#title{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:radial-gradient(ellipse at 50% 30%,#0b1420,#05070c 70%);text-align:center;padding:24px;transition:opacity 1s;
  overflow-y:auto;overscroll-behavior:contain;opacity:0}
/* タップゲート通過前は既定で不可視。.ready は一度付いたら以後外さない(通過は一回きり)。
   ゲーム中の表示/非表示は引き続き .gone が担当するので、.gone は下に置いて後勝ちさせる
   (同特異度の場合、後に定義した方がカスケードで勝つ)。 */
#title.ready{opacity:1}
/* 画面に収まるときは中央、収まらないときはスクロール */
#title .eye{margin-top:auto}
#title .cred{margin-bottom:auto}
#title.gone{opacity:0;visibility:hidden;pointer-events:none}
/* ===== タップゲート(起動時に声を1本確実に聞かせるための黒画面) ===== */
#gate{position:fixed;inset:0;z-index:200;background:#000;display:flex;
  align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.2s,visibility 0s 1.2s}
#gatetx{color:#6a7480;font-size:14px;letter-spacing:.5em;
  animation:gblink 2.6s ease-in-out infinite}
@keyframes gblink{0%,100%{opacity:.25}50%{opacity:.8}}
/* visibility も落とす: 消えた後も要素が残っていると、その下の #title を
   スクリーンリーダーが「画面をタップ」と読み続けてしまう。
   pointer-events:none は付けない(付けるとフェード中の~1.2秒、#title側に
   pointer-events を切る仕組みが無いので裏の「はじめから」がヒットテスト可能になる)。
   visibility:hidden が transition-delay で t=1.2s に落ちるまでは #gate が
   最前面で全タップを飲み続け、それはちょうど #title が opacity:1 になる瞬間と一致する。 */
#gate.gone{opacity:0;visibility:hidden}
#title .tembers{position:absolute;inset:0;pointer-events:none;opacity:.5;background:
  radial-gradient(2px 2px at 20% 40%,rgba(55,224,208,.5),transparent),
  radial-gradient(1.5px 1.5px at 75% 25%,rgba(255,92,122,.4),transparent),
  radial-gradient(1.5px 1.5px at 55% 70%,rgba(159,208,255,.4),transparent),
  radial-gradient(2px 2px at 85% 60%,rgba(55,224,208,.35),transparent)}
#title .eye{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:var(--neon);text-indent:.4em;margin-bottom:18px;z-index:2;
  text-shadow:0 0 16px rgba(0,0,0,.95),0 0 30px rgba(55,224,208,.35)}
#title h1{font-family:var(--serif);font-size:clamp(34px,7vw,74px);letter-spacing:.1em;color:#f2f8ff;line-height:1.15;z-index:2;
  text-shadow:0 0 50px rgba(55,224,208,.34),0 2px 18px rgba(0,0,0,.9),0 0 90px rgba(0,0,0,.7)}
#title .sub{font-family:var(--serif);font-size:clamp(13px,2.2vw,18px);color:#c3d2e2;margin-top:16px;letter-spacing:.14em;z-index:2;max-width:min(680px,92vw);
  text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 28px rgba(0,0,0,.8)}
#title .menu{display:flex;flex-direction:column;gap:10px;margin-top:26px;z-index:2}
#title .menu button{font-family:var(--serif);font-size:clamp(15px,2vw,18px);letter-spacing:.14em;color:var(--ink);
  background:rgba(6,11,19,.62);backdrop-filter:blur(6px);border:1px solid rgba(159,192,232,.34);border-radius:99px;
  padding:12px 40px;cursor:pointer;transition:.2s;min-width:240px;box-shadow:0 4px 22px rgba(0,0,0,.55)}
#title .menu button:hover{border-color:var(--neon);color:#eaf6ff;box-shadow:0 0 30px rgba(55,224,208,.32),0 4px 22px rgba(0,0,0,.55);
  background:rgba(55,224,208,.14)}
#title .menu button:disabled{opacity:.35;cursor:not-allowed}
#title .cred{font-size:11px;color:#9fb0c2;z-index:2;letter-spacing:.06em;line-height:1.7;padding:0 16px;margin-top:18px;
  text-shadow:0 1px 3px rgba(0,0,0,1),0 0 10px rgba(0,0,0,1)}
/* タイトル背景キービジュアル */
#title .tkv{position:absolute;inset:0;background:url('assets/koe/keyvisual-bg.jpg') center/cover;opacity:.72;z-index:0;
  filter:saturate(1.05) contrast(1.08);animation:tkvKen 26s ease-in-out infinite alternate}
#title .tkvsh{position:absolute;inset:0;z-index:1;background:
  radial-gradient(ellipse at 50% 32%,rgba(5,9,16,.12),rgba(5,7,12,.62) 82%),
  linear-gradient(0deg,#05070c 5%,rgba(5,7,12,.72) 16%,transparent 46%)}
@keyframes tkvKen{0%{transform:scale(1.04) translate(0,0)}100%{transform:scale(1.13) translate(-1.5%,-1%)}}
/* 落ちる塵・光の粒(世界観演出) */
#title .tdust{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#title .tdust i{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(159,208,255,.75);
  box-shadow:0 0 6px rgba(159,208,255,.6);animation:tdfall linear infinite}
@keyframes tdfall{0%{transform:translateY(-8vh);opacity:0}12%{opacity:.9}88%{opacity:.55}100%{transform:translateY(108vh);opacity:0}}
/* タイトル上の走査線 */
#title .tscan{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.13;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(159,208,255,.5) 3px 4px);
  animation:tscanmv 9s linear infinite}
@keyframes tscanmv{0%{background-position-y:0}100%{background-position-y:120px}}

/* fx overlays */
#flash{position:absolute;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;z-index:48;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
#fade.black{opacity:1}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-1px,0)}20%,80%{transform:translate(3px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-1px)}}
#stage.sepia .bg,#stage.sepia #bg3d{filter:sepia(.55) contrast(1.05) brightness(.85) saturate(.7)}
#pline{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .5s;
  background:linear-gradient(115deg,transparent 44%,rgba(244,207,122,.5) 49%,rgba(255,240,190,.9) 50%,rgba(244,207,122,.5) 51%,transparent 56%);
  mix-blend-mode:screen;filter:blur(.3px)}
#pline.show{opacity:.85;animation:plmove 1.4s ease-out}
@keyframes plmove{from{background-position:-30% 0}to{background-position:30% 0}}
@media (prefers-reduced-motion: reduce){.bg,.sprite,#scard,.bg.ken{transition-duration:.2s;animation:none!important}}
/* ===== モバイル(縦画面) ===== */
@media (max-aspect-ratio: 3/4){
  .sprite{height:60%;bottom:21%}
  #textwrap{padding:0 9px calc(10px + env(safe-area-inset-bottom))}
  #tbox{min-height:20vh;padding:16px 18px;border-radius:4px 14px 14px 14px}
  #ttext{font-size:16.5px;line-height:1.82}
  #namebar{font-size:14.5px;margin-left:6px;padding:6px 16px}
  #hud{padding:8px 8px;gap:5px}
  .hbtn{font-size:11.5px;padding:9px 10px;border-radius:8px}
  #adv{font-size:10px;right:12px;bottom:10px}
  #title h1{font-size:16vw}
  #title .sub{font-size:14px}
  #title .menu{margin-top:30px;gap:11px}
  #title .menu button{padding:13px 40px;font-size:16px}
  .sharerow{margin-top:16px}
  .setpanel{width:94vw;padding:20px 18px}
  #scNo{font-size:12px}
  #hint3d{font-size:11px;bottom:calc(24vh + 8px)}
}
/* タッチ端末: HUDを押しやすく */
@media (hover:none){ .hbtn{padding:10px 11px} #title .menu button{padding:14px 44px} }
.hide{display:none!important}
</style>

<script>
"use strict";
/* ============ 声を、あげる ― Sound Novel Engine ============
   エンジンのみ。物語は assets/koe/koe-ep1.js (window.KOE.ep1) が持つ。 */
const A='assets/koe/';
/* 登場人物: 名前・色（立ち絵は file を持たせたときだけ出る） */
const CHARS={
  kanata:{name:'カナタ', color:'#8fd0e8', file:null, expr:[]},
  ren   :{name:'—',      color:'#e8e2d6', file:null, expr:[]},
  toki  :{name:'トキ',   color:'#c8b48a', file:null, expr:[]},
  narr  :{name:'',       color:'#9aa6b2', file:null, expr:[]},
};
/* 背景: CSS グラデ（実画像 assets/koe/bg-*.jpg があれば差し替え） */
const BGS={
  void  :{grad:'linear-gradient(#05070a,#0b0f14)'},
  zanky :{grad:'linear-gradient(#0d1218,#1a2028)'},
  ichiba:{grad:'linear-gradient(#181410,#2a2018)'},
  suiro :{grad:'linear-gradient(#08131a,#12242e)'},
  gekijo:{grad:'linear-gradient(#140f16,#241a26)'},
  tou   :{grad:'linear-gradient(#0a0a0e,#16161f)'},
  soko  :{grad:'linear-gradient(#050506,#0e0e12)'},
};
/* BGM ファイル (assets/koe/bgm/<file>.mp3) */
const BGM={ title:'koe-title', hibi:'koe-hibi', shigoto:'koe-shigoto', deai:'koe-deai',
  tansaku:'koe-tansaku', mizu:'koe-mizu', fuon:'koe-fuon',
  shoutai:'koe-shoutai', kansei:'koe-kansei', ed:'koe-ed' };

/* 台本は assets/koe/koe-ep1.js が window.KOE.ep1 に定義（後読み→末尾で再バインド） */
const SCRIPT = window.KOE || { ep1:{ title:'声を、あげる', scenes:[] } };
const EPS=['ep1'];

/* ---------- 状態 ---------- */
const el=id=>document.getElementById(id);
/* 状態は必ずここで作る。周回で持ち越す値(seen/cleared/round)を落とさないため、
   オブジェクトリテラルを他所に散らかさない。 */
function freshState(keep){
  keep = keep || {};
  return { ep:0, scene:0, beat:0,
    seen: keep.seen||{}, cleared: keep.cleared||false,
    choices:{}, mem:[], synth:0, firstMain:null,
    /* revealed / roundDone は「その周だけ」の値。keep に載せない＝新しい周で必ず落ちる。
       revealed: セイレンの v:1 ビートを通過したか（地の文を彼女に渡してよいか）
       roundDone: この周の完走を round に加算済みか（二重加算よけ） */
    revealed:false, roundDone:false,
    narr:'kanata', round: keep.round||1 };
}
let st=freshState();
const LS='koe_save';
const cfg={ speed:60, auto:50, bgm:70, se:80, amb:55, voice:88, mgskip:0, fixview:0 };
const CLS='koe_cfg';
function loadCfg(){ try{ const c=JSON.parse(localStorage.getItem(CLS)||'null'); if(c) Object.assign(cfg,c);}catch(e){} }
function saveCfg(){ try{ localStorage.setItem(CLS, JSON.stringify(cfg)); }catch(e){} }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(st)); }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)||'null'); if(s&&s.ep!=null){ st=Object.assign(freshState(s), s); return true; } }catch(e){} return false; }

/* ---------- 背景 ---------- */
let bgCur=0;
function setBGcss(key){
  const b=BGS[key]||BGS.void; const next=bgCur?el('bg0'):el('bg1'); const cur=bgCur?el('bg1'):el('bg0');
  const img=new Image(); const url=A+'bg-'+key+'.jpg';
  const apply=(bgval)=>{ next.style.background=bgval; next.style.backgroundSize='cover'; next.style.backgroundPosition='center';
    next.classList.remove('ken'); void next.offsetWidth; next.classList.add('show','ken'); cur.classList.remove('show'); bgCur=bgCur?0:1; };
  img.onload=()=>apply("url('"+url+"') center/cover"); img.onerror=()=>apply(b.grad); img.src=url;
}
/* 3D(three.js 360°パノラマ)を優先。無ければCSS背景にフォールバック */
function setBG(key){
  setUnderground(key);
  bgKeyCur=key;
  if(window.BG3D && window.BG3D.ok){
    window.BG3D.setPano(key, ()=>{ el('bg0').classList.remove('show'); el('bg1').classList.remove('show'); }, ()=>{ setBGcss(key); });
  } else setBGcss(key);
}

/* ---------- イベントCG(一枚絵) ----------
   {cg:'cg-xxxx'} で表示、{cg:null} または背景切替で解除。
   表示中は立ち絵を伏せ、ゆっくり寄る(ken burns)。 */
let cgCur=null;
function setCG(name){
  const e=el('evcg'), stg=el('stage');
  if(!name){ if(!cgCur) return; cgCur=null; e.classList.remove('on'); stg.classList.remove('hascg');
    setTimeout(()=>{ if(!cgCur) e.style.backgroundImage=''; }, 1200); return; }
  if(cgCur===name) return;
  cgCur=name;
  const url=A+name+'.jpg';
  const im=new Image();
  im.onload=()=>{ if(cgCur!==name) return;
    e.style.backgroundImage="url('"+url+"')";
    e.classList.remove('on'); void e.offsetWidth; e.classList.add('on'); stg.classList.add('hascg'); };
  im.onerror=()=>{ if(cgCur===name){ cgCur=null; } };
  im.src=url;
}

/* ---------- 立ち絵 ---------- */
const shown={}; // who -> {el,lane,seq,expr}
let _seq=0;
function spriteURL(who,expr){ const c=CHARS[who]; if(!c||!c.file) return null;
  if(expr && c.expr.indexOf(expr)>=0) return A+c.file+'-'+expr+'.png'; return A+c.file+'.png'; }
function laneFor(who,pos){ if(pos==='left') return 0; if(pos==='right') return 100; if(pos==='center') return 50;
  return who==='kanata'?0 : who==='ren'?100 : 50; }
/* 表示中の立ち絵を人数に応じて等間隔に自動整列(重なり防止)＋人数が増えるほど縮小 */
function layoutSprites(){
  const ks=Object.keys(shown); const n=ks.length; if(!n) return;
  ks.sort((a,b)=> (shown[a].lane-shown[b].lane) || (shown[a].seq-shown[b].seq));
  const sc = n>=4?0.6 : n===3?0.74 : n===2?0.9 : 1;
  for(let i=0;i<n;i++){ const x = n===1?50 : Math.round(16 + 68*i/(n-1));
    const s=shown[ks[i]]; s.x=x; s.el.style.left=x+'%'; s.el.style.setProperty('--sc',sc); }
}
function showSprite(who,pos,expr){
  const c=CHARS[who]; if(!c||!c.file) return;
  let s=shown[who];
  if(!s){ const img=document.createElement('img'); img.className='sprite'; img.alt=c.name;
    img.onerror=()=>{img.style.display='none';}; el('sprites').appendChild(img);
    s={el:img,lane:laneFor(who,pos),seq:_seq++,expr:null}; shown[who]=s;
    img.style.animationDelay=(-((s.seq*1.7)%5.2)).toFixed(2)+'s'; }
  else if(pos){ s.lane=laneFor(who,pos); }
  const url=spriteURL(who,expr); if(url && s.el.getAttribute('src')!==url) s.el.setAttribute('src',url); s.expr=expr||null;
  layoutSprites();
  requestAnimationFrame(()=>s.el.classList.add('on'));
}
function hideSprite(who){ const s=shown[who]; if(s){ s.el.classList.remove('on'); const e=s.el; setTimeout(()=>{ e&&e.parentNode&&e.parentNode.removeChild(e); },500); delete shown[who]; layoutSprites(); } }
function clearSprites(){ Object.keys(shown).forEach(hideSprite); }
function setExpr(who,expr){ const s=shown[who]; if(!s) return; const url=spriteURL(who,expr); if(url&&s.el.getAttribute('src')!==url) s.el.setAttribute('src',url); s.expr=expr; }
function speaking(who){ if(!who||who==='narr') return; /* 地の文では立ち絵の明暗を変えない(明滅防止) */
  Object.keys(shown).forEach(k=>{ shown[k].el.classList.toggle('speaking',k===who); shown[k].el.classList.toggle('dim',k!==who); }); }
/* 発話者に立ち絵があれば必ず表示(表示漏れ防止)。整列はlayoutSpritesが担当 */
function ensureShown(who,ex){ const c=CHARS[who]; if(!c||!c.file) return;
  if(shown[who]){ if(ex!==undefined) setExpr(who,ex); return; }
  showSprite(who, null, ex); }
/* ---------- 会話ギミック: 感情マーク ---------- */
function emojiFor(who,text,ex){
  if(ex==='surprised' || /[！]|びっく|まさか|なっ|えっ|は[？!]|うそ|そんな/.test(text)) return '❗';
  if(ex==='angry' || /怒|むかつ|うるさ|黙れ|ふざ|許さ|くそ/.test(text)) return '💢';
  if(ex==='unease' || /ごめん|えっと|あれ|困|焦|やば|しまっ|どうし|まさか/.test(text)) return '💦';
  if(ex==='smile' || /笑|嬉し|ありがと|やった|よかっ|えへ|好き/.test(text)) return '♪';
  if(ex==='tears' || /涙|泣|さよなら/.test(text)) return '💧';
  return null;
}
let _markT=null;
function showMark(who,text,ex){
  const s=shown[who]; if(!s) return; const sym=emojiFor(who,text,ex); if(!sym) return;
  const m=el('emark'); m.textContent=sym; m.style.left=((s.x!=null?s.x:50))+'%';
  m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
  clearTimeout(_markT); _markT=setTimeout(()=>m.classList.remove('show'),1000);
}
/* ---------- 蛍光灯フリッカー(残響区の照明) ---------- */
let _under=false, bgKeyCur=null;
const UNDERGROUND={zanky:1,ichiba:1,suiro:1,gekijo:1,tou:1,soko:1};
function setUnderground(key){ _under=!!UNDERGROUND[key]; if(!_under){ const f=el('flick'); if(f) f.style.opacity=0; } }
function doFlick(){ if(!_under) return; const f=el('flick'); if(!f) return;
  f.style.transition='none'; f.style.opacity='.32';
  setTimeout(()=>{ f.style.transition='opacity .09s'; f.style.opacity='0';
    setTimeout(()=>{ f.style.transition='none'; f.style.opacity='.2';
      setTimeout(()=>{ f.style.transition='opacity .13s'; f.style.opacity='0'; },55); },80); },50);
}
function flickLoop(){ setTimeout(()=>{ if(_under && !document.hidden && Math.random()<0.6) doFlick(); flickLoop(); }, 2400+Math.random()*3600); }
flickLoop();

/* ---------- 音 ---------- */
let bgmCur='A', bgmKey=null;
function playBGM(key){ if(key===bgmKey) return; bgmKey=key; const file=BGM[key]; if(!file) return;
  const nEl=el('bgm'+(bgmCur==='A'?'B':'A')), cEl=el('bgm'+bgmCur);
  nEl.src=A+'bgm/'+file+'.mp3'; nEl.volume=0; nEl.play().catch(()=>{});
  const tgt=cfg.bgm/100*0.85; let k=0; const iv=setInterval(()=>{ k++; nEl.volume=Math.min(tgt,tgt*k/14); cEl.volume=Math.max(0,(cEl.volume||0)*(1-k/14)); if(k>=14){ clearInterval(iv); cEl.pause(); } },70);
  bgmCur=bgmCur==='A'?'B':'A';
}
function stopBGM(){ ['bgmA','bgmB'].forEach(id=>{const a=el(id);a.pause();}); bgmKey=null; }
/* 環境音 (procedural WebAudio: 低いハム) */
let actx,ambNodes=null;
function ensureCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function ambient(on){ const ctx=ensureCtx(); if(!ctx) return;
  if(on && !ambNodes){ const g=ctx.createGain(); g.gain.value=cfg.amb/100*0.16; g.connect(ctx.destination);
    const o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=42; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=120; const g1=ctx.createGain(); g1.gain.value=0.5; o1.connect(f); f.connect(g1); g1.connect(g); o1.start();
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=63; const g2=ctx.createGain(); g2.gain.value=0.25; o2.connect(g2); g2.connect(g); o2.start();
    ambNodes={g,o1,o2}; }
  else if(!on && ambNodes){ try{ambNodes.o1.stop();ambNodes.o2.stop();}catch(e){} ambNodes=null; }
  else if(ambNodes){ ambNodes.g.gain.value=cfg.amb/100*0.16; }
}
function se(kind){ const ctx=ensureCtx(); if(!ctx) return; const t=ctx.currentTime; const vol=cfg.se/100;
  if(kind==='rubble'){ const b=ctx.createBufferSource(); const buf=ctx.createBuffer(1,ctx.sampleRate*0.6,ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); b.buffer=buf; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400; const g=ctx.createGain(); g.gain.value=0.9*vol; b.connect(f); f.connect(g); g.connect(ctx.destination); b.start(); }
  else if(kind==='hit'){ const o=ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(60,t+0.12); const g=ctx.createGain(); g.gain.setValueAtTime(0.4*vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+0.18); }
  else if(kind==='power'){ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(1700,t+0.25); const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12*vol,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+0.42); }
  else if(kind==='heart'){ [0,0.34].forEach(dt=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=52; const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t+dt); g.gain.exponentialRampToValueAtTime((dt?0.22:0.3)*vol,t+dt+0.035); g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.3); o.connect(g); g.connect(ctx.destination); o.start(t+dt); o.stop(t+dt+0.32); }); }
  else if(kind==='page'){ const b=ctx.createBufferSource(); const buf=ctx.createBuffer(1,ctx.sampleRate*0.05,ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); b.buffer=buf; const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800; const g=ctx.createGain(); g.gain.value=0.25*vol; b.connect(f); f.connect(g); g.connect(ctx.destination); b.start(); }
  else if(kind==='boom'){ const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(32,t+0.6); const g=ctx.createGain(); g.gain.setValueAtTime(0.5*vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.7); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(t+0.72); }
  else if(kind==='chime'){ [660,990].forEach((fr,i)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=fr; const g=ctx.createGain(); const st_=t+i*0.12; g.gain.setValueAtTime(0.0001,st_); g.gain.exponentialRampToValueAtTime(0.12*vol,st_+0.02); g.gain.exponentialRampToValueAtTime(0.0001,st_+0.7); o.connect(g); g.connect(ctx.destination); o.start(st_); o.stop(st_+0.72); }); }
}

/* ---------- fx ---------- */
function fx(kind){
  if(kind==='shake'){ el('stage').classList.remove('shake'); void el('stage').offsetWidth; el('stage').classList.add('shake'); se('rubble'); }
  else if(kind==='flash'){ se('boom'); const f=el('flash'); f.style.transition='none'; f.style.opacity='.85'; requestAnimationFrame(()=>{ f.style.transition='opacity .5s'; f.style.opacity='0'; }); }
  else if(kind==='pline'){ const p=el('pline'); p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); se('power'); setTimeout(()=>p.classList.remove('show'),1400); }
  else if(kind==='sepia_on'){ el('stage').classList.add('sepia'); }
  else if(kind==='sepia_off'){ el('stage').classList.remove('sepia'); }
  else if(kind==='heart'){ se('heart'); const hv=el('hbeat'); hv.classList.remove('on'); void hv.offsetWidth; hv.classList.add('on'); }
  else if(kind==='hit'){ se('hit'); el('stage').classList.add('shake'); setTimeout(()=>el('stage').classList.remove('shake'),500); }
}

/* ---------- タイプライタ ---------- */
let typing=false, typeTimer=null, fullText='', shownLen=0, ttEl, curColor='var(--narr)';
/* soft=true はセイレンの台詞。字送りを1.6倍ゆっくりにして「別の伝え方」に見せる */
function typeStart(text,color,narr,soft){
  fullText=text; shownLen=0; typing=true; ttEl=el('ttext'); curColor=color;
  ttEl.className=(narr?'narr':'')+(soft?' saysoft':''); ttEl.style.setProperty('--tcolor',color);
  const speed=Math.max(4, 46-cfg.speed*0.42)*(soft?1.6:1); // ms/char
  clearInterval(typeTimer);
  typeTimer=setInterval(()=>{
    shownLen++; render();
    if(shownLen>=fullText.length){ clearInterval(typeTimer); typing=false; render(); onLineDone(); }
  }, speed);
  render();
  function render(){ ttEl.innerHTML= esc(fullText.slice(0,shownLen)) + (typing?'<span class="cursor">▍</span>':''); }
}
function typeFinish(){ if(!typing) return; clearInterval(typeTimer); shownLen=fullText.length; typing=false; el('ttext').innerHTML=esc(fullText); onLineDone(); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- 進行 ---------- */
let cur=null;         // {beats,i}
let stack=[];         // choice reply 合流
let locked=false;     // カード/fx 中
let autoOn=false, skipOn=false, autoTimer=null;
function curScenes(){ return (SCRIPT[EPS[st.ep]]||{scenes:[]}).scenes; }
/* 例外メッセージ用の台本座標。when/choose の reply に入ると cur は入れ子の配列に
   差し替わるので、cur.i だけでは st.scene と噛み合わず、作者が探せない座標になる。
   入れ子のときは入口ビートを stack から辿って併記する。
   例) 素の場合   : ep0 / scene3 / beat12
       入れ子の場合: ep0 / scene3 / beat12 の reply / beat2 */
function beatAddr(){
  let s='ep'+st.ep+' / scene'+st.scene;
  for(let k=0;k<stack.length;k++) s+=' / beat'+(stack[k].i-1)+' の reply';
  return s+' / beat'+(cur?cur.i-1:'?');
}
function curScene(){ return curScenes()[st.scene]; }

function step(){
  if(!cur) return;
  while(true){
    if(cur.i>=cur.beats.length){
      if(stack.length){ cur=stack.pop(); continue; }
      return nextScene();
    }
    const b=cur.beats[cur.i++];
    if(!stack.length){ st.beat=cur.i; save(); }
    if(b.bg){ setCG(null); setBG(b.bg); continue; }
    if(b.cg!==undefined){ setCG(b.cg); continue; }
    if(b.bgm){ playBGM(b.bgm); continue; }
    if(b.amb!=null){ ambient(!!b.amb); continue; }
    if(b.se){ se(b.se); continue; }
    if(b.fx){ locked=true; runFx(b.fx); return; }
    if(b.show){ showSprite(b.show, b.pos, b.expr); continue; }
    if(b.hide){ if(b.hide==='all') clearSprites(); else hideSprite(b.hide); continue; }
    if(b.expr){ setExpr(b.who||b.expr.who, b.expr); continue; }
    if(b.wait){ locked=true; setTimeout(()=>{ locked=false; step(); }, b.wait); return; }
    if(b.choose){ renderChoices(b.choose, b); return; }
    if(b.explore){ renderExplore(b.explore); return; }
    if(b.map){ continue; } /* 本作はミニマップ非搭載。状態だけの命令として素通りさせる */
    if(b.when){ if(st.choices && st.choices[b.when]){ stack.push(cur); cur={beats:b.reply||[], i:0}; } continue; }
    if(b.card){ locked=true; showCard(b.card); return; }
    if(b.end){ if(stack.length){cur=stack.pop();continue;} return nextScene(); }
    if(b.pickup){ doPickup(b); return; }
    if(b.tryvoice){ tryVoice(); return; }
    if(b.narrator){
      /* 台本の順序ミスを開発時に落とす。1周目に、まだセイレンの v:1 を通っていない段階で
         地の文を彼女に渡すと、そこで仕掛けが割れる——しかも無言で割れる。
         console.warn では誰も気づかないので投げる。2周目は初手から彼女の声なので対象外。
         注意: narrator:'ren' 自体は正しい演出（終盤で必ず使う）。禁じるのは順序だけ。 */
      if(b.narrator==='ren' && !(st.round>=2) && !st.revealed){
        throw new Error('koe: 台本の順序エラー — 1周目の {narrator:"ren"} は {say:"ren", v:1} より後にしか置けません ('+beatAddr()+')');
      }
      st.narr=b.narrator; save(); continue;
    }
    if(b.montage){ runMontage(); return; }
    if(b.finalvoice){ playFinalVoice(); return; }
    if(b.title){ toTitle(); return; }
    if(b.say!=null){ renderSay(b); return; }
  }
}
/* 名前欄はビートの関数にする。セイレンは既定 '—'、v:1 のビートでだけ名前が出る。
   声を鳴らす条件と同じ b.v を見るので、名前欄と声が食い違うことがない。 */
function nameFor(who,b){
  if(who==='ren') return (b && b.v) ? 'セイレン' : '—';
  return (CHARS[who]||CHARS.narr).name;
}
function renderSay(b){
  const c=CHARS[b.say]||CHARS.narr; const isNarr=(b.say==='narr'); const isSoft=(b.say==='ren');
  const nm=nameFor(b.say,b);
  /* 名前欄・声・この印はすべて同じ b.v を見る。スキップ既読で抜ける場合も通過扱いにする
     （声は鳴らなくても「正体が割れるビートを読んだ」ことに変わりはないため）。 */
  if(b.say==='ren' && b.v) st.revealed=true;
  el('namebar').className = nm? '' : 'empty';
  el('nm').textContent=nm||''; el('namebar').style.setProperty('--who', c.color);
  if(b.say!=='narr'){ ensureShown(b.say, b.ex); }
  speaking(b.say);
  const color = isNarr?'var(--narr)': (c.color.indexOf('var')===0? getComputedStyle(document.documentElement).getPropertyValue(c.color.slice(4,-1)).trim()||'#e9edf2' : c.color);
  markSeen(b.text);
  el('adv').classList.remove('hide');
  /* スキップ既読は声の分岐に到達せず抜ける。無音側に倒れるので仕掛けは安全（下の注記参照） */
  if(skipOn && wasSeen(b.text)){ el('ttext').innerHTML=esc(b.text); el('ttext').className=(isNarr?'narr':'')+(isSoft?' saysoft':''); el('ttext').style.setProperty('--tcolor',color); pushLog(b.say,nm,b.text); onLineDone(); return; }
  pushLog(b.say,nm,b.text);
  /* 「鳴らすか」は if の並び順ではなくデータで決める。
     セイレンだけは b.v が真のときに限り true。誰かが下の分岐の上に別の腕を挿し込んでも、
     この式そのものを書き換えない限り彼女の声は出ない。 */
  const willVoice = (b.say==='ren') ? !!b.v
                  : (b.say==='kanata' || b.say==='toki' || b.say==='narr');
  /* カナタ/トキの（心の声）だけは従来どおり鳴らさない。ren には掛からない。 */
  const mono = (b.say==='kanata'||b.say==='toki') && /^[（(]/.test(b.text.trim());
  if(willVoice && !mono){
    if(b.say==='narr') playVoice(st.narr||'kanata', b.text, 'narr');
    else playVoice(b.say, b.text);
  } else stopVoice();
  if(b.say==='kanata'||b.say==='toki') showMark(b.say,b.text,b.ex);
  typeStart(b.text, color, isNarr, isSoft);
}
function onLineDone(){
  if(autoOn && !locked){ clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(autoOn) advance(); }, Math.max(600, 900+fullText.length*(38-cfg.auto*0.3))); }
  else if(skipOn){ clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(skipOn) advance(); }, 40); }
}

/* ---------- 音の採取・合成度 ---------- */
const SYNTH_MAX=4;
function doPickup(b){
  if(st.mem.indexOf(b.pickup)<0) st.mem.push(b.pickup);
  if(b.main){ st.synth=Math.min(SYNTH_MAX, st.synth+1);
              if(!st.firstMain) st.firstMain=b.pickup; }
  save();
  locked=true;
  flashMem(b.pickup, 1400, ()=>{ locked=false; step(); });
}
function flashMem(key, ms, done){
  const e=el('memflash');
  e.style.backgroundImage="url('"+A+key+".jpg')";
  e.classList.add('on');
  setTimeout(()=>{ e.classList.remove('on'); setTimeout(done, 420); }, ms);
}
function tryVoice(){
  const stage=['00','25','50','75','100'][Math.min(SYNTH_MAX, st.synth)];
  const v=el('voice'); locked=true;
  v.src=A+'voice/synth-'+finalKey()+'-s'+stage+'.mp3';
  v.volume=cfg.voice/100;
  let done=false;
  const go=()=>{ if(done) return; done=true; v.onended=null; v.onerror=null; locked=false; step(); };
  v.onended=go; v.onerror=go;
  v.play().catch(go);
}
function finalKey(){
  // 最初に取った主素材で4パターンに分かれる(設計書 5章「結」)
  const map={'mem-01':'a','mem-07':'b','mem-13':'c','mem-19':'d'};
  return map[st.firstMain]||'a';
}
function runMontage(){
  const list=st.mem.slice(); locked=true;
  let i=0, wait=520;
  const tick=()=>{
    if(i>=list.length){ locked=false; step(); return; }
    flashMem(list[i], wait, ()=>{ i++; wait=Math.max(90, wait*0.82); tick(); });
  };
  tick();
}
function playFinalVoice(){
  const v=el('voice'); locked=true;
  v.src=A+'voice/final-'+finalKey()+'.mp3';
  v.volume=cfg.voice/100;
  let done=false;
  const go=()=>{ if(done) return; done=true; v.onended=null; v.onerror=null; locked=false; step(); };
  v.onended=go; v.onerror=go;
  v.play().catch(go);
}
/* 完走の記録。round を進める唯一の場所。呼び出し元は次の2つだけ、いずれも「完走」を意味する:
     1. toTitle()   — {title:1} ビート。step():638 からのみ呼ばれる
     2. nextScene() — 最後の場面を読み終えた枝 (:762)
   片方にしか置かないと、台本が {title:1} で終わっていない限り round が 1 のまま固定され、
   地の文の _r トラックが永久に鳴らない（しかも無言で）。だから両方から呼ぶ。

   置き場所として却下したもの（どちらも「完走ではない経路」を巻き込む）:
     - showTitle()  : btnTitle(中断) からも呼ばれる。途中でやめたのは完走ではない。
                      st.cleared で見分けることもできない——freshState が cleared を持ち越すため、
                      2周目以降は中断時にも既に true になっている。
     - endEpisode() : enterScene():765 の「場面が無い」ガードからも呼ばれる。台本の取得に
                      失敗しただけ（404・オフライン・assets 未配置）で完走扱いになり、
                      round=2 が永続化されて次回の地の文が彼女の声になる＝仕掛けが割れる。
                      あちらは表示だけの経路のままにしておくこと。

   roundDone で二重加算を防ぐ。台本が {title:1} で終わったあと「つづきから」で
   再開して場面を使い切ると nextScene の完走枝も走るため。roundDone は freshState が
   持ち越さないので、次の周では自然に false に戻る。 */
function completeRound(){
  st.cleared=true;
  if(!st.roundDone){ st.roundDone=true; st.round=Math.max(2,(st.round||1)+1); }
  save();
}
function toTitle(){
  completeRound();
  stopBGM(); ambient(false); clearSprites(); setCG(null);
  showTitle();
}

function advance(){
  if(locked) return;
  if(el('choices').classList.contains('show')) return;
  if(_exOpen) return;
  if(typing){ typeFinish(); return; }
  step();
}
function nextScene(){
  const scs=curScenes();
  if(st.scene < scs.length-1){ st.scene++; st.beat=0; save(); enterScene(); }
  else { completeRound(); endEpisode(); }   /* ここだけが「読み切った」＝完走 */
}
function enterScene(){
  /* 台本が無い/場面が足りないときのガード。完走ではないので completeRound() は通さない。 */
  const sc=curScene(); if(!sc){ endEpisode(); return; }
  clearSprites(); speaking(null);
  /* 場面転換: 前の文/名前/タイピング/ボイスを消して新しい文から始める */
  typing=false; clearInterval(typeTimer); el('ttext').innerHTML=''; el('ttext').className=''; el('namebar').className='empty'; el('adv').classList.add('hide'); stopVoice();
  if(sc.bg) setBG(sc.bg); if(sc.bgm) playBGM(sc.bgm); if(sc.amb!=null) ambient(!!sc.amb);
  cur={beats:sc.beats, i:st.beat||0}; stack=[]; locked=false;
  if((st.beat||0)===0 && sc.card){ locked=true; showCard(sc.card); }
  else step();
}
function runFx(kind){ if(kind==='lookup'&&window.BG3D&&window.BG3D.lookUp) window.BG3D.lookUp(); fx(kind); const dur=(kind==='shake'||kind==='hit')?600:(kind==='pline'?1500:(kind==='lookup'?2600:400)); setTimeout(()=>{ locked=false; step(); }, dur); }

/* ---------- カード ---------- */
function showCard(card){
  el('scNo').textContent=card.no||''; el('scTtl').textContent=card.ttl||''; el('scSub').textContent=card.sub||'';
  const c=el('scard'); c.classList.add('show'); locked=true;
  const done=()=>{ c.classList.remove('show'); c._done=true; setTimeout(()=>{ locked=false; step(); }, 700); };
  c._fin=done; clearTimeout(c._t); c._t=setTimeout(done, card.hold||4200);
}

/* ---------- 選択肢 ---------- */
function renderChoices(list, meta){
  const box=el('choices'); box.innerHTML=''; box.classList.add('show'); el('adv').classList.add('hide');
  let tIv=null; const stopT=()=>{ if(tIv){ clearInterval(tIv); tIv=null; } };
  const pick=(o)=>{ stopT(); se('page'); box.classList.remove('show'); if(o.set) st.choices[o.set]=true; save();
    stack.push(cur); cur={beats:o.reply||[], i:0}; step(); };
  const btns=[];
  list.forEach((o,i)=>{ const b=document.createElement('button'); b.className='choice'; b.textContent=o.label;
    b.addEventListener('click',ev=>{ ev.stopPropagation(); pick(o); });
    box.appendChild(b); btns.push(b); });
  if(meta && meta.timed){
    const tw=document.createElement('div'); tw.id='chtimer'; tw.innerHTML='<i></i>'; box.appendChild(tw);
    const bar=tw.querySelector('i'); const t0=Date.now(); const total=meta.timed*1000;
    tIv=setInterval(()=>{ const r=1-(Date.now()-t0)/total; bar.style.width=Math.max(0,r*100)+'%';
      if(r<=0){ const idx=Math.min(meta.timeout||0, list.length-1); pick(list[idx]); } },100);
  }
}

/* ---------- 3D探索ギミック(見回して探す) ---------- */
let _exOpen=false, _exRAF=0;
function renderExplore(e){
  if(cfg.mgskip){ step(); return; }
  const hint=el('exhint'), hs=el('hs');
  el('exlabel').textContent=e.label||'光る印を探せ';
  hint.classList.add('show'); _exOpen=true; el('adv').classList.add('hide');
  const free=(window.BG3D&&window.BG3D.ok);
  if(free) window.BG3D.setFree(true);
  const fin=()=>{ _exOpen=false; cancelAnimationFrame(_exRAF); hint.classList.remove('show'); hs.classList.remove('show');
    if(free) window.BG3D.setFree(false);
    step(); };
  el('exskip').onclick=(ev)=>{ ev.stopPropagation(); fin(); };
  hs.onclick=(ev)=>{ ev.stopPropagation(); if(hs.classList.contains('arrow')) return; fin(); };
  hs.classList.add('show');
  if(free){
    const loop=()=>{ if(!_exOpen) return;
      const p=window.BG3D.project(e.yaw||0, e.pitch||0);
      const W=innerWidth, H=innerHeight, m=46;
      if(p.front && p.x>m && p.x<W-m && p.y>m && p.y<H-m){ hs.classList.remove('arrow'); hs.style.left=p.x+'px'; hs.style.top=p.y+'px'; }
      else{ hs.classList.add('arrow');
        const v=window.BG3D.view(); let d=(((e.yaw||0)-v.lon)+540)%360-180;
        const vert=(e.pitch||0)-v.lat;
        if(Math.abs(vert)>24 && Math.abs(vert)>Math.abs(d)){ hs.querySelector('.a').textContent= vert>0?'▲':'▼'; hs.style.left=(W/2)+'px'; hs.style.top=(vert>0? 96 : H-120)+'px'; }
        else{ hs.querySelector('.a').textContent= d>0?'▶':'◀'; hs.style.left=(d>0? W-64 : 64)+'px'; hs.style.top=(H/2)+'px'; }
      }
      _exRAF=requestAnimationFrame(loop); };
    loop();
  } else { hs.classList.remove('arrow'); hs.style.left=(e.fx||62)+'%'; hs.style.top=(e.fy||42)+'%'; }
}

/* ---------- 既読/ログ ---------- */
function keyOf(t){ let h=0; for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))|0; } return 'k'+h; }
/* ---------- ボイス(ElevenLabs生成音声) ---------- */
/* 地の文は本文だけをハッシュし、話者は接尾辞にする。_k と _r が同じハッシュを共有するので、
   台詞を1文字直せば2本まとめて無効化される（片方だけ古いまま残るのを防ぐ）。 */
function voiceFile(who,text,kind){
  if(kind==='narr') return A+'voice/n'+keyOf(text)+(who==='ren'?'_r':'_k')+'.mp3';
  return A+'voice/v'+keyOf(who+'|'+text)+'.mp3';
}
/* E2E検証用。エンジンが「どのファイルを選んだか」を記録する。
   音量0でも記録されるよう、cfg.voice の早期returnより前で push する。 */
window.__koeVoiceLog=[];
function playVoice(who,text,kind){
  const v=el('voice'); try{v.pause();}catch(e){}
  const f=voiceFile(who,text,kind);
  window.__koeVoiceLog.push(f);
  if(cfg.voice<=0) return;
  v.src=f; v.volume=cfg.voice/100;
  try{ v.currentTime=0; }catch(e){}
  v.play().catch(()=>{});
}
function stopVoice(){ const v=el('voice'); try{ v.pause(); }catch(e){} }
function markSeen(t){ st.seen[keyOf(t)]=1; }
function wasSeen(t){ return !!st.seen[keyOf(t)]; }
const backlog=[];
function pushLog(who,name,text){ backlog.push({who,name,text}); if(backlog.length>200) backlog.shift(); }
function openLog(){ const list=el('bllist'); list.innerHTML=''; backlog.slice(-120).forEach(r=>{ const d=document.createElement('div'); d.className='blrow'+(r.who==='narr'?' narr':''); const c=CHARS[r.who]||CHARS.narr; d.style.setProperty('--who',c.color); d.innerHTML='<span class="bn">'+esc(r.name||'')+'</span><span class="bt">'+esc(r.text)+'</span>'; list.appendChild(d); }); el('backlog').classList.add('show'); el('blinner').scrollTop=el('blinner').scrollHeight; }

function startGame(fresh){
  if(fresh){ st=freshState(st); }   /* freshState(keep) は round を持ち越す */
  /* 2周目の地の文はセイレンの声。round を見て場面開始前に決める。 */
  st.narr = (st.round && st.round>=2) ? 'ren' : 'kanata';
  el('title').classList.add('gone'); ensureCtx(); if(actx&&actx.state==='suspended') actx.resume();
  enterScene();
}
/* タイトルを再表示する唯一の入口。「つづきから」を必ず解禁する。
   タイトルの可視性は2つの独立した仕組みで管理されている: 起動時のタップゲート(openGate)が
   #title に .ready を一度だけ付け(以後は外さない)、ここから先は .gone の付け外しだけで
   表示/非表示を切り替える。.ready を保険として明示的に付けておくのは、万一 openGate 側の
   経路をすべて通らずここに来ても(理論上あり得ないはずだが)黒画面のまま固まらないため。 */
function showTitle(){
  el('tCont').disabled=false;
  el('title').classList.add('ready');
  el('title').classList.remove('gone');
}

/* ---------- タップゲート ----------
   起動直後、彼女の声を1本だけ確実に聞かせてからタイトルを出す。
   終盤でこの声が「あのとき聞いた声だ」と気づかせる仕掛けの前提なので、
   autoplayブロックで素通りされると仕掛けごと死ぬ。ゲートのタップ/クリック/キー入力を
   ユーザー操作の起点にして、そこで鳴らす。
   404・デコード失敗・play()拒否・再生停止・タブが陰に回った・準備段階での同期例外、
   いずれの経路でも6秒の保険タイムアウト(floor)を含めて必ず reveal() に辿り着き、
   黒画面のまま固まらない。reveal() は毎回 el() で要素を取り直すので、準備の途中で
   例外が飛んで g/a のクロージャ変数が未確定でも道連れにしない。
   reason で「本当に鳴り終えた(ended)」と「保険/失敗で開けた」を区別できるようにする
   ——これが無いと、声が一度も鳴らないビルドでもテストが素通りしてしまう。 */
window.__koeGate={played:false, ended:false, currentTime:0, reason:null, detail:null, revealCount:0};
let _gateRevealed=false;
function openGate(){
  if(window.__koeGate.played) return;   // 同じタップで click が二重発火しても一度だけ
  window.__koeGate.played=true;
  const reveal=(reason,detail)=>{
    if(_gateRevealed) return;           // onended/onerror/timeout/play().catch が重なっても一度だけ
    _gateRevealed=true;
    clearTimeout(gateTimer);            // 保険タイマーが本編より後に無駄撃ちしないよう止める
    window.__koeGate.revealCount++;     // E2E検証用: 実際に画面が開いた回数。常に1でなければならない
    window.__koeGate.reason=reason;
    window.__koeGate.detail=detail||null;   // NotAllowedError/NotSupportedError や MediaError.code など
    window.__koeGate.ended=(reason==='ended');
    const a0=el('titlekoe');
    window.__koeGate.currentTime=(a0&&a0.currentTime)||0;
    const g0=el('gate'); if(g0) g0.classList.add('gone');
    el('title').classList.add('ready');
    playBGM('title');
  };
  /* 保険タイムアウトを最初に組む。以降(要素取得・音量計算・play())のどこかで
     同期的に例外が飛んでも、これだけは必ず動いて黒画面のまま固まらせない。
     6秒は「metadataが取れない/取れる前に落ちた」場合の床(floor)。取れれば下で伸ばす。 */
  let gateTimer=setTimeout(()=>{ reveal('timeout'); }, 6000);
  try{
    const a=el('titlekoe');
    ensureCtx(); if(actx&&actx.state==='suspended') actx.resume();
    /* この1本だけは音量下限を張る。聞き流させるが、聞こえないのは困る。
       cfg.voice 自体は触らない——ミュートしたプレイヤーは後でミュートのまま見つけられる。
       localStorage 由来の壊れた値(undefined/範囲外)でも volume の setter が例外を投げないよう
       0-100 にクランプしてから正規化する。 */
    const vRaw=Number(cfg.voice);
    const vNorm=isFinite(vRaw)?Math.min(100,Math.max(0,vRaw)):0;
    a.volume=Math.max(0.20, vNorm/100);
    a.onended=()=>reveal('ended');
    a.onerror=()=>{                     // 音源が無くても(今日の実態=404)進める
      console.warn('[koe] title-koe.mp3 failed to load'+(a.error?' (code='+a.error.code+')':''));
      reveal('error', a.error&&a.error.code);
    };
    /* 曲の長さが分かったら保険を「曲の長さ+余裕」まで伸ばす。metadataが来ない(=404等)場合は
       上の6秒床のまま——健全な短い声を保険タイムアウト側で誤って刈り取らないための調整。
       preload=auto はパース時点から読み込みが進んでいるので、タップした瞬間には
       既に readyState>=HAVE_METADATA(=1) になっていることがある(キャッシュ済みなら普通に起こる)。
       その場合 loadedmetadata は二度と発火しないので、イベント待ちだけでは伸びない
       ——だから「今の状態」も同じ関数で即座にチェックする。 */
    const extendForDuration=()=>{
      if(_gateRevealed) return;
      const durMs=isFinite(a.duration)?a.duration*1000:0;
      if(durMs>6000){ clearTimeout(gateTimer); gateTimer=setTimeout(()=>{ reveal('timeout'); }, durMs+1500); }
    };
    a.addEventListener('loadedmetadata', extendForDuration);
    if(a.readyState>=1) extendForDuration();   // HAVE_METADATA 相当。読み込み済みなら今すぐ反映
    a.play().catch(err=>reveal('rejected', err&&err.name));
  }catch(e){ reveal('threw', e&&e.message); }
}
/* touchstart は使わない: passive のため preventDefault できず、タップ後にブラウザが合成する
   互換 click は "その時点で指の下にある要素" に対してヒットテストされる。今日の404では
   reveal() がタップの直後(マイクロタスク内)に走るため、合成clickの時点では既にゲートが
   閉じかけていて、下の #title の「はじめから」などに落ちることがある
   (スマホ実機で確認済みのゴーストクリック)。html,body の touch-action:manipulation で
   300ms遅延はすでに無いので、click 一本で十分。 */
el('gate').addEventListener('click', openGate, {once:true});
document.addEventListener('keydown', e=>{
  if(el('gate').classList.contains('gone')) return;   // ゲート通過後は無視
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); openGate(); }
});

function endEpisode(){
  stopBGM(); ambient(false); clearSprites();
  /* ここでは round を触らない。呼び出し元は2つあり、片方 (enterScene():766 の
     「場面が無い」ガード) は完走ではないため。round は completeRound() 側の責務。 */
  st.cleared=true; save();
  playBGM('ed');
  el('namebar').className='empty'; el('adv').classList.add('hide');
  const c=el('scard'); c._done=true; clearTimeout(c._t);
  el('scNo').textContent=''; el('scTtl').textContent='完'; el('scSub').textContent='';
  c.classList.add('show'); locked=true;
  c._t=setTimeout(()=>{
    c.classList.remove('show');
    showTitle();
  }, 6400);
}

<script src="assets/koe/koe-ep1.js"></script>
<script>
/* 台本を後読みした場合の再バインド */
if(window.KOE){ for(const k in window.KOE) SCRIPT[k]=window.KOE[k]; }

/* あらゆる深さの choose[].reply[] / when の reply などを再帰的に辿る。
   scenes/beats/reply/choose のようなキー名を決め打ちで1〜2段だけ辿ると、
   分岐の中の分岐（choose の reply の中の choose、等）が無言で検査から漏れる。
   これは scripts/koe/voice_audit.py の _walk() が一度やらかして直した設計判断と
   まったく同じ理由なので、同じ形（キー名を決め打ちしない再帰）に揃える。 */
function walkNodes(node, visit, seen){
  seen = seen || new Set();
  if(Array.isArray(node)){ node.forEach(n=>walkNodes(n, visit, seen)); return; }
  if(node && typeof node==='object'){
    /* seen はオブジェクトの循環参照だけ止める。自己参照する配列は Array.isArray()
       の分岐で seen に触れる前に再帰してしまうため、ここでは防げず RangeError
       (スタックオーバーフロー)で落ちる。台本データにそんな配列が来ることは
       想定していないので、直さず落ちるままにしてある——scripts/koe/voice_audit.py
       の _walk() が同じ非対称を正直に書いている(id()ベースのvisitedはdictの
       自己参照だけ防ぐ)のに合わせた。 */
    if(seen.has(node)) return;
    seen.add(node);
    visit(node);
    for(const k in node) walkNodes(node[k], visit, seen);
  }
}

/* 台本ロード検査 + 背景(bg)/BGM(bgm)キー実在検査。両方をここに置く理由:
   assets/koe/koe-ep1.js が404/オフライン/ブロックで読み込めなかった場合、直前の
   再バインドは何もせず、SCRIPT は関数冒頭のフォールバック
   （{ ep1:{ title:..., scenes:[] } }）のまま残る。curScenes() はこれを
   「場面が0個の台本」として扱い、はじめから→即 enterScene() の「場面が無い」
   ガード(endEpisode())に落ちて、プレイヤーには「完」カードが正常に出る＝
   台本が1文字も読めていないのに完走したように見える。
   bg/bgm キーの実在検査も同じ場所に置く: 未定義キーは setBGcss()（BGS.voidの
   グラデーションに黙って差し替わる）/ playBGM()（`if(!file) return;` で
   無音スキップ）のどちらも当人の手前で握り潰すので、外から気づけない。
   両方をタイトル表示より前・台本読み込み後の同じ場所
   （koe-ep1.js の後読み再バインド関数 = 直前のコードブロック の直後）で
   一度だけ走らせる。台本ロード検査を先に置くのは、bg/bgmキー検査が
   `if(!script) return;` で台本未読込そのものは黙って見逃すため
   （script が無ければ「調べる対象が無い」だけで、それ自体は別の異常）。 */
(function assertScriptLoadedAndKeys(){
  const ep = SCRIPT[EPS[0]];
  const ok = ep && Array.isArray(ep.scenes) && ep.scenes.length>0;
  if(!ok){
    /* throw するだけでは足りない: この <script> が例外で止まっても、既に前の
       <script> でバインド済みの #gate/#tStart のクリックハンドラは生きたまま
       残るので、プレイヤーはタップ→はじめからと普通に進めてしまい、結局
       enterScene() の「場面が無い」ガードで「完」に無言で落ち着く。
       それでは「うるさくする」ことにならないので、開始系ボタンをここで
       物理的に潰し、「完」に辿り着く経路そのものを断つ。
       なお #tStart/#tLoad はマークアップ側で最初から disabled にしてある
       (fail-closed)。koe-ep1.js の取得が遅い/ハングしている間（きれいな404では
       ない場合）は、この <script> タグ自体がまだ実行されておらず、ここに
       辿り着く前にユーザー入力だけは処理され得る——その間もボタンが
       disabled のままであることが安全側のデフォルトになる。ここでの
       .disabled=true は「念のための再確認」であって、安全性の主因ではない。 */
    ['tStart','tCont','tLoad'].forEach(id=>{ const b=el(id); if(b) b.disabled=true; });
    throw new Error('koe: 台本 assets/koe/koe-ep1.js が読み込めていません（scenesが空）。404・オフライン・パス間違いの可能性。開始ボタンを無効化した。');
  }
  const badBg = [], badBgm = [];
  walkNodes(ep.scenes, node=>{
    if(node.bg!=null && !BGS[node.bg]) badBg.push(node.bg);
    if(node.bgm!=null && !BGM[node.bgm]) badBgm.push(node.bgm);
  });
  if(badBg.length || badBgm.length){
    const parts=[];
    if(badBg.length) parts.push('未定義のBGキー: '+[...new Set(badBg)].join(', '));
    if(badBgm.length) parts.push('未定義のBGMキー: '+[...new Set(badBgm)].join(', '));
    throw new Error('koe: '+parts.join(' / '));
  }
  /* ここまで通れば台本は読めていて bg/bgm キーもすべて実在する。
     fail-closed で最初から disabled にしていた開始系ボタンをここで解禁する。
     tCont は「保存があるとき」だけ解禁する（保存が無ければ従来どおり無効のまま）。 */
  ['tStart','tLoad'].forEach(id=>{ const b=el(id); if(b) b.disabled=false; });
  if(hasSave) el('tCont').disabled=false;
})();
</script>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';
const AP='assets/koe/';
const canvas=document.getElementById('bg3d');
let renderer=null;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ window.BG3D={ok:false}; }
if(renderer){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 100);
  const loader=new THREE.TextureLoader();
  const geo=new THREE.SphereGeometry(10,64,44);
  function applyTex(t){ t.colorSpace=THREE.SRGBColorSpace; t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; return t; }
  function mkSphere(){ const m=new THREE.MeshBasicMaterial({side:THREE.BackSide,transparent:true,opacity:0,depthTest:false,depthWrite:false});
    const s=new THREE.Mesh(geo,m); s.rotation.y=Math.PI/2; scene.add(s); return s; }
  const sA=mkSphere(), sB=mkSphere(); let cur=sA;
  const cache={}; let fades=[];
  function loadTex(key, ok, fail){
    if(cache[key]){ ok(cache[key]); return; }
    loader.load(AP+'pano-'+key+'.jpg', t=>{ cache[key]=applyTex(t); ok(cache[key]); }, undefined, ()=>fail&&fail());
  }
  let freeMode=false;
  window.BG3D={ ok:true, _moved:false,
    setFree(on){ freeMode=on; if(!on){ tlon=Math.max(-28,Math.min(28,tlon)); tlat=Math.max(-17,Math.min(17,tlat)); } },
    view(){ return {lon:lon, lat:lat}; },
    lookUp(){ tlat=44; tlon=tlon*0.3; },
    project(lonH,latH){ const phi=THREE.MathUtils.degToRad(90-latH), th=THREE.MathUtils.degToRad(lonH);
      const v=new THREE.Vector3(Math.sin(phi)*Math.sin(th), Math.cos(phi), -Math.sin(phi)*Math.cos(th));
      const dir=new THREE.Vector3(); camera.getWorldDirection(dir); const front=v.dot(dir)>0.15;
      const q=v.clone().project(camera);
      return {x:(q.x*0.5+0.5)*innerWidth, y:(-q.y*0.5+0.5)*innerHeight, front:front}; },
    setPano(key, onOk, onFail){
      loadTex(key, t=>{
        const inc=(cur===sA)?sB:sA, out=cur;
        inc.material.map=t; inc.material.needsUpdate=true; inc.renderOrder=2; out.renderOrder=1;
        fades=fades.filter(f=>f.inc!==inc && f.inc!==out);
        fades.push({inc,out,t:(inc.material.opacity||0)}); cur=inc; onOk&&onOk();
      }, ()=>{ onFail&&onFail(); });
    } };
  // 見回し操作
  let lon=0,lat=2,tlon=0,tlat=0, drag=false, sx=0,sy=0, dist=0, auto=0, gyroOn=false, glon=0,glat=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function down(x,y){ drag=true; sx=x; sy=y; dist=0; window.BG3D._moved=false; }
  function move(x,y){ if(!drag) return; const dx=x-sx, dy=y-sy; dist+=Math.abs(dx)+Math.abs(dy);
    const LN=freeMode?170:28, LT=freeMode?58:17;
    tlon=clamp(tlon - dx*0.09, -LN,LN); tlat=clamp(tlat + dy*0.08, -LT,LT); sx=x; sy=y; if(dist>10) window.BG3D._moved=true; }
  function up(){ drag=false; }
  window.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('#hud,#textwrap,#choices,#backlog,#settings,#savemenu,#title,#exhint,#hs,#gate')) return; down(e.clientX,e.clientY); });
  window.addEventListener('pointermove',e=>move(e.clientX,e.clientY),{passive:true});
  window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  window.addEventListener('deviceorientation',e=>{ if(e.gamma==null) return; gyroOn=true;
    glon=clamp(e.gamma*0.7,-22,22); glat=clamp((e.beta-45)*0.35,-15,15); }, true);
  function resize(){ const a=innerWidth/innerHeight; camera.aspect=a; camera.fov=a<1?58:72; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false); }
  window.addEventListener('resize',resize); resize();
  function tick(){ requestAnimationFrame(tick);
    auto+=0.0015; const still=freeMode||window.KOE_FIXVIEW;
    const ax=still?0:Math.sin(auto)*6, ay=still?0:Math.cos(auto*0.6)*2.2;
    const goalLon=tlon+ax+((gyroOn&&!still)?glon:0), goalLat=tlat+ay+((gyroOn&&!still)?glat:0)+(still?0:2);
    lon+=(goalLon-lon)*(still?0.12:0.045); lat+=(goalLat-lat)*(still?0.12:0.045);
    if(!drag && !still){ tlon*=0.985; tlat*=0.985; }
    const phi=THREE.MathUtils.degToRad(90-lat), th=THREE.MathUtils.degToRad(lon);
    camera.lookAt(Math.sin(phi)*Math.sin(th), Math.cos(phi), -Math.sin(phi)*Math.cos(th));
    for(const f of fades){ f.t=Math.min(1,f.t+0.02); f.inc.material.opacity=f.t; f.out.material.opacity=Math.max(0,1-f.t); }
    fades=fades.filter(f=>f.t<1);
    renderer.render(scene,camera);
  }
  tick();
  const hint=document.getElementById('hint3d');
  if(hint){ setTimeout(()=>{ hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),4200); }, 1800); }
}
</script>
