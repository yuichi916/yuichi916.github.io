<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>KV render</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;background:#000;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
#stage{position:relative;width:1600px;height:900px;overflow:hidden;background:#0a0e16}
/* 上=朝の空と塔(希望) */
.sky{position:absolute;inset:0;background:url('assets/seikai/op3d/townrise2/f0100.jpg') center/cover;
  filter:saturate(1.08) brightness(1.04)}
.skywarm{position:absolute;inset:0;background:
  radial-gradient(ellipse at 78% 18%,rgba(255,214,140,.42),transparent 55%),
  linear-gradient(200deg,rgba(255,190,110,.20),transparent 55%);mix-blend-mode:soft-light}
/* 左下=地下世界(斜めに侵食) */
.under{position:absolute;inset:0;background:url('assets/seikai/op3d/canyon/f0080.jpg') 30% 60%/cover;
  clip-path:polygon(0 0,47% 0,26% 100%,0 100%);
  filter:brightness(.62) saturate(.9)}
.undertint{position:absolute;inset:0;background:linear-gradient(115deg,rgba(8,20,34,.78),rgba(16,42,64,.35) 42%,transparent 55%);
  clip-path:polygon(0 0,47% 0,26% 100%,0 100%);mix-blend-mode:multiply}
.underneon{position:absolute;inset:0;background:
  radial-gradient(ellipse at 12% 78%,rgba(64,208,255,.20),transparent 42%),
  radial-gradient(ellipse at 30% 30%,rgba(255,90,140,.14),transparent 38%);
  clip-path:polygon(0 0,47% 0,26% 100%,0 100%)}
/* 分割線=金の道筋(下から昇り、上で三つに分かれる) */
svg{position:absolute;inset:0}
/* キャラ */
.ch{position:absolute;bottom:-2%;filter:drop-shadow(0 14px 40px rgba(0,0,0,.75))}
#kai{left:13.5%;height:66%;transform:translateX(-50%)}
#rin{left:56%;height:74%;transform:translateX(-50%)}
.rimL{position:absolute;bottom:0;left:4%;width:22%;height:75%;background:radial-gradient(ellipse at 60% 55%,rgba(90,200,255,.16),transparent 60%)}
.rimR{position:absolute;bottom:0;left:44%;width:26%;height:84%;background:radial-gradient(ellipse at 50% 50%,rgba(255,220,150,.22),transparent 62%)}
/* 足元の影 */
.floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(0deg,rgba(4,6,12,.72),transparent)}
/* タイポ */
#type{position:absolute;right:5.4%;top:13%;text-align:right}
#type .eye{font-family:Georgia,serif;font-size:16px;letter-spacing:.6em;color:#c9a24a;text-transform:uppercase}
#type h1{margin-top:20px;font-size:112px;font-weight:600;letter-spacing:.1em;
  background:linear-gradient(180deg,#fff 16%,#ffd24a 72%,#ff9a4a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 30px rgba(255,200,90,.28))}
#type .sub{margin-top:22px;font-size:21px;letter-spacing:.24em;color:#3a4254;line-height:2.1;
  text-shadow:0 1px 10px rgba(255,255,255,.65)}
#type .chips{margin-top:30px;display:flex;gap:12px;justify-content:flex-end}
#type .chip{border:1px solid rgba(201,162,74,.75);color:#ffe1a0;font-size:14px;letter-spacing:.3em;
  padding:8px 18px 8px 20px;background:rgba(10,14,22,.55)}
/* 断章カードの気配(小) */
#fragmini{position:absolute;left:31%;top:12%;width:150px;background:linear-gradient(160deg,rgba(10,14,22,.9),rgba(18,24,36,.85));
  border:1px solid rgba(201,162,74,.6);padding:10px 12px;box-shadow:0 0 22px rgba(201,162,74,.25);transform:rotate(-4deg)}
#fragmini .fen{font-family:Georgia,serif;font-size:8px;letter-spacing:.44em;color:#c9a24a}
#fragmini .fjp{font-size:12px;letter-spacing:.2em;color:#e6ebf4;margin-top:6px}
/* 仕上げ */
.vig{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(2,4,10,.6)}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,196,120,.10),rgba(10,16,28,.16));mix-blend-mode:soft-light}
</style></head>
<body>
<div id="stage">
  <div class="sky"></div><div class="skywarm"></div>
  <div class="under"></div><div class="undertint"></div><div class="underneon"></div>
  <div class="rimL"></div><div class="rimR"></div>
  <svg viewBox="0 0 1600 900" preserveAspectRatio="none">
    <path d="M368,940 C400,700 430,520 520,380 C580,290 660,240 780,205" fill="none" stroke="#ffd24a" stroke-width="4"
      style="filter:drop-shadow(0 0 12px #ffca4a)" opacity=".92"/>
    <path d="M780,205 C860,182 940,175 1030,180" fill="none" stroke="#ffd24a" stroke-width="2.4"
      style="filter:drop-shadow(0 0 9px #ffca4a)" opacity=".65"/>
    <path d="M780,205 C850,160 920,120 990,95" fill="none" stroke="#ffd24a" stroke-width="2.4"
      style="filter:drop-shadow(0 0 9px #ffca4a)" opacity=".65"/>
    <path d="M780,205 C820,140 850,80 866,30" fill="none" stroke="#ffd24a" stroke-width="2.4"
      style="filter:drop-shadow(0 0 9px #ffca4a)" opacity=".65"/>
    <circle cx="368" cy="852" r="13" fill="none" stroke="#ffd24a" stroke-width="2.4" style="filter:drop-shadow(0 0 8px #ffca4a)"/>
    <text x="368" y="858" font-family="Georgia" font-size="16" fill="#ffd24a" text-anchor="middle">1</text>
    <circle cx="520" cy="380" r="13" fill="none" stroke="#ffd24a" stroke-width="2.4" style="filter:drop-shadow(0 0 8px #ffca4a)"/>
    <text x="520" y="386" font-family="Georgia" font-size="16" fill="#ffd24a" text-anchor="middle">2</text>
    <circle cx="780" cy="205" r="13" fill="none" stroke="#ffd24a" stroke-width="2.4" style="filter:drop-shadow(0 0 8px #ffca4a)"/>
    <text x="780" y="211" font-family="Georgia" font-size="16" fill="#ffd24a" text-anchor="middle">3</text>
  </svg>
  <img class="ch" id="kai" src="assets/seikai/cg-kai.png">
  <img class="ch" id="rin" src="assets/seikai/cg-rin.png">
  <div class="floor"></div>
  <div id="fragmini"><div class="fen">FRAGMENT — 断章</div><div class="fjp">光のない朝</div></div>
  <div id="type">
    <div class="eye">SEIKAI SAGA — CASE 01</div>
    <h1>正解の外側</h1>
    <div class="sub">すべての正解が視える俺が、<br>答えのない少女と世界を変えるまで。</div>
    <div class="chips"><span class="chip">全十五話</span><span class="chip">三つの結末</span><span class="chip">ブラウザで、無料</span></div>
  </div>
  <div class="grade"></div><div class="vig"></div>
</div>
<script>window.__mode=function(m){document.getElementById('type').style.display=m==='notext'?'none':'block';document.getElementById('fragmini').style.display=m==='notext'?'none':'block'};</script>
</body></html>
