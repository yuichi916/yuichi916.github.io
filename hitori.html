<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ひとり歓迎マップ Pro。根拠付き情報と一緒に、一人のための場所を探せます。" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>ひとり歓迎マップ Pro</title>
  <style>
    html, body { width: 100%; min-height: 100%; margin: 0; background: #f8f5ef; }
    .handoff { max-width: 36rem; margin: 18vh auto; padding: 2rem; color: #2c2723; font: 16px/1.7 system-ui, sans-serif; text-align: center; }
    .handoff a { color: #8f4938; }
  </style>
</head>
<body>
  <main class="handoff"><p>ひとり歓迎マップの最新情報を開いています。</p><p><a id="manus-link" href="https://hitorimap-nc8t8eqr.manus.space/">自動で移動しない場合はこちら</a></p></main>
  <noscript><p class="handoff">このページはManus版の最新情報へ移動します。JavaScriptを有効にするか、<a href="https://hitorimap-nc8t8eqr.manus.space/">ひとり歓迎マップ Pro</a>を開いてください。</p></noscript>
  <script>
    (() => {
      const MANUS_ORIGIN = "https://hitorimap-nc8t8eqr.manus.space";
      const params = new URLSearchParams(window.location.search);
      const facilityId = params.get("facility") || params.get("externalId");
      const target = new URL(MANUS_ORIGIN + "/");

      if (facilityId) {
        target.pathname = `/facilities/${encodeURIComponent(facilityId)}`;
      } else {
        const query = params.get("q") || params.get("query");
        if (query) target.searchParams.set("q", query);
      }

      const destination = target.toString();
      document.getElementById("manus-link").href = destination;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
