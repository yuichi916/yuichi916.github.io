<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ひとり歓迎マップ Pro。根拠付き情報と一緒に、一人のための場所を探せます。" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>ひとり歓迎マップ Pro</title>
  <style>
    html, body { width: 100%; min-height: 100%; margin: 0; background: #f8f5ef; }
    body { overflow: hidden; }
    #manus-mirror { display: block; width: 100%; height: 100dvh; border: 0; background: #f8f5ef; }
    .noscript { padding: 2rem; font-family: system-ui, sans-serif; color: #2c2723; }
    .noscript a { color: #8f4938; }
  </style>
</head>
<body>
  <iframe id="manus-mirror" title="ひとり歓迎マップ Pro" allow="geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <noscript><p class="noscript">このページはManus版をそのまま表示します。JavaScriptを有効にするか、<a href="https://hitorimap-nc8t8eqr.manus.space/">ひとり歓迎マップ Pro</a>を開いてください。</p></noscript>
  <script>
    (() => {
      const MANUS_ORIGIN = "https://hitorimap-nc8t8eqr.manus.space";
      const params = new URLSearchParams(window.location.search);
      const facilityId = params.get("facility") || params.get("externalId");
      const target = new URL(MANUS_ORIGIN + "/");

      if (facilityId) {
        target.pathname = `/facilities/${encodeURIComponent(facilityId)}`;
      } else {
        const query = params.get("q") || params.get("query");
        if (query) target.searchParams.set("q", query);
      }

      const frame = document.getElementById("manus-mirror");
      frame.src = target.toString();
    })();
  </script>
</body>
</html>
