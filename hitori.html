  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"ひとり歓迎マップ","url":"https://yuichi916.github.io/hitori.html","applicationCategory":"TravelApplication","operatingSystem":"Web","description":"ひとりで入れるかを根拠つきで示す、全国のソロ活スポット地図","offers":{"@type":"Offer","price":"0","priceCurrency":"JPY"}}</script>
  <style>
    :root { --paper:#faf7f1; --white:#fffdfa; --ink:#2c2723; --muted:#756b64; --line:#e8ded4; --accent:#ad5039; --accent-pale:#f4e7dd; --sage:#276b60; --sage-pale:#e8f3ef; --gold:#f5c24a; --danger:#b3261e; --header:52px; --ease:cubic-bezier(.2,.7,.3,1); }
    * { box-sizing:border-box; } html,body { height:100%; margin:0; overflow:hidden; background:var(--paper); color:var(--ink); font-family:"Noto Sans JP",system-ui,sans-serif; font-size:14px; line-height:1.6; }
    button,input,select,textarea { font:inherit; color:inherit; } button { cursor:pointer; }
    :focus-visible { outline:3px solid #f7e4dc; outline-offset:2px; }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
    header { position:fixed; inset:0 0 auto 0; height:var(--header); z-index:30; display:flex; align-items:center; gap:10px; padding:0 10px 0 12px; background:rgba(255,253,250,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
    .brand { display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit; min-width:0; flex:1; }
    .brand .mark { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:var(--accent); color:#fff; font-family:"Noto Serif JP",serif; font-size:16px; }
    .brand strong { font-family:"Noto Serif JP",serif; font-size:15px; letter-spacing:-.02em; white-space:nowrap; }
    .brand small { display:block; color:var(--muted); font-size:10px; line-height:1.2; }
    .hbtn { min-width:44px; height:44px; padding:0 10px; border:1px solid var(--line); border-radius:999px; background:#fff; font-weight:700; font-size:13px; }
    .hbtn[aria-pressed="true"] { border-color:#d39c88; background:#fff3ed; }
    #map { position:fixed; inset:var(--header) 0 0 0; z-index:1; background:#e9ecef; }
    .leaflet-container { font-family:inherit; }
    .leaflet-control-attribution { font-size:10px; }
    .pin { display:grid; place-items:center; width:26px; height:26px; border:3px solid #fffdfa; border-radius:50%; color:#fff; background:var(--accent); box-shadow:0 3px 10px rgba(57,36,24,.3); font-size:11px; font-weight:700; }
    .pin.selected { width:38px; height:38px; background:#713422; outline:4px solid var(--gold); font-size:13px; }
    .pin.saved { background:var(--sage); }
    .origin-dot { width:16px; height:16px; border:3px solid #fff; border-radius:50%; background:#1f6feb; box-shadow:0 0 0 6px rgba(31,111,235,.2); }
    /* ボトムシート */
    /* シートは transform で下げず、top を動かす。translate で下げると
       シートの下端が画面の外に出たまま高さを保ち、#sheet-body の
       最後の数百pxがスクロールしても永久に画面外に残る（「もっと見る」に届かない）。 */
    #sheet { position:fixed; left:0; right:0; bottom:0; z-index:20; top:74vh; background:var(--white); border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(76,47,28,.16); transition:top .28s var(--ease); display:flex; flex-direction:column; touch-action:none; }
    #sheet[data-snap="peek"] { top:74vh; } #sheet[data-snap="half"] { top:44vh; } #sheet[data-snap="full"] { top:var(--header); }
    #sheet-handle { flex:none; height:44px; display:grid; place-items:center; border:0; background:none; width:100%; }
    #sheet-handle i { width:40px; height:5px; border-radius:5px; background:#d9cfc4; }
    #sheet-body { flex:1; overflow:auto; padding:0 14px 90px; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
    .rebtn { position:fixed; top:calc(var(--header) + 12px); left:50%; transform:translateX(-50%); z-index:25; height:44px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:#fff; font-weight:700; font-size:12px; box-shadow:0 4px 14px rgba(57,36,24,.15); display:none; }
    .rebtn.show { display:block; }
    @media (max-width:899px) { #sheet[data-snap="full"] ~ .rebtn { display:none; } }
    /* home */
    .claim { margin:6px 0 2px; font-family:"Noto Serif JP",serif; font-size:24px; line-height:1.3; letter-spacing:-.03em; }
    .claim em { font-style:normal; color:var(--accent); }
    .lede { margin:0 0 12px; color:var(--muted); font-size:12.5px; }
    .lede b { color:var(--ink); } .lede b.official { color:var(--sage); }
    .ways { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .way { min-height:56px; border:1px solid var(--line); border-radius:14px; background:#fff; font-weight:700; font-size:14px; }
    .way.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .scenes { display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 6px; }
    .scenes button { min-height:44px; padding:0 12px; border:1px solid #ead8cc; border-radius:999px; background:#fffaf4; color:#8d4734; font-weight:700; font-size:12.5px; }
    .sec-label { margin:16px 0 6px; color:#9b4934; font-size:10.5px; font-weight:700; letter-spacing:.14em; }
    /* list */
    .search { position:relative; margin:4px 0 6px; }
    .search input { width:100%; min-height:44px; padding:0 12px 0 36px; border:1px solid var(--line); border-radius:12px; background:#fff; outline:none; }
    .search input:focus { border-color:#c98d79; box-shadow:0 0 0 3px #f7e4dc; }
    .search .icon { position:absolute; left:12px; top:11px; color:#9b928b; }
    .suggest { position:absolute; left:0; right:0; top:46px; z-index:5; margin:0; padding:4px; list-style:none; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 25px rgba(57,36,24,.14); display:none; }
    .suggest.show { display:block; } .suggest li button { width:100%; min-height:44px; text-align:left; padding:0 10px; border:0; background:none; border-radius:8px; } .suggest li button:hover { background:#f7f2ec; }
    .suggest small { color:var(--muted); margin-left:6px; }
    .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
    #more-filters[hidden] { display:none; }
    .tog { display:inline-flex; align-items:center; gap:5px; min-height:44px; padding:0 13px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:13px; font-weight:700; color:#625955; }
    .tog .badge { display:inline-grid; place-items:center; min-width:20px; height:20px; border-radius:999px; background:var(--accent); color:#fff; font-size:11px; }
    .tog[aria-pressed="true"] { border-color:#b85b43; color:#8f4938; background:#fff3ed; }
    select.tog { padding:0 8px; }
    .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent); } .chips::-webkit-scrollbar { display:none; }
    .chip { flex:none; min-height:44px; padding:0 14px; border:0; border-radius:999px; background:#f5f0ea; color:#6f655f; font-size:13.5px; font-weight:700; }
    .chip[aria-pressed="true"] { background:var(--accent); color:#fff; }
    .origin-line { margin:6px 0 4px; color:var(--muted); font-size:12.5px; } .origin-line b { color:var(--ink); }
    .count { display:flex; align-items:baseline; gap:10px; margin:7px 0 6px; color:var(--muted); font-size:13px; } .count .v { color:var(--sage); font-size:14px; }
    .notice { margin:8px 0; padding:10px 12px; border:1px dashed #d9cec4; border-radius:12px; color:#6f655f; font-size:12.5px; }
    .notice.err { color:var(--danger); border-color:#e7b7b3; }
    .card { position:relative; display:block; width:100%; cursor:pointer; margin-bottom:9px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:#fff; text-align:left; transition:border-color .15s, transform .15s; }
    .card:hover,.card.selected { border-color:#d39c88; transform:translateY(-1px); }
    .card.unverified { background:#fcfaf6; border-style:dashed; }
    .card .top { padding-right:46px; font-size:12px; line-height:1.5; }
    .card .vmark { color:var(--sage); font-weight:700; } .card .cand { color:#9a8f86; font-weight:700; } .card .cand.ref { color:#8a6f3f; }
    .card h3 { margin:5px 0 3px; font-family:"Noto Serif JP",serif; font-size:17.5px; line-height:1.35; display:flex; gap:8px; align-items:baseline; }
    .card h3 .num { flex:none; display:inline-grid; place-items:center; min-width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-family:"Noto Sans JP",sans-serif; }
    .card.unverified h3 .num { background:#b9ada3; }
    .card .meta { color:#6b615a; font-size:12.5px; display:flex; flex-wrap:wrap; gap:3px 10px; }
    .card .meta .open { color:var(--sage); font-weight:700; } .card .meta .closed { color:#9a6b1d; }
    .card .facts { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
    .card .facts span { padding:4px 9px; border-radius:999px; background:var(--sage-pale); color:var(--sage); font-size:12px; font-weight:700; }
    .card .facts span.chain { background:#efefee; color:#65615d; } .card .facts span.gem { background:var(--accent-pale); color:#954631; }
    .card .fit { margin-top:7px; color:#857a72; font-size:12.5px; }
    .heart { position:absolute; top:7px; right:8px; width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:#fff; font-size:17px; color:#b08a7c; }
    .heart[aria-pressed="true"] { background:#fff3ed; border-color:#d39c88; color:var(--accent); }
    /* カード内の施設名ボタン。all:unset は :focus-visible の輪郭まで消すので、クラスにして戻す */
    .open-detail { all:unset; cursor:pointer; }
    .open-detail:focus-visible { outline:3px solid #f7e4dc; outline-offset:2px; }
    .open-detail.link { color:#8d4734; font-weight:700; }
    .more { width:100%; min-height:44px; border:1px dashed #d9cec4; border-radius:12px; background:none; color:var(--muted); }
    /* ひとりチェック（詳細シートの信号機）。数字ではなく「何が分かっているか」を出す */
    .solo-box { margin:12px 0; padding:12px 13px; border:1px solid #ead8cc; border-radius:13px; background:#fffaf4; }
    .solo-box .sec-label { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 0 8px; }
    .solo-box .score { color:var(--sage); font-size:12px; letter-spacing:0; }
    .checks { margin:0; padding:0; list-style:none; }
    .ck { display:grid; grid-template-columns:20px 68px 1fr auto; align-items:center; gap:8px; padding:7px 0; border-top:1px solid #f0e4da; font-size:13.5px; }
    .ck:first-child { border-top:0; }
    .ck .mk { font-size:14px; line-height:1; text-align:center; }
    .ck.ok .mk { color:var(--sage); } .ck.weak .mk { color:#9a6b1d; } .ck.unknown .mk { color:#c3b7ad; } .ck.blocked .mk { color:var(--danger); }
    .ck .lb { color:#8d4734; font-weight:700; font-size:12.5px; }
    .ck .sh { color:var(--ink); }
    .ck.unknown .sh { color:#9c918a; }
    .ck.blocked .sh { color:var(--danger); font-weight:700; }
    .ck .why { min-height:32px; padding:0 9px; border:1px solid #e4d5c9; border-radius:999px; background:#fff; color:#8a7264; font-size:11px; font-weight:700; }
    .ck .qt { grid-column:2 / -1; margin:4px 0 2px; padding:8px 10px; border-radius:9px; background:#fff; color:#5f554e; font-size:12px; line-height:1.7; }
    .ck .qt em { color:var(--sage); font-style:normal; font-weight:700; }
    .ck-legend { margin:9px 0 0; color:#8a7f77; font-size:11px; line-height:1.6; }
    /* 長文は畳む。開いた瞬間に文章を浴びせない */
    .fold { margin:12px 0; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .fold > summary { display:flex; flex-direction:column; gap:3px; min-height:44px; padding:10px 13px; cursor:pointer; list-style:none; }
    .fold > summary::-webkit-details-marker { display:none; }
    .fold > summary::after { content:"▾"; position:absolute; right:14px; color:#a89a90; }
    .fold { position:relative; }
    .fold[open] > summary::after { content:"▴"; }
    .fold > summary b { font-size:13px; font-weight:700; padding-right:20px; }
    .fold > summary .sec-label { margin:0; }
    .fold-body { margin:0; padding:0 13px 12px; color:#5f554e; font-size:12.5px; line-height:1.8; }
    .facts-conflict { margin:12px 0; }
    .fact-row { padding:8px 10px; margin-bottom:6px; border-radius:10px; background:#f8f5ef; font-size:12.5px; }
    .fact-row b { display:block; color:#635a54; font-size:11px; }
    .fact-row .warn { color:#9a6b1d; }
    .fact-row .val small { color:var(--muted); }
    .fact-row .val a { color:#8d4734; }
    .fact-row.conflict { border-left:3px solid #9a6b1d; background:#fdf7ee; }
    .verified-box .vsub { display:inline-block; margin-top:2px; opacity:.85; font-size:12px; }
    .skel { height:84px; margin-bottom:8px; border-radius:14px; background:linear-gradient(90deg,#f3ede6,#faf7f1,#f3ede6); background-size:200% 100%; animation:sk 1.2s infinite; } @keyframes sk { to { background-position:-200% 0; } }
    /* desktop */
    @media (min-width:900px) {
      #map { inset:var(--header) 0 0 420px; }
      #sheet, #sheet[data-snap] { top:var(--header); bottom:0; left:0; right:auto; width:420px; height:auto; border-radius:0; box-shadow:4px 0 24px rgba(76,47,28,.08); transform:none !important; border-right:1px solid var(--line); }
      #sheet-handle { display:none; } #sheet-body { padding:12px 16px 40px; }
      .rebtn { top:auto; bottom:18px; left:calc(420px + (100% - 420px) / 2); }
      #more-filters[hidden] { display:flex; }
      #btn-filters { display:none; }
      .chips { -webkit-mask-image:none; mask-image:none; }
      /* 横スクロールは指で動かすモバイルの作り。420px の固定パネルでは端でチップが切れるので折り返す。 */
      .chips { flex-wrap:wrap; overflow:visible; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./hitori.html"><span class="mark">ひ</span><span><strong>ひとり歓迎マップ</strong><small>ひとりで入れるか、根拠つきで</small></span></a>
    <button class="hbtn" id="btn-saved" type="button" aria-label="保存した施設">♡ <span id="saved-count">0</span></button>

  <div id="map" role="region" aria-label="地図"></div>

    <div id="sheet-body"></div>
  </section>
  <button class="rebtn" id="btn-research" type="button">この範囲で再検索</button>
