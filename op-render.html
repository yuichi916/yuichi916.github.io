<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>OP render (dynamic v2 kinetic)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
#stage{position:relative;width:1280px;height:720px;background:#000;overflow:hidden}
.bg{position:absolute;inset:-10%;background-size:cover;background-position:center;opacity:0;will-change:transform,filter}
.dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,.22),rgba(0,0,0,.82) 100%);opacity:0}
.ch{position:absolute;bottom:-3%;height:94%;filter:drop-shadow(0 12px 44px rgba(0,0,0,.85));opacity:0;left:50%;transform:translateX(-50%);will-change:transform,opacity}
.tx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:92%;text-align:center;
  color:#eef1f8;font-size:30px;letter-spacing:.3em;line-height:2.3;text-shadow:0 2px 22px rgba(0,0,0,.95);opacity:0}
.tx.big{font-size:58px;letter-spacing:.4em;color:#fff}
.tx.gold{color:#ffd24a}
.tx.small{font-size:24px;letter-spacing:.5em}
.tx .l2{display:block;font-size:.6em;margin-top:12px;letter-spacing:.3em;opacity:.9}
.tx .l3{display:block;color:#ffd24a;margin-top:14px}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
/* スピードライン(集中線) */
#streak{position:absolute;inset:-20%;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 1.6deg,rgba(255,255,255,.5) 2deg,rgba(255,255,255,0) 2.4deg)}
/* 横ホイップの流し */
#whip{position:absolute;inset:0;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(90deg,transparent,rgba(220,235,255,.6),transparent)}
.pline{position:absolute;inset:0;opacity:0;background:
  linear-gradient(115deg,transparent 44%,rgba(255,210,74,.6) 49%,transparent 54%),
  linear-gradient(70deg,transparent 58%,rgba(255,210,74,.4) 63%,transparent 68%),
  linear-gradient(150deg,transparent 30%,rgba(120,190,255,.35) 34%,transparent 38%)}
#logo{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:94%;opacity:0}
#logo .eye{font-size:15px;letter-spacing:.62em;color:#9aa3b5;margin-bottom:20px}
#logo h1{font-size:92px;letter-spacing:.16em;font-weight:600;
  background:linear-gradient(180deg,#fff 18%,#ffd24a 72%,#ff9a4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 80px rgba(255,210,74,.25)}
#logo .sub{margin-top:22px;font-size:20px;letter-spacing:.24em;color:#c9cede;line-height:2.1}
#fadeout{position:absolute;inset:0;background:#000;opacity:0}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.55)}
</style></head>
<body>
<div id="stage">
  <div class="bg" id="bg2"></div><div class="bg" id="bg"></div><div class="dark" id="dark"></div>
  <img class="ch" id="chL"><img class="ch" id="chM"><img class="ch" id="chR"><img class="ch" id="chC">
  <div id="streak"></div>
  <div class="pline" id="pline"></div>
  <div class="tx" id="tx"></div>
  <div id="vig"></div>
  <div id="whip"></div>
  <div class="flash" id="flash"></div>
  <div id="logo"><div class="eye">SEIKAI SAGA &mdash; CASE 01</div><h1>正解の外側</h1>
    <div class="sub">すべての正解が視える俺が、<br>答えのない少女と世界を変えるまで</div></div>
  <div id="fadeout"></div>
</div>
<script>
"use strict";
const A='assets/seikai/';
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;        // easeInOut
const eOut=p=>1-Math.pow(1-p,3);                        // easeOutCubic
const eIn=p=>p*p*p;                                     // easeInCubic
function env(t,s,e,fin,fout){ if(t<s||t>e)return 0; let a=fin?clamp((t-s)/fin,0,1):1; let b=fout?clamp((e-t)/fout,0,1):1; return Math.min(a,b); }

/* motion: 進捗p(0-1)から bg transform を返す — 大きく動くカメラワーク */
function mo(kind,p){
  const e=eIO(p);
  switch(kind){
   case 'push':     return 'scale('+(1.05+0.13*e)+')';
   case 'pushfast': return 'scale('+(1.08+0.24*p)+')';
   case 'punch':    return 'scale('+(1.02+0.36*eOut(p))+')';                          // 一気に寄る
   case 'pull':     return 'scale('+(1.52-0.42*eOut(p))+')';                          // 引きで見せる
   case 'sweepL':   return 'scale(1.34) translateX('+(15-30*e)+'%)';                  // 左→右カメラパン
   case 'sweepR':   return 'scale(1.34) translateX('+(-15+30*e)+'%)';                 // 右→左
   case 'sweepLf':  return 'scale(1.30) translateX('+(13-26*eOut(p))+'%)';            // 速い流しパン
   case 'sweepRf':  return 'scale(1.30) translateX('+(-13+26*eOut(p))+'%)';
   case 'tiltup':   return 'scale(1.36) translateY('+(14-26*e)+'%)';                  // 地→空へティルト
   case 'tiltdn':   return 'scale(1.30) translateY('+(-11+22*e)+'%)';
   case 'roll':     return 'scale(1.18) rotate('+(-2.4+4.8*p).toFixed(2)+'deg) translateX('+(2.5-5*p)+'%)';
   case 'diagL':    return 'scale(1.30) translate('+(11-22*e)+'%,'+(7-14*e)+'%)';     // 斜め移動
   case 'diagR':    return 'scale(1.30) translate('+(-11+22*e)+'%,'+(-7+14*e)+'%)';
   case 'drift':    return 'scale('+(1.14-0.05*p)+') translateX('+(1.6-3.2*p)+'%)';
   case 'slow':     return 'scale('+(1.02+0.05*e)+')';                                // 3Dクリップ用の控えめな追い足し
   case 'slowdn':   return 'scale('+(1.04+0.05*e)+') translateY('+(-2+4*e)+'%)';
   default:         return 'scale(1.07)';
  }
}
/* ===== Blender 3D カメラ移動クリップ(連番JPG) ===== */
/* frames は seikai_op3d.py の CLIPS(duration×FPS24)と一致させる */
const CLIP={
  // 地下=FS2密集ストリートキャニオン(EEVEE 30fps)
  canyon:    {dir:'op3d/canyon/',     n:126},  // 街路ドリー前進(両列スライド視差)
  canyonlow: {dir:'op3d/canyonlow/',  n:102},  // 低アングルで小物の脇を抜ける
  neonpan:   {dir:'op3d/neonpan/',    n:90},   // ネオン壁を舐めるパン
  craneup:   {dir:'op3d/craneup/',    n:114},  // 谷間を上昇し出口の暖光へ
  alleytrack:{dir:'op3d/alleytrack/', n:102},  // 街路を横切る横トラック
  overhead:  {dir:'op3d/overhead/',   n:96},   // 俯瞰ドリフト(密集屋根)
  // 地上・自然(DKF+Valhalla実木)
  emerge:    {dir:'op3d/emerge/',     n:195},  // ★坑口→天井が開けて空/森/朝日の町(6.5s)
  journey:   {dir:'op3d/journey/',    n:135},  // 草原を町へ旅(二人が歩ける目線)
  cityfly:   {dir:'op3d/cityfly/',    n:120},  // 高所横ドリフト(城郭スカイライン)
  townorbit: {dir:'op3d/townorbit/',  n:108},  // 鳥瞰オービット(街全体)
};
function clipFrame(name,p){ const c=CLIP[name]; const i=Math.max(0,Math.min(c.n-1,Math.round(p*(c.n-1)))); return A+c.dir+'f'+String(i).padStart(4,'0')+'.jpg'; }
/* カットの背景URL(クリップは cs/ce で区間指定可・静止画はそのまま) */
function bgUrl(cut,p){ if(cut.clip){ const f=(cut.cs!=null)?(cut.cs+((cut.ce!=null?cut.ce:1)-cut.cs)*p):p; return clipFrame(cut.clip,clamp(f,0,1)); } return A+cut.bg; }
/* 直前の「絵を持つ」カット(フラッシュ越しにも遡る) */
function prevVisual(idx){ for(let k=idx-1;k>=0;k--){ const c=C[k]; if(c.bg||c.clip) return c; if(c.logo) return null; } return null; }
/* character slot classes -> element */
const SLOT={l:'chL',m:'chM',r:'chR',c:'chC',ml:'chL',mr:'chR'};
function chPos(cls){ return cls==='l'?'22%':cls==='r'?'78%':(cls==='ml'?'38%':cls==='mr'?'62%':'50%'); }
function chH(cls){ return (cls==='l'||cls==='r'||cls==='ml'||cls==='mr')?'70%':(cls==='m'?'76%':'94%'); }

/* ===== カット定義 (t基準/秒) — 多背景・キネティック ===== */
/* mo: カメラワーク / shake: 衝撃px / streak: 集中線 / whip: 横流し導入 / par: bg方向にキャラ逆パララックス */
/* ===== 歌詞タイムスタンプ完全同期(whisper解析):
   15.1-21.3 番号で呼ばれた光のない朝 / 21.7-27.5 君はなんとなくで笑ってた
   28.6-35.8 正しい道ばかり見えすぎて怖いんだ / 35.9-42.0 間違える自由さえ持てない僕に
   43.0-50.1 それでも指がなぞる壁に刻んだ / 50.1-55.9 見たこともないあの青の名前
   ★58.18 おはよう / 60.5-65.6 また今日が始まる / 66.1-73.4 忘れてしまってもきっと見つけるよ
   73.4-78.5 正解の外側で / 78.5-85.2 手を伸ばす答えのない空へ / 85.6-87.7 二人で ===== */
const C=[
 // ===== INTRO 穴倉の廃棄層 (0-15) =====
 {s:0.0, e:4.6,  clip:'canyon',     cs:0.00, ce:0.35, dark:1, tx:'地下世界、アビス。'},
 {s:4.6, e:9.0,  clip:'overhead',   cs:0.00, ce:0.55, dark:1, tx:'その底に——終わりの場所が、ある。'},
 {s:9.0, e:12.8, clip:'alleytrack', cs:0.00, ce:0.50, dark:1, tx:'——百二十六人の、行き止まり。'},
 {s:12.8,e:15.0, clip:'neonpan',    cs:0.25, ce:0.60, dark:1, whip:1},
 // ===== VERSE1「番号で呼ばれた光のない朝」(15.0-21.5) =====
 {s:15.0,e:19.5, clip:'canyonlow',  cs:0.00, ce:0.50, dark:1, ch:[{i:'cg-kai.png',c:'c',from:'l'}], tx:'名前ではなく、番号で呼ばれて。'},
 {s:19.5,e:22.3, clip:'alleytrack', cs:0.55, ce:0.85, dark:1, ch:[{i:'cg-rin.png',c:'c',from:'r'}], tx:'なにひとつ、覚えていない少女。'},
 // 「君はなんとなくで笑ってた」(21.7-27.5)
 {s:22.3,e:25.6, clip:'canyon',     cs:0.60, ce:0.85, dark:1, ch:[{i:'cg-kai-soft.png',c:'ml'},{i:'cg-rin-smile.png',c:'mr'}], tx:'「なんとなく」', cls:'gold big'},
 {s:25.6,e:28.6, clip:'canyonlow',  cs:0.50, ce:0.85, dark:1, ch:[{i:'cg-kai-soft.png',c:'l',walk:'r'},{i:'cg-rin-smile.png',c:'r',walk:'r'}]},  // 二人が歩く
 // 「正しい道ばかり見えすぎて怖いんだ」(28.6-35.8)
 {s:28.6,e:32.6, clip:'neonpan',    cs:0.60, ce:1.00, dark:1, ch:[{i:'cg-kai.png',c:'c'}], tx:'すべての正解が、視える少年。'},
 {s:32.6,e:35.9, clip:'canyon',     cs:0.35, ce:0.60, dark:1, ch:[{i:'cg-kai-surprised.png',c:'c'}], pline:1, streak:.5},
 // 「間違える自由さえ持てない僕に」(35.9-42.0)
 {s:35.9,e:39.2, clip:'craneup',    cs:0.00, ce:0.40, dark:1, tx:'——ここから、始まった。'},
 {s:39.2,e:42.0, clip:'overhead',   cs:0.55, ce:0.80, dark:1, ch:[{i:'cg-jin.png',c:'l'},{i:'cg-garudo.png',c:'m'},{i:'cg-potz.png',c:'r'}], tx:'地の底にも、人がいた。'},
 // 「それでも指がなぞる壁に刻んだ」(43.0-50.1) 計画→決行
 {s:42.0,e:44.4, clip:'alleytrack', cs:0.30, ce:0.55, dark:1, ch:[{i:'cg-della.png',c:'c'}], tx:'決行は——三十八日目の夜。', cls:'gold'},
 {s:44.4,e:46.8, clip:'neonpan',    cs:0.00, ce:0.25, dark:1, ch:[{i:'cg-garudo.png',c:'c'}], whip:1},
 {s:46.8,e:49.2, clip:'canyonlow',  cs:0.85, ce:1.00, dark:1, ch:[{i:'cg-jin.png',c:'c'}], whip:1},
 // 「見たこともないあの青の名前」(50.1-55.9) 逃走→出口の光へ
 {s:49.2,e:51.2, clip:'overhead',   cs:0.80, ce:1.00, dark:1, shake:4, ch:[{i:'cg-kai-pained.png',c:'c'}], whip:1},
 {s:51.2,e:53.2, clip:'alleytrack', cs:0.85, ce:1.00, dark:1, shake:4, ch:[{i:'cg-rin-sharp.png',c:'c'}], whip:1},
 {s:53.2,e:55.9, clip:'craneup',    cs:0.40, ce:0.82, dark:1, shake:6, streak:.8, whip:1},   // 「あの青の名前」=出口の暖光へ駆け上がる
 // ===== 間奏(55.9-58.18): 坑口の中・暗・空の裂け目を見上げる =====
 {s:55.9,e:58.18, clip:'emerge',    cs:0.00, ce:0.30, dark:1},
 // ===== ★「おはよう」(58.18)=天井が開く: 一気に上昇し空/森/朝日の町がダイナミックに開ける =====
 {s:58.18,e:63.6, clip:'emerge',    cs:0.30, ce:1.00, tx:'おはよう。', cls:'gold big'},
 // 「また今日が始まる」(60.5-65.6): 草原を二人が歩く
 {s:63.6,e:66.1, clip:'journey',    cs:0.00, ce:0.30, ch:[{i:'cg-kai.png',c:'ml',walk:'r'},{i:'cg-rin-smile.png',c:'mr',walk:'r'}], tx:'空が、あった。広かった。'},
 // 「忘れてしまってもきっと見つけるよ」(66.1-73.4): リーンの記憶
 {s:66.1,e:69.3, bg:'bg-aicore.jpg', dark:1, mo:'push', ch:[{i:'cg-rin-tears.png',c:'c'}], tx:'あたしって、——なに？', cls:'gold'},
 {s:69.3,e:71.6, clip:'journey',    cs:0.30, ce:0.55, ch:[{i:'cg-kai.png',c:'ml',walk:'r'},{i:'cg-rin-smile.png',c:'mr',walk:'r'}]},  // それでも並んで歩く
 // 「正解の外側で」(73.4-78.5): 町
 {s:71.6,e:74.4, clip:'cityfly',    cs:0.00, ce:0.60, tx:'誰も泣かない街。'},
 {s:74.4,e:77.2, clip:'townorbit',  cs:0.00, ce:0.60, tx:'——誰も、泣かない。'},
 {s:77.2,e:78.6, bg:'op-bg-town.jpg', dark:1, mo:'punch', ch:[{i:'cg-yuugo.png',c:'c'}], whip:1},
 // 「手を伸ばす答えのない空へ」(78.5-85.2): 二人の朝→空
 {s:78.6,e:83.2, clip:'journey',    cs:0.60, ce:1.00, ch:[{i:'cg-kai-smile.png',c:'ml'},{i:'cg-rin-smile.png',c:'mr'}], tx:'——ずっと、隣で。', cls:'gold big'},
 {s:83.2,e:85.6, clip:'emerge',     cs:0.72, ce:1.00, tx:'答えのない、空へ。', cls:'big'},
 {s:85.6,e:86.3, flash:1},
 // ===== TITLE (「二人で」85.6-87.7に重ねて) =====
 {s:86.3,e:92.0, logo:1},
];

function setTime(t){
  const bg=el('bg'),bg2=el('bg2'),dark=el('dark'),tx=el('tx'),flash=el('flash'),logo=el('logo'),fo=el('fadeout'),pl=el('pline'),stk=el('streak'),wp=el('whip');
  ['chL','chM','chR','chC'].forEach(id=>{ el(id).style.opacity=0; });
  bg.style.opacity=0; bg.style.filter='none'; bg2.style.opacity=0; bg2.style.filter='none'; dark.style.opacity=0; tx.style.opacity=0; flash.style.opacity=0; logo.style.opacity=0; pl.style.opacity=0; stk.style.opacity=0; wp.style.opacity=0;
  let cur=null, idx=-1; for(let k=0;k<C.length;k++){ const c=C[k]; if(t>=c.s && t<c.e){ cur=c; idx=k; break; } }
  if(!cur){ fo.style.opacity = t>=92?1:0; return; }
  const p=(t-cur.s)/(cur.e-cur.s);
  if(cur.flash){
    // フラッシュ中も直前の絵を保持(黒を経由しない)
    const pv=prevVisual(idx);
    if(pv){ bg.style.backgroundImage='url('+bgUrl(pv,1)+')'; bg.style.opacity=1; bg.style.transform=mo(pv.mo||'still',1); if(pv.dark) dark.style.opacity=0.88; }
    flash.style.opacity=Math.sin(clamp(p,0,1)*Math.PI); return;
  }
  if(cur.logo){
    logo.style.opacity=env(t,cur.s,cur.e,1.4,0);
    logo.style.transform='translate(-50%,-50%) scale('+(0.97+0.03*clamp(p*3,0,1))+')';
    fo.style.opacity=clamp((t-90.4)/1.6,0,1);
    return;
  }
  const dur=cur.e-cur.s;
  const fin = dur<1.6 ? 0.22 : (dur<2.6?0.34:0.7);
  const fout= dur<1.6 ? 0.18 : (dur<2.6?0.28:0.55);
  // shake(衝撃): 減衰する高周波ジッタ(tベースで決定的)
  let jit='';
  if(cur.shake){ const amp=cur.shake*(1-eOut(clamp(p*1.4,0,1))); jit=' translate('+(Math.sin(t*94)*amp).toFixed(1)+'px,'+(Math.cos(t*81)*amp).toFixed(1)+'px)'; }
  if(cur.bg||cur.clip){
    // ===== 2層クロスフェード: 黒を経由せず前カットから溶ける =====
    const pv=prevVisual(idx);
    const TW=Math.min(dur*0.5, cur.whip?0.12:0.45);
    const inRamp = pv ? clamp((t-cur.s)/TW,0,1) : env(t,cur.s,cur.e,fin,0);  // 先頭カットのみ黒からF.I.
    bg.style.backgroundImage='url('+bgUrl(cur,clamp(p,0,1))+')';
    bg.style.opacity=inRamp;
    bg.style.transform=mo(cur.mo||'still', clamp(p,0,1))+jit;
    if(pv && inRamp<1){
      bg2.style.backgroundImage='url('+bgUrl(pv,1)+')';
      bg2.style.opacity=1;
      bg2.style.transform=mo(pv.mo||'still',1);
    }
    // whip導入: 立ち上がりに横ブラー+わずかな流れ
    if(cur.whip && p<0.22){ const w=1-p/0.22; bg.style.filter='blur('+(7*w).toFixed(1)+'px)'; wp.style.opacity=w*0.5; wp.style.transform='translateX('+(-30+140*(p/0.22))+'%)'; }
    if(cur.dark) dark.style.opacity=0.88;
  }
  if(cur.streak){ stk.style.opacity=Math.sin(clamp(p,0,1)*Math.PI)*cur.streak; stk.style.transform='scale('+(1.0+0.12*p)+') rotate('+(p*6).toFixed(1)+'deg)'; }
  if(cur.pline){ pl.style.opacity=Math.sin(clamp(p,0,1)*Math.PI)*0.95; pl.style.transform='translateX('+(-3+6*p)+'%)'; }
  if(cur.ch){
    // bgパン方向へキャラ逆移動(パララックス)
    const moK=cur.mo||'';
    let px=0;
    if(cur.par){ if(moK.indexOf('sweepL')===0)px=6-12*eIO(p); else if(moK.indexOf('sweepR')===0)px=-6+12*eIO(p); }
    cur.ch.forEach((c,i)=>{
      const im=el(SLOT[c.c]); im.src=A+c.i;
      im.style.left=chPos(c.c); im.style.height=chH(c.c);
      const d=i*0.12;
      const o=env(t,cur.s+d,cur.e,fin+0.25,fout);
      im.style.opacity=o;
      // スライドイン方向(from) + 立ち上がり
      const rise=clamp((t-cur.s-d)/0.55,0,1);
      let sx=0; if(c.from==='l')sx=(1-eOut(rise))*-90; else if(c.from==='r')sx=(1-eOut(rise))*90;
      let yoff=(1-rise)*20;
      // 歩行(walk): 横移動+上下の弾み(景色が動く中をキャラが歩く3D演出)
      let wx=0;
      if(c.walk){ const dir=c.walk==='l'?-1:1; wx=dir*(-150+300*p); yoff+= -Math.abs(Math.sin(p*Math.PI*7))*5; }
      const pop = (moK==='punch')?(1.04-0.06*eOut(p)) : (moK==='pushfast')?(1+0.10*p):(moK.indexOf('push')===0)?(1+0.05*p):1;
      im.style.transform='translateX(-50%) translate('+(sx+px+wx).toFixed(1)+'px,'+yoff.toFixed(1)+'px) scale('+pop.toFixed(3)+')';
    });
  }
  if(cur.tx){
    tx.className='tx'+(cur.cls?(' '+cur.cls):'');
    tx.innerHTML=cur.tx;
    const big=(cur.cls||'').indexOf('big')>=0;
    tx.style.opacity=env(t,cur.s+0.2,cur.e,big?0.8:fin+0.3,fout);
    const base= big?0.4:((cur.cls||'').indexOf('small')>=0?0.5:0.3);
    tx.style.letterSpacing=(base+0.14*(1-clamp((t-cur.s-0.2)/0.9,0,1)))+'em';
    tx.style.transform='translate(-50%,-50%) translateY('+(6*(1-clamp((t-cur.s-0.2)/0.7,0,1))).toFixed(1)+'px)';
  }
}
window.__setTime=setTime;

/* ===== 全背景(3Dクリップ連番/静止/立ち絵)をプリロード ===== */
/* キャプチャは setTime 直後にスクショするため、未デコードのクリップフレームだと黒落ちする。 */
window.__ready=false;
(function preload(){
  const urls=new Set();
  for(const k in CLIP){ const c=CLIP[k]; for(let i=0;i<c.n;i++) urls.add(A+c.dir+'f'+String(i).padStart(4,'0')+'.jpg'); }
  for(const c of C){ if(c.bg) urls.add(A+c.bg); if(c.ch) c.ch.forEach(x=>urls.add(A+x.i)); }
  const list=[...urls]; let left=list.length;
  if(!left){ window.__ready=true; return; }
  const done=()=>{ if(--left<=0) window.__ready=true; };
  list.forEach(u=>{ const im=new Image(); im.onload=done; im.onerror=done; im.src=u; });
})();

setTime(0);
</script>
