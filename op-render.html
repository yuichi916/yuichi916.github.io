<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>OP render (dynamic)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
#stage{position:relative;width:1280px;height:720px;background:#000;overflow:hidden}
.bg{position:absolute;inset:-8%;background-size:cover;background-position:center;opacity:0}
.dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,.25),rgba(0,0,0,.82) 100%);opacity:0}
.ch{position:absolute;bottom:-3%;height:94%;filter:drop-shadow(0 12px 44px rgba(0,0,0,.85));opacity:0;left:50%;transform:translateX(-50%)}
.tx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:92%;text-align:center;
  color:#eef1f8;font-size:30px;letter-spacing:.3em;line-height:2.3;text-shadow:0 2px 22px rgba(0,0,0,.95);opacity:0}
.tx.big{font-size:58px;letter-spacing:.4em;color:#fff}
.tx.gold{color:#ffd24a}
.tx.small{font-size:24px;letter-spacing:.5em}
.tx .l2{display:block;font-size:.6em;margin-top:12px;letter-spacing:.3em;opacity:.9}
.tx .l3{display:block;color:#ffd24a;margin-top:14px}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.pline{position:absolute;inset:0;opacity:0;background:
  linear-gradient(115deg,transparent 46%,rgba(255,210,74,.5) 49%,transparent 52%),
  linear-gradient(70deg,transparent 60%,rgba(255,210,74,.35) 63%,transparent 66%)}
#logo{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:94%;opacity:0}
#logo .eye{font-size:15px;letter-spacing:.62em;color:#9aa3b5;margin-bottom:20px}
#logo h1{font-size:92px;letter-spacing:.16em;font-weight:600;
  background:linear-gradient(180deg,#fff 18%,#ffd24a 72%,#ff9a4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 80px rgba(255,210,74,.25)}
#logo .sub{margin-top:22px;font-size:20px;letter-spacing:.24em;color:#c9cede;line-height:2.1}
#fadeout{position:absolute;inset:0;background:#000;opacity:0}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.55)}
</style></head>
<body>
<div id="stage">
  <div class="bg" id="bg"></div><div class="dark" id="dark"></div>
  <img class="ch" id="chL"><img class="ch" id="chM"><img class="ch" id="chR"><img class="ch" id="chC">
  <div class="pline" id="pline"></div>
  <div class="tx" id="tx"></div>
  <div id="vig"></div>
  <div class="flash" id="flash"></div>
  <div id="logo"><div class="eye">SEIKAI SAGA &mdash; CASE 01</div><h1>正解の外側</h1>
    <div class="sub">すべての正解が視える俺が、<br>答えのない少女と世界を変えるまで</div></div>
  <div id="fadeout"></div>
</div>
<script>
"use strict";
const A='assets/seikai/';
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function env(t,s,e,fin,fout){ if(t<s||t>e)return 0; let a=fin?clamp((t-s)/fin,0,1):1; let b=fout?clamp((e-t)/fout,0,1):1; return Math.min(a,b); }

/* motion: 進捗p(0-1)から bg transform を返す */
function mo(kind,p){
  switch(kind){
   case 'push':     return 'scale('+(1.03+0.10*p)+') translateX(0%)';
   case 'pushfast': return 'scale('+(1.06+0.20*p)+') translateX(0%)';
   case 'panL':     return 'scale(1.12) translateX('+(4-8*p)+'%)';
   case 'panR':     return 'scale(1.12) translateX('+(-4+8*p)+'%)';
   case 'drift':    return 'scale('+(1.10-0.04*p)+') translateX('+(1.5-3*p)+'%)';
   default:         return 'scale(1.05)';
  }
}
/* character slot classes -> element */
const SLOT={l:'chL',m:'chM',r:'chR',c:'chC'};
function chPos(cls){ return cls==='l'?'22%':cls==='r'?'78%':'50%'; }
function chH(cls){ return (cls==='l'||cls==='r')?'70%':(cls==='m'?'76%':'94%'); }

/* ===== カット定義 (t基準/秒) — 動的・多カット ===== */
const C=[
 // --- INTRO (静, 0-16) ---
 {s:0.0, e:4.5,  tx:'地下世界、アビス。'},
 {s:4.5, e:9.0,  tx:'その底に——終わりの場所が、ある。'},
 {s:9.0, e:16.0, bg:'bg-waste.jpg', dark:1, mo:'push', tx:'名前ではなく、番号で呼ばれる——百二十六人。'},
 // --- VERSE (キャラ紹介, 16-40) ---
 {s:16.0,e:21.0, bg:'bg-hideout.jpg', dark:1, mo:'push', ch:[{i:'cg-kai.png',c:'c'}], tx:'すべての正解が、視える少年。'},
 {s:21.0,e:24.0, bg:'bg-hideout.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-kai-surprised.png',c:'c'}], pline:1},
 {s:24.0,e:29.0, bg:'bg-hideout.jpg', dark:1, mo:'push', ch:[{i:'cg-rin.png',c:'c'}], tx:'なにひとつ、覚えていない少女。'},
 {s:29.0,e:32.2, mo:'pushfast', tx:'「なんとなく」', cls:'gold big'},
 {s:32.2,e:36.0, bg:'bg-hideout.jpg', dark:1, mo:'panR', ch:[{i:'cg-kai-soft.png',c:'l'},{i:'cg-rin-smile.png',c:'r'}]},
 {s:36.0,e:40.0, bg:'bg-waste.jpg', dark:1, mo:'panL', tx:'——ここから、始まった。'},
 // --- BUILD (加速, 40-54) ---
 {s:40.0,e:43.2, bg:'bg-duct.jpg', dark:1, mo:'push', ch:[{i:'cg-jin.png',c:'l'},{i:'cg-garudo.png',c:'m'},{i:'cg-potz.png',c:'r'}], tx:'地の底にも、人がいた。'},
 {s:43.2,e:46.0, bg:'bg-ration.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-jin.png',c:'c'}]},
 {s:46.0,e:49.2, bg:'bg-hall.jpg', dark:1, mo:'push', ch:[{i:'cg-della.png',c:'c'}], tx:'決行は——三十八日目の夜。', cls:'gold'},
 {s:49.2,e:51.4, bg:'bg-duct.jpg', dark:1, mo:'pushfast'},
 {s:51.4,e:52.5, bg:'bg-hideout.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-kai-pained.png',c:'c'}]},
 {s:52.5,e:53.6, bg:'bg-duct.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-rin-sharp.png',c:'c'}]},
 {s:53.6,e:54.6, flash:1},
 // --- CHORUS payoff (空) 54.6-61 ---
 {s:54.6,e:61.0, bg:'op-bg-surface.jpg', mo:'push', tx:'空が、あった。', cls:'big'},
 // --- CHORUS montage (高速, 61-84) ---
 {s:61.0,e:63.5, bg:'op-bg-town.jpg', dark:1, mo:'drift', tx:'誰も泣かない街。'},
 {s:63.5,e:65.0, bg:'op-bg-town.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-yuugo.png',c:'c'}]},
 {s:65.0,e:66.5, bg:'op-bg-town.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-miira.png',c:'c'}]},
 {s:66.5,e:68.0, bg:'op-bg-town.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-nogu.png',c:'c'}]},
 {s:68.0,e:70.5, bg:'op-bg-town.jpg', dark:1, mo:'drift', tx:'——誰も、泣かない。'},
 {s:70.5,e:72.5, bg:'bg-lab.jpg', dark:1, mo:'push', ch:[{i:'cg-rin-unease.png',c:'c'}]},
 {s:72.5,e:76.0, bg:'bg-lab.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-rin-tears.png',c:'c'}], tx:'あたしって、——なに？', cls:'gold'},
 // rapid 0.9s flashes
 {s:76.0,e:77.0, bg:'op-bg-surface.jpg', mo:'pushfast', ch:[{i:'cg-kai-tears.png',c:'c'}]},
 {s:77.0,e:78.0, bg:'op-bg-surface.jpg', mo:'pushfast', ch:[{i:'cg-rin-tears.png',c:'c'}]},
 {s:78.0,e:79.0, bg:'bg-hideout.jpg', dark:1, mo:'pushfast', ch:[{i:'cg-kai.png',c:'c'}]},
 {s:79.0,e:80.0, bg:'bg-surface.jpg', mo:'pushfast', ch:[{i:'cg-rin-smile.png',c:'c'}]},
 {s:80.0,e:82.5, bg:'op-bg-surface.jpg', mo:'push', ch:[{i:'cg-kai-smile.png',c:'l'},{i:'cg-rin-smile.png',c:'r'}], tx:'おはよう。', cls:'gold big'},
 {s:82.5,e:83.6, flash:1},
 // --- TITLE 83.6-92 ---
 {s:83.6,e:92.0, logo:1},
];

function setTime(t){
  const bg=el('bg'),dark=el('dark'),tx=el('tx'),flash=el('flash'),logo=el('logo'),fo=el('fadeout'),pl=el('pline');
  ['chL','chM','chR','chC'].forEach(id=>{ el(id).style.opacity=0; });
  bg.style.opacity=0; dark.style.opacity=0; tx.style.opacity=0; flash.style.opacity=0; logo.style.opacity=0; pl.style.opacity=0;
  let cur=null; for(const c of C){ if(t>=c.s && t<c.e){ cur=c; break; } }
  if(!cur){ fo.style.opacity = t>=92?1:0; return; }
  const p=(t-cur.s)/(cur.e-cur.s);
  if(cur.flash){ flash.style.opacity=Math.sin(clamp(p,0,1)*Math.PI); return; }
  if(cur.logo){
    logo.style.opacity=env(t,cur.s,cur.e,1.4,0);
    logo.style.transform='translate(-50%,-50%) scale('+(0.97+0.03*clamp(p*3,0,1))+')';
    fo.style.opacity=clamp((t-90.4)/1.6,0,1);
    return;
  }
  const fin = (cur.e-cur.s)<2.0 ? 0.28 : 0.7;   // 短カットは速いフェード
  const fout = (cur.e-cur.s)<2.0 ? 0.22 : 0.55;
  if(cur.bg){
    bg.style.backgroundImage='url('+A+cur.bg+')';
    bg.style.opacity=env(t,cur.s,cur.e,fin,fout);
    bg.style.transform=mo(cur.mo||'still', clamp(p,0,1));
    if(cur.dark) dark.style.opacity=env(t,cur.s,cur.e,fin,fout)*0.92;
  }
  if(cur.pline){ pl.style.opacity=Math.sin(clamp(p,0,1)*Math.PI)*0.9; }
  if(cur.ch){
    cur.ch.forEach((c,i)=>{
      const im=el(SLOT[c.c]); im.src=A+c.i;
      im.style.left=chPos(c.c); im.style.height=chH(c.c);
      const d=i*0.12;
      const o=env(t,cur.s+d,cur.e,fin+0.2,fout);
      im.style.opacity=o;
      const rise=clamp((t-cur.s-d)/0.6,0,1);
      const zoom = (cur.mo==='pushfast')?(1+0.10*p):(cur.mo==='push')?(1+0.05*p):1;
      im.style.transform='translateX(-50%) translateY('+((1-rise)*22)+'px) scale('+zoom+')';
    });
  }
  if(cur.tx){
    tx.className='tx'+(cur.cls?(' '+cur.cls):'');
    tx.innerHTML=cur.tx;
    const big=(cur.cls||'').indexOf('big')>=0;
    tx.style.opacity=env(t,cur.s+0.2,cur.e,big?0.8:fin+0.3,fout);
    const base= big?0.4:((cur.cls||'').indexOf('small')>=0?0.5:0.3);
    tx.style.letterSpacing=(base+0.14*(1-clamp((t-cur.s-0.2)/0.9,0,1)))+'em';
  }
}
window.__setTime=setTime;
setTime(0);
</script>
</body></html>
