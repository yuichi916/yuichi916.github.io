<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>OP render (dynamic v2 kinetic)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
#stage{position:relative;width:1280px;height:720px;background:#000;overflow:hidden}
.bg{position:absolute;inset:-10%;background-size:cover;background-position:center;opacity:0;will-change:transform,filter}
.dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,.22),rgba(0,0,0,.82) 100%);opacity:0}
.ch{position:absolute;bottom:-3%;height:94%;filter:drop-shadow(0 12px 44px rgba(0,0,0,.85));opacity:0;left:50%;transform:translateX(-50%);will-change:transform,opacity}
.tx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:92%;text-align:center;
  color:#eef1f8;font-size:30px;letter-spacing:.3em;line-height:2.3;text-shadow:0 2px 22px rgba(0,0,0,.95);opacity:0}
.tx.big{font-size:58px;letter-spacing:.4em;color:#fff}
.tx.gold{color:#ffd24a}
.tx.small{font-size:24px;letter-spacing:.5em}
.tx.quote{font-size:38px;letter-spacing:.4em;color:#f2f4f8;font-weight:400;text-shadow:0 2px 30px rgba(0,0,0,.95)}
.tx .l2{display:block;font-size:.6em;margin-top:12px;letter-spacing:.3em;opacity:.9}
.tx .l3{display:block;color:#ffd24a;margin-top:14px}
/* ===== 商用OP風キャプション(隅アンカー英日ロックアップ) ===== */
.cap{position:absolute;opacity:0;z-index:12;pointer-events:none}
.cap .en{font-family:Georgia,'Times New Roman',serif;font-size:12px;letter-spacing:.52em;color:#c9a24a;text-transform:uppercase;white-space:nowrap}
.cap .jp{font-size:20px;letter-spacing:.30em;margin-top:9px;color:#e9edf5;text-shadow:0 1px 16px rgba(0,0,0,.9);white-space:nowrap}
.cap .rule{width:52px;height:1px;background:linear-gradient(90deg,#c9a24a,transparent);margin-top:11px}
.cap.bl{left:6.5%;bottom:15%}
.cap.br{right:6.5%;bottom:15%;text-align:right}
.cap.br .rule{margin-left:auto;background:linear-gradient(270deg,#c9a24a,transparent)}
.cap.tr{right:6.5%;top:9%;text-align:right}
.cap.tr .rule{margin-left:auto;background:linear-gradient(270deg,#c9a24a,transparent)}
.cap.tl{left:6.5%;top:9%}
/* キャラ名カード */
.ncard{position:absolute;top:33%;opacity:0;z-index:12;pointer-events:none}
.ncard.right{right:7%;text-align:right}
.ncard.left{left:7%}
.ncard .njp{font-size:46px;letter-spacing:.2em;color:#f4f6fa;text-shadow:0 2px 26px rgba(0,0,0,.9)}
.ncard .nen{font-family:Georgia,serif;font-size:11px;letter-spacing:.3em;color:#c9a24a;margin-top:7px;text-transform:uppercase}
.ncard .nsub{font-size:14px;letter-spacing:.24em;color:#c3cbdc;margin-top:12px}
.ncard .nbar{position:absolute;top:-6px;bottom:-6px;width:1px;background:linear-gradient(180deg,transparent,#c9a24a,transparent)}
.ncard.right .nbar{right:-16px}
.ncard.left .nbar{left:-16px}
/* 道筋オーバーレイ(ミニゲームモチーフ: 番号ノード+金の線が描き上がる) */
#mgfx{position:absolute;inset:0;opacity:0;z-index:11;pointer-events:none}
/* ミニマップオーバーレイ(本編UIモチーフ: 経路が灯る) */
#mapfx{position:absolute;right:5%;top:9%;width:236px;opacity:0;z-index:11;pointer-events:none;
  background:rgba(4,8,14,.72);border:1px solid rgba(201,162,74,.5);border-radius:4px;padding:10px 12px 8px;
  backdrop-filter:blur(2px)}
#mapfx .mlab{font-family:Georgia,serif;font-size:9px;letter-spacing:.4em;color:#c9a24a;margin-top:6px;text-transform:uppercase;text-align:right}
/* ===== シネマティック層 ===== */
.cbar{position:absolute;left:0;right:0;height:9.5%;background:#000;z-index:13;pointer-events:none}
#cbarT{top:0}#cbarB{bottom:0}
#grain{display:none}  /* 動くノイズが暗部で黒ちらつきに見えるため撤去 */
#gradeU{position:absolute;inset:0;z-index:9;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(180deg,rgba(24,64,92,.85),rgba(10,30,52,.7));opacity:0}
#gradeS{position:absolute;inset:0;z-index:9;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(180deg,rgba(255,196,120,.55),rgba(255,150,80,.25));opacity:0}
/* 空を青く: 上部に深い空色(surface/town cutで有効) */
#skyblue{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;mix-blend-mode:multiply;
  background:linear-gradient(180deg,#5b9fe0 0%,#8cc0ec 26%,rgba(200,224,244,.4) 46%,transparent 60%)}
#skyblue2{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 72% 16%,rgba(255,240,200,.5),transparent 46%)}
/* 管理者の球体(光りながら漂う=世界を統べる目) */
#orb{position:absolute;z-index:11;pointer-events:none;opacity:0;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 42% 38%,#ffffff 0%,#eaf4ff 34%,#bcd8f4 62%,rgba(140,190,240,.2) 100%);
  box-shadow:0 0 60px 18px rgba(200,230,255,.7),0 0 130px 44px rgba(150,200,255,.35)}
#orb .ring{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(200,230,255,.5)}
#orb .ring2{position:absolute;inset:-30px;border-radius:50%;border:1px solid rgba(200,230,255,.22)}
/* サビの光芒(神々しい放射) */
#godray{position:absolute;inset:-20%;z-index:10;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:repeating-conic-gradient(from 0deg at 72% 20%,rgba(255,246,214,0) 0deg,rgba(255,246,214,0) 4deg,rgba(255,246,214,.5) 5.5deg,rgba(255,246,214,0) 7deg)}
/* 末尾サムネ挿入 */
/* 末尾サムネ: 16:9→レターボックス内(1280x583)に全体が収まるようcontainで表示(切れない) */
#thumb{position:absolute;inset:9.5% 0;z-index:13;pointer-events:none;opacity:0;
  background:url('assets/seikai/keyvisual.jpg') center center/contain no-repeat}
/* 5層ストラータHUD(世界の全体感) */
#strata{position:absolute;left:5%;top:50%;transform:translateY(-50%);z-index:12;opacity:0;pointer-events:none}
#strata .slab{width:34px;height:22px;margin:5px 0;border:1px solid rgba(150,165,190,.5);color:#8fa0b8;
  font-family:Georgia,serif;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:.1em;
  background:rgba(6,10,18,.5);transition:none}
#strata .slab.on{border-color:#ffd24a;color:#ffd24a;background:rgba(201,162,74,.18);box-shadow:0 0 12px rgba(255,210,74,.35)}
#strata .slb{font-family:Georgia,serif;font-size:9px;letter-spacing:.4em;color:#c9a24a;margin-top:8px;text-transform:uppercase;writing-mode:vertical-rl}
/* 観測ブラケット(saga: 見られている) */
#obsv{position:absolute;inset:5.5% 4.5% 12% 4.5%;z-index:12;opacity:0;pointer-events:none}
#obsv .bk{position:absolute;width:26px;height:26px;border:1px solid rgba(127,215,255,.6)}
#obsv .tl{left:0;top:0;border-right:none;border-bottom:none}
#obsv .tr{right:0;top:0;border-left:none;border-bottom:none}
#obsv .blb{left:0;bottom:0;border-right:none;border-top:none}
#obsv .brb{right:0;bottom:0;border-left:none;border-top:none}
#obsv .olab{position:absolute;left:34px;top:2px;font-family:Consolas,monospace;font-size:11px;letter-spacing:.28em;color:rgba(127,215,255,.75)}
#obsv .odot{position:absolute;left:16px;top:6px;width:7px;height:7px;border-radius:50%;background:#7fd7ff}
#logo .saga{margin-top:26px;font-size:13px;letter-spacing:.42em;color:#7d8698;opacity:0}
/* 断章カード(探索で見つかるロアの気配) */
#frag{position:absolute;right:9%;top:26%;width:190px;opacity:0;z-index:12;pointer-events:none;
  background:linear-gradient(160deg,rgba(10,14,22,.92),rgba(18,24,36,.88));border:1px solid rgba(201,162,74,.65);
  border-radius:3px;padding:13px 15px;box-shadow:0 0 26px rgba(201,162,74,.22)}
#frag .fen{font-family:Georgia,serif;font-size:9px;letter-spacing:.5em;color:#c9a24a;text-transform:uppercase}
#frag .fjp{font-size:15px;letter-spacing:.2em;color:#e6ebf4;margin-top:8px}
#frag .fln{height:1px;background:linear-gradient(90deg,#c9a24a,transparent);margin-top:10px}
/* 時限の決断UI */
#choiceui{position:absolute;left:50%;top:56%;transform:translateX(-50%);opacity:0;z-index:12;pointer-events:none;text-align:center}
#choiceui .cbtn{display:inline-block;margin:0 10px;padding:9px 34px;border:1px solid rgba(233,237,245,.75);
  color:#e9edf5;font-size:17px;letter-spacing:.34em;background:rgba(8,12,20,.62)}
#choiceui .cbtn.sel{border-color:#ffd24a;color:#ffd24a;box-shadow:0 0 18px rgba(255,210,74,.35)}
#choiceui .tbar{height:2px;background:#ffd24a;margin:14px auto 0;box-shadow:0 0 8px rgba(255,210,74,.6)}
/* 電子錠ハッキングUI */
#hack{position:absolute;left:8%;top:30%;opacity:0;z-index:12;pointer-events:none;
  background:rgba(4,8,14,.78);border:1px solid rgba(127,215,255,.5);border-radius:3px;padding:11px 13px}
#hack .hlab{font-family:Consolas,monospace;font-size:9px;letter-spacing:.34em;color:#7fd7ff}
#hack .hgrid{display:grid;grid-template-columns:repeat(4,26px);gap:4px;margin-top:8px}
#hack .hc{height:22px;border:1px solid rgba(127,215,255,.35);color:#7fd7ff;font-family:Consolas,monospace;
  font-size:12px;display:flex;align-items:center;justify-content:center;background:rgba(10,20,32,.5)}
#hack .hc.on{background:rgba(127,215,255,.28);color:#eaf7ff}
#hack .hbar{height:2px;background:#7fd7ff;margin-top:8px;box-shadow:0 0 8px rgba(127,215,255,.7)}
/* 3本に分かれる道筋(3エンディングの気配) */
#routes3{position:absolute;inset:0;opacity:0;z-index:11;pointer-events:none}
/* 方位コンパス帯(360°見回しの気配) */
#compass{position:absolute;left:50%;top:11.5%;transform:translateX(-50%);width:340px;height:26px;opacity:0;z-index:12;
  pointer-events:none;overflow:hidden;border-bottom:1px solid rgba(201,162,74,.45)}
#compass .cstrip{position:absolute;top:2px;white-space:nowrap;font-family:Georgia,serif;font-size:11px;
  letter-spacing:.1em;color:#cfd6e2}
#compass .cstrip b{color:#ffd24a;font-weight:400;margin:0 26px}
#compass .cstrip s{text-decoration:none;color:#6d7890;margin:0 26px}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
/* スピードライン(集中線) */
#streak{position:absolute;inset:-20%;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 1.6deg,rgba(255,255,255,.5) 2deg,rgba(255,255,255,0) 2.4deg)}
/* 横ホイップの流し */
#whip{position:absolute;inset:0;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(90deg,transparent,rgba(220,235,255,.6),transparent)}
.pline{position:absolute;inset:0;opacity:0;background:
  linear-gradient(115deg,transparent 44%,rgba(255,210,74,.6) 49%,transparent 54%),
  linear-gradient(70deg,transparent 58%,rgba(255,210,74,.4) 63%,transparent 68%),
  linear-gradient(150deg,transparent 30%,rgba(120,190,255,.35) 34%,transparent 38%)}
#logo{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:94%;opacity:0}
#logo .eye{font-size:15px;letter-spacing:.62em;color:#9aa3b5;margin-bottom:20px}
#logo h1{font-size:92px;letter-spacing:.16em;font-weight:600;
  background:linear-gradient(180deg,#fff 18%,#ffd24a 72%,#ff9a4a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 80px rgba(255,210,74,.25)}
#logo .sub{margin-top:22px;font-size:20px;letter-spacing:.24em;color:#c9cede;line-height:2.1}
#fadeout{position:absolute;inset:0;background:#000;opacity:0}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.55)}
</style></head>

<script>
"use strict";
const A='assets/seikai/';
const el=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;        // easeInOut
const eOut=p=>1-Math.pow(1-p,3);                        // easeOutCubic
const eIn=p=>p*p*p;                                     // easeInCubic
function env(t,s,e,fin,fout){ if(t<s||t>e)return 0; let a=fin?clamp((t-s)/fin,0,1):1; let b=fout?clamp((e-t)/fout,0,1):1; return Math.min(a,b); }

/* motion: 進捗p(0-1)から bg transform を返す — 大きく動くカメラワーク */
function mo(kind,p){
  const e=eIO(p);
  switch(kind){
   case 'push':     return 'scale('+(1.05+0.13*e)+')';
   case 'pushfast': return 'scale('+(1.08+0.24*p)+')';
   case 'punch':    return 'scale('+(1.02+0.36*eOut(p))+')';                          // 一気に寄る
   case 'pull':     return 'scale('+(1.52-0.42*eOut(p))+')';                          // 引きで見せる
   case 'sweepL':   return 'scale(1.34) translateX('+(15-30*e)+'%)';                  // 左→右カメラパン
   case 'sweepR':   return 'scale(1.34) translateX('+(-15+30*e)+'%)';                 // 右→左
   case 'sweepLf':  return 'scale(1.30) translateX('+(13-26*eOut(p))+'%)';            // 速い流しパン
   case 'sweepRf':  return 'scale(1.30) translateX('+(-13+26*eOut(p))+'%)';
   case 'tiltup':   return 'scale(1.36) translateY('+(14-26*e)+'%)';                  // 地→空へティルト
   case 'tiltdn':   return 'scale(1.30) translateY('+(-11+22*e)+'%)';
   case 'roll':     return 'scale(1.18) rotate('+(-2.4+4.8*p).toFixed(2)+'deg) translateX('+(2.5-5*p)+'%)';
   case 'diagL':    return 'scale(1.30) translate('+(11-22*e)+'%,'+(7-14*e)+'%)';     // 斜め移動
   case 'diagR':    return 'scale(1.30) translate('+(-11+22*e)+'%,'+(-7+14*e)+'%)';
   case 'drift':    return 'scale('+(1.14-0.05*p)+') translateX('+(1.6-3.2*p)+'%)';
   case 'slow':     return 'scale('+(1.02+0.05*e)+')';                                // 3Dクリップ用の控えめな追い足し
   case 'slowdn':   return 'scale('+(1.04+0.05*e)+') translateY('+(-2+4*e)+'%)';
   default:         return 'scale(1.07)';
  }
}
/* ===== Blender 3D カメラ移動クリップ(連番JPG) ===== */
/* frames は seikai_op3d.py の CLIPS(duration×FPS24)と一致させる */
const CLIP={
  // 地下=FS2閉鎖穴倉(EEVEE 30fps)
  canyon:    {dir:'op3d/canyon/',     n:126},  // 街路ドリー前進(両列スライド視差)
  canyonlow: {dir:'op3d/canyonlow/',  n:102},  // 低アングルで小物の脇を抜ける
  neonpan:   {dir:'op3d/neonpan/',    n:90},   // ネオン壁を舐めるパン
  craneup:   {dir:'op3d/craneup/',    n:114},  // 谷間を上昇し出口の暖光へ
  alleytrack:{dir:'op3d/alleytrack/', n:102},  // 街路を横切る横トラック
  overhead:  {dir:'op3d/overhead/',   n:96},   // 俯瞰ドリフト(密集屋根)
  layers5:   {dir:'op3d/layers5/',    n:165},  // アビス5層断面の縦シャフト(下降=世界開示/上昇=脱出)
  // 地上=町の中と空(DKF)
  emerge2:   {dir:'op3d/emerge2/',    n:195},  // ★町の中のハッチ→尖塔の町並みが開ける(6.5s)
  townarc:   {dir:'op3d/townarc/',    n:108},  // 広場の噴水を回る低アーク(市場の中)
  skyup:     {dir:'op3d/skyup/',      n:105},  // 尖塔の縁と朝の空(空が主役)
  townrise2: {dir:'op3d/townrise2/',  n:120},  // 噴水→尖塔→空への大クレーン

function setTime(t){
  const bg=el('bg'),bg2=el('bg2'),dark=el('dark'),tx=el('tx'),flash=el('flash'),logo=el('logo'),fo=el('fadeout'),pl=el('pline'),stk=el('streak'),wp=el('whip');
  ['chL','chM','chR','chC','chL2','chM2','chR2','chC2'].forEach(id=>{ el(id).style.opacity=0; });
  bg.style.opacity=0; bg.style.filter='none'; bg2.style.opacity=0; bg2.style.filter='none'; dark.style.opacity=0; tx.style.opacity=0; flash.style.opacity=0; logo.style.opacity=0; pl.style.opacity=0; stk.style.opacity=0; wp.style.opacity=0;
  el('cap').style.opacity=0; el('ncard').style.opacity=0; el('mgfx').style.opacity=0; el('mapfx').style.opacity=0;
  el('strata').style.opacity=0; el('obsv').style.opacity=0;
  el('frag').style.opacity=0; el('choiceui').style.opacity=0; el('hack').style.opacity=0; el('routes3').style.opacity=0; el('compass').style.opacity=0;
  el('skyblue').style.opacity=0; el('skyblue2').style.opacity=0; el('godray').style.opacity=0; el('orb').style.opacity=0; el('thumb').style.opacity=0;
  // シネマ層(常時): セクション別グレード(地下=冷/地上=暖, おはよう周辺でクロス)
  const sMix=clamp((t-55.9)/2.6,0,1);
  el('gradeU').style.opacity=(0.55*(1-sMix)).toFixed(2);
  el('gradeS').style.opacity=(0.42*sMix).toFixed(2);
  let cur=null, idx=-1; for(let k=0;k<C.length;k++){ const c=C[k]; if(t>=c.s && t<c.e){ cur=c; idx=k; break; } }
  if(!cur){ fo.style.opacity = t>=92?1:0; return; }
  const p=(t-cur.s)/(cur.e-cur.s);
  if(cur.flash){
    // フラッシュ中も直前の絵を保持(黒を経由しない)
    const pv=prevVisual(idx);
    if(pv){ bg.style.backgroundImage='url('+bgUrl(pv,1)+')'; bg.style.opacity=1; bg.style.transform=mo(pv.mo||'still',1); if(pv.dark) dark.style.opacity=0.88; }
    flash.style.opacity=Math.sin(clamp(p,0,1)*Math.PI); return;
  }
  if(cur.logo){
    logo.style.opacity=env(t,cur.s,cur.e,1.4,0);
    logo.style.transform='translate(-50%,-50%) scale('+(0.97+0.03*clamp(p*3,0,1))+')';
    // sagaの一行: タイトルの後に静かに(ネタバレなしの含み)
    logo.querySelector('.saga').style.opacity=clamp((t-87.6)/1.0,0,1)*0.9;
    return;
  }
  const dur=cur.e-cur.s;
  const fin = dur<1.6 ? 0.22 : (dur<2.6?0.34:0.7);
  const fout= dur<1.6 ? 0.18 : (dur<2.6?0.28:0.55);
  // shake(衝撃): 減衰する高周波ジッタ(tベースで決定的)
  let jit='';
  if(cur.shake){ const amp=cur.shake*(1-eOut(clamp(p*1.4,0,1))); jit=' translate('+(Math.sin(t*94)*amp).toFixed(1)+'px,'+(Math.cos(t*81)*amp).toFixed(1)+'px)'; }
  if(cur.bg||cur.clip){
    // ===== 2層クロスフェード: 黒を経由せず前カットから溶ける =====
    const pv=prevVisual(idx);
    const TW=Math.min(dur*0.5, cur.whip?0.12:0.45);
    const inRamp = pv ? clamp((t-cur.s)/TW,0,1) : env(t,cur.s,cur.e,fin,0);  // 先頭カットのみ黒からF.I.
    bg.style.backgroundImage='url('+bgUrl(cur,clamp(p,0,1))+')';
    bg.style.opacity=inRamp;
    bg.style.transform=mo(cur.mo||'still', clamp(p,0,1))+jit;
    if(pv && inRamp<1){
      bg2.style.backgroundImage='url('+bgUrl(pv,1)+')';
      bg2.style.opacity=1;
      bg2.style.transform=mo(pv.mo||'still',1);
    }
    // whip導入: 立ち上がりに横ブラー+わずかな流れ
    if(cur.whip && p<0.22){ const w=1-p/0.22; bg.style.filter='blur('+(7*w).toFixed(1)+'px)'; wp.style.opacity=w*0.5; wp.style.transform='translateX('+(-30+140*(p/0.22))+'%)'; }
    if(cur.dark) dark.style.opacity=0.88;
  }
  if(cur.streak){ stk.style.opacity=Math.sin(clamp(p,0,1)*Math.PI)*cur.streak; stk.style.transform='scale('+(1.0+0.12*p)+') rotate('+(p*6).toFixed(1)+'deg)'; }
  if(cur.pline){ pl.style.opacity=Math.sin(clamp(p,0,1)*Math.PI)*0.95; pl.style.transform='translateX('+(-3+6*p)+'%)'; }
  if(cur.ch){
    // bgパン方向へキャラ逆移動(パララックス)
    const moK=cur.mo||'';
    let px=0;
    if(cur.par){ if(moK.indexOf('sweepL')===0)px=6-12*eIO(p); else if(moK.indexOf('sweepR')===0)px=-6+12*eIO(p); }
    cur.ch.forEach((c,i)=>{
      const im=el(SLOT[c.c]); im.src=A+c.i;
      im.style.left=chPos(c.c); im.style.height=chH(c.c);
      const d=i*0.12;
      const o=env(t,cur.s+d,cur.e,fin+0.25,fout);
      im.style.opacity=o;
      // スライドイン方向(from) + 立ち上がり
      const rise=clamp((t-cur.s-d)/0.55,0,1);
      let sx=0; if(c.from==='l')sx=(1-eOut(rise))*-90; else if(c.from==='r')sx=(1-eOut(rise))*90;
      let yoff=(1-rise)*20;
      const pop = (moK==='punch')?(1.04-0.06*eOut(p)) : (moK==='pushfast')?(1+0.10*p):(moK.indexOf('push')===0)?(1+0.05*p):1;
      // 生きたスプライト: 呼吸(縦微伸縮+微沈み)と微スウェイ(決定的=tベース)
      const br=Math.sin(t*1.9+i*2.1);
      const breathY=1+0.006*br, swayR=0.45*Math.sin(t*0.8+i*1.7);
      yoff += 1.5*Math.max(0,br)*0.6;
      const tf='translateX(-50%) translate('+(sx+px).toFixed(1)+'px,'+yoff.toFixed(1)+'px) rotate('+swayR.toFixed(2)+'deg) scale('+pop.toFixed(3)+') scaleY('+breathY.toFixed(4)+')';
      im.style.transform=tf; im.style.transformOrigin='50% 100%';
      // 表情クロスフェード(同一体・顔差分): to/at で表情が変わる=簡単なアニメ
      if(c.to){

        ov.style.left=chPos(c.c); ov.style.height=chH(c.c);
        ov.style.transform=tf; ov.style.transformOrigin='50% 100%';
        ov.style.opacity=o*clamp((p-(c.at!=null?c.at:0.5))/0.22,0,1);
      }
    });
  }
  if(cur.tx){
    tx.className='tx'+(cur.cls?(' '+cur.cls):'');
    tx.innerHTML=cur.tx;
    const big=(cur.cls||'').indexOf('big')>=0;
    tx.style.opacity=env(t,cur.s+0.2,cur.e,big?0.8:fin+0.3,fout);
    const base= big?0.4:((cur.cls||'').indexOf('small')>=0?0.5:(cur.cls||'').indexOf('quote')>=0?0.42:0.3);
    tx.style.letterSpacing=(base+0.14*(1-clamp((t-cur.s-0.2)/0.9,0,1)))+'em';
    tx.style.transform='translate(-50%,-50%) translateY('+(6*(1-clamp((t-cur.s-0.2)/0.7,0,1))).toFixed(1)+'px)';
  }

  if(cur.cap){
    const cp=el('cap'); cp.className='cap '+(cur.cap.pos||'bl');
    cp.children[0].textContent=cur.cap.en||''; cp.children[1].textContent=cur.cap.jp||'';
    cp.children[1].style.display=cur.cap.jp?'block':'none';

    const r1=clamp((t-cur.s-0.45)/0.5,0,1), r2=clamp((t-cur.s-0.75)/0.5,0,1), r3=clamp((t-cur.s-1.05)/0.5,0,1);
    nc.style.opacity=clamp((cur.e-t)/0.4,0,1);
    nc.children[1].style.opacity=eOut(r1); nc.children[1].style.transform='translateY('+((1-eOut(r1))*12).toFixed(1)+'px)';
    nc.children[2].style.opacity=eOut(r2);
    nc.children[3].style.opacity=eOut(r3); nc.children[3].style.transform='translateY('+((1-eOut(r3))*8).toFixed(1)+'px)';
  }
  // 道筋オーバーレイ(ミニゲームモチーフ): 番号ノードが灯り金の線が描き上がる
  if(cur.mgfx){
    const mg=el('mgfx'), ln=el('mgline'), nds=el('mgnodes');
    const pp=clamp((p-0.08)/0.8,0,1);
    mg.style.opacity=Math.min(0.9, env(t,cur.s+0.2,cur.e,0.5,0.35));
    let len=1400; try{ len=ln.getTotalLength()||1400; }catch(e){}
    ln.style.strokeDasharray=len; ln.style.strokeDashoffset=len*(1-eIO(pp));
    [...nds.children].forEach((nd,k)=>{ const ni=Math.floor(k/2); nd.style.opacity=clamp((pp-(ni/4-0.06))/0.1,0,1); });
  }
  // 空を青く(surface/town cut)
  if(cur.sky){
    const r=env(t,cur.s+0.2,cur.e,0.7,0.5);
    el('skyblue').style.opacity=((cur.sky==='full'?0.6:0.44)*r).toFixed(3);
    el('skyblue2').style.opacity=(0.5*r).toFixed(3);
  }
  // 管理者の球体: 光りながら漂う(surfaceで大きく、地下では遠い監視光)
  {
    const ob=el('orb'); let show=0,x=70,y=14,sc=1;
    if(cur.sky){ show=env(t,cur.s+0.3,cur.e,0.8,0.5); x=66+9*Math.sin(t*0.5); y=13+4*Math.cos(t*0.42); sc=1.0; }
    else if(cur.orbfar){ show=env(t,cur.s+0.3,cur.e,0.6,0.4)*0.55; x=cur.orbfar[0]+3*Math.sin(t*0.7); y=cur.orbfar[1]; sc=0.42; }
    if(show>0){ const pulse=1+0.07*Math.sin(t*2.3); ob.style.opacity=show.toFixed(3);
      ob.style.left=x.toFixed(1)+'%'; ob.style.top=y.toFixed(1)+'%';
      ob.style.transform='translate(-50%,-50%) scale('+(sc*pulse).toFixed(3)+')'; }
  }
  // サビの光芒(神々しい放射)
  if(cur.godray){ el('godray').style.opacity=(Math.sin(clamp(p,0,1)*Math.PI)*0.5).toFixed(3); el('godray').style.transform='rotate('+(p*9).toFixed(1)+'deg)'; }
  // 末尾サムネ挿入(ポスターで締める+最後にフェードアウト)
  if(cur.thumbfx){
    el('thumb').style.opacity=clamp((t-cur.s)/1.0,0,1).toFixed(3);
    el('fadeout').style.opacity=clamp((t-90.6)/1.4,0,1);
    return;
  }
  // 5層ストラータHUD: 現在層が金に灯る(世界の全体感)
  if(cur.strata){
    const st=el('strata'); st.style.opacity=env(t,cur.s+0.3,cur.e,0.5,0.35);
    const v=cur.strata[0]+(cur.strata[1]-cur.strata[0])*clamp(p,0,1);
    const on=Math.round(v);
    for(let k=0;k<5;k++) st.children[k].className='slab'+((k+1)===on?' on':'');
  }
  // 観測ブラケット(saga: 誰かが見ている)
  if(cur.obsv){
    const ob=el('obsv'); ob.style.opacity=env(t,cur.s+0.4,cur.e,0.6,0.4)*0.85;
    ob.children[4].style.opacity=0.4+0.6*(Math.sin(t*5.2)>0?1:0.15);
  }
  // 断章カード: 探索で見つかるロアの気配(ふわりと浮かぶ)
  if(cur.fragfx){
    const fg=el('frag');
    fg.style.opacity=env(t,cur.s+0.5,cur.e,0.9,0.4)*0.94;
    fg.style.transform='translateY('+(-4*Math.sin(t*1.1)).toFixed(1)+'px)';
    fg.style.boxShadow='0 0 '+(22+8*Math.sin(t*2.3)).toFixed(0)+'px rgba(201,162,74,.3)';
  }
  // 時限の決断UI: 選択肢+減っていくタイマー
  if(cur.choicefx){
    const cu2=el('choiceui');
    cu2.style.opacity=env(t,cur.s+0.15,cur.e,0.3,0.25)*0.95;
    const rem=1-clamp(p*1.15,0,1);
    el('ctbar').style.width=(210*rem).toFixed(0)+'px';
    el('cb1').className='cbtn'+(p>0.55?' sel':'');   // 終盤「進む」が選ばれる
  }
  // 電子錠ハッキングUI: セルが順に点灯し解錠へ
  if(cur.hackfx){
    const hk=el('hack');
    hk.style.opacity=env(t,cur.s+0.15,cur.e,0.3,0.25)*0.95;
    const lit=Math.floor(clamp(p*1.1,0,1)*16);
    const cells=el('hgrid').children;
    for(let k=0;k<16;k++) cells[k].className='hc'+(k<lit?' on':'');
    el('hbar').style.width=(88*clamp(p*1.1,0,1)).toFixed(0)+'px';
  }
  // 3本に分かれる金の道筋(3エンディングの気配)
  if(cur.routesfx){
    const r3=el('routes3');
    r3.style.opacity=env(t,cur.s+0.3,cur.e,0.8,0.4)*0.85;
    ['r3a','r3b','r3c'].forEach((id,k)=>{
      const pa=el(id); let len=900;
      try{ len=pa.getTotalLength()||900; }catch(e){}
      const pp=clamp((p-0.08-k*0.06)/0.7,0,1);
      pa.style.strokeDasharray=len; pa.style.strokeDashoffset=len*(1-eIO(pp));
    });
  }
  // 方位コンパス帯(360°見回しの気配): アークの回転に同期して流れる
  if(cur.compassfx){
    const cp2=el('compass');
    cp2.style.opacity=env(t,cur.s+0.3,cur.e,0.5,0.35)*0.85;
    el('cstrip').style.transform='translateX('+(-40-p*420).toFixed(0)+'px)';
  }
  // ミニマップオーバーレイ(本編UIモチーフ): 経路が灯りGATEへ
  if(cur.mapfx){
    const mp=el('mapfx'), rt=el('mroute'), pos=el('mpos'), gl=el('mgoal');
    const seg=Array.isArray(cur.mapfx)?cur.mapfx:[0,1];
    const pp=clamp(seg[0]+(seg[1]-seg[0])*p,0,1);
    mp.style.opacity=env(t,cur.s+0.25,cur.e,0.45,0.3);
    let len=260; try{ len=rt.getTotalLength()||260; }catch(e){}
    rt.style.strokeDasharray=len; rt.style.strokeDashoffset=len*(1-pp);
    try{ const pt=rt.getPointAtLength(len*pp); pos.setAttribute('cx',pt.x); pos.setAttribute('cy',pt.y); }catch(e){}
    pos.style.opacity=0.6+0.4*Math.sin(t*7);
    gl.style.opacity=0.55+0.45*Math.sin(t*4);
  }
}
window.__setTime=setTime;

/* ===== 全背景(3Dクリップ連番/静止/立ち絵)をプリロード ===== */
/* キャプチャは setTime 直後にスクショするため、未デコードのクリップフレームだと黒落ちする。 */
window.__ready=false;
(function preload(){
  const urls=new Set();
  for(const k in CLIP){ const c=CLIP[k]; for(let i=0;i<c.n;i++) urls.add(A+c.dir+'f'+String(i).padStart(4,'0')+'.jpg'); }
  for(const c of C){ if(c.bg) urls.add(A+c.bg); if(c.ch) c.ch.forEach(x=>{ urls.add(A+x.i); if(x.to) urls.add(A+x.to); }); }
  const list=[...urls]; let left=list.length;
  if(!left){ window.__ready=true; return; }
  const done=()=>{ if(--left<=0) window.__ready=true; };
  list.forEach(u=>{ const im=new Image(); im.onload=done; im.onerror=done; im.src=u; });
})();

setTime(0);
</script>
</body></html>
