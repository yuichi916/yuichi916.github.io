name: ひとり歓迎マップへの情報提供
description: 施設が「ひとり向き」かどうかの実地情報を送る
title: "[ひとり歓迎マップ] "
labels: ["hitori-submission"]
body:
  - type: markdown
    attributes:
      value: |
        マップの「この県の情報を送る」から来た場合、施設IDは施設一覧のリンクから確認できます。
        いただいた情報は出典として公開されます。
  - type: input
    id: facility
    attributes:
      label: 施設ID
      description: n / w / r で始まるID（例 n1234567890）
      placeholder: n1234567890
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: この施設はひとり向きですか
      options:
        - ひとり向き（黙浴・カウンターなど）
        - ひとり向きではなかった
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: 根拠
      description: 見たままを書いてください（掲示、席の形、実際の様子など）
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 補足
    validations:
      required: false
