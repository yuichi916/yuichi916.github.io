<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一筆花火2 を Playgama で遊ぶ</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2;url=https://playgama.ai/play/ujk6ffo2csbdnq">
<link rel="canonical" href="https://playgama.ai/play/ujk6ffo2csbdnq">
<style>
  :root { --bg: #14102a; --ink: #f6ecd6; --link: #ffd46e; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 18px/1.7 "Hiragino Mincho ProN", "Yu Mincho", serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <p>一筆花火2 へ移動しています…</p>
  <p><a id="go" href="https://playgama.ai/play/ujk6ffo2csbdnq">移動しない場合はこちら（Playgama・無料）</a></p>
  <p><small><a href="https://yuichi916.github.io/hanabi/">公式サイトで遊ぶ</a></small></p>
</main>
<script>
  // 動画などから来た数を数えてから Playgama へ（数えられなくても 0.6 秒で移る）
  (function () {
    var to = 'https://playgama.ai/play/ujk6ffo2csbdnq';
    var go = function () { location.replace(to); };
    window.goatcounter = { no_onload: true };
    var s = document.createElement('script');
    s.async = true; s.src = '//gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://viewsengineer.goatcounter.com/count');
    s.onload = function () {
      try {
        var ref = new URLSearchParams(location.search).get('ref') || 'direct';
        window.goatcounter.count({ path: 'pg/' + ref, title: 'to playgama', event: true });
      } catch (e) { /* 数えられなくても移る */ }
      setTimeout(go, 250);
    };
    s.onerror = go;
    document.head.appendChild(s);
    setTimeout(go, 600);
  })();
</script>
</body>
</html>
