  </div>

<script>
/* アプリは #app の中身を差し替えず兄弟要素を足す。
   読み込み中のブロックを残すと見出しが二重になるので、描画されたら外す。 */
(function(){
  var app = document.getElementById('app');
  function drop(){
    var boot = document.getElementById('boot');
    if (boot && app.children.length > 1) { boot.remove(); return true; }
    return false;
  }
  if (drop()) return;
  new MutationObserver(function(_, ob){ if (drop()) ob.disconnect(); })
    .observe(app, {childList:true});
})();
</script>
