<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分数の割り算を、テープで確かめる</title>
<style>
:root{
  --ink:#2a2926; --paper:#f7f3e6; --sheet:#fffdf6; --grid:#e9e2cd; --line:#cdc4ab;
  --tape0:#f8ebb8; --tapeA:#f3d36c; --tapeB:#e6b84a; --tapeEdge:#8c6e1d;
  --red:#cf4127; --blue:#2c6aa8; --green:#2f8463; --pencil:#77726a;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:17px; line-height:1.75; line-break:strict; word-break:auto-phrase;
}
main{max-width:900px; margin:0 auto; padding:22px 16px 90px}
h1{font-size:26px; margin:.4em 0 .1em; letter-spacing:.02em}
header p{margin:0; color:var(--pencil)}
section{background:var(--sheet); border:1px solid var(--line); border-top:4px solid var(--ink); margin-top:34px; padding:14px 20px 22px}
h2{font-size:21px; margin:.2em 0 .5em; display:flex; align-items:baseline; gap:.5em}
h2 b{font-size:34px; color:var(--red); font-family:Georgia,"Times New Roman",serif; line-height:1}
h3{font-size:16px; margin:1.5em 0 .3em; padding-left:.5em; border-left:5px solid var(--ink)}
p{margin:.45em 0}
.lab{display:inline-block; font-size:13.5px; font-weight:700; letter-spacing:.08em; padding:0 .7em; border:1.5px solid; margin:.6em 0 .2em}
.lab.y{color:var(--red)} .lab.t{color:var(--blue)}
.toi{font-size:19px; font-weight:700}
button{
  font:inherit; color:var(--ink); background:#fff; border:1.5px solid var(--ink); border-bottom-width:3px;
  padding:.25em .9em; margin:.2em .35em .2em 0; cursor:pointer;
}
button:hover{background:#fff6c9}
button:active{transform:translateY(1px); border-bottom-width:2px}
button.on{background:#ffe680}
button.sub{border-color:var(--pencil); color:#55514a; font-size:15px}
input[type=number]{font:inherit; font-size:22px; width:5.2em; padding:.1em .4em; border:1.5px solid var(--ink); background:#fff}
input[type=range]{width:100%; accent-color:var(--ink); margin:0}
.ctrl{display:grid; grid-template-columns:auto 4.2em minmax(120px,1fr); gap:.15em 1em; align-items:center; max-width:560px; margin:.5em 0 .7em}
.ctrl .v{font-weight:700; font-size:19px; text-align:right; white-space:nowrap}
.two{display:grid; grid-template-columns:1fr 1fr; gap:0 28px}
.two .ctrl{grid-template-columns:auto 2.2em minmax(90px,1fr); margin-top:.1em}
.two .cap{font-weight:700; margin:.3em 0 0}
svg{display:block; width:100%; height:auto; margin:.3em 0}
svg text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif; fill:var(--ink)}
.yomi p{margin:.15em 0}
.yomi b{font-size:1.3em}
.memo{color:var(--pencil); font-size:15px; border-top:1px dashed var(--line); margin-top:.7em; padding-top:.4em}
.ao{color:var(--blue)} .mi{color:var(--green)} .aka{color:var(--red)}
.hakari{display:grid; grid-template-columns:1fr 1fr; gap:10px 26px}
.hakari > div{border-top:3px solid; padding-top:.2em}
.hakari .a{border-color:var(--blue)} .hakari .b{border-color:var(--green)}
.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; font-size:.8em; line-height:1.18; margin:0 .14em}
.fr i{font-style:normal; padding:0 .22em}
.fr i:first-child{border-bottom:1.5px solid currentColor}
.to{font-size:.8em; margin:0 .1em}
.shiki{font-size:27px; font-weight:700; margin:.5em 0 .2em}
#s3-cands button{font-size:20px; padding:.3em .9em; min-width:6.4em}
table{border-collapse:collapse; margin:.5em 0}
td{padding:.25em .9em .25em 0; border-bottom:1px solid var(--line); font-size:18px; vertical-align:middle}
td.who{font-size:13.5px; color:var(--red); font-weight:700; white-space:nowrap}
td.k{font-size:15px; font-weight:700; white-space:nowrap}
@media (max-width:640px){
  body{font-size:16px}
  section{padding:12px 13px 18px}
  .two,.hakari{grid-template-columns:1fr}
  .toi{font-size:17.5px}
}
</style>
</head>
<body>
<main>
<header>
  <h1>分数の割り算を、テープで確かめる</h1>
  <p>どの問いも、先に予想を決める。それから動かす。</p>
</header>

<section id="s1">
  <h2><b>1</b>ひとことで言うと</h2>
  <div id="s1-yosou">
    <p class="lab y">まず予想する</p>
    <p class="toi" id="s1-toi"></p>
    <p><input type="number" id="s1-in" min="0" step="1" inputmode="numeric"> 本　<button id="s1-go">予想を決めた</button></p>
  </div>
  <div id="s1-main" hidden>
    <p class="lab t">動かして確かめる</p>
    <div class="ctrl">
      <span>テープの長さ</span><span class="v" id="s1-Ao"></span><input type="range" id="s1-A" min="1" max="4" step="1">
      <span>1本の長さ</span><span class="v" id="s1-no"></span><input type="range" id="s1-n" min="2" max="10" step="1">
    </div>
    <button id="s1-cut">1本ずつ切る</button>
    <svg id="s1-svg"></svg>
    <div class="yomi" id="s1-out"></div>
    <p class="memo" id="s1-memo"></p>
    <button class="sub" id="s1-again">別の数字で、もう一度予想する</button>
  </div>
</section>

<section id="s2">
  <h2><b>2</b>いちばんつまずきやすい所</h2>
  <div id="s2-yosou">
    <p class="lab y">まず予想する</p>
    <p class="toi" id="s2-toi"></p>
    <p><button data-v="よい">よい</button><button data-v="だめ">だめ</button></p>
  </div>
  <div id="s2-main" hidden>
    <p class="lab t">動かして確かめる</p>
    <div class="ctrl">
      <span>テープの長さ</span><span class="v" id="s2-Ao"></span><input type="range" id="s2-A" min="1" max="4" step="1">
      <span>1本の長さ　分子</span><span class="v" id="s2-mo"></span><input type="range" id="s2-m" min="1" max="9" step="1">
      <span>1本の長さ　分母</span><span class="v" id="s2-no"></span><input type="range" id="s2-n" min="2" max="8" step="1">
    </div>

    <h3>切り取る</h3>
    <button id="s2-cut">1本ずつ切り取る</button>
    <svg id="s2-svg1"></svg>
    <div class="yomi" id="s2-out1"></div>

    <h3>残りを、どのものさしではかるか</h3>
    <div class="hakari">
      <div class="a"><svg id="s2-svgA"></svg><div class="yomi ao" id="s2-outA"></div></div>
      <div class="b"><svg id="s2-svgB"></svg><div class="yomi mi" id="s2-outB"></div></div>
    </div>

    <h3>それぞれの答えの本数ぶん、つなぎ直す</h3>
    <button id="s2-join">つなぎ直す</button>
    <svg id="s2-svg3"></svg>
    <div class="yomi" id="s2-out3"></div>

    <p class="memo" id="s2-memo"></p>
    <button class="sub" id="s2-again">別の数字で、もう一度予想する</button>
  </div>
</section>

<section id="s3">
  <h2><b>3</b>どんなときに、まちがえやすいか</h2>
  <div id="s3-presets"></div>
  <div class="two">
    <div>
      <p class="cap">割られる数　<span id="s3-Ao"></span></p>
      <div class="ctrl">
        <span>整数</span><span class="v" id="s3-wo"></span><input type="range" id="s3-w" min="0" max="6" step="1">
        <span>分子</span><span class="v" id="s3-po"></span><input type="range" id="s3-p" min="0" max="7" step="1">
        <span>分母</span><span class="v" id="s3-do"></span><input type="range" id="s3-d" min="1" max="8" step="1">
      </div>
    </div>
    <div>
      <p class="cap">割る数　<span id="s3-Bo"></span></p>
      <div class="ctrl">
        <span>分子</span><span class="v" id="s3-mo"></span><input type="range" id="s3-m" min="1" max="9" step="1">
        <span>分母</span><span class="v" id="s3-no"></span><input type="range" id="s3-n" min="1" max="8" step="1">
      </div>
    </div>
  </div>
  <p class="shiki" id="s3-shiki"></p>
  <div id="s3-yosou">
    <p class="lab y">まず予想する</p>
    <p class="toi">掛け算に直すなら、どれを書く？</p>
    <div id="s3-cands"></div>
  </div>
  <div id="s3-main" hidden>
    <p class="lab t">絵で確かめる</p>
    <svg id="s3-svg"></svg>
    <div class="yomi" id="s3-out"></div>
    <table id="s3-table"></table>
    <div class="yomi" id="s3-dai"></div>
    <button class="sub" id="s3-again">かくして、選び直す</button>
  </div>
  <p class="memo" id="s3-rec"></p>
</section>
</main>

<script>
'use strict';

/* ---------- 分数の計算 ---------- */
function $(id){ return document.getElementById(id); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
function F(n,d){ const g=gcd(n,d); return {n:n/g, d:d/g}; }
function mul(a,b){ return F(a.n*b.n, a.d*b.d); }
function add(a,b){ return F(a.n*b.d+b.n*a.d, a.d*b.d); }
function sub(a,b){ return F(a.n*b.d-b.n*a.d, a.d*b.d); }
function cmp(a,b){ return a.n*b.d-b.n*a.d; }
function val(a){ return a.n/a.d; }
function absF(a){ return {n:Math.abs(a.n), d:a.d}; }

/* ---------- 分数の書き方（画面用・絵の中用） ---------- */
function frH(n,d){ return d===1 ? String(n) : '<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>'; }
function fH(f){ return frH(f.n,f.d); }
function mixH(f){
  const w=Math.floor(f.n/f.d), r=f.n-w*f.d;
  if(r===0) return String(w);
  if(w===0) return frH(r,f.d);
  return w+'<span class="to">と</span>'+frH(r,f.d);
}
function frT(n,d){ return d===1 ? String(n) : n+'/'+d; }
function fT(f){ return frT(f.n,f.d); }
function mixT(f){
  const w=Math.floor(f.n/f.d), r=f.n-w*f.d;
  if(r===0) return String(w);
  if(w===0) return frT(r,f.d);
  return w+' と '+frT(r,f.d);
}
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }

/* ---------- 絵の部品 ---------- */
let W=840;
const X0=24, MAXM=4;
function useW(id){ const cw=$(id).clientWidth; W = cw>0 ? Math.max(320,Math.min(840,Math.round(cw))) : 840; }
function setSvg(id,h,inner,w){ const e=$(id); e.setAttribute('viewBox','0 0 '+(w||W)+' '+h); e.innerHTML=inner; }
function rect(x,y,w,h,fill,stroke,sw,extra){
  return '<rect x="'+x.toFixed(2)+'" y="'+y+'" width="'+Math.max(0,w).toFixed(2)+'" height="'+h+'" fill="'+fill+'" stroke="'+(stroke||'none')+'" stroke-width="'+(sw||0)+'" '+(extra||'')+'/>';
}
function line(x1,y1,x2,y2,stroke,sw,extra){
  return '<line x1="'+x1.toFixed(2)+'" y1="'+y1+'" x2="'+x2.toFixed(2)+'" y2="'+y2+'" stroke="'+stroke+'" stroke-width="'+sw+'" '+(extra||'')+'/>';
}
function text(x,y,s,size,anchor,fill,weight){
  return '<text x="'+x.toFixed(2)+'" y="'+y+'" font-size="'+size+'" text-anchor="'+(anchor||'middle')+'"'+(fill?' style="fill:'+fill+'"':'')+(weight?' font-weight="'+weight+'"':'')+'>'+s+'</text>';
}
function hatch(id,color){
  return '<defs><pattern id="'+id+'" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    +'<rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="'+color+'" stroke-width="3.4"/></pattern></defs>';
}
function metres(x0,s,upto,y1,y2,ty){
  let g='';
  for(let j=0;j<=upto;j++){
    g+=line(x0+j*s,y1,x0+j*s,y2,'#2a2926',1.6);
    if(s>=40 || j===0 || j===upto) g+=text(x0+j*s,ty,j===0?'0':j+' m',14);
  }
  return g;
}
const C={tape0:'#f8ebb8', tapeA:'#f3d36c', tapeB:'#e6b84a', edge:'#8c6e1d', red:'#cf4127', blue:'#2c6aa8', green:'#2f8463', ink:'#2a2926', pencil:'#77726a'};

/* ================= 1 ================= */
const S1={A:2, n:4, shown:Infinity, guess:null, timer:0};

function s1Toi(){
  $('s1-toi').innerHTML=S1.A+' m のテープを、'+frH(1,S1.n)+' m ずつに切る。何本できる？';
}
function s1Draw(){
  const A=S1.A, n=S1.n, N=A*n, c=Math.min(S1.shown,N);
  useW('s1-svg');
  const s=(W-2*X0)/MAXM, w=s/n, y=52, h=50;
  let g='';
  g+=rect(X0+c*w,y,(N-c)*w,h,C.tape0,C.edge,1.2);
  for(let i=0;i<c;i++){
    const x=X0+i*w;
    g+=rect(x+0.8,y+12,w-1.6,h,i%2?C.tapeB:C.tapeA,C.edge,1);
    if(w>=15) g+=text(x+w/2,y+12+h/2+5,String(i+1),w>=24?14:11);
  }
  g+=metres(X0,s,A,y-10,y+h+22,y+h+42);
  const inOne=Math.min(c,n);
  g+='<path d="M'+X0+' 34 v-9 h'+s.toFixed(2)+' v9" fill="none" stroke="'+C.red+'" stroke-width="1.8"/>';
  if(s>=130) g+=text(X0+s/2,18,'1 m の中に '+inOne+' 本',15,'middle',C.red,700);
  else g+=text(X0,18,'1 m の中に '+inOne+' 本',15,'start',C.red,700);
  setSvg('s1-svg',150,g);

  $('s1-Ao').textContent=A+' m';
  $('s1-no').innerHTML=frH(1,n)+' m';
  let o='<p>数えた本数　<b>'+c+'</b> 本</p>';
  if(c===N){
    o+='<p>1 m から '+n+' 本。'+A+' m だから　<b>'+n+' × '+A+' = '+(n*A)+'</b> 本</p>';
    o+='<p>'+A+' ÷ '+frH(1,n)+' = <b>'+(A*n)+'</b></p>';
  }
  $('s1-out').innerHTML=o;
  const gu=S1.guess;
  $('s1-memo').innerHTML=gu ? 'あなたの予想　'+gu.A+' ÷ '+frH(1,gu.n)+' は　'+gu.v+' 本' : '';
}
function s1Anim(){
  clearInterval(S1.timer);
  const N=S1.A*S1.n;
  S1.shown=0; s1Draw();
  S1.timer=setInterval(function(){
    S1.shown++; s1Draw();
    if(S1.shown>=N){ clearInterval(S1.timer); S1.shown=Infinity; }
  }, Math.max(45,Math.min(260,3200/N)));
}
function s1Init(){
  $('s1-A').value=S1.A; $('s1-n').value=S1.n;
  s1Toi(); s1Draw();
  $('s1-go').onclick=function(){
    const v=$('s1-in').value.trim();
    if(v===''){ $('s1-in').focus(); return; }
    S1.guess={A:S1.A, n:S1.n, v:v};
    $('s1-yosou').hidden=true; $('s1-main').hidden=false;
    s1Anim();
  };
  $('s1-in').onkeydown=function(e){ if(e.key==='Enter') $('s1-go').click(); };
  $('s1-A').oninput=$('s1-n').oninput=function(){
    clearInterval(S1.timer);
    S1.A=+$('s1-A').value; S1.n=+$('s1-n').value; S1.shown=Infinity; s1Draw();
  };
  $('s1-cut').onclick=s1Anim;
  $('s1-again').onclick=function(){
    clearInterval(S1.timer);
    let A,n;
    do{ A=rnd(1,MAXM); n=rnd(2,10); }while(A===S1.A && n===S1.n);
    S1.A=A; S1.n=n; S1.shown=Infinity;
    $('s1-A').value=A; $('s1-n').value=n; $('s1-in').value='';
    s1Toi(); s1Draw();
    $('s1-main').hidden=true; $('s1-yosou').hidden=false;
  };
}

/* ================= 2 ================= */
const S2={A:2, m:3, n:4, shown:Infinity, prog:1, guess:null, timer:0, raf:0};

function s2Calc(A,m,n){
  const T=A*n, q=Math.floor(T/m), k=T-q*m;
  const B=F(m,n), r=F(k,n);
  const ansM=add(F(q,1),r);
  const ansP=add(F(q,1),F(k,m));
  return {T:T, q:q, k:k, B:B, r:r, ansM:ansM, ansP:ansP, lenM:mul(ansM,B), lenP:mul(ansP,B)};
}
function s2Scale(c){ return (W-2*X0)/Math.max(MAXM, val(c.lenM), val(c.B), S2.A); }

function s2Toi(){
  const c=s2Calc(S2.A,S2.m,S2.n);
  $('s2-toi').innerHTML=S2.A+' m のテープから '+frH(S2.m,S2.n)+' m ずつ切り取ると、'+c.q+' 本取れて '+fH(c.r)+' m 残る。<br>'
    +S2.A+' ÷ '+frH(S2.m,S2.n)+' の答えは「'+c.q+' と '+fH(c.r)+'」で、よい？';
}
function s2DrawCut(c){
  useW('s2-svg1');
  const A=S2.A, m=S2.m, n=S2.n, s=s2Scale(c), w=s/n, y=40, h=52;
  const stage=Math.min(S2.shown,c.q+1), np=Math.min(stage,c.q), rem=stage>=c.q+1;
  let g=hatch('s2h',C.red);
  g+=rect(X0,y,A*s,h,C.tape0,'none',0);
  for(let i=0;i<np;i++){
    const x=X0+i*m*w;
    g+=rect(x,y,m*w,h,i%2?C.tapeB:C.tapeA,'none',0);
    if(m*w>=46) g+=text(x+m*w/2,y-9,(i+1)+'本目',14);
    else if(m*w>=13) g+=text(x+m*w/2,y-9,String(i+1),12);
  }
  if(rem && c.k>0){
    const x=X0+c.q*m*w;
    g+=rect(x,y,c.k*w,h,'url(#s2h)','none',0);
    g+=text(x+c.k*w/2,y-9,'残り',14,'middle',C.red,700);
  }
  for(let i=1;i<c.T;i++) g+=line(X0+i*w,y,X0+i*w,y+h,C.edge,0.7,'stroke-dasharray="3 3"');
  if(w>=15){
    for(let i=0;i<c.T;i++){
      g+='<text x="'+(X0+i*w+w/2).toFixed(2)+'" y="'+(y+h/2+4)+'" font-size="'+(w>=22?12:10)+'" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" style="fill:#5a564e">'+(i+1)+'</text>';
    }
  }
  for(let i=1;i<=np;i++) g+=line(X0+i*m*w,y-5,X0+i*m*w,y+h+5,C.ink,2.6);
  g+=rect(X0,y,A*s,h,'none',C.edge,1.4);
  g+=metres(X0,s,A,y+h,y+h+14,y+h+32);
  setSvg('s2-svg1',136,g);

  let o='<p>目もりは　'+A+' × '+n+' = <b>'+c.T+'</b> 個。　1本は <b>'+m+'</b> 目もり</p>';
  if(rem) o+='<p>'+c.T+' ÷ '+m+' = <b>'+c.q+'</b> あまり <b>'+c.k+'</b>　→　'+c.q+' 本取れて、'+c.k+' 目もり（'+fH(c.r)+' m）残る</p>';
  $('s2-out1').innerHTML=o;
}
function s2DrawRuler(id,cells,k,per,sc,color,title,groups){
  const w=sc*per, x0=20, y=34, h=40;
  let g=hatch(id+'h',C.red);
  g+=rect(x0,y,cells*w,h,'#fff',color,2.4);
  if(k>0) g+=rect(x0,y,Math.min(k,cells)*w,h,'url(#'+id+'h)','none',0);
  for(let i=1;i<cells;i++){
    const thick=groups && i%groups===0;
    g+=line(x0+i*w,y,x0+i*w,y+h,color,thick?2.4:1);
  }
  g+=rect(x0,y,cells*w,h,'none',color,2.4);
  g+=text(x0,22,title,14,'start',color,700);
  if(w>=13){ for(let i=0;i<cells;i++) g+=text(x0+i*w+w/2,y+h+16,String(i+1),11,'middle',C.pencil); }
  setSvg(id,98,g,400);
}
function s2DrawRulers(c){
  const m=S2.m, n=S2.n;
  const mspan=Math.max(1,Math.ceil(c.k/n));
  const sc=356/Math.max(mspan,val(c.B));
  s2DrawRuler('s2-svgA',n*mspan,c.k,1/n,sc,C.blue,'1 m のものさし',n);
  s2DrawRuler('s2-svgB',m,c.k,1/n,sc,C.green,'1本ぶん（'+frT(m,n)+' m）のものさし',0);
  $('s2-outA').innerHTML='<p>1 m は '+n+' 目もり。残りは '+c.k+' 目もり　→　'+frH(c.k,n)+'</p>'
    +'<p>この数え方の答え　<b>'+mixH(c.ansM)+'</b></p>';
  $('s2-outB').innerHTML='<p>1本は '+m+' 目もり。残りは '+c.k+' 目もり　→　'+frH(c.k,m)+'</p>'
    +'<p>この数え方の答え　<b>'+mixH(c.ansP)+'</b></p>';
}
function s2Row(c,s,y,frac,color,pale,label){
  const A=S2.A, bw=val(c.B)*s, h=34;
  let g='';
  for(let i=0;i<c.q;i++) g+=rect(X0+i*bw,y,bw,h,i%2?C.tapeB:C.tapeA,C.ink,1.3);
  const pw=val(frac)*bw;
  if(pw>0) g+=rect(X0+c.q*bw,y,pw,h,pale,color,2);
  return {g:g, len:c.q*bw+pw, label:label};
}
function s2DrawJoin(c){
  useW('s2-svg3');
  const A=S2.A, s=s2Scale(c), h=34, yA=70, yB=180;
  const axis=Math.max(A,val(c.lenM),val(c.lenP))*s;
  const small=W<520, fs=small?12.5:14.5, sep=small?' ＝ ':'　＝　';
  const rows=[
    {y:yA, frac:c.r, color:C.blue, pale:'#cfe0f1', len:c.lenM, ans:c.ansM, t:'青い答え '+mixT(c.ansM)+' 本ぶん'+sep+c.q+' 本 ＋ 1本の '+fT(c.r)},
    {y:yB, frac:F(c.k,S2.m), color:C.green, pale:'#cfe8dc', len:c.lenP, ans:c.ansP, t:'緑の答え '+mixT(c.ansP)+' 本ぶん'+sep+c.q+' 本 ＋ 1本の '+fT(F(c.k,S2.m))}
  ];
  let g=hatch('s2j',C.red);
  g+='<clipPath id="s2clip"><rect x="0" y="0" width="'+(X0+S2.prog*axis+1).toFixed(2)+'" height="260"/></clipPath>';
  g+=rect(X0,8,34,14,'none',C.ink,1.6,'stroke-dasharray="6 5"');
  g+=text(X0+44,20,'点線 ＝ もとの '+A+' m',13.5,'start',C.pencil);
  let body='', over='';
  rows.forEach(function(r){
    g+=text(X0,r.y-14,r.t,fs,'start',r.color,700);
    const made=s2Row(c,s,r.y,r.frac,r.color,r.pale);
    body+=made.g;
    const d=cmp(r.len,F(A,1));
    if(S2.prog>=1 && d!==0){
      const xa=X0+A*s, xb=X0+val(r.len)*s;
      const l=Math.min(xa,xb), wd=Math.abs(xa-xb);
      over+=rect(l,r.y,wd,h,'url(#s2j)',C.red,1.2,'fill-opacity="0.8"');
      g+=text(X0,r.y+h+26,fT(absF(sub(r.len,F(A,1))))+' m '+(d<0?'足りない':'はみ出す'),15,'start',C.red,700);
    }
    if(S2.prog>=1 && d===0) g+=text(X0,r.y+h+26,'点線とぴったり同じ',15,'start',r.color,700);
    g+=rect(X0,r.y-6,A*s,h+12,'none',C.ink,1.6,'stroke-dasharray="6 5"');
  });
  g+='<g clip-path="url(#s2clip)">'+body+'</g>';
  g+=over;
  setSvg('s2-svg3',252,g);

  let o='';
  if(S2.prog>=1){
    rows.forEach(function(r,i){
      const d=cmp(r.len,F(A,1));
      const diff=fH(absF(sub(r.len,F(A,1))));
      const tail = d<0 ? 'もとの '+A+' m に '+diff+' m 足りない' : d>0 ? 'もとの '+A+' m から '+diff+' m はみ出す' : 'もとの '+A+' m と同じ';
      o+='<p class="'+(i?'mi':'ao')+'">'+mixH(r.ans)+' 本 × '+frH(S2.m,S2.n)+' m = <b>'+mixH(r.len)+'</b> m　…　'+tail+'</p>';
    });
  }
  $('s2-out3').innerHTML=o;
}
function s2Draw(){
  const c=s2Calc(S2.A,S2.m,S2.n);
  $('s2-Ao').textContent=S2.A+' m';
  $('s2-mo').textContent=S2.m;
  $('s2-no').textContent=S2.n;
  s2DrawCut(c); s2DrawRulers(c); s2DrawJoin(c);
  const gu=S2.guess;
  $('s2-memo').innerHTML=gu ? 'あなたの予想　'+gu.A+' ÷ '+frH(gu.m,gu.n)+' の答えは「'+gu.q+' と '+fH(gu.r)+'」で　'+gu.v : '';
}
function s2Stop(){ clearInterval(S2.timer); cancelAnimationFrame(S2.raf); S2.shown=Infinity; S2.prog=1; }
function s2AnimCut(){
  s2Stop();
  const c=s2Calc(S2.A,S2.m,S2.n), steps=c.q+1;
  S2.shown=0; s2Draw();
  S2.timer=setInterval(function(){
    S2.shown++; s2Draw();
    if(S2.shown>=steps){ clearInterval(S2.timer); S2.shown=Infinity; }
  }, Math.max(70,Math.min(520,3200/steps)));
}
function s2AnimJoin(){
  s2Stop();
  const t0=performance.now(), dur=2200;
  S2.prog=0;
  (function step(now){
    S2.prog=Math.min(1,(now-t0)/dur);
    s2Draw();
    if(S2.prog<1) S2.raf=requestAnimationFrame(step);
  })(t0);
}
function s2Init(){
  $('s2-A').value=S2.A; $('s2-m').value=S2.m; $('s2-n').value=S2.n;
  s2Toi(); s2Draw();
  document.querySelectorAll('#s2-yosou button').forEach(function(b){
    b.onclick=function(){
      const c=s2Calc(S2.A,S2.m,S2.n);
      S2.guess={A:S2.A, m:S2.m, n:S2.n, q:c.q, r:c.r, v:b.dataset.v};
      $('s2-yosou').hidden=true; $('s2-main').hidden=false;
      s2AnimCut();
    };
  });
  $('s2-A').oninput=$('s2-m').oninput=$('s2-n').oninput=function(){
    s2Stop();
    S2.A=+$('s2-A').value; S2.m=+$('s2-m').value; S2.n=+$('s2-n').value;
    s2Draw();
  };
  $('s2-cut').onclick=s2AnimCut;
  $('s2-join').onclick=s2AnimJoin;
  $('s2-again').onclick=function(){
    s2Stop();
    let A,m,n,c;
    do{ n=rnd(3,8); m=rnd(2,n-1); A=rnd(1,MAXM); c=s2Calc(A,m,n); }
    while(c.k===0 || c.q===0 || (A===S2.A && m===S2.m && n===S2.n));
    S2.A=A; S2.m=m; S2.n=n;
    $('s2-A').value=A; $('s2-m').value=m; $('s2-n').value=n;
    s2Toi(); s2Draw();
    $('s2-main').hidden=true; $('s2-yosou').hidden=false;
  };
}

/* ================= 3 ================= */
const PRESETS=[
  {key:'ア', w:0, p:3, d:4, m:2, n:1},
  {key:'イ', w:6, p:0, d:1, m:2, n:3},
  {key:'ウ', w:1, p:1, d:2, m:3, n:4},
  {key:'エ', w:0, p:3, d:4, m:5, n:4}
];
const S3={w:0, p:3, d:4, m:2, n:1, preset:'ア', revealed:false, choice:null, order:[], rec:{}};
const KEYS=['ushiro','mae','ryoho','sonomama','bunsu'];

function dividendH(w,p,d){
  if(p===0) return String(w);
  if(w===0) return frH(p,d);
  return w+'<span class="to">と</span>'+frH(p,d);
}
function s3Calc(){
  const w=S3.w, p=S3.p, d=S3.d, m=S3.m, n=S3.n;
  const a1=p===0?w:w*d+p, a2=p===0?1:d;
  const Q=F(a1*n,a2*m);
  const cands={
    ushiro:{h:frH(a1,a2)+' × '+frH(n,m), v:F(a1*n,a2*m)},
    mae:{h:frH(a2,a1)+' × '+frH(m,n), v:F(a2*m,a1*n)},
    ryoho:{h:frH(a2,a1)+' × '+frH(n,m), v:F(a2*n,a1*m)},
    sonomama:{h:frH(a1,a2)+' × '+frH(m,n), v:F(a1*m,a2*n)}
  };
  if(w>0 && p>0) cands.bunsu={h:w+'<span class="to">と</span>（'+frH(p,d)+' × '+frH(n,m)+'）', v:add(F(w,1),F(p*n,d*m))};
  const list=[], seen={};
  S3.order.forEach(function(k){
    if(cands[k] && !seen[cands[k].h]){ seen[cands[k].h]=1; list.push({key:k, h:cands[k].h, v:cands[k].v}); }
  });
  return {a1:a1, a2:a2, A:F(a1,a2), B:F(m,n), Q:Q, list:list};
}
function s3Shuffle(){
  const a=KEYS.slice();
  for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); const t=a[i]; a[i]=a[j]; a[j]=t; }
  S3.order=a;
}
function s3DrawPic(c){
  const m=S3.m, n=S3.n, Q=c.Q;
  const whole=Math.floor(Q.n/Q.d), fr=F(Q.n-whole*Q.d,Q.d);
  const cnt=Math.max(1, fr.n===0?whole:whole+1);
  const Bv=val(c.B), Av=val(c.A);
  useW('s3-svg');
  const s=(W-2*X0)/Math.max(Av,cnt*Bv), bw=Bv*s;
  const y1=34, h1=30, y2=104, h2=42;
  let g='';
  g+=text(X0,y1-10,'割られる数　'+mixT(c.A),14.5,'start',C.ink,700);
  g+=rect(X0,y1,Av*s,h1,C.tapeA,C.edge,1.4);
  g+=text(X0,y2-10,'割る数 '+frT(m,n)+' を 1本として、ならべる',14.5,'start',C.ink,700);
  g+=rect(X0,y2,Av*s,h2,C.tape0,'none',0);
  if(fr.n>0 && fr.d<=60){
    const cw=bw/fr.d, xs=X0+whole*bw;
    for(let i=1;i<fr.d;i++) g+=line(xs+i*cw,y2,xs+i*cw,y2+h2,C.pencil,0.9,'stroke-dasharray="3 3"');
  }
  for(let i=0;i<cnt;i++){
    g+=rect(X0+i*bw,y2,bw,h2,'none',C.ink,2);
    if(bw>=15) g+=text(X0+i*bw+bw/2,y2+h2+18,(i+1)+(bw>=46?'本目':''),13,'middle',C.pencil);
  }
  g+=line(X0+Av*s,y1,X0+Av*s,y2+h2+6,C.red,1.8,'stroke-dasharray="5 4"');
  setSvg('s3-svg',172,g);

  let o='<p>絵で数えると　';
  if(fr.n===0) o+='<b>'+whole+'</b> 本';
  else if(whole===0) o+='1本の <b>'+fH(fr)+'</b>';
  else o+='<b>'+whole+'</b> 本 と、1本の <b>'+fH(fr)+'</b>　＝　'+fH(Q);
  o+='</p>';
  $('s3-out').innerHTML=o;
}
function s3Draw(){
  const w=S3.w, p=S3.p, d=S3.d, m=S3.m, n=S3.n;
  const c=s3Calc();
  $('s3-wo').textContent=w; $('s3-po').textContent=p; $('s3-do').textContent=d;
  $('s3-mo').textContent=m; $('s3-no').textContent=n;
  $('s3-Ao').innerHTML=dividendH(w,p,d);
  $('s3-Bo').innerHTML=frH(m,n);
  $('s3-shiki').innerHTML=dividendH(w,p,d)+' ÷ '+frH(m,n)+(w>0&&p>0 ? '<span style="font-size:.6em;font-weight:400;color:#77726a">　（'+dividendH(w,p,d)+' = '+frH(c.a1,c.a2)+'）</span>' : '');
  document.querySelectorAll('#s3-presets button').forEach(function(b){ b.classList.toggle('on', b.dataset.k===S3.preset); });

  $('s3-yosou').hidden=S3.revealed; $('s3-main').hidden=!S3.revealed;
  if(!S3.revealed){
    $('s3-cands').innerHTML=c.list.map(function(x){ return '<button data-k="'+x.key+'">'+x.h+'</button>'; }).join('');
    document.querySelectorAll('#s3-cands button').forEach(function(b){
      b.onclick=function(){
        S3.choice=b.dataset.k; S3.revealed=true;
        const now=s3Calc(), mine=now.list.filter(function(x){ return x.key===S3.choice; })[0];
        if(S3.preset && !(S3.preset in S3.rec)) S3.rec[S3.preset]=cmp(mine.v,now.Q)===0;
        s3Draw();
      };
    });
  }else{
    s3DrawPic(c);
    $('s3-table').innerHTML=c.list.map(function(x){
      const same=cmp(x.v,c.Q)===0;
      return '<tr><td class="who">'+(x.key===S3.choice?'あなたの式 →':'')+'</td><td>'+x.h+'</td><td>= '+mixH(x.v)+'</td>'
        +'<td class="k '+(same?'mi':'aka')+'">'+(same?'絵と同じ':'絵とちがう')+'</td></tr>';
    }).join('');
    const one=F(1,1), db=cmp(c.B,one), dq=cmp(c.Q,c.A);
    const sym=function(x){ return x<0?'＜':x>0?'＞':'＝'; };
    $('s3-dai').innerHTML='<p>割る数 '+frH(m,n)+' '+sym(db)+' 1　　→　　答え '+mixH(c.Q)+' '+sym(dq)+' 割られる数 '+mixH(c.A)+'</p>';
  }
  $('s3-rec').innerHTML='最初に選んだ式の記録　'+PRESETS.map(function(P){
    const r=S3.rec[P.key];
    return P.key+'：'+(r===undefined?'まだ':r?'絵と同じ':'絵とちがう');
  }).join('　／　');
}
function s3Read(){
  let w=+$('s3-w').value, p=+$('s3-p').value, d=+$('s3-d').value;
  const m=+$('s3-m').value, n=+$('s3-n').value;
  if(p>d-1) p=Math.max(0,d-1);
  if(w===0 && p===0){ if(d>1) p=1; else w=1; }
  S3.w=w; S3.p=p; S3.d=d; S3.m=m; S3.n=n;
  s3Write();
}
function s3Write(){
  $('s3-p').max=Math.max(0,S3.d-1);
  $('s3-w').value=S3.w; $('s3-p').value=S3.p; $('s3-d').value=S3.d; $('s3-m').value=S3.m; $('s3-n').value=S3.n;
}
function s3Init(){
  $('s3-presets').innerHTML=PRESETS.map(function(P){
    return '<button data-k="'+P.key+'">'+P.key+'　'+dividendH(P.w,P.p,P.d)+' ÷ '+frH(P.m,P.n)+'</button>';
  }).join('');
  document.querySelectorAll('#s3-presets button').forEach(function(b){
    b.onclick=function(){
      const P=PRESETS.filter(function(x){ return x.key===b.dataset.k; })[0];
      S3.w=P.w; S3.p=P.p; S3.d=P.d; S3.m=P.m; S3.n=P.n; S3.preset=P.key;
      S3.revealed=false; S3.choice=null; s3Shuffle(); s3Write(); s3Draw();
    };
  });
  ['w','p','d','m','n'].forEach(function(k){
    $('s3-'+k).oninput=function(){ s3Read(); S3.preset=null; s3Draw(); };
  });
  $('s3-again').onclick=function(){ S3.revealed=false; S3.choice=null; s3Shuffle(); s3Draw(); };
  s3Shuffle(); s3Write(); s3Draw();
}

s1Init(); s2Init(); s3Init();
let rz=0;
window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(function(){ s1Draw(); s2Draw(); if(S3.revealed) s3Draw(); },120); });
</script>
